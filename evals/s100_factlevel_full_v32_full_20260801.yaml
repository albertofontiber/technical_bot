- qid: hp013
  question: ¿Cómo se cambia la batería tampón de la Detnov ADW535 sin perder configuración?
  answer: 'El manual del ADW535 **no describe un procedimiento específico para sustituir
    la batería de litio sin perder configuración**. Los fragmentos disponibles no
    cubren ese procedimiento paso a paso.


    Lo que sí puedo confirmar a partir de los fragmentos:


    **Sobre la batería de litio:**

    - El LMB 35 (Main Board) incluye una **batería de litio** como componente [F6].

    - En la Fig. 31 del manual, la batería de litio aparece identificada como elemento
    del LMB 35 [F5].

    - El manual indica que las baterías deben llevarse a un punto de recogida autorizado
    al final de su vida útil [F9].


    **Sobre la retención de configuración:**

    - El **reset de hardware** (interrupción de tensión de alimentación o pulsación
    del botón reset del LMB 35) **mantiene los parámetros programados** (configuraciones
    específicas del sistema) [F4].

    - Los parámetros se almacenan en **Flash-PROM y EEPROM** del microprocesador del
    LMB 35 [F6], lo que sugiere que son memorias no volátiles, pero el manual no afirma
    explícitamente qué ocurre con la configuración al retirar la batería de litio.


    **Advertencia importante:**

    - El manual indica que si se sustituye el **LMB 35 completo**, es obligatorio
    realizar un nuevo **reset inicial** y reajustar todas las configuraciones específicas
    del cliente [F7].

    - Si durante los trabajos de mantenimiento en el ADW 535 se realizan reparaciones,
    puede ser necesario un nuevo reset inicial [F3].


    **Recomendación:**

    Consulta directamente al soporte técnico de Securiton/Detnov antes de proceder,
    ya que el manual no especifica si la sustitución de la batería de litio aislada
    (sin cambiar el LMB 35) requiere reset inicial posterior o si la configuración
    se conserva íntegramente.


    Fuente: ADW535_TD_T140358es_e (sin revisión registrada)


    ---

    ⚠️ **Información adicional del manual:**

    - "Por ello, cuando se realicen trabajos de mantenimiento en el ADW 535, es imprescindible
    desconectar previamente los controles de incendios y las alertas remotas de los
    sistemas de orden superior (CDI)." [F4]

    - "Para evitar que los controles de incendios, las alertas remotas y las zonas
    de extinción se disparen al llevar a cabo los trabajos de mantenimiento, es **imprescindible**
    bloquearlos o desconectarlos previamente." [F7]'
