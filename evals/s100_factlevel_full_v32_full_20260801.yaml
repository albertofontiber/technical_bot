- qid: hp001
  question: En la Detnov CAD-250, ¿cómo se entra al menú de programación avanzada?
  answer: "Para acceder al menú de programación avanzada de la **CAD-250**, sigue\
    \ estos pasos:\n\n1. Con la central en **PANTALLA DE REPOSO**, toca el icono del\
    \ **candado (\U0001F512)** en la pantalla táctil [F2][F3].\n\n2. Introduce la\
    \ **clave de administrador** (por defecto: **2222**) en el teclado numérico que\
    \ aparece [F2][F3].\n   > ⚠️ Asegúrate de tener autorización y conocimientos necesarios\
    \ para operar a nivel administrador. El uso indebido puede provocar mal funcionamiento\
    \ de la instalación [F2][F3].\n\n3. Una vez en el menú principal de administrador,\
    \ navega a:\n   **AJUSTES** (Menú principal) **> AVANZADO** (Submenú) [F1]\n\n\
    4. Dentro de **AVANZADO** dispones de **3 pestañas** [F1]:\n   - **SISTEMA**:\
    \ configuración de número de cabinas (PANELES: 1 a 4), número de lazos y cabina\
    \ de LEDs de zona.\n   - **OTROS**: interruptores para facilitar tareas de puesta\
    \ en marcha y mantenimiento (tiempo de inactividad, salto a scroll si incidentes,\
    \ timeout, etc.).\n   - **REINICIAR**: devuelve los valores de configuración del\
    \ panel a valores por defecto (no afecta a entidades, lazos, maniobras, grupos,\
    \ módulos virtuales, modos especiales, filtros de red ni registros de eventos)\
    \ [F6].\n\n> ⚠️ **AVISO**: Por razones de seguridad y cumplimiento normativo,\
    \ los interruptores de inactividad, timeout y scroll deben estar activados (en\
    \ verde) por defecto [F7].\n\n---\n\n**Nota sobre niveles de acceso**: El menú\
    \ **AVANZADO** es accesible desde el **Nivel 2 (Nivel de Configuración)**. Con\
    \ código de usuario (Nivel 1) este submenú no está disponible [F4][F5].\n\n---\n\
    \nFuente: CAD-250 Manual de Configuración MC-380-es-2026-c (rev. c, 2026-04-23)"
