- qid: cat011
  question: Necesito un detector de humos analógico direccionable «751» para una instalación
    Notifier; ¿cuál es el modelo correcto?
  answer: 'El sufijo «751» corresponde a varios modelos de Notifier según la tecnología
    de detección que necesites. Los fragmentos disponibles documentan los siguientes:


    ---


    **Detectores ópticos (fotoeléctricos) de humo:**


    - **SDX-751** — Sensor óptico analógico de bajo perfil [F5, F9]

    - **SDX-751E** — Sensor óptico de bajo perfil (variante E) [F6, F10]

    - **SDX-751TEM** — Sensor combinado óptico + térmico fijo (58 °C), analógico direccionable
    [F2, F6, F7]

    - **SDX-751EM** — Sensor óptico analógico direccionable [F1]


    **Detector óptico láser:**


    - **FSL-751E** — Sensor de humo láser VIEW [F6]

    - **LPX-751** — Sensor de humo láser VIEW de bajo perfil [F6]


    **Detectores por ionización:**


    - **CPX-751** — Sensor iónico analógico de bajo perfil [F5, F9]

    - **CPX-751E** — Sensor iónico analógico direccionable (variante E) [F4, F6]


    **Detector multicriterio:**


    - **IRX-751TEM** — Sensor multicriterio SMART 3 [F6]

    - **IRX-751CTEM** — Sensor multicriterio SMART 4 [F6]

    - **IPX-751** — Detector analógico con combinación fotoeléctrico + iónico + térmico
    [F10]


    **Detector óptico para zonas con riesgo de seguridad intrínseca:**


    - **IDX-751** — Sensor óptico analógico intrínsecamente seguro (requiere barrera/traductor
    IMX-1) [F3, F6]


    **Detector óptico para entornos agresivos (HARSH):**


    - **HPX-751E** — Sensor óptico HARSH [F6]


    ---


    **Para elegir el modelo correcto, necesito saber:**


    1. ¿Qué **central Notifier** tienes instalada? (AFP-400, AFP4000, ID50/60, AM-2020,
    etc.) — la compatibilidad varía por central.

    2. ¿Necesitas **solo detección de humo** o también **detección térmica combinada**?

    3. ¿El entorno es **zona ATEX / intrínsecamente segura**, **ambiente agresivo**,
    o **zona diáfana estándar**?


    Con esos datos te indico el modelo exacto y confirmo compatibilidad con tu central.


    Fuente: I56-1306-002_SDX-751EM; I56-1320-001 SDX-751TEM; MNDT1020 (IDX-751, 15
    junio 2004); I56-0790-003_CPX-751E; MIDT230 (AFP4000); MIDT156 (ID50/60); MIDT170
    (AFP-400); MIDT260 (AM-2000); MNDT1025 (FSL-751E) — todos sin revisión registrada.


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "Todos los sensores analógicos de temperatura o humo se montan en una base B501
    para facilitar su instalación y sustitución." (MIDT230, p. 16) [F5]'
