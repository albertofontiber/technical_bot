- qid: hp018
  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  answer: '## Conexionado de sirena convencional en salidas de sirena de la ZXe


    Las sirenas convencionales se conectan a los terminales de sirena de la placa
    base de la ZXe, con **resistencia final de línea (RFL) de 6.800 Ω, 0,5 W mínimo**,
    obligatoria al final del circuito [F11].


    ---


    ### Requisitos previos


    - **Consumo máximo por circuito: 1 A** [F11]. Verifica que el total de sirenas
    conectadas no supera este límite.

    - **Sección mínima de cable: 1,5 mm²** [F2]. Longitudes excesivas provocan caídas
    de tensión.

    - **Longitud máxima recomendada: 1 km** [F1]. Por encima, la capacitancia e inductancia
    pueden afectar al funcionamiento.

    - **No realizar ramales (derivaciones paralelas)**: la supervisión se realiza
    en la línea directa hasta la RFL; los ramales no quedan supervisados [F3].


    ---


    ### Terminales físicos


    - **ZX2e**: terminales etiquetados **A+ A- B+ B-** en el bloque **SOUNDERS** de
    la placa [F4].

    - **ZX5e**: terminales etiquetados **A- A+ B- B+ C- C+ D- D+** en el bloque **TB7**
    de la placa [F4].


    ---


    ### Procedimiento de conexionado


    1. **Sirenas con polaridad**: conecta el **+** de cada sirena al conductor positivo
    de la salida y el **−** al negativo. Cada sirena debe llevar un **diodo integrado**
    para bloquear la corriente inversa de supervisión [F4].


    2. **Campanas/sirenas sin polaridad**: instala un **diodo de polarización** entre
    el terminal **+** de la salida y uno de los terminales de alimentación de la campana,
    para evitar consumo durante la supervisión [F2].


    3. **Resistencia final de línea (RFL)**: instala una resistencia de **6.800 Ω,
    0,5 W mínimo** entre el conductor **+** y el conductor **−** al final de la última
    sirena del circuito [F2] [F11].


    4. **Si no hay sirenas conectadas en una salida**: conecta la RFL directamente
    entre **+** y **−** en el terminal de la central [F2].


    5. **No enrolles el cable en los terminales**: corta y empalma adecuadamente para
    mantener la supervisión de la línea [F1].


    ---


    ### Funcionamiento de la supervisión


    El circuito se polariza en **sentido inverso en reposo** para supervisar la línea
    (detecta circuito abierto y cortocircuito). Al activarse la salida, la corriente
    circula en sentido normal y las sirenas suenan [F4] [F2]. Cualquier fallo se mostrará
    en pantalla con un mensaje del tipo:


    ```

    !ATENCION!  CIRCUITO ABIERTO SIRENA B

    ```

    [F5]


    ---


    ### Verificación de tensión


    Comprueba las tablas de tensión mínima del panel (Tablas 10 y 11 del manual de
    instalación) para garantizar que las sirenas reciben la tensión recomendada por
    el fabricante tanto en alimentación principal como en condiciones de mínima tensión
    de baterías [F1].


    ---


    > ⚠️ Para el esquema visual del circuito, consulta la **Figura 15** del documento
    MIE-MI-530rv001 (Figura 13 y 14 para la identificación de terminales físicos en
    ZX2e y ZX5e respectivamente) [F1] [F4].


    **Fuentes:**

    - Manual de Instalación ZX2e/ZX5e — MIE-MI-530rv001 (sin revisión registrada)

    - Manual de Configuración ZX2e/ZX5e — MIE-MP-530rv001 (sin revisión registrada)


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "Cada sirena deberá tener un diodo integrado, para impedir el consumo en polarización
    inversa (supervisión)." (MIE-MI-530rv001, p. 21) [F4]

    - "Todas las salidas de sirena quedan configuradas por defecto para sonar de forma
    contínua con cualquier alarma de cualquier zona, quedándo así en el patrón 1."
    (MIE-MP-310, p. 38) [F7]'
