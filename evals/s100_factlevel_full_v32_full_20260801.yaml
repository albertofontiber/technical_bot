- qid: cat023
  question: En el detector de humos por aspiración Securiton ASD532, ¿qué clases de
    sensibilidad según EN 54-20 ofrece y cómo se configura la monitorización del flujo
    de aire?
  answer: '## ASD532 — Clases EN 54-20 y configuración de monitorización de flujo
    de aire


    El **ASD 532** cumple las tres clases de la norma **EN 54-20** [F8]:


    - **Clase A** — Sensibilidad muy alta

    - **Clase B** — Sensibilidad alta

    - **Clase C** — Sensibilidad normal


    ---


    ### Sensores de humo disponibles según clase


    La elección de clase se vincula al tipo de sensor instalado [F1][F9]:


    - **SSD 532-1** — Rango de sensibilidad de alarma **0,5 %/m hasta 10 %/m**

    - **SSD 532-2** — Rango de sensibilidad de alarma **0,1 %/m hasta 10 %/m**

    - **SSD 532-3** — Rango de sensibilidad de alarma **0,02 %/m hasta 10 %/m**


    La elección del sensor y el ajuste de sensibilidad se realizan siguiendo las indicaciones
    del cap. 4.4.4.3 o con el software **«ASD PipeFlow»** [F1].


    ---


    ### Configuración de la clase EN 54-20 — Posiciones de conmutador


    Hay dos vías de configuración [F6]:


    **Vía 1 — Sin «ASD PipeFlow» (EasyConfig):**

    Seleccionar directamente la posición de conmutador en el AMB 32 [F3][F6]:


    - **A11** → Clase A (sensibilidad muy alta)

    - **b11 / b21** → Clase B (sensibilidad alta)

    - **C11 / C21 / C31** → Clase C (sensibilidad normal)


    Estas posiciones (A11 a C31) cumplen íntegramente los límites normativos de EN
    54-20, incluida la monitorización del flujo de aire [F3].


    **Vía 2 — Con «ASD PipeFlow»:**

    1. Crear y calcular el proyecto en **«ASD PipeFlow»** [F6]

    2. Introducir el resultado en el software de configuración **«ASD Config»** [F6]

    3. Seleccionar la posición de conmutador **X01, X02 o X03** en el ASD para memorizar
    los resultados [F6]


    ---


    ### Monitorización del flujo de aire


    El ASD 532 usa **medición calorimétrica** (técnica de medición de flujo en masa)
    [F2].


    **Principio de funcionamiento:**

    - Tras el **reset inicial** (posición de conmutador **U01**) [F3], con el conducto
    de aspiración limpio e intacto, el sistema registra los valores de flujo como
    **valores nominales al 100 %** [F2]

    - El sistema crea una **ventana de monitorización electrónica** centrada en ese
    100 % [F2]

    - Si los valores reales se salen de la ventana, se dispara el aviso **«Fallo flujo
    de aire»** [F2]


    **Parámetros normativos EN 54-20 (posiciones A11 a C31)** [F2][F6]:


    - Ventana de monitorización: **±20 %** (es decir, fallo por debajo del **80 %**
    por obstrucción, o por encima del **120 %** por rotura de tubo)

    - Tiempo de retardo (LS-Ü): **300 s**


    **Adaptaciones con «ASD Config»** [F6]:

    Se puede ajustar el tamaño de la ventana y el tiempo de retardo, con las siguientes
    restricciones críticas:


    > ⚠️ Superar **±20 %** de ventana o **300 s** de retardo implica incumplimiento
    de EN 54-20 y solo puede efectuarse previa consulta con el fabricante [F6].


    > ⚠️ No reducir la ventana por debajo de **±20 %** salvo que simultáneamente se
    aumente el tiempo de retardo a un mínimo de **10 min**. Combinar ventana < ±20
    % con retardo ≤ 300 s aumenta el riesgo de falsos avisos de fallo [F6].


    ---


    ### Posiciones W01–W44 (límites NO normativos)


    Las posiciones **W01 a W44** cumplen la sensibilidad de alarma según EN 54-20
    (clases A a C), pero **no los límites normativos de monitorización del flujo de
    aire** [F4][F5]:


    - Permiten configurar tiempos de retardo de **10 min o 60 min** y desviaciones
    de **±20 % o ±50 %** [F5]

    - **Solo deben usarse previa consulta con el fabricante** [F4][F6]


    ---


    **Fuente:** ASD532_TD_T140421es_a — ASD 532, Descripción técnica (sin revisión
    registrada)


    ---

    📋 **Obligaciones de evidencia del manual:**

    - Nota: la fuente es inconsistente: "El detector de humos por aspiración ASD 532
    incluye dos lugares de montaje para módulos adicionales." (ASD532_TD_T140421es_a,
    p. 13) [F9] declara 2 lugares y la enumeración servida lista 3 (ASD532_TD_T140421es_a,
    p. 13) [F9].

    - "Según EN 54-20, debe notificarse como fallo toda variación del flujo de aire
    superior al ±20 %." (ASD532_TD_T140421es_a, p. 24) [F2]

    - "Con carácter general, para la instalación, el proyecto y el uso del detector
    de humos por aspiración ASD 532 serán aplicables las disposiciones y directrices
    específicas de cada país." (ASD532_TD_T140421es_a, p. 37) [F8]'
