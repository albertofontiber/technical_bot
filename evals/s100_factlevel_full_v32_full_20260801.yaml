- qid: hp003
  question: ¿Cómo se conectan las baterías de 24V en la Detnov CAD-150?
  answer: '## Conexión de baterías en la CAD-150-8


    Las baterías requeridas son **dos unidades de 12V 7A/h**, que deben conectarse
    **en serie** para el correcto funcionamiento de la central [F3].


    ### Procedimiento de conexión


    1. **Coloca las baterías** en la parte inferior de la caja, en el espacio reservado
    para ello, de forma **vertical** [F3].


    2. **Conecta el cable puente** (suministrado con la central) uniendo el **polo
    positivo de una batería con el polo negativo de la otra**, para realizar la conexión
    en serie [F3].


    3. **Conecta los cables del circuito** (rojo y negro) al **positivo y negativo
    libres** de las baterías [F1].


    4. El conector de baterías en la PCB base corresponde al punto **11 (Conector
    Batería)**, protegido por el **fusible 10 (Fusible Baterías)** [F2].


    ### ⚠️ Orden de conexión obligatorio


    El orden de conexión es crítico para evitar daños al equipo [F6]:


    - **Primero:** conectar la alimentación de red (**230VAC**) activando el magnetotérmico
    bipolar.

    - **Segundo:** conectar las baterías.


    Antes de conectar, verifica que las baterías tienen una tensión **superior a 24V**
    [F9].


    > **Nota:** En caso de necesidad, se puede encender el equipo solo con baterías,
    pero es imprescindible pulsar el pulsador **BAT** para arrancar el equipo [F9].


    ---


    Fuente: 55315013 Manual Centrales Analógicas CAD-150-8 Instalación ES FR GB IT
    (sin revisión registrada); 55315008 Manual Centrales Analógicas CAD-150-8 Usuario
    ES FR GB IT (sin revisión registrada)


    ---

    📖 **Información adicional del manual:**

    - "* Comprobar que el equipo se ha instalado correctamente.

