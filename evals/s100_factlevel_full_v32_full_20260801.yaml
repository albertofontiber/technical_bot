- qid: cat024
  question: ¿Cuál es el consumo en alarma de la sirena analógica de zócalo Detnov
    MAD-472?
  answer: 'El consumo en alarma de la **MAD-472** es **7 mA** [F5][F6][F7].


    Adicionalmente, del propio manual de la sirena se obtiene el dato con el nivel
    de presión sonora asociado: **17 mA a 80 dB A** [F1].


    > ⚠️ **Discrepancia entre fuentes:** Existe una diferencia entre los valores indicados
    en los dos documentos:

    > - Manual propio de la MAD-472 (ref. 55347200): **17 mA (80 dB A)** [F1]

    > - Tablas de dispositivos compatibles de la CAD-250: **7 mA** [F5][F6][F7]

    >

    > Para el cálculo de consumos del lazo, verifica cuál de los dos documentos corresponde
    a la versión de firmware/hardware instalada, o consulta directamente a Detnov
    para confirmar el valor vigente.


    **Resto de parámetros eléctricos de la MAD-472** [F1]:

    - Consumo en reposo: **< 350 μA** [F1] (confirmado también como **0,35 mA** en
    tablas CAD-250 [F5])

    - Tensión de funcionamiento: **22–38 VDC** [F1]

    - Sin aislador incorporado [F5]

    - Ocupa **1 dirección** de lazo [F1]


    ---


    Fuentes: 55347200 Manual Sirena Analógica MAD-472 ES GB FR IT_V2 (sin revisión
    registrada); Manual instalacion CAD-250 (MI_372_es_2024 e) (sin revisión registrada);
