- qid: cat007
  question: En el detector por aspiración FAAST LT-200, ¿qué salidas de relé y de
    sirena tiene y con qué contactos, cómo se comporta el relé de avería ante un fallo
    o un corte de alimentación, qué resistencia de fin de línea llevan las salidas
    de sirena y cuál es la especificación eléctrica de los contactos de relé?
  answer: "El FAAST LT-200 dispone de relés de alarma, avería, prealarma (según variante)\
    \ y salidas de sirena, todos con contactos NC/C/NA. A continuación el detalle\
    \ completo:\n\n---\n\n## Relés disponibles y su comportamiento\n\n**Relé de ALARMA\
    \ 1 y 2**\n\n- Terminales: **NC, C y NA** por canal [F7]\n  - Canal 1: terminales\
    \ 5 (NC), 6 (C), 7 (NA) [F7]\n  - Canal 2: terminales 8 (NC), 9 (C), 10 (NA) [F7]\n\
    - Variante Stand-Alone (HS): se activa cuando se cumple la condición de alarma\
    \ en el canal. Estado de alarma **enclavado por defecto**; se necesita **rearme\
    \ manual** para desactivar el LED y el relé [F3]\n- Variante Loop (conectado a\
    \ panel): controlado por el panel cuando determina la condición de alarma. **No\
    \ enclavado** (encendido y apagado por el panel) [F2]\n\n**Relé de PREALARMA 1\
    \ y 2** *(solo variante Stand-Alone HS)*\n\n- Terminales: **NC, C y NA** por canal\
    \ [F7]\n  - Canal 1: terminales 23 (NC), 24 (C), 25 (NA) [F7]\n  - Canal 2: terminales\
    \ 26 (NC), 27 (C), 28 (NA) [F7]\n- Se activa cuando se cumple la condición de\
    \ prealarma en el canal [F3]\n- Condición predeterminada = Nivel 1. Cuando PREALARMA\
    \ = ALARMA = Nivel 1, la prealarma se activará al **70 % del nivel 1** [F3]\n\n\
    **Relé de AVERÍA 1 y 2**\n\n- Terminales: **NC, C y NA** por canal [F7]\n  - Canal\
    \ 1 (Avería): terminales 11 (NC), 12 (C), 13 (NA) [F7]\n  - Canal 2 (Avería AUX.):\
    \ terminales 14 (NC), 15 (C), 16 (NA) [F7]\n- Se activa ante condición de avería\
    \ en canal 1 o 2, o avería común [F3]\n- También se indica en **modo de servicio**\
    \ y cuando se **desconecta la alimentación de la unidad** [F3]\n- El estado de\
    \ avería **no está enclavado** (predeterminado) [F3]\n\n---\n\n## Salidas de SIRENA\
    \ 1 y 2\n\n- Terminales:\n  - Sirena 1: terminales 17 (–) y 18 (+) [F7]\n  - Sirena\
    \ 2: terminales 19 (–) y 20 (+) [F7]\n- Resistencia de fin de línea (EOL): **47\
    \ kΩ** en cada salida [F7]\n- Se activa cuando el canal está en ALARMA (estado\
    \ predeterminado) [F3]\n- Sirena 1 corresponde al canal 1; Sirena 2 corresponde\
    \ al canal 2 [F3]\n- En la variante Stand-Alone HS, también puede activarse en\
    \ PREALARMA [F3]\n\n---\n\n## Especificación eléctrica de los contactos de relé\n\
    \n- Potencia nominal de los contactos (carga resistiva):\n  - **2,0 A máx. a 30\
    \ V CC** [F1]\n  - **0,5 A máx. a 30 V CA** [F1]\n- Vida útil mínima: **10⁵ operaciones**\
    \ [F1]\n\n> ⚠️ **Advertencia:** Para cargas inductivas, el manual indica que se\
    \ requiere protección adicional (diodo o circuito RC). Consulta los diagramas\
    \ de conexionado del manual para la configuración correcta [F6].\n\n---\n\n**Nota\
    \ sobre variantes:** Los fragmentos cubren dos variantes del LT-200:\n- **Stand-Alone\
    \ (HS):** incluye relés de prealarma y el relé de alarma es enclavado por defecto\
    \ [F3][F7]\n- **Loop (conectado a panel):** sin relés de prealarma en la tabla\
    \ de terminales; el relé de alarma no está enclavado [F2][F8]\n\nConfirma qué\
    \ variante tienes instalada para aplicar la configuración correcta.\n\n---\n\n\
    Fuentes:\n- I56-6574-005_ES HS Stand Alone FAAST LT-200 QIG (sin revisión registrada)\n\
    - I56-6577-006_ES FAAST Notifier LT-200 QIG (sin revisión registrada)\n- I56-6577-006_EN\
    \ Notifier FAAST LT-200 QIG (sin revisión registrada)"
