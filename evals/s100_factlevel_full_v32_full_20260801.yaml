- qid: cat009
  question: ¿Qué resistencia de fin de línea (EOL) hay que instalar en las líneas
    de zona de la central convencional NFS Supra?
  answer: "## Resistencia de fin de línea (EOL) en zonas de la NFS Supra\n\nLa NFS\
    \ Supra admite **dos tipos de equipo final de línea (EFL)** para las líneas de\
    \ zona, según el modo configurado [F5]:\n\n---\n\n### Modo por defecto — Capacitivo\
    \ (EFL)\n- **Condensador de 47 µF** instalado entre positivo y negativo de la\
    \ línea, en la salida del último equipo [F5][F1]\n- Es el modo de fábrica [F3]\n\
    \n### Modo alternativo — Resistivo (RFL)\n- **Resistencia de 6K8 Ω** [F5][F1]\n\
    - En este modo, la central admite un rango de resistencia final de línea entre\
    \ **3 KΩ** (consumo máx. por zona **2,5 mA**) y **7 KΩ** (consumo máx. por zona\
    \ **4 mA**) [F5]\n\n---\n\n### Regla importante\nTodas las zonas, **incluso las\
    \ no usadas**, deben tener instalado su final de línea según la configuración\
    \ del sistema (EFL o RFL) [F5].\n\n---\n\n### Cómo cambiar el modo (Nivel de acceso\
    \ 3)\n1. Pulsa simultáneamente **Tecla TECLADO + Tecla EVACUACIÓN** [F3]\n2. Cambia\
    \ la opción con la **Tecla REARME** [F3]:\n   - **Led 1 Alarma Rojo encendido**\
    \ → Final de Línea Resistivo **6K8 Ω** [F3]\n   - **Led 2 Anulada Ámbar encendido**\
    \ → Final de Línea Capacitivo **47 µF** (por defecto) [F3]\n\n---\n\n> ⚠️ El EFL\
    \ se instala siempre en el **último equipo** de la línea, entre el positivo y\
    \ negativo de la zona [F1][F8].\n\n---\n\nFuente: HLSI-MN-025_NFS Supra (rev.\
    \ sin revisión registrada); HLSI-MA-025 Guia Rapida NFS_Supra_ES (rev. sin revisión\
    \ registrada)\n\n---\n⚠️ **Obligaciones de evidencia del manual:**\n- \"Esto significa\
    \ que debe calcular el número de sensores a instalar dependiendo de su consumo\
    \ sin sobrepasar nunca los 32 sensores.\" (HLSI-MN-025_NFS Supra, p. 28) [F1]\n\
    - Nota: la fuente es inconsistente: \"La central NFS Supra tiene cuatro, ocho\
    \ o doce zonas de alarma.\" (HLSI-MN-025_NFS Supra, p. 27) [F5] declara 12 zonas\
    \ y la enumeración servida lista 6 (HLSI-MN-025_NFS Supra, p. 27) [F5]."
