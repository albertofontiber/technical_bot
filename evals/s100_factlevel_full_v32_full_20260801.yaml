- qid: cat012
  question: ¿Cómo se calcula la capacidad de batería (en Ah) necesaria para la central
    AM-8200?
  answer: '## Cálculo de capacidad de batería para la AM-8200


    La fórmula que aplica el manual es [F4][F5]:


    **Ah Batería = (A + B) × 1,2**


    Donde:

    - **A** = Corriente total en reposo × horas de espera (24 h o 72 h según normativa
    aplicable)

    - **B** = Corriente total en alarma × **0,5 h**

    - **Factor 1,2** = margen por tolerancias de fabricación de las baterías [F6]


    ---


    ## Pasos para completar el cálculo


    **Paso 1 — Determina la corriente en reposo (NO ALARMA)**


    Usa la **Tabla 1** (para AM-8200 con CPU AM8200-KLCD) o la **Tabla 2** (para AM-8200BB)
    [F4][F5]. Los consumos base de los módulos internos son:


    Para **AM-8200 (CPU AM8200-KLCD)** [F4]:

    - AM-8200 CPU (AM8200-KLCD): **179 mA**

    - LIB-8200: **50 mA** (por cada tarjeta instalada)

    - AM82-2S2C: **28 mA**

    - AM82-BST-C: **39 mA**


    Para **AM-8200BB** [F5]:

    - AM-8200BB: **135 mA**

    - LIB-8200: **50 mA** (por cada tarjeta instalada)

    - AM82-2S2C: **28 mA**

    - AM82-BST-C: **39 mA**


    A estos valores hay que sumar:

    - Corriente de los lazos (consultar fichas de datos de cada dispositivo y usar
    la Tabla 3) [F6]

    - Corriente de la salida de usuario 24 Vcc (máx. **2 A**) [F4][F5]

    - Corriente de dispositivos externos (campanas, sirenas, flashes, LCD-8200, otros)
    [F4][F5]


    > **Restricción importante:** La corriente total para todos los lazos debe ser
    **inferior a 750 mA** [F6]. La corriente total de la salida de usuario debe ser
    **inferior a 2 A** [F6].


    **Paso 2 — Determina la corriente en alarma (ALARMA)**


    Mismos módulos internos, con consumos en alarma [F4][F5]:


    Para **AM-8200 (CPU AM8200-KLCD)** [F4]:

    - AM-8200 CPU: **345 mA**

    - LIB-8200: **92 mA**

    - AM82-2S2C: **28 mA**

    - AM82-BST-C: **39 mA**


    Para **AM-8200BB** [F5]:

    - AM-8200BB: **177 mA**

    - LIB-8200: **92 mA**

    - AM82-2S2C: **28 mA**

    - AM82-BST-C: **39 mA**


    > **Nota:** En condiciones de alarma, la central enciende **solo los primeros
    6 LED** de los detectores y módulos de entrada en alarma [F6].


    **Paso 3 — Aplica la fórmula**


    1. Suma todas las corrientes en reposo → **Total reposo (A_total)**

    2. Multiplica: **A = A_total × 24 h** (o × 72 h según normativa) → resultado en
    Ah

    3. Suma todas las corrientes en alarma → **Total alarma (B_total)**

    4. Multiplica: **B = B_total × 0,5 h** → resultado en Ah

    5. Aplica: **Ah Batería = (A + B) × 1,2** [F4][F5][F6]


    **Paso 4 — Verifica los límites de la batería**


    El manual especifica que se deben conectar **2 × 12 V**, con capacidad mínima
    de **7 Ah** y máxima de **18 Ah** [F2].


    Las baterías recomendadas son [F2]:

    - Yuasa NP18-12B o NP7-12BFR (UL94) — 12 V / 17,2 Ah

    - Fiamm FG21803 o FGV21803 (UL94) — 12 V / 18 Ah


    > Si el valor calculado supera los **3,5 A** de capacidad de la fuente, la corriente
    en exceso durante alarma se extrae de las baterías [F6].


    ---


    **Fuente:** AM-8200 Manual de Instalación — Doc. AM-8200-ESP Rev. A.3 (sin revisión
    de fecha registrada)


    ---

    ⚠️ **Información adicional del manual:**

    - "4 La corriente en las condiciones de reposo o alarma no puede superar, en ningún
    caso, la capacidad de la fuente de alimentación." [F6]


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "Calcular la corriente total necesaria para todos los lazos usando **la tabla
    2 (ver a continuación)** teniendo presente que la central enciende **solo los
    primeros 6 LED** de los detectores y módulos de entrada en alarma." (AM-8200 Manual
    Instalacion, p. 53) [F6]'
