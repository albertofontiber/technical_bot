- qid: hp009
  question: ¿Cuál es la resistencia de fin de línea recomendada para los lazos de
    la central Morley ZXe?
  answer: 'La resistencia de fin de línea (RFL) para los **circuitos de sirenas**
    de la central ZXe es de **6.800 Ω (6,8 KΩ), 0,5 W mínimo** [F6].


    Esto aplica tanto al ZX2e (circuitos Sirena A y B) como al ZX5e (circuitos Sirena
    A, B, C y D) [F6]. El diagrama de conexionado confirma este valor para ambos circuitos
    [F3].


    **Puntos clave de instalación:**


    - La RFL debe colocarse al **final del circuito**, entre el terminal + y – de
    la última sirena [F6]

    - Si no hay sirenas conectadas, instala la RFL directamente en los terminales
    de salida de la central [F1]

    - **No realizar ramales** en la línea de sirenas: la supervisión solo cubre la
    línea directa hasta la RFL; los ramales paralelos no quedan supervisados [F2]

    - No se recomienda cable de longitud superior a **1 km** para los circuitos de
    sirenas [F3]

    - Sección mínima de cable recomendada: **1,5 mm²** [F1]

    - Cada circuito admite un consumo máximo de **1 A** [F6]


    **Nota sobre el lazo periférico (RS-485):** si tu consulta se refiere al lazo
    periférico (no al circuito de sirenas), la RFL es diferente: **150 Ω, 0,5 W mínimo**,
    en cada extremo del lazo [F4]. Confirma qué circuito necesitas si es este el caso.


    ---


    Fuente: Manual de Instalación Paneles de Incendio ZX2e / ZX5e (Documento No. MIE-MI-530,
    Revisión: 001); Manual de Instalación ZXAE/ZXEE (DOC.MIE-MI-310, sin revisión
    registrada)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "Es imprescindible comprobar que no hay conexión entre los terminales A y B
    y que el lazo entra a un lado del conector y sale por el otro o termina en la
    resistencia RFL de 150 Ohmios." (MIE-MI-310, p. 22) [F4]

    - "Debe instalarse siempre una resistencia RFL entre + y - de la última sirena
    para controlar la apertura o cierre de la línea de sirenas." (MIE-MI-310, p. 18)
    [F1]'
