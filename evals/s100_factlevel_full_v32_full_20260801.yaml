- qid: cat020
  question: En una central Morley DXc instalada en Espana, ¿cual es el nivel de alarma
    y de prealarma por defecto de los detectores, y el maximo configurable?
  answer: '## Niveles de alarma y prealarma por defecto en la DXc — Protocolo Morley-IAS


    Los valores dependen del tipo de detector:


    ---


    ### Detectores ópticos convencionales (OPT) — valores en porcentaje


    - **Prealarma por defecto: 80%** [F1]

    - **Alarma por defecto: 100%** [F1]

    - **Nivel máximo configurable de alarma: 108%** [F1]


    ---


    ### Detectores Multicriterio / Óptico-Térmicos (OTM) — valores por niveles


    - **Prealarma por defecto: Nivel 3** (sensibilidad 6,5% osc./m) [F1][F2]

    - **Alarma por defecto: Nivel 4** (sensibilidad 6,5% a 11,5% osc./m, autoajustado)
    [F1][F2]


    Los niveles disponibles para OTM van del **Nivel 1 al Nivel 6** [F2].


    ---


    ### Detectores láser (LSR) — valores por niveles


    - **Prealarma por defecto: Nivel 4** (sensibilidad 0,32% osc./m) [F2]

    - **Alarma por defecto: Nivel 5** (sensibilidad 0,65% osc./m) [F2]


    Los niveles disponibles para LSR van del **Nivel 1 al Nivel 9** [F2].


    ---


    ### Restricciones de configuración


    - El nivel de prealarma **no puede ser superior al nivel de alarma** [F3].

    - La central **no permite ajustar niveles que impidan el reconocimiento de las
    alarmas** [F3].

    - Por defecto, los detectores se ajustan a los **niveles de alarma recomendados
    por el fabricante** [F4].


    > ⚠️ El ajuste de sensibilidad es una función muy flexible. Solo debe utilizarse
    en aplicaciones especiales y con sumo cuidado. Asegúrate de que los nuevos niveles
    no provocan falsas alarmas ni impiden la correcta señalización de incendio [F4].


    ---


    **Fuente:** DXc_Manual variaciones de mercado (sin revisión registrada); DXc_Manual
    de configuracion (sin revisión registrada)


    ---

    📖 **Información adicional del manual:**

    - "Fuego    : Niv4

    Prealarma: Niv3


    Introd nivel Fuego   : 5" [F3]

    - "Fuego    : Niv4

    Prealarma: Niv3


    Introd nivel Fuego     : 3" [F1]


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "* Todas las indicaciones obligatorias que no deben ocultarse durante una condición
    de alarma de incendio se muestran mediante LEDs." (DXc_Manual de usuario, p. 4)
    [F8]

    - "Antes de conectar cualquier cable a la central, se deben realizar las siguientes
    comprobaciones:" (DXc_Guia de instalacion_multiling, p. 4) [F10]

    - "el umbral de alarma de fuego depende del ajuste del nivel/modo y es diferente
    para cada nivel de alarma." (DXc_Manual variaciones de mercado, p. 5) [F2]'
