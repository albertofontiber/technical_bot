- qid: cat015
  question: ¿Como se actualiza el firmware de la central Detnov CAD-150?
  answer: 'Los fragmentos disponibles de los manuales de la CAD-150-8 (manual de usuario
    y manual de instalación) **no contienen ningún procedimiento de actualización
    de firmware**.


    Los fragmentos recuperados cubren únicamente:

    - Menús de usuario (zonas, puntos, relés, sirenas, registro de eventos) [F1, F3]

    - Descripción de componentes del panel y LEDs [F2, F4]

    - Descripción de la PCB base y PCB carátula (conectores, fusibles) [F6]


    El manual no especifica el procedimiento de actualización de firmware para la
    CAD-150-8. Aunque el fragmento [F6] menciona la existencia de un **conector USB**
    en la PCB carátula, no se describe su uso para actualización de firmware ni ningún
    procedimiento asociado.


    **Recomendación:** Contacta directamente con el soporte técnico de Detnov para
    obtener el procedimiento oficial de actualización de firmware y la herramienta
    de software correspondiente.


