- qid: hp010
  question: En la Morley DXc, ¿cómo se añade un nuevo detector al lazo tras la puesta
    en marcha inicial?
  answer: "# Añadir un nuevo detector al lazo en la DXc tras la puesta en marcha\n\
    \nEl procedimiento es usar la función **Autobúsqueda de equipos** (sección 5.3.5.2)\
    \ desde el menú de programación [F1].\n\n---\n\n## Pasos\n\n1. **Conecta físicamente\
    \ el nuevo detector** al lazo en bucle cerrado, respetando la polaridad positivo/negativo\
    \ [F5].\n\n2. **Accede al Nivel 3** de programación [F3]:\n   - Desde el estado\
    \ en reposo, selecciona la opción **5: Menú**\n   - Introduce la clave de Nivel\
    \ 3 cuando se solicite\n   - Pulsa **⊙** para confirmar y desbloquear la memoria\
    \ (el puente **J5** sobre el conector de PC debe estar puesto) [F3]\n\n3. **Entra\
    \ al menú de Programación** pulsando **'7'** [F3]. Aparecerá:\n   ```\n   [Programar]\n\
    \   1:Op. Generales    2:Lazo\n   3:Entradas Placa   4:Salidas Placa\n   ...\n\
    \   ```\n\n4. **Selecciona '2: Lazo'** y luego **'2: Autobúsqueda'** [F1].\n\n\
    5. **Si la central tiene más de un lazo**, introduce el número de lazo donde has\
    \ conectado el nuevo detector y pulsa **⊙** [F1].\n\n6. **Confirma la autobúsqueda**\
    \ pulsando **⊙** cuando aparezca la pantalla de confirmación [F1]:\n   ```\n \
    \  [Autobusqueda]\n   Lazo: 1  Autobusqueda?\n   OK:Confirm    ←:Cancel\n   ```\n\
    \n7. **Espera** a que finalice el proceso de reconocimiento [F1].\n\n8. **Verifica\
    \ el resultado** en la pantalla de resumen [F1]:\n   ```\n   [Lazo]\n   Lazo:\
    \ 1           Total: XX\n   Nuevos: X         Elimin.:0  Cambiad:0\n   ION: X\
    \  OPT: X  TMP: X  MLT: X\n   PUL: X  MON: X  SIR: X  REL: X  OTROS: X\n   ```\n\
    \   - Comprueba que el campo **Nuevos** refleja el detector añadido.\n   - Verifica\
    \ que el total y los tipos de equipo coinciden con lo instalado físicamente.\n\
    \n9. **Sal de la pantalla** pulsando **⊞** para regresar al menú de Lazo [F1].\n\
    \n10. **Configura el nuevo detector** (zona, texto descriptivo, grupo de anulación,\
    \ etc.) desde **'1: Confg. Equipos'** en el menú de Lazo [F1].\n\n---\n\n## Advertencia\
    \ importante\n\n> Si en tu instalación el protocolo de lazo es seleccionable y\
    \ has realizado algún cambio de protocolo, **espera dos minutos** antes de ejecutar\
    \ la autobúsqueda. La central necesita ese tiempo para rearmar los equipos del\
    \ lazo [F1].\n\n---\n\n**Fuente:** DXc Manual de configuración (sin revisión registrada)\n\
    \n---\n\U0001F4CB **Obligaciones de evidencia del manual:**\n- Nota: la fuente\
    \ es inconsistente: \"PUL: 4 MON: 0 SIR: 2 REL: 1 OTROS : 2\" (DXc_Manual de configuracion,\
    \ p. 48) [F1] declara 1 OTROS y la enumeración servida lista 5 (DXc_Manual de\
    \ configuracion, p. 48) [F1]."
  family_resolved: true
