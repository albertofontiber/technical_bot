- qid: hp002
  question: El detector ASD535 de Detnov está dando una alarma intermitente de flujo
    bajo. ¿Cuál es la causa más probable y cómo se diagnostica?
  answer: "## ASD535 — Alarma intermitente de flujo bajo: causa y diagnóstico\n\n\
    **La causa más probable es una obstrucción en el conducto de aspiración** (flujo\
    \ por debajo del 80 % del valor nominal) [F1][F6].\n\n---\n\n### 1. Entender el\
    \ aviso\n\nEl ASD535 monitoriza el flujo de aire comparando el valor actual con\
    \ el valor nominal registrado en el reset inicial (= 100 %) [F1]. Cuando el flujo\
    \ cae **por debajo del 80 %**, el sistema lo interpreta como obstrucción y, transcurrido\
    \ el tiempo de retardo de **300 s**, dispara el aviso de fallo de flujo de aire\
    \ [F1][F2]. El LED **«Fault»** empieza a parpadear en cuanto la variación supera\
    \ el ±20 %, antes de que se dispare el fallo definitivo [F8].\n\n---\n\n### 2.\
    \ Diagnóstico paso a paso\n\n1. **Leer el valor de flujo actual** — Coloca el\
    \ conmutador en posición **V** (cap. 7.6.1 del manual) para leer el porcentaje\
    \ de flujo real y compararlo con el protocolo de puesta en funcionamiento [F9][F2].\n\
    \   - Valor < 100 % → apunta a **obstrucción** [F2][F9].\n   - Valor > 100 % →\
    \ apuntaría a **rotura de tubo** (no es tu caso).\n\n2. **Comprobar el código\
    \ de fallo activo** — Consulta el código de evento en el AMB 35 (posición de conmutador\
    \ **E**) [F3]. Para flujo bajo, los códigos relevantes son [F6]:\n   - **001**\
    \ — Obstrucción en conducto de aspiración.\n   - **004** — Parámetros LS-Ü no\
    \ válidos / sensor fuera de rango.\n   - **008** — Sensor de flujo de aire defectuoso\
    \ o no conectado.\n\n3. **Inspección física del conducto de aspiración** — Comprueba\
    \ [F6][F9]:\n   - Orificios de aspiración obstruidos (suciedad, polvo, cinta,\
    \ etc.).\n   - Salida de aire del ASD obstruida.\n   - Caja de filtro / unidad\
    \ de filtrado: inspeccionar y limpiar.\n   - Sensor de flujo de aire: inspeccionar\
    \ y limpiar.\n\n4. **Criterio de intervención preventiva** — Si la sensibilidad\
    \ LS-Ü está en el valor estándar **±20 %**, actúa ya cuando el valor caiga por\
    \ debajo del **90 %** (la mitad de la sensibilidad = ±10 %), sin esperar a que\
    \ llegue al 80 % [F9].\n\n5. **Verificar el sensor de flujo de aire** — Si tras\
    \ limpiar el conducto el fallo persiste y el código es **008**, el sensor puede\
    \ estar defectuoso o desconectado → comprobar el cable de conexión y, si procede,\
    \ sustituir el sensor [F6].\n\n6. **Verificar que el reset inicial fue correcto**\
    \ — Si el valor nominal se registró con el conducto en mal estado, el 100 % de\
    \ referencia puede ser incorrecto. Comprueba los códigos de la serie **G30/G40**\
    \ en el AMB 35 [F4]. Si el reset inicial fue defectuoso (código **004** de la\
    \ tabla de reset), ejecuta un nuevo reset inicial con el conducto limpio y en\
    \ perfecto estado [F4].\n\n---\n\n### ⚠ Advertencia\n\nAntes de realizar cualquier\
    \ comprobación de mantenimiento, **bloquea o desconecta el control de incendios\
    \ y la alerta remota en la CDI de orden superior** para evitar disparos no deseados\
    \ [F9].\n\n---\n\n### 3. Si el fallo persiste tras la limpieza\n\n- Revisa si\
    \ la ventana de monitorización (LS-Ü) está configurada con un valor inferior a\
    \ ±20 %, lo que aumenta el riesgo de falsos avisos. En ese caso, el tiempo de\
    \ retardo debe ser de **mínimo 10 min** [F5].\n- Si hay grandes turbulencias de\
    \ aire en la instalación, puede ser necesario aumentar el tiempo de retardo y\
    \ el tamaño de la ventana, pero esto requiere consulta con el fabricante y supone\
    \ incumplimiento de **EN 54-20** [F5].\n\n---\n\n**Fuente:** ASD535, Descripción\
    \ técnica, T 131 192 h es (sin revisión registrada en los fragmentos)\n\n---\n\
    ⚠️ **Información adicional del manual:**\n- \"Para evitar que los controles de\
    \ incendios, las alertas remotas y las zonas de extinción se disparen al llevar\
    \ a cabo los trabajos de mantenimiento, es **imprescindible** bloquearlos o desconectarlos\
    \ previamente.\" [F9]\n- Nota: el manual también indica: \"1. Bloquear o desconectar\
    \ el control de incendios y la alerta remota en la CDI de orden superior.\n2.\
    \ La tensión de alimentación de la CDI debe estar configurada para la central\
    \ conforme a la normativa de mantenimiento.\n3. Debe comprobarse que la entrada\
    \ del conducto de aspiración y los tapones de tubo del orificio de entrada de\
    \ la caja del detector que no está en uso (ASD 535-1 y ASD 535-3) están en la\
    \ posición correcta.\n4. Debe comprobarse si existe suciedad en la salida de aire,\
    \ en cuyo caso deberá limpiarse.\n5. En caso de que el ASD 535 se utilice para\
    \ la vigilancia de equipos y se hayan instalado transiciones insertadas de tubo\
    \ rígido a tubo flexible, debe comprobarse que dichas transiciones están colocadas\
    \ correctamente (sin fugas).\n6. Debe abrirse la cubierta de la caja del detector\
    \ y fijarse en la posición media de anclaje del fondo de la caja. **Atención**:\
    \ conexión de cable plano (véanse también los cap. 5.4.1 y 7.1). Deberán efectuarse\
    \ las siguientes mediciones:\n   * Medir la tensión de servicio en los bornes\
    \ 1 (+), 2 (-) \U0001F87A Valor nominal = 12,3 a 13,8 V-CC (funcionamiento a 12\
    \ V-CC) o 21,6 a 27,6 V-CC (funcionamiento a 24 V-CC).\n   * Leer el valor de\
    \ flujo de aire del conducto de aspiración en la posición de conmutador V (véase\
    \ para ello el cap. 7.6.1) y comparar con el protocolo de puesta en funcionamiento.\
    \ Si existe una desviación superior a la mitad de la sensibilidad establecida\
    \ (véanse ejemplos ➀ y ➁), deberá realizarse una inspección del conducto de aspiración\
    \ de la siguiente manera:\n     - Un **aumento** del valor (superior al 100 %)\
    \ implica una **rotura de tubo** inminente \U0001F87A Comprobar si el conducto\
    \ de aspiración tiene fugas (puntos de unión, racores, etc.)\n     - Una **disminución**\
    \ del valor (inferior al 100 %) implica una **obstrucción** inminente \U0001F87A\
    \ Comprobar si el conducto de aspiración está obstruido y limpiarlo según el **punto\
    \ 9** o el **punto 10**.\n   * ➀ Sensibilidad de LS-Ü establecida = ±20 % (estándar);\
    \ la mitad = ±10 %. También deberá realizarse una inspección del conducto de aspiración\
    \ cuando el valor caiga por debajo del 90 % o suba por encima del 110 %.\n   *\
    \ ➁ Sensibilidad de LS-Ü establecida = ±50 % (no conforme a EN 54-20); la mitad\
    \ = ±25 %. También deberá realizarse una inspección del conducto de aspiración\
    \ cuando el valor caiga por debajo del 75 % o suba por encima del 125 %.\n7. Debe\
    \ desconectarse el ASD (extraer el bloque de bornes 1/2 y, en su caso, 3/4 del\
    \ AMB 35), desconectar con cuidado la conexión de cable plano con la unidad de\
    \ control y retirar completamente la cubierta de la caja del detector. Una vez\
    \ desconectado el cable plano de los sensores de humo, estos deberán extraerse\
    \ del ASD con cuidado.\n8. El espacio interior de las cámaras de los sensores\
    \ de humo y la rejilla protectora contra insectos deberán limpiarse con un pincel\
    \ suave y seco. Para la limpieza también puede emplearse nitrógeno o aire comprimido\
    \ sin aceite.\" [F9]"
