- qid: hp008
  question: ¿Qué detectores de humo analógicos son compatibles con la Notifier ID3000?
  answer: 'Los detectores de humo analógicos compatibles con la **ID3000** son los
    siguientes:


    **Detectores de humo ópticos:**

    - **SDX-551E** (OPT) [F2]

    - **SDX-751** (OPT) [F2]

    - **SDX-751EM** (OPT) [F1][F2]


    **Detectores de humo iónicos:**

    - **CPX-551E** (ION) [F2]

    - **CPX-751E** (ION - bajo perfil) [F1][F2]


    **Detectores combinados humo/térmico (multicriterio):**

    - **SDX-751TEM** — OptiPlex, combinado térmico/humo (tipo MULTI) [F1][F2]

    - **IRX-751TEM** — SMART 3 [F2]

    - **IRX-751CTEM** — SMART 4 (detección óptica, infrarroja, térmica y CO) [F2][F5]


    **Detectores de humo láser (VIEW™):**

    - **FSL-751E** / **LPX-751** — VIEW, humo láser [F1][F2]


    **Detectores para entornos especiales:**

    - **HPX-751E** — HARSH/FILTREX, óptico [F1][F2]

    - **IDX-751** — HAZARD, óptico intrínsecamente seguro [F1][F2]


    **Nota importante:** Todos estos equipos utilizan el **protocolo de comunicaciones
    Notifier** [F1]. La central ID3000 admite un máximo de **512 sensores y pulsadores
    manuales por panel**, salvo que se utilicen ELIBs [F4].


    ---


    Fuentes: MPDT190 - Panel ID3000 Manual de programación (sin revisión registrada);
    MIDT190 - Panel ID3000 Manual de instalación y puesta en marcha (sin revisión
    registrada)'
