- qid: hp006
  question: La Notifier AFP-400 muestra el aviso 'Tierra' (Earth Fault). ¿Qué significa
    y cómo se localiza?
  answer: "## Fallo de Tierra (Earth Fault) en la AFP-400\n\nEl aviso **'Tierra'**\
    \ indica que se ha detectado una fuga a tierra en algún punto del cableado o equipos\
    \ del sistema. En la AFP-400, este fallo se monitoriza a través de la **placa\
    \ de alimentación MPS-400**, que dispone de un **LED específico de \"Fallo de\
    \ Tierra\"** [F2].\n\n---\n\n### ¿Qué significa?\n\nEn el contexto del **SLC (Lazo\
    \ de Comunicaciones)**, una falta a tierra genera la condición **\"Alarma/Problema\"\
    ** independientemente del estilo de circuito utilizado (Estilo 4, Estilo 6 o Estilo\
    \ 7) [F10]. Esto significa que el sistema puede generar tanto señal de avería\
    \ como señal de alarma dependiendo de la configuración.\n\n---\n\n### Localización\
    \ del fallo\n\n**Paso 1 — Confirmar el fallo visualmente**\n- Comprueba el **LED\
    \ \"Fallo de Tierra\"** en la placa MPS-400 [F2]. Si está encendido, confirma\
    \ que el fallo es real y no un transitorio.\n\n**Paso 2 — Consultar la pantalla\
    \ LCD**\n- Accede al menú de **Lectura de Estados** pulsando `<Enter>` → `<2>`\
    \ [F8] para identificar qué punto o zona está reportando el fallo. Esto te permitirá\
    \ acotar la zona afectada sin necesidad de clave de acceso [F8].\n\n**Paso 3 —\
    \ Revisar el cableado del SLC**\n- Inspecciona el cableado del lazo SLC en la\
    \ zona indicada por la pantalla. Una falta a tierra en el SLC puede deberse a:\n\
    \  - Cable pelado en contacto con masa metálica (canaleta, bandeja, estructura).\n\
    \  - Humedad en una caja de derivación o detector.\n  - Módulo o sensor con aislamiento\
    \ dañado.\n\n**Paso 4 — Revisar el cableado de alimentación (TB1)**\n- Comprueba\
    \ el bloque de terminales **TB1** de la MPS-400, especialmente el pin **TB1-3\
    \ (Toma Tierra)** [F2], para descartar un problema en la entrada de alimentación\
    \ AC.\n\n**Paso 5 — Verificar si la detección de fallo de tierra está habilitada**\n\
    - En la placa MPS-400 existe el puente **JP2**, cuyo corte inhabilita la detección\
    \ de fallo de tierra [F3]. Verifica que este puente esté en posición correcta\
    \ (no cortado) si el fallo parece no corresponder a ninguna causa real.\n\n---\n\
    \n### Nota importante\nEl manual no especifica un procedimiento paso a paso detallado\
    \ para la localización física del fallo de tierra más allá de lo indicado en los\
    \ fragmentos disponibles. Para un procedimiento completo de diagnóstico, consulta\
    \ el **Manual de Instalación del AFP-300/AFP-400 (Documento 50253)** [F6] y el\
    \ **Manual de Programación (Documento 50259)** [F7].\n\n---\n\n**Fuentes:**\n\
    - MFDT170 — Manual de usuario AFP-400 (sin revisión registrada)\n- MIDT170 — Manual\
    \ de instalación AFP-400 (sin revisión registrada)\n- 50253SP — AFP-300/AFP-400\
    \ Installation (sin revisión registrada)\n- 15090SP — NRT Terminal de Informe\
    \ de la Red (sin revisión registrada)\n\n---\n\U0001F4D6 **Información adicional\
    \ del manual:**\n- \"- **TB1** (top left): Terminal block with connections labeled\
    \ TB1\n- **TB2** (top center): Terminal block labeled TB2\n- **TB3-TB6** (top\
    \ right): Terminal blocks labeled TB3-TB6\n- **TB7-TB10** (far right): Terminal\
    \ blocks labeled TB7-TB10\n- **Interruptor de Selección de Voltaje 115V/230V**\
    \ (left side): Voltage selection switch\n- **Circuitos de Aviso y Señalizaciones\
    \ 1-4** (right side): Alarm and signaling circuits 1-4\n- **Fallo de Tierra**\
    \ (right side): Ground fault indicator\n- **Activación de la Alimentación AC**\
    \ (right side): AC power activation\n- **Placa de Alimentación de la MPS-400**\
    \ (bottom center): MPS-400 power supply board\" [F2]"
  family_resolved: true
