- qid: cat017
  question: ¿Como se cablea y se da de alta (configura) un lazo en la central Notifier
    INSPIRE (E10/E15)?
  answer: "# Cableado y configuración de lazo en INSPIRE E10/E15\n\nA continuación\
    \ se detalla el proceso completo en dos fases: **cableado físico** y **configuración\
    \ software**.\n\n---\n\n## FASE 1 — CABLEADO FÍSICO DEL LAZO\n\n### Terminales\
    \ del módulo LAZO OPAL X2 (HOP-433-100)\n\nEl módulo de doble lazo tiene 10 terminales\
    \ [F2][F3]:\n\n**Lazo 1:**\n- Terminal **1**: Lazo 1 Salida +VE\n- Terminal **2**:\
    \ Lazo 1 Salida -VE\n- Terminal **3**: ⊕ (pantalla — **NO usar**)\n- Terminal\
    \ **4**: Lazo 1 Entrada +VE\n- Terminal **5**: Lazo 1 Entrada -VE\n\n**Lazo 2:**\n\
    - Terminal **6**: Lazo 2 Salida +VE\n- Terminal **7**: Lazo 2 Salida -VE\n- Terminal\
    \ **8**: ⊕ (pantalla — **NO usar**)\n- Terminal **9**: Lazo 2 Entrada +VE\n- Terminal\
    \ **10**: Lazo 2 Entrada -VE\n\n> ⚠️ **Los terminales 3 y 8 NO deben usarse para\
    \ la pantalla del cable de lazo. La pantalla debe conectarse a la barra de tierra\
    \ de la central** [F2][F3].\n\n> ⚠️ **No mezclar dispositivos OPAL y CLIP en el\
    \ mismo lazo** [F2].\n\n> ⚠️ **NUNCA usar dispositivos de alta tensión (como comprobadores\
    \ de resistencia de aislamiento) en el circuito de lazo** [F8].\n\nPara el conexionado\
    \ físico de los dispositivos en el lazo, consulta el diagrama del manual de instalación\
    \ **HOP-138-9ES** y el folleto de instrucciones de cada dispositivo [F4].\n\n\
    ---\n\n### Capacidad del lazo [F2][F4]\n\n**Modo OPAL:**\n- Hasta **159 detectores**\
    \ OPAL por lazo\n- Hasta **159 módulos** OPAL por lazo\n- Corriente máxima: **750\
    \ mA** por lazo\n\n**Modo CLIP** (requiere licencia):\n- Hasta **99 detectores**\
    \ CLIP por lazo\n- Hasta **99 módulos** CLIP por lazo\n\n> ℹ️ Restricción EN54-2\
    \ (13.7): máximo **512 detectores y/o pulsadores** por módulo de lazo (los 2 circuitos\
    \ en conjunto) [F2].\n\n---\n\n### Numeración de lazos [F2]\n\nLos circuitos de\
    \ lazo se numeran secuencialmente de **izquierda a derecha** del portamódulos.\
    \ En la E15 (dos filas), la segunda fila continúa la numeración desde la primera.\n\
    \n---\n\n## FASE 2 — COMPROBACIONES PREVIAS A LA CONEXIÓN\n\nRealiza estas pruebas\
    \ **antes** de conectar el lazo a la central [F8]:\n\n1. Comprueba la continuidad\
    \ de cada parte del lazo y mide la resistencia extremo a extremo. Se recomienda\
    \ cable de **2 hilos** [F8].\n2. Comprueba la continuidad de la pantalla del cable\
    \ (debe dar resistencia muy baja) [F8].\n3. Comprueba que **no hay continuidad**\
    \ entre la pantalla y los cables +VE y -VE [F8].\n\n### Medición de resistencia\
    \ con multímetro [F7]\n\n- Mide entre **Lazo X Entrada -VE** y **Lazo X Salida\
    \ -VE** con el lazo desconectado físicamente de la central.\n- Multiplica el resultado\
    \ por 2 y añade la resistencia de cada aislador (**0,1 a 0,13 Ω** por aislador).\n\
    - La capacidad del cable debe ser **inferior a 0,5 µF** [F7].\n\n**Límites de\
    \ resistencia máxima:**\n- Protocolo **OPAL**: inferior a **40 Ω** [F7]\n- Protocolo\
    \ **CLIP** (con detección de dirección duplicada): inferior a **40 Ω** [F7]\n\
    - Protocolo **CLIP** (sin detección de dirección duplicada): inferior a **71 Ω**\
    \ [F7]\n\n> ℹ️ Se recomienda usar la herramienta **POL-200-TS** para comprobar\
    \ y medir circuitos de lazo antes de conectar a la central. La herramienta **POL-200**\
    \ funciona tanto en protocolo OPAL como CLIP [F5].\n\n### Comprobación de polaridad\
    \ [F6]\n\n3. Con multímetro en función de prueba de diodo, conecta en **polaridad\
    \ invertida** (+VE al negativo del lazo, -VE al positivo): debe indicar símbolo\
    \ de diodo en polarización directa [F6].\n4. Conecta en **polaridad normal** (+VE\
    \ al positivo, -VE al negativo): inicialmente debe leer resistencia baja, que\
    \ aumenta progresivamente al cargarse los condensadores de los dispositivos [F6].\n\
    \   - Si indica diodo en polarización directa en este paso → uno o varios dispositivos\
    \ están conectados en polaridad inversa o hay cortocircuito [F6].\n\n---\n\n##\
    \ FASE 3 — CONFIGURACIÓN CON CLSS\n\n### Preparación previa [F14]\n\n1. En el\
    \ portal en la nube de CLSS, crea un sitio/edificio y añade una central.\n2. Carga\
    \ la configuración con el programa de configuración de CLSS.\n3. Genera el archivo\
    \ **.bin** de licencia de la central.\n\n### Configuración del lazo en CLSS [F9][F10]\n\
    \n1. Accede a **Ajustes → Ajustes HMI** y en **Tipo de marca** selecciona **Notifier\
    \ EN** [F9].\n2. Ve a **Ajustes de lazo** [F9]:\n   - Si el lazo **no se utiliza**:\
    \ marca ☑ **Sin Uso** [F9].\n   - Si el lazo **se utiliza**:\n     - Selecciona\
    \ **Protocolo de Lazo**: `Opal` (por defecto) o `Clip` (requiere licencia) [F9][F10].\n\
    \     - Selecciona **Límite a VdS 2540**: Sí o No (el valor de resistencia cambia\
    \ según la selección) [F9].\n     - Selecciona el **Tipo de Cable** [F9].\n  \
    \   - Introduce la **resistencia de los cables de lazo** [F10].\n3. Envía el archivo\
    \ de configuración a la central (pasos 01 a 04 de \"Enviar configuración a la\
    \ central\") [F9].\n\n> ℹ️ De forma predeterminada, la central tiene licencia\
    \ para el modo **Protocolo avanzado OPAL** únicamente. Para usar CLIP o TC800\
    \ OPAL/CLIP se necesita licencia adicional antes de realizar la Auto Configuración\
    \ [F9].\n\n### Auto Configuración [F12]\n\n1. Selecciona **Auto Configuración**\
    \ para buscar los dispositivos conectados al circuito de lazo.\n2. Lee la información\
    \ de la ventana emergente y confirma seleccionando **Auto Configuración** [F12].\n\
    \n> ℹ️ Antes de la Auto Configuración, verifica en \"Información del sistema\"\
    \ que el módulo de lazo aparece instalado. El recuento de dispositivos será inicialmente\
    \ **0** [F11].\n\n---\n\n## Primer encendido [F1]\n\n- La primera vez que se encienda\
    \ la central, debe hacerse **sin el cableado externo conectado**, pero con la\
    \ fuente de alimentación y un circuito de lazo probado conectado [F1].\n- Conecta\
    \ el cableado del lazo, el cable HMI de la puerta a la CPU, la corriente principal\
    \ y las baterías (**2 × 12 V 24 Ah** para E10/E15) [F1].\n\n---\n\n**Fuentes:**\n\
    - HOP-138-8ES issue 6, 01-2026 (Instrucciones de puesta en marcha INSPIRE E10/E15)\n\
    - HOP-138-9ES issue 5, 11-2025 (Manual de instalación INSPIRE E10)\n- 4188-1132-ES\
    \ issue 3, 04-2025 (Guía rápida CLSS-10)\n\n---\n\U0001F4D6 **Información adicional\
    \ del manual:**\n- \"- Left side: CPU module with 6 connection terminals and external\
    \ wiring connection point ②\n- Center top: HMI cable connection detail showing\
    \ CPU with points \"a\" and \"b\" marked as ①\n- Center middle: Central unit internal\
    \ view showing wiring connections with color-coded wires (brown, yellow/green,\
    \ blue) connecting to L and N terminals, marked as ②\n- Right side: Power supply\
    \ terminal block showing L (brown wire) and N (blue wire) connections with earth\
    \ (yellow/green wire)\n- Bottom center: Battery connection diagram showing 2 x\
    \ 12 V 24 Ah batteries with positive and negative terminals, marked as ③\n- Bottom\
    \ right: Circular detail view showing battery terminal connection with + and -\
    \ markings]\" [F1]"
