- qid: hp014
  question: ¿Cómo se conecta un módulo de aislamiento de línea en un lazo ID2000?
  answer: "## Conexión del módulo de aislamiento de línea en lazo ID2000\n\nLos aisladores\
    \ son **obligatorios** en cada lazo analógico de la ID2000 [F5]. A continuación,\
    \ los puntos clave de instalación y conexión:\n\n---\n\n### Regla de posicionamiento\
    \ (requisito EN54-2)\n\n- Máximo **32 equipos de lazo entre aisladores** según\
    \ EN54-2: 12.5.2 [F5]\n- En la central ID2000: **no más de 25 equipos entre aisladores**\
    \ [F5]\n- Si se utilizan **aisladores tipo FET**: máximo **20 equipos entre aisladores**\
    \ [F5] [F3]\n\n---\n\n### Terminales del aislador\n\nEl aislador dispone de **4\
    \ terminales numerados: 1, 2, 3 y 4** [F3].\n\nPara las comprobaciones previas\
    \ del lazo, se cortocircuitan temporalmente los **terminales 2 y 4** de cada aislador\
    \ [F3].\n\nEl esquema de conexionado del aislador en el lazo aparece en la ilustración\
    \ de la sección 8.4.2 del manual [F3]. Para el detalle exacto del conexionado\
    \ (qué terminal es entrada y cuál es salida), **consulta el diagrama de la figura\
    \ de la página 41 del manual MIDT180**, ya que las marcas de asignación de terminales\
    \ no son completamente legibles en el fragmento recuperado.\n\n---\n\n### Procedimiento\
    \ de verificación del lazo con aisladores instalados\n\n1. **Antes de conectar\
    \ el panel**: desconecta los aisladores cortocircuitando los terminales **2 y\
    \ 4** de cada aislador [F3].\n   > ⚠️ El cableado del lazo **DEBE desconectarse\
    \ del panel** durante este procedimiento [F3].\n\n2. Comprueba la continuidad\
    \ de cada extremo del lazo y mide la resistencia final de línea [F3]:\n   - Con\
    \ placa base y LIB, para detección de dirección duplicada: **< 14,5 Ω** [F3]\n\
    \   - Con placa base y LIB, sin detección de dirección duplicada: **< 28,5 Ω**\
    \ [F3]\n   - Valores alternativos (segunda configuración): **< 18,5 Ω** (con duplicada)\
    \ / **< 35,5 Ω** (sin duplicada) [F3]\n\n3. Con multímetro en modo diodo, conecta\
    \ en **polaridad invertida** (+ al lazo -, y - al lazo +): debe indicar diodos\
    \ polarizados en paralelo [F3].\n\n4. Con multímetro en **polaridad normal**:\
    \ la resistencia debe aumentar progresivamente mientras se cargan los condensadores\
    \ de los equipos. Si indica un único diodo polarizado, hay un equipo con polaridad\
    \ invertida [F3].\n\n5. Comprueba que **no hay continuidad entre la pantalla del\
    \ cable y los conductores + o -** [F3].\n   > **Nota:** La pantalla solo debe\
    \ conectarse a tierra **en el panel** [F3].\n\n---\n\n### Conexión al panel (tras\
    \ verificación)\n\n1. **Retira las conexiones temporales** (cortocircuitos en\
    \ terminales 2 y 4) de todos los aisladores [F1].\n2. Conecta el cableado del\
    \ lazo al panel verificando que **los extremos A y B se conectan en los terminales\
    \ correctos** (polaridad) [F1].\n\n---\n\n### Datos de cableado del lazo\n\n-\
    \ Longitud máxima del lazo: **2000 metros** [F3]\n- Sección mínima de cable: **1,5\
    \ mm²** [F3]\n- Resistencia máxima del lazo: **35 Ω** [F11]\n- Capacidad máxima\
    \ del cable: **< 0,5 µF** [F11]\n- Sección de cable admitida en terminales: **0,5\
    \ mm² a 2,5 mm²** [F12]\n\n---\n\n> ⚠️ **NO utilices nunca un multímetro de alta\
    \ tensión (tipo \"Megger\") en el lazo** [F5].\n> ⚠️ **NUNCA conectes las baterías\
    \ antes que la fuente de alimentación principal** [F1].\n\n---\n\n**Fuente:**\
