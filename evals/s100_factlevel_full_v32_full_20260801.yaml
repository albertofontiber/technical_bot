- qid: cat021
  question: Necesito un detector de llama SharpEye «40/40» (Spectrex / Notifier) para
    una instalación; ¿qué modelo pido?
  answer: 'La familia SharpEye "40/40" tiene **varias variantes con tecnología de
    detección distinta y no son intercambiables**. Necesito que me indiques el tipo
    de riesgo/combustible y el entorno para orientarte al modelo correcto.


    Estas son las variantes presentes en la documentación:


    - **S40/40I** — Detector de llama de **triple espectro infrarrojo (IR3)** [F1].
    Indicado para hidrocarburos en general.


    - **S40/40L / LB / L4 / L4B** — Detector de llama **UV/IR** [F2]. Cuatro subvariantes
    según longitud de onda IR (2,8 µm o 4,5 µm) y con o sin BIT incorporado [F9].


    - **S40/40U / UB** — Detector de llama **UV** [F5]. Dos subvariantes: sin BIT
    (U) o con BIT incorporado (UB) [F8].


    - **S40/40R** — Detector de llama **infrarrojo simple (Single IR)** [F3].


    - **S40/40M** — Detector de llama de **múltiple infrarrojo**, específico para
    **llamas de hidrógeno e hidrocarburo** [F4].


    Además, los documentos de referencia mencionan dos variantes adicionales de las
    que no tengo ficha detallada en los fragmentos recuperados:

    - **TM40/40UFI** — SharpEye Ultra Fast IR3 [F7]

    - **TM40/40UFL** — SharpEye Ultra Fast UV/IR [F7]


    ---


    Para orientarte al modelo correcto, dime:

    1. **¿Qué combustible/riesgo** hay en la instalación? (hidrocarburo, hidrógeno,
    alcohol, otro)

    2. **¿Zona ATEX o no?** ¿Qué clasificación de zona?

    3. **¿Necesitas BIT** (prueba incorporada automática)?

    4. **¿Entorno interior o exterior?** ¿Hay posibles falsas alarmas por luz solar
    u otras fuentes UV/IR?


    Con esos datos te indico el modelo y el código de pedido exacto (carcasa, entrada
    de cable, homologación).


    ---


    Fuentes: MNDT721_40-40I; MNDT722_40-40L; MNDT723_40-40U; MNDT724_40-40R; MNDT725_40-40M;
    manual-sharpeye-40-40-series-winhost-spectrex-en-us-4845694 (rev. TM777050 Rev.
    Da, octubre 2017)'
