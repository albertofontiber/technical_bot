- qid: cat010
  question: ¿Cómo se alimenta la sirena/avisador intrínsecamente seguro IS-mA1 en
    una zona peligrosa (ATEX) y cuáles son sus parámetros de seguridad intrínseca
    de entrada?
  answer: '## Alimentación e Parámetros de Seguridad Intrínseca del IS-mA1


    El IS-mA1 se alimenta desde zona segura mediante una barrera Zener o aislador
    galvánico certificado ATEX/IECEx, con una fuente de **24V dc** que llega al equipo
    a través de una barrera de **28V / 93mA** [F9][F10].


    ---


    ### Certificación ATEX


    - **Clasificación:** `II 1G Ex ia IIC T4 Ga` [F9]

    - **Temperatura ambiente:** -40°C ≤ Ta ≤ +60°C [F9]

    - **Certificado:** SIRA 05ATEX2084X (Notified Body: Sira) [F9]

    - **Normas de cumplimiento:** EN IEC 60079-0:2018, EN60079-11:2012, IEC60079-26:2014
    [F9]

    - **Uso permitido:** Zonas 0, 1 y 2 con gases y vapores inflamables, grupos IIA,
    IIB e IIC, clases de temperatura T1 a T4 [F1]


    ---


    ### Parámetros de Seguridad Intrínseca de Entrada


    **Terminales + respecto a – (alimentación principal):**

    - **Ui = 28 V** [F1][F2]

    - **Ii = 93 mA** [F1][F2]

    - **Pi = 660 mW** [F1][F2]

    - **Ci = 0** [F1][F2]

    - **Li = 0** [F1][F2]


    **Terminales S2 y S3 respecto a – (cambio de tono/etapa de alarma):**

    - **Ui = 28 V** [F1][F5]

    - **Ii = 0 mA** [F1][F5]

    - **Ci = 0** [F2]


    > ⚠️ Dado que la corriente de entrada permitida en S2/S3 es **cero**, estos terminales
    **solo pueden conectarse** a: barrera de diodo de retorno, relé intrínsecamente
    seguro o aislador galvánico, todos certificados por un Organismo Notificado. Solo
    se admiten barreras de diodo de retorno con **caída de tensión inferior a 0,9
    V** [F5].


    ---


    ### Aparato Asociado Requerido (zona segura)


    **Opción A — Aislador galvánico** (alimentación principal) [F2]:

    - Uo ≤ 28 V

    - Io ≤ 93 mA

    - Po ≤ 660 mW

    - Co ≥ Ccable

    - Lo ≥ Lcable


    **Opción B — Barrera Zener de diodo shunt** (alimentación principal) [F3]:

    - Uo ≤ 28 V

    - Io ≤ 93 mA

    - Po ≤ 660 mW

    - Co ≥ Ccable

    - Lo ≥ Lcable


    Para S2/S3 con barrera Zener: se usa **barrera de diodo de retorno** con Uo ≤
    28 V, Io = 0 [F3].


    ---


    ### Restricción de Capacitancia de Cable


    > ⚠️ La capacitancia total conectada a los terminales +/– (Ccable + cualquier
    otra capacitancia) **no debe superar 83 nF** [F2][F3].


    ---


    ### Configuración de Alarma Multietapa


    - Conectar **S2 a 0V** activa la **segunda etapa de alarma** [F8]

    - Conectar **S3 a 0V** activa la **tercera etapa de alarma** [F8]

    - Para alarma de una sola etapa: basta con una barrera Zener de canal único [F7]

    - Para alarma de dos etapas: se puede usar un paquete que combine la barrera 28V/93mA
    y un canal de diodo de retorno [F8]


    ---


    ### Advertencias Adicionales


    - La instalación debe realizarla personal cualificado [F1]

    - Las reparaciones solo puede realizarlas el fabricante o según el código de práctica
    aplicable [F1]

    - **Desconectar la alimentación antes de cualquier intervención** para evitar
    ignición de atmósferas inflamables [F2]

    - La sustitución de componentes puede comprometer la seguridad intrínseca [F2]

    - La carcasa es de **plástico ABS** — protegerla de sustancias agresivas [F1]

    - La distancia entre terminales S2 y S3 es **inferior a 6 mm** — precaución en
    el conexionado [F2]

    - El certificado lleva sufijo **''X''**, lo que indica condiciones especiales
    de uso seguro — consultar el certificado SIRA 05ATEX2084X [F1]


    ---


    **Fuentes:** IS5001-F_IS-mA1_EN (Issue F, 06-08-15); manual IS MA1 (Issue H, 03-01-2020)


    ---

    ⚠️ **Información adicional del manual:**

    - "CAUTION - The clearance between sounder terminals S2 and S3 is less than 6mm."
    [F3]

    - "CAUTION - Bonding between conduit connections is not automatic and must be
    provided as part of this installation." [F3]


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "The IS-mA1 minialarm is an ATEX and IECEx certified intrinsically safe sounder
    which produces a loud warning signal in a hazardous area." (manual IS MA1, p.
    1) [F9]

    - "The IS-mA1 minialarm is an ATEX and IECEx certified intrinsically safe sounder
    which produces a loud warning signal in a hazardous area." (IS5001-F_IS-mA1_EN,
    p. 1) [F10]'
