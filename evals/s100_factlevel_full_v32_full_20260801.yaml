- qid: cat018
  question: ¿Como se programa una ecuacion causa-efecto (CBE) en la Notifier AM-8200
    para que un evento active una salida?
  answer: '# Programación de ecuación CBE en AM-8200 para activar una salida


    La CBE (Control By Event) se programa en la **Pestaña Programación** del punto
    de salida (módulo de salida), en el campo **CBE** [F1]. A continuación el procedimiento
    completo:


    ---


    ## Paso 1 — Acceder al campo CBE del módulo de salida


    1. Navega a **MENU PROGRAMMAZIONE \ Punti** y selecciona el módulo de salida [F1].

    2. Ve a la pestaña **Programmazione** [F1].

    3. Con las teclas **▲▼** selecciona el campo **CBE** [F1].

    4. Pulsa la tecla de confirmación **☑** para entrar en edición [F1].


    ---


    ## Paso 2 — Introducir la ecuación CBE


    La longitud máxima de una CBE es de **64 caracteres** [F1]. Usa el teclado alfanumérico
    para escribir la ecuación y pulsa **Enter** para confirmar [F1].


    La ecuación define qué evento activa la salida. Los operadores disponibles son
    [F8]:


    **OR** — activa la salida si **al menos uno** de los operandos está activo [F8]:

    - Ejemplo: `OR (G9 G15 G23)` → si cualquiera de los grupos G9, G15 o G23 está
    en alarma, la salida se activa [F8].

    - El operador OR puede omitirse: `(G9 G15 G23)` es equivalente [F8].


    **AND** — activa la salida solo si **todos** los operandos están activos [F8]:

    - Ejemplo: `AND (G9 G15 G23)` → solo si G9, G15 y G23 están simultáneamente en
    alarma [F8].


    **NOT** — **niega** el operando; la salida está activa hasta que el operando entre
    en alarma [F8]:

    - Ejemplo: `NOT (G23)` → la salida se desactiva cuando G23 entra en alarma [F8].


    **XGRP** — activa la salida si **al menos dos** elementos del grupo indicado están
    activos (doble coincidencia) [F9]:

    - Formato: `XGRP (GXXX)` donde GXXX = Grupo 1 ÷ 400 [F9].

    - **Nota:** No se permite usar más de un grupo con XGRP. `XGRP (G23 G24)` no está
    permitido [F9].


    ---


    ## Paso 3 — Reglas de restricción de índices de grupo (importante)


    El manual establece restricciones según el tipo de grupo [F8]:


    **Para grupos directos:**

    - No se permite que los operandos dentro del paréntesis sean grupos con índice
    **menor** que el grupo al que se asocia la CBE [F8].

    - ❌ CBE no permitida: `G33 = (G23 G24)`

    - ✅ CBE permitida: `G21 = (G23 G24)` [F8]


    **Para grupos inversos:**

    - No se permite que los operandos sean grupos con índice **mayor** que el grupo
    al que se asocia la CBE [F8].

    - ❌ CBE no permitida: `G305 = (G306 G307)`

    - ✅ CBE permitida: `G307 = (G305 G306)` [F8]


    ---


    ## Paso 4 — Caso especial: OR de muchos grupos (función predeterminada)


    Si necesitas un OR de muchos grupos y la memoria no lo permite, puedes usar **grupos
    inversos intermedios** [F10]:


    - `G301 = OR (G1 G2 G3 G4 G5 G6 G7 G8)`

    - `G302 = OR (G9 G10 G11 G12 G13 G14 G15 G16)`

    - `L01M01 = CBE = OR (G301 G302)` [F10]


    ---


    ## Paso 5 — Consideración sobre módulos de salida sin CBE


    Si un módulo de salida **no tiene CBE programada**, solo se activará si tiene
    un **TIPO ID para señalizaciones generales**. Si no tiene ese tipo ID, la salida
    **no se activará nunca** sin una CBE [F8].


    > ⚠️ **Nota importante:** La central **no permite programar una ecuación CBE**
    en un módulo de salida que ya tenga un TIPO ID para señalizaciones de carácter
    general [F8].


    ---


    > 📖 Para la referencia completa de todos los operadores y ejemplos avanzados,
    consulta el **Apéndice «A» Control By Event** al final del manual [F1].


    ---


    Fuente: AM-8200 Manual de programación — Doc. M-162.1-AM8200-ESP Rev A.3 (Honeywell
    Life Safety Iberia)


    ---

    📋 **Información adicional del manual:**

    - Nota: el manual también indica: "Si **CUALQUIERA** de los tres operandos de
    esta ecuación (G9 G15 G23) está en alarma, el módulo de salida se activará, es
    decir:" [F8] · "- **SI** el grupo software 9 está en alarma, o

    - **SI** el grupo software 15 está en alarma, o

    - **SI** el grupo software 23 está en alarma

    - **ENTONCES** este módulo de salida se activará." [F8]

    - "**Zona** - número de zona asignada


    **CBE** - ecuación CBE del punto." [F1]'
