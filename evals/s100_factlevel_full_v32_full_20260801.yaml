- qid: hp011
  question: En la Morley RP1r, después de descargar la extinción el sistema no vuelve
    a estado normal tras resetear. ¿Qué comprobar?
  answer: '# RP1r-Supra: Sistema no vuelve a estado normal tras resetear después de
    extinción


    El problema más probable es que exista una condición enclavada activa que impide
    el restablecimiento completo. Comprueba los siguientes puntos en orden:


    ---


    ## 1. Verifica si el rearme está inhibido por parámetro de configuración


    El parámetro **r.i** (Rearme inhibido tras extinción) puede estar configurado
    para bloquear el rearme durante un intervalo de tiempo [F13]:


    - **Valor `- -`**: Rearme inhibido hasta finalizar extinción o hasta que se agote
    el tiempo configurado en el parámetro **t.A**

    - **Valor `00`**: Rearme permitido en cualquier momento *(valor por defecto)*

    - **Valores `01` a `30`**: Rearme inhibido durante ese número de minutos


    → Accede al modo de programación y verifica el valor del parámetro **r.i**. Si
    está en `- -` o en un valor de 01 a 30, espera a que expire el tiempo o ajusta
    el parámetro.


    ---


    ## 2. Comprueba si hay averías enclavadas en circuitos supervisados


    Por defecto, **todas las averías son enclavadas y requieren rearme manual** [F3].
    Si alguna condición de avería persiste físicamente, el rearme no restablecerá
    el estado normal. Revisa los LEDs del panel:


    - **LED "Avería circuito extinción" intermitente** → Fallo en circuito de extinción
    1 o 2 (bloques 1/2) [F4]

    - **LED "Avería Disp. Manual" fijo** → Fallo en entrada extinción manual AUX.MAN.REL.
    (bloque A) [F4]

    - **LED "Avería en paro" intermitente + LED "Paro" fijo** → Fallo en pulsador
    ABORT (bloque D) — **este circuito requiere rearme manual obligatorio, no admite
    rearme automático** [F4]

    - **LED "Avería presión baja" intermitente** → Señal LOW PRESS SWITCH activa (bloque
    H) [F3]

    - **LED "Avería presión flujo" intermitente** → Señal FLOW PRESS SWITCH activa
    (bloque I) [F3]

    - **LED "Sirenas fallo/anuladas" intermitente** → Fallo en circuito de sirenas
    SND1/SND2 (bloques 5/6) [F4]


    → Identifica qué LED está activo, localiza la causa física (presión, cableado,
    pulsador) y resuélvela antes de rearmar.


    ---


    ## 3. Comprueba el estado del pulsador ABORT específicamente


    Si el pulsador de paro de emergencia (ABORT, bloque D) fue accionado durante la
    secuencia, **este circuito inhibe totalmente la lógica de extinción y requiere
    reseteo manual obligatorio** según la norma **UNE-EN 12094-1:2004, apartado 4.1.7**
    [F5]. No admite rearme automático [F4].


    → Verifica que el pulsador ABORT esté físicamente liberado y en reposo antes de
    intentar el rearme.


    ---


    ## 4. Procedimiento de rearme correcto


    Para rearmar la central [F3]:

    1. Accede con **nivel de acceso 2** (código de usuario válido)

    2. Pulsa la tecla **"Rearme"**

    3. Esta acción reinicia la central y restablece todas las entradas enclavadas


    > ⚠️ Si la condición de avería o alarma sigue presente físicamente en el campo
    (detector activo, presión baja, circuito abierto), el rearme no será efectivo
    hasta que se resuelva la causa raíz.


    ---


    ## 5. Verifica el LED "Extinción realizada"


    Tras la descarga, el LED **"Extinción realizada"** queda iluminado de forma **fija**
    y el temporizador de disparo mantiene **00 seg.** de forma fija [F2]. Este estado
    es normal post-extinción y debe desaparecer con el rearme correcto. Si persiste,
    confirma que no hay ninguna de las condiciones enclavadas descritas en el punto
    2.


    ---


    **Fuentes:**

    - HLSI-MN-103_RP1r-Supra_lr (rev. v.07, 2018-05-01)

    - HLSI-MA-103_GuiaRapida_RP1r-Supra_ES_lr (sin revisión registrada)'
