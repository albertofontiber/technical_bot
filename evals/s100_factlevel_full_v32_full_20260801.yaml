per_gold:
- qid: cat001
  question: En la Notifier PEARL, ¿cuántos equipos admite un lazo SLC y qué límites
    de cableado hay (aisladores), y cómo se dan de alta y editan esos equipos desde
    la central?
  answer: "# Notifier PEARL — Capacidad de lazo SLC, límites de aisladores y alta/edición\
    \ de equipos\n\n---\n\n## 1. Capacidad máxima por lazo\n\nLa central Pearl admite\
    \ un máximo de **318 equipos por lazo analógico**, desglosados en hasta **159\
    \ sensores + 159 módulos** (protocolo Opal) [F1].\n\nPara protocolo **CLIP**:\
    \ hasta **99 sensores + 99 módulos** por lazo [F2].\n\nEn lazos de **protocolo\
    \ mixto** (Opal + CLIP), el límite de equipos CLIP es de **40**; si se supera,\
    \ la autoconfiguración continúa pero señala fallos [F5].\n\nLímite global del\
    \ sistema (norma EN54-2): máximo **512 sensores y/o pulsadores manuales** entre\
    \ ambos lazos combinados [F1].\n\nLa **carga máxima** es de **0,75 A por lazo**\
    \ [F2].\n\n---\n\n## 2. Límites de cableado y aisladores (EN54-2)\n\nRequisito\
    \ general EN54-2 (art. 12.5.2): máximo **32 equipos entre aisladores** [F1].\n\
    \nPara la Pearl, los límites concretos son:\n\n- **Equipos sin aisladores internos**\
    \ (incluidos CLIP y algunos Opal): no más de **20 equipos entre aisladores** [F1].\n\
    - **Equipos con aisladores internos** (usados con base B501 AP): el lazo debe\
    \ cumplir los requisitos de EN54-2 (máx. 32) [F1].\n- Para **iniciar el lazo**\
    \ correctamente (cierre de aisladores al aplicar alimentación): la carga entre\
    \ aisladores no debe superar **20 unidades de carga (SU)** [F7].\n\nCargas SU\
    \ de equipos CLIP relevantes [F7]:\n- Detector por rayo LPB-700: **6 SU**\n- Sirenas\
    \ de lazo: **3 SU**\n- Módulo ZMX-1: **3 SU**\n- Módulo MMX-10M/CMX10-RM: **10\
    \ SU**\n- El resto: **1 SU**\n\nLímite de longitud total del par de lazo: **2000\
    \ metros** [F9].\n\nResistencia de cada aislador: entre **0,1 y 0,13 ohms** [F12].\n\
    \nCapacitancia del cable: inferior a **0,5 µF** [F12].\n\n> ⚠️ **NUNCA uses un\
    \ multímetro de alta tensión (tipo Megger) en el lazo de detección** [F1]. Si\
    \ hay aisladores instalados, el conductor positivo (+) del lazo estará en circuito\
    \ abierto [F1].\n\n---\n\n## 3. Alta de equipos: Autoconfiguración\n\nLa forma\
    \ más rápida de dar de alta equipos es mediante la **función de autoconfiguración**\
    \ desde el menú de la central [F3].\n\n**Pasos:**\n\n1. Accede al menú de configuración\
    \ y pulsa **1: Autoconfiguración** [F3].\n2. Selecciona si aplica a **todos los\
    \ lazos** o a un **lazo específico** [F3].\n3. Elige el modo de autoconfiguración\
    \ [F3] [F5]:\n   - **1: Todos Prot. OPAL/CLIP** → detecta duplicidades de dirección.\n\
    \   - **2: OPAL/CLIP (No detecta duplicidad)** → más rápido, sin comprobación\
    \ de duplicados.\n   - **3: Sólo con protocolo CLIP** → solo autoconfigura equipos\
    \ CLIP aunque haya Opal en el lazo.\n4. Selecciona el modo de actualización [F5]:\n\
    \   - **1: Permite Añadir/Borrar/Cambiar**\n   - **2: Sólo Añadir Nuevos Equipos**\n\
    5. El proceso se inicia automáticamente. Sensores y módulos (Opal y CLIP) se detectan\
    \ en la misma pasada [F3].\n6. Al finalizar, los resultados se muestran en pantalla\
    \ LCD por lazo. Usa las teclas **◄/►** para navegar entre lazos [F5].\n\n> **Nota:**\
    \ Si un equipo Opal se autoconfigura, por defecto será Opal. Si el número de equipos\
    \ CLIP supera 40, selecciona manualmente la opción «Sólo con protocolo CLIP» [F5].\n\
    > Los pulsadores CLIP se autoconfiguran como «MON» y deben cambiarse manualmente\
    \ a tipo «cPUL» [F10].\n\nLos resultados también pueden verse en cualquier momento\
    \ desde **nivel de acceso 2 → «Resumen de Equipos»** [F3].\n\nLa configuración\
    \ puede transferirse a un ordenador portátil con el **programa de configuración\
    \ ITS** para editarla y archivarla [F3].\n\n---\n\n## 4. Edición individual de\
    \ equipos\n\nDesde el menú de configuración es posible editar individualmente\
    \ cada sensor o módulo [F4].\n\n**Para sensores**, los parámetros editables incluyen\
    \ [F4]:\n- Tipo de equipo\n- Zona (hasta 255 locales o 8192 de red)\n- Número\
    \ de células (hasta 255)\n- Ajuste de nivel de alarma, prealarma y alarma horaria\n\
    - Retardo de alarma\n- Retardo de confirmación de coincidencia de detector (hasta\
    \ **240 s / 4 min**)\n- Prioridad de interrogación (solo CLIP, limitada a **30\
    \ equipos**)\n- Grupo AWACS (50 grupos, todos los sensores CLIP salvo HEAT)\n\
    - Programación horaria de sensibilidad\n- Acción de parpadeo y color LED (solo\
    \ Opal)\n- Ajuste no silenciable para LED remoto (solo Opal)\n- Opciones VIEW,\
    \ Optiplex y SMART; modo solo térmico (L6); número de aplicación (solo SMART 4)\n\
    \n**Para módulos**, los parámetros editables incluyen [F10]:\n- Tipo de equipo\
    \ y zona\n- Número de células (hasta 255)\n- Prioridad de interrogación (solo\
    \ CLIP, limitada a **30 equipos**)\n- Función de subdirecciones (entrada/salida)\n\
    - Ajuste de acción de fallo (alarma o avería)\n- Supervisión de cortocircuito\
    \ o circuito abierto\n- Periodo de retardo de confirmación de alarma\n- Ajuste\
    \ de entrada enclavada\n- Asignación para alimentación de potenciador de lazo\n\
    - Ajuste no silenciable para LED remoto (solo Opal)\n\n> ⚠️ Los periodos de retardo\
    \ de alarma configurables en entradas pueden contravenir los requisitos de EN54-2\
    \ [F10].\n\n---\n\n**Fuentes:**\n- Manual de instalación y puesta en marcha PEARL,\
    \ ref. 997-669-005-3 (sin revisión registrada)\n- Manual de configuración de la\
    \ central PEARL, ref. 997-671-005-3 (rev. 997-671-005-3)\n\n---\n⚠️ **Información\
    \ adicional del manual:**\n- \"La resistencia máxima del lazo no debe superar\
    \ los límites definidos en **«6.4.2 Comprobaciones del lazo antes de conectar\
