- qid: hp012
  question: ¿Cuántos lazos direccionables soporta la Notifier AM2020/AFP1010 y cuántos
    dispositivos por lazo?
  answer: '## Capacidad de lazos y dispositivos — AM2020 / AFP1010


    ### Número de lazos SLC


    - **AM2020**: soporta hasta **10 lazos SLC** [F8]. Pueden emplearse de uno a cinco
    LIB-400s, o de uno a diez LIB-200s o LIB-200As [F4].

    - **AFP1010**: soporta un máximo de **dos LIB-400s (un total de cuatro SLCs)**
    [F4]. Además, el AFP1010 está limitado a un máximo de **dos LIB-200** [F1].


    ### Dispositivos por lazo


    Cada lazo SLC soporta [F8]:

    - Hasta **99 detectores analógicos**

    - Hasta **99 módulos** (monitores o de control), en combinación


    Esto se confirma también en [F4]: "La capacidad de cada LIB incluye hasta 99 detectores
    inteligentes, y una combinación adicional de hasta 99 estaciones direccionables,
    y los módulos de monitoreo y los de control."


    ### Total de dispositivos en el sistema


    - **AFP1010** con dos LIB-200: máximo **396 dispositivos en el sistema** [F1].

    - **AM2020** con 10 lazos: el manual no especifica un total global de dispositivos
    en los fragmentos disponibles, pero se puede calcular a partir de los 99+99 por
    lazo × 10 lazos.


    > ⚠️ Nota: el dato de 396 dispositivos para el AFP1010 aparece literalmente en
    [F1]; el cálculo para el AM2020 no está expresado como total global en ningún
    fragmento.


    ---


    **Fuente:** Manual AM2020/AFP1010 PN 15088SP (sin revisión registrada); Manual
    MFDT280 (sin revisión registrada); Manual MPDT280 rev. Rev A


    ---

    📋 **Obligaciones de evidencia del manual:**

    - Nota: la fuente es inconsistente: "La figura 13 representa un gabinete CAB-A3
    utilizado con los módulos del LIB-400 exclusivamente, lo que significa que puede
    dar alojo a un máximo de cuatro lazos del sistema AFP1010." (15088SP, p. 30) [F6]
    declara 4 lazos y la enumeración servida lista 2 (15088SP, p. 30) [F6].

    - Nota: la fuente es inconsistente: "La AM2020 puede soportar hasta 10 lazos,
    cada uno de los cuales soporta hasta 99 detectores analógicos y 99 módulos monitores
    o de control." (MFDT280, p. 4) [F8] declara 10 lazos y la enumeración servida
    lista 3 (MFDT280, p. 4) [F8].

    - Derivación declarada según (15088SP, p. 61) [F4]: 4 × (99 + 99) = 792 — operandos
    citados: "total de cuatro SLCs", "hasta 99 detectores" y "hasta 99 estaciones".'
