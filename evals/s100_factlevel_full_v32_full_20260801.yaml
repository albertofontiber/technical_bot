- qid: cat016
  question: En la Detnov CAD-150, ¿como se da de alta un detector nuevo en el lazo
    y como se prueba que funciona?
  answer: "# CAD-150-8: Alta de detector nuevo en el lazo y prueba de funcionamiento\n\
    \n## PARTE 1 — Dar de alta un detector nuevo (autobúsqueda de lazo)\n\nEl procedimiento\
    \ para incorporar un nuevo detector al lazo es mediante la **autobúsqueda**, que\
    \ escanea el lazo y registra todos los elementos presentes [F1]:\n\n1. Accede\
    \ al **menú BUCLE** desde el teclado de la central [F1].\n2. Ejecuta la **autobúsqueda\
    \ del lazo** correspondiente. El sistema escaneará el lazo y mostrará todos los\
    \ elementos que detecte [F1].\n3. Verifica que los elementos encontrados coinciden\
    \ con los planos de la instalación [F1].\n4. Una vez confirmada la autobúsqueda,\
    \ accede al **menú ELEMENTOS** para:\n   - Asignar un **nombre identificativo**\
    \ al nuevo detector [F1].\n   - Asignarle una **zona** de ubicación [F1].\n5.\
    \ Si el detector debe pertenecer a una zona nueva o existente, accede al **menú\
    \ ZONA** para crear o asignar zonas [F1].\n\n> **Nota:** La configuración puede\
    \ realizarse desde el teclado de la central o mediante el software de configuración,\
    \ siendo este último más sencillo y rápido [F7].\n\n---\n\n## PARTE 2 — Verificar\
    \ el estado del detector recién dado de alta\n\nAntes de hacer la prueba funcional,\
    \ puedes comprobar el estado del elemento desde el **menú ELEMENTO → VER** [F4]:\n\
    \n- **BUCLE**: selecciona el bucle al que pertenece el detector [F4].\n- **DIR**:\
    \ dirección del detector en el lazo [F4].\n- **ZONA**: zona asignada [F4].\n-\
    \ **TIPO**: tipo de elemento (óptico, térmico, etc.) [F4].\n- **MODO**: estado\
    \ actual (conectado, desconectado, en prueba) [F4].\n- **VA**: valor analógico\
    \ del elemento [F4].\n- **TEXTO**: denominación asignada [F4].\n\nUsa las teclas\
    \ `<->` y `<+>` para navegar entre elementos [F4].\n\n---\n\n## PARTE 3 — Probar\
    \ el detector sin rearmar la central (modo PRUEBA de zona)\n\nEl método recomendado\
    \ para probar el detector sin interrumpir el sistema es el **modo PRUEBA de zona**\
    \ [F2]:\n\n1. Accede al **menú ZONA → Prueba** [F2].\n2. Selecciona el **rango\
    \ de zonas** a poner en prueba (campo `RANGO`) [F2].\n3. El sistema preguntará\
    \ si deben activarse las sirenas:\n   - **SI**: las sirenas se activarán unos\
    \ segundos tras la entrada en alarma del detector y se silenciarán automáticamente\
    \ [F2].\n   - **NO**: la prueba se realiza sin activar sirenas [F2].\n4. Activa\
    \ el detector (por ejemplo, con aerosol de prueba o fuente de calor según el tipo).\n\
    5. Verifica que la central registra la alarma del detector.\n\n> **Importante\
    \ — Retardo de sirenas:** Si existe algún retardo configurado en las sirenas,\
    \ en modo prueba queda **anulado automáticamente** para agilizar la verificación\
    \ [F2].\n\n> **Tiempo límite:** Si transcurren **20 minutos** desde la activación\
    \ del modo prueba sin que se produzca ningún disparo de alarma, el sistema **vuelve\
    \ automáticamente al estado normal**, cancelando el modo prueba [F2].\n\n**Para\
    \ salir del modo prueba:** Conecta la zona desde el menú ZONA → Conectar [F2].\n\
    \n---\n\n## PARTE 4 — Prueba general del sistema (puesta en marcha)\n\nComo verificación\
    \ final tras el alta del detector [F8]:\n\n- Provoca una alarma y verifica que\
    \ se activa el **relé de alarma** [F8].\n- Verifica que las **salidas de sirena**\
    \ se activan una vez transcurrido el tiempo de retardo programado [F8].\n- Verifica\
    \ que al provocar una avería se activa el **relé de avería** [F8].\n\n---\n\n\
    **Códigos de acceso de fábrica** (necesarios para acceder a los menús) [F8]:\n\
    - Nivel usuario: **1111**\n- Nivel instalador: **2222**\n\n---\n\n**Fuentes:**\n\
    - `55315013 Manual Centrales Analógicas CAD-150-8 Instalación ES FR GB IT` (sin\
    \ revisión registrada)\n- `55315008 Manual Centrales Analógicas CAD-150-8 Usuario\
    \ ES FR GB IT` (sin revisión registrada)\n\n---\n⚠️ **Información adicional del\
    \ manual:**\n- \"En caso de necesidad, se puede encender el equipo solo con las\
    \ baterías conectadas, pero es imprescindible pulsar sobre el pulsador BAT para\
    \ arrancar el equipo.\" [F7]"
