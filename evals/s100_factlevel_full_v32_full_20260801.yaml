- qid: hp005
  question: En la Notifier ID3000, ¿cómo se programa una zona para que active una
    salida de sirena solo cuando haya coincidencia de dos detectores?
  answer: '# Programación de coincidencia de dos detectores para activar sirena —
    ID3000


    La función que necesitas es **Coincidencia de 2 equipos** en la Matriz de Control.
    Cuando está activa, deben activarse las alarmas de dos equipos de la misma zona
    antes de que se active la salida [F1].


    ---


    ## Pasos de programación


    ### Paso 1 — Acceder a la Matriz de Control


    Accede a la Matriz de Control desde el menú **Parámetros Sistema** → **Matriz
    de control** [F12]. También puedes acceder pulsando **F6** durante la edición
    de sensores o módulos [F11].


    ---


    ### Paso 2 — Crear dos instrucciones de Matriz de Control


    ⚠️ **PRECAUCIÓN (EN54-2: 7.1.4):** No incluyas pulsadores manuales (MCP/PUL) en
    el grupo de coincidencia [F1][F3]. Para evitarlo, debes crear **dos instrucciones
    separadas**:


    **Instrucción 1 — Para pulsadores manuales (sin coincidencia):**

    - Define la entrada de tipo **Pulsador Manual (MCP)** como **Simple** (sin coincidencia)
    [F1].


    **Instrucción 2 — Para detectores (con coincidencia):**

    - Define la entrada de tipo **ANALÓGICA** (que incluye detectores TÉRMICOS, IÓNICOS,
    ÓPTICOS, VIEW y MULTISENSOR) con coincidencia activada [F1].


    ---


    ### Paso 3 — Configurar la entrada de la Instrucción 2


    Al crear/editar la entrada de la instrucción 2 [F4]:


    1. **Selecciona la central** (si es red) o continúa si es panel único.

    2. **Especifica la zona:** elige **Zona(s) específica(s)** con el rango de la
    zona donde están los detectores. En la ventana de selección de zona, activa la
    opción de **Coincidencia** [F4].

    3. **Selecciona el tipo de equipo:** elige el tipo analógico correspondiente (p.
    ej., ÓPTICO, TÉRMICO, etc.) [F3].

    4. **Selecciona el tipo de coincidencia:** en el menú "Indique tipo de coincidencia",
    selecciona la opción **2: COINCIDENCIA 2 EQUIPOS** [F3].


    > **Nota:** La opción "COINCIDENCIA 2 EQUIPOS" siempre está disponible sin necesidad
    de configuración previa adicional en los ajustes de la central [F3].


    ---


    ### Paso 4 — Definir la salida (sirena)


    Configura la salida de esta instrucción apuntando al circuito de sirena correspondiente.
    La función **EVACUAR** acciona todos los circuitos de sirena configurados como
    salida de sirena (no como relés) [F11].


    ---


    ### Paso 5 — Verificar el comportamiento de coincidencia


    Para que la coincidencia se cumpla, los dos detectores en alarma deben estar en
    la **misma zona o subzona** [F3]. El comportamiento en subzonas (misma subzona
    o rango de subzonas) se configura en **Sección 11.21** de los ajustes de la central
    [F3][F7].


    ---


    ## Resumen del comportamiento


    - **1 detector en alarma** → estado de **PRIMERA ALARMA**, la sirena NO se activa.

    - **2 detectores en alarma en la misma zona** → coincidencia cumplida → **sirena
    ACTIVA** [F8].


    ---


    ## Nota sobre conflictos de coincidencia


    Si los detectores tienen configuraciones de coincidencia distintas entre sí, la
    resolución es: si **cualquiera** de las configuraciones de los dos sensores establece
    que se ha cumplido la coincidencia, ésta se cumple [F8].


    ---


    Fuentes:

    - MCDT190 (sin revisión registrada)

    - MCDT191 (sin revisión registrada)

    - MPDT190 (sin revisión registrada)

    - MADT190_14 (sin revisión registrada)'
