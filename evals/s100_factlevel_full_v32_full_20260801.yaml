  question: Tengo una central Detnov CAD-150 y me ha sobrado de otra instalacion un
    detector optico Notifier SDX-751; ¿es compatible / puedo montarlo en su lazo?
  answer: 'La respuesta directa es: **no puedo confirmar compatibilidad entre el detector
    Notifier SDX-751 y la central Detnov CAD-150**, porque los fragmentos disponibles
    no contienen ninguna lista de equipos compatibles con la CAD-150.


    Lo que sí aparece en los fragmentos:


    - El **SDX-751** aparece mencionado como detector analógico fotoeléctrico de bajo
    perfil compatible con las centrales **AFP-200** [F1][F4] e **ID-200** [F2][F5]
    de Notifier, y también figura en la lista de equipos de lazo de la **ID3000**
    de Notifier [F3].

    - Los fragmentos de la **CAD-150-8** recuperados [F6][F7][F8][F9][F10] corresponden
    a menús de usuario, descripción del teclado y procedimientos de operación, pero
    **no incluyen ninguna lista de detectores o equipos compatibles con su lazo**.


    Por tanto, no tengo en los fragmentos disponibles ningún dato sobre qué detectores
    son compatibles con el lazo de la CAD-150. Consulta directamente la documentación
    técnica de Detnov para la CAD-150 (lista de equipos de lazo compatibles) o contacta
    con el soporte técnico de Detnov antes de instalar el SDX-751 en esa central.


    Fuente: MNDT120 (AFP-200); MNDT150 (ID-200); MIDT190 (ID3000); 55315013 y 55315008
    (CAD-150-8) — todos sin revisión registrada.


    ---

