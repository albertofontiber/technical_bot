- qid: cat005
  question: ¿Cuáles son las características técnicas de la central de detección de
    gas Fidegas CS4, y en qué se diferencian las versiones digital y analógica?
  answer: '# Central de Detección de Gas Fidegas CS4 — Características Técnicas


    ## Especificaciones generales


    Las siguientes características son comunes a ambas versiones [F2]:


    - **Tensión de alimentación:** 110-230 Vac, 50-60 Hz

    - **Potencia:** 30 W, Clase II

    - **Sensores:** hasta 4 conexiones simultáneas (modo analógico o digital)

    - **Salidas:** 2 salidas conmutadas LP (relé apto para 230 Vac) con contactos
    NA-C-NC

    - **Corriente máxima:** 250 mA

    - **Rearme:** seleccionable manual o automático

    - **Indicaciones:** presencia, alarma y avería por sensor; avería de central;
    corte de red

    - **Dimensiones:** 90 x 106 x 58 mm

    - **Peso:** 300 g

    - **Firmware:** versión 1.2 [F3][F7]

    - **Instalación:** carril DIN o armario de superficie [F1]


    ---


    ## Diferencias entre versión digital y versión analógica


    ### Código de producto [F2]

    - **Versión digital:** 3244

    - **Versión analógica:** 3270


    ### Tipo de entrada de señal [F1]

    - **Versión digital:** entradas 0-10/15 V

    - **Versión analógica:** entradas 4-20 mA


    ### Sensores compatibles [F3]


    **Versión analógica:**

    - Sensores S/3 gases combustibles

    - Sensores S/3 y S/2 gases tóxicos

    - Sensores S/10 gases tóxicos


    **Versión digital:**

    - Sensores S/10 gases combustibles


    ---


    ## Indicaciones y funcionamiento


    - **LED verde PWR:** alimentación presente (fijo) / corte de red (intermitente)
    [F1]

    - **LED bicolor ON/ALARM por sensor:** presencia de sensor (verde) / alarma (rojo)
    [F1]

    - **LED amarillo ERROR por sensor:** avería de sensor remoto [F1]

    - **LED verde OUT1 y OUT2:** salida activa (verde) / desactivada (apagado) [F1]

    - **Avisador acústico:** apoyo sonoro a las indicaciones ópticas [F1]


    ### Umbral de alarma [F5]

    - Alarma al superar el **20% del fondo de escala**

    - Las alarmas son **enclavadas** hasta rearme manual (RESET)

    - Si la concentración no ha disminuido, la alarma puede **silenciarse durante
    24 horas** con el botón RESET, pero la central no puede rearmarse


    ### Arranque [F5]

    - Tras el encendido, el LED PWR parpadea durante **30 segundos** con las salidas
    OUT1 y OUT2 en posición NA

    - Se realiza un chequeo de memorias digitales y un test de salidas


    ---


    > **Nota sobre conexionado:** El manual incluye diagramas de conexión para sensor
    S/3 (analógico 4-20 mA) y sensor S/10 combustibles (digital). Para el detalle
    del cableado, consulta los diagramas de la sección 3 del manual físico [F4].


    Fuente: Manual de Usuario CS4 (Analógica o Digital), Rev. 2, 10/2018 — C.A.E.,
    S.L. / FIDEGAS®


    ---

    📋 **Obligaciones de evidencia del manual:**

    - Nota: la fuente es inconsistente: "Permite la conexión de hasta 4 sensores remotos
    simultaneos a través de sus 4 entradas digitales (0-10/15 v) o analógicas (4-20
    mA)." (Manual-de-Usuario-CS4, p. 4) [F1] declara 4 sensores y la enumeración servida
    lista 6 (Manual-de-Usuario-CS4, p. 4) [F1].

    - "Ningún sistema de detección de gas sustituye a una correcta instalación y mantenimiento
    de los aparatos quemadores de gas y debe ser colocado por una persona competente
    o un instalador autorizado." (Manual-de-Usuario-CS4, p. 2) [F7]'
