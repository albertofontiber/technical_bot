- qid: hp017
  question: ¿Cómo se programa el retardo de salida de alarma principal en la Notifier
    PEARL?
  answer: 'El retardo de salida de alarma principal en la Pearl **no se configura
    como un parámetro único**, sino a través de las **reglas de causa-efecto**, donde
    cada regla puede incluir un tipo de retardo de salida específico [F1].


    ## Cómo se programa el retardo de salida en la Pearl


    ### 1. Acceder a la programación de causa-efecto


    No puedo confirmar de forma segura el número de menú de Causa y Efecto con los
    fragmentos servidos. Confirma el manual y la revisión exactos antes de usar un
    número de menú.


    > ⚠️ Si no se ha transferido un archivo de configuración previo, aparecerán dos
    reglas por defecto. **Deben eliminarse si se van a crear reglas personalizadas**
    [F11].


    > ✅ **Se recomienda usar el programa de configuración por ordenador como método
    principal**. El menú de la central debe usarse solo para modificaciones menores
    [F12].


    ---


    ### 2. Asignar el tipo de retardo a la regla


    Dentro de cada regla de causa-efecto, se puede asignar **uno de seis tipos de
    retardo de salida** [F1]. Los tipos disponibles son [F1][F2]:


    - **Fijo**

    - **Estándar**

    - **No Silenc.**

    - **Est. Ext.** (Estándar Extendido)

    - **RetExtStd**

    - **No Sil. Ext**

    - **SinRetExt**


    El tipo de retardo determina qué acciones puede realizar el usuario mientras el
    retardo está activo [F1]. Las diferencias clave entre tipos son [F2]:


    - **Silenciar sirenas detiene la salida durante el retardo:** solo en tipos Estándar,
    Est. Ext. y RetExtStd ✓

    - **Retardo anulable (nivel acceso 2, opción «Anular retardos»):** en todos excepto
    Fijo ✓

    - **Tiempo restante visible en pestaña ALARMA:** en todos excepto Fijo ✓

    - **FIN RETARDO detiene el retardo activo (nivel acceso 2):** en todos excepto
    Fijo ✓

    - **AMPLIAR RETARDO detiene la salida:** solo en Est. Ext. y No Sil. Ext ✓

    - **Temporizador comienza en RETARDO AMPLIADO:** solo en RetExtStd y SinRetExt
    ✓


    ---


    ### 3. Funcionamiento del retardo en operación


    Cuando se detecta una alarma y hay un retardo activo [F4]:


    - El **LED de RETARDO ACTIVO** se enciende [F3].

    - El personal autorizado (con llave, nivel acceso 2) puede pulsar **AMPLIAR RETARDO**
    para iniciar un segundo temporizador, normalmente más largo que el primero [F4].

    - Pulsar **FIN RETARDO** (disponible en nivel de acceso 1) termina cualquier retardo
    activo e introduce la condición de alarma completa [F4].


    ---


    ### 4. Anular/habilitar los retardos desde el menú de operación


    Si necesitas anular o habilitar los retardos configurados sin modificar la programación
    [F3]:


    1. Accede al **Menú Anular/Habilitar**.

    2. Selecciona **«5: Retardo Activación Salidas»**.

    3. Pulsa **✓** para cambiar el estado entre ANULADO y HABILITADO.

    4. Pulsa **✕** para salir.


    ---


    ### 5. Pulsador AMPLIAR RETARDO (opcional)


    El pulsador **AMPLIAR RETARDO** puede desactivarse desde los parámetros de la
    central si no se requiere en la instalación [F5]:


    - Parámetro **«10: Extend Delay Button»** → `Enabled` / `Disabled` [F5].


    ---


    > ⚠️ **Nota importante:** Los fragmentos disponibles describen los tipos de retardo
    y su comportamiento, pero **el valor numérico del tiempo de retardo** (en segundos
    o minutos) que se introduce en cada regla de causa-efecto **no aparece especificado
    en los fragmentos recuperados**. Consulta el manual de configuración completo
    para el campo de valor numérico del retardo dentro del editor de reglas.


    ---


    **Fuentes:**

    - Manual de configuración de la central Pearl, ref. 997-671-005-3_Configuration_ES
    (rev. 997-671-005-3)

    - Manual de funcionamiento Pearl, ref. 997-670-005-3_Operating_ES (sin revisión
    registrada)


    ---

    ⚠️ **Información adicional del manual:**

    - "**Al programar reglas de causa-efecto evite las lógicas contradictorias.**"
    [F12]

    - "**Es de vital importancia probar rigurosamente todas las reglas durante la
    puesta en marcha del sistema para verificar que no haya conflictos lógicos entre
    ellas.**" [F12]

    - Nota: el manual también indica: "Si no se ha transferido a la central un archivo
    de configuración, el usuario encontrará aquí las dos reglas de causa-efecto por
    defecto." [F11] · "| Acción de usuario/indicación de estado                                                                                    |
    Tipos de retardo<br/>Fijo | Tipos de retardo<br/>Estándar | Tipos de retardo<br/>No
    Silenc | Tipos de retardo<br/>Est. Ext. | Tipos de retardo<br/>RetExtStd | Tipos
    de retardo<br/>No Sil. Ext | Tipos de retardo<br/>SinRetExt |

    | -------------------------------------------------------------------------------------------------------------------------
    | ------------------------- | ----------------------------- | ------------------------------
    | ------------------------------ | ------------------------------ | --------------------------------
    | ------------------------------ |

    | La salida se detiene si se pulsa SILENCIAR SIRENAS durante el retardo. Si pulsa
    SONIDO ALARMAS, se activarán las sirenas. | ×                         | ✓                             |
    ×                              | ✓                              | ✓                              |
    ×                                | ×                              |

    | El retardo puede anularse en el nivel de acceso 2 con la opción «Anular retardos»                                         |
    ×                         | ✓                             | ✓                              |
    ✓                              | ✓                              | ✓                                |
    ✓                              |

    | El tiempo de retardo restante se muestraen la pestaña ALARLMA.                                                            |
    ×                         | ✓                             | ✓                              |
    ✓                              | ✓                              | ✓                                |
    ✓                              |

    | El retardo activo puede detenerse en el nivel de acceso 2 pulsando FIN RETARDO.                                           |
    ×                         | ✓                             | ✓                              |
