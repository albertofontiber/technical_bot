- qid: cat008
  question: ¿Cómo se cablea el módulo de entrada M710 / MI-DMMI en el lazo, y qué
    resistencias necesita (fin de línea y modo 3 estados)?
  answer: "# Conexionado del M710 / MI-DMMI en el lazo\n\nLos fragmentos cubren dos\
    \ modos de conexionado y dos valores de resistencia clave. Aquí tienes todo lo\
    \ documentado:\n\n---\n\n## Terminales de lazo (comunes a ambos modos)\n\n- **T1**\
    \ → Salida del lazo – [F6]\n- **T2** → Salida del lazo + *(con aislador interno\
    \ activo)* [F6]\n- **T3** → Entrada del lazo – [F6]\n- **T4** → Entrada del lazo\
    \ + [F6]\n- **T5** → Salida del lazo + *(alternativa sin aislador, ver nota abajo)*\
    \ [F6]\n\n> **Nota sobre el aislador interno:** Si **no** se necesita aislamiento\
    \ de cortocircuitos, conecta la salida + del lazo al **terminal 5** en lugar del\
    \ terminal 2. El terminal 5 está conectado internamente con el terminal 4 [F4][F6].\
    \ En el MI-DMMI, el terminal 5 está conectado internamente con el terminal 2 [F9].\n\
    \n---\n\n## Modo 2 estados\n\n- El **cortocircuito se señaliza como alarma** [F1].\n\
    - **Resistencia de fin de línea (RFL): 47 kΩ** [F1].\n- La entrada del dispositivo\
    \ se conecta a los terminales **6 y 7** (Entrada A) [F1].\n\n---\n\n## Modo 3\
    \ estados\n\n- Permite indicar un cortocircuito como **avería en lugar de alarma**\
    \ (siempre que el panel de control lo permita) [F4][F6].\n- **Resistencia de fin\
    \ de línea (RFL): 47 kΩ** [F1].\n- **Resistencia en serie con cada contacto de\
    \ alarma: 18 kΩ** — se conecta en serie con cada conmutador/dispositivo que se\
    \ desee supervisar [F1][F4][F6].\n  - En el M710, el modelo de resistencia especificado\
    \ es **M200E-EOL-R18** [F4][F5].\n  - En el MI-DMMI, se puede usar el pack **M200-EOL4**\
    \ [F3].\n\n---\n\n## Aviso importante sobre terminales 8 y 9\n\n- El **M710 no\
    \ tiene conexiones en los terminales 8 y 9** [F4][F5].\n- El **MI-DMMI no tiene\
    \ conexiones en los terminales 8 y 9** [F6][F7]. Esos terminales son exclusivos\
    \ de las variantes de doble entrada (M720 / MI-DMM2I / MI-DMM2IE).\n\n---\n\n\
    ## Diagrama de conexionado\n\nLos diagramas de conexión detallados (Figura 3 para\
    \ M710/M720 y Figura 3 para MI-DMMI/MI-DMM2I) están en los manuales citados. Consulta\
    \ las figuras originales para verificar la topología exacta del cableado antes\
    \ de ejecutar la instalación.\n\n---\n\n**Fuentes:**\n- Manual `Conexionado-del-modulo-M710-MI-DMMI`\
    \ (sin revisión registrada) [F1]\n- Manual `I56-2005-002 M710 M720 M721 M701`\
    \ (sin revisión registrada) [F4][F5]\n- Manual `I56-2006-004 MI-DMMI_DMM2I_D2ICMO`\
    \ (sin revisión registrada) [F2][F3][F9]\n- Manual `I56-4406-001 MI-DMMIE MI-DMM2IE\
    \ MI-D2ICMOE` (sin revisión registrada) [F6][F7]\n\n---\n\U0001F4D6 **Información\
    \ adicional del manual:**\n- \"1. Si no se necesita el aislamiento de cortocircuitos,\
    \ se debe conectar la salida + del lazo al terminal 5 en vez de al terminal 2.\
    \ El terminal 5 está conectado internamente con el terminal 4.\n2. El circuito\
    \ con línea intermitente conectado a los terminales 8 y 9 se debe utilizar únicamente\
    \ con el M720. El M710 no tiene conexiones con estos terminales.\n3. Si el panel\
    \ de control lo permite, se podrá indicar un cortocircuito como avería en lugar\
    \ de alarma. Para ello hay que conectar una resistencia de 18 KΩ (M200E-EOL-R18)\
    \ en serie con cada equipo que se desee supervisar.\" [F4]\n- \"1. En no se necesita\
    \ el aislamiento de cortocircuitos, se debe conectar la salida + del lazo al terminal\
    \ 5 en vez de al terminal 2. El terminal 5 está conectado internamente con el\
    \ terminal 2.\n\n2. Si el panel de control lo permite, se podrá indicar un cortocircuito\
    \ como puede el lugar de alarma. Para ello hay que conectar una resistencia de\
    \ 18 kΩ en serie con cada conmutador de alarma. Para ello hay que conectar una\
    \ resistencia de 18 kΩ en serie con cada conmutador de alarma.\" [F2]"
