- qid: cat019
  question: '¿Como se configura una maniobra (causa-efecto) completa en la Detnov
    CAD-250: como se crea, como se definen las entradas/eventos que la disparan y
    como se asignan las salidas?'
  answer: "# Configuración de maniobras (causa-efecto) en la CAD-250\n\nLa maniobra\
    \ en la CAD-250 es el mecanismo causa-efecto del sistema: define qué **eventos**\
    \ (entradas) disparan qué **acciones** (salidas), con una lógica de coincidencias\
    \ configurable [F1].\n\n> ⚠️ La programación de maniobras es una de las funciones\
    \ más críticas de la configuración del sistema. Requiere conocimiento específico\
    \ del sistema instalado, del plan de protección y del producto [F5].\n\n---\n\n\
    ## PASO 1 — Acceder al menú y crear la maniobra\n\n1. Desde la pantalla principal:\
    \ **MENÚ > MANIOBRAS > +AÑADIR** [F1].\n2. Se abre la pantalla de edición de la\
    \ **Maniobra 000X** [F2].\n3. El contador muestra el número de maniobra en el\
    \ que te encuentras [F2].\n\n---\n\n## PASO 2 — Definir la lógica de coincidencias\n\
    \nEn el campo **Coincidencias** indicas cuántos eventos deben cumplirse simultáneamente\
    \ para que la maniobra se ejecute [F2][F6]:\n\n- **Coincidencias = 1** → basta\
    \ con que **cualquier** evento sea verdadero → comportamiento **OR** [F2][F6].\n\
    - **Coincidencias = 2** (con 2 eventos) → deben cumplirse **los dos** → comportamiento\
    \ **AND** [F2][F6].\n- **Coincidencias = N de M** → deben cumplirse N eventos\
    \ cualesquiera de los M configurados [F2].\n\nUn evento es verdadero cuando se\
    \ cumplen **todas** las premisas establecidas para ese evento [F9].\n\n---\n\n\
    ## PASO 3 — Añadir eventos (entradas)\n\n1. Pulsa **AÑADIR** en el margen inferior\
    \ → selecciona **EVENTO** [F3].\n2. Elige el tipo de evento [F3]:\n   - **ENTIDAD**:\
    \ cualquier elemento de la jerarquía del sistema (instalación, panel, lazo, área,\
    \ zona, dispositivo, grupo o módulo virtual), tanto local como en red [F3].\n\
    \   - **CONDICIÓN TEMPORAL**: establece un periodo de tiempo durante el cual la\
    \ ecuación de entrada es verdadera [F3].\n\n3. Si eliges **ENTIDAD**, configuras\
    \ el **EVENTO DE LA ENTIDAD** con los siguientes parámetros [F5]:\n\n   - **Origen:**\
    \ Local o red [F5].\n   - **Entidad:** Instalación, panel, lazo, área, zona, dispositivo,\
    \ grupo o módulo virtual [F5].\n   - **Condición:** Alarma, avería, técnico [F5].\n\
    \   - **Tipo:** Todos, pulsador, detector o entradas [F5].\n   - **Estado lógico:**\
    \ Normal o Negado (si se selecciona Negado, la condición es válida cuando NO se\
    \ da el estado indicado) [F5].\n   - **Repeticiones:** Valor entero hasta **9999**;\
    \ el evento debe repetirse ese número de veces en la entidad para que la entrada\
    \ sea válida [F3][F5].\n\n4. Puedes añadir **tantos eventos como necesites** [F9].\
    \ El número máximo total de entradas y salidas entre todas las maniobras es de\
    \ **100.000** [F3][F10].\n\n> **Nota:** Desde la versión **1.1.1** es posible\
    \ seleccionar un elemento de salida como condición de entrada. En ese caso, el\
    \ cambio a condición de avería hace verdadera la entrada. Para ello, desmarca\
    \ la casilla **\"Sólo dispositivos de entrada\"** [F9].\n\n---\n\n## PASO 4 —\
    \ Añadir acciones (salidas)\n\n1. Pulsa **AÑADIR** en el margen inferior → selecciona\
    \ **ACCIÓN** [F4].\n2. Aparecen los campos **RETRASO** y **ENTIDAD** [F4]:\n\n\
    \   - **Retraso:** Tiempo configurable entre **0 y 600 segundos** antes de iniciar\
    \ la acción. Se inicia cuando la condición de entrada es verdadera [F4][F5].\n\
    \   - **Entidad destino:** Panel, lazo, área, zona, dispositivo, grupo o módulo\
    \ virtual (siempre entidad local) [F4].\n\n   > El programa **no permite mezclar\
    \ acciones sobre entidades de paneles diferentes** [F10].\n\n3. En la pantalla\
    \ **ACCIÓN DE LA ENTIDAD** configuras [F4][F7]:\n\n   - **Tipo de acción:**\n\
    \     - **Activar** las salidas [F7].\n     - **Desactivar** las salidas [F7].\n\
    \     - **Habilitar** la entidad [F7].\n     - **Deshabilitar** la entidad [F7].\n\
    \     - **Test**: pone en modo test la entidad [F7].\n     - **Reiniciar** la\
    \ entidad [F7].\n     - **Pulso**: activa las salidas con anchura de pulso configurable\
    \ entre **0 y 600 segundos** (10 s por defecto) [F7].\n     - **Configuración**:\
    \ permite la cancelación de retardos [F7].\n\n   - **Tipo de elemento** (qué salidas\
    \ se activan dentro de la entidad) [F7]:\n     - **Todos**: todas las salidas\
    \ de la entidad [F7].\n     - **Sirenas**: únicamente las sirenas [F7].\n    \
    \ - **Relés**: únicamente los relés [F7].\n     - **Sirena discontinua**: sirenas\
    \ en modo discontinuo [F7].\n     - **Sirena PCB1**: sirena 1 de la central [F7].\n\
    \     - **Sirena PCB2**: sirena 2 de la central [F7].\n\n   Las opciones disponibles\
    \ dependen de la entidad seleccionada. La combinación acción × tipo de elemento\
    \ × entidad válida es la siguiente [F8]:\n\n   - **ACTIVAR Todos** → Panel, Lazo,\
    \ Área, Zona, Disp.OUT, Grupo, VM [F8].\n   - **ACTIVAR Sirenas** → Panel, Lazo,\
    \ Área, Zona, Grupo [F8].\n   - **ACTIVAR Relés** → Panel, Lazo, Área, Zona, Grupo\
    \ [F8].\n   - **ACTIVAR Sirenas discontinua** → Panel, Lazo, Área, Zona, Grupo\
    \ [F8].\n   - **ACTIVAR Sirena 1 / Sirena 2** → solo Panel [F8].\n   - **DESACTIVAR\
    \ Todos** → Panel, Lazo, Área, Zona, Disp.OUT, Grupo, VM [F8].\n   - **DESACTIVAR\
    \ Sirenas / Relés** → Panel, Lazo, Área, Zona, Grupo [F8].\n   - **DESACTIVAR\
    \ Sirena 1 / Sirena 2** → solo Panel [F8].\n   - **PULSO** → Panel, Lazo, Área,\
    \ Zona, Disp.OUT, Grupo, VM [F8].\n   - **HABILITAR / DESHABILITAR** → Panel,\
    \ Área, Zona, Disp.OUT, Disp.IN, Grupo, VM [F8].\n   - **TEST** → Panel, Área,\
    \ Zona [F8].\n   - **PROGRAMACIÓN (Cancelar retardo)** → solo Panel [F8].\n\n\
    ---\n\n## PASO 5 — Guardar\n\n- Pulsa **GUARDAR** para actualizar la base de datos\
    \ [F7].\n- Pulsa **CANCELAR** para deshacer los cambios [F7].\n- La central devuelve\
    \ al listado de maniobras, donde puedes ver el resumen de eventos y acciones de\
    \ cada maniobra [F7][F10].\n\n---\n\n## Elementos adicionales del módulo de maniobras\n\
    \nEl menú de maniobras también incluye [F1]:\n\n- **Grupos**: asociaciones de\
    \ elementos (áreas, zonas, dispositivos) para facilitar la creación de reglas\
    \ de actuación [F1].\n- **Módulos virtuales (VM)**: permiten crear bucles interdependientes;\
    \ un conjunto de entradas determina el estado del VM, que a su vez puede actuar\
    \ como entrada de otra maniobra [F1].\n- **Estado VM**: visualización y activación\
    \ de módulos virtuales desde la pantalla principal [F1].\n\n---\n\n**Fuentes:**\n\
    - CAD-250 Manual de Configuración MC-380-es-2026-c (rev. c, 2026-04-23)\n- CAD-250\
    \ Manual de Software de Configuración MS-416-es-2026-b (rev. b)\n\n---\n\U0001F4D6\
    \ **Información adicional del manual:**\n- \"Screenshot 1: Shows the main interface\
    \ with \"Panel 12 08:08 - viernes, 19 de abril de 2019\" at top, displaying \"\
    Maniobra 0001\" with \"Borrar maniobra\" button and \"MANIOBRAS\" section. Left\
    \ sidebar shows menu items: LAZO, SECTORIZACION, MANIOBRAS, LOGS, RED, AJUSTES,\
    \ INSTALACION. The main area shows \"Coincidencias: Eventos\" and \"Acciones\"\
    \ tabs with a hand cursor pointing to an add button.\n\nScreenshot 2: Shows a\
    \ popup dialog titled \"Seleccione Eve\" with two options: \"EVENTO\" and \"ACCION\"\
    \n\nScreenshot 3: Shows \"Seleccione tipo de evento\" dialog with options for\
    \ \"ENTIDAD\" and \"CONDICION TEMPORAL\", with a \"CERRAR\" button and \"Evento\
    \ de entidad\" label with \"Repeticiones =? 3\" notation\n\nScreenshot 4: Shows\
    \ a diagram with numbered nodes (1, 2, 3) connected in sequence, with a counter\
    \ showing \"Contador 0\" and \"Entidad\" field with \"una entidad\" text, and\
    \ \"Repeticiones =? 3\" label with \"CANCELAR\" button\n\nScreenshot 5: Shows\
    \ \"Seleccionar entidad\" dialog with two options: \"Local\" and \"Red\", with\
    \ a \"CLOSE\" button at bottom]\" [F3]\n- \"- Filtro deEvento/Acción (Event/Action\
    \ Filter)\n- Botón borrar maniobra (Delete maneuver button)\n- Filtro de panel\
    \ (Panel filter)\n- Nº de maniobra (Maneuver number: 0002)\n- Borrar maniobra\
    \ (Delete maneuver button)\n- Panel: 1\n- Coincidencias: (Coincidences)\n- Eventos\
    \ section showing:\n  - Lapso tiempo: desde enero hasta febrero desde lunes hasta\
    \ viernes desde Hora: 00:00:00 hasta Hora: 10:00:00\n  - Alarma cualquiera en\
    \ Panel: Panel_template\n- Acciones section showing:\n  - Activar en L:1\n  -\
    \ Activar en Panel: Panel_template\n- Seleccione para editar o borrar el elemento\
    \ (Select to edit or delete element)\n- Botón borrar elemento (Delete element\
    \ button)\n- Botón editar elemento (Edit element button)\n- Cuadro de eventos\
    \ (Events box)\n- Cuadro de acciones (Actions box)\n- Añadir evento temporal (Add\
    \ temporary event)\n- Borrar elemento (Delete element)\n- Editar (Edit)\" [F10]"
