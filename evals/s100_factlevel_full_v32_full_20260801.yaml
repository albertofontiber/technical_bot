- qid: hp015
  question: En la Detnov CCD-103, ¿cómo se desactiva un detector individualmente sin
    afectar al resto del lazo?
  answer: 'La CCD-103 **no permite desactivar un detector individual**: la unidad
    mínima de desconexión es la **zona completa**.


    ## Lo que sí permite el sistema: desconexión por zona


    Según el manual [F1][F2], el procedimiento para desconectar una zona completa
    es:


    1. Asegúrate de que la **llave de bloqueo de teclado (G)** está en posición **abierta**
    (ON), de lo contrario las pulsaciones no tienen efecto [F2].

    2. Pulsa la **tecla de zona (A)** correspondiente **una primera vez** → la zona
    entra en **modo prueba** [F2].

    3. Pulsa la **tecla de zona (A)** una **segunda vez** → la zona queda en **modo
    desconexión** [F1][F2].


    Para reconectar la zona: pulsa la tecla de zona **una vez** desde el estado de
    desconexión [F1].


    ## Indicaciones visuales tras la desconexión


    - **Indicador de anular (4):** se enciende de forma **continua** [F1][F5].

    - **Indicador amarillo de zona (6):** se enciende de forma **continua** indicando
    la zona concreta anulada [F1][F5].


    ## Advertencia importante


    El manual advierte explícitamente que cuando una zona está desconectada, **la
    central no refleja ninguna incidencia ni evento en esa zona**, por lo que es importante
    **limitar el uso de esta maniobra** [F1].


    ---


    **El manual no describe ningún mecanismo de desactivación individual de un detector
    dentro de una zona.** La CCD-103 es una central convencional con un máximo de
    **32 detectores o pulsadores por zona** [F3][F4], y la desconexión opera a nivel
    de zona completa.


    Si necesitas aislar un detector concreto sin afectar al resto, deberás actuar
    físicamente sobre el detector (desconexión física del dispositivo), pero ese procedimiento
    no está descrito en los fragmentos disponibles. Consulta el manual completo o
    el soporte técnico de Detnov.


    ---


    Fuente: CCD-103_Manual_ES_FR_GB_IT (sin revisión registrada)'
