- qid: cat022
  question: En los detectores de llama Spectrex SharpEye 40/40, ¿qué diferencia hay
    entre el modelo 40/40L y el 40/40L4, y qué significa el sufijo «B» (p. ej. 40/40LB)?
  answer: '## Diferencias entre 40/40L, 40/40L4 y el sufijo «B»


    La diferencia clave está en la **longitud de onda del sensor IR** y en la **inclusión
    o no de la función BIT**.


    ---


    ### 40/40L vs. 40/40L4 — Longitud de onda IR


    - **S40/40L**: combina sensores UV e IR. El sensor IR opera en la longitud de
    onda entre **2,5 y 3,0 µm**. Es adecuado para detectar combustibles a base de
    hidrocarburos, fuegos de gas, fuegos de hidróxido e hidrógeno, y fuegos de metales
    o materia inorgánica [F11].


    - **S40/40L4**: es igual al S40/40L **excepto** en que opera a una longitud de
    onda de **4,5 µm** y **solo es adecuado para la detección de fuegos de hidrocarburos**
    [F11].


    ---


    ### Sufijo «B» — Prueba Incorporada (BIT)


    El sufijo **«B»** indica que el modelo incluye la función de **Prueba Incorporada
    (BIT)** [F11]:


    - **S40/40L** → **sin BIT**

    - **S40/40LB** → **con BIT**

    - **S40/40L4** → **sin BIT**

    - **S40/40L4B** → **con BIT**


    Esto es consistente con lo que el manual indica para la familia UV (S40/40U):
    el modelo sin sufijo B no incluye BIT, y el modelo con sufijo B sí la incluye
    [F12].


    ---


    ### Sensibilidad según modelo (dato adicional del software WinHost)


    Los ajustes de sensibilidad también difieren entre modelos [F2]:


    - **40/40L y 40/40LB**: ajuste de sensibilidad disponible en **15** (equivalente
    a **50 ft / 15 m**) [F2].

    - **40/40L4 y 40/40L4B**: ajuste de sensibilidad disponible en **28** (equivalente
    a **93 ft / 28 m**) [F2].


    ---


    **Fuentes:**

    - MNDT722_40-40L (sin revisión registrada) [F1, F11]

    - manual-sharpeye-40-40-series-winhost-spectrex-en-us-4845694 (sin revisión registrada)
    [F2]

    - MNDT723_40-40U (sin revisión registrada) [F12]'
