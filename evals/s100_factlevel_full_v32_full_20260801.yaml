- qid: hp007
  question: ¿Cómo se realiza el test anual de un detector VESDA-E VEP según el manual
    del fabricante?
  answer: '## Test anual del detector VESDA-E VEP-A10-P


    Según la **Tabla 7-1** del manual [F1], las tareas que deben realizarse **una
    vez al año** son las siguientes:


    ---


    ### Tareas anuales obligatorias [F1]


    1. **Prueba de humos** — para comprobar la integridad de la red de tubería

    2. **Comprobar el flujo** de la red de tubería

    3. **Limpiar los puntos de muestreo**

    4. **Limpiar con agua la red de tubería**


    ---


    ### Procedimiento previo a cualquier prueba (obligatorio) [F1]


    ⚠️ **Antes de comenzar:**

    - Informa a la autoridad supervisora adecuada.

    - Asegúrate de que se aíslen todos los dispositivos dependientes del detector
    antes de ponerlo en funcionamiento.

    - Cuando el detector está deshabilitado o en espera, **no emitirá advertencias
    de fuego**.


    ---


    ### Modo en espera durante el mantenimiento [F8]


    Cuando se realiza mantenimiento de la red de tubería o los puntos de muestreo,
    se recomienda establecer el detector en **modo en espera** para apagar el aspirador:


    - Desde **Xtralis VSC**: selecciona *"Go to Standby"* en el menú *"Device"*.

    - El LED desactivado parpadeará y se desactivará el aspirador.

    - Para volver a activar la unidad: selecciona *"End Standby"* en el menú *"Device"*
    [F8].


    > ⚠️ En modo en espera se detiene la detección de alarmas, pero **no** la detección
    ni señalización de fallos [F8].


    ---


    ### Prueba de humos — detalle [F2]


    La prueba de humos consiste en:

    1. Introducir una muestra de humo en el **orificio de muestreo más alejado**.

    2. Medir el **tiempo de transporte** hasta que el humo llega al detector.

    3. Registrar los resultados y compararlos con pruebas anteriores para detectar
    variaciones del sistema.


    > El manual remite al documento **"VESDA-E Commissioning Guide"** para los detalles
    completos del procedimiento de prueba de humos [F2].


    ---


    ### Notas adicionales [F1]


    - La frecuencia puede variar según **códigos y normas locales** y el entorno de
    instalación.

    - El mantenimiento puede realizarlo el instalador original, un distribuidor autorizado
    o el contratista de servicio.

    - Sigue los **procedimientos del sitio** durante las pruebas de humo para evitar
    falsas alarmas.


    ---


    **Fuente:** 33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores (sin revisión
    registrada)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "**Atención:** Pendant que le detecteur ou la zone est desactivee, aucun feu
    d''indication va etre emis par le detecteur." (33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores,
    p. 87) [F1]'
