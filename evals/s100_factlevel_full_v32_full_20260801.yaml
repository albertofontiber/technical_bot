- qid: cat014
  question: ¿Cual es el MTBF / vida util esperada del detector de gas DGD-600 de Detnov?
  answer: 'El DGD-600 tiene una **vida útil de 10 años desde su fecha de fabricación**
    [F3][F4]. El manual no especifica un valor de MTBF (Mean Time Between Failures).


    Datos adicionales relevantes:


    - **Vida útil:** 10 años desde fabricación [F3]

    - **Sustitución:** El detector debe ser reemplazado al cumplir los 10 años [F3]

    - **Fecha de fabricación:** Impresa en la pegatina del lateral del dispositivo
    [F3]


    El manual no incluye ningún dato de MTBF para el DGD-600. Solo se especifica la
    vida útil operativa de 10 años.


    ---


    Fuente: 55360004 Manual Detector Gas DGD-600 ES EN IT FR (sin revisión registrada)


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "The range of stand-alone gas detectors has been developed in order to detect
    any leak of flammable gas for everyday use and it is composed of the following
    models:" (55360004 Manual Detector Gas DGD-600 ES EN IT FR, p. 1) [F2]'
