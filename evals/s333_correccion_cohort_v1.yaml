# s333 — cohorte CONGELADA del gate de juicio CORRECCION/NUEVO (v2 §5).
# ANTI-GATE-SHOPPING (DEC-126): revisar el prompt o estas filas = cohorte NUEVA versionada.
# Población del clasificador (v2 §2): turno con UNA marca gobernada, sin modelo resuelto,
# sin model-token, sin pending, sin estado bindeado, last_query fresca, plantilla fallo.
# GOLD autorado por el orquestador; revisión Fable-standalone pre-gate (desviación declarada
# del dúo-entero, v2 §5); etiquetas LÍMITE excluidas de la barra y listadas abajo para
# adjudicación de Alberto (precedente hp011#2).
#
# REGLA K PINNADA (v2 §5, espejo s316g «voto dañino»):
#   negativa: FALLA si CUALQUIER voto de sus K es CORRECCION.
#   positiva: PASA solo con MAYORÍA >=2/3 de CORRECCION.
#   None/timeout cuenta como NUEVO.
# BARRA: falsas_correccion == 0  Y  positivas_pass >= 10/12.
# Framing honesto (Fable-3): las positivas p1/p2 las absorbe el fast-path en producción;
# AQUÍ el clasificador se mide AISLADO (q intacta, cue incluido — es el e2e el que retira
# el cue del léxico, no este runner). Barra efectiva de la cola real: >=8/10 restantes.
# Distribución declarada (Fable-standalone pre-freeze, menor): 8/12 positivas comparten
# plantilla semántica kidde-tras-ID/BQide y solo 2/12 son EN — la cola EN/otras-marcas se
# re-adjudica con OBSERVACIONES (disciplina DEC-233; no se inventan fraseos para rellenar).
version: 1
k: 3
umbral_falsas_correccion: 0
umbral_positivas_pass: 10

