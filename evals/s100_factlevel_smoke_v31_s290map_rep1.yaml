- qid: hp009
  question: ¿Cuál es la resistencia de fin de línea recomendada para los lazos de
    la central Morley ZXe?
  answer: 'La resistencia de fin de línea (RFL) para los circuitos de sirenas de la
    ZXe es de **6.800 Ω (6,8 KΩ), 0,5 W mínimo** [F8].


    Este valor aplica a cada circuito de sirena supervisado (Sirenas A y B en el ZX2e;
    Sirenas A, B, C y D en el ZX5e) [F8]. La RFL debe instalarse al final del circuito
    para la supervisión ante cortocircuito y circuito abierto [F8].


    **Consideraciones adicionales sobre la RFL en sirenas:**


    - Si no se instalan sirenas en el circuito, la RFL debe conectarse directamente
    entre + y – en el terminal de la central [F1].

    - No se deben realizar ramales en la conexión de sirenas, ya que la supervisión
    se realiza en la línea directa hasta la RFL; los ramales paralelos no podrán ser
    supervisados [F2].

    - No enrolle el cable en los terminales; corte y empalme las conexiones adecuadamente
    para mantener la supervisión de la línea [F3].

    - No se recomienda cable de longitud superior a **1 km**, ya que la capacitancia
    e inductancia del lazo pueden afectar al funcionamiento de la línea [F3].


    **Nota:** Los lazos analógicos (detectores/módulos) de la ZXe no utilizan RFL;
    trabajan en bucle cerrado con aisladores de cortocircuito [F10]. El valor de 6,8
    KΩ es exclusivo de los circuitos de sirenas.


    ---


    Fuente: Manual de Instalación Paneles de Incendio ZX2e / ZX5e — Documento No.
    MIE-MI-530, Revisión: 001


    ---

    ⚠️ **Información adicional del manual:**

    - "**Todo cableado debe ser verificado antes de su conexionado al panel.**" [F10]

    - "LAS SIGUIENTES MEDIDAS PRÁCTICAS SOBRE EL CABLEADO, DEBEN REALIZARSE ANTES
    DE CONECTAR AL PANEL, PARA ASEGURAR EL FUNCIONAMIENTO DEL SISTEMA Y EVITAR DAÑOS:"
    [F10]

    - "AISLADORES DE CORTOCIRCUITO: Si se han instalado aisladores estos deben puentearse
    antes o medir entre todos los aisladores (Los aisladores mantienen abierta la
    línea de señal de positivo hasta que se alimentan e impiden la verificación del
    cableado). De no tenerse en cuenta esta medida, podrá existir tensión externa
    en el cableado, que no sea posible medir y que al conectar el lazo al panel, se
    derive directamente a éste provocando daños irreparables.


    TENSIONES: Comprobar que no existe tensión de C.C. o C.A. entre ningún conductor,
    ni con pantalla o tierra de ningún lazo.


    CONTINUIDAD: Comprobar la continuidad independiente los conductores positivo,
    negativo y pantalla desde el inicio de lazo al final. Si hay ramales, estos deberán
    comprobarse por separado.


    DERIVACIONES: Comprobar que no existe continuidad entre los conductores de positivo,
    negativo y pantalla y que tampoco hay continuidad entre éstos y tierra." [F10]


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "Es imprescindible comprobar que no hay conexión entre los terminales A y B
    y que el lazo entra a un lado del conector y sale por el otro o termina en la
    resistencia RFL de 150 Ohmios." (MIE-MI-310, p. 22) [F4]

    - "Debe instalarse siempre una resistencia RFL entre + y - de la última sirena
    para controlar la apertura o cierre de la línea de sirenas." (MIE-MI-310, p. 18)
    [F1]'
