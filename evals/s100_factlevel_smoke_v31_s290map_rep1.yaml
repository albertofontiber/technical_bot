- qid: hp018
  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  answer: '## Conexionado de sirenas convencionales en la ZXe


    La ZXe dispone de **2 salidas supervisadas para sirenas convencionales** (Salida
    A y Salida B), con un consumo máximo de **1 A por circuito** [F11].


    ---


    ### Resistencia Final de Línea (RFL)


    Cada circuito requiere una **RFL de 6,8 kΩ, 0,5 W mínimo**, instalada entre +
    y − de la **última sirena** del circuito [F11]. Esta resistencia permite la supervisión
    ante cortocircuito y circuito abierto [F11].


    - Si no se instala ninguna sirena en la salida, conecta la RFL directamente en
    los terminales de la central [F2].


    ---


    ### Requisitos de conexionado


    1. **Sirenas polarizadas**: conéctalas respetando la polaridad indicada en los
    terminales de la salida [F1].


    2. **Dispositivos no polarizados** (campanas sin polaridad): instala un **diodo
    de polarización y protección** en cada uno, para evitar consumo durante la supervisión
    en polarización inversa [F4].


    3. **Sin ramales**: no realices derivaciones paralelas en la línea de sirenas.
    La supervisión se realiza sobre la línea directa hasta la RFL; los ramales no
    quedan supervisados [F1].


    4. **No enrolles el cable en los terminales**: corta y empalma las conexiones
    adecuadamente para mantener la supervisión de la línea [F3].


    5. **Sección mínima de cable**: no uses secciones inferiores a **1,5 mm²** para
    evitar caídas de tensión excesivas [F2].


    6. **Longitud máxima recomendada**: no se recomienda superar **1 km** de cable;
    longitudes superiores pueden afectar al funcionamiento por capacitancia e inductancia
    del lazo [F3].


    ---


    ### Lógica de supervisión


    El circuito se polariza en **sentido inverso en reposo** para supervisar la línea.
    Al activarse la salida, la corriente circula en sentido normal con la polaridad
    expresada en los terminales [F2]. Por eso cada sirena debe tener un **diodo integrado**
    que impida el consumo en polarización inversa [F4].


    ---


    ### Terminales físicos (ZX2e / ZX5e)


    Para la ubicación exacta de los terminales en la placa, consulta las figuras del
    manual:


    - **ZX2e**: terminales etiquetados como `A+ A- B+ B-` en el bloque `SOUNDERS`
    — ver **Figura 13** del documento MIE-MI-530 [F4].

