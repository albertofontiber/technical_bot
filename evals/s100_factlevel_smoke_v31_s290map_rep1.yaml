- qid: hp019
  question: ¿Cuál es el rango de temperatura de funcionamiento del detector de aspiración
    ASD535 (Securiton, distribuido por Detnov)?
  answer: 'El rango de temperatura de funcionamiento del **ASD 535** es el siguiente
    [F1]:


    **Caja del detector:**

    - Rango estándar: **–30 °C hasta +60 °C** (para certificación UL, máximo +40 °C)

    - Según estándar australiano AS 1603.8: **–30 °C hasta +55 °C**


    **Conducto de aspiración:**

    - Rango estándar: **–30 °C hasta +60 °C**

    - Según estándar australiano AS 1603.8: **–30 °C hasta +55 °C**


    **Restricción adicional importante:**

    - La fluctuación de temperatura máxima permitida durante el funcionamiento (tanto
    en la caja del detector como en el conducto de aspiración) es de **20 °C** [F1].

    - En entornos con oscilaciones térmicas superiores a 20 °C, pueden ser necesarios
    ajustes especiales (ventana de flujo de aire más grande, mayor tiempo de retardo,
    etc.) [F6].


    **Temperatura de almacenamiento:**

    - Caja del detector (sin condensación): **–30 °C hasta +70 °C** [F1]


    **Notas adicionales:**

    - Para uso en almacenes de ultracongelación, el rango restringido aplicable es
    **–30 °C hasta 0 °C** [F3].

    - Es posible acordar con el fabricante rangos de temperatura inferiores o superiores
    al estándar [F2].

    - La instalación en rango de condensación solo puede llevarse a cabo previa consulta
    con el fabricante [F2].


    ---

    Fuente: ASD535_TD_T131192es_h (sin revisión registrada)


    ---

    📖 **Información adicional del manual:**

    - "* Los límites restringidos del sistema en relación con las longitudes máximas
    de tubería y el número máximo de orificios de aspiración.

    * El uso de puntos de aspiración con calefacción y su programación con el software
    de configuración «ASD Config».

    * El rango restringido de temperatura (–30 °C hasta 0 °C)" [F3]


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "Es imprescindible garantizar el retorno de aire a la zona con riesgo de explosión
    (recinto vigilado)." (ASD535_TD_T131192es_h, p. 61) [F5]

    - "* Después de modificar el número de revoluciones del ventilador, será **obligatorio**
    realizar un nuevo reset inicial (mantener un tiempo de espera de al menos 5 min)."
    (ASD535_TD_T131192es_h, p. 24) [F10]

    - "* Los orificios de aspiración de ambas tuberías y de la caja del detector deben
    encontrarse en la misma zona climática (presión y temperatura) (posible retorno
    del aire aspirado a la otra zona climática)." (ASD535_TD_T131192es_h, p. 61) [F5]'
