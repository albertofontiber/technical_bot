- qid: hp013
  question: ¿Cómo se cambia la batería tampón de la Detnov ADW535 sin perder configuración?
  answer: 'El manual del ADW535 **no describe un procedimiento específico para sustituir
    la batería de litio sin perder configuración**. Lo que sí indican los fragmentos
    es lo siguiente:


    ---


    ## Lo que el manual especifica sobre la batería de litio


    La batería de litio es un componente del **Main Board LMB 35** [F9]. En los fragmentos
    aparece mencionada en dos contextos:


    **1. Fallo de reloj (código G50/G60 – 008):**

    - El código de fallo **008** corresponde a "Fallo reloj" [F11].

    - Una causa posible es que **la cinta aislante de la batería de litio aún no se
    ha retirado** → solución: retirarla [F11].

    - Otra causa es que el reloj no esté ajustado [F11].


    **2. Indicador de fallo:**

    - El fallo "Batería de litio / reloj" activa un estado de LED específico en el
    panel [F12].


    ---


    ## Lo que el manual dice sobre trabajos en el LMB 35


    Cuando se sustituye el **Main Board LMB 35**, el manual indica expresamente que
    es **obligatorio realizar un nuevo reset inicial** [F1][F2]:


    > *"Deberá realizarse un reset inicial después de los trabajos de reparación del
    ADW 535 (sustitución del dispositivo de control LSU 35 o del Main Board LMB 35)."*
    [F2]


    Esto implica que cualquier intervención sobre el LMB 35 (donde está alojada la
    batería) conlleva reset inicial posterior.


    ---


    ## Lo que el manual NO especifica


    Los fragmentos disponibles **no describen**:

    - El procedimiento paso a paso para extraer y sustituir físicamente la batería
    de litio.

    - Si la configuración se conserva en Flash-PROM, EEPROM o SD memory card durante
    el cambio de batería (aunque el fragmento [F9] menciona que el LMB 35 incluye
    RAM, Flash-PROM, EEPROM y soporte para SD memory card, no establece qué parámetros
    se almacenan en cada medio ni cuál persiste sin alimentación de batería).

    - Si existe un procedimiento de backup/restore previo al cambio de batería.


    ---


    ## Recomendación


    Dado que el manual indica que la sustitución del LMB 35 requiere reset inicial
    [F2], y que los parámetros específicos del cliente deben reajustarse en caso de
    sustitución de la unidad de evaluación completa [F8], **antes de intervenir**:


    1. Documenta la configuración actual leyendo los valores en posición de conmutador
    **P** [F8].

    2. Consulta directamente a **Securiton / Detnov** (fabricante del ADW535) para
    el procedimiento oficial de sustitución de batería, ya que no está cubierto en
    los fragmentos disponibles.


    ---


    **Fuente:** ADW535, Descripción técnica, T 140 358 e es (sin revisión registrada)


    ---

    ⚠️ **Información adicional del manual:**

    - "Para evitar que los controles de incendios, las alertas remotas y las zonas
    de extinción se disparen al llevar a cabo los trabajos de mantenimiento, es **imprescindible**
    bloquearlos o desconectarlos previamente." [F8]'
