per_gold:
- qid: hp002
  question: El detector ASD535 de Detnov está dando una alarma intermitente de flujo
    bajo. ¿Cuál es la causa más probable y cómo se diagnostica?
  answer: "# ASD535 — Fallo de flujo bajo: causa más probable y diagnóstico\n\nLa\
    \ causa más probable de una alarma de flujo bajo en el **ASD535** es una **obstrucción\
    \ en el conducto de aspiración** (orificios de aspiración, salida de aire o filtro)\
    \ [F5].\n\n---\n\n## ¿Qué está ocurriendo internamente?\n\nEl ASD535 mide el flujo\
    \ de aire mediante método calorimétrico y lo compara con el valor nominal registrado\
    \ en el reset inicial (100%) [F1]. Cuando el flujo cae por debajo del **80 %**\
    \ del valor nominal (variación superior al **−20 %**), el equipo dispara el aviso\
    \ «fallo flujo de aire» una vez transcurrido el tiempo de retardo de **300 s**\
    \ de la LS-Ü [F1][F2].\n\nEl LED **«Fault»** empieza a parpadear en cuanto la\
    \ variación supera el ±20 %, y el fallo se confirma en la CDI al cabo de esos\
    \ 300 s [F10].\n\n---\n\n## Diagnóstico paso a paso\n\n1. **Leer el código de\
    \ evento en el AMB 35** (posición de conmutador E) para delimitar el patrón de\
    \ error [F3]. Los códigos relevantes para flujo bajo son:\n\n   - **Código 001**\
    \ (tabla de fallos de flujo): Obstrucción en conducto de aspiración I [F5]\n \
    \  - **Código 002** (tabla de fallos de flujo): Rotura de tubo en conducto de\
    \ aspiración [F5]\n   - **Código 004** (tabla de fallos de flujo): Parámetros\
    \ LS-Ü no válidos / sensor fuera de rango [F5]\n   - **Código 008** (tabla de\
    \ fallos de flujo): Sensor de flujo de aire defectuoso o no conectado [F5]\n\n\
    2. **Verificar el valor de flujo actual** mediante la posición de conmutador **V**\
    \ (sección 7.6.1 del manual): un valor < 100 % apunta a obstrucción [F2].\n\n\
    3. **Inspeccionar físicamente el conducto de aspiración**:\n   - Comprobar si\
    \ los **orificios de aspiración** están obstruidos [F5]\n   - Comprobar la **salida\
    \ de aire en el ASD** [F5]\n   - **Inspeccionar y limpiar la caja de filtro /\
    \ unidad de filtrado** [F5]\n   - **Inspeccionar y limpiar el sensor de flujo\
    \ de aire** [F5]\n\n4. **Si no hay obstrucción visible**, comprobar:\n   - Posibles\
    \ **roturas de tubo**, uniones abiertas (racores, transiciones flexibles) u orificio\
    \ de inspección abierto [F5]\n   - Conducto de aspiración no conectado correctamente\
    \ [F5]\n\n5. **Verificar la tensión de alimentación** en los bornes 1 y 2 (o 3\
    \ y 4 si hay alimentación redundante): debe estar entre **21,6 y 27,6 V-CC** (funcionamiento\
    \ a 24 V-CC) o **12,3 y 13,8 V-CC** (funcionamiento a 12 V-CC) [F9]. Una tensión\
    \ fuera de rango puede provocar funcionamiento defectuoso [F9].\n\n6. **Si el\
    \ sensor de flujo está limpio y el conducto está íntegro**, considerar **sensor\
    \ de flujo de aire defectuoso → sustituir** [F5].\n\n---\n\n## Consideración adicional\
    \ sobre el reset inicial\n\nSi tras la intervención el fallo persiste o aparecen\
    \ códigos de la serie **001/002** en la tabla de reset inicial (flujo demasiado\
    \ bajo en el reset), puede ser necesario ejecutar un **nuevo reset inicial** [F4].\
    \ Asegúrate de respetar el tiempo de espera previo indicado en la especificación\
    \ del firmware antes de lanzarlo [F11].\n\n> ⚠️ **Antes de cualquier prueba o\
    \ mantenimiento**, bloquea o desconecta los controles de incendios, alertas remotas\
    \ y zonas de extinción en la CDI de orden superior [F12].\n\n---\n\n**Fuente:**\
    \ ASD535, Descripción técnica, T 131 192 h es (sin revisión registrada)\n\n---\n\
    ⚠️ **Información adicional del manual:**\n- \"Atención: solo será necesario cuando\
    \ así se indique expresamente en la especificación del firmware correspondiente.\"\
    \ [F11]\n- \"|                                                               \
    \                                                                            \
    \                                                      | • Prestar atención a\
    \ la especificación del firmware que se va a instalar<br/>• según el cap.\" [F11]\n\
    - Nota: el manual también indica: \"En las posiciones de conmutador A11 a C32,\
    \ cualquier variación de este valor que supere el ±20 % – es decir, por debajo\
    \ del 80 % (suciedad/obstrucción) o por encima del 120 % (rotura de tubo) – disparará\
    \ un aviso «fallo flujo de aire» una vez transcurrido el tiempo de retardo de\
    \ 300 s de la LS-Ü.\" [F1]\n- Nota: el manual también indica: \"En las posiciones\
    \ de conmutador **A11** a **C32**, cualquier variación de este valor que supere\
    \ el ±20 % (es decir, por debajo del 80 % o por encima del 120 %) disparará un\
    \ aviso de fallo una vez transcurrido el tiempo de retardo de 300 s de la LS-Ü.\"\
    \ [F2]"
