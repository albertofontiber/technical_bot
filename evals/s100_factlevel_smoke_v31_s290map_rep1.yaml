- qid: cat017
  question: ¿Como se cablea y se da de alta (configura) un lazo en la central Notifier
    INSPIRE (E10/E15)?
  answer: "# Cableado y configuración de lazo en INSPIRE E10/E15\n\nA continuación\
    \ se detalla el proceso completo en dos bloques: **cableado físico** y **configuración\
    \ (alta) del lazo**.\n\n---\n\n## BLOQUE 1 — CABLEADO FÍSICO DEL LAZO\n\n### Módulo\
    \ de lazo OPAL X2 (HOP-433-100)\n\nEl módulo de lazo es de color **morado** [F2]\
    \ y dispone de 10 terminales [F2][F3]:\n\n**Lazo 1:**\n- Terminal **1** → Lazo\
    \ 1 Salida +VE\n- Terminal **2** → Lazo 1 Salida -VE\n- Terminal **3** → ⊕ (**NO\
    \ usar para pantalla de cable**)\n- Terminal **4** → Lazo 1 Entrada +VE\n- Terminal\
    \ **5** → Lazo 1 Entrada -VE\n\n**Lazo 2:**\n- Terminal **6** → Lazo 2 Salida\
    \ +VE\n- Terminal **7** → Lazo 2 Salida -VE\n- Terminal **8** → ⊕ (**NO usar para\
    \ pantalla de cable**)\n- Terminal **9** → Lazo 2 Entrada +VE\n- Terminal **10**\
    \ → Lazo 2 Entrada -VE\n\n> ⚠️ **La pantalla del cable de lazo debe conectarse\
    \ a la barra de tierra de la central, NO a los terminales 3 u 8** [F2][F3]. Se\
    \ recomienda poner a tierra un solo extremo de la pantalla [F10].\n\n---\n\n###\
    \ Capacidad del lazo [F2][F4]\n\n**Protocolo OPAL:**\n- Hasta **159 detectores**\
    \ OPAL por lazo\n- Hasta **159 módulos** OPAL por lazo\n- Máximo **750 mA** por\
    \ lazo\n\n**Protocolo CLIP** (requiere licencia):\n- Hasta **99 detectores** CLIP\
    \ por lazo\n- Hasta **99 módulos** CLIP por lazo\n\n> ⚠️ **No se permite mezclar\
    \ dispositivos OPAL y CLIP en el mismo lazo** [F2].\n\n> ⚠️ Según **EN54-2, apartado\
    \ 13.7**, existe una restricción de **512 detectores y/o pulsadores** por módulo\
    \ de lazo (que consta de 2 circuitos) [F2].\n\n---\n\n### Numeración de lazos\
    \ [F2]\n\nLos circuitos de lazo se numeran **secuencialmente de izquierda a derecha**\
    \ del portamódulos. En la E15 (dos filas de portamódulos), la segunda fila continúa\
    \ la numeración desde la primera.\n\n---\n\n### Comprobaciones previas con multímetro\
    \ (antes de conectar a la central)\n\n> ⚠️ **NUNCA utilices un dispositivo de\
    \ alta tensión (p. ej. comprobador de aislamiento) en el circuito de lazo** [F5].\n\
    \n**Paso 1** — Continuidad y resistencia [F5][F7]:\n- Comprueba la continuidad\
    \ de cada parte del lazo.\n- Mide la resistencia de extremo a extremo: medir entre\
    \ **Lazo X Entrada -VE** y **Lazo X Salida -VE** con el lazo desconectado de la\
    \ central, multiplica el resultado por 2 y añade la resistencia de cada aislador\
    \ (**0,1 a 0,13 Ω** por aislador) [F7].\n- La **capacidad del cable debe ser inferior\
    \ a 0,5 µF** [F7].\n- Resistencia máxima admisible [F7]:\n  - Protocolo **OPAL**:\
    \ inferior a **40 Ω**\n  - Protocolo **CLIP** (detección de dirección duplicada):\
    \ inferior a **40 Ω**\n  - Protocolo **CLIP** (sin detección de dirección duplicada):\
    \ inferior a **71 Ω**\n\n**Paso 2** — Pantalla de cable [F5][F6]:\n- Comprueba\
    \ la continuidad de la pantalla de extremo a extremo (debe dar resistencia muy\
    \ baja).\n- Verifica que **no hay continuidad** entre la pantalla y los cables\
    \ +VE ni -VE.\n- Si la pantalla no está conectada a la barra de tierra en la central,\
    \ comprueba que no tenga otra conexión a tierra en ningún punto del recorrido\
    \ del lazo [F6].\n\n**Paso 3** — Comprobación de polaridad con función diodo [F6]:\n\
    - Conecta el multímetro en **polaridad invertida** (+VE del multímetro al negativo\
    \ del lazo, -VE al positivo): debe indicar **símbolo de diodo en polarización\
    \ directa**.\n- Conecta el multímetro en **polaridad normal** (+VE al positivo,\
    \ -VE al negativo): al principio debe leer resistencia baja, que **aumenta progresivamente**\
    \ al cargarse los condensadores de los dispositivos.\n- Si en polaridad normal\
    \ también indica diodo en directa, hay uno o varios dispositivos **conectados\
    \ en polaridad inversa o cortocircuito** [F6].\n\n> ℹ️ Se recomienda usar la herramienta\
    \ **POL-200-TS** para diagnósticos más detallados; funciona con protocolos OPAL\
    \ y CLIP [F10].\n\n---\n\n### Conexión a la central\n\n**Lazo OPAL** [F10]:\n\
    - Una vez verificado el cableado, conecta el circuito al bloque de terminales\
    \ de lazo seleccionado en la central.\n\n**Lazo CLIP** [F10]:\n1. Reconecta los\
    \ aisladores que se desconectaron temporalmente durante las pruebas (módulos de\
    \ lazo y pulsadores).\n2. Conecta el circuito al bloque de terminales de lazo\
    \ seleccionado en la central.\n\n---\n\n## BLOQUE 2 — CONFIGURACIÓN (ALTA) DEL\
    \ LAZO\n\n### Paso previo — Preparación en CLSS (antes de ir a la instalación)\
    \ [F14]\n\n1. En el portal en la nube de CLSS (https://fire.eu.honeywell.com/#/home),\
    \ crea un sitio/edificio y añade una central.\n2. Carga la configuración con el\
    \ programa de configuración de CLSS.\n3. Genera el archivo **.bin de licencia**\
    \ de la central.\n\n---\n\n### Configuración del lazo desde CLSS (para CLIP o\
    \ TC800) [F9]\n\n> ⚠️ Para lazos **CLIP o TC800 OPAL/CLIP**, la central debe configurarse\
    \ previamente desde CLSS **antes** de realizar la Auto Configuración. De forma\
    \ predeterminada, la central solo tiene licencia para **protocolo OPAL avanzado**\
    \ [F9].\n\n1. Conecta la herramienta de configuración CLSS.\n2. Ve a **Ajustes\
    \ → Ajustes HMI** y en **Tipo de marca** selecciona **Notifier EN** [F9].\n3.\
    \ En **Ajustes de lazo** [F9]:\n   - Si el lazo **no se utiliza**: marca ☑ **Sin\
    \ Uso**.\n   - Si se utiliza: selecciona **Limitar a VdS 2540** (Sí/No) — el valor\
    \ de resistencia cambia según la selección.\n   - Selecciona el **Tipo de cable**.\n\
    4. Envía la configuración a la central [F9].\n\n> ℹ️ Si un lazo no se va a usar,\
    \ también puedes marcar ☑ **Sin Uso** en \"Configuración de tarjeta de lazo\"\
    \ desde el programa CLSS [F1].\n\n---\n\n### Auto Configuración (búsqueda de dispositivos)\
    \ desde la central [F8][F9]\n\n1. Selecciona **Auto Configuración** en la central\
    \ para buscar dispositivos conectados al lazo. Lee la ventana emergente y confirma\
    \ seleccionando **Auto Configuración** [F8].\n   - Si no hay protocolo especificado\
    \ en la configuración, el lazo usará **protocolo OPAL** por defecto [F8].\n2.\
    \ Una vez completada, selecciona la **flecha derecha (>)** junto al botón Auto\
    \ Búsqueda para ver el estado de averías del lazo [F8].\n3. Lee los mensajes de\
    \ avería y corrige los problemas detectados. Selecciona **Hecho** al completar\
    \ [F8].\n   - Causas típicas de averías: discordancia diseño/cableado, averías\
    \ de cableado, RFI, error de módulo o FA, conexionado incorrecto en dispositivos\
    \ [F8].\n4. Si se han rectificado averías, **repite los pasos 1 a 3** [F8].\n\
    5. **Repite el proceso para cada lazo** hasta descubrir todos [F8].\n\n---\n\n\
    > ℹ️ La longitud máxima del cable de lazo se calcula con el **programa de cálculo\
    \ de lazo y batería de CLSS** y puede ser de hasta **3,5 km** dependiendo del\
    \ tipo de carga y de cable [F2]. Verifica siempre los valores con el Calculador\
    \ Global de Baterías de Bucle en CLSS Suite [F7].\n\n---\n\n**Fuente:** HOP-138-8ES\
    \ issue 6 (01-2026) — Instrucciones de puesta en marcha INSPIRE E10/E15; HOP-138-9ES\
    \ issue 5 (11-2025) — Manual de instalación INSPIRE E10"
