- qid: cat007
  question: En el detector por aspiración FAAST LT-200, ¿qué salidas de relé y de
    sirena tiene y con qué contactos, cómo se comporta el relé de avería ante un fallo
    o un corte de alimentación, qué resistencia de fin de línea llevan las salidas
    de sirena y cuál es la especificación eléctrica de los contactos de relé?
  answer: '# FAAST LT-200 — Salidas de relé, sirena y especificaciones eléctricas


    ## Relés disponibles y sus contactos


    El FAAST LT-200 (versión Stand-Alone) dispone de los siguientes relés, con terminales
    de contacto **NC, C y NA** para cada uno [F6]:


    **Relé de Alarma (canal 1 y canal 2):**

    - Terminal 5: Relé de alarma NC — Canal 1 [F6]

    - Terminal 6: Relé de alarma C — Canal 1 [F6]

    - Terminal 7: Relé de alarma NA — Canal 1 [F6]

    - Terminal 8: Relé de alarma NC — Canal 2 [F6]

    - Terminal 9: Relé de alarma C — Canal 2 [F6]

    - Terminal 10: Relé de alarma NA — Canal 2 [F6]


    **Relé de Avería (canal 1 y canal 2):**

    - Terminal 11: Relé de avería NC — Canal 1 [F6]

    - Terminal 12: Relé de avería C — Canal 1 [F6]

    - Terminal 13: Relé de avería NA — Canal 1 [F6]

    - Terminal 14: Relé de avería NC (AUX.) — Canal 2 [F6]

    - Terminal 15: Relé de avería C (AUX.) — Canal 2 [F6]

    - Terminal 16: Relé de avería NA (AUX.) — Canal 2 [F6]


    **Relé de Prealarma (canal 1 y canal 2):**

    - Terminal 23: Relé de prealarma NC — Canal 1 [F6]

    - Terminal 24: Relé de prealarma C — Canal 1 [F6]

    - Terminal 25: Relé de prealarma NA — Canal 1 [F6]

    - Terminal 26: Relé de prealarma NC — Canal 2 [F6]

    - Terminal 27: Relé de prealarma C — Canal 2 [F6]

    - Terminal 28: Relé de prealarma NA — Canal 2 [F6]


    ---


    ## Salidas de sirena y resistencia de fin de línea


    - Terminal 17: Salida sirena 1 (−) [F6]

    - Terminal 18: Salida sirena 1 (+) [F6]

    - Terminal 19: Salida sirena 2 (−) [F6]

    - Terminal 20: Salida sirena 2 (+) [F6]


    Resistencia de fin de línea: **47 kΩ** en ambas salidas de sirena (sirena 1 y
    sirena 2) [F6]


    ---


    ## Comportamiento de los relés — lógica de activación


    **Relé de Alarma (Stand-Alone):**

    - Se activa cuando se cumple la condición de alarma en un canal [F1]

    - Condición predeterminada: **Nivel 1** [F1]

    - Estado **enclavado** por defecto — se requiere **rearme manual** para desactivar
    el LED y el relé [F1]


    **Relé de Prealarma (Stand-Alone):**

    - Se activa cuando se cumple la condición de prealarma en un canal [F1]

    - Condición predeterminada: **Nivel 1** [F1]

    - Nota: cuando Prealarma = Alarma = Nivel 1, la prealarma se activará al **70
    % del Nivel 1** [F1]


    **Relé de Sirena:**

    - Se activa cuando el canal está en **ALARMA / PREALARMA** [F1]

    - Sirena 1 corresponde al Canal 1; Sirena 2 corresponde al Canal 2 [F1]

    - Estado predeterminado: establecido en **ALARMA** [F1]


    ---


    ## Comportamiento del relé de avería ante fallo o corte de alimentación


    - El relé de avería se activa cuando se produce una **condición de avería en el
    canal 1 o 2**, o una **avería común** [F1]

    - También se activa en **modo de servicio** y cuando se **desconecta la alimentación
    de la unidad** [F1]

    - El estado de avería **no está enclavado** (predeterminado) [F1]


    ---


    ## Especificación eléctrica de los contactos de relé


    - Potencia nominal máxima: **2 A** con carga resistiva a **30 V CC** [F7]

    - Potencia nominal máxima: **0,5 A** con carga resistiva a **30 V CA** [F7]

    - Vida útil mínima: **10⁵ operaciones** [F3]


    ---


    > **Nota:** Los datos de terminales y comportamiento de relés corresponden a la
    versión **Stand-Alone** del FAAST LT-200. La versión en lazo (Loop) no dispone
    de relé de prealarma en su tabla de relés [F2][F10].


    **Fuentes:**

    - I56-6574-005_ES — HS Stand Alone FAAST LT-200 QIG (sin revisión registrada)

    - I56-6577-006_ES — FAAST Notifier LT-200 QIG (sin revisión registrada)'
