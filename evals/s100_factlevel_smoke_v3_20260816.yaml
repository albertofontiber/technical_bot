- qid: hp001
  question: En la Detnov CAD-250, ¿cómo se entra al menú de programación avanzada?
  answer: '## Acceso al menú de programación avanzada en la CAD-250


    Para acceder al nivel de configuración completo (nivel 3 / administrador), sigue
    estos pasos:


    **1. Desde la pantalla de reposo**

    Toca el icono del candado (🔒) en la pantalla táctil [F1][F2].


    **2. Introducir clave de administrador**

    En la pantalla de acceso, introduce la clave de administrador por defecto: **2222**
    [F1][F2].


    > ⚠️ El uso indebido del nivel de administrador puede provocar un mal funcionamiento
    de la instalación. Asegúrate de tener la autorización necesaria [F1][F2].


    **3. Pantalla de administrador (Nivel 3)**

    Una vez dentro, tendrás acceso al menú de configuración completo [F3][F7], que
    incluye las siguientes secciones en el **Menú Principal** [F9]:

    - **Lazo** (Dispositivos, Valor Analógico, Salidas, Auto-búsqueda, Calidad comunicación,
    Programación de dirección)

    - **Sectorización** (Áreas, Zonas)

    - **Maniobras** (Maniobras, Grupos, Módulos virtuales, Estado VM)

    - **Logs** (Todos, Alarma, Avería, Técnico, Test, Información, Borrar Logs)

    - **Red** (Configuración de red, Filtros de red, Configuración de ModBus)

    - **Ajustes** (General, Versiones, Usuarios, **Avanzado**, Conectividad, Impresora,
    Logs, Test)

    - **Instalación** (Modos especiales, Retardo en dos fases, Panel, Lazo)


    **4. Acceso a los ajustes avanzados específicos**

    Para los parámetros avanzados de ingeniero (número de cabinas, lazos, LEDs de
    zona, etc.), navega a [F5]:


    **AJUSTES** (Menú principal) **> AVANZADO** (Submenú)


    Desde ahí dispones de 3 pestañas: **SISTEMA**, **OTROS** y **REINICIAR** [F5].


    ---


    **Nota sobre niveles de acceso:**

    - **Nivel 1** (sin código): solo visualización y funciones básicas de control
    [F7].

    - **Nivel 2** (código de usuario): deshabilitaciones, logs, ajustes básicos [F7].

    - **Nivel 3** (código administrador **2222** por defecto): acceso completo a toda
    la configuración [F7].


    Los códigos de usuario se generan desde **AJUSTES > USUARIOS**, accesible con
    el código de administrador [F4].


    ---


    Fuente: CAD-250_Manual-Configuracion-MC-380-es-2026-c (rev. c, 2026-04-23); Manual
    instalacion CAD-250 (MI_372_es_2024 e)'
