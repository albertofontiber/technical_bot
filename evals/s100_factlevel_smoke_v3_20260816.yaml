- qid: hp007
  question: ¿Cómo se realiza el test anual de un detector VESDA-E VEP según el manual
    del fabricante?
  answer: '# Test anual del detector VESDA-E VEP-A10-P


    Según el calendario de mantenimiento del manual, las tareas con frecuencia **anual**
    para el VEP-A10-P son las siguientes [F1]:


    ---


    ## Tareas anuales obligatorias


    **1. Prueba de humos (integridad de la red de tubería)**


    Introduce una muestra de humo en el orificio de muestreo más alejado y mide el
    tiempo de transporte hasta el detector [F2]. Los resultados deben registrarse
    y compararse con pruebas anteriores para detectar variaciones del sistema [F2].


    El procedimiento detallado de la prueba de humo se encuentra en la **VESDA-E Commissioning
    Guide** (guía de puesta en marcha de VESDA-E) [F2].


    **2. Comprobar el flujo de las tuberías** [F1]


    **3. Limpiar los puntos de muestreo** [F1]


    **4. Limpiar con agua la red de tuberías** [F1]


    ---


    ## Comandos de prueba disponibles desde Xtralis VSC


    Para verificar el correcto funcionamiento del detector durante el mantenimiento
    anual, el software **Xtralis VSC** permite ejecutar los siguientes comandos [F9]:


    - **Iniciar prueba de alarma** ("Start Alarm Test"): simula nivel de humo de escala
    completa, generando condiciones de Alerta, Acción, Fuego 1 y Fuego 2. Los relés
    de alarma se activarán salvo que el detector esté desactivado [F9].

    - **Inicio de la prueba de fallo de circulación del aire** ("Start Air Flow Fault
    Test"): comprueba el sistema de detección de caudal apagando el aspirador [F9].

    - **Iniciar prueba de relés** ("Start Relay Test"): activa y desactiva los relés
    disponibles para probarlos [F9].

    - **Iniciar prueba de fallo importante** ("Start Major Fault Test"): genera un
    fallo importante y desactiva el relé de fallo durante **2 minutos** [F9].

    - **Iniciar prueba de fallo menor** ("Start Minor Fault Test"): genera un fallo
    menor y desactiva el relé de fallo durante **2 minutos** [F9].

    - **Iniciar prueba de LED** ("Start LED Test"): realiza un ciclo de prueba de
    todos los indicadores LED del panel [F9].


    ---


    ## Precauciones previas al mantenimiento


    Antes de iniciar cualquier tarea [F1]:


    1. **Informa a la autoridad supervisora** adecuada.

    2. **Aísla los dispositivos** existentes que dependan del detector antes de comenzar.

    3. Cuando se realicen pruebas de humo, **sigue los procedimientos del sitio**
    para evitar falsas alarmas en los servicios supervisados.


    > ⚠️ Cuando el detector está deshabilitado o en espera, **no emitirá advertencias
    de fuego** [F1].


    Para realizar tareas en la red de tubería o puntos de muestreo, establece el detector
    en **modo en espera** ("Go to Standby") desde el menú Dispositivo de Xtralis VSC.
    Esto desactiva el aspirador y detiene la detección de alarmas (pero no la detección
    ni señalización de fallos) [F7]. Para reactivar, selecciona **"End Standby"**
    en el mismo menú [F7].


    > ⚠️ Toma precauciones contra **descarga electrostática** antes de retirar el
    tablero del detector [F11].


    ---


    **Nota adicional:** La frecuencia de las comprobaciones puede variar según los
    códigos y normas locales y el entorno de la instalación [F1]. El mantenimiento
    puede realizarlo el instalador original, un distribuidor autorizado o el contratista
    de servicio [F1].


    ---


    Fuente: 33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores (sin revisión
    registrada)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "**Atención:** Pendant que le detecteur ou la zone est desactivee, aucun feu
    d''indication va etre emis par le detecteur." (33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores,
    p. 87) [F1]'
