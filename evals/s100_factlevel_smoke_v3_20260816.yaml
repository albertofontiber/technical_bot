- qid: cat007
  question: En el detector por aspiración FAAST LT-200, ¿qué salidas de relé y de
    sirena tiene y con qué contactos, cómo se comporta el relé de avería ante un fallo
    o un corte de alimentación, qué resistencia de fin de línea llevan las salidas
    de sirena y cuál es la especificación eléctrica de los contactos de relé?
  answer: '# FAAST LT-200 — Salidas de relé, sirena y especificaciones eléctricas


    ## Relés disponibles y su comportamiento


    El FAAST LT-200 dispone de los siguientes relés [F4]:


    - **Relé de ALARMA 1 y 2**: Se activa cuando se cumple la condición de alarma
    en el canal correspondiente. El estado de alarma está **enclavado por defecto**
    — se necesita un rearme manual para desactivar el LED y el relé [F4].

    - **Relé de PREALARMA 1 y 2**: Se activa cuando se cumple la condición de prealarma
    en el canal correspondiente. Condición predeterminada = Nivel 1. Cuando PREALARMA
    = ALARMA = Nivel 1, la prealarma se activará al 70 % del nivel 1 [F4].

    - **Relé de AVERÍA 1 y 2**: Se activa ante una condición de avería en el canal
    1 o 2, o ante una avería común. **También se activa en modo de servicio y cuando
    se desconecta la alimentación de la unidad**. El estado de avería **no está enclavado**
    (predeterminado) [F4].

    - **Relé de SIRENA 1 y 2**: Se activa cuando el canal está en ALARMA o PREALARMA.
    La sirena 1 corresponde al canal 1 y la sirena 2 al canal 2. Estado predeterminado
    = establecido en ALARMA [F4].


    ---


    ## Terminales y contactos de cada relé


    Según la tabla de designaciones de terminales [F3]:


    **Relé de alarma — Canal 1 (T1):**

    - Terminal 5: Relé de alarma **NC** — C1

    - Terminal 6: Relé de alarma **C** — C1

    - Terminal 7: Relé de alarma **NA** — C1


    **Relé de alarma — Canal 2 (T2):**

    - Terminal 8: Relé de alarma **NC** — C2

    - Terminal 9: Relé de alarma **C** — C2

    - Terminal 10: Relé de alarma **NA** — C2


    **Relé de avería — Canal 1 (T3):**

    - Terminal 11: Relé de avería **NC** — C1

    - Terminal 12: Relé de avería **C** — C1

    - Terminal 13: Relé de avería **NA** — C1


    **Relé de avería AUX — Canal 2 (T4):**

    - Terminal 14: Relé de avería **NC (AUX.)** — C2

    - Terminal 15: Relé de avería **C (AUX.)** — C2

    - Terminal 16: Relé de avería **NA (AUX.)** — C2


    **Relé de prealarma — Canal 1 (T9):**

    - Terminal 23: Relé de prealarma **NC** — C1

    - Terminal 24: Relé de prealarma **C** — C1

    - Terminal 25: Relé de prealarma **NA** — C1


    **Relé de prealarma — Canal 2 (T10):**

    - Terminal 26: Relé de prealarma **NC** — C2

    - Terminal 27: Relé de prealarma **C** — C2

    - Terminal 28: Relé de prealarma **NA** — C2


    ---


    ## Salidas de sirena y resistencia de fin de línea


    **Salida sirena 1 (T5):**

    - Terminal 17: Salida sirena 1 **−**

    - Terminal 18: Salida sirena 1 **+**

    - Resistencia de fin de línea: **47 kΩ** [F3]


    **Salida sirena 2 (T6):**

    - Terminal 19: Salida sirena 2 **−**

    - Terminal 20: Salida sirena 2 **+**

    - Resistencia de fin de línea: **47 kΩ** [F3]


    ---


    ## Comportamiento del relé de avería ante fallo o corte de alimentación


    El relé de avería se activa en los siguientes casos [F4]:

    - Condición de avería en el canal 1 o 2

    - Avería común

    - Modo de servicio

    - **Desconexión de la alimentación de la unidad**


    El estado de avería **no está enclavado** (predeterminado), lo que significa que
    se desactiva automáticamente cuando cesa la condición que lo originó, sin necesidad
    de rearme manual [F4].


    ---


