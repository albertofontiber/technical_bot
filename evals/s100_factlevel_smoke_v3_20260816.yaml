- qid: hp018
  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  answer: '## Conexionado de sirena convencional en salidas de sirena de la ZXe


    Las salidas de sirena de la ZXe son **supervisadas** y admiten sirenas convencionales
    con las siguientes condiciones:


    ---


    ### Número de salidas disponibles


    - **ZX2e**: 2 salidas supervisadas (Sirena A y Sirena B) [F4]

    - **ZX5e**: 4 salidas supervisadas (Sirena A, B, C y D) [F4]


    Los terminales en la ZX2e se identifican como **A+, A-, B+, B-** en el bloque
    de sirenas [F4].

    En la ZX5e los terminales son **A-, A+, B-, B+, C-, C+, D-, D+** en el bloque
    TB7 [F4].


    ---


    ### Parámetros eléctricos clave


    - **Corriente máxima por circuito**: **1 A** [F11]

    - **Resistencia Final de Línea (RFL)**: **6.800 Ω (6K8), 0,5 W mínimo** [F11]

    - **Longitud máxima de cable recomendada**: no superior a **1 km** (por encima,
    la capacitancia e inductancia pueden afectar al funcionamiento) [F3]

    - **Sección mínima de cable**: la adecuada para garantizar la alimentación de
    las sirenas a la tensión recomendada por el fabricante, tanto en alimentación
    principal como en condiciones de mínima tensión de baterías [F3]


    ---


    ### Requisitos de conexionado


    1. **Sirenas con polaridad**: conéctelas respetando la polaridad (+/-) de la salida.
    Cada sirena debe llevar un **diodo integrado** para impedir el consumo en polarización
    inversa (supervisión) [F4].


    2. **Sirenas/campanas sin polaridad**: deben instalarse con un **diodo de polarización
    y protección** en cada dispositivo no polarizado conectado a la línea [F4].


    3. **Resistencia Final de Línea (RFL)**: instalar una resistencia de **6.800 Ω,
    0,5 W mínimo** entre + y - al final de la última sirena del circuito, para supervisión
    de apertura y cortocircuito [F11]. Si no se conecta ninguna sirena, la RFL se
    coloca directamente en los terminales de la central [F1].


    4. **Sin ramales**: no realizar derivaciones en paralelo en la línea de sirenas.
    La supervisión se realiza sobre la línea directa hasta la RFL; los ramales no
    quedan supervisados [F2].


    5. **No enrollar el cable en los terminales**: cortar y empalmar las conexiones
    adecuadamente para mantener la supervisión de la línea [F3].


    ---


    ### Funcionamiento de la supervisión


    El circuito se polariza en **inverso en reposo** para supervisar la línea. Al
    dispararse la salida, cambia a polarización normal permitiendo el funcionamiento
    de las sirenas [F4]. Cualquier fallo (circuito abierto o cortocircuito) se mostrará
    en pantalla y quedará registrado en el sistema [F5].


    ---


    ### Referencia al diagrama


    Para el esquema de conexionado exacto (disposición de sirenas en cadena con la
    RFL al final), consulta la **Figura 15 – Circuito de sirenas convencionales**
    del manual de instalación [F3], y la **Figura 13** (ZX2e) o **Figura 14** (ZX5e)
    para la identificación física de los terminales en placa [F4].


    ---


    **Fuentes:**

    - Manual de Instalación Paneles ZX2e/ZX5e — Documento No. MIE-MI-530, Revisión:
    001 (MORLEY-IAS)

    - Manual de Configuración Paneles ZX2e/ZX5e — Documento No. MIE-MP-530, Revisión:
    001 (MORLEY-IAS)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "(NOTA: Las salidas de relé no se activan nunca)." (MIE-MU-530rv001, p. 17)
    [F10]

    - "Todas las salidas de sirena quedan configuradas por defecto para sonar de forma
    contínua con cualquier alarma de cualquier zona, quedándo así en el patrón 1."
    (MIE-MP-310, p. 38) [F7]'
