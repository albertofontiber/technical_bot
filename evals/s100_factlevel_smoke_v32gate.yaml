- qid: cat017
  question: ¿Como se cablea y se da de alta (configura) un lazo en la central Notifier
    INSPIRE (E10/E15)?
  answer: "# Cableado y configuración de lazo en INSPIRE E10/E15\n\nA continuación\
    \ se detalla el proceso completo en dos fases: **cableado físico** y **configuración/alta\
    \ en CLSS**.\n\n---\n\n## FASE 1 — CABLEADO FÍSICO DEL LAZO\n\n### 1.1 Módulo\
    \ de lazo OPAL X2 (HOP-433-100) — Identificación de terminales\n\nEl módulo de\
    \ lazo tiene color **morado** [F2] y dispone de 10 terminales [F2][F3]:\n\n**Lazo\
    \ 1:**\n- Terminal **1** → Lazo 1 Salida +VE\n- Terminal **2** → Lazo 1 Salida\
    \ -VE\n- Terminal **3** → ⊕ *(no usar para pantalla de cable)*\n- Terminal **4**\
    \ → Lazo 1 Entrada +VE\n- Terminal **5** → Lazo 1 Entrada -VE\n\n**Lazo 2:**\n\
    - Terminal **6** → Lazo 2 Salida +VE\n- Terminal **7** → Lazo 2 Salida -VE\n-\
    \ Terminal **8** → ⊕ *(no usar para pantalla de cable)*\n- Terminal **9** → Lazo\
    \ 2 Entrada +VE\n- Terminal **10** → Lazo 2 Entrada -VE\n\n> ⚠️ **No utilice los\
    \ terminales 3 y 8 para la pantalla del cable de lazo. La pantalla debe conectarse\
    \ a la barra de tierra de la central** [F2][F3].\n\n### 1.2 Restricciones de cableado\n\
    \n- **No mezclar dispositivos OPAL y CLIP en el mismo lazo** [F2].\n- La longitud\
    \ máxima del lazo puede ser de **hasta 3,5 km**, dependiendo del tipo de carga\
    \ y de cable — verificar siempre con el programa de cálculo de lazo y batería\
    \ de **CLSS** [F2].\n- La capacidad del cable debe ser **inferior a 0,5 µF** [F7].\n\
    - Se recomienda conectar **un extremo de la pantalla del cable de lazo a la barra\
    \ de tierra de la central** [F8].\n\n### 1.3 Capacidad máxima por lazo\n\n**Dispositivos\
    \ OPAL** [F2][F4]:\n- Hasta **159 detectores OPAL**\n- Hasta **159 módulos OPAL**\
    \ (sirenas, pulsadores, módulos E/S)\n- Corriente máxima por lazo: **750 mA**\
    \ [F2]\n\n**Dispositivos CLIP** (requiere licencia) [F4]:\n- Hasta **99 detectores\
    \ CLIP**\n- Hasta **99 módulos CLIP**\n\n> ⚠️ **EN54-2, apartado 13.7**: restricción\
    \ de **512 detectores y/o pulsadores** por módulo de lazo (que comprende 2 circuitos\
    \ de lazo) [F2].\n\n---\n\n## FASE 2 — COMPROBACIONES PREVIAS CON MULTÍMETRO\n\
    \nAntes de conectar el lazo a la central, realiza estas verificaciones [F5][F6][F7]:\n\
    \n1. **Comprueba la continuidad** de cada parte del lazo y mide la resistencia\
    \ de extremo a extremo [F5].\n2. **Comprueba la continuidad de la pantalla** del\
    \ cable (debe dar resistencia muy baja) y verifica que **no hay continuidad entre\
    \ la pantalla y los cables +VE/-VE** [F5].\n3. Con el **multímetro en función\
    \ de prueba de diodo**, conecta en **polaridad invertida** (+VE del multímetro\
    \ al negativo del lazo, -VE al positivo). Debe indicar un **diodo en polarización\
    \ directa** [F6].\n4. Conecta en **polaridad normal** (+VE al positivo, -VE al\
    \ negativo). Al principio leerá resistencia baja, que irá aumentando al cargarse\
    \ los condensadores de los dispositivos. Si indica diodo en directa, hay dispositivos\
    \ con polaridad invertida o cortocircuito [F6].\n5. Verifica que la **resistencia\
    \ medida sea inferior a** [F7]:\n   - **40 Ω** para lazo protocolo **OPAL** (comunicación\
    \ correcta)\n   - **40 Ω** para lazo protocolo **CLIP** (detección de dos dispositivos)\n\
    \   - **71 Ω** para lazo **CLIP** si no se necesita detección de dirección duplicada\n\
    \n   > Para medir: desconecta físicamente el lazo de los terminales de la central,\
    \ mide entre *Lazo X Entrada -VE* y *Lazo X Salida -VE*, multiplica el resultado\
    \ por 2 y añade la resistencia de cada aislador (**0,1 a 0,13 Ω**) [F7].\n\n6.\
    \ Si hay dispositivos con polaridad invertida, localízalos por **sectorización\
    \ sucesiva del lazo** [F6].\n\n> ℹ️ Se recomienda usar la herramienta **POL-200-TS**\
    \ para diagnósticos más detallados antes de conectar a la central (funciona con\
    \ protocolos OPAL y CLIP) [F8].\n\n---\n\n## FASE 3 — CONEXIÓN A LA CENTRAL Y\
    \ PRIMER ENCENDIDO\n\n1. Una vez verificado el cableado, conecta el circuito de\
    \ lazo al bloque de terminales seleccionado en la central [F8].\n2. Para lazo\
    \ **CLIP**: reconecta primero los aisladores desconectados temporalmente en módulos\
    \ y pulsadores, y luego conecta a la central [F8].\n3. El **primer encendido**\
    \ debe realizarse **sin cableado externo conectado**, pero con la fuente de alimentación\
    \ y un circuito de lazo probado conectado [F1].\n4. Conecta el cable HMI de la\
    \ puerta a la CPU, la corriente principal y las baterías (**2 × 12 V 24 Ah** para\
    \ E10/E15) [F1].\n\n---\n\n## FASE 4 — CONFIGURACIÓN DEL LAZO EN CLSS (Alta)\n\
    \n### 4.1 Preparación previa (antes de ir a la instalación)\n\n- En el portal\
    \ en la nube de CLSS, crea el sitio/edificio y añade la central [F14].\n- Carga\
    \ la configuración con el programa de configuración de CLSS y genera el archivo\
    \ **.bin de licencia** [F14].\n- Accede al portal: **https://fire.eu.honeywell.com/#/home**\
    \ [F14].\n\n### 4.2 Configuración de ajustes de lazo en CLSS\n\n1. Selecciona\
    \ **\"Ajustes\"** → **\"Ajustes HMI\"** y en **Tipo de marca** selecciona **Notifier\
    \ EN** [F9].\n2. En **\"Ajustes de lazo\"** [F9]:\n   - Si el lazo **no se utiliza**:\
    \ marca ☑ **Sin Uso** [F1][F9].\n   - Si el lazo se usa: selecciona **\"Limitar\
    \ a VdS 2540\"** (Sí o No) — el valor de resistencia cambia según la selección.\n\
    \   - Selecciona el **tipo de cable**.\n3. Envía la configuración a la central\
    \ siguiendo los pasos del apartado **\"Enviar configuración a la central\"** [F9].\n\
    \n> ⚠️ Para lazo **CLIP** o **TC800 OPAL/CLIP**: se requiere **licencia específica**\
    \ antes de realizar la Auto Configuración. Por defecto, la central solo tiene\
    \ licencia para **protocolo avanzado OPAL** [F9].\n\n### 4.3 Auto Configuración\
    \ (búsqueda de dispositivos)\n\n1. Selecciona **Auto Configuración** en la central\
    \ para buscar dispositivos conectados al lazo [F10].\n2. Lee la información de\
    \ la ventana emergente y confirma seleccionando **Auto Configuración** [F10].\n\
    3. Una vez completada, selecciona la **flecha derecha (>)** junto al botón Auto\
    \ Búsqueda para ver el estado de averías del lazo [F10].\n4. Lee los mensajes\
    \ de avería y rectifica los problemas. Selecciona **Hecho** al completar [F10].\n\
    5. **Repite los pasos 1 a 4** para cada lazo hasta descubrir todos los lazos del\
    \ sistema [F10].\n\n**Causas típicas de averías tras Auto Configuración** [F10]:\n\
    - Discordancia entre diseño y cableado\n- Averías en el cableado\n- Presencia\
    \ de fuente de RFI fuerte\n- Error de módulo o fuente de alimentación\n- Conexionado\
    \ incorrecto en dispositivos\n\n---\n\n**Fuente:** HOP-138-8ES issue 6 (01-2026)\
    \ — INSPIRE E10/E15 Instrucciones de puesta en marcha; HOP-138-9ES issue 5 (11-2025)\
    \ — INSPIRE E10 Manual de instalación\n\n---\n⚠️ **Información adicional del manual:**\n\
    - \"> ⚠️ NUNCA utilice un dispositivo con alta tensión conectándolo en el circuito\
    \ de lazo de la central.\" [F5]\n- \"- Left side: CPU module with 6 connection\
    \ terminals and external wiring connection point ②\n- Center top: HMI cable connection\
    \ detail showing CPU with points \"a\" and \"b\" marked as ①\n- Center middle:\
    \ Central unit internal view showing wiring connections with color-coded wires\
    \ (brown, yellow/green, blue) connecting to L and N terminals, marked as ②\n-\
    \ Right side: Power supply terminal block showing L (brown wire) and N (blue wire)\
    \ connections with earth (yellow/green wire)\n- Bottom center: Battery connection\
    \ diagram showing 2 x 12 V 24 Ah batteries with positive and negative terminals,\
    \ marked as ③\n- Bottom right: Circular detail view showing battery terminal connection\
    \ with + and - markings]\" [F1]"
