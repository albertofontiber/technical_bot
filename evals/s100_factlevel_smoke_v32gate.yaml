- qid: hp009
  question: ¿Cuál es la resistencia de fin de línea recomendada para los lazos de
    la central Morley ZXe?
  answer: 'La resistencia de fin de línea (RFL) para los **circuitos de sirenas**
    de la central **ZXe** es de **6,8 KΩ (6800 Ω), 0,5 W mínimo** [F6][F3].


    Esta RFL debe instalarse al final de cada circuito de sirena para la supervisión
    ante cortocircuito y circuito abierto [F6].


    **Puntos clave de instalación:**


    - Si no se instalan sirenas en el circuito, conecta la RFL directamente entre
    + y − en el terminal de la central [F1]

    - No realices ramales en la línea de sirenas; la supervisión se realiza sobre
    la línea directa hasta la RFL — los ramales paralelos no quedan supervisados [F2]

    - No se recomienda cable de longitud superior a **1 km** en los circuitos de sirenas
    [F3]

    - Asegúrate de usar secciones de cable adecuadas para mantener la tensión en las
    sirenas tanto en alimentación principal como en condiciones de mínima tensión
    de baterías [F3]


    ---


    **Nota sobre el lazo RS-485 (periférico):** Si tu consulta era sobre el lazo de
    comunicaciones RS-485 (no el circuito de sirenas), la RFL es diferente: **150
    Ω, 0,5 W mínimo**, colocada en cada extremo libre de la cadena [F9].


    ---


    Fuente: Manual de Instalación Paneles de Incendio ZX2e / ZX5e — Documento No.
    MIE-MI-530, Revisión: 001


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "Es imprescindible comprobar que no hay conexión entre los terminales A y B
    y que el lazo entra a un lado del conector y sale por el otro o termina en la
    resistencia RFL de 150 Ohmios." (MIE-MI-310, p. 22) [F4]

    - "> ⚠️ El cableado debe ser testado antes de conectar la central y antes de conectar
    los terminales, asegurando que cada cable está en su terminal, ya que variar las
    tensiones en los equipos dañará gravemente el sistema." (MIE-MI-310, p. 5) [F10]

    - "Debe instalarse siempre una resistencia RFL entre + y - de la última sirena
    para controlar la apertura o cierre de la línea de sirenas." (MIE-MI-310, p. 18)
    [F1]'
