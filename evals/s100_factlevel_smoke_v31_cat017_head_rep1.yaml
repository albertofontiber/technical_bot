per_gold:
- qid: cat017
  question: ¿Como se cablea y se da de alta (configura) un lazo en la central Notifier
    INSPIRE (E10/E15)?
  answer: "# Cableado y configuración de lazo — Notifier INSPIRE E10/E15\n\nEl proceso\
    \ se divide en tres fases: **cableado físico**, **verificación con multímetro**\
    \ y **configuración/auto-aprendizaje en CLSS**.\n\n---\n\n## FASE 1 — CABLEADO\
    \ FÍSICO DEL LAZO\n\n### Terminales del módulo LAZO OPAL X2 (HOP-433-100)\n\n\
    El módulo de lazo es de **color morado** [F2] y dispone de 10 terminales [F2][F3]:\n\
    \n**Lazo 1:**\n- Terminal **1**: Lazo 1 Salida +VE\n- Terminal **2**: Lazo 1 Salida\
    \ -VE\n- Terminal **3**: ⊕ — **NO usar para pantalla de cable**\n- Terminal **4**:\
    \ Lazo 1 Entrada +VE\n- Terminal **5**: Lazo 1 Entrada -VE\n\n**Lazo 2:**\n- Terminal\
    \ **6**: Lazo 2 Salida +VE\n- Terminal **7**: Lazo 2 Salida -VE\n- Terminal **8**:\
    \ ⊕ — **NO usar para pantalla de cable**\n- Terminal **9**: Lazo 2 Entrada +VE\n\
    - Terminal **10**: Lazo 2 Entrada -VE\n\n> ⚠️ **La pantalla del cable de lazo\
    \ debe conectarse a la barra de tierra de la central, NO a los terminales 3 u\
    \ 8** [F2][F3].\n> Se recomienda poner a tierra un extremo de la pantalla [F7].\n\
    \n### Numeración de lazos\n\nLos circuitos de lazo se numeran secuencialmente\
    \ de **izquierda a derecha** del portamódulos. En la E15 (dos filas), la segunda\
    \ fila continúa la numeración desde la primera [F2].\n\n### Restricciones de mezcla\
    \ y capacidad\n\n- **No se permite mezclar dispositivos OPAL y CLIP en el mismo\
    \ lazo** [F2].\n- Modo **OPAL**: hasta **159 detectores + 159 módulos** por lazo\
    \ (318 dispositivos totales) [F2][F4].\n- Modo **CLIP**: hasta **99 detectores\
    \ + 99 módulos** por lazo [F2][F4]. Requiere licencia específica [F9].\n- Corriente\
    \ máxima por lazo: **750 mA** [F2].\n- Aprobación **VdS2540**: 99 detectores +\
    \ 99 módulos por lazo con cable de ∅ 0,8 mm [F4].\n- Restricción **EN54-2 (13.7)**:\
    \ máximo **512 detectores y/o pulsadores** por módulo de lazo (los 2 circuitos\
    \ en conjunto) [F2].\n- Longitud máxima de cable: **hasta 3,5 km** dependiendo\
    \ del tipo de carga y cable — verificar siempre con el **calculador de lazo y\
    \ batería de CLSS** [F2].\n\n> ⚠️ **NUNCA uses un comprobador de alta tensión\
    \ (megóhmetro) en el circuito de lazo una vez conectados los dispositivos.** Solo\
    \ multímetro de baja tensión [F5].\n\n---\n\n## FASE 2 — VERIFICACIÓN CON MULTÍMETRO\
    \ (antes de conectar a la central)\n\nSe recomienda usar la herramienta **POL-200-TS**\
    \ para diagnóstico previo (compatible con OPAL y CLIP) [F7].\n\n### Preparación\
    \ de aisladores\n\n- Dispositivos **OPAL** (base B501 AP): al retirar el detector,\
    \ los terminales **+2 y +4** de la base mantienen continuidad automáticamente\
    \ [F8].\n- En módulos y pulsadores OPAL con aislador: terminales **+2 y +4** (módulos)\
    \ y **+3 y +4** (pulsadores) [F8].\n- Dispositivos **CLIP**: puentea temporalmente\
    \ los terminales **2 y 4** de cada aislador [F8].\n\n> ℹ️ Con aisladores activos,\
    \ el conductor positivo del lazo será un circuito abierto [F5][F8].\n\n### Comprobaciones\
    \ paso a paso\n\n1. Comprueba la **continuidad** de cada parte del lazo y mide\
    \ la resistencia extremo a extremo [F5][F8].\n2. Mide entre **Lazo X Entrada -VE**\
    \ y **Lazo X Salida -VE** con el lazo desconectado de la central. Multiplica el\
    \ resultado por 2 y suma la resistencia de cada aislador (**0,1 a 0,13 Ω** por\
    \ aislador) [F8].\n\n   **Límites de resistencia máxima** [F8]:\n   - Lazo **OPAL**:\
    \ resistencia < **40 Ω**\n   - Lazo **CLIP** (detección de dirección duplicada):\
    \ < **40 Ω**\n   - Lazo **CLIP** (sin detección de dirección duplicada): < **71\
    \ Ω**\n\n   La **capacidad del cable** debe ser inferior a **0,5 µF** [F8].\n\n\
    3. Comprueba la continuidad de la **pantalla del cable** (resistencia muy baja)\
    \ [F5].\n4. Verifica que **no hay continuidad** entre la pantalla y los cables\
    \ +VE ni -VE [F5][F6].\n5. Con el multímetro en **función de prueba de diodo**,\
    \ conecta en **polaridad invertida** (+VE del multímetro al negativo del lazo,\
    \ -VE al positivo): debe indicar **diodo en polarización directa** [F6].\n6. Conecta\
    \ en **polaridad normal** (+VE al positivo, -VE al negativo): al inicio debe leer\
    \ resistencia baja, que **aumenta progresivamente** al cargarse los condensadores\
    \ de los dispositivos [F6].\n   - Si indica diodo en directa en este paso → uno\
    \ o varios dispositivos están **conectados en polaridad inversa o hay cortocircuito**\
    \ [F6].\n7. Si hay dispositivos en polaridad inversa, localízalos por **sectorización\
    \ sucesiva** del lazo [F6].\n8. Comprueba que no hay conexión entre la pantalla\
    \ y los cables +VE ni -VE en ningún punto del recorrido [F6].\n\n### Conexión\
    \ a la central\n\n- **Lazo OPAL**: una vez verificado, conecta el circuito al\
    \ bloque de terminales seleccionado [F7].\n- **Lazo CLIP**: reconecta los aisladores\
    \ desconectados temporalmente, módulos y pulsadores; luego conecta al bloque de\
    \ terminales [F7].\n\n---\n\n## FASE 3 — CONFIGURACIÓN EN CLSS Y AUTO-APRENDIZAJE\n\
    \n### Primer encendido\n\nLa primera vez, enciende la central **sin cableado externo**,\
    \ pero con la fuente de alimentación y al menos un circuito de lazo probado conectado\
    \ [F1].\n\n> ⚠️ Toma precauciones para evitar activación inadvertida de equipos\
    \ conectados (módulos con salidas a centros de control, etc.) [F1].\n\n### Configuración\
    \ previa en CLSS (paso 09)\n\nAntes de ejecutar Auto Configuración en lazo CLIP\
    \ o TC800 OPAL/CLIP [F9]:\n\n1. Conecta la herramienta de configuración CLSS.\n\
    2. Ve a **\"Ajustes\" → \"Ajustes HMI\"** y en **Tipo de marca** selecciona **Notifier\
    \ EN** [F9].\n3. Ve a **\"Ajustes de lazo\"**:\n   - Si el lazo **no se usa**:\
    \ marca ☑ **Sin Uso** [F1][F9].\n   - Si se usa: selecciona **\"Limitar a VdS\
    \ 2540\"** (Sí/No) — el valor de resistencia cambia según la selección [F9].\n\
    \   - Selecciona el **tipo de cable** [F9].\n4. Envía la configuración a la central\
    \ [F9].\n\n> ℹ️ De forma predeterminada, la central tiene licencia para **modo\
    \ OPAL (Protocolo avanzado)** únicamente. Para CLIP o TC800 se requiere **licencia\
    \ adicional** [F9].\n\n### Auto Configuración (auto-aprendizaje de dispositivos)\n\
    \n1. En la central, selecciona **Auto Configuración** para buscar dispositivos\
    \ en el lazo. Confirma en la ventana emergente seleccionando **Auto Configuración**\
    \ / **Learn Devices** [F10].\n   - Si no hay protocolo configurado, el lazo usará\
    \ **protocolo OPAL** por defecto [F10].\n2. Al completar, selecciona la **flecha\
    \ derecha (>)** junto al botón Auto Búsqueda para ver el estado de averías del\
    \ lazo [F10].\n3. Lee los mensajes de avería y corrige los problemas detectados.\
    \ Selecciona **Hecho** al terminar [F10].\n4. Si se han corregido averías, **repite\
    \ los pasos 1 a 3** [F10].\n5. Repite el proceso para **cada lazo** hasta descubrir\
    \ todos [F10].\n\n### Averías típicas tras Auto Configuración\n\nLas averías pueden\
    \ deberse a [F10]:\n- Discordancia entre diseño e instalación real\n- Averías\
    \ en el cableado\n- Fuentes de RFI externas\n- Error de módulo o fuente de alimentación\n\
    - Conexionado incorrecto en dispositivos\n\n---\n\n**Fuente:** HOP-138-8ES issue\
    \ 6 (01-2026) — Instrucciones de puesta en marcha INSPIRE E10/E15; HOP-138-9ES\
    \ issue 5 (11-2025) — Manual de instalación INSPIRE E10"
