  bot_answer: 'Aquí tienes el resumen completo de salidas de relé y sirena del **FAAST
    LT-200**, distinguiendo entre las dos variantes documentadas (Stand Alone y Loop/Notifier):


    ---


    ## 1. Relés disponibles y sus contactos


    El FAAST LT-200 dispone de los siguientes relés, cada uno con tres contactos:
    **NC (normalmente cerrado), C (común) y NA (normalmente abierto)**:


    **Variante Stand Alone** (I56-6574-005_ES):


    - **Relé de alarma Canal 1** → terminales 5 (NC), 6 (C), 7 (NA) [F7]

    - **Relé de alarma Canal 2** → terminales 8 (NC), 9 (C), 10 (NA) [F7]

    - **Relé de avería Canal 1** → terminales 11 (NC), 12 (C), 13 (NA) [F7]

    - **Relé de avería Canal 2 (AUX.)** → terminales 14 (NC), 15 (C), 16 (NA) [F7]

    - **Relé de prealarma Canal 1** → terminales 23 (NC), 24 (C), 25 (NA) [F7]

    - **Relé de prealarma Canal 2** → terminales 26 (NC), 27 (C), 28 (NA) [F7]


    **Variante Loop/Notifier** (I56-6575-005_ES / I56-6577-006_ES):


    - **Relé de alarma Canal 1** → terminales 5 (NC), 6 (C), 7 (NA) [F6]

    - **Relé de alarma Canal 2** → terminales 8 (NC), 9 (C), 10 (NA) [F6]

    - **Relé de avería Canal 1** → terminales 11 (NC), 12 (C), 13 (NA) [F6]

    - **Relé de avería Canal 2 (AUX.)** → terminales 14 (NC), 15 (C), 16 (NA) [F6]

    - *(Sin relés de prealarma independientes en esta variante)* [F6]


    ---


    ## 2. Salidas de sirena y resistencia de fin de línea


    - **Salida sirena 1** → terminales 17 (–) y 18 (+), con **resistencia de fin de
    línea de 47 kΩ** [F6][F7]

    - **Salida sirena 2** → terminales 19 (–) y 20 (+), con **resistencia de fin de
    línea de 47 kΩ** [F6][F7]


    ---


    ## 3. Comportamiento de los relés según condición


    **Relé de alarma:**

    - *Stand Alone*: Se activa si se cumple la condición de alarma en un canal. Condición
    predeterminada = Nivel 1. El estado de alarma está **enclavado por defecto**;
    se necesita un **rearme manual** para desactivar el LED y el relé [F3].

    - *Loop/Notifier*: Controlado por el panel si determina que se da la condición
    de alarma. **No enclavado** (encendido y apagado por el panel) [F4].


    **Relé de prealarma** *(solo Stand Alone)*:

    - Se activa si se cumple la condición de prealarma en un canal. Condición predeterminada
    = Nivel 1. Nota: cuando Prealarma = Alarma = Nivel 1, la prealarma se activará
    al **70 % del nivel 1** [F3].


    **Relé de avería:**

    - Se activa cuando se produce una condición de avería en el canal 1 o 2, o una
    avería común [F3][F4].

    - **También se activa en modo de servicio y cuando se desconecta la alimentación
    de la unidad** [F3][F4].

    - El estado de avería **no está enclavado** (predeterminado) [F3][F4].


    **Relé de sirena:**

    - Se activa cuando el canal está en **ALARMA** (y en la variante Stand Alone también
    en PREALARMA) [F3][F4].

    - La sirena 1 se corresponde con el canal 1 y la sirena 2 con el canal 2 [F3][F4].

    - Estado predeterminado: establecido en **ALARMA** [F3][F4].


    ---


    ## 4. Especificación eléctrica de los contactos de relé


    - **Potencia nominal de los contactos (carga resistiva CC):** máx. **2 A a 30
    V CC** [F1][F2]

    - **Potencia nominal de los contactos (carga resistiva CA):** máx. **0,5 A a 30
    V CA** [F1][F2]

    - **Vida útil:** mín. **10⁵ operaciones** [F1][F2]


    ---


    **Fuentes:**

    - I56-6574-005_ES -HS Stand Alone FAAST LT-200 QIG (sin revisión registrada)

    - I56-6575-005_ES FAAST LT-200 Loop QIG (sin revisión registrada)

    - I56-6577-006_ES FAAST Notifier LT-200 QIG (sin revisión registrada)


    También puedo ayudarte con: **conexionado de la entrada configurable de rearme**,
    **configuración de niveles de alarma/prealarma** o **especificaciones de alimentación**
    del FAAST LT-200.'
