  bot_answer: "# Notifier PEARL — Capacidad de lazo SLC, límites de aisladores y alta/edición\
    \ de equipos\n\n---\n\n## 1. Capacidad máxima por lazo\n\n- **Protocolo Opal:**\
    \ hasta **159 sensores + 159 módulos = 318 equipos** por lazo [F1][F2]\n- **Protocolo\
    \ CLIP:** hasta **99 sensores + 99 módulos** por lazo [F1][F5]\n- **Protocolo\
    \ mixto Opal + CLIP:** el límite de equipos CLIP en lazo mixto es de **40**; si\
    \ se supera, la autoconfiguración continúa pero señala fallos [F5]\n- **Límite\
    \ global del sistema (ambos lazos):** máximo **512 sensores y/o pulsadores manuales**\
    \ en total entre los dos lazos analógicos, incluyendo detectores de zona convencionales\
    \ conectados [F2]\n- **Carga máxima:** **0,75 A por lazo** [F1]\n\n---\n\n## 2.\
    \ Límites de aisladores (EN54-2: 12.5.2)\n\n- **Requisito EN54-2:** máximo **32\
    \ equipos entre aisladores** [F2]\n- **Equipos SIN aisladores internos** (incluidos\
    \ CLIP y algunos Opal): no colocar más de **20 equipos entre aisladores** [F2]\n\
    - **Equipos CON aisladores internos FET** (con base **B501 AP**): el lazo cumple\
    \ directamente los requisitos de EN54-2 [F2]\n- **Nota adicional del manual de\
    \ instalación:** no colocar más de **25 equipos entre aisladores** (20 si se usan\
    \ aisladores FET) [F10]\n- **Loop Splitter (placa 795-131):** un cortocircuito\
    \ en un sublazo no debe permitir la pérdida de más de **32 equipos direccionables**\
    \ [F8]\n\n> ⚠️ **Importante:** Si hay aisladores instalados, el conductor positivo\
    \ (+) del lazo será circuito abierto. **NUNCA utilices un multímetro de alta tensión\
    \ (tipo Megger) en el lazo de detección** [F2].\n\n**Sobre el cableado:**\n- La\
    \ capacitancia del cable debe ser inferior a **0,5 µF** [F12]\n- La resistencia\
    \ de cada aislador está entre **0,1 y 0,13 ohms** [F12]\n\n---\n\n## 3. Alta de\
    \ equipos: Autoconfiguración\n\nLa forma recomendada de dar de alta equipos es\
    \ mediante la **función de autoconfiguración** desde la central o, de forma más\
    \ óptima, con el **programa de configuración ITS** [F3].\n\n**Pasos:**\n\n1. Accede\
    \ al menú de configuración (nivel de acceso 2) [F3]\n2. Selecciona **1: Autoconfiguración**\
    \ [F3]\n3. Elige si aplica a **todos los lazos** o a un **lazo específico** [F3]\n\
    4. Selecciona el protocolo a detectar [F3][F5]:\n   - **1: Todos Prot. OPAL/CLIP**\
    \ → detecta ambos y comprueba direcciones duplicadas\n   - **2: OPAL/CLIP (No\
    \ detecta duplicidad)** → más rápido, sin comprobación de duplicados\n   - **3:\
    \ Sólo con protocolo CLIP** → solo autoconfigura equipos CLIP\n5. Selecciona el\
    \ modo de operación [F5]:\n   - **1: Permite Añadir/Borrar/Cambiar**\n   - **2:\
    \ Sólo Añadir Nuevos Equipos**\n6. El proceso se inicia automáticamente. Al finalizar,\
    \ se muestran los resultados por lazo (navega con las teclas **◄/►**) [F5]\n\n\
    > **Nota:** Si se autoconfigura un equipo Opal, por defecto será Opal. Si el número\
    \ de equipos CLIP supera los 40 en lazo mixto, selecciona manualmente la opción\
    \ **«Sólo con protocolo CLIP»** [F5].\n\nLos equipos configurados pueden consultarse\
    \ en cualquier momento desde **nivel de acceso 2 → «Resumen de Equipos»** [F3].\n\
    \n---\n\n## 4. Edición individual de equipos\n\nDesde el menú de configuración\
    \ se puede editar cada sensor o módulo individualmente [F4][F9].\n\n**Para sensores**,\
    \ los parámetros editables incluyen [F4]:\n- Tipo de equipo\n- Número de zona\
    \ (hasta 255 locales o 8192 de red)\n- Número de células (hasta 255)\n- Ajuste\
    \ del nivel de alarma, prealarma y alarma horaria\n- Retardo de alarma\n- Retardo\
    \ de confirmación de coincidencia de detector (hasta **240 s / 4 min**)\n- Prioridad\
    \ de interrogación (solo CLIP, limitada a **30 equipos**)\n- Grupo AWACS (50 grupos,\
    \ todos los sensores CLIP salvo HEAT)\n- Acción de parpadeo y color LED (solo\
    \ Opal)\n- Selección de programación horaria\n- Número de aplicación (solo equipos\
    \ SMART 4)\n- Operación solo modo térmico L6 (solo SMART y Optiplex)\n\n**Para\
    \ módulos**, los parámetros editables incluyen [F9]:\n- Tipo de equipo y zona\
    \ (hasta 255 locales o 8192 de red)\n- Número de células (hasta 255)\n- Prioridad\
    \ de interrogación (solo CLIP, limitada a **30 equipos**)\n- Función de subdirecciones\
    \ (entrada o salida)\n- Ajuste de acción de fallo (alarma o avería)\n- Supervisión\
    \ de cortocircuito o circuito abierto\n- Periodo de retardo de confirmación de\
    \ alarma\n- Ajuste de entrada enclavada\n- Asignación para alimentación de potenciador\
    \ de lazo (solo alarma)\n\n> ⚠️ **Nota importante:** Los pulsadores CLIP se autoconfiguran\
    \ como **«MON»** y deben cambiarse manualmente a tipo **«cPUL»** [F9]. Algunos\
    \ ajustes de retardo de alarma pueden contravenir los requisitos de **EN54-2**\
    \ [F9].\n\n---\n\n**Fuentes:**\n- Manual de instalación y puesta en marcha `997-669-005-3_Instal-Comm_ES`\
    \ (sin revisión registrada)\n- Manual de configuración de la central `997-671-005-3_Configuration_ES`\
    \ (rev. 997-671-005-3)\n\n---\n\nTambién puedo ayudarte con: **conexionado físico\
    \ del lazo SLC**, **configuración de zonas y reglas causa-efecto** o **uso del\
    \ programa ITS para transferir la configuración**.\n\n---\n⚠️ **Información adicional\
    \ del manual:**\n- \"La resistencia máxima del lazo no debe superar los límites\
    \ definidos en **«6.4.2 Comprobaciones del lazo antes de conectar el cableado»**,\
    \ paso 2.\" [F12]\n- \"Es de vital importancia que el cable utilizado sea de buena\
    \ calidad y que se instale de forma correcta.\" [F12]\n- \"- Números de referencia\
    \ de la zona de red\n- Tipo de equipo\n- Entorno del número de referencia de zona\
    \ (opcional)\n- Número de central (Central LOCAL; 1-64: otras centrales de red).\
    \ Esta columna no siempre se muestra, ya que depende del tipo de numeración de\
    \ zona seleccionada.\n- Número de zonas (hasta 255 zonas locales o 8192 zonas\
    \ de red)\n- Número de células (hasta 255)\n- Prioridad de interrogación (operación\
    \ solo protocolo CLIP: limitada a 30 equipos)\n- Acción de parpadeo en equipo\
    \ interrogado. Elección del color solo para equipos Opal\n- Asignar si es necesario\
    \ para alimentación de potenciador de lazo (solo para alarma)\n- Seleccionar función\
    \ de acción de subdirecciones de módulo de entrada o salida\n- Ajuste de acción\
    \ de fallo no AUX:* entrada de alarma o avería\n- Ajuste de supervisión de avería\
    \ de cortocircuito o circuito abierto\n- Periodo de retardo de confirmación de\
    \ alarma\n- Ajuste no silenciable para la función de LED remoto (solo equipos\
    \ Opal); respuesta a la orden SILENCIAR SIRENAS\n- Ajuste de entrada enclavada\n\
    - Ajuste de supresión de pestaña AUX*\n* El tipo de equipo de acción auxiliar\
    \ (AUX) se utiliza para equipos con entrada enclavada/no enclavada (predeterminada),\
    \ no de incendio con sistemas de alarma contra incendios Notifier.\" [F9]\n- \"\
    - Circuito en funcionamiento correcto: se ilumina continuamente\n- Circuito con\
    \ cortocircuito o fallo de cableado: no se ilumina.\" [F8]"
