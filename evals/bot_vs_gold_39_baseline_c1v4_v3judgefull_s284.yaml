  bot_answer: "# Central de Alarmas Fidegas CS4 — Características Técnicas y Diferencias\
    \ entre Versiones\n\n## Características técnicas generales\n\n- **Tensión de alimentación:**\
    \ 110-230 Vac, 50-60 Hz [F2]\n- **Potencia:** 30 W [F2]\n- **Clase:** Clase II\
    \ [F1][F8]\n- **Sensores:** hasta 4 conexiones en modo analógico o digital [F2]\n\
    - **Salidas:** 2 salidas conmutadas LP (relé apto para 230 Vac) con contactos\
    \ NA-C-NC [F2]\n- **Corriente máxima:** 250 mA [F2]\n- **Rearme:** seleccionable\
    \ manual o automático [F2]\n- **Dimensiones:** 90 x 106 x 58 mm [F2]\n- **Peso:**\
    \ 300 g [F2]\n- **Firmware:** versión 1.2 (tanto en versión digital como analógica)\
    \ [F1][F8]\n- **Montaje:** carril DIN o armario de superficie [F3]\n\n## Indicaciones\
    \ disponibles\n\n- **Led verde PWR:** alimentación presente (fijo) o corte de\
    \ red (intermitente) [F3]\n- **Led bicolor ON/ALARM** por sensor: presencia de\
    \ sensor remoto (verde) / alarma (rojo) [F3]\n- **Led amarillo ERROR** por sensor:\
    \ avería de sensor remoto [F3]\n- **Leds verdes OUT1 y OUT2:** salida activa (verde)\
    \ / desactivada (apagado) [F3]\n- **Avisador acústico:** apoyo sonoro a las indicaciones\
    \ ópticas [F3]\n\n## Entradas de señal según versión\n\n- **Versión analógica:**\
    \ entradas 4-20 mA [F3]\n- **Versión digital:** entradas 0-10/15 V [F3]\n\n##\
    \ Diferencias entre versión digital y analógica\n\nLa diferencia principal está\
    \ en el **tipo de señal de entrada y los sensores compatibles**:\n\n**Versión\
    \ analógica — Código de producto: 3270** [F2]\n- Sensores compatibles [F1]:\n\
    \  - Sensores **S/3** gases combustibles\n  - Sensores **S/3** y **S/2** gases\
    \ tóxicos\n  - Sensores **S/10** gases tóxicos\n\n**Versión digital — Código de\
    \ producto: 3244** [F2]\n- Sensores compatibles [F1]:\n  - Sensores **S/10** gases\
    \ combustibles\n\n> El resto de características técnicas (alimentación, potencia,\
    \ salidas, dimensiones, firmware) son **idénticas** en ambas versiones [F1][F2][F8].\n\
    \n## Conexionado de sensores\n\nLos conectores de cada sensor están numerados\
    \ [F5]:\n- **Terminal 1:** positivo de alimentación (12 a 24 Vdc)\n- **Terminal\
    \ 2:** entrada de señal\n- **Terminal 3:** negativo común de alimentación y señal\n\
    \nLa alimentación de red (115-230 Vac) y las salidas OUT1/OUT2 (NA-C-NC) se conectan\
    \ en la parte inferior de la central [F5].\n\n---\n\nFuente: Manual de Usuario\
    \ CS4 (Analógica o Digital), Rev. 2, 10/2018 — C.A.E., S.L. / Fidegas\n\n---\n\
    \nTambién puedo ayudarte con: **procedimiento de configuración de la CS4**, **funcionamiento\
    \ en alarma y rearme** o **conexionado detallado del sensor S/3 o S/10**.\n\n\
    ---\n\U0001F4CB **Obligaciones de evidencia del manual:**\n- Nota: la fuente es\
    \ inconsistente: \"Permite la conexión de hasta 4 sensores remotos simultaneos\
    \ a través de sus 4 entradas digitales (0-10/15 v) o analógicas (4-20 mA).\" (Manual-de-Usuario-CS4,\
    \ p. 4) [F3] declara 4 sensores y la enumeración servida lista 6 (Manual-de-Usuario-CS4,\
    \ p. 4) [F3].\n- \"Ningún sistema de detección de gas sustituye a una correcta\
    \ instalación y mantenimiento de los aparatos quemadores de gas y debe ser colocado\
    \ por una persona competente o un instalador autorizado.\" (Manual-de-Usuario-CS4,\
    \ p. 2) [F8]"
