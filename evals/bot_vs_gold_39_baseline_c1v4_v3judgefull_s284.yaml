  bot_answer: "## Conexión del módulo de aislamiento de línea en lazo ID2000\n\n###\
    \ Requisitos de instalación (norma EN54-2)\n\nAntes de conectar, ten en cuenta\
    \ los límites obligatorios [F5]:\n\n- **Máximo 32 equipos de lazo entre aisladores**\
    \ (requisito EN54-2: 12.5.2) [F5]\n- **En la ID2000: máximo 25 equipos entre aisladores**\
    \ (o **20 si son aisladores tipo FET**) [F5]\n- Si no se cumple esto, se contraviene\
    \ la norma EN54-2 en caso de avería de transmisión [F5]\n\n---\n\n### Terminales\
    \ del aislador\n\nEl aislador dispone de **4 terminales**: **1, 2, 3 y 4** [F3].\n\
    \nPara las comprobaciones previas a la conexión, los terminales **2 y 4** son\
    \ los que se cortocircuitan temporalmente para desconectar el aislador durante\
    \ las pruebas del lazo [F3].\n\n---\n\n### Procedimiento de conexión\n\n**Fase\
    \ 1 — Comprobaciones del lazo ANTES de conectar (con aisladores desconectados)**\n\
    \n1. **Cortocircuita temporalmente los terminales 2 y 4 de cada aislador** para\
    \ desconectarlos del lazo [F3].\n   > ⚠️ El cableado del lazo DEBE estar desconectado\
    \ del panel durante este procedimiento [F3].\n\n2. Comprueba la continuidad de\
    \ cada extremo del lazo y mide la resistencia final de línea [F3]:\n   - En placa\
    \ base y LIB:\n     - **14,5 Ω** para detección de dirección duplicada [F3]\n\
    \     - **28,5 Ω** si no se requiere detección de dirección duplicada [F3]\n \
    \  - En placa base y LIB (segunda variante):\n     - **18,5 Ω** para detección\
    \ de dirección duplicada [F3]\n     - **35,5 Ω** si no se requiere detección de\
    \ dirección duplicada [F3]\n   - La resistencia máxima total del lazo no debe\
    \ superar **35 Ω** [F11]\n   - La capacidad del cable debe ser inferior a **0,5\
    \ µF** [F11]\n\n3. Con multímetro en modo diodo en **polaridad invertida** (+\
    \ al lazo − y − al lazo +): debe indicar diodos polarizados en paralelo [F3].\n\
    \n4. Con multímetro en **polaridad normal**: debe indicar resistencia baja que\
    \ aumenta progresivamente al cargarse los condensadores de los equipos. Si indica\
    \ un único diodo polarizado, hay un equipo con polaridad invertida [F3].\n\n5.\
    \ Comprueba que **no hay continuidad entre el cable de pantalla y el positivo\
    \ (+) ni el negativo (−)** del cable [F3].\n   > **Nota:** La pantalla solo debe\
    \ conectarse a tierra en el panel [F3].\n\n---\n\n**Fase 2 — Conexión del cableado\
    \ del lazo al panel**\n\n1. **Retira las conexiones temporales** (cortocircuitos)\
    \ de los terminales 2 y 4 de cada aislador [F1].\n2. Conecta el cableado del lazo\
    \ al panel. **Verifica la polaridad**: los extremos marcados como **A y B** deben\
    \ conectarse en los terminales correspondientes [F1].\n\n---\n\n**Fase 3 — Comprobaciones\
