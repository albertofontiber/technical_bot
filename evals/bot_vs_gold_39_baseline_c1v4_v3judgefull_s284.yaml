  bot_answer: '## Programación del retardo de salida de alarma principal en la PEARL


    La programación del retardo de salida de alarma en la Pearl se realiza a través
    de la **matriz de causa-efecto**. Los fragmentos disponibles describen los tipos
    de retardo y su gestión operativa, pero el procedimiento paso a paso de creación
    de una regla con retardo específico no está completamente detallado en los fragmentos
    recuperados.


    Lo que sí está documentado es lo siguiente:


    ---


    ### 1. Dónde se configura


    El retardo de salida se asigna dentro de las **reglas de causa-efecto** [F1].
    Para acceder al editor:


    No puedo confirmar de forma segura el número de menú de Causa y Efecto con los
    fragmentos servidos. Confirma el manual y la revisión exactos antes de usar un
    número de menú.


    ---


    ### 2. Tipos de retardo disponibles


    Se puede asignar **uno de seis tipos de retardo de salida** a cada regla [F1].
    Los tipos disponibles son [F2]:


    - **Fijo**

    - **Estándar**

    - **No Silenc.**

    - **Est. Ext.**

    - **RetExtStd**

    - **No Sil. Ext**

    - **SinRetExt**


    Comportamiento de cada tipo según acciones de usuario [F2]:


    - **La salida se detiene al pulsar SILENCIAR SIRENAS durante el retardo:** Solo
    en tipos Estándar, Est. Ext. y RetExtStd.

    - **El retardo puede anularse (nivel acceso 2, opción «Anular retardos»):** En
    todos excepto Fijo.

    - **El tiempo restante se muestra en pestaña ALARMA:** En todos excepto Fijo.

    - **El retardo puede detenerse con FIN RETARDO (nivel acceso 2):** En todos excepto
    Fijo.

    - **La salida se detiene al pulsar AMPLIAR RETARDO:** Solo en Est. Ext. y No Sil.
    Ext.

    - **El temporizador comienza en RETARDO AMPLIADO:** Solo en RetExtStd y SinRetExt.


    ---


    ### 3. Retardo de alarma por equipo (nivel de sensor/módulo)


    Adicionalmente, existe un parámetro **«Retardo de alarma»** configurable individualmente
    para cada sensor o módulo desde la sección **«4.2 Editar equipos»** [F6][F7].
    Esto permite añadir un retardo a nivel de equipo, independiente del retardo de
    la regla de causa-efecto.


    ---


    ### 4. Gestión operativa del retardo activo


    Una vez activo un retardo [F4]:


    1. El LED **RETARDO ACTIVO** se enciende [F3].

    2. El usuario con llave (nivel acceso 2) puede pulsar **AMPLIAR RETARDO** para
    iniciar un segundo temporizador (normalmente más largo que el primero) [F4].

    3. Pulsar **FIN RETARDO** (disponible en nivel acceso 1) termina cualquier retardo
    activo y activa la condición de alarma completa [F4].


    ---


    ### 5. Anular/habilitar retardos desde el panel


    Desde el menú **Anular/Habilitar**, opción **«5: Retardo Activación Salidas»**
    [F3]:


    1. Pulsa ✓ para cambiar el estado entre ANULADO y HABILITADO.

    2. Pulsa ✕ para salir.


    > ⚠️ **Nota:** Esta opción solo está disponible si se han configurado retardos
    en alguna regla de causa-efecto [F3].


    ---


    ### Lo que no está en los fragmentos recuperados


    El procedimiento detallado de creación de una regla de causa-efecto nueva con
    valor numérico de retardo (duración en segundos/minutos) no aparece en los fragmentos
    disponibles. Para ello, consulta el **Apéndice 5 completo del Manual de configuración**
    (997-671-005-3) o usa el software de configuración por ordenador [F12].


    ---


    Fuentes:

    - Manual de configuración de la central Pearl (rev. 997-671-005-3)

    - Manual de funcionamiento Pearl 997-670-005-3 (sin revisión registrada)

    - Manual de instalación y puesta en marcha Pearl 997-669-005-3 (sin revisión registrada)


    ---


    También puedo ayudarte con: **tipos de retardo Est. Ext. vs Estándar en detalle**,
    **configuración del pulsador AMPLIAR RETARDO** o **programación de reglas de causa-efecto
    desde el menú de la central**.


    ---

    ⚠️ **Información adicional del manual:**

    - "**Es de vital importancia probar rigurosamente todas las reglas durante la
    puesta en marcha del sistema para verificar que no haya conflictos lógicos entre
    ellas.**" [F12]

    - "**Al programar reglas de causa-efecto evite las lógicas contradictorias.**"
    [F12]

    - "- Números de referencia de la zona de red

    - Tipo de equipo

    - Entorno del número de referencia de zona (opcional)

    - Número de central (Central LOCAL; 1-125: otras centrales de red). Esta columna
    no siempre se muestra, ya que depende del tipo de numeración de zona seleccionada.

    - Número de zonas (hasta 255 zonas locales o 8192 zonas de red)

    - Número de células (hasta 255)

    - Prioridad de interrogación (operación solo protocolo CLIP: limitada a 30 equipos)

    - Acción de parpadeo en equipo interrogado. Elección del color solo para equipos
    Opal.

    - Opción de tipo de equipo (VIEW, Optiplex y SMART)

    - Ajuste del nivel de alarma

    - Ajuste del nivel de alarma horaria

    - Ajuste del nivel de prealarma

    - Selección de programación horaria (cambio de sensibilidad de sensor)

    - Grupo AWACS (50 grupos con todos los sensores CLIP salvo HEAT)

    - Retardo de alarma

    - Ajuste no silenciable para la función de LED remoto (solo equipos Opal); respuesta
    a la orden SILENCIAR SIRENAS.

    - Operación solo modo térmico (L6) (solo SMART y Optiplex)

    - Número de aplicación (solo equipos SMART 4)

    - Ajuste de la función LED remota (solo equipos Opal): las opciones son: Seguir
    el equipo (predeterminada) o Controlada por las reglas de causa-efecto.

    - Retardo de confirmación de coincidencia de detector; puede ajustarse hasta 240
    s (4 min). Puede usarse con dependencia tipo B." [F6]


    ---

    📋 **Obligaciones de evidencia del manual:**

    - Nota: la fuente es inconsistente: "Se puede asignar uno de seis tipos de retardo
    de salida a una regla, como se explica a continuación." (997-671-005-3_Configuration_ES,
    p. 44) [F1] declara 6 tipos y la enumeración servida lista 8 (997-671-005-3_Configuration_ES,
    p. 44) [F1].

    - Nota: la fuente es inconsistente: "Sección 4 - 4" (997-671-005-3_Configuration_ES,
    p. 21) [F7] declara 4 Equipos y la enumeración servida lista 20 (997-671-005-3_Configuration_ES,
    p. 20) [F6].'
