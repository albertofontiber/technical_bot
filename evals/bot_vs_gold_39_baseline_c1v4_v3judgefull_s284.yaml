  bot_answer: '## Test anual del detector VESDA-E VEP


    Según la **Tabla 7-1: Calendario de mantenimiento sugerido** del manual, las tareas
    que corresponden realizarse **una vez al año** son las siguientes [F1]:


    1. **Realizar una prueba de humos** para comprobar la integridad de la red de
    tubería

    2. **Comprobar el flujo** de la red de tubería

    3. **Limpiar los puntos de muestreo**

    4. **Limpiar con agua la red de tubería**


    ---


    ### Procedimiento de la prueba de humos anual


    El manual describe que la prueba de humos consiste en [F3]:


    - Introducir una muestra de humo en el **orificio de muestreo más alejado**

    - Medir el **tiempo de transporte** hasta que el humo llega al detector

    - Registrar los resultados y compararlos con pruebas anteriores para detectar
    variaciones del sistema


    > ⚠️ Para el procedimiento detallado paso a paso de la prueba de humos, el manual
    remite expresamente a la **VESDA-E Commissioning Guide (Guía de puesta en marcha
    de VESDA-E)** [F3]. Consulta ese documento para el protocolo completo.


    ---


    ### Precauciones obligatorias antes del mantenimiento


    Antes de realizar cualquier prueba [F1]:


    - **Informa a la autoridad supervisora adecuada**

    - **Aísla todos los dispositivos** que dependan del detector antes de comenzar

    - Sigue los **procedimientos del sitio** para evitar falsas alarmas en los servicios
    supervisados

    - Ten en cuenta que **mientras el detector esté deshabilitado o en espera, no
    emitirá advertencias de fuego**


    ---


    ### Notas adicionales


    - El mantenimiento puede realizarlo el instalador original, un distribuidor autorizado
    o el contratista de servicio [F1]

    - La frecuencia puede variar según los **códigos y normas locales** y el entorno
    de la instalación [F1]


