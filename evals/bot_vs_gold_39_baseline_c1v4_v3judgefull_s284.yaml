    de cada circuito de sirenas A y B [F1]


    ---


    ### 2. Lazo de Comunicaciones RS-485 (periféricos / red de centrales)


    - **RFL: 150 Ω, 0,5 W mínimo** [F2]

    - Se coloca en los **extremos libres** del principio y final de la cadena (lazo
    abierto) [F2]

    - En lazo cerrado (bucle), no se colocan RFL en los extremos ya que el lazo queda
    cerrado sobre sí mismo [F2]

    - Longitud máxima del lazo RS-485: **1,2 km** [F2]


    > ⚠️ **Importante:** Si el equipo extremo dispone de puente **TERM ON**, este
    puente ya incorpora internamente una resistencia de 150 Ω. En ese caso, **no instales
    además la RFL externa de 150 Ω** para evitar duplicar la terminación [F4].


    ---


    ### Resumen rápido


    - **Sirenas:** RFL = **6.800 Ω**

    - **RS-485:** RFL = **150 Ω, 0,5 W mínimo**


    ---


    Fuente: Manual de Instalación ZX2e/ZX5e — MIE-MI-530rv001 (rev. 001); Manual ZXr-A/ZXr-P
    — MIE-MI-431 (rev. 2)


