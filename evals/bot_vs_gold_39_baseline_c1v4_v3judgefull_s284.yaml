  bot_answer: '## ASD532 — Clases EN 54-20 y monitorización del flujo de aire


    ---


    ### 1. Clases de sensibilidad según EN 54-20


    El ASD 532 cumple los requisitos de la norma **EN 54-20** en sus tres clases [F10]:


    - **Clase A** — Sensibilidad muy alta

    - **Clase B** — Sensibilidad alta

    - **Clase C** — Sensibilidad normal


    La placa de características del equipo lo refleja expresamente como **EN 54-20
    A/B/C** [F7].


    La clase se selecciona mediante el sensor de humo instalado y la posición de conmutador
    elegida. Los tres sensores disponibles son [F1]:


    - **SSD 532-1** — Rango de sensibilidad de alarma: **0,5 %/m a 10 %/m**

    - **SSD 532-2** — Rango de sensibilidad de alarma: **0,1 %/m a 10 %/m**

    - **SSD 532-3** — Rango de sensibilidad de alarma: **0,02 %/m a 10 %/m**


    ---


    ### 2. Configuración de la sensibilidad


    Hay dos vías de configuración [F1]:


    1. **Sin software de cálculo (EasyConfig):** mediante las posiciones de conmutador
    predeterminadas del AMB 32, capítulos 4.4.4 a 4.4.4.3 del manual.

    2. **Con software de cálculo:** usando **«ASD PipeFlow»** para el cálculo del
    proyecto y **«ASD Config»** para introducir los resultados, seleccionando después
    las posiciones **X01, X02 o X03** en el ASD [F6] [F8].


    ---


    ### 3. Monitorización del flujo de aire


    #### Principio de funcionamiento


    - Basada en **método calorimétrico** (medición de flujo en masa) [F2].

    - El sensor de flujo de aire detecta cambios en el conducto de aspiración: roturas
    de tubo u obstrucciones [F2].

    - En el **reset inicial** (con conducto intacto), los valores medidos se registran
    como **valores nominales al 100 %** y se colocan en el centro de una ventana de
    monitorización electrónica [F2].

    - Si los valores reales se salen de la ventana (±xx %), el ASD 532 dispara el
    aviso **«Fallo flujo de aire»** [F2].

    - Dispone de **función de tiempo de retardo** ajustable para descartar turbulencias,
    y de **circuito de compensación de temperatura** [F2].


    > ⚠️ **Importante:** El reset inicial debe realizarse con el conducto de aspiración
    limpio y en perfecto estado. Los valores se memorizan en ese momento como referencia
    [F2].


    ---


    ### 4. Parámetros normativos según EN 54-20 (posiciones A11 a C31)


    Según **EN 54-20**, debe notificarse como fallo toda variación del flujo de aire
    superior al **±20 %** [F2]:


    - Por debajo del **80 %** → suciedad/obstrucción → aviso «Fallo flujo de aire»

    - Por encima del **120 %** → rotura de tubo → aviso «Fallo flujo de aire»

    - Tiempo de retardo normativo: **300 s** [F2]


    Estas condiciones aplican a las posiciones de conmutador **A11 a C31** [F2] [F4]:


    - **A11** → Clase A (sensibilidad muy alta) [F4]

    - **b11 / b21** → Clase B (sensibilidad alta) [F4]

    - **C11 / C21 / C31** → Clase C (sensibilidad normal) [F4]


    ---


    ### 5. Posiciones no normativas (W01 a W44)


    Las posiciones **W01 a W44** cumplen la sensibilidad de alarma según EN 54-20
    (clases A a C), **pero los valores de monitorización del flujo de aire NO están
    homologados según EN 54-20** [F5] [F2].


    Permiten configurar combinaciones de tiempo de retardo y desviación distintas
    a las normativas [F3]:


    - Tiempo de retardo: **10 min** o **60 min**

    - Desviación de ventana: **±20 %** o **±50 %**


    > ⚠️ **Advertencia:** Las posiciones W01 a W44 **únicamente deben utilizarse previa
    consulta con el fabricante** [F5] [F6] [F8].


    ---


    ### 6. Advertencias adicionales sobre ajuste de la ventana de monitorización


    Si se realizan adaptaciones con **«ASD Config»** [F6]:


    - Aumentar los valores de la LS-Ü por encima de **±20 % o 300 s** implica **incumplimiento
    de EN 54-20** y requiere consulta con el fabricante.

    - El tamaño de la ventana **no debería quedar por debajo de ±20 %** salvo que
    simultáneamente se aumente el tiempo de retardo a un mínimo de **10 min**.

    - Ventanas inferiores a ±20 % con tiempo de retardo ≤ 300 s aumentan el riesgo
    de **avisos de fallo erróneos** [F6].


    ---


    **Fuente:** ASD532_TD_T140421es_a — ASD 532, Descripción técnica, T 140 421 a
    es (sin revisión registrada)


    ---


    También puedo ayudarte con: **procedimiento de reset inicial (posición U01)**,
    **selección del sensor SSD según clase EN 54-20** o **configuración con ASD Config
    y ASD PipeFlow**.


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "Con carácter general, para la instalación, el proyecto y el uso del detector
    de humos por aspiración ASD 532 serán aplicables las disposiciones y directrices
    específicas de cada país." (ASD532_TD_T140421es_a, p. 37) [F10]'
