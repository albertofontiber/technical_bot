- qid: hp005
  question: En la Notifier ID3000, ¿cómo se programa una zona para que active una
    salida de sirena solo cuando haya coincidencia de dos detectores?
  gold_estado: verificado
  conducta_esperada: answer
  conducta_bot: answer
  veredicto: PARCIAL
  diagnostico: 'La respuesta acierta el mecanismo principal: Matriz de Control, entrada
    ALARMA limitada a zona/tipo, coincidencia 2 equipos, excluir pulsadores y requisito
    de misma zona/subzona. Sin embargo, la parte de SALIDA queda demasiado genérica
    frente al procedimiento esperado y añade un segundo enfoque de coincidencia a
    nivel de sensor que puede distraer aunque lo distingue correctamente.'
  bot_sources:
  - MADT190_14
  - MCDT190
  - MCDT191
  - MPDT190
  coverage_status: appended
  coverage_appended_rows: 3
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: "# ID3000 — Programación de coincidencia de dos detectores para activar\
    \ sirena\n\nHay **dos enfoques** según lo que necesites: coincidencia en la **Matriz\
    \ de Control** (actúa después de que el sistema entre en alarma) o coincidencia\
    \ a nivel de **sensor** (actúa antes de que el sistema entre en alarma, mediante\
    \ prealarma). Los fragmentos cubren ambos.\n\n---\n\n## ENFOQUE 1 — Coincidencia\
    \ en la Matriz de Control\n\nEste es el método clásico: la salida de sirena solo\
    \ se activa si dos detectores de la zona están en alarma.\n\n### Paso 1 — Acceder\
    \ a la Matriz de Control\n\nAccede desde el menú **Parámetros Sistema → Matriz\
    \ de Control** [F12], o durante la edición de sensores/módulos pulsando la tecla\
    \ de función **\\<F6\\>** [F11].\n\n---\n\n### Paso 2 — Crear dos instrucciones\
    \ separadas (OBLIGATORIO si hay pulsadores manuales en la zona)\n\n⚠️ **EN54-2:\
    \ 7.1.4 — No incluyas pulsadores manuales (MCP) en un grupo de coincidencia**\
    \ [F1][F4].\n\nPara evitarlo, debes programar **dos instrucciones de Matriz de\
    \ Control** [F1][F4]:\n\n- **Instrucción 1:** Entrada de tipo **Pulsador Manual\
    \ (MCP)** → coincidencia en modo **Simple** (sin coincidencia, un único equipo\
    \ activa la salida).\n- **Instrucción 2:** Entrada del tipo analógico al que se\
    \ aplica la coincidencia (p. ej. **ANALÓGICO**, que incluye detectores TÉRMICOS,\
    \ IÓNICOS, ÓPTICOS, VIEW y MULTISENSOR) → con coincidencia activada [F1].\n\n\
    ---\n\n### Paso 3 — Configurar la entrada de la instrucción 2 (detectores)\n\n\
    En la ventana de edición de entrada [F3]:\n\n1. **Selecciona el tipo de evento:**\
    \ Alarma [F3].\n2. **Selecciona el ámbito:** Zona específica (la zona donde están\
    \ los detectores) [F3].\n   - Introduce el número de zona. El rango máximo entre\
    \ zonas es de **32** [F3].\n3. **Selecciona el tipo de equipo:** El tipo analógico\
    \ correspondiente (TÉRMICO, IÓNICO, ÓPTICO, etc.) [F1][F4].\n\n> ⚠️ **No se permite\
    \ usar las funciones de coincidencia de zonas y limitación por tipo en la misma\
    \ entrada de Matriz de Control** [F4].\n\n---\n\n### Paso 4 — Configurar la coincidencia\
    \ de equipos\n\nEn el menú de coincidencia de equipos, selecciona [F4]:\n\n- **2:\
    \ COINCIDENCIA 2 EQUIPOS**\n\nEsto exige que dos detectores de la zona estén en\
    \ alarma antes de activar la salida.\n\n> **Nota:** Para que tenga lugar la coincidencia\
    \ de equipos, los equipos en alarma deben estar en la **misma zona o subzona**\
    \ [F4].\n\n> **Nota:** Las opciones de coincidencia de equipos solo aparecen si\
    \ se ha seleccionado **Opción 1 (Única zona)** en el paso anterior, y el tipo\
    \ seleccionado no es la opción 9, 10 u 11 (que ya incluyen coincidencia propia)\
    \ [F4].\n\n---\n\n### Paso 5 — Configurar la salida\n\nDefine la salida como la\
    \ **sirena** correspondiente [F11][F12].\n\n---\n\n### Paso 6 (opcional) — Verificar\
    \ ajustes de coincidencia en la configuración de la central\n\nSi necesitas niveles\
    \ de coincidencia adicionales (más de 2 equipos, rangos de subzonas, etc.), accede\
    \ a [F6][F7]:\n\n**Parámetros Sistema → Opciones de la Central → Pestaña Coincidencia\
    \ de Alarma** (Sección 2.12 del manual PK-ID3000)\n\nDesde ahí puedes configurar:\n\
    - Niveles de coincidencia de zonas (Nivel 3, 4, 5) [F6]\n- Niveles de coincidencia\
    \ de equipos (Nivel 3, 4) [F6]\n- Funcionamiento de coincidencia para **Cualquier\
    \ Zona**: misma central/red o siempre la misma zona [F6]\n- Funcionamiento en\
    \ subzonas: misma subzona o rango de subzonas [F6][F7]\n\n---\n\n## ENFOQUE 2\
    \ — Coincidencia a nivel de sensor (Anexo v4.63)\n\nEste método es diferente:\
    \ el sistema **no entra en alarma** hasta que se cumple la coincidencia. Mientras\
    \ tanto, el primer detector queda en estado de **PRIMERA ALARMA** (transmitida\
    \ como PREALARMA) [F5].\n\nLos niveles disponibles son [F5]:\n\n- **Nivel 2:**\
    \ Dos o más sensores en la misma zona.\n- **Nivel 3:** Dos o más sensores en diferentes\
    \ zonas pero en la misma central.\n- **Nivel 4:** Dos o más sensores en la misma\
    \ zona o zonas diferentes, en la misma central.\n- **Nivel 5/6:** Solo en sistemas\
    \ de red.\n\n> **Importante:** Esta función actúa de forma **totalmente independiente**\
    \ a la coincidencia de las matrices de control [F5]. Con las matrices, los criterios\
    \ se comprueban **después** de que el sistema haya entrado en alarma. Con esta\
    \ opción, el sistema aún **no ha entrado en alarma** [F5].\n\n> **Limitación:**\
    \ Los niveles de coincidencia de más de dos equipos, o combinaciones de diferentes\
    \ tipos de equipo, **no están disponibles** en esta versión de software [F5].\n\
    \n---\n\n## Resumen de diferencias entre enfoques\n\n- **Matriz de Control con\
    \ coincidencia:** El sistema entra en alarma con el primer detector; la **salida\
    \ de sirena** espera al segundo [F1][F4].\n- **Coincidencia a nivel de sensor:**\
    \ El sistema **no entra en alarma** hasta el segundo detector; el primero queda\
    \ en PREALARMA [F5].\n\n---\n\n**Fuentes:**\n- MCDT190 — ID3000 Manual de programación\
    \ (sin revisión registrada)\n- MCDT191\\_F v. 2.17e — ID3000 Manual del programa\
    \ de configuración PK-ID3000\n- MPDT190\\_D — ID3000 Manual de programación (panel)\n\
    - MADT190\\_14 — Anexo ID3000, versión de software 4.63\n\n---\n\nTambién puedo\
    \ ayudarte con: **configuración de subzonas para coincidencia**, **programación\
    \ de la salida de sirena en la Matriz de Control** o **comportamiento del estado\
    \ de PRIMERA ALARMA y PREALARMA** en la ID3000."
