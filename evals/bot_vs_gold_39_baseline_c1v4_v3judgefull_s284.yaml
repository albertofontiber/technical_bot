  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: "# Conexionado de sirenas convencionales en la Morley ZXe\n\n## Terminales\
    \ de conexión\n\nLa ZXe dispone de **2 circuitos de sirenas supervisados** (Sirena\
    \ A y Sirena B) [F2]. Los terminales en la placa base del **ZX2e** están etiquetados\
    \ como:\n\n- **A+, A-, B+, B-** en el bloque \"SOUNDERS\" [F2]\n\nEn el **ZX5e**,\
    \ los terminales están en el bloque **TB7**:\n\n- **A-, A+, B-, B+, C-, C+, D-,\
    \ D+** [F2]\n\n> ⚠️ El cableado de los circuitos de sirena debe terminarse en\
    \ la **placa de filtro** instalada en la parte izquierda y superior del interior\
    \ de la cabina [F3].\n\n---\n\n## Requisitos previos antes de conectar\n\n- **Cada\
    \ sirena debe tener un diodo integrado** para impedir el consumo en polarización\
    \ inversa durante la supervisión [F2]. El circuito se polariza en inverso en reposo\
    \ y cambia a polarización normal al dispararse [F2].\n- Si conectas **dispositivos\
    \ no polarizados** (campanas sin polaridad), deberás instalar **diodos de polarización\
    \ y protección** en cada uno [F2].\n- **No realices ramales** en la línea de sirenas:\
    \ la supervisión se realiza en la línea directa hasta la RFL, y los ramales paralelos\
    \ no podrán ser supervisados [F5].\n\n---\n\n## Procedimiento de conexión\n\n\
    1. **Conecta las sirenas en serie** entre los terminales A+ y A- (y B+ / B- para\
    \ el segundo circuito), respetando la polaridad (+/-) de cada sirena [F1].\n\n\
    2. **Instala la Resistencia Final de Línea (RFL)** de **6.800 Ω, 0,5 W mínimo**\
    \ entre el + y el - de la **última sirena** del circuito [F4]. Esta resistencia\
    \ es obligatoria para la supervisión de apertura y cortocircuito.\n\n   - Si no\
    \ se instala ninguna sirena en la salida, conecta la RFL directamente en los terminales\
    \ de la central [F4].\n\n3. **No enrolles el cable en los terminales**: corta\
    \ y empalma las conexiones adecuadamente para mantener la supervisión de la línea\
    \ [F1].\n\n4. **Usa cable apantallado** para todos los circuitos de sirena. Conecta\
    \ la malla a tierra en un solo extremo del cable [F11].\n\n---\n\n## Límites eléctricos\
    \ a respetar\n\n- **Corriente máxima por circuito: 1 A** [F4]\n- **Longitud máxima\
    \ de cable recomendada: 1 km** — longitudes superiores pueden afectar al funcionamiento\
    \ por capacitancia e inductancia del lazo [F1]\n- **Sección mínima de cable: 1,5\
    \ mm²** — secciones inferiores pueden provocar caídas de tensión excesivas [F4]\n\
    - Verifica que la tensión en las sirenas cumple las especificaciones del fabricante\
    \ tanto en alimentación principal como con **mínima tensión de baterías** (consulta\
    \ las Tablas 10 y 11 del manual) [F1]\n\n---\n\n## Verificación tras el conexionado\n\
    \nAntes de conectar, comprueba el circuito con un **multímetro en polaridad invertida**\
    \ (+vo a -vo):\n- Lectura esperada: **6.800 Ω** (la RFL) [F8]\n- En polaridad\
    \ normal (+vo a +vo): valor superior, por efecto de los diodos en serie [F8]\n\
    \nSi hay algún equipo invertido, el panel indicará: **'Cortocircuito en sirena\
    \ n'** [F8]\n\n---\n\n**Fuente:** Manual de Instalación ZX2e/ZX5e — MIE-MI-530rv001\
    \ (sin revisión registrada); Manual de Instalación ZXAE/ZXEE — MIE-MI-310 (sin\
    \ revisión registrada); Manual de Instalación ZX50 — MIE-MI-300rv02 (rev. 2)\n\
    \n---\n\U0001F4CB **Obligaciones de evidencia del manual:**\n- Nota: la fuente\
    \ es inconsistente: \"* El panel de detección y control de incendio ZX5Se tiene\
    \ 4 circuitos de sirenas supervisados y limitados en corriente, identificados\
    \ como circuitos de sirena A, B, C y D.\" (MIE-MI-600, p. 24) [F6] declara 4 circuitos\
    \ y la enumeración servida lista 2 (MIE-MI-600, p. 24) [F6].\n- Nota: la fuente\
    \ es inconsistente: \"El máximo permitido entre los 4 circuitos de sirena de ZX5Se\
    \ es de 2A.\" (MIE-MI-600, p. 24) [F6] declara 4 circuitos y la enumeración servida\
    \ lista 2 (MIE-MI-600, p. 24) [F6]."
