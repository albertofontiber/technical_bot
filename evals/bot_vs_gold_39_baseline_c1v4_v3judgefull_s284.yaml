    - Homologado FM/CSA y ATEX/IECEx [F2].


    **S40/40U / UB — UV (Ultravioleta)** [F6]

    - Versión U: sin BIT (prueba incorporada) [F8].

    - Versión UB: con BIT (prueba incorporada) [F8].

    - Homologado FM/CSA y ATEX/IECEx [F6].


    **S40/40R — Single IR (Infrarrojo simple)** [F4]

    - Un único canal infrarrojo.

    - Homologado FM/CSA y ATEX/IECEx [F4].


    **S40/40M — Multi IR (Múltiple infrarrojo)** [F5]

    - Específico para **llamas de hidrógeno e hidrocarburo** [F5].

    - Homologado FM/CSA y ATEX/IECEx [F5].


    ---


    Además, la referencia de documentos del software WinHost menciona también los
    modelos **40/40UFI** (Ultra Fast IR3) y **40/40UFL** (Ultra Fast UV/IR) [F7],
    aunque no tengo sus manuales completos en mi base.


