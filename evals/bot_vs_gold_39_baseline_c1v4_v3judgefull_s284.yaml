  bot_answer: '## Conexión de baterías en la CAD-150-8


    ### Especificaciones de las baterías


    Las centrales analógicas CAD-150-8 requieren **dos baterías de 12V 7A/h** [F5].
    Las baterías deben conectarse **en serie** para el correcto funcionamiento [F5].


    ---


    ### Procedimiento de conexión


    1. **Coloca las baterías** en la parte inferior de la caja, en el espacio reservado
    para ello, de forma **vertical** [F5].


    2. **Conecta el cable puente** (suministrado con la central) uniendo el **polo
    positivo de una batería con el polo negativo de la otra**, conectándolas así en
    serie [F5].


    3. **Conecta los cables del circuito** (rojo y negro) al **positivo y negativo
    libres** de las baterías [F1].


    4. El conector de baterías en la PCB Base es el punto **11 (Conector Batería)**,
    protegido por el **fusible 10 (Fusible Baterías)** [F2].


    ---


    ### ⚠️ Orden de conexión obligatorio


    El orden de conexión es **crítico** para evitar daños al equipo [F7]:


    1. **Primero:** conectar la alimentación de red (**230 VAC**) activando el magnetotérmico
    bipolar.

    2. **Segundo:** conectar las baterías.


    > **Nunca conectes las baterías antes que la red.** Si no se respeta este orden,
    el equipo podría sufrir daños [F7].


    ---


    ### Verificación previa a la puesta en marcha


    Antes de energizar, comprueba con un voltímetro que las **baterías tienen una
    tensión superior a 24V** [F10].


    ---


    **Fuente:** 55315013 Manual Centrales Analógicas CAD-150-8 Instalación ES FR GB
    IT (sin revisión registrada)


    También puedo ayudarte con: **conexión del bucle analógico**, **puesta en marcha
    del sistema** o **verificación de fusibles de la PCB Base** de la CAD-150-8.


    ---

    ⚠️ **Información adicional del manual:**

    - "<ins>En cada una de las conexiones del bucle es imprescindible dar continuidad
    a la pantalla.</ins> Algunos de los módulos precisan de alimentación auxiliar,
    que deberá ser suministrada con la salida auxiliar de la placa base, (no se recomienda
    de alimentar más de 10), o con un fuente auxiliar, situada lo más próxima posible
    al módulo." [F1]

    - "Es imprescindible que se usen los orificios marcados en la caja para conexionar
    los cables tanto de alimentación como de zonas al regletero." [F5]

    - Nota: el manual también indica: "Las centrales analógicas requieren dos baterías
    de 12V 7A/h." [F5] · "| 1 | Conectores Bucle 1               | 7  | Fusibles salidas
