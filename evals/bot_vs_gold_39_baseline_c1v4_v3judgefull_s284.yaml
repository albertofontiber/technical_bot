  coverage_status: appended
  coverage_appended_rows: 1
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: '## Aviso de Tierra (Earth Fault) en la AFP-400


    ### ¿Qué significa?


    El aviso **"Tierra"** (Earth Fault / Fallo de Tierra) indica que existe una fuga
    a tierra en algún punto del cableado o circuitos del sistema. En el SLC, una falla
    de tierra genera una condición de **Alarma/Problema** independientemente del estilo
    de cableado utilizado (Estilo 4, 6 o 7) [F7].


    El LED indicador asociado es el de **Avería del Sistema** (amarillo) [F1]:

    - Parpadea cuando la avería no ha sido reconocida.

    - Se ilumina fijo cuando se reconoce (pulsando Aceptar).


    ---


    ### Localización del fallo


    #### Paso 1 — Reconocer y leer el aviso en pantalla


    1. Pulsa **\<Aceptar Avan.>** para reconocer la avería y fijar el LED amarillo.

    2. Accede al menú de **Lectura de Estados** pulsando **\<Enter>** [F9].

    3. En la pantalla selecciona **\<2>** → "LEER ESTADOS" [F9].

    4. Pulsa **0 + Enter** → selecciona **SENSOR / MÓDULO / EQUIPO / Z** e introduce
    la dirección del punto para identificar qué dispositivo o zona reporta el fallo
    [F9].


    > El histórico también puede consultarse pulsando **2 + Enter** (Leer Histórico)
    o **4 + Enter** (Leer Histórico Alarma) [F9].


    ---


    #### Paso 2 — Identificar el LED de Fallo de Tierra en la MPS-400


    La placa de alimentación **MPS-400** dispone de un **LED específico de "Fallo
    de Tierra"** (Ground Fault LED) [F2] [F3]. Localízalo visualmente en la placa
    para confirmar que el fallo está activo.


    ---


    #### Paso 3 — Verificar si la detección de tierra está habilitada


    En la MPS-400 existe un puente **JP2** (en el manual AFP-300/AFP-400 referenciado
    como **JP2**) cuya función es **inhabilitar la detección de Falla de Tierra**
    [F4]. Comprueba que este puente no esté cortado accidentalmente, lo que podría
    enmascarar el fallo.


    > ⚠️ **Nota:** El fragmento F3 del manual AFP-300 identifica este puente como
    **JP2** con la función "Corte para inhabilitar la detección de la Falla de Tierra"
    [F4]. Verifica en tu placa física la serigrafía del jumper.


    ---


    #### Paso 4 — Inspección física del cableado


    Los fragmentos disponibles no describen un procedimiento paso a paso de rastreo
    físico del fallo de tierra más allá de lo indicado. Para la localización en campo,
    consulta la sección de cableado del manual completo **MIDT170** o el documento
    **50253SP** (sección de instalación).


    ---


    ### Resumen rápido


    - **LED activo:** Avería del Sistema (amarillo) [F1]

    - **LED específico en MPS-400:** Ground Fault LED [F2][F3]

    - **Jumper de inhibición:** JP2 en la MPS-400 [F4]

    - **Consulta en pantalla:** Menú Lectura de Estados → opción 0 (Leer Puntos) [F9]

    - **Impacto en SLC:** Falla de tierra genera Alarma/Problema en todos los estilos
    (4, 6 y 7) [F7]


    ---


    Fuente: MFDT170 (sin revisión registrada); MIDT170 (sin revisión registrada);
    50253SP (sin revisión registrada)


    ---


    También puedo ayudarte con: **procedimiento de rearme tras eliminar el fallo**,
    **conexionado de la MPS-400** o **lectura del histórico de averías en la AFP-400**.


    ---

    📖 **Información adicional del manual:**

    - "- **TB1** (top left): Terminal block with connections labeled TB1

    - **TB2** (top center): Terminal block labeled TB2

    - **TB3-TB6** (top right): Terminal blocks labeled TB3-TB6

    - **TB7-TB10** (far right): Terminal blocks labeled TB7-TB10

    - **Interruptor de Selección de Voltaje 115V/230V** (left side): Voltage selection
    switch

    - **Circuitos de Aviso y Señalizaciones 1-4** (right side): Alarm and signaling
    circuits 1-4

    - **Fallo de Tierra** (right side): Ground fault indicator

    - **Activación de la Alimentación AC** (right side): AC power activation

    - **Placa de Alimentación de la MPS-400** (bottom center): MPS-400 power supply
    board" [F2]

    - "* 1 Falla de Tierra

    * 2 Neutro

    * 3 Tierra

    * 4 Caliente

    * 5 Instalación

    * 6 +24 VDC batería

    * 7 –24 VDC batería

    * Refiérase a las "Conexiones de la Alimentación AC y de Batería (MPS-400)" en
    la página 2-45." [F3]'
