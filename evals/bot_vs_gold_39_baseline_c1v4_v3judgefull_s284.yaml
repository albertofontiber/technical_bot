  - HOP-138-9ES issue 5_11-2025_In
  coverage_status: appended
  coverage_appended_rows: 3
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: "# Cableado y configuración de lazo — INSPIRE E10/E15\n\n---\n\n## FASE\
    \ 1 — CABLEADO FÍSICO DEL LAZO\n\n### Módulo de lazo OPAL X2 (HOP-433-100)\n\n\
    El módulo tiene **10 terminales** distribuidos en dos filas [F2][F3]:\n\n**Lazo\
    \ 1:**\n- Terminal **1** → Lazo 1 Salida +VE (OUT +VE)\n- Terminal **2** → Lazo\
    \ 1 Salida -VE (OUT -VE)\n- Terminal **3** → ⊕ *(no usar para pantalla de cable)*\n\
    - Terminal **4** → Lazo 1 Entrada +VE (IN +VE)\n- Terminal **5** → Lazo 1 Entrada\
    \ -VE (IN -VE)\n\n**Lazo 2:**\n- Terminal **6** → Lazo 2 Salida +VE (OUT +VE)\n\
    - Terminal **7** → Lazo 2 Salida -VE (OUT -VE)\n- Terminal **8** → ⊕ *(no usar\
    \ para pantalla de cable)*\n- Terminal **9** → Lazo 2 Entrada +VE (IN +VE)\n-\
    \ Terminal **10** → Lazo 2 Entrada -VE (IN -VE)\n\n> ⚠️ **Los terminales 3 y 8\
    \ NO deben usarse para la pantalla del cable de lazo. La pantalla debe conectarse\
    \ a la barra de tierra de la central.** [F2][F3]\n\n> ⚠️ **No mezclar dispositivos\
    \ OPAL y CLIP en el mismo lazo.** [F2]\n\n---\n\n### Capacidad del lazo [F2][F4]\n\
    \n**Modo OPAL:**\n- Hasta **159 detectores** OPAL por lazo\n- Hasta **159 módulos**\
    \ OPAL por lazo (sirenas, pulsadores, módulos E/S)\n- Máximo **750 mA** por lazo\n\
    \n**Modo CLIP** *(requiere licencia)*:\n- Hasta **99 detectores** CLIP por lazo\n\
    - Hasta **99 módulos** CLIP por lazo\n\n> ⚠️ **Restricción EN54-2, apartado 13.7:**\
    \ máximo **512 detectores y/o pulsadores** por módulo de lazo (los 2 circuitos\
    \ en conjunto). [F2]\n\n---\n\n### Longitud máxima del lazo\n\nLa longitud se\
    \ calcula con el **programa de cálculo de lazo y batería de CLSS** y puede ser\
    \ de hasta **3,5 km**, dependiendo del tipo de carga y de cable [F2].\n\n> ℹ️\
    \ Para la aprobación **VdS2540**: 99 detectores + 99 módulos por lazo con cable\
    \ de **∅ 0,8 mm** [F4].\n\n---\n\n## FASE 2 — COMPROBACIONES PREVIAS CON MULTÍMETRO\
    \ (antes de conectar a la central)\n\nRealiza estas pruebas con el lazo **desconectado\
    \ físicamente** de los terminales de la central [F5][F6]:\n\n1. **Continuidad\
    \ y resistencia** — Comprueba la continuidad de cada parte del lazo y mide la\
    \ resistencia de extremo a extremo. Mide entre *Lazo X Entrada -VE* y *Lazo X\
    \ Salida -VE*, multiplica el resultado por 2 y añade la resistencia de cada aislador\
    \ (**0,1 a 0,13 Ω** por aislador) [F11].\n\n2. **Pantalla del cable** — Comprueba\
    \ la continuidad de la pantalla de extremo a extremo (debe dar resistencia muy\
    \ baja) [F5].\n\n3. **Aislamiento pantalla/conductores** — Verifica que NO hay\
    \ continuidad entre la pantalla y los cables +VE ni -VE [F5].\n\n4. **Prueba de\
    \ diodo (polaridad)** — Con el multímetro en función de prueba de diodo [F6]:\n\
    \   - Conecta en **polaridad invertida** (+VE del multímetro al negativo del lazo,\
    \ -VE al positivo): debe indicar **diodo en polarización directa**.\n   - Conecta\
    \ en **polaridad normal** (+VE al positivo, -VE al negativo): al principio leerá\
    \ resistencia baja, que irá aumentando al cargarse los condensadores de los dispositivos.\n\
    \   - Si en polaridad normal indica diodo en directa → hay dispositivos conectados\
    \ en polaridad inversa o cortocircuito en el cableado [F6].\n\n5. **Localización\
    \ de dispositivos invertidos** — Si se detectan en el paso 4, localízalos por\
    \ sectorización sucesiva del lazo [F6].\n\n6. **Pantalla vs. tierra** — Si la\
    \ pantalla no está conectada a la barra de tierra de la central, verifica que\
    \ no tiene ninguna otra conexión a tierra en el recorrido del lazo [F6].\n\n>\
    \ ℹ️ Se recomienda usar la herramienta **POL-200-TS** para diagnósticos más detallados;\
    \ funciona con protocolos OPAL y CLIP [F7].\n\n> ⚠️ **NUNCA uses un comprobador\
    \ de alta tensión (megóhmetro) en el circuito de lazo.** Solo multímetro de baja\
    \ tensión [F5].\n\n---\n\n## FASE 3 — CONEXIÓN A LA CENTRAL Y PRIMER ENCENDIDO\n\
    \n1. Conecta el cableado del lazo a los terminales correspondientes del módulo\
    \ OPAL X2 [F1].\n2. Conecta el cable HMI de la puerta a la CPU [F1].\n3. Conecta\
    \ la corriente principal y las baterías (**2 × 12 V 24 Ah** para E10/E15) [F1].\n\
    4. Al encender por primera vez:\n   - Se encenderá el **LED verde \"Alimentación\"\
    ** [F8].\n   - Si hay averías, se encenderá el **LED amarillo de AVERÍA** [F8].\n\
    \   - Silencia el zumbador con el botón **Silenciar Zumbador/Mute** [F8].\n5.\
    \ Selecciona **país** e **idioma** en la lista desplegable [F8].\n6. Ajusta **hora**\
    \ (formato 12/24 h) y **fecha** [F8].\n\n> ℹ️ La fecha y hora deben coincidir\
    \ con las del ordenador portátil para sincronización con el programa CLSS [F8].\n\
    \n---\n\n## FASE 4 — CONFIGURACIÓN DEL LAZO (programa CLSS)\n\nAntes de realizar\
    \ la Auto Configuración en un lazo CLIP o TC800, la central debe configurarse\
    \ previamente con el programa CLSS [F9]:\n\n1. Conecta la herramienta de configuración\
    \ CLSS.\n2. Ve a **Ajustes → Ajustes HMI** y en **Tipo de marca** selecciona *Notifier\
    \ EN* [F9].\n3. En **Ajustes de lazo**:\n   - Si el lazo **no se usa**: marca\
    \ ☑ **Sin Uso** [F9][F1].\n   - Si el lazo se usa: selecciona **Limitar a VdS\
    \ 2540** (Sí/No) — el valor de resistencia cambia según la selección — y elige\
    \ el **Tipo de Cable** [F9].\n4. Envía la configuración a la central [F9].\n\n\
    > ℹ️ De forma predeterminada, la central tiene licencia para **protocolo OPAL\
    \ avanzado** únicamente. Para CLIP o TC800 se requiere licencia adicional [F9].\n\
    \n---\n\n## FASE 5 — AUTO CONFIGURACIÓN (búsqueda de dispositivos)\n\n1. En la\
    \ central, selecciona **Auto Configuración** para buscar dispositivos en el lazo.\
    \ Confirma en la ventana emergente [F10].\n2. Una vez completada, selecciona la\
    \ flecha **>** junto al botón Auto Búsqueda para ver el estado de averías del\
    \ lazo [F10].\n3. Lee los mensajes de avería y corrige los problemas detectados\
    \ (doble dirección, dirección no asignada, averías de cable, etc.) [F10].\n4.\
    \ Selecciona **Hecho** al completar. Si no hay averías, vuelve a la página *Información\
    \ del Sistema* [F10].\n5. **Repite los pasos 1 a 4 para cada lazo** hasta descubrir\
    \ todos los lazos del sistema [F10].\n\n### Causas típicas de averías en Auto\
    \ Configuración [F10]:\n- Discordancia entre diseño de instalación y cableado\n\
    - Averías en el cableado\n- Fuente de RFI fuerte en el entorno\n- Error de módulo\
    \ o fuente de alimentación\n- Conexionado incorrecto en dispositivos\n\n---\n\n\
    ## Numeración de lazos [F2]\n\nLos circuitos de lazo se numeran **secuencialmente\
    \ de izquierda a derecha** del portamódulos. El primer módulo de lazo instalado\
    \ en la ranura izquierda tiene el lazo 1. En la E15 (dos filas de portamódulos),\
    \ la segunda fila continúa la numeración desde la primera.\n\n---\n\n**Fuente:**\
    \ HOP-138-8ES issue 6 (01-2026) — Instrucciones de puesta en marcha INSPIRE E10/E15;\
    \ HOP-138-9ES issue 5 (11-2025) — Manual de instalación INSPIRE E10"
