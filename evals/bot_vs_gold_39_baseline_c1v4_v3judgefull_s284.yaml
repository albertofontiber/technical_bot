  bot_answer: "# CAD-150-8: Alta de detector nuevo en lazo y prueba funcional\n\n\
    ## PARTE 1 — Dar de alta un detector nuevo en el lazo\n\nEl proceso de alta de\
    \ un elemento nuevo se realiza mediante la **autobúsqueda del lazo** [F1]:\n\n\
    1. Accede al **menú BUCLE** desde el teclado de la central [F1].\n2. Ejecuta la\
    \ **autobúsqueda** del lazo donde has instalado el detector. El sistema escaneará\
    \ el lazo y mostrará todos los elementos que detecta [F1].\n3. Verifica que los\
    \ elementos encontrados coinciden con los planos de la instalación [F1].\n4. Accede\
    \ al **menú ELEMENTOS** para asignar al nuevo detector:\n   - **Nombre** (campo\
    \ TEXTO) que lo identifique [F1]\n   - **Zona** de ubicación (campo ZONA) [F1]\n\
    5. Si es necesario, accede al **menú ZONA** para crear o asignar la zona correspondiente\
    \ al nuevo detector [F1].\n\n> **Nota:** La configuración puede realizarse desde\
    \ el teclado de la central o mediante el software de configuración, siendo este\
    \ último más sencillo y rápido [F6].\n\n---\n\n## PARTE 2 — Verificar el estado\
    \ del detector dado de alta\n\nAntes de hacer la prueba funcional, puedes comprobar\
    \ el estado del detector desde el **menú ELEMENTO → VER** [F2]:\n\n- **BUCLE**:\
    \ selecciona el bucle donde está el detector\n- **DIR**: dirección del elemento\n\
    - **ZONA**: zona asignada\n- **TIPO**: tipo de elemento (óptico, térmico, etc.)\n\
    - **MODO**: estado actual (conectado, desconectado o en prueba)\n- **VA**: valor\
    \ analógico del detector en tiempo real\n\nUsa los cursores `←` `→` para seleccionar\
    \ bucle/dirección, y `<+>` `<->` o cursores `↑` `↓` para navegar entre elementos\
    \ [F2].\n\n---\n\n## PARTE 3 — Prueba funcional del detector\n\nLa prueba se realiza\
    \ poniendo la zona en **modo PRUEBA** desde el **menú ZONA → PRUEBA** [F3]:\n\n\
    1. Accede al **menú ZONA → PRUEBA** [F3].\n2. Introduce el **rango de zonas**\
    \ a poner en prueba (campo RANGO) [F3].\n3. Selecciona si deseas activar las sirenas\
    \ durante la prueba (campo **ACTIVAR SIRENAS: [SI/NO]**) [F3].\n4. Pulsa **Aceptar**\
    \ [F3].\n5. Activa el detector (aerosol, calor, etc.) y verifica que entra en\
    \ alarma.\n\n**Comportamiento en modo prueba** [F3] [F4]:\n- Si ACTIVAR SIRENAS\
    \ = **SI**: las sirenas se activarán unos segundos tras la alarma del detector\
    \ y se silenciarán automáticamente.\n- Cualquier **retardo de sirena** programado\
    \ queda **anulado** durante la prueba para agilizarla.\n- Si en **20 minutos**\
    \ no se produce ningún disparo de alarma, el sistema vuelve automáticamente al\
    \ estado normal, cancelando el modo prueba.\n\n**Para salir del modo prueba:**\
    \ conecta la zona desde el menú ZONA → CONECTAR [F3].\n\n---\n\n## PARTE 4 — Verificación\
    \ general del sistema tras el alta\n\nAdicionalmente, el manual indica comprobar\
    \ [F9]:\n- Que al provocar una alarma se activa el **relé de alarma**.\n- Que\
    \ se activan las **salidas de sirena** una vez transcurrido el tiempo de retardo\
    \ programado.\n\n---\n\n**Códigos de acceso de fábrica** [F9]:\n- Nivel usuario:\
    \ **1111**\n- Nivel instalador: **2222**\n\n---\n\nFuente: 55315013 Manual Centrales\
    \ Analógicas CAD-150-8 Instalación ES FR GB IT (sin revisión registrada); 55315008\
    \ Manual Centrales Analógicas CAD-150-8 Usuario ES FR GB IT (sin revisión registrada)\n\
    \n---\n\nTambién puedo ayudarte con: **desconexión temporal de un detector para\
    \ trabajos**, **configuración de maniobras asociadas a la nueva zona** o **mantenimiento\
    \ periódico según EN54-14** de la CAD-150-8.\n\n---\n⚠️ **Información adicional\
    \ del manual:**\n- \"En caso de necesidad, se puede encender el equipo solo con\
    \ las baterías conectadas, pero es imprescindible pulsar sobre el pulsador BAT\
    \ para arrancar el equipo.\" [F6]"
