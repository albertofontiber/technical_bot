  bot_answer: '## Niveles de alarma y prealarma en detectores — Central Morley DXc
    (protocolo Morley-IAS)


    ### Valores por defecto


    Para los detectores con protocolo **Morley-IAS**, el valor analógico se representa
    de **0% a 100%**:


    - **Nivel de alarma por defecto: 100%** [F1]

    - **Nivel de prealarma por defecto: 80%** [F1]


    Esto aplica a detectores ópticos, térmicos y óptico-térmicos estándar. En pantalla
    de la DXc se muestra así [F1]:


    ```

    [Dir. 002 - OPT] Sensibilidad ( DIA )

    1:Fuego(100%) 2:Prealarm( 80%)

    ```


    ---


    ### Caso especial: detectores Multicriterio (OTM) y Láser


    Estos detectores no usan porcentaje sino **niveles numéricos**. Los valores recomendados
    por defecto son [F3]:


    **Detector óptico-térmico (OTM):**

    - Prealarma recomendada: **Nivel 3** (valor analógico 72, sensibilidad 6,5% osc./m)

    - Alarma recomendada: **Nivel 4** (valor analógico 86, sensibilidad 6,5% a 11,5%
    osc./m autoajustado)


    **Detector láser (MI-LZR):**

    - Prealarma recomendada: **Nivel 4** (valor analógico 69, sensibilidad 0,32% osc./m)

    - Alarma recomendada: **Nivel 5** (valor analógico 76, sensibilidad 0,65% osc./m)


    ---


    ### Máximo configurable


    - **Nivel de alarma máximo configurable: 108%** [F1]

    - **Rango de ajuste: 80% a 108%** [F6]

    - El nivel de prealarma **no puede ser superior al de alarma** [F8]

    - El panel **no permite seleccionar niveles que impidan el reconocimiento de alarmas**
    [F8]


    > ⚠️ El manual advierte: *"Asegúrese de que el sistema mantiene los niveles de
    seguridad en la detección"* si se modifican los valores por defecto [F8].


    ---


    También puedo ayudarte con: **procedimiento de ajuste de sensibilidad en la DXc**,
    **configuración del Modo Horario de sensibilidad** o **interpretación de los valores
    analógicos en pantalla**.


    Fuentes: DXc_Manual variaciones de mercado (sin revisión registrada); MIE-MP-520rv04
    (rev. 4)


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "el umbral de alarma de fuego depende del ajuste del nivel/modo y es diferente
    para cada nivel de alarma." (DXc_Manual variaciones de mercado, p. 5) [F3]'
