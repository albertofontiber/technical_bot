  question: En la Morley RP1r, después de descargar la extinción el sistema no vuelve
    a estado normal tras resetear. ¿Qué comprobar?
  gold_estado: verificado
  conducta_esperada: answer
  conducta_bot: answer
  veredicto: PARCIAL
  diagnostico: Acierta en señalar el parámetro r.I, las averías enclavadas y el procedimiento
    de rearme, pero omite comprobaciones clave del manual como la entrada ABORT enclavada,
    el estado de zonas en alarma y la verificación específica de Flow Press. Además
    confunde o alucina parámetros/denominaciones como t.Fi/F.1 y no explica correctamente
    t.A como duración de descarga.
  bot_sources:
  - HLSI-MA-103_GuiaRapida_RP1r-Supra_ES_lr
  - HLSI-MN-103I_RP1r-Supra_lr
  - HLSI-MN-103_RP1r-Supra_lr
  coverage_status: appended
  coverage_appended_rows: 4
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: '# RP1r-Supra: Sistema no vuelve a estado normal tras resetear después
    de extinción


    Este comportamiento puede deberse a varias causas. Comprueba en este orden:


    ---


    ## 1. Parámetro **r.i** — Rearme inhibido tras extinción


    El parámetro **r.i** define un intervalo de tiempo durante el cual el rearme está
    bloqueado tras la extinción [F13].


    - **Valor `- -`**: Rearme inhibido hasta que finalice la extinción o se agote
    el tiempo configurado en el parámetro **t.Fi** (cuando **t.A → 0 seg.**) [F13].

    - **Valor `00`**: Rearme permitido en cualquier momento *(valor por defecto)*
    [F13].

    - **Valores `01` a `30`**: Rearme inhibido durante el intervalo definido en minutos
    [F13].


    ➡️ **Acción**: Accede al modo de programación (nivel 3) y verifica el valor de
    **r.i**. Si está en `- -` o en un valor de 01 a 30, el sistema no permitirá el
    rearme hasta que expire ese tiempo. Espera a que transcurra el intervalo o ajusta
    el parámetro.


    ---


    ## 2. Parámetro **F.1** — Inhibición temporal del rearme


    De acuerdo con la norma **UNE-EN 12094-1:2004, sección 4.12.2**, existe la posibilidad
    de inhibir temporalmente la función de rearme una vez la central ha entrado en
    modo ACTIVADO [F12]. Este intervalo se configura mediante el parámetro **[F.1]**
    desde el modo de programación [F4].


    ➡️ **Acción**: Verifica el valor de **F.1** en la programación. Si está activo,
    el rearme estará bloqueado durante ese intervalo.


    ---


    ## 3. Averías enclavadas activas


    Todas las averías son, **por defecto, enclavadas y requieren rearme manual** para
    su restablecimiento [F4]. Si existe alguna condición de avería activa (presión
    baja, señal de flujo, puerta abierta, etc.), el sistema no volverá a estado normal
    aunque se pulse rearme.


    ➡️ **Acción**: Revisa los LEDs de avería del panel:

    - LED **"Avería presión baja"** intermitente → entrada **LOW PRESS SWITCH** [F4]

    - LED **"Avería presión flujo"** intermitente → entrada **FLOW PRESS SWITCH**
    [F4]

    - LED **"C''to. supervisión puerta abierta"** intermitente → entrada **DOOR OPEN
    SWITCH** [F4]


    Resuelve la condición de avería física antes de intentar el rearme. Alternativamente,
    estas averías (excepto el circuito de paro) pueden configurarse para rearme automático
    mediante las **funciones especiales** (sección **5.4**) [F4].


    ---


    ## 4. Procedimiento de rearme correcto


    Para ejecutar el rearme correctamente [F4]:

    1. Accede con **nivel 2** de acceso (consulta sección **4.3. Niveles de acceso**).

    2. Pulsa la tecla **"Rearme"**.

    3. Esta acción reinicia la central y restablece todas las entradas enclavadas.


    ---


    ## 5. Estado post-extinción esperado (referencia)


    Tras finalizar la extinción, el LED **"Extinción realizada"** queda iluminado
    de forma **fija** y los relés de los circuitos de extinción se **desactivan**
    [F1]. Este estado persiste hasta que se realice un rearme válido.


    ---


    **Fuentes:**

    - HLSI-MN-103_RP1r-Supra_lr (rev. v.07, 2018-05-01)

    - HLSI-MA-103_GuiaRapida_RP1r-Supra_ES_lr (sin revisión registrada)


    ---


    También puedo ayudarte con: **configuración del parámetro t.H (tiempo de inundación)**,
    **verificación de circuitos de extinción** o **funciones especiales de rearme
    automático de averías (sección 5.4)**.'
