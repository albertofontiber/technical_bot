  bot_answer: '## Desactivación de zona en la CCD-103


    **Importante:** La CCD-103 es una central convencional. La unidad mínima de desactivación
    es la **zona completa**, no un detector individual. El manual no describe ningún
    procedimiento para desactivar un detector de forma individual sin afectar al resto
    del lazo [F2].


    ---


    ## Lo que sí permite el sistema: desconexión por zona


    El procedimiento para desconectar una zona completa es el siguiente [F2][F3]:


    1. Asegúrate de que la **llave de bloqueo de teclado (G)** está en posición **abierta**
    (desbloqueada). Con la llave cerrada, el teclado está inhibido y las pulsaciones
    no tienen efecto [F3].

    2. Localiza la **tecla de zona (A)** correspondiente a la zona que quieres desconectar.

    3. **Pulsa la tecla de zona dos veces** → la zona queda desconectada [F2].


    Para reconectar la zona:

    - Con la zona desconectada, **pulsa la tecla de zona una vez** → zona conectada
    [F2].


    ---


    ## Indicaciones visuales tras la desconexión


    Una vez desconectada la zona, se activarán los siguientes indicadores [F2][F6]:


    - **Indicador de Anular (4):** encendido de forma continua.

    - **Indicador Avería/Desconexión/Prueba de zona (6):** encendido fijo en la zona
    anulada.


    ---


    ## Advertencia operativa


    Cuando una zona está desconectada, **la central no refleja ninguna incidencia
    ni evento en esa zona**. El manual indica expresamente que es importante **limitar
    el uso de esta maniobra** [F2].


    ---


    **Fuente:** CCD-103_Manual_ES_FR_GB_IT (sin revisión registrada)


    ---


    También puedo ayudarte con: **modo de prueba de zona**, **resolución de averías
    en zona** o **configuración de retardos de sirenas** de la CCD-103.'
