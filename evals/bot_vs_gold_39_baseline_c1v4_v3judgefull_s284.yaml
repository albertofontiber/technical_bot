  bot_answer: '# Conexionado del módulo M710 / MI-DMMI en el lazo


    ## Asignación de terminales


    Los terminales del lazo se conectan así [F1]:


    - **Terminal 1** → − Lazo entrada (Loop in −)

    - **Terminal 2** → + Lazo entrada (Loop in +) — con aislador interno activo

    - **Terminal 3** → − Lazo salida (Loop out −)

    - **Terminal 4** → + Lazo salida (Loop out +)

    - **Terminal 5** → + Lazo salida alternativo (sin aislador interno)

    - **Terminales 6 / 7** → Entrada A del dispositivo supervisado


    > ⚠️ **Nota sobre el aislador interno:** Si NO se requiere aislamiento de cortocircuitos,
    conecta el + de salida del lazo al **terminal 5** en lugar del **terminal 2**.
    El terminal 5 está conectado internamente con el terminal 4 [F1][F9].


    ---


    ## Modo 2 estados


    - Resistencia de fin de línea (RFL): **47 kΩ** en paralelo con la entrada (terminales
    6-7) [F1]

    - Un **cortocircuito** en la entrada se señaliza como **alarma** [F1]

    - Un **circuito abierto** se señaliza como **avería**


    ---


    ## Modo 3 estados


    - Resistencia de fin de línea (RFL): **47 kΩ** [F1]

    - Resistencia adicional: **18 kΩ en serie** con cada contacto de alarma (conmutador)
    que se desee supervisar [F1][F2][F4]

    - Esto permite distinguir tres estados: **reposo / alarma / avería por cortocircuito**

    - ⚠️ Esta función requiere que la **central sea compatible** con supervisión de
    cortocircuito en la entrada [F2][F4]


    ---


    ## Nota sobre el MI-DMMI vs MI-DMM2I


    - El **MI-DMMI** (entrada única) **no tiene conexiones en los terminales 8 y 9**
    [F9]

    - Los terminales 8 y 9 (aislador externo opcional) están disponibles **únicamente
    en el MI-DMM2I** [F9]


    ---


    También puedo ayudarte con: **programación del módulo M710/MI-DMMI en la central
    ID3000**, **diferencias entre MI-DMMI y MI-DMM2I**, o **conexionado del módulo
    de salida MI-D2ICMO**.


    Fuente: Conexionado-del-modulo-M710-MI-DMMI (sin revisión registrada); I56-2006-004
    MI-DMMI_DMM2I_D2ICMO (sin revisión registrada); I56-4406-001 MI-DMMIE MI-DMM2IE
    MI-D2ICMOE (sin revisión registrada)'
