  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: '# Alimentación y parámetros de seguridad intrínseca del IS-mA1


    ## Clasificación ATEX / IECEx


    El IS-mA1 está certificado como [F1]:

    - **Ex ia IIC T4 Ga**

    - Rango de temperatura ambiente: **-40 °C ≤ Ta ≤ +60 °C**

    - Apto para zonas **0, 1 y 2** con gases y vapores inflamables, grupos **IIA,
    IIB e IIC**, clases de temperatura **T1 a T4** [F1]

    - Certificados: **SIRA 05ATEX2084X** / **IECEx SIR 06.0045X** [F1]


    ---


    ## Parámetros de seguridad intrínseca de entrada (Entity Parameters)


    ### Terminales **+ respecto a –** (alimentación principal del sounder)


    - **Ui = 28 V** [F1]

    - **Ii = 93 mA** [F1]

    - **Pi = 660 mW** [F1]

    - **Ci = 0** [F1]

    - **Li = 0** [F1]


    ### Terminales **S2 y S3 respecto a –** (activación de 2.ª y 3.ª etapa de alarma)


    - **Ui = 28 V** [F5]

    - **Ii = 0 mA** [F5]

    - **Ci = 0** [F5]

    - **Uo = 16,8 V** [F5]

    - **Io = 7,3 mA** [F5]

    - **Po = 31 mW** [F5]


    > ⚠️ **IMPORTANTE:** Como la corriente de entrada permitida en S2/S3 es **cero**,
    estos terminales **solo pueden conectarse** a una barrera de retorno de diodo,
    un relé intrínsecamente seguro o un aislador galvánico, todos ellos certificados
    por un Organismo Notificado. Solo se admiten barreras de retorno de diodo con
    **caída de tensión inferior a 0,9 V** [F8]. Alternativamente, pueden conectarse
    directamente a un interruptor de accionamiento mecánico en la zona peligrosa [F8].


    ---


    ## Métodos de alimentación desde la zona segura


    ### Opción A — Barreras Zener (shunt zener diode barriers)


    El aparato asociado en zona segura debe tener parámetros [F5]:

    - **Uo ≤ 28 V**

    - **Io ≤ 93 mA**

    - **Po ≤ 660 mW**

    - **Co ≥ C_cable**

    - **Lo ≥ L_cable**


    Configuraciones posibles [F3]:

    1. **Alarma de una etapa con interruptor en positivo:** barrera Zener de un solo
    canal (Fig. 4)

    2. **Alarma de una etapa con interruptor en negativo:** barrera Zener + barrera
    de retorno de diodo (Fig. 5)

    3. **Alarma multietapa:** barrera Zener principal + barreras de retorno de diodo
    para 2.ª y 3.ª etapa — conectar S2 a 0 V activa la 2.ª etapa, S3 a 0 V activa
    la 3.ª [F4]


    ### Opción B — Aisladores galvánicos


    No requieren conexión a tierra de alta integridad [F7]. El sounder puede alimentarse
    con cualquier aislador galvánico certificado **Ex ia** por un Organismo Notificado,
    con parámetros de salida dentro de los límites especificados [F7].


    Para alarma multietapa se usan **relés galvánicamente aislados** certificados
    Ex ia para los terminales S2 y S3 [F7].


    El aparato asociado (suministro galvánicamente aislado) debe tener parámetros
    [F6]:

    - **Uo ≤ 28 V**

    - **Io ≤ 93 mA**

    - **Po ≤ 660 mW**

    - **Co ≥ C_cable**

    - **Lo ≥ L_cable**


    ---


    ## Restricción crítica de capacitancia de cable


    > ⚠️ La capacitancia total conectada a los terminales **+/–** del sounder (C_cable
    más cualquier otra capacitancia) **no debe superar 83 nF** [F5][F6].


    ---


    ## Advertencia de limpieza (electrostática)


    El enclosure es de **plástico ABS** [F1]. Limpiar **únicamente con paño húmedo**
    para evitar carga electrostática [F1].


    ---


    **Fuentes:**

    - IS5001-F_IS-mA1_EN (Document No. IS 5001, Issue F, 06-08-15)

    - manual IS MA1 (Document No. IS 5001, Issue H, 03-01-2020)


    ---


    También puedo ayudarte con: **selección de tonos y configuración de etapas de
    alarma**, **requisitos de puesta a tierra para barreras Zener**, o **especificaciones
    mecánicas y grado de protección IP del IS-mA1**.


    ---

    ⚠️ **Información adicional del manual:**

    - "CAUTION - The clearance between sounder terminals S2 and S3 is less than 6mm."
    [F5]

    - "CAUTION - Bonding between conduit connections is not automatic and must be
    provided as part of this installation." [F5]


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "The IS-mA1 minialarm is an ATEX and IECEx certified intrinsically safe sounder
    which produces a loud warning signal in a hazardous area." (IS5001-F_IS-mA1_EN,
    p. 1) [F11]'
