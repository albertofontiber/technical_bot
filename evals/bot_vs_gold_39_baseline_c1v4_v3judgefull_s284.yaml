  bot_answer: '## Acceso al menú de Programación Avanzada — CAD-250


    El acceso al menú **AVANZADO** requiere estar autenticado como administrador.
    El proceso completo es:


    ### Paso 1 — Acceder como administrador


    1. En la **PANTALLA DE REPOSO**, toca el icono del **candado** (🔒) [F2]

    2. Se mostrará la **PANTALLA DE ACCESO** con teclado numérico [F2]

    3. Introduce la clave de administrador por defecto: **2222** [F2]


    > ⚠️ El uso indebido del nivel de administrador puede provocar mal funcionamiento
    de la instalación [F2]


    ### Paso 2 — Navegar al submenú AVANZADO


    Una vez dentro de la pantalla de administrador, la ruta es [F1]:


    **AJUSTES** (Menú principal) **→ AVANZADO** (Submenú)


    - En el **Menú Principal** (columna izquierda), selecciona **AJUSTES** [F7]

    - En el **Submenú** (columna derecha), selecciona **AVANZADO** [F1]


    ### Paso 3 — Pestañas disponibles dentro de AVANZADO


    Una vez dentro, dispones de **3 pestañas** [F1]:


    - **SISTEMA**: número de cabinas (paneles 1–4), número de lazos y cabina de LEDs
    de zona

    - **OTROS**: interruptores de puesta en marcha y mantenimiento (tiempo de inactividad,
    salto a scroll si incidentes, saltar a último incidente prioritario si timeout)
    [F8]

    - **REINICIAR**: devuelve la configuración completa de la central a valores de
    fábrica [F8]


    > ⚠️ Por razones de seguridad y cumplimiento normativo, los interruptores de inactividad,
    timeout y scroll deben estar activados (en verde) por defecto [F8]


    ---


