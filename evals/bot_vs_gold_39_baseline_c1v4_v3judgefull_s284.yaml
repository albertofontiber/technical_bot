  bot_sources:
  - AM-8200-manu-prog-spa
  coverage_status: appended
  coverage_appended_rows: 2
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: "# Programación de ecuación CBE en AM-8200 para activar una salida\n\
    \n## Concepto previo\n\nLa ecuación **CBE (Control By Event)** se asocia a cada\
    \ punto, zona o grupo y define las condiciones que, cuando se cumplen, activan\
    \ el dispositivo [F1]. Para un **módulo de salida**, la CBE contiene las direcciones\
    \ de los objetos (sensores, módulos de entrada o grupos) que lo activarán [F1].\n\
    \n---\n\n## Paso a paso: acceso y edición de la CBE\n\n1. **Accede al menú de\
    \ programación del punto de salida:**\n   Navega a `MENU PROGRAMMAZIONE \\ Punti`\
    \ y selecciona el módulo de salida correspondiente [F8].\n\n2. **Selecciona la\
    \ pestaña \"Programación\":**\n   Dentro del punto, accede a la pestaña **Programmazione**\
    \ (Programación), donde aparecen los campos **Zona** y **CBE** [F8] [F9].\n\n\
    3. **Selecciona el campo CBE:**\n   Usa las teclas flecha **▲▼** para posicionarte\
    \ sobre el campo **CBE** y pulsa la tecla de confirmación **☑** para editarlo\
    \ [F8].\n\n4. **Introduce la ecuación CBE:**\n   Usa el teclado alfanumérico de\
    \ la pantalla. Los operadores disponibles son: `NOT`, `AND`, `OR`, `DEL`, `SDEL`,\
    \ `XGRP`, `TIM`, `DIS`, `PRE`, `FLT`, `TAC`, `TONE` [F8].\n   - **La longitud\
    \ máxima de una CBE es de 64 caracteres** [F8].\n   - **No insertes espacios entre\
    \ caracteres** (excepto donde el operador DEL lo requiera) [F1].\n\n5. **Confirma\
    \ con Enter:**\n   Pulsa **Enter** para guardar la ecuación [F8].\n\n---\n\n##\
    \ Ejemplos prácticos de ecuaciones para activar una salida\n\n### Activación con\
    \ UN solo grupo (OR implícito)\nSi quieres que el módulo de salida se active cuando\
    \ el **Grupo 9** esté en alarma:\n```\n(G9)\n```\nO equivalentemente: `OR(G9)`\
    \ [F2]\n\n---\n\n### Activación si CUALQUIERA de varios grupos está en alarma\
    \ (OR)\n```\nOR(G9 G15 G23)\n```\n→ Si el grupo G9, G15 **o** G23 está en alarma,\
    \ la salida se activa [F2].\n\n---\n\n### Activación solo si TODOS los grupos\
    \ están en alarma (AND)\n```\nAND(G9 G15 G23)\n```\n→ Solo si G9, G15 **y** G23\
    \ están simultáneamente en alarma [F2].\n\n---\n\n### Activación con retardo (DEL)\n\
    ```\nDEL(00.30 00.30(AND(L1S1 L1S4)))\n```\n→ Tras **30 segundos** desde que los\
    \ sensores L1S1 y L1S4 están ambos en alarma, la salida se activa y permanece\
    \ activa **30 segundos** [F6].\n\n- Tiempo máximo de retardo: **10 minutos** [F6].\n\
    - Tiempo máximo de duración: **10 minutos** [F6].\n- Solo puede haber **un operador\
    \ DEL por ecuación** [F6].\n\n---\n\n### Activación por doble coincidencia en\
    \ un grupo (XGRP)\n```\nXGRP(G23)\n```\n→ Se activa cuando **al menos 2 dispositivos**\
    \ del grupo G23 están activos [F3].\n⚠️ No se permite usar más de un grupo con\
    \ XGRP: `XGRP(G23 G24)` **no es válido** [F3].\n\n---\n\n### Activación por estado\
    \ de avería de un dispositivo (FLT)\n```\nOR(FLT(C1L1S2) FLT(Z1))\n```\n→ Se activa\
    \ si el sensor C1L1S2 **o** la zona Z1 están en avería [F4].\n\n---\n\n### Activación\
    \ por pre-alarma de un sensor (PRE)\n```\nOR(PRE(C1L1S2) PRE(C2L1S10))\n```\n\
    → Se activa si cualquiera de los dos sensores está en **pre-alarma** [F5].\n\n\
    ---\n\n## Reglas sintácticas críticas\n\n- Si usas **más de un operador**, el\
    \ primer carácter debe ser `(` y el último `)` [F1].\n- Formato general: `OPERADOR(OPERANDO-1\
    \ OPERANDO-2...)` [F1].\n- `NOT` y `XGRP` funcionan **solo con un operando** [F1].\n\
    - Para grupos directos: **no se puede referenciar un grupo con índice menor**\
    \ que el grupo al que se asocia la CBE. Ejemplo no permitido: `G33 = (G23 G24)`\
    \ [F2].\n- Para grupos inversos: **no se puede referenciar un grupo con índice\
    \ mayor**. Ejemplo no permitido: `G305 = (G306 G307)` [F2].\n- Si no se programa\
    \ ninguna CBE en un módulo de salida, **la salida no se activará nunca** (salvo\
    \ que tenga tipo ID para señalizaciones generales) [F2].\n\n---\n\nFuente: AM-8200\
    \ Manual de programación — Doc. M-162.1-AM8200-ESP Rev A.3 — HONEYWELL LIFE SAFETY\
    \ IBERIA (sin fecha de revisión registrada en los fragmentos).\n\n---\n\nTambién\
    \ puedo ayudarte con: **operador TIM y SDEL**, **programación de grupos software\
    \ (G)** o **asociación de zonas a puntos** en la AM-8200.\n\n---\n\U0001F4D6 **Información\
    \ adicional del manual:**\n- \"**Ejemplo**: Y(G1G2)O(G3AND(G4G5))\n\nQue equivale\
    \ a: 1- SI AMBOS grupos G1 y G2 están activos\n\n2 - O\n\n3 - el Grupo G3 está\
    \ ACTIVO y ambos grupos G4 y G5 están activos.\n\n**Nota: se debe escribir la\
    \ ecuación sin insertar espacios entre los caracteres a introducir.**\" [F1]"
