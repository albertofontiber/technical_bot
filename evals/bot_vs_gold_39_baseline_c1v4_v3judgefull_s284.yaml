    \ opción **\"Cambio del código de acceso\"** ③.\n3. Asegúrate de que **Nivel de\
    \ Acceso 2** ④ esté seleccionado y que el cursor parpadee ⑤.\n4. Puedes ver la\
    \ entrada del código haciendo clic en el **icono del ojo** ⑥.\n5. Introduce un\
    \ nuevo código de **entre 4 y 8 caracteres** con el teclado ⑦.\n6. Confirma la\
    \ entrada seleccionando el símbolo **✓** ⑧.\n7. Repite los pasos 3 a 6 para confirmar\
    \ el código introducido [F2].\n\n---\n\n## Cambio de contraseña de Nivel 2 y/o\
    \ Nivel 3 (desde sesión de Nivel 3)\n\nProcedimiento según el manual de puesta\
    \ en marcha [F1]:\n\n> Si estás en Nivel 3, puedes cambiar el código de Nivel\
    \ 2 **o** el de Nivel 3 [F1].\n\n1. Selecciona el icono del menú ① → selecciona\
    \ **\"Ajustes\"** ② → inicia sesión como usuario de **Nivel de Acceso 3**.\n2.\
    \ Selecciona la opción **\"Cambio del código de acceso\"** ③.\n3. Asegúrate de\
    \ que el **Nivel de Acceso 2 o 3** ④ esté seleccionado y que el cursor parpadee\
    \ ⑤.\n4. Puedes ver la entrada del código haciendo clic en el **icono del ojo**\
    \ ⑥.\n5. Introduce un nuevo código de **entre 4 y 8 caracteres** con el teclado\
    \ ⑦.\n6. Confirma la entrada seleccionando el símbolo ⑧.\n7. Repite los pasos\
    \ 3 a 6 para confirmar el código [F1].\n8. Observa el mensaje **\"Cambio de código\
    \ de acceso satisfactorio\"** → selecciona **Aceptar** [F1].\n9. **Sincroniza\
    \ el programa con la central** y realiza una **copia de seguridad del cambio en\
    \ la nube** [F1].\n\n---\n\n## Resumen de permisos por nivel\n\n- **Nivel 2**\
    \ → solo puede cambiar la contraseña de Nivel 2 [F1].\n- **Nivel 3** → puede cambiar\
    \ la contraseña de Nivel 2 **o** de Nivel 3 [F1].\n\n---\n\n⚠️ **Nota de seguridad:**\
