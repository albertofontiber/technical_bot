  question: ¿Cómo se calcula la capacidad de batería (en Ah) necesaria para la central
    AM-8200?
  gold_estado: verificado
  conducta_esperada: answer
  conducta_bot: answer
  veredicto: PARCIAL
  diagnostico: La respuesta recoge correctamente la fórmula principal, los términos
    A/B, las autonomías 24/72 h, el factor 1,2 y los límites generales de capacidad.
    Sin embargo, introduce detalles potencialmente erróneos o confusos en baterías
    recomendadas/capacidades —por ejemplo agrupar NP7-12BFR como 17,2 Ah— y añade
    variantes/datos no necesarios, por lo que no es tan limpia ni fiable como la referencia.
  bot_sources:
  - AM-8200 Manual Instalacion
  - AM-8200-manu-prog-spa
  - UCIP MODBUS AM8200 V5.1
  coverage_status: appended
  coverage_appended_rows: 1
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: '# Cálculo de capacidad de batería — AM-8200


    El manual proporciona un método estructurado en dos tablas (Tabla 1 para AM-8200
    / Tabla 2 para AM-8200BB) con la siguiente fórmula final [F5][F6]:


    ---


    ## Fórmula general


    **Ah Batería = (A + B) × 1,2**


    Donde:

    - **A** = Corriente total en reposo (No Alarma) × horas de autonomía requeridas

    - **B** = Corriente total en alarma × **0,5 h**

    - **1,2** = Factor de corrección por tolerancias de fabricación de las baterías
    [F4]


    ---


    ## Paso a paso


    **1. Calcular la corriente total en condiciones de NO ALARMA (columna A)**


    Suma los consumos de todos los componentes instalados [F6]:


    Para la variante **AM-8200 (CPU AM8200-KLCD)**:

    - AM-8200 CPU (AM8200-KLCD): **179 mA**

    - LIB-8200 (por unidad): **50 mA**

    - AM82-2S2C: **28 mA**

    - AM82-BST-C: **39 mA**

    - Corriente de lazos (ver Tabla 3 del manual)

    - Corriente salida usuario (máx. **2 A**)

    - LCD-8200, campanas, sirenas, flashes, otros dispositivos


    Para la variante **AM-8200BB (CPU AM-8200BB)**:

    - AM-8200BB: **135 mA**

    - LIB-8200 (por unidad): **50 mA**

    - AM82-2S2C: **28 mA**

    - AM82-BST-C: **39 mA**

    - Corriente de lazos (ver Tabla 3 del manual)

    - Corriente salida usuario (máx. **2 A**)


    [F5][F6]


    **2. Multiplicar por las horas de autonomía en reposo**


    La tabla indica dos opciones [F5][F6]:

    - **× 24 h** o **× 72 h** (según la autonomía requerida por normativa o proyecto)


    → Resultado = **Espera (A)** en Ah


    **3. Calcular la corriente total en condiciones de ALARMA (columna B)**


    Suma los consumos en alarma de todos los componentes [F6]:


    Para la variante **AM-8200**:

    - AM-8200 CPU: **345 mA**

    - LIB-8200: **92 mA**

    - AM82-2S2C: **28 mA**

    - AM82-BST-C: **39 mA**

    - Corriente de lazos en alarma (la central enciende **solo los primeros 6 LED**
    de detectores y módulos en alarma) [F4]

    - Corriente salida usuario (máx. **2 A**)


    Para la variante **AM-8200BB**:

    - AM-8200BB: **177 mA**

    - LIB-8200: **92 mA**

    - AM82-2S2C: **28 mA**

    - AM82-BST-C: **39 mA**


    [F5][F6]


    **4. Multiplicar por 0,5 h**


    → Resultado = **Alarma (B)** en Ah [F5][F6]


    **5. Aplicar la fórmula final**


    **Ah Batería = (A + B) × 1,2** [F4][F5][F6]


    ---


    ## Límites y restricciones a verificar


    - Corriente total de todos los lazos: debe ser **inferior a 750 mA** [F4]

    - Corriente total salida de 24 Vcc usuario: debe ser **inferior a 2 A** [F4]

    - Si la absorción calculada supera **3,5 A**, la corriente en exceso durante alarma
    se extrae de las baterías [F4]

    - Capacidad de batería admitida: **2 × 12 V, mínimo 7 Ah, máximo 18 Ah** [F2]


    ---


    ## Baterías recomendadas por el fabricante


    - Yuasa **NP18-12B** o **NP7-12BFR** (UL94) — 12 V / 17,2 Ah [F2]

    - Fiamm **FG21803** o **FGV21803** (UL94) — 12 V / 18 Ah [F2]


    > ⚠️ El manual indica consultar el **apéndice al final del manual de instalación**
    para el cálculo completo de baterías en reposo y en alarma [F1]. Asegúrate de
    tener el manual físico para completar la Tabla 3 (consumo de lazos).


    ---


    **Fuente:** AM-8200 Manual de Instalación — Doc. AM-8200-ESP Rev. A.3 (sin fecha
    de revisión registrada)


    ---


    También puedo ayudarte con: **consumos detallados por tarjeta LIB-8200**, **límites
    de corriente por lazo** o **conexionado de baterías en la AM-8200**.


    ---

    ⚠️ **Información adicional del manual:**

    - "4 La corriente en las condiciones de reposo o alarma no puede superar, en ningún
    caso, la capacidad de la fuente de alimentación." [F4]


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "Calcular la corriente total necesaria para todos los lazos usando **la tabla
    2 (ver a continuación)** teniendo presente que la central enciende **solo los
    primeros 6 LED** de los detectores y módulos de entrada en alarma." (AM-8200 Manual
    Instalacion, p. 53) [F4]'
