  bot_answer: "# Configuración de una Maniobra (Causa-Efecto) en la CAD-250\n\n> ⚠️\
    \ **Aviso crítico:** La programación de maniobras es una de las funciones más\
    \ críticas de la configuración del sistema. Requiere conocimiento específico del\
    \ sistema instalado, del plan de protección y del producto [F5].\n\n---\n\n##\
    \ Concepto previo\n\nUna **maniobra** es un conjunto de acciones programadas en\
    \ función de los estados que toma el sistema, áreas, zonas o dispositivos. Los\
    \ cambios de estado se llaman **eventos** y a cada evento se le asocia una **acción**\
    \ (activación de sirenas, relés, etc.) [F4].\n\nLa estructura es siempre: **Entradas\
    \ (Eventos) → Lógica (Coincidencias) → Salidas (Acciones)** [F4].\n\n> ⚠️ La configuración\
    \ de maniobras gestiona **eventos** (cambios de estado), **no estados**. El evento\
    \ es el cambio de estado; si coincide con la condición establecida, provocará\
    \ la activación de las salidas [F2].\n\n---\n\n## PASO 1 — Acceder al menú y crear\
    \ la maniobra\n\n1. Desde el panel, navega a: **MENÚ principal → MANIOBRAS → +AÑADIR**\
    \ [F4].\n2. Pulsa el botón **AÑADIR** para crear una nueva maniobra [F1].\n3.\
    \ Se abre la **pantalla de edición de la maniobra**. La barra de navegación permite\
    \ ir de una maniobra a otra. El contador muestra el número de maniobra en el que\
    \ te encuentras [F1].\n\n---\n\n## PASO 2 — Definir la lógica de coincidencias\n\
    \nEn el campo **COINCIDENCIAS** indica cuántos eventos deben cumplirse simultáneamente\
    \ para que la maniobra sea verdadera [F1]:\n\n- **Coincidencias = 1** → Comportamiento\
    \ **OR**: cualquiera de los eventos activa la salida [F1][F7].\n- **Coincidencias\
    \ = 2** (con 2 eventos) → Comportamiento **AND**: todos los eventos deben cumplirse\
    \ [F1][F7].\n- **Coincidencias = N de M** → Se deben cumplir N eventos cualesquiera\
    \ de los M configurados [F1].\n\n---\n\n## PASO 3 — Añadir eventos de entrada\n\
    \n1. Pulsa **AÑADIR** en el margen inferior de la pantalla principal [F2].\n2.\
    \ En la pantalla emergente, selecciona **EVENTO** [F2].\n3. Se mostrará una nueva\
    \ pantalla donde escoges entre [F2]:\n   - **ENTIDAD**: cualquier elemento de\
    \ la jerarquía del sistema (local o en red): instalación, panel, lazo, área, zona,\
    \ dispositivo, grupo o modo virtual [F2].\n   - **CONDICIÓN TEMPORAL**: establece\
    \ un periodo de tiempo para el que la ecuación de entrada sea verdadera [F2].\n\
    \n4. Si seleccionas **ENTIDAD**, accedes a la pantalla **EVENTO DE LA ENTIDAD**,\
    \ donde configuras [F2][F5]:\n   - **Origen:** Local (central actual) o Red (cualquier\
    \ central del sistema en red) [F5].\n   - **Condición:** Alarma, Avería o Técnico\
    \ [F5].\n   - **Tipo:** Todos, Pulsador, Detector o Entradas [F5].\n   - **Estado\
    \ lógico:** Normal o **Negado** (si seleccionas Negado con condición Alarma, la\
    \ condición será válida si **no** hay alarma) [F5].\n   - **Repeticiones:** Valor\
    \ entero hasta **9999**; el evento debe repetirse ese número de veces en la entidad\
    \ para que la entrada sea válida [F2][F5].\n\n5. Puedes añadir tantos eventos\
    \ de entrada como necesites [F6].\n\n> \U0001F4CC **Nota:** Desde la versión **1.1.1**\
    \ es posible seleccionar un elemento de **salida** como condición de entrada.\
    \ En ese caso, será el cambio a condición de avería el que hará verdadera la condición\
    \ entrante. Para ello, desmarca la casilla **\"Sólo dispositivos de entrada\"\
    ** [F6].\n\n---\n\n## PASO 4 — Añadir acciones de salida\n\n1. Pulsa de nuevo\
    \ **AÑADIR** en el margen inferior de la pantalla principal [F3].\n2. En la pantalla\
    \ emergente, selecciona **ACCIÓN** [F3].\n3. Se muestran los campos de configuración\
    \ de la acción [F3][F5][F8]:\n\n   **Retraso:**\n   - Tiempo configurable entre\
    \ **0 y 600 segundos** antes de iniciar la acción [F3][F5].\n   - El retardo se\
    \ inicia a partir del momento en que la condición de entrada es verdadera [F5].\n\
    \n   **Entidad de destino** (siempre relativa al sistema local) [F3]:\n   - Panel,\
    \ lazo, área, zona, dispositivo, grupo o modo virtual.\n\n   **Tipo de acción**\
    \ [F8]:\n   - **Activar** las salidas.\n   - **Desactivar** las salidas.\n   -\
    \ **Habilitar** la entidad.\n   - **Deshabilitar** la entidad.\n   - **Test**:\
    \ pone en modo test la entidad.\n   - **Reiniciar** la entidad.\n   - **Pulso**:\
    \ activa las salidas con anchura de pulso configurable entre **0 y 600 segundos**\
    \ (10 s por defecto) [F8].\n   - **Configuración**: permite realizar la cancelación\
    \ de retardos [F8].\n\n   **Tipo de elemento** [F8]:\n   - **Todos**: todas las\
    \ salidas de la entidad.\n   - **Sirenas**: activa únicamente las sirenas.\n \
    \  - **Relés**: activa únicamente los relés.\n   - **Sirena discontinua**: activa\
    \ en forma discontinua las sirenas.\n   - **Sirena PCB1**: activa la sirena 1\
    \ de la central.\n   - **Sirena PCB2**: activa la sirena 2 de la central.\n\n\
    \   > Las opciones disponibles dependen de la entidad seleccionada [F8].\n\n4.\
    \ Pulsa **GUARDAR** para actualizar la base de datos [F8].\n\n---\n\n## PASO 5\
    \ — Verificar la maniobra creada\n\nUna vez guardada, la central devuelve al listado\
    \ de maniobras donde puedes verificar el resumen con [F9][F10]:\n- **ID** de maniobra.\n\
    - **Coincidencias** configuradas.\n- Resumen de **Eventos** y **Acciones**.\n\n\
    **Ejemplo de maniobra AND (2 barreras)** [F10]:\n- ID 7 | Coincidencias: **2**\
    \ | Eventos: Alarma en dispositivo Barrera 2 + Alarma en dispositivo Barrera 1\
    \ | Acción: Activar Panel 1.\n\n---\n\n## Límites a tener en cuenta\n\n- El número\
    \ máximo de maniobras entre eventos y acciones salientes es de **100.000** [F2].\n\
    \n---\n\n## Herramientas adicionales del módulo de maniobras\n\nDesde el menú\
    \ de MANIOBRAS también tienes acceso a [F4]:\n- **Grupos**: asociaciones de elementos\
    \ (áreas, zonas, dispositivos) para facilitar la creación de reglas.\n- **Módulos\
    \ virtuales**: permiten crear bucles interdependientes; un conjunto de entradas\
    \ determina el estado del módulo virtual, que a su vez puede actuar como entrada\
    \ de otra maniobra [F4].\n- **Estado VM**: visualización y activación de módulos\
    \ virtuales desde la pantalla principal [F4].\n\n---\n\n**Fuentes:**\n- CAD-250\
    \ Manual de Configuración MC-380-es-2026-c (rev. c, 2026-04-23)\n- CAD-250 Manual\
    \ de Software de Configuración MS-416-es-2026-b (rev. b)\n\n---\n\nTambién puedo\
    \ ayudarte con: **configuración de Grupos**, **creación de Módulos Virtuales**\
    \ o **ejemplos prácticos de maniobras** (AND de barreras, evacuación por módulo\
    \ virtual, etc.) en la CAD-250.\n\n---\n\U0001F4D6 **Información adicional del\
    \ manual:**\n- \"Screenshot 1: Shows the main interface with \"Panel 12 08:08\
    \ - viernes, 19 de abril de 2019\" at top, displaying \"Maniobra 0001\" with \"\
    Borrar maniobra\" button and \"MANIOBRAS\" section. Left sidebar shows menu items:\
    \ LAZO, SECTORIZACION, MANIOBRAS, LOGS, RED, AJUSTES, INSTALACION. The main area\
    \ shows \"Coincidencias: Eventos\" and \"Acciones\" tabs with a hand cursor pointing\
    \ to an add button.\n\nScreenshot 2: Shows a popup dialog titled \"Seleccione\
    \ Eve\" with two options: \"EVENTO\" and \"ACCION\"\n\nScreenshot 3: Shows \"\
    Seleccione tipo de evento\" dialog with options for \"ENTIDAD\" and \"CONDICION\
    \ TEMPORAL\", with a \"CERRAR\" button and \"Evento de entidad\" label with \"\
    Repeticiones =? 3\" notation\n\nScreenshot 4: Shows a diagram with numbered nodes\
    \ (1, 2, 3) connected in sequence, with a counter showing \"Contador 0\" and \"\
    Entidad\" field with \"una entidad\" text, and \"Repeticiones =? 3\" label with\
