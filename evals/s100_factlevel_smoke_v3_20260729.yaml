- qid: hp013
  question: ¿Cómo se cambia la batería tampón de la Detnov ADW535 sin perder configuración?
  answer: 'El procedimiento específico para cambiar la batería de litio del ADW535
    sin perder configuración **no está documentado en los fragmentos disponibles**.


    Lo que sí puedo confirmar a partir de los fragmentos:


    **Sobre la batería de litio:**

    - La batería de litio está ubicada en el **Main Board LMB 35** [F2][F3].

    - En la primera puesta en funcionamiento, se indica que "justo antes del primer
    encendido del ADW 535, debe retirarse la cinta aislante de la batería de litio
    (LMB 35)" [F5], lo que confirma que es una batería con conector extraíble, pero
    no se describe el procedimiento de sustitución posterior.


    **Sobre la conservación de la configuración:**

    - Los parámetros específicos del sistema se almacenan en una **EEPROM** [F11],
    lo que es relevante para entender dónde reside la configuración, pero el manual
    no especifica si la batería es necesaria para mantener esa memoria durante el
    cambio.

    - El **reset de hardware** (interrupción de tensión de alimentación) mantiene
    los parámetros programados [F6].

    - La configuración también puede guardarse en las posiciones de conmutador **X01
    a X03** [F1].


    **Advertencia importante:**

    El manual indica que los trabajos de mantenimiento en el ADW 535 **únicamente
    podrá llevarlos a cabo el personal autorizado y que haya sido formado por el fabricante**
    [F4].


    ---


    Para el procedimiento exacto de sustitución de la batería, consulta directamente
    el manual completo **ADW535_TD_T140358es_e** (capítulo 9 de mantenimiento) o contacta
    con el soporte técnico de Securiton/Detnov, ya que los fragmentos disponibles
    no cubren ese procedimiento.


    Fuente: ADW535_TD_T140358es_e (sin revisión registrada)


    ---

    ⚠️ **Información adicional del manual:**

    - "Por ello, cuando se realicen trabajos de mantenimiento en el ADW 535, es imprescindible
    desconectar previamente los controles de incendios y las alertas remotas de los
    sistemas de orden superior (CDI)." [F6]

    - "Para evitar que los controles de incendios, las alertas remotas y las zonas
    de extinción se disparen al llevar a cabo los trabajos de mantenimiento, es **imprescindible**
    bloquearlos o desconectarlos previamente." [F4]'
