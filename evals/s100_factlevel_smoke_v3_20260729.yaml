- qid: hp011
  question: En la Morley RP1r, después de descargar la extinción el sistema no vuelve
    a estado normal tras resetear. ¿Qué comprobar?
  answer: '# RP1r-Supra: Sistema no vuelve a estado normal tras resetear después de
    extinción


    Hay varias causas posibles que impiden el restablecimiento tras el rearme. Comprueba
    en este orden:


    ---


    ## 1. Rearme inhibido por parámetro r.i (causa más probable)


    El parámetro **r.i** puede estar configurado para inhibir el rearme durante un
    intervalo de tiempo tras la extinción [F13]:


    - **- -** → Rearme inhibido hasta finalizar extinción o cuando se agota el tiempo
    configurado en **t.A**

    - **00** → Rearme permitido en cualquier momento *(valor por defecto)*

    - **De 01 a 30** → Rearme inhibido durante el intervalo definido (en minutos)


    **Acción:** Accede al modo de programación y verifica el valor del parámetro **r.i**.
    Si está configurado con un valor de 01 a 30, la central no permitirá el rearme
    hasta que transcurra ese tiempo [F13].


    ---


    ## 2. Entrada ABORT activada o en avería


    La entrada **ABORT (bloque D)** es la única que **siempre requiere rearme manual**
    y además **enclavada** [F1][F3]. Si el pulsador de paro está accionado o hay avería
    en ese circuito:


    - LED "Avería en paro": **intermitente**

    - LED "Paro": **fijo**


    El manual indica que la entrada ABORT es enclavada: una vez activada, **requiere
    rearme manual de la central para habilitar de nuevo el proceso de extinción**
    [F5].


    **Acción:** Verifica físicamente que el pulsador ABORT no esté accionado y que
    el circuito tenga correctamente instalado el resistor serie **2K2** y el condensador
    **EOL de 47μF (≥35V)** — o alternativamente la resistencia EOL **6K8** [F5].


    ---


    ## 3. Averías enclavadas en otros circuitos supervisados


    Por defecto, **todas las averías son enclavadas y requieren rearme manual** [F1].
    Si algún circuito supervisado presenta avería activa (zonas, sirenas, circuitos
    de extinción, etc.), el sistema no volverá a estado normal aunque se pulse rearme
    si la condición de avería persiste.


    **Acción:** Revisa los LEDs del panel e identifica qué circuito está en avería
    según la tabla [F3]:


    - **Circuito extinción 1/2** (bloques 1/2): LED avería circuito extinción intermitente

    - **Sirenas 1/2** (bloques 5/6): LED sirenas fallo/anuladas intermitente

    - **Zonas 1/2/3** (bloques E/F/G): LED avería zona correspondiente intermitente

    - **Extinción manual** (bloque A): LED avería disparo manual **fijo**


    ---


    ## 4. Avería en tarjeta VSN-4REL (si aplica)


    Si el display muestra **"Rl"** o **"Avería MOD. Relés I2C"** con LED de avería
    general y fallo de sistema intermitente, hay un problema con la tarjeta **VSN-4REL**
    [F4]:


    - Verifica que esté correctamente conectada en **MOD AUX**

    - Si está conectada y sigue el fallo: puede estar averiada → reemplazar

    - Si no hay tarjeta instalada pero el error persiste: la tarjeta puede estar configurada
    por error → desprogramar según el procedimiento del documento [F4]


    ---


    ## Procedimiento de rearme correcto


    Para rearmar la central [F1][F12]:

    1. Accede con **nivel 2** de acceso

    2. Pulsa la tecla **"Rearme"**

    3. Esta acción reinicia la central y restablece todas las entradas enclavadas


    > ⚠️ Si el parámetro **r.i** tiene un valor de inhibición activo, el rearme no
    será posible hasta que transcurra el tiempo configurado [F13].


    ---


    **Fuentes:**

    - HLSI-MN-103_RP1r-Supra_lr (rev. v.07, 2018-05-01)

    - HLSI-MN-103I_RP1r-Supra_lr (sin revisión registrada)

    - HLSI-MA-103_GuiaRapida_RP1r-Supra_ES_lr (sin revisión registrada)

    - RP1R-Supra_VSN-RP1R-PLUS2-Averia-Rl_y_Fallo-de-sistema-intermitente (sin revisión
    registrada)'
