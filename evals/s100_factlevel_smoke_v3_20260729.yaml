- qid: hp014
  question: ¿Cómo se conecta un módulo de aislamiento de línea en un lazo ID2000?
  answer: "## Conexión del módulo de aislamiento de línea en lazo ID2000\n\nLos fragmentos\
    \ del manual no incluyen el diagrama de conexionado del aislador con los valores\
    \ de terminal pin a pin (el esquema aparece como figura en el manual pero no es\
    \ legible en los fragmentos recuperados). Sin embargo, sí hay información textual\
    \ relevante que te detallo a continuación.\n\n---\n\n### Requisitos de instalación\
    \ (reglas de diseño)\n\n- **Máximo 25 equipos de lazo entre aisladores** en la\
    \ central ID2000 [F3][F5].\n- Si se utilizan **aisladores tipo FET**, el límite\
    \ baja a **20 equipos entre aisladores** [F3][F5].\n- Este requisito es obligatorio\
    \ para cumplir la norma **EN54-2: 12.5.2** [F5].\n- Los aisladores deben instalarse\
    \ en **todos los lazos analógicos**, incluyendo los que tengan detectores de zona\
    \ convencional y/o pulsadores [F5].\n\n---\n\n### Terminales del aislador\n\n\
    El fragmento menciona que el aislador tiene **terminales 1, 2, 3 y 4** [F3]. El\
    \ procedimiento de comprobación del lazo indica:\n\n> \"Desconecte los aisladores\
    \ del lazo temporalmente **cortocircuitando los terminales 2 y 4** de cada aislador.\"\
    \ [F3]\n\nEsto confirma que los terminales 2 y 4 son los que corresponden a un\
    \ lado del lazo (el que se puentea para las pruebas), pero el manual no describe\
    \ en texto el esquema completo de conexionado de los 4 terminales. Para la asignación\
    \ exacta de cada terminal, **consulta el diagrama de la página 41 del manual MI-DT-180**\
    \ (figura de conexiones típicas de equipos direccionables analógicos) [F3].\n\n\
    ---\n\n### Procedimiento de puesta en marcha con aisladores\n\n1. **Antes de conectar\
    \ el cableado al panel**: realiza las comprobaciones del lazo con los aisladores\
    \ **temporalmente cortocircuitados** (puentear terminales 2 y 4 de cada aislador)\
    \ [F3].\n   - ⚠️ El cableado del lazo **debe estar desconectado del panel** durante\
    \ este procedimiento [F3].\n2. Comprueba la resistencia final de línea. Debe ser\
    \ inferior a [F3]:\n   - **14,5 Ω** (placa base y LIB, con detección de dirección\
    \ duplicada)\n   - **28,5 Ω** (placa base y LIB, sin detección de dirección duplicada)\n\
    \   - **18,5 Ω** (placa base y LIB, con detección de dirección duplicada — segunda\
    \ variante)\n   - **35,5 Ω** (placa base y LIB, sin detección de dirección duplicada\
    \ — segunda variante)\n3. Una vez verificado el cableado, **retira las conexiones\
    \ temporales** de los aisladores (quita los puentes de los terminales 2 y 4) [F1].\n\
    4. Conecta el cableado del lazo al panel respetando la polaridad: **extremos A\
    \ y B en sus terminales correspondientes** [F1].\n\n---\n\n### Datos adicionales\
    \ del lazo\n\n- Resistencia máxima del lazo: **no debe superar los 35 Ω** [F11].\n\
    - Capacidad del cable: **inferior a 0,5 µF** [F11].\n- Longitud máxima del lazo:\
    \ **2000 metros** con cable de **1,5 mm² de sección o superior** [F3][F11].\n\
    - La pantalla del cable apantallado **solo debe conectarse a tierra en el panel**\
    \ [F2].\n- Los terminales aceptan cables de **0,5 mm² a 2,5 mm²** [F12].\n\n---\n\
    \n⚠️ Para el esquema de conexionado pin a pin del aislador, consulta directamente\
    \ la **figura de la página 41 del manual MI-DT-180**, que muestra las conexiones\
    \ típicas de equipos direccionables analógicos al lazo [F3].\n\n---\n\nFuente:\
    \ Panel ID2000 - Manual de instalación y puesta en marcha, MIDT180 (rev. MI-DT-180,\
    \ 2003-03-31)\n\n---\n⚠️ **Información adicional del manual:**\n- \"> ⚠️ **¡NUNCA\
    \ conecte las baterías antes que la fuente de alimentación!**\" [F1]\n- \"**1**\
    \ Vuelva a conectar la alimentación principal - NUNCA conecte las baterías antes\
    \ que la alimentación principal.\" [F1]\n\n---\n\U0001F4D6 **Obligaciones de evidencia\
    \ del manual:**\n- \"Para cumplir con los requisitos de EN54-2, los aisladores\
    \ se deben instalar entre un máximo de 32 equipos de lazo. **En la central ID2000,\
    \ no se debe colocar más de 25 equipos de lazo entre aisladores (20 si se utilizan\
    \ aisladores tipo FET).**\" (MIDT180, p. 20) [F5]\n- \"La resistencia máxima del\
    \ lazo no debe superar los 35 ohmios. Puede comprobarlo uniendo los extremos B+\
    \ y B- y midiendo a través de los extremos A+ y A-.\" (MIDT180, p. 17) [F11]"
