- qid: hp017
  question: ¿Cómo se programa el retardo de salida de alarma principal en la Notifier
    PEARL?
  answer: 'El retardo de salida de alarma principal en la PEARL **se programa mediante
    las reglas de causa-efecto**, no como un parámetro único global. Aquí tienes el
    proceso completo:


    ---


    ## Dónde se configura


    No puedo confirmar de forma segura el número de menú de Causa y Efecto con los
    fragmentos servidos. Confirma el manual y la revisión exactos antes de usar un
    número de menú.


    > **Nota importante:** Se recomienda usar el programa de configuración por ordenador
    como método principal. El menú de la central solo debe usarse para modificaciones
    menores [F12].


    ---


    ## Tipos de retardo disponibles


    Cada regla de causa-efecto puede tener asignado **uno de seis tipos de retardo
    de salida** [F1]. Los tipos disponibles son [F2]:


    - **Fijo** — Sin posibilidad de silenciar ni ampliar durante el retardo; el tiempo
    restante no se muestra en LCD.

    - **Estándar** — Silenciable con SILENCIAR SIRENAS; anulable en nivel 2; tiempo
    visible en pantalla; FIN RETARDO disponible.

    - **No Silenc.** — No silenciable con SILENCIAR SIRENAS; sí anulable en nivel
    2; tiempo visible; FIN RETARDO disponible.

    - **Est. Ext.** — Como Estándar, más: se detiene si se pulsa AMPLIAR RETARDO.

    - **RetExtStd** — Como Estándar, más: el temporizador comienza en RETARDO AMPLIADO.

    - **No Sil. Ext** — No silenciable, pero se detiene con AMPLIAR RETARDO; anulable
    en nivel 2; tiempo visible.

    - **SinRetExt** — No silenciable; el temporizador comienza en RETARDO AMPLIADO;
    anulable en nivel 2.


    ---


    ## Comportamiento durante el retardo activo


    Cuando hay un retardo activo, el **LED de RETARDO ACTIVO** se enciende [F3]. Las
    acciones disponibles según el tipo configurado son [F2]:


    - **SILENCIAR SIRENAS** → detiene la salida solo en tipos: Estándar, Est. Ext.,
    RetExtStd.

    - **AMPLIAR RETARDO** → detiene/inicia segundo temporizador según el tipo [F4].

    - **FIN RETARDO** → termina cualquier retardo activo (nivel de acceso 1) [F4].

    - **Anular retardos** (menú nivel 2, opción **«5: Retardo Activación Salidas»**)
    → anula/habilita globalmente todos los retardos configurados [F3].


    ---


    ## Opción adicional: habilitar/deshabilitar la tecla AMPLIAR RETARDO


    Desde **«Editar Parámetros de la Central»**, parámetro **«10: Extend Delay Button»**,
    puede habilitarse o deshabilitarse el pulsador AMPLIAR RETARDO, ya que esta función
    no se requiere en algunos mercados [F5].


    ---


    ## Retardo de alarma por sensor individual


    Adicionalmente, cada sensor del lazo tiene un parámetro de **«Retardo de alarma»**
    editable de forma individual [F7], independiente del retardo de salida de la regla
    causa-efecto.


    ---


    > ⚠️ **Aviso:** Prueba rigurosamente todas las reglas durante la puesta en marcha
    para verificar que no haya conflictos lógicos [F12].


    ---


    **Fuentes:**

    - Manual de configuración de la central PEARL (rev. 997-671-005-3)

    - Manual de funcionamiento de la central PEARL 997-670-005-3 (sin revisión registrada)


    ---

    ⚠️ **Información adicional del manual:**

    - "**Es de vital importancia probar rigurosamente todas las reglas durante la
    puesta en marcha del sistema para verificar que no haya conflictos lógicos entre
    ellas.**" [F12]

    - "**Al programar reglas de causa-efecto evite las lógicas contradictorias.**"
    [F12]

    - "- Números de referencia de la zona de red

    - Tipo de equipo

    - Entorno del número de referencia de zona (opcional)

    - Número de central (Central LOCAL; 1-125: otras centrales de red). Esta columna
    no siempre se muestra, ya que depende del tipo de numeración de zona seleccionada.

    - Número de zonas (hasta 255 zonas locales o 8192 zonas de red)

    - Número de células (hasta 255)

    - Prioridad de interrogación (operación solo protocolo CLIP: limitada a 30 equipos)

    - Acción de parpadeo en equipo interrogado. Elección del color solo para equipos
    Opal.

    - Opción de tipo de equipo (VIEW, Optiplex y SMART)

    - Ajuste del nivel de alarma

    - Ajuste del nivel de alarma horaria

    - Ajuste del nivel de prealarma

    - Selección de programación horaria (cambio de sensibilidad de sensor)

    - Grupo AWACS (50 grupos con todos los sensores CLIP salvo HEAT)

    - Retardo de alarma

    - Ajuste no silenciable para la función de LED remoto (solo equipos Opal); respuesta
    a la orden SILENCIAR SIRENAS.

    - Operación solo modo térmico (L6) (solo SMART y Optiplex)

    - Número de aplicación (solo equipos SMART 4)

    - Ajuste de la función LED remota (solo equipos Opal): las opciones son: Seguir
    el equipo (predeterminada) o Controlada por las reglas de causa-efecto.

    - Retardo de confirmación de coincidencia de detector; puede ajustarse hasta 240
    s (4 min). Puede usarse con dependencia tipo B." [F7]


    ---

    📋 **Obligaciones de evidencia del manual:**

    - Nota: la fuente es inconsistente: "Se puede asignar uno de seis tipos de retardo
    de salida a una regla, como se explica a continuación." (997-671-005-3_Configuration_ES,
    p. 44) [F1] declara 6 tipos y la enumeración servida lista 8 (997-671-005-3_Configuration_ES,
    p. 44) [F1].

    - Nota: la fuente es inconsistente: "Sección 4 - 4" (997-671-005-3_Configuration_ES,
    p. 21) [F6] declara 4 Equipos y la enumeración servida lista 20 (997-671-005-3_Configuration_ES,
    p. 20) [F7].'
