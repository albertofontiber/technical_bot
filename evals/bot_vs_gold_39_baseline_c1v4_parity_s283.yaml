    \ resistencia de línea es inferior a [F3]:\n   - **14,5 Ω** (placa base y LIB,\
    \ con detección de dirección duplicada) [F3]\n   - **28,5 Ω** (placa base y LIB,\
    \ sin detección de dirección duplicada) [F3]\n   - **18,5 Ω** (segunda variante,\
    \ con detección de dirección duplicada) [F3]\n   - **35,5 Ω** (segunda variante,\
    \ sin detección de dirección duplicada) [F3]\n4. Comprueba que no hay cortocircuito\
    \ entre la pantalla del cable y el positivo (+) o negativo (-) [F2].\n5. La pantalla\
    \ **solo debe conectarse a tierra en el panel** [F2].\n\n> ⚠️ **NUNCA uses multímetro\
    \ de alta tensión (tipo \"Megger\") en el lazo** [F4].\n\n---\n\n### Paso 2 —\
    \ Conexión física del aislador en el lazo\n\nEl aislador se conecta **en serie\
