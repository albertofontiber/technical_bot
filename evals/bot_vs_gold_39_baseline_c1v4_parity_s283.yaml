    \ el equipo» o «Controlada por reglas causa-efecto»\n- Retardo de confirmación\
    \ de coincidencia de detector: hasta **240 s (4 min)**, usable con dependencia\
    \ tipo B\n\n**Para módulos**, los parámetros editables son [F9]:\n- Números de\
    \ referencia de zona de red\n- Tipo de equipo\n- Entorno del número de referencia\
    \ de zona (opcional)\n- Número de central (LOCAL; 1-64 para otras centrales de\
    \ red)\n- Número de zonas (hasta **255 zonas locales** o **8192 zonas de red**)\n\
    - Número de células (hasta **255**)\n- Prioridad de interrogación (solo CLIP:\
    \ limitada a **30 equipos**)\n- Acción de parpadeo en equipo interrogado (color\
    \ solo para Opal)\n- Asignar alimentación de potenciador de lazo (solo para alarma)\n\
    - Función de acción de subdirecciones de módulo de entrada o salida\n- Ajuste\
