  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: "# CAD-150-8: Alta de detector nuevo en lazo y prueba funcional\n\n\
    ## PARTE 1 — Dar de alta un detector nuevo en el lazo\n\nEl proceso para incorporar\
    \ un nuevo detector al lazo se realiza mediante la **autobúsqueda del lazo** [F1]:\n\
    \n1. Accede al **menú BUCLE** [F1].\n2. Realiza una **autobúsqueda del lazo**\
    \ correspondiente. El sistema escaneará el lazo y mostrará todos los elementos\
    \ que detecta [F1].\n3. Verifica que los elementos encontrados coinciden con los\
    \ planos de la instalación [F1].\n4. Accede al **menú ELEMENTOS** para asignar\
    \ al nuevo detector:\n   - Un **nombre/texto** identificativo [F1]\n   - La **zona**\
    \ a la que pertenece [F1]\n5. Si es necesario, accede al **menú ZONA** para crear\
    \ o asignar la zona correspondiente al nuevo detector [F1].\n6. Si el detector\
    \ debe participar en alguna maniobra, configúrala desde el **menú MANIOBRAS**\
    \ [F1].\n\n> **Nota:** La configuración puede realizarse desde el teclado de la\
    \ central, aunque se recomienda usar el **software de configuración** para mayor\
    \ rapidez [F6].\n\n---\n\n## PARTE 2 — Verificar el estado del detector dado de\
    \ alta\n\nAntes de hacer la prueba funcional, comprueba que el detector está correctamente\
    \ registrado:\n\n1. Accede al **menú ELEMENTO → VER** [F2].\n2. Selecciona el\
    \ **bucle** y la **dirección (DIR)** del nuevo detector con los cursores [F2].\n\
    3. Verifica los campos:\n   - **TIPO**: debe mostrar el tipo correcto (óptico,\
    \ térmico, etc.) [F2]\n   - **MODO**: debe aparecer como **conectado** [F2]\n\
    \   - **VA**: valor analógico del detector en reposo [F2]\n   - **ZONA**: zona\
    \ asignada [F2]\n   - **TEXTO**: nombre asignado [F2]\n\n---\n\n## PARTE 3 — Prueba\
    \ funcional del detector\n\nUsa el **modo PRUEBA de zona**, que permite probar\
    \ detectores **sin necesidad de rearmar la central** [F3]:\n\n1. Accede al **menú\
    \ ZONA → PRUEBA** [F3].\n2. Introduce el **rango de zonas** que incluye la zona\
    \ del nuevo detector [F3]:\n   ```\n   PRUEBA ZONA\n   RANGO  : [000] a [250]\n\
    \   ACTIVAR SIRENAS: [SI/NO]\n   ```\n3. Selecciona si deseas **activar las sirenas**\
    \ durante la prueba [F3]:\n   - Si **SÍ**: las sirenas se activarán unos segundos\
    \ tras la alarma del detector y se silenciarán automáticamente. Los retardos de\
    \ sirena quedan **anulados** en modo prueba [F3].\n   - Si **NO**: la alarma se\
    \ registra sin activar sirenas.\n4. Pulsa **Aceptar** [F3].\n5. Activa el detector\
    \ (aerosol, calor, etc.) y verifica que la central registra la alarma.\n6. **Para\
    \ salir del modo prueba**: conecta la zona desde el menú ZONA → CONECTAR [F3].\n\
    \n> ⚠️ **Importante:** Si transcurridos **20 minutos** desde la activación del\
    \ modo prueba el sistema no detecta ningún disparo de alarma, el equipo **vuelve\
    \ automáticamente al estado normal**, cancelando el modo prueba [F3].\n\n---\n\
    \n## PARTE 4 — Verificación final del sistema\n\nTras la prueba del detector,\
    \ verifica [F9]:\n- Que al provocar una alarma se activa el **relé de alarma**\
    \ [F9].\n- Que se activan las **salidas de sirena** una vez transcurrido el tiempo\
    \ de retardo programado [F9].\n\n---\n\n**Fuentes:**\n- `55315013 Manual Centrales\
    \ Analógicas CAD-150-8 Instalación ES FR GB IT` (sin revisión registrada)\n- `55315008\
    \ Manual Centrales Analógicas CAD-150-8 Usuario ES FR GB IT` (sin revisión registrada)\n\
    \n---\n\nTambién puedo ayudarte con: **configuración de maniobras para el nuevo\
    \ detector**, **desconexión temporal de un elemento del lazo** o **mantenimiento\
    \ periódico según EN54** de la CAD-150-8.\n\n---\n⚠️ **Información adicional del\
    \ manual:**\n- \"En caso de necesidad, se puede encender el equipo solo con las\
    \ baterías conectadas, pero es imprescindible pulsar sobre el pulsador BAT para\
    \ arrancar el equipo.\" [F6]\n\n---\n\U0001F4D6 **Obligaciones de evidencia del\
    \ manual:**\n- \"» Poner el equipo en estado de prueba, y verificar que todos\
    \ los detectores y pulsadores funcionan de acuerdo con las especificaciones del\
    \ fabricante.\" (55315008-Manual-Centrales-Analogicas-CAD-150-8-Usuario-ES-FR-GB-IT,\
    \ p. 37) [F10]"
