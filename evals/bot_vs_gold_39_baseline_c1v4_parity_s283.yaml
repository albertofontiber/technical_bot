  bot_answer: "# Programación de ecuación CBE en AM-8200 para activar una salida\n\
    \n## Concepto previo\n\nUna **CBE (Control By Event)** es la ecuación que define\
    \ qué condiciones deben cumplirse para que un punto, zona o grupo se active [F1].\
    \ Para un **módulo de salida**, la CBE contiene las direcciones de los objetos\
    \ (sensores, módulos de entrada o grupos) que lo activarán [F1].\n\n---\n\n##\
    \ Pasos para programar la CBE de un módulo de salida\n\n1. **Accede al menú de\
    \ programación del punto de salida:**\n   Navega a `MENU PROGRAMMAZIONE \\ Punti\
    \ \\ Módulos` [F6]\n\n2. **Selecciona la pestaña \"Programación\":**\n   Contiene\
    \ los campos **Zona** y **CBE** [F3] [F4]\n\n3. **Selecciona el campo CBE:**\n\
    \   Usa las teclas flecha **▲▼** para posicionarte en el parámetro CBE y pulsa\
    \ la tecla de confirmación **☑** para editarlo [F3]\n\n4. **Introduce la ecuación\
    \ CBE** usando el teclado alfanumérico [F3]:\n   - La longitud máxima es de **64\
    \ caracteres** [F3]\n   - **No insertes espacios entre caracteres** (salvo donde\
    \ el operador DEL lo requiera explícitamente) [F1]\n   - Confirma con la tecla\
    \ **Enter** [F3]\n\n5. **Verifica la sintaxis** antes de confirmar: si hay errores,\
    \ la ecuación será rechazada por la central [F1]\n\n---\n\n## Operadores disponibles\
    \ y ejemplos prácticos\n\n### OR — Al menos un operando activo [F2]\n```\nOR(G9\
    \ G15 G23)\n```\nSi **cualquiera** de los grupos G9, G15 o G23 está en alarma\
    \ → la salida se activa.\n> El operador OR puede omitirse: `(G9 G15 G23)` es equivalente\
    \ [F2]\n\n---\n\n### AND — Todos los operandos activos [F2]\n```\nAND(G9 G15 G23)\n\
    ```\nSolo si **los tres** grupos están en alarma simultáneamente → la salida se\
    \ activa.\n\n---\n\n### NOT — Niega el operando [F2]\n```\nNOT(G23)\n```\nLa salida\
    \ estará activa **hasta que** G23 entre en alarma; cuando G23 se activa, la salida\
    \ se desactiva.\n\n---\n\n### XGRP — Al menos dos elementos del grupo activos\
    \ [F7]\n```\nXGRP(G23)\n```\nSe activa cuando **al menos dos** dispositivos de\
    \ entrada programados en el grupo G23 están activos (doble coincidencia = SÍ),\
    \ o cuando un sensor térmico y uno óptico del mismo grupo están activos (doble\
    \ coincidencia = NO) [F7].\n> ⚠️ **No se permite** usar más de un grupo: `XGRP(G23\
    \ G24)` es **CBE no permitida** [F7]\n\n---\n\n### DEL — Retardo de activación\
    \ [F10]\n```\nDEL(00.30 01.30(G21))\n```\nTras **30 segundos** desde la activación\
    \ de G21, la salida se activa y permanece activa durante **1 minuto y 30 segundos**\
    \ [F10].\n\nConsideraciones clave del operador DEL [F10]:\n- Retardo máximo: **10\
    \ minutos**\n- Duración máxima: **10 minutos**\n- Solo puede haber **un operador\
    \ DEL por ecuación**\n- Si no se especifica duración, permanece activo hasta el\
    \ rearme\n\n---\n\n### PRE — Estado de pre-alarma de un sensor [F9]\n```\nOR(PRE(C1L1S2)\
    \ PRE(C2L1S10))\n```\nSi cualquiera de los dos sensores está en **pre-alarma**\
    \ → la salida se activa.\n\n---\n\n### FLT — Estado de avería [F8]\n```\nOR(FLT(C1L1S2)\
    \ PRE(C2L1S10))\n```\nSi el sensor L1S2 está en **avería** o el sensor L1S10 está\
    \ en **pre-alarma** → la salida se activa.\n\n---\n\n### TAC(SYS) — Silenciado\
    \ de central [F10]\n```\n(TAC(SYS))\n```\nCuando se ejecuta el comando de **silencio\
    \ sirena** en la central → el módulo de salida se activa.\n\n---\n\n## Reglas\
    \ sintácticas críticas [F1]\n\n- Si se usan **varios operadores**, el primer carácter\
    \ debe ser **(** y el último **)**.\n  Ejemplo: `(AND(G1 G2)OR(G3 G4))`\n- El\
    \ operador **NOT** y **XGRP** funcionan solo con **un operando** y se escriben\
    \ delante de él.\n- Para grupos directos: **no se permite** que los operandos\
    \ tengan índice menor que el grupo al que se asocia la CBE.\n  - ❌ `G33 = (G23\
    \ G24)` → no permitida\n  - ✅ `G21 = (G23 G24)` → permitida [F2]\n- Para grupos\
    \ inversos: **no se permite** que los operandos tengan índice mayor que el grupo\
    \ al que se asocia la CBE [F2].\n- Es posible programar **ecuación \"Ninguna\"\
    ** (campo CBE vacío): en ese caso, el módulo de salida no se activará salvo que\
    \ tenga un Tipo ID para señalizaciones generales [F1] [F2].\n\n---\n\n## Ejemplo\
    \ combinado\n\n```\n(OR(G9 G15)AND(G23 G24))\n```\nSe activa si: (G9 **o** G15\
    \ están en alarma) **y además** (G23 **y** G24 están en alarma) [F1].\n\n---\n\
    \n**Fuente:** AM-8200 Manual de programación — Doc. M-162.1-AM8200-ESP Rev A.3\
    \ — HONEYWELL LIFE SAFETY IBERIA\n\n---\n\nTambién puedo ayudarte con: **programación\
    \ de grupos software (Gxxx)**, **operador SDEL o TIM** (no desarrollados en los\
    \ fragmentos recuperados), o **configuración de zonas asociadas a los módulos\
    \ de salida**.\n\n---\n⚠️ **Información adicional del manual:**\n- \"Si, por el\
    \ contrario, el dispositivo en cuestión es un módulo de salida, esta salida no\
    \ se activará nunca, a no ser que se programe con software TIPO ID para señalizaciones\
    \ generales.\" [F2]\n- Nota: el manual también indica: \"Si **CUALQUIERA** de\
    \ los tres operandos de esta ecuación (G9 G15 G23) está en alarma, el módulo de\
    \ salida se activará, es decir:\" [F2] · \"- **SI** el grupo software 9 está en\
    \ alarma, o\n- **SI** el grupo software 15 está en alarma, o\n- **SI** el grupo\
    \ software 23 está en alarma\n- **ENTONCES** este módulo de salida se activará.\"\
    \ [F2]\n- \"**Zona** - número de zona asignada\n\n**CBE** - ecuación CBE del punto.\"\
    \ [F3]"
