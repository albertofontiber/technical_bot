  bot_answer: '## Test anual del detector VESDA-E VEP


    Antes de responder, necesito una aclaración rápida: los fragmentos recuperados
    corresponden a dos variantes del VESDA-E VEP:


    - **VEP-A10-P** [F1, F3, F5, F10]

    - **VEP-A00-P** [F2, F4, F6, F7, F8, F9, F11]


    El calendario de mantenimiento anual es **idéntico en ambas variantes** [F1][F2],
    así que la respuesta aplica a las dos.


    ---


    ### Tareas de mantenimiento anual (una vez al año)


    Según la **Tabla 7-1** de ambas guías de producto [F1][F2], las comprobaciones
    anuales son:


    - **Realizar una prueba de humos** para comprobar la integridad de la red de tubería

    - **Comprobar el flujo** de la red de tubería

    - **Limpiar los puntos de muestreo**

    - **Limpiar con agua la red de tubería**


    ---


    ### Antes de comenzar — Precauciones obligatorias


    [F1][F2] Antes de realizar cualquier mantenimiento o prueba:


    1. **Informe a la autoridad supervisora adecuada.**

    2. **Aísle todos los dispositivos** que dependan del detector antes de ponerlo
    en funcionamiento.

    3. Siga los **procedimientos del sitio para evitar falsas alarmas** en los servicios
    supervisados.


    > ⚠️ Cuando el detector está deshabilitado o en modo en espera, **no emitirá advertencias
    de fuego** [F1][F2].


    ---


    ### Procedimiento recomendado para la prueba de humos anual


    **Paso 1 — Poner el detector en modo en espera** (si se trabaja sobre la tubería
    o puntos de muestreo):


    - Desde **Xtralis VSC**: selecciona *"Go to Standby"* en el menú *"Device"* [F8].

    - El LED desactivado parpadeará y el aspirador se detendrá [F8].


    **Paso 2 — Realizar la prueba de humos:**


    - Introduce una muestra de humo en el **orificio de muestreo más alejado** [F3][F4].

    - Mide el **tiempo de transporte** hasta que el humo llega al detector [F3][F4].

    - Registra los resultados y compáralos con pruebas anteriores para detectar variaciones
    del sistema [F3][F4].


    > 📋 El manual indica que los detalles completos del procedimiento de prueba de
    humos están en la **VESDA-E Commissioning Guide** [F3][F4]. Consulta ese documento
    para el paso a paso detallado.


    **Paso 3 — Volver a activar el detector:**


    - Desde **Xtralis VSC**: selecciona *"End Standby"* en el menú *"Device"* [F8].


    ---


    ### Notas adicionales del manual [F1][F2]


    - El mantenimiento puede realizarlo el **instalador original, un distribuidor
    autorizado o el contratista de servicio**.

    - La frecuencia puede variar según **códigos y normas locales** y el entorno de
    instalación.

    - Las tareas anteriores son de **mantenimiento preventivo**.


    ---


    ### Recordatorio: otras frecuencias del calendario


    - **Cada 3 meses:** Fuente de alimentación y batería [F1][F2]

    - **Cada 6 meses:** Comprobar la red de tubería [F1][F2]

    - **Cada 2 años:** Sustitución del filtro [F1][F2]


    ---


    **Fuentes:**

    - `33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores` (sin revisión registrada)

    - `33976_13_VESDA-E_VEP-A00-P_Product_Guide_A4_Spanish_lores` (sin revisión registrada)


    ---


    También puedo ayudarte con: **procedimiento de sustitución del filtro bianual**,
    **uso de Xtralis VSC para prueba de relés** o **proceso de AutoLearn Flow** del
    VEP.


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "**Atención:** Pendant que le detecteur ou la zone est desactivee, aucun feu
    d''indication va etre emis par le detecteur." (33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores,
