  bot_answer: "# Notifier PEARL — Capacidad de lazo SLC, aisladores y alta/edición\
    \ de equipos\n\n---\n\n## 1. Capacidad máxima por lazo\n\n**Protocolo Opal:**\n\
    - Hasta **159 sensores + 159 módulos** por lazo [F1][F2]\n- Total: **318 equipos\
    \ por lazo analógico** [F1]\n\n**Protocolo CLIP:**\n- Hasta **99 sensores + 99\
    \ módulos** por lazo [F2][F5]\n\n**Protocolo mixto Opal + CLIP:**\n- El límite\
    \ de equipos CLIP en lazo mixto es de **40 equipos** [F5]\n- Si se supera ese\
    \ límite, la autoconfiguración continúa pero señala fallos [F5]\n\n**Límite global\
    \ del sistema (EN54-2):**\n- Máximo **512 sensores y/o pulsadores manuales** en\
    \ total entre AMBOS lazos [F1]\n- Carga máxima: **0,75 A por lazo** [F2]\n\n---\n\
    \n## 2. Requisitos de aisladores (EN54-2: 12.5.2)\n\n**Regla general EN54-2:**\
    \ máximo **32 equipos entre aisladores** [F1]\n\nPara la Pearl, los límites concretos\
    \ son:\n\n- **Equipos SIN aisladores internos** (incluidos CLIP y algunos Opal):\
    \ no más de **20 equipos entre aisladores** [F1][F10]\n- **Equipos CON aisladores\
    \ internos** (con base B501 AP): los lazos deben cumplir los requisitos de EN54-2\
    \ [F1]\n- **Nota adicional de F10**: no más de **25 equipos entre aisladores**\
    \ (20 si se usan aisladores FET) [F10]\n\n> ⚠️ Las bases con aisladores internos\
    \ requieren la base **B501 AP** (con conectores de cable de lazo de extremo positivo\
    \ adicionales). Con bases sin estos conectores, el aislador interno queda inutilizable\
    \ [F1].\n\n**Arranque del lazo:** para garantizar que los aisladores se cierren\
    \ al aplicar alimentación, la carga entre aisladores no debe superar **20 SU**\
    \ [F6]\n\n**Cargas SU de equipos CLIP relevantes:**\n- Detector por rayo LPB-700:\
    \ **6 SU** [F6]\n- Sirenas de lazo: **3 SU** [F6]\n- Módulo ZMX-1: **3 SU** [F6]\n\
    - Módulo MMX-10M/CMX10-RM: **10 SU** [F6]\n- El resto: **1 SU** [F6]\n\n**Cableado:**\n\
    - Resistencia máxima del lazo: consultar sección **6.4.2** del manual de instalación\
    \ [F12]\n- Capacitancia del cable: inferior a **0,5 µF** [F12]\n- Resistencia\
    \ por aislador: entre **0,1 y 0,13 ohms** cada uno [F12]\n\n---\n\n## 3. Alta\
    \ de equipos — Autoconfiguración\n\nLa forma recomendada de dar de alta equipos\
    \ es mediante la **función de autoconfiguración** desde la central [F3].\n\n**Pasos:**\n\
    \n1. Accede al menú de configuración (nivel de acceso requerido) [F3]\n2. Selecciona\
    \ **1: Autoconfiguración** [F3]\n3. Elige si aplica a **todos los lazos** o a\
    \ un **lazo específico** [F3]\n4. Selecciona el modo de autoconfiguración [F3]:\n\
    \   - **1: Todos Prot. OPAL/CLIP** → detecta duplicidades de dirección\n   - **2:\
    \ OPAL/CLIP (No detecta duplicidad)** → más rápido, sin comprobación de duplicados\n\
    \   - **3: Sólo con protocolo CLIP** → solo autoconfigura equipos CLIP aunque\
    \ haya Opal en el lazo\n5. Selecciona el modo de actualización [F5]:\n   - **1:\
    \ Permite Añadir/Borrar/Cambiar**\n   - **2: Sólo Añadir Nuevos Equipos**\n6.\
    \ El proceso se inicia automáticamente. Sensores y módulos (Opal y CLIP) se detectan\
    \ en la misma pasada [F3]\n7. Al finalizar, los resultados se muestran en pantalla\
    \ LCD por lazo. Usa las teclas **◄/►** para navegar entre lazos [F5]\n\n> \U0001F4DD\
    \ Si se autoconfigura un equipo Opal, por defecto será Opal. Si el número de equipos\
    \ CLIP supera 40, selecciona manualmente la opción **«Sólo con protocolo CLIP»**\
    \ [F5]\n\n> \U0001F4DD Los pulsadores CLIP se autoconfiguran como «MON» y **deben\
    \ cambiarse manualmente a tipo «cPUL»** [F9]\n\nLa configuración puede transferirse\
    \ a un ordenador portátil con el programa **ITS** para editarla y archivarla [F3].\n\
    \nLos equipos configurados pueden consultarse en cualquier momento desde **nivel\
    \ de acceso 2 → «Resumen de Equipos»** [F3].\n\n---\n\n## 4. Edición individual\
    \ de equipos\n\nDesde el menú de configuración se puede editar cada sensor o módulo\
    \ individualmente [F4].\n\n**Para sensores**, los parámetros editables son [F4]:\n\
    - Números de referencia de zona de red\n- Tipo de equipo\n- Entorno del número\
