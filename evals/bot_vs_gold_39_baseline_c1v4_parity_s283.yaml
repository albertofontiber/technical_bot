  diagnostico: Acierta los parámetros IS principales de entrada, el marcado ATEX y
    que debe alimentarse mediante barrera Zener o aislador galvánico con Uo/Io/Po
    dentro de 28V/93mA/660mW. Pero no indica claramente la alimentación nominal a
    24V dc ni la advertencia del uso en zona segura sin barrera y el límite interno
    por encima de 16V, por lo que queda incompleto frente a la referencia.
  bot_sources:
