  bot_answer: '# Niveles de alarma y prealarma en detectores — Central Morley DXc
    (España)


    ## Valores por defecto


    Para detectores con protocolo **Morley-IAS**, los valores por defecto son [F1]:


    - **Prealarma por defecto: 80%**

    - **Alarma por defecto: 100%**


    Esto se confirma también en los fragmentos del manual de configuración de la Serie
    Dimension [F6]:


    ```

    [Dir. 002 - OPT] Sensibilidad ( DIA )

    1:Fuego(100%) 2:Prealarm( 80%)    X:Cancel

    ```


    ## Máximo configurable


    - **Nivel máximo configurable (alarma): 108%** [F1]

    - El rango de ajuste es **80% a 108%** [F5][F6]


    > ⚠️ El panel no permite seleccionar niveles que impidan el reconocimiento de
    alarmas. El nivel de prealarma **no puede ser superior al de alarma** [F6].


    ## Nota sobre detectores Multicriterio (OTM) y Láser


    Para los detectores **OTM (óptico-térmicos multicriterio)** y **láser**, los niveles
    no se expresan en porcentaje sino en **niveles numéricos** (Niv1 a Niv6 para OTM,
    Niv1 a Niv9 para láser) [F2]. Los valores recomendados por defecto son:


    **Detector OTM:**

    - Prealarma recomendada: **Nivel 3** (\*P, valor analógico 72) [F2]

    - Alarma recomendada: **Nivel 4** (\*A, valor analógico 86) [F2]


    **Detector Láser (MI-LZR):**

    - Prealarma recomendada: **Nivel 4** (\*P, valor analógico 69) [F2]

    - Alarma recomendada: **Nivel 5** (\*A, valor analógico 76) [F2]


    ---


    También puedo ayudarte con: **procedimiento de ajuste de sensibilidad en el DXc**,
    **configuración de Modo Horario de sensibilidad** o **limpieza y mantenimiento
    de detectores ópticos**.


    **Fuentes:**

    - DXc_Manual variaciones de mercado, secciones 5.3.10.4 y 5.3.10.5.1 (sin revisión
    registrada) [F1]

    - DXc_Manual variaciones de mercado, sección 5.3.10.3 (sin revisión registrada)
    [F2]

    - MIE-MP-520rv04, secciones 7.3.9.4.3 y 7.3.9.4.5 (rev. 4) [F5][F6]


    ---

    📋 **Información adicional del manual:**

    - Nota: el manual también indica: "### 5.3.10.5.1 Información específica para
    protocolo Morley-IAS


    • El valor analógico debe ser un número normalizado entre 0% – 100%, independientemente
    del tipo de equipo. Para los detectores, el nivel de prealarma por defecto es
    el 80% y el nivel de alarma por defecto es el 100%.


    • El ajuste máximo para el nivel de alarma es el 108%." [F1]


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "el umbral de alarma de fuego depende del ajuste del nivel/modo y es diferente
    para cada nivel de alarma." (DXc_Manual variaciones de mercado, p. 5) [F2]'
