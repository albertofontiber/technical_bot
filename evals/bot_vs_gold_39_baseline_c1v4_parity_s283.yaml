  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  gold_estado: verificado
  conducta_esperada: answer
  conducta_bot: answer
  veredicto: PASS
  diagnostico: 'La respuesta cubre correctamente los puntos clave: número de salidas,
    polaridad, diodos, RFL 6k8/0,5 W, supervisión y límite de 1 A por circuito, con
    referencias al manual. Omite el detalle de que las RFL se suministran con el panel
    y la nota comparativa ZXAE/ZXEE, pero no afecta a la utilidad técnica principal.'
  bot_sources:
  - MIE-MI-530rv001
  - MIE-MP-530rv001
  coverage_status: appended
  coverage_appended_rows: 2
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: '## Conexionado de sirenas convencionales en salidas de sirena de la
    Morley ZXe


    ---


    ### Circuitos disponibles


    - **ZX2e**: 2 circuitos de sirenas supervisados (Sirena A y Sirena B) [F7]

    - **ZX5e**: 4 circuitos de sirenas supervisados (Sirenas A, B, C y D) [F7]

    - Consumo máximo por circuito: **1 A** [F7]


    ---


    ### Terminales físicos


    - **ZX2e**: bloque de terminales etiquetado **"AUX RELAY A+ A- B+ B- SOUNDERS
    / B+ B- A+ A-"** (ver Figura 13) [F2]

    - **ZX5e**: bloque de terminales **TB7**, etiquetado **"A- A+ B- B+ C- C+ D- D+"**
    (ver Figura 14) [F2]


    ---


    ### Requisitos de conexionado


    1. **Diodo integrado en cada sirena**: cada sirena convencional debe llevar un
    diodo integrado para impedir el consumo en polarización inversa. El circuito se
    polariza en inverso en reposo (supervisión) y cambia a polarización normal al
    dispararse [F2].


    2. **Dispositivos no polarizados**: si se conectan dispositivos no polarizados
    a la línea de sirenas, deben usarse **diodos de polarización y protección en cada
    uno** [F2].


    3. **Resistencia final de línea (RFL)**: instalar una resistencia de **6,8 kΩ,
    0,5 W mínimo** al final de cada circuito para la supervisión de cortocircuito
    y circuito abierto [F7].


    4. **Topología**: las sirenas se conectan en paralelo sobre los conductores A(+)/A(-)
    o B(+)/B(-), con la RFL al final del ramal (ver Figura 15) [F1].


    5. **No enrollar el cable en los terminales**: cortar y empalmar las conexiones
    adecuadamente para mantener la supervisión de la línea [F1].


    ---


    ### Limitaciones de cableado


    - **Longitud máxima recomendada**: no superior a **1 km**. Por encima de esta
    longitud, la capacitancia e inductancia del lazo pueden afectar al funcionamiento
    de la línea [F1].

    - Usar secciones de cable adecuadas para garantizar la alimentación de las sirenas
    a las tensiones recomendadas por el fabricante, tanto en alimentación principal
    como en condiciones de mínima tensión de baterías (consultar Tablas 10 y 11 del
    manual) [F1].


    ---


    ### Supervisión de averías


    Cualquier fallo en la línea de sirena (circuito abierto o cortocircuito) se mostrará
    en pantalla y quedará registrado en el registro del sistema. Ejemplo de mensaje:
    `!ATENCION! CIRCUITO ABIERTO SIRENA B` [F3].


    ---


    **Fuente:** Manual de Instalación Paneles de Incendio ZX2e/ZX5e — Documento No.
    MIE-MI-530rv001 (sin revisión registrada); Manual de Configuración — Documento
    No. MIE-MP-530rv001 (sin revisión registrada)'
