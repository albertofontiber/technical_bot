  bot_answer: 'La pregunta es sobre el cambio de la **batería tampón** (batería de
    litio) del ADW535 sin perder configuración. Los fragmentos disponibles no describen
    un procedimiento específico de sustitución de la batería de litio. Sin embargo,
    sí contienen información relevante que te afecta directamente:


    ---


    ## Lo que SÍ dicen los fragmentos sobre la batería de litio y la configuración:


    **Sobre dónde está la batería:**

    - La batería de litio está ubicada en el **Main Board LMB 35** [F4], visible en
    la Fig. 31 del manual [F4].


    **Sobre la configuración y su almacenamiento:**

    - Los parámetros específicos del sistema se almacenan en una **EEPROM** del ADW
    535 [F12]. Esto es relevante porque la EEPROM retiene datos sin alimentación.

    - El firmware está almacenado en la **Flash-PROM** [F12].


    **Sobre el reset de hardware (interrupción de tensión):**

    - Si se interrumpe la tensión de alimentación momentáneamente, el ADW 535 se reinicia,
    pero **"los parámetros del ADW 535 programados con anterioridad se mantienen (configuraciones
    específicas del sistema)"** [F7].


    **Sobre la batería y el reloj:**

    - La batería de litio está asociada al **módulo de reloj RTC** [F2]. El fallo
    de batería de litio genera el código de fallo **008 – Fallo reloj** [F11].

    - En la primera puesta en marcha, debe retirarse la **cinta aislante de la batería
    de litio** antes del primer encendido [F6].


    ---


    ## Lo que el manual NO especifica en los fragmentos disponibles:


    El manual **no describe un procedimiento paso a paso de sustitución de la batería
    de litio** del LMB 35 (tipo de batería, referencia, pasos de extracción/inserción,
    precauciones específicas durante el cambio).


    Lo que sí se puede inferir del corpus es que si la sustitución implica reemplazar
    el **LMB 35 completo**, entonces:

    - Sería necesario realizar un **nuevo reset inicial** [F1].

