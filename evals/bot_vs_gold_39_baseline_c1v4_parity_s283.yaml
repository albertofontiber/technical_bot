  bot_answer: "# ASD532 — Clases EN 54-20 y configuración de monitorización de flujo\
    \ de aire\n\n---\n\n## 1. Clases de sensibilidad según EN 54-20\n\nEl ASD 532\
    \ cumple los requisitos de la norma **EN 54-20** en sus tres clases [F10]:\n\n\
    - **Clase A** → Sensibilidad muy alta\n- **Clase B** → Sensibilidad alta\n- **Clase\
    \ C** → Sensibilidad normal\n\nLa elección del sensor de humo adecuado según la\
    \ clase requerida depende del rango de sensibilidad necesario [F1]:\n\n- **SSD\
    \ 532-1**: rango de alarma **0,5 %/m hasta 10 %/m**\n- **SSD 532-2**: rango de\
    \ alarma **0,1 %/m hasta 10 %/m**\n- **SSD 532-3**: rango de alarma **0,02 %/m\
    \ hasta 10 %/m**\n\n---\n\n## 2. Configuración de la monitorización del flujo\
    \ de aire\n\n### 2.1 Principio de funcionamiento\n\nLa monitorización se basa\
    \ en el **método calorimétrico** (medición de flujo en masa) [F2]. Durante el\
    \ **reset inicial** (con el conducto de aspiración intacto), el sistema registra\
    \ los valores de flujo y los guarda como **valores nominales al 100 %** [F2].\
    \ A partir de ahí, cualquier desviación fuera de la ventana de monitorización\
    \ dispara el aviso **«Fallo flujo de aire»** [F2].\n\n### 2.2 Requisito normativo\
    \ EN 54-20\n\nSegún **EN 54-20**, debe notificarse como fallo toda variación del\
    \ flujo de aire superior a **±20 %** [F2]:\n\n- Por debajo del **80 %** → suciedad/obstrucción\n\
    - Por encima del **120 %** → rotura de tubo\n\nEl tiempo de retardo normativo\
    \ es de **300 s** [F2].\n\n---\n\n## 3. Procedimiento de configuración\n\nHay\
    \ dos vías de configuración [F7] [F8]:\n\n**Vía A — Con software «ASD PipeFlow»:**\n\
    1. Crear y calcular el proyecto en **«ASD PipeFlow»** → resultado según EN 54-20\
    \ [F7]\n2. Introducir el resultado en el software de configuración **«ASD Config»**\
    \ [F7]\n3. Seleccionar las posiciones de conmutador **X01, X02 o X03** en el ASD\
    \ para memorizar los resultados [F7]\n\n**Vía B — Sin «ASD PipeFlow» (EasyConfig):**\n\
    1. Seleccionar los límites del sistema según el cap. 4.4.4.3 [F7]\n2. Decidir\
    \ si se requiere monitorización del flujo conforme a EN 54-20:\n   - **Sí** →\
    \ Seleccionar posición de conmutador **A11 a C31** [F7] [F5]\n   - **No** → Seleccionar\
    \ posición de conmutador **W01 a W44** ⚠️ (ver advertencia) [F7]\n\n---\n\n##\
    \ 4. Posiciones de conmutador normativas (A11 a C31)\n\nEstas posiciones garantizan\
    \ el cumplimiento completo de EN 54-20 [F5]:\n\n- **A11** → Clase A, límites normativos\n\
    - **b11 / b21** → Clase B, límites normativos\n- **C11 / C21 / C31** → Clase C,\
    \ límites normativos\n\n---\n\n## 5. Posiciones de conmutador no normativas (W01\
    \ a W44)\n\nLas posiciones **W01 a W44** cumplen la sensibilidad de alarma según\
    \ EN 54-20 (clases A a C), **pero NO los límites normativos de monitorización\
    \ del flujo de aire** [F4].\n\nEjemplos de configuración disponibles [F3]:\n\n\
    - Clase A / Límite 1: W01 (10 min / ±20 %), W02 (60 min / ±20 %), W03 (10 min\
    \ / ±50 %), W04 (60 min / ±50 %)\n- Clase B / Límite 1: W09 (10 min / ±20 %),\
    \ W10 (60 min / ±20 %), W11 (10 min / ±50 %), W12 (60 min / ±50 %)\n- Clase B\
    \ / Límite 2: W17 (10 min / ±20 %), W18 (60 min / ±20 %), W19 (10 min / ±50 %),\
    \ W20 (60 min / ±50 %)\n- Clase C / Límite 1: W25 (10 min / ±20 %), W26 (60 min\
    \ / ±20 %), W27 (10 min / ±50 %), W28 (60 min / ±50 %)\n- Clase C / Límite 2:\
    \ W33 (10 min / ±20 %), W34 (60 min / ±20 %), W35 (10 min / ±50 %), W36 (60 min\
    \ / ±50 %)\n- Clase C / Límite 3: W41 (10 min / ±20 %), W42 (60 min / ±20 %),\
    \ W43 (10 min / ±50 %), W44 (60 min / ±50 %)\n\n> ⚠️ **ADVERTENCIA**: Las posiciones\
    \ **W01 a W44** únicamente deben utilizarse **previa consulta con el fabricante**.\
    \ Los valores de monitorización del flujo de aire **no están homologados según\
    \ EN 54-20** [F4] [F7] [F8].\n\n---\n\n## 6. Ajustes adicionales mediante «ASD\
    \ Config»\n\nSi se realizan adaptaciones de la ventana de monitorización con **«ASD\
    \ Config»**, se deben respetar los siguientes límites [F7]:\n\n- Aumentar la ventana\
    \ por encima de **±20 %** o el tiempo de retardo por encima de **300 s** implica\
    \ **incumplimiento de EN 54-20** y requiere consulta con el fabricante\n- El tamaño\
    \ de la ventana **no debería quedar por debajo de ±20 %**, salvo que simultáneamente\
    \ se aumente el tiempo de retardo a **10 min como mínimo**\n- Una ventana inferior\
    \ a ±20 % con tiempo de retardo ≤ 300 s aumenta el riesgo de **avisos de fallo\
    \ erróneos**\n\n---\n\n**Fuente:** ASD532_TD_T140421es_a (sin revisión registrada)\n\
    \n---\n\nTambién puedo ayudarte con: **procedimiento de reset inicial (posición\
    \ U01)**, **selección del sensor SSD según clase EN 54-20** o **conexionado eléctrico\
    \ del ASD532**.\n\n---\n\U0001F4D6 **Obligaciones de evidencia del manual:**\n\
    - \"Con carácter general, para la instalación, el proyecto y el uso del detector\
    \ de humos por aspiración ASD 532 serán aplicables las disposiciones y directrices\
    \ específicas de cada país.\" (ASD532_TD_T140421es_a, p. 37) [F10]"
