  bot_answer: '## Conexión de baterías en la CAD-150-8


    ### Especificaciones de las baterías


    Las centrales analógicas CAD-150-8 requieren **dos baterías de 12V 7A/h** [F6],
    que deben conectarse **en serie** para el correcto funcionamiento [F6].


    ---


    ### Procedimiento de conexión


    1. **Coloca las baterías** en la parte inferior de la caja, en el espacio reservado
    para ello, de forma **vertical** [F6].


    2. **Conecta el cable puente** (suministrado con la central) uniendo el **polo
    positivo de una batería con el polo negativo de la otra**, conectándolas así en
    serie [F6].


    3. **Conecta los cables del circuito** (rojo y negro) al **positivo y negativo**
    de las baterías en el **Conector Batería** (posición **11** de la PCB Base) [F1][F2].


    4. **Fusible de baterías**: verifica que el fusible de baterías (posición **10**
    de la PCB Base) esté en buen estado [F2].


    ---


    ### ⚠️ Orden de conexión obligatorio


    > **SIEMPRE conectar primero la red (230VAC) y después las baterías.** Si no se
    respeta este orden, el equipo podría sufrir daños [F6][F8].


    ---


    ### Arranque solo con baterías (caso especial)


    Si es necesario encender el equipo únicamente con baterías, es **imprescindible
    pulsar el pulsador BAT** (posición **9** de la PCB Base — "Tecla arranque por
    Batería") para arrancar el equipo [F11][F2].


    ---


    Fuente: 55315013 Manual Centrales Analógicas CAD-150-8 Instalación ES FR GB IT
    (sin revisión registrada); 55315008 Manual Centrales Analógicas CAD-150-8 Usuario
    ES FR GB IT (sin revisión registrada)


