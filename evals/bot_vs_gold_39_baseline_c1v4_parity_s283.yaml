    \ Verifica qué versión de firmware/hardware tienes instalada y usa el valor correspondiente.\n\
    \n---\n\n## Regla de instalación\n\n- **Todas las zonas**, incluidas las no utilizadas,\
    \ deben tener instalado su final de línea según la configuración del sistema (EFL\
    \ o RFL) [F6].\n- El EFL/RFL se instala en la **conexión de salida del último\
    \ equipo** de la línea [F4].\n\n---\n\n## Cómo cambiar entre modo Capacitivo y\
    \ Resistivo\n\n1. Accede al menú con **(Tecla TECLADO=ON + Tecla EVACUACIÓN=ON)**\
