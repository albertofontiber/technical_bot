  bot_answer: '## Rango de temperatura de funcionamiento — ASD 535


    Según los datos técnicos del manual [F1], los rangos de temperatura son los siguientes:


    **Caja del detector:**

    - Rango estándar: **–30 °C hasta +60 °C** [F1]

    - Según normativa UL: máx. **+40 °C** [F1]

    - Según estándar australiano AS 1603.8: **–30 °C hasta +55 °C** [F1]


    **Conducto de aspiración:**

    - Rango estándar: **–30 °C hasta +60 °C** [F1]

    - Según estándar australiano AS 1603.8: **–30 °C hasta +55 °C** [F1]


    **Fluctuación máxima permitida durante el funcionamiento** (tanto en caja como
    en conducto): **20 °C** [F1]


    **Temperatura máxima de almacenamiento** (sin condensación): **–30 °C hasta +70
    °C** [F1]


    ---


    **Consideraciones adicionales importantes:**


    - Si las oscilaciones térmicas superan los **20 °C**, pueden ser necesarios ajustes
    especiales (ventana de flujo de aire más grande, mayor tiempo de retardo, etc.)
    [F4] [F5].

    - En recintos con temperatura superior a **50 °C** o humedad superior al **80
    % H rel.**, puede ser necesario instalar tramos de refrigeración en el conducto
    de aspiración [F4].

    - Para uso en **almacenes de ultracongelación**, el rango de temperatura restringido
    es **–30 °C hasta 0 °C** [F3].

    - Es posible acordar con el fabricante rangos de temperatura inferiores o superiores.
    La instalación en rango de condensación solo puede llevarse a cabo previa consulta
    con el fabricante [F2].


    ---


    Fuente: ASD535_TD_T131192es_h (sin revisión registrada)


    También puedo ayudarte con: **consumos de corriente por variante (535-1 a 535-4)**,
    **condiciones de humedad ambiental** o **limitaciones de instalación del conducto
    de aspiración** del ASD 535.


    ---

    ⚠️ **Información adicional del manual:**

    - "Es imprescindible garantizar el retorno de aire a la zona con riesgo de explosión
    (recinto vigilado)." [F4]

