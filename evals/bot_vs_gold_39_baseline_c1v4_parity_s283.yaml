    \ de 47 µF** instalado entre positivo y negativo de la línea, en la salida del\
    \ último equipo [F6].\n- Este modo es el configurado de fábrica [F1].\n\n---\n\
    \n## Modo alternativo: Resistivo (RFL)\n\n- **Resistencia de 6K8 Ω** [F6][F1].\n\
    - En modo resistivo, la central admite un **rango de resistencia final de línea\
    \ entre 3 KΩ y 7 KΩ** [F6].\n\n> ⚠️ **Importante:** El Fragmento 3 (versión v.04\
    \ del manual en inglés) menciona **4K7 Ω** como valor resistivo [F3], mientras\
