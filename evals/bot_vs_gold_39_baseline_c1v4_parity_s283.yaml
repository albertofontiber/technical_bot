  bot_answer: "# Retardo de salida de alarma en la Notifier PEARL\n\nLa PEARL no tiene\
    \ un único parámetro \"retardo de salida de alarma principal\" configurable de\
    \ forma directa. El retardo se programa a través de las **reglas de causa-efecto**\
    \ y se gestiona operativamente desde el menú de anulación. Te explico ambas partes:\n\
    \n---\n\n## 1. Programación del retardo (vía causa-efecto)\n\nEl retardo de activación\
    \ de salidas se configura dentro de la **matriz de causa-efecto** [F2]. Cada regla\
    \ puede tener asignado un tipo de retardo de salida. Los **seis tipos de retardo**\
    \ disponibles son [F3]:\n\n- **Fijo**\n- **Estándar**\n- **No Silenc.**\n- **Est.\
    \ Ext.**\n- **RetExtStd**\n- **No Sil. Ext**\n- **SinRetExt**\n\nEl comportamiento\
    \ de cada tipo ante las acciones del usuario es el siguiente [F3]:\n\n- **La salida\
    \ se detiene al pulsar SILENCIAR SIRENAS durante el retardo:**\n  Sí en: Estándar,\
    \ Est. Ext., RetExtStd\n  No en: Fijo, No Silenc., No Sil. Ext., SinRetExt\n\n\
    - **El retardo puede anularse (nivel acceso 2, opción «Anular retardos»):**\n\
    \  Sí en: Estándar, No Silenc., Est. Ext., RetExtStd, No Sil. Ext., SinRetExt\n\
    \  No en: Fijo\n\n- **El tiempo restante se muestra en la pestaña ALARMA:**\n\
    \  Sí en: Estándar, No Silenc., Est. Ext., RetExtStd, No Sil. Ext., SinRetExt\n\
    \  No en: Fijo\n\n- **El retardo puede detenerse pulsando FIN RETARDO (nivel acceso\
    \ 2):**\n  Sí en: Estándar, No Silenc., Est. Ext., RetExtStd, No Sil. Ext., SinRetExt\n\
    \  No en: Fijo\n\n- **La salida se detiene al pulsar AMPLIAR RETARDO:**\n  Sí\
    \ en: Est. Ext., No Sil. Ext.\n  No en: el resto\n\n- **El temporizador comienza\
    \ en RETARDO AMPLIADO:**\n  Sí en: RetExtStd, SinRetExt\n  No en: el resto\n\n\
    > ⚠️ **Recomendación del fabricante:** Se recomienda usar el **programa de configuración\
    \ por ordenador** como método principal de programación de causa-efecto. El menú\
    \ de la central debe usarse solo para modificaciones menores [F12].\n\nNo puedo\
    \ confirmar de forma segura el número de menú de Causa y Efecto con los fragmentos\
    \ servidos. Confirma el manual y la revisión exactos antes de usar un número de\
    \ menú.\n\n---\n\n## 2. Gestión operativa del retardo (anular/habilitar)\n\nUna\
    \ vez configurado el retardo en causa-efecto, puede anularse o habilitarse desde\
    \ el menú de operación [F1]:\n\n1. Accede al **Menú Anular/Habilitar**\n2. Selecciona\
    \ **«5: Retardo Activación Salidas»**\n3. Pulsa **✓** para cambiar el estado (anulado\
    \ ↔ habilitado)\n4. Pulsa **✕** para salir en cualquier momento\n\n> El **LED\
    \ de RETARDO ACTIVO** se enciende cuando hay un retardo activo configurado [F1].\n\
    \n---\n\n## 3. Tecla AMPLIAR RETARDO\n\nLa tecla **AMPLIAR RETARDO** puede desactivarse\
    \ desde la configuración de la central si no se requiere en la instalación [F5]:\n\
    \n- Parámetro: `10: Extend Delay Button`\n- Valores: `Enabled` / `Disabled`\n\
    - Ruta: **Editar Parámetros de la Central** → parámetro 10 [F5]\n\n---\n\n## 4.\
    \ Comportamiento durante el retardo activo\n\nMientras el retardo está activo\
    \ [F4]:\n- La tecla **AMPLIAR RETARDO** (nivel de acceso 2) permite extender el\
    \ retardo para realizar una búsqueda\n- El segundo temporizador (retardo ampliado)\
    \ anula al primero\n- La tecla **FIN RETARDO** (nivel de acceso 1) termina cualquier\
    \ retardo e introduce la condición de alarma completa\n\n---\n\nFuentes:\n- 997-670-005-3_Operating_ES\
    \ (sin revisión registrada)\n- 997-671-005-3_Configuration_ES (rev. 997-671-005-3)\n\
    \n---\n\nTambién puedo ayudarte con: **configuración de reglas de causa-efecto\
