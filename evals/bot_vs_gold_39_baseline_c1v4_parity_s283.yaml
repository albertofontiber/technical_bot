  diagnostico: 'Responde con el método correcto: fórmula (A+B)×1,2, autonomía en reposo
    24/72 h, alarma 0,5 h, suma de consumos y comprobación del límite de baterías
    2×12 V hasta ~18 Ah. Incluye consumos y restricciones relevantes; solo añade algún
    detalle accesorio/posible imprecisión menor en referencias de baterías, sin afectar
    al cálculo principal.'
  bot_sources:
