  bot_answer: '# Conexionado del módulo M710 / MI-DMMI en el lazo


    ## Terminales de lazo (comunes a ambos modos)


    Según los fragmentos disponibles, la asignación de terminales es [F1][F5][F6]:


    - **Terminal 1:** – Lazo entrada (Loop Input –)

    - **Terminal 2:** + Lazo entrada (Loop Input +) — con aislador interno activo

    - **Terminal 3:** – Lazo salida (Loop Output –)

    - **Terminal 4:** + Lazo salida (Loop Output +)

    - **Terminal 5:** + Lazo salida alternativo. Si **no se necesita aislamiento de
    cortocircuitos**, conectar aquí el + de salida de lazo en vez de al terminal 2.
    El terminal 5 está conectado internamente con el terminal 4 [F5][F6].


    > ⚠️ **Nota sobre el aislador interno:** Para eliminar el aislador interno, los
    positivos in/out de lazo deben conectarse a los terminales 4 y 5 [F1].


    ---


    ## Modo 2 estados


    - **Resistencia de fin de línea (RFL): 47 kΩ** en paralelo con la entrada (terminales
    6-7) [F1].

    - Funcionamiento: **cortocircuito = alarma** [F1].

    - La entrada A se conecta a los terminales **6 y 7** [F1].


    ---


    ## Modo 3 estados


    - **Resistencia de fin de línea (RFL): 47 kΩ** [F1].

    - **Resistencia adicional: 18 kΩ en serie con el contacto** (cada conmutador/dispositivo
    que se desee supervisar) [F1][F2][F4][F5][F6].

    - Funcionamiento: permite distinguir **reposo / avería (circuito abierto o cortocircuito)
    / alarma (cierre de contacto)** [F1].

    - La central debe ser compatible con este modo para poder indicar el cortocircuito
    como avería en lugar de alarma [F2][F4].


    ---


    ## Terminales de entrada (señal)


    - **Terminales 6 y 7:** Entrada A del MI-DMMI [F1].

    - **Terminales 8 y 9:** Solo disponibles en el modelo **MI-DMM2I** (entrada doble).
    El MI-DMMI **no tiene conexiones en estos terminales** [F3][F7].


    ---


    ## Nota sobre el NAS-2 con M710


    Si el M710 se conecta al NAS-2 (terminales J14), **no es necesario conectar la
    resistencia de 47 kΩ**, ya que está incluida en la propia placa del NAS-2 [F8].


    ---


