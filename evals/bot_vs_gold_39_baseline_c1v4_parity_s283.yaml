  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: "# ID3000 — Programar coincidencia de dos detectores para activar sirena\n\
    \n## Concepto previo\n\nLa función de coincidencia en la ID3000 requiere que **dos\
    \ equipos de la misma zona/subzona estén en alarma** antes de que se active la\
    \ salida [F1]. Esta función solo se aplica si la entrada está especificada como\
    \ **'ZONA'**, **'SUBZONA'** o **'CUALQUIERA'** — no si es un equipo individual\
    \ o una tecla [F1].\n\n---\n\n## Procedimiento (vía teclado del panel — MPDT190)\n\
    \n### Paso 1 — Acceder a la Matriz de Control\n\nDesde la edición de sensores,\
    \ módulos o especificaciones de red, pulsa **\\<F6\\>** para acceder a la programación\
    \ de la Matriz de Control [F12].\n\n---\n\n### Paso 2 — Crear nuevo evento de\
    \ entrada\n\nEn el menú de la Matriz de Control, selecciona **Crear nuevo evento\
    \ matriz de control** y define la entrada [F3]:\n\n- Categoría: **ALARMA**\n-\
    \ Tipo de equipo: selecciona el tipo al que se aplicará la coincidencia (p. ej.\
    \ **ANALÓGICO**, que incluye detectores térmicos, iónicos, ópticos, VIEW y multisensor)\
    \ [F1]\n\n---\n\n### Paso 3 — Seleccionar zona\n\nCuando el sistema pregunte por\
    \ la zona [F3]:\n\n- Selecciona **Zona(s) específica(s)** e indica el número de\
    \ zona donde están los detectores\n- **No selecciones \"equipo individual\"**\
    \ — la coincidencia no funciona con esa opción [F1]\n\n---\n\n### Paso 4 — Seleccionar\
    \ tipo de coincidencia de equipos\n\nEl sistema mostrará el menú [F3]:\n\n```\n\
    Indique tipo de coincidencia:\n 1: UN ÚNICO EQUIPO\n 2: COINCIDENCIA 2 EQUIPOS\n\
    \ 3: n COINCIDENCIA EQUIPOS\n 4: p COINCIDENCIA EQUIPOS\n```\n\nSelecciona la\
    \ opción **2: COINCIDENCIA 2 EQUIPOS** [F3].\n\n> ⚠️ **Nota:** Las opciones 3\
    \ y 4 solo aparecen si están configuradas previamente en los ajustes de la central\
    \ (Sección 11.21) [F3].\n\n> ⚠️ **Requisito:** Para que tenga lugar la coincidencia,\
    \ los equipos en alarma deben estar en la **misma zona o subzona** [F3].\n\n---\n\
    \n### Paso 5 — Definir la salida\n\nUna vez configurada la entrada con coincidencia,\
    \ define la salida como el **circuito de sirena** correspondiente [F12].\n\n---\n\
    \n## ⚠️ ADVERTENCIA CRÍTICA — Pulsadores manuales (EN54-2: 7.1.4)\n\n**No incluyas\
    \ pulsadores manuales (MCP/PUL) en el grupo de coincidencia** [F1][F3].\n\nPara\
    \ evitarlo, debes programar **dos instrucciones separadas** en la Matriz de Control\
    \ [F1][F3]:\n\n1. **Primera instrucción:** entrada de tipo **Pulsador Manual (MCP)**\
    \ → coincidencia en **'Simple'** (sin coincidencia, un único equipo activa la\
    \ sirena directamente)\n2. **Segunda instrucción:** entrada de tipo **ANALÓGICO**\
    \ (u otro tipo de detector) → con **COINCIDENCIA 2 EQUIPOS**\n\n---\n\n## Procedimiento\
    \ alternativo (vía software PK-ID3000 — MCDT191)\n\nSi programas desde el software\
    \ de configuración:\n\n1. Ve a **Parámetros Sistema → Matriz de Control** [F11]\n\
    2. Añade una nueva línea → **Añadir/Editar Entrada**\n3. En la ventana de entrada,\
    \ selecciona:\n   - Tipo de evento: **Alarma**\n   - Zona: **Zona(s) Específica(s)**\
    \ → indica el número de zona [F2]\n   - Marca la casilla **\"Coincidencia de Equipos\"\
    ** [F2]\n4. El número de zonas o equipos disponibles en el desplegable es **'2'\
    \ más aquéllos configurados en la pestaña de Coincidencia de Alarma (Sección 2.12)**\
    \ [F2]\n5. Define la salida como la sirena correspondiente\n\n> **Nota:** Si necesitas\
    \ niveles de coincidencia adicionales (nivel 3, 4, 5...), configúralos previamente\
    \ en **Parámetros Sistema → Opciones de la Central → pestaña Coincidencia de Alarma**\
    \ [F7].\n\n---\n\n## Comportamiento en caso de conflicto de coincidencia\n\nSi\
    \ dos sensores tienen configuraciones de coincidencia distintas entre sí, la regla\
    \ es: **si cualquiera de las dos configuraciones establece que se ha cumplido\
    \ la coincidencia, ésta se cumple** [F6].\n\n---\n\nFuentes:\n- MPDT190 — ID3000\
    \ Manual de programación (sin revisión registrada)\n- MCDT190 — (sin revisión\
    \ registrada)\n- MCDT191 — ID3000 Manual del programa de configuración PK-ID3000,\
    \ v. 2.17e\n- MADT190_14 — (sin revisión registrada)\n\n---\n\nTambién puedo ayudarte\
    \ con: **configuración de niveles de coincidencia adicionales (Sección 2.12/11.21)**,\
    \ **programación de la salida de sirena en la Matriz de Control** o **comportamiento\
    \ de la coincidencia en sistemas de red ID3000**.\n\n---\n\U0001F4D6 **Información\
    \ adicional del manual:**\n- \"- Radio button: Misma Central o Red\n- Radio button:\
    \ Siempre la misma Zona\" [F7]\n- \"- Radio button: Deber estar en la misma Subzona\n\
    - Radio button: Se extiende en el rango de Subzonas especificadas (labeled as\
    \ 4)\" [F7]"
