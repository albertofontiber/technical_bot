  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: "## Aviso de Tierra (Earth Fault) en la AFP-400\n\n### ¿Qué significa?\n\
    \nEl aviso **\"Tierra\"** (Earth Fault / Fallo de Tierra) indica que existe una\
    \ conexión no deseada entre algún conductor del sistema y tierra (masa). En el\
    \ SLC, una falla de tierra genera condición de **Alarma/Problema** independientemente\
    \ del estilo de cableado utilizado (Estilo 4, 6 o 7) [F8].\n\n---\n\n### Indicadores\
    \ asociados\n\nLa placa de alimentación **MPS-400** dispone de un **LED específico\
    \ de \"Fallo de Tierra\"** en su placa [F1]. Comprueba si ese LED está encendido\
    \ para confirmar que el origen está en la fuente de alimentación o en el cableado\
    \ asociado.\n\nEl LED de **\"Avería del Sistema\"** (amarillo) en el frontal de\
    \ la AFP-400 parpadeará si la condición no ha sido reconocida, y quedará fijo\
    \ una vez reconocida [F4].\n\n---\n\n### Localización del fallo\n\nLos fragmentos\
    \ disponibles no describen un procedimiento paso a paso de localización de fallo\
    \ de tierra. Lo que sí está documentado:\n\n1. **Verificar el LED de Fallo de\
    \ Tierra en la MPS-400** [F1] — confirma si el fallo está en el circuito de alimentación.\n\
    \n2. **Consultar la pantalla LCD** — la AFP-400 dispone de pantalla de 80 caracteres\
    \ (2×40) [F6]. Accede al menú de **Lectura de Estados** para identificar el punto\
    \ o zona afectada:\n   - Pulsa `<Enter>` → selecciona `<2>` (Leer Estados) [F10]\n\
    \   - Pulsa `0` + `Enter` → selecciona `SENSOR`, `MÓDULO`, `EQUIPO` o `Z` e introduce\
    \ la dirección del equipo o zona [F10]\n\n3. **Revisar el SLC** — una falla de\
    \ tierra en el SLC produce condición de **Alarma/Problema** en Estilo 4, Estilo\
    \ 6 y Estilo 7 [F8]. Inspecciona el cableado del lazo en busca de contacto con\
    \ masa.\n\n4. **Jumper JP2 en la MPS-400** — existe un puente **JP2** cuya función\
    \ es \"inhabilitar la detección de la Falla de Tierra\" [F3]. Verifica que no\
    \ esté cortado accidentalmente (si lo estuviera, el sistema no detectaría fallos\
    \ de tierra).\n\n---\n\n### ⚠️ Nota importante\n\nEl procedimiento detallado de\
    \ localización de fallo de tierra se referencia en el **Manual de Instalación\
    \ del AFP-300/AFP-400 (Documento 50253)** [F5]. Consulta ese documento para el\
    \ procedimiento completo si los pasos anteriores no son suficientes.\n\n---\n\n\
    **Fuentes:** Manual de usuario AFP-400 (MFDT170, sin revisión registrada); Manual\
    \ de instalación AFP-400 (MIDT170, sin revisión registrada); Manual de instalación\
    \ AFP-300/AFP-400 (50253SP, sin revisión registrada)\n\n---\n\nTambién puedo ayudarte\
    \ con: **reset/rearme del sistema tras eliminar el fallo**, **configuración del\
    \ jumper JP2**, o **lectura del histórico de averías en la AFP-400**.\n\n---\n\
    \U0001F4D6 **Información adicional del manual:**\n- \"- **TB1** (top left): Terminal\
    \ block with connections labeled TB1\n- **TB2** (top center): Terminal block labeled\
    \ TB2\n- **TB3-TB6** (top right): Terminal blocks labeled TB3-TB6\n- **TB7-TB10**\
    \ (far right): Terminal blocks labeled TB7-TB10\n- **Interruptor de Selección\
    \ de Voltaje 115V/230V** (left side): Voltage selection switch\n- **Circuitos\
    \ de Aviso y Señalizaciones 1-4** (right side): Alarm and signaling circuits 1-4\n\
    - **Fallo de Tierra** (right side): Ground fault indicator\n- **Activación de\
    \ la Alimentación AC** (right side): AC power activation\n- **Placa de Alimentación\
    \ de la MPS-400** (bottom center): MPS-400 power supply board\" [F1]"
