  bot_answer: "# Configuración de contraseñas Nivel 2 y Nivel 3 — Notifier INSPIRE\
    \ E10/E15\n\n---\n\n## Códigos de fábrica\n\nAntes de cambiar nada, ten en cuenta\
    \ los códigos predeterminados de fábrica [F3]:\n- **Nivel 2:** `22222222`\n- **Nivel\
    \ 3:** `33333333`\n\n---\n\n## Requisitos previos\n\n- La contraseña debe tener\
    \ entre **4 y 8 dígitos** [F1][F4].\n- Si estás en **Nivel 2**, solo puedes cambiar\
    \ la contraseña del **Nivel 2** [F1].\n- Si estás en **Nivel 3**, puedes cambiar\
    \ la contraseña del **Nivel 2 o del Nivel 3** [F1].\n\n---\n\n## Procedimiento\
    \ para cambiar la contraseña de Nivel 2 (desde Nivel 2)\n\n1. Selecciona el **icono\
    \ del menú ①** y selecciona **\"Configuración\" ②**. Inicia sesión como usuario\
    \ de **Nivel 2** [F2].\n2. Selecciona la opción **\"Cambio del código de acceso\"\
    \ ③** [F2].\n3. Asegúrate de que **Nivel de Acceso 2 ④** esté seleccionado y que\
    \ el cursor parpadee en el campo de entrada **⑤** [F2].\n4. Puedes ver la entrada\
    \ del código haciendo clic en el **icono del ojo ⑥** [F2].\n5. Introduce el nuevo\
    \ código de acceso (entre 4 y 8 dígitos) con el teclado **⑦** [F2].\n6. Confirma\
    \ la entrada seleccionando el símbolo **✓ ⑧** [F2].\n7. Repite los pasos 3 a 6\
    \ para confirmar el código [F2].\n\n---\n\n## Procedimiento para cambiar la contraseña\
    \ de Nivel 2 o Nivel 3 (desde Nivel 3)\n\n1. Selecciona el **icono del menú ①**\
    \ y selecciona **\"Ajustes\" ②**. Inicia sesión como usuario de **Nivel 3** [F1].\n\
    2. Selecciona la opción **\"Cambio del código de acceso\" ③** [F1].\n3. Asegúrate\
    \ de que el **Nivel de Acceso 2 o 3 ④** esté seleccionado y que el cursor parpadee\
    \ en el campo **⑤** [F1].\n4. Puedes ver la entrada del código haciendo clic en\
    \ el **icono del ojo ⑥** [F1].\n5. Introduce el nuevo código de acceso (entre\
    \ 4 y 8 dígitos) con el teclado **⑦** [F1].\n6. Confirma la entrada seleccionando\
    \ el símbolo **⑧** [F1].\n7. Repite los pasos 3 a 6 para confirmar el código [F1].\n\
    8. Observa el mensaje **\"Cambio de código de acceso satisfactorio\"** y selecciona\
    \ **Aceptar** [F1].\n9. **Sincroniza el programa con la central** y realiza una\
    \ **copia de seguridad del cambio en la nube** [F1].\n\n---\n\n> ⚠️ **Aviso de\
    \ seguridad:** Se recomienda cambiar la contraseña de fábrica del Nivel 2. Asegúrate\
    \ de que los códigos de acceso se mantienen seguros y solo los conocen los usuarios\
    \ autorizados [F4].\n\n> ℹ️ El sistema cerrará sesión automáticamente al **Nivel\
    \ 1** si los controles no se utilizan durante **5 minutos** tras iniciar sesión\
    \ en Nivel 2 [F4].\n\n---\n\n**Fuentes:**\n- HOP-138-8ES issue 6_01-2026 (Manual\
    \ de puesta en marcha INSPIRE E10/E15)\n- HOP-338-9ES issue 4_01-2026 (Manual\
    \ de usuario INSPIRE E10/E15)\n\n---\n\nTambién puedo ayudarte con: **inicio y\
    \ cierre de sesión**, **sincronización con la herramienta CLSS** o **lectura de\
    \ la configuración de la central** en la INSPIRE E10/E15.\n\n---\n\U0001F4CB **Información\
    \ adicional del manual:**\n- Nota: el manual también indica: \"Se recomienda cambiar\
    \ la contraseña del código de acceso al nivel de acceso 2/3 contraseña a uno exclusivo\
    \ que tenga entre 4 y 8 dígitos.\" [F1] · \"- Menu icon ① leading to \"Configuraciones\"\
    \n- \"Configuraciones\" screen showing \"Configuración del sistema, red, datos\
    \ y hora, programa de mantenimiento, etc\" ②\n- Arrow pointing to \"Cambio de\
    \ contraseña\" option ③\n- \"Introduzca nueva contraseña\" dialog box with:\n\
    \  - \"Acceso Nivel 2\" dropdown ④\n  - Password input field ⑤\n  - \"Min:4 digitos,Max:8\
    \ digitos\" text with eye icon ⑥\n  - Numeric keypad showing numbers 1-9, 0, backspace\
    \ icon, and checkmark icon ⑧\n  - Backspace arrow ⑦]\" [F1]"
