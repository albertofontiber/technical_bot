  - manual IS MA1
  coverage_status: appended
  coverage_appended_rows: 1
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: '# Alimentación y parámetros de seguridad intrínseca del IS-mA1


    ## Clasificación ATEX / IECEx


    El IS-mA1 está certificado como [F1]:

    - **II 1G Ex ia IIC T4 Ga**

    - Rango de temperatura ambiente: **-40 °C ≤ Ta ≤ +60 °C**

    - Apto para zonas **0, 1 y 2** con gases y vapores inflamables de grupos **IIA,
    IIB e IIC**, clases de temperatura T1 a T4 [F1]

    - Certificados: **SIRA 05ATEX2084X** / **IECEx SIR 06.0045X** [F1]

    - ⚠️ El sufijo **''X''** en el número de certificado indica condiciones especiales
    de uso — el instalador debe consultar esa sección del certificado [F1]


    ---


    ## Parámetros de seguridad intrínseca de entrada


    ### Terminales **+ / −** (alimentación principal)


    | Parámetro | Valor |

    |---|---|


    - **Ui** = **28 V** [F1]

    - **Ii** = **93 mA** [F1]

    - **Pi** = **660 mW** [F1]

    - **Ci** = **0** [F1]

    - **Li** = **0** [F1]


    ### Terminales **S2 y S3** (activación 2.ª y 3.ª etapa de alarma) respecto a terminal
    −


    - **Ui** = **28 V** [F1]

    - **Ii** = **0 mA** [F1][F10]

    - **Ci** = **0** [F5]


    > ⚠️ **Importante:** Como la corriente permitida en S2/S3 es **cero**, estos terminales
    **solo pueden conectarse** a [F9][F10]:

    > - Una barrera de retorno de diodo (diode return barrier) certificada Ex ia por
    un Organismo Notificado

    > - Un relé intrínsecamente seguro certificado Ex ia

    > - Un aislador galvánico certificado Ex ia

    > - Un interruptor de accionamiento mecánico situado en la zona peligrosa

    >

    > Solo se admiten barreras de retorno de diodo con **caída de tensión inferior
    a 0,9 V** [F9][F10]


    ---


    ## Métodos de alimentación desde zona segura


    ### Opción A — Barreras Zener


    **Alarma de una sola etapa:**

    - Si el interruptor de control está en el positivo (o se activa cortando/dando
    alimentación): basta con una **barrera Zener de un solo canal** (Fig 4) [F3]

    - Si el interruptor debe estar en el negativo: se usa una barrera Zener + una
    **barrera de retorno de diodo** (Fig 5) [F3]


    **Alarma multietapa (S2 / S3):**

    - Conectar S2 a 0 V activa la 2.ª etapa; S3 a 0 V activa la 3.ª etapa [F8]

    - Se usan barreras de retorno de diodo adicionales para S2 y S3 (Fig 6) [F8]

    - Si solo se necesitan dos etapas, se omite la barrera de 3.ª etapa; la barrera
    de **28 V / 93 mA** y el canal de retorno de diodo pueden integrarse en un solo
    paquete [F8]


    **Parámetros requeridos del aparato asociado (barrera Zener)** [F5]:

    - Uo ≤ **28 V**

    - Io ≤ **93 mA**

    - Po ≤ **660 mW**

    - Co ≥ Ccable

    - Lo ≥ Lcable


    ### Opción B — Aisladores galvánicos


    - No requieren conexión a tierra de alta integridad, lo que simplifica la instalación
    en sistemas pequeños [F7]

    - El IS-mA1 puede alimentarse desde cualquier aislador galvánico con parámetros
    de salida dentro de los límites especificados, certificado Ex ia [F7]

    - Las etapas S2/S3 se activan mediante **relés galvánicamente aislados** certificados
    Ex ia [F7]


    **Parámetros requeridos del aparato asociado (fuente galvánica aislada)** [F6]:

    - Uo ≤ **28 V**

    - Io ≤ **93 mA**

    - Po ≤ **660 mW**

    - Co ≥ Ccable

    - Lo ≥ Lcable


    **Parámetros requeridos del relé galvánico aislado (para S2/S3)** [F6]:

    - Uo = **0**

    - Io = **0**


    ---


    ## Restricción crítica de capacitancia de cable


    - La capacitancia total conectada a los terminales **+/−** (Ccable + cualquier
    otra capacitancia) **no debe superar 83 nF** [F5][F6]


    ---


    ## Advertencias de instalación


    - La instalación debe realizarla **personal cualificado** [F1]

    - La reparación solo puede realizarla el **fabricante** o según el código de práctica
    aplicable [F1]

    - La carcasa es de **plástico ABS** — protegerla de sustancias agresivas (ácidos,
    disolventes) [F1]

    - ⚠️ **Riesgo electrostático**: limpiar únicamente con **paño húmedo** [F1]

    - ⚠️ La separación entre terminales **S2 y S3 es inferior a 6 mm** — precaución
    en el conexionado [F5][F6]

    - Desconectar la alimentación antes de cualquier intervención para evitar ignición
    [F5][F6]


    ---


    **Fuente:** IS5001-F_IS-mA1_EN (sin revisión registrada); manual IS MA1 — Issue
    H, 03-01-2020


    ---


    También puedo ayudarte con: **selección de tonos y configuración de etapas de
    alarma**, **requisitos de cableado y secciones de cable**, o **procedimiento de
    montaje y entradas de cable (IP65)** del IS-mA1.


    ---

    ⚠️ **Información adicional del manual:**

    - "CAUTION - The clearance between sounder terminals S2 and S3 is less than 6mm."
    [F5]

    - "CAUTION - Bonding between conduit connections is not automatic and must be
    provided as part of this installation." [F5]


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "The IS-mA1 minialarm is an ATEX and IECEx certified intrinsically safe sounder
    which produces a loud warning signal in a hazardous area." (IS5001-F_IS-mA1_EN,
    p. 1) [F11]'
