  bot_answer: "# Añadir un nuevo detector al lazo en la Morley DXc\n\nEl procedimiento\
    \ para añadir un detector al lazo tras la puesta en marcha inicial en la DXc es\
    \ la **Autobúsqueda de equipos**, accesible desde el menú de Lazos.\n\n---\n\n\
    ## Pasos\n\n1. **Conecta físicamente el nuevo detector** al lazo, respetando la\
    \ polaridad positivo/negativo [F2]. Recuerda que el cableado debe mantenerse en\
    \ bucle cerrado [F2].\n\n2. **Accede al menú de Lazos** desde el nivel de programación\
    \ correspondiente.\n\n3. **Pulsa la tecla `2`** en el menú de Lazos para seleccionar\
    \ la función **'Autobúsqueda'** [F1]:\n\n   ```\n   [Lazo]\n   1:Confg.Equipos\
    \    2:Autobusqueda\n   ```\n\n4. **Introduce el número de lazo** donde has conectado\
    \ el nuevo detector y pulsa **⊙** para confirmar [F1]:\n\n   ```\n   [Autobusqueda]\n\
    \   Sel.Num.Lazo (1-2) :1\n   OK:Confirm  1-2:↕:Edit  ←:Cancel\n   ```\n\n5. **Confirma\
    \ que deseas realizar la autobúsqueda** pulsando **⊙** [F1]:\n\n   ```\n   [Autobusqueda]\n\
    \   Lazo: 1  Autobusqueda?\n   OK:Confirm             ←:Cancel\n   ```\n\n6. **Espera**\
    \ a que finalice el proceso. La pantalla mostrará una barra de progreso [F1]:\n\
    \n   ```\n   [Autobusqueda]\n   Lazo: 1 Reconocimiento en progreso...\n   █████████████████\n\
    \   ```\n\n7. **Verifica el resumen de resultados** al finalizar. Comprueba que\
    \ el campo **'Nuevos'** refleja el número de detectores añadidos y que los totales\
    \ coinciden con los equipos físicamente instalados [F1]:\n\n   ```\n   [Lazo]\n\
    \   Lazo: 1           Total: 13\n   Nuevos:1          Elimin.:0  Cambiad:0\n \
    \  ION: 0 OPT: 1 TMP: 1 MLT: 2\n   PUL: 4 MON: 0 SIR: 2 REL: 1 OTROS: 2\n   ```\n\
    \n8. **Pulsa ⊞** para salir de la pantalla de resultados y regresar al menú de\
    \ Lazo [F1].\n\n---\n\n## ⚠ Aviso importante\n\nSi en tu instalación el protocolo\
    \ es seleccionable y has realizado un **cambio de protocolo** previo, **espera\
    \ dos minutos** antes de ejecutar la autobúsqueda. La central necesita ese tiempo\
    \ para rearmar los equipos del lazo [F1].\n\n---\n\n## Nota sobre modelos\n\n\
    - **DXc1**: dispone únicamente del Lazo 1 [F2].\n- **DXc2**: dispone de los Lazos\
    \ 1 y 2 [F2].\n- **DXc4**: dispone de hasta 4 lazos (Lazos 1 a 4) mediante la\
    \ placa de ampliación de 2 lazos (ref.: **795-111**) [F3].\n\nSi dispones de más\
    \ de un lazo, usa las teclas **▲ / ▼** para revisar los resultados de cada lazo\
    \ por separado [F1].\n\n---\n\n**Fuente:** DXc_Manual de configuracion (sin revisión\
    \ registrada)\n\n---\n\nTambién puedo ayudarte con: **configuración individual\
    \ de equipos del lazo** (`Confg.Equipos`), **cableado del lazo con aisladores\
    \ de cortocircuito** o **entradas de placa de la DXc**.\n\n---\n\U0001F4CB **Obligaciones\
