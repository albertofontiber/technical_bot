  bot_answer: "# ASD535 — Diagnóstico de fallo de flujo bajo\n\n## Causa más probable\n\
    \nUn valor de flujo **por debajo del 100 %** apunta directamente a una **obstrucción\
    \ en el conducto de aspiración** [F1][F5]. Según el manual, el fallo se dispara\
    \ cuando la variación supera el **±20 %** (es decir, flujo **por debajo del 80\
    \ %**), transcurrido un tiempo de retardo de **300 s** de la LS-Ü [F3].\n\nEl\
    \ código de fallo asociado es el **código 001 — Obstrucción, conducto de aspiración**\
    \ [F2].\n\n---\n\n## Procedimiento de diagnóstico paso a paso\n\n### 1. Leer el\
    \ valor de flujo actual\n- Coloca el conmutador del AMB 35 en **posición V** para\
    \ leer el valor de flujo del conducto de aspiración [F5][F7].\n- Compara el valor\
    \ leído con el **protocolo de puesta en funcionamiento**.\n- Si el valor está\
    \ **por debajo del 90 %** (con sensibilidad LS-Ü estándar de ±20 %), ya es señal\
    \ de inspección obligatoria aunque no haya disparado fallo todavía [F5].\n\n###\
    \ 2. Verificar la tensión de alimentación\n- Mide en los **bornes 1 (+) y 2 (-)**\
    \ del AMB 35 [F5][F7]:\n  - Funcionamiento a **12 V-CC**: rango nominal **12,3\
    \ a 13,8 V-CC** [F5]\n  - Funcionamiento a **24 V-CC**: rango nominal **21,6 a\
    \ 27,6 V-CC** [F5]\n- Una tensión fuera de rango puede provocar funcionamiento\
    \ defectuoso [F7].\n\n### 3. Inspeccionar el conducto de aspiración (código 001)\n\
    Según el código **001** del manual [F2], comprueba en este orden:\n- **Orificios\
    \ de aspiración**: verificar que no estén tapados o sucios.\n- **Salida de aire\
    \ del ASD**: comprobar si hay obstrucción.\n- **Caja de filtro / unidad de filtrado**:\
    \ inspeccionar y limpiar.\n- **Sensor de flujo de aire**: inspeccionar y limpiar.\n\
    \n### 4. Descartar otros códigos de fallo\nConsulta el código de evento en el\
    \ AMB 35 (posición de conmutador **E**) [F4] para identificar si el fallo es:\n\
    \n- **Código 001** — Obstrucción → inspeccionar y limpiar conducto [F2]\n- **Código\
    \ 002** — Rotura de tubo → comprobar uniones, racores, transiciones flexibles,\
    \ orificio de inspección [F2]\n- **Código 004** — Parámetros LS-Ü no válidos →\
    \ punto de funcionamiento fuera de rango; posible sensor defectuoso [F2]\n- **Código\
    \ 008** — Sensor de flujo defectuoso/inexistente → verificar conexión y cable;\
    \ sustituir si procede [F2]\n\n### 5. Limpieza de sensores de humo (si aplica)\n\
    Si al abrir la caja se detecta suciedad en las cámaras de los sensores de humo,\
    \ limpiarlas con **pincel suave y seco**, o con **nitrógeno o aire comprimido\
    \ sin aceite** [F5].\n\n---\n\n## ⚠️ Advertencia importante\nAntes de realizar\
    \ cualquier trabajo de mantenimiento, **bloquea o desconecta el control de incendios\
    \ y la alerta remota en la CDI de orden superior** para evitar disparos no deseados\
    \ [F5].\n\nAdemás, ten en cuenta que en **posiciones de conmutador W01 a W48**,\
    \ los valores de monitorización del flujo **no están homologados según EN 54-20**\
    \ y solo deben usarse previa consulta con el fabricante [F3].\n\n---\n\n**Fuente:**\
    \ ASD535_TD_T131192es_h (sin revisión registrada)\n\n---\n\nTambién puedo ayudarte\
    \ con: **procedimiento de reset inicial tras la limpieza**, **lectura de códigos\
    \ de evento en posición E del AMB 35** o **comprobación funcional de la monitorización\
    \ del flujo (prueba de tapado de orificios)** del ASD535.\n\n---\n⚠️ **Información\
    \ adicional del manual:**\n- \"Para evitar que los controles de incendios, las\
    \ alertas remotas y las zonas de extinción se disparen al llevar a cabo los trabajos\
    \ de mantenimiento, es **imprescindible** bloquearlos o desconectarlos previamente.\"\
    \ [F5]\n- Nota: el manual también indica: \"1. Bloquear o desconectar el control\
    \ de incendios y la alerta remota en la CDI de orden superior.\n2. La tensión\
    \ de alimentación de la CDI debe estar configurada para la central conforme a\
    \ la normativa de mantenimiento.\n3. Debe comprobarse que la entrada del conducto\
    \ de aspiración y los tapones de tubo del orificio de entrada de la caja del detector\
    \ que no está en uso (ASD 535-1 y ASD 535-3) están en la posición correcta.\n\
    4. Debe comprobarse si existe suciedad en la salida de aire, en cuyo caso deberá\
    \ limpiarse.\n5. En caso de que el ASD 535 se utilice para la vigilancia de equipos\
    \ y se hayan instalado transiciones insertadas de tubo rígido a tubo flexible,\
    \ debe comprobarse que dichas transiciones están colocadas correctamente (sin\
    \ fugas).\n6. Debe abrirse la cubierta de la caja del detector y fijarse en la\
    \ posición media de anclaje del fondo de la caja. **Atención**: conexión de cable\
    \ plano (véanse también los cap. 5.4.1 y 7.1). Deberán efectuarse las siguientes\
    \ mediciones:\n   * Medir la tensión de servicio en los bornes 1 (+), 2 (-) \U0001F87A\
    \ Valor nominal = 12,3 a 13,8 V-CC (funcionamiento a 12 V-CC) o 21,6 a 27,6 V-CC\
    \ (funcionamiento a 24 V-CC).\n   * Leer el valor de flujo de aire del conducto\
    \ de aspiración en la posición de conmutador V (véase para ello el cap. 7.6.1)\
    \ y comparar con el protocolo de puesta en funcionamiento. Si existe una desviación\
    \ superior a la mitad de la sensibilidad establecida (véanse ejemplos ➀ y ➁),\
    \ deberá realizarse una inspección del conducto de aspiración de la siguiente\
    \ manera:\n     - Un **aumento** del valor (superior al 100 %) implica una **rotura\
    \ de tubo** inminente \U0001F87A Comprobar si el conducto de aspiración tiene\
    \ fugas (puntos de unión, racores, etc.)\n     - Una **disminución** del valor\
    \ (inferior al 100 %) implica una **obstrucción** inminente \U0001F87A Comprobar\
    \ si el conducto de aspiración está obstruido y limpiarlo según el **punto 9**\
    \ o el **punto 10**.\n   * ➀ Sensibilidad de LS-Ü establecida = ±20 % (estándar);\
    \ la mitad = ±10 %. También deberá realizarse una inspección del conducto de aspiración\
    \ cuando el valor caiga por debajo del 90 % o suba por encima del 110 %.\n   *\
    \ ➁ Sensibilidad de LS-Ü establecida = ±50 % (no conforme a EN 54-20); la mitad\
    \ = ±25 %. También deberá realizarse una inspección del conducto de aspiración\
    \ cuando el valor caiga por debajo del 75 % o suba por encima del 125 %.\n7. Debe\
    \ desconectarse el ASD (extraer el bloque de bornes 1/2 y, en su caso, 3/4 del\
    \ AMB 35), desconectar con cuidado la conexión de cable plano con la unidad de\
    \ control y retirar completamente la cubierta de la caja del detector. Una vez\
    \ desconectado el cable plano de los sensores de humo, estos deberán extraerse\
    \ del ASD con cuidado.\n8. El espacio interior de las cámaras de los sensores\
    \ de humo y la rejilla protectora contra insectos deberán limpiarse con un pincel\
    \ suave y seco. Para la limpieza también puede emplearse nitrógeno o aire comprimido\
    \ sin aceite.\" [F5]\n- Nota: el manual también indica: \"En las posiciones de\
    \ conmutador A11 a C32, cualquier variación de este valor que supere el ±20 %\
    \ – es decir, por debajo del 80 % (suciedad/obstrucción) o por encima del 120\
    \ % (rotura de tubo) – disparará un aviso «fallo flujo de aire» una vez transcurrido\
    \ el tiempo de retardo de 300 s de la LS-Ü.\" [F3]"
