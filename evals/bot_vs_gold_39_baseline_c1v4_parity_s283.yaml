  bot_answer: '# Central de Detección de Gas Fidegas CS4 — Características Técnicas
    y Diferencias entre Versiones


    ## Características técnicas generales


    Las siguientes especificaciones son comunes a ambas versiones (analógica y digital)
    [F2]:


    - **Tensión de alimentación:** 110–230 Vac, 50–60 Hz

    - **Potencia:** 30 W

    - **Sensores:** hasta 4 conexiones en modo analógico o digital

    - **Salidas:** 2 salidas conmutadas LP (relé apto para 230 Vac) con contactos
    NA-C-NC

    - **Corriente máxima:** 250 mA

    - **Rearme:** seleccionable manual o automático

    - **Indicaciones:** presencia, alarma y avería por sensor, avería de central,
    corte de red

    - **Dimensiones:** 90 × 106 × 58 mm

    - **Peso:** 300 g

    - **Firmware:** versión 1.2 [F1][F7]

    - **Clase:** Clase II [F1][F7]


    ## Entradas según versión


    La central dispone de 4 entradas que operan en dos modos distintos según la versión
    [F3]:


    - **Versión analógica:** entradas de señal **4–20 mA**

    - **Versión digital:** entradas de señal **0–10/15 V**


    ## Diferencias entre versiones


    ### Código de producto [F2]

    - **Versión digital:** 3244

    - **Versión analógica:** 3270


    ### Sensores compatibles [F1]


    **Versión analógica:**

    - Sensores S/3 gases combustibles

    - Sensores S/3 y S/2 gases tóxicos

    - Sensores S/10 gases tóxicos


    **Versión digital:**

    - Sensores S/10 gases combustibles


    > ⚠️ **Nota importante:** la versión digital solo es compatible con sensores S/10
    de gases combustibles, mientras que la versión analógica admite una gama más amplia
    de sensores (combustibles y tóxicos, series S/2, S/3 y S/10).


    ## Indicaciones luminosas y acústicas [F3]


    - **LED verde PWR:** alimentación presente (fijo) / corte de red (intermitente)

    - **LED bicolor ON/ALARM** por sensor: presencia de sensor remoto (verde) / alarma
    (rojo)

    - **LED amarillo ERROR** por sensor: avería de sensor remoto

    - **LED verde OUT1 y OUT2:** salida activa (verde) / desactivada (apagado)

    - **Avisador acústico:** apoyo sonoro a las indicaciones ópticas


    ## Instalación


    Apta para montaje en **carril DIN** o en **armario de superficie** [F3].


    ---


    Fuente: Manual de Usuario CS4 (Analógica o Digital), elaborado en Revisión 2,
    10/2018, C.A.E., S.L. — Fidegas®


    ---


    También puedo ayudarte con: **conexionado de sensores S/3 o S/10 a la CS4**, **configuración
    del modo de rearme** o **funcionamiento del ciclo de arranque y gestión de alarmas**.


    ---

    📋 **Obligaciones de evidencia del manual:**

    - Nota: la fuente es inconsistente: "Permite la conexión de hasta 4 sensores remotos
    simultaneos a través de sus 4 entradas digitales (0-10/15 v) o analógicas (4-20
    mA)." (Manual-de-Usuario-CS4, p. 4) [F3] declara 4 sensores y la enumeración servida
    lista 6 (Manual-de-Usuario-CS4, p. 4) [F3].

    - "Ningún sistema de detección de gas sustituye a una correcta instalación y mantenimiento
    de los aparatos quemadores de gas y debe ser colocado por una persona competente
    o un instalador autorizado." (Manual-de-Usuario-CS4, p. 2) [F7]'
