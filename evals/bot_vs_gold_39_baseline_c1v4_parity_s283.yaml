  bot_answer: "# Configuración de Maniobras (Causa-Efecto) en la CAD-250\n\n> ⚠️ **Advertencia\
    \ crítica:** La programación de maniobras es una de las funciones más críticas\
    \ de la configuración del sistema de detección y alarma de incendio. Requiere\
    \ conocimiento específico del sistema instalado, del plan de protección y del\
    \ producto [F5].\n\n---\n\n## Concepto previo\n\nUna maniobra es un conjunto de\
    \ acciones programadas en función de los estados del sistema, áreas, zonas o dispositivos\
    \ [F1]. La estructura es siempre: **Entradas (Eventos) → Lógica (Coincidencias)\
    \ → Salidas (Acciones)** [F1].\n\n> ⚠️ El sistema gestiona **eventos** (cambios\
    \ de estado), no estados. El evento es el cambio de estado; si coincide con la\
    \ condición establecida, provoca la activación de las salidas [F3].\n\nEl sistema\
    \ soporta hasta **100.000 entradas y salidas** configuradas en distintas maniobras\
    \ [F8].\n\n---\n\n## PASO 1 — Acceder al menú de maniobras\n\n**Desde el panel\
    \ (interfaz local):**\n**MENÚ** → **MANIOBRAS** → **+AÑADIR** [F1]\n\n**Desde\
    \ el software de configuración:**\nAccede a la ventana **CREACIÓN DE MANIOBRA**\
    \ [F7]\n\n---\n\n## PASO 2 — Crear la maniobra y definir Coincidencias\n\nAl pulsar\
    \ **AÑADIR** se accede a la pantalla de edición de la maniobra [F2].\n\nEl campo\
    \ **COINCIDENCIAS** define cuántos eventos deben cumplirse simultáneamente para\
    \ que la maniobra se ejecute [F2] [F6]:\n\n- **Coincidencias = 1** → Lógica **OR**:\
    \ cualquiera de los eventos activa la salida [F2] [F6]\n- **Coincidencias = 2**\
    \ (con 2 eventos) → Lógica **AND**: todos los eventos deben cumplirse [F2] [F6]\n\
    - **Coincidencias = N de M** → Se deben cumplir N eventos de los M configurados\
    \ (lógica \"N de N\") [F2]\n\n---\n\n## PASO 3 — Añadir Entradas (Eventos)\n\n\
    1. Pulsa **AÑADIR** en el margen inferior de la pantalla [F3]\n2. En la pantalla\
    \ emergente, selecciona **EVENTO** [F3]\n3. Elige el tipo de evento [F3]:\n  \
    \ - **ENTIDAD**: cualquier elemento de la jerarquía del sistema\n   - **CONDICIÓN\
    \ TEMPORAL**: periodo de tiempo durante el cual la ecuación de entrada es verdadera\n\
    \n### Si seleccionas ENTIDAD:\n\nPuedes seleccionar entidades del sistema **local**\
    \ (central actual) o de la **red** (cualquier central en red) [F3].\n\nLos parámetros\
    \ que debes definir para cada evento son [F5]:\n\n- **Origen:** Local o red [F5]\n\
    - **Entidad:** Instalación, panel, lazo, área, zona, dispositivo, grupo o módulo\
    \ virtual [F5]\n- **Condición:** Alarma, avería, técnico [F5]\n- **Tipo:** Todos,\
    \ pulsador, detector o entradas [F5]\n- **Estado lógico:** Normal o Negado (si\
    \ se selecciona Negado con condición \"alarma\", la condición será válida si **no**\
    \ hay alarma) [F5]\n- **Repeticiones:** Valor entero hasta **9999**; el evento\
    \ debe repetirse ese número de veces en la entidad para que la entrada sea válida\
    \ [F3] [F5]\n\n> **Nota:** Desde la versión **1.1.1** es posible seleccionar un\
    \ elemento de **salida** como condición de entrada. En ese caso, será el cambio\
    \ a condición de avería el que hará verdadera la condición entrante. Para ello,\
    \ desmarca la casilla **\"Sólo dispositivos de entrada\"** [F7].\n\nPuedes añadir\
    \ tantos eventos como necesites. En el software, arrastra la entidad desde la\
    \ ventana de eventos al cuadro de la maniobra [F7].\n\n---\n\n## PASO 4 — Añadir\
    \ Salidas (Acciones)\n\n1. Pulsa **AÑADIR** en el margen inferior de la pantalla\
    \ [F4]\n2. En la pantalla emergente, selecciona **ACCIÓN** [F4]\n3. Se muestran\
    \ dos campos [F4]:\n   - **RETRASO:** tiempo configurable entre **0 y 600 segundos**\
    \ antes de iniciar la acción [F4] [F5]\n   - **ENTIDAD:** elemento de la jerarquía\
    \ del sistema local al que se aplicará la acción [F4]\n\n> ⚠️ Las acciones siempre\
    \ son relativas a la entidad seleccionada. **El programa no permite mezclar acciones\
    \ sobre entidades de paneles diferentes** [F8].\n\n### Parámetros de la acción\
    \ (pantalla ACCIÓN DE LA ENTIDAD) [F4] [F9]:\n\n**Destino (Entidad):**\n- Panel,\
    \ lazo, área, zona, dispositivo, grupo o módulo virtual [F5]\n\n**Acción disponible:**\n\
    - **Activar** las salidas [F9]\n- **Desactivar** las salidas [F9]\n- **Habilitar**\
    \ la entidad [F9]\n- **Deshabilitar** la entidad [F9]\n- **Test**: pone en modo\
    \ test la entidad [F9]\n- **Reiniciar** la entidad [F9]\n- **Pulso**: activa las\
    \ salidas con anchura de pulso configurable entre **0 y 600 segundos** (10 s por\
    \ defecto) [F9]\n- **Configuración**: permite la cancelación de retardos [F9]\n\
    \n**Tipo de elemento:**\n- **Todos:** todas las salidas de la entidad [F9]\n-\
    \ **Sirenas:** únicamente las sirenas de la entidad [F9]\n- **Relés:** únicamente\
    \ los relés de la entidad [F9]\n- **Sirena discontinua:** activa en forma discontinua\
    \ las sirenas de la entidad [F9]\n- **Sirena PCB1:** activa la sirena 1 de la\
    \ central [F9]\n- **Sirena PCB2:** activa la sirena 2 de la central [F9]\n\n>\
    \ Las opciones disponibles dependen de la entidad seleccionada [F9].\n\n---\n\n\
    ## PASO 5 — Guardar y verificar\n\n- Pulsa **GUARDAR** para actualizar la base\
    \ de datos [F9]\n- Pulsa **CANCELAR** para deshacer los cambios [F9]\n- Desde\
    \ el icono **MANIOBRAS** en el **MENÚ PRINCIPAL** puedes ver el listado de maniobras\
    \ con el resumen de eventos y acciones de cada una [F9] [F10]\n\n---\n\n## Funcionalidades\
    \ avanzadas disponibles\n\nEl menú de maniobras también incluye [F1]:\n\n- **Grupos:**\
    \ asociaciones de elementos (áreas, zonas, dispositivos) para facilitar la creación\
    \ de reglas de actuación [F1]\n- **Módulos virtuales:** permiten crear bucles\
    \ interdependientes; un conjunto de entradas determina el estado del módulo virtual,\
    \ que a su vez puede actuar como entrada de otra maniobra [F1] [F11]\n- **Estado\
    \ VM:** visualización y activación de módulos virtuales desde la pantalla principal\
    \ [F1]\n\n---\n\n**Fuentes:**\n- CAD-250 Manual de Configuración MC-380-es-2026-c\
    \ (rev. c, 2026-04-23)\n- CAD-250 Manual Software de Configuración MS-416-es-2026-b\
    \ (rev. b)\n\n---\n\nTambién puedo ayudarte con: **configuración de Grupos**,\
    \ **creación de Módulos Virtuales** o **ejemplo práctico de maniobra con condición\
    \ temporal** en la CAD-250.\n\n---\n\U0001F4D6 **Obligaciones de evidencia del\
    \ manual:**\n- \"Seleccione el elemento de cualquiera de los dos cuadrid de la\
    \ maniobra, eventos o acciones y pulse este botón para borrarlo,\" (CAD-250_Manual-software-configuracion-MS-416-es-2026-b,\
    \ p. 56) [F8]\n- \"**Editar.** Seleccione el elemento de cualquiera de los dos\
    \ cuadrid de la maniobra, eventos o acciones y pulse este botón para entrar en\
    \ el menú de edición del elemento.\" (CAD-250_Manual-software-configuracion-MS-416-es-2026-b,\
    \ p. 56) [F8]"
