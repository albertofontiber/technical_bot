  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: "# Cableado y configuración de lazo — Notifier INSPIRE E10/E15\n\n---\n\
    \n## PARTE 1: CABLEADO FÍSICO DEL LAZO\n\n### Módulo de lazo OPAL X2 (HOP-433-100)\n\
    \nEl módulo de lazo es de **color morado** [F2] y dispone de **10 terminales**\
    \ distribuidos en dos filas de 5 [F2][F3]:\n\n**Lazo 1:**\n- Terminal **1** →\
    \ Lazo 1 Salida +VE\n- Terminal **2** → Lazo 1 Salida -VE\n- Terminal **3** →\
    \ ⊕ (**NO usar para pantalla de cable**)\n- Terminal **4** → Lazo 1 Entrada +VE\n\
    - Terminal **5** → Lazo 1 Entrada -VE\n\n**Lazo 2:**\n- Terminal **6** → Lazo\
    \ 2 Salida +VE\n- Terminal **7** → Lazo 2 Salida -VE\n- Terminal **8** → ⊕ (**NO\
    \ usar para pantalla de cable**)\n- Terminal **9** → Lazo 2 Entrada +VE\n- Terminal\
    \ **10** → Lazo 2 Entrada -VE\n\n> ⚠️ **IMPORTANTE:** La pantalla del cable de\
    \ lazo debe conectarse a la **barra de tierra** de la central, NO a los terminales\
    \ 3 u 8 [F2][F3]. Se recomienda poner a tierra **un solo extremo** de la pantalla\
    \ [F7].\n\n> ⚠️ **NO mezclar dispositivos OPAL y CLIP en el mismo lazo** [F2].\n\
    \n---\n\n### Capacidad del lazo\n\n**Modo OPAL** [F2][F4]:\n- Hasta **159 detectores**\
    \ OPAL por lazo\n- Hasta **159 módulos** OPAL por lazo\n- Máximo **750 mA** por\
    \ lazo\n\n**Modo CLIP** (requiere licencia) [F4][F9]:\n- Hasta **99 detectores**\
    \ CLIP por lazo\n- Hasta **99 módulos** CLIP por lazo\n\n> ⚠️ **EN54-2 (13.7):**\
    \ Restricción de **512 detectores y/o pulsadores** por módulo de lazo (2 circuitos)\
    \ [F2].\n\n**Longitud máxima del lazo:** hasta **3,5 km** dependiendo del tipo\
    \ de carga y cable. Calcular con el **programa de cálculo de lazo y batería de\
    \ CLSS** [F2].\n\n---\n\n### Numeración de lazos\n\nLos circuitos de lazo se numeran\
    \ **secuencialmente de izquierda a derecha** del portamódulos. El primer módulo\
    \ instalado en la ranura izquierda tiene el lazo 1, y los siguientes se numeran\
    \ correlativamente. En la E15 (dos filas), la segunda fila continúa la numeración\
    \ desde la primera [F2].\n\n---\n\n## PARTE 2: COMPROBACIONES PREVIAS CON MULTÍMETRO\n\
    \nAntes de conectar el lazo a la central, realiza estas verificaciones [F5][F6]:\n\
    \n> ⚠️ **NUNCA uses un comprobador de alta tensión (megóhmetro) en el circuito\
    \ de lazo** [F5].\n\n1. Comprueba la **continuidad** de cada parte del lazo y\
    \ mide la **resistencia de extremo a extremo**. Para verificar el límite máximo:\
    \ mide entre Lazo X Entrada -VE y Lazo X Salida -VE con el lazo desconectado de\
    \ la central, **multiplica el resultado por 2** y añade la resistencia de cada\
    \ aislador (**0,1 a 0,13 Ω** por aislador) [F11].\n\n2. Comprueba la **continuidad\
    \ de la pantalla** del cable (debe dar resistencia muy baja) [F5].\n\n3. Verifica\
    \ que **no hay continuidad** entre la pantalla y los cables +VE ni -VE [F5].\n\
    \n4. Con el multímetro en **función de prueba de diodo**, conecta en **polaridad\
    \ invertida** (+VE del multímetro al negativo del lazo, -VE al positivo). Debe\
    \ indicar **símbolo de diodo en polarización directa** [F6].\n\n5. Conecta en\
    \ **polaridad normal** (+VE al positivo, -VE al negativo). Al principio debe leer\
    \ resistencia baja, que **aumenta progresivamente** al cargarse los condensadores\
    \ de los dispositivos [F6].\n   - Si indica diodo en polarización directa en este\
    \ paso → hay dispositivos conectados en **polaridad inversa** o cableado en cortocircuito\
    \ [F6].\n\n6. Comprueba que **no hay conexión** entre la pantalla del cable y\
    \ los cables +VE ni -VE [F6].\n\n> ℹ️ Se recomienda usar la herramienta **POL-200-TS**\
    \ para diagnósticos más detallados; funciona con protocolos OPAL y CLIP [F7].\n\
    \n---\n\n## PARTE 3: CONEXIÓN A LA CENTRAL\n\n**Lazo OPAL:** Una vez verificado\
    \ el cableado, conecta el circuito al bloque de terminales de lazo seleccionado\
    \ en la central [F7].\n\n**Lazo CLIP:** [F7]\n1. Reconecta los aisladores desconectados\
    \ temporalmente, los módulos de lazo y los pulsadores.\n2. Conecta el circuito\
    \ al bloque de terminales de lazo seleccionado.\n\n---\n\n## PARTE 4: PRIMER ENCENDIDO\
    \ Y CONFIGURACIÓN INICIAL\n\n> ⚠️ El **primer encendido** debe realizarse **sin\
    \ cableado externo conectado**, pero con la fuente de alimentación y un circuito\
    \ de lazo probado [F1].\n\n1. Conecta el cableado del lazo y el cable HMI de la\
    \ puerta a la CPU [F1].\n2. Conecta la corriente principal y las baterías (**2\
    \ × 12 V 24 Ah** para E10/E15) [F1].\n3. Al encender, el LED verde **\"Alimentación\"\
    ** se encenderá. Si hay averías, se encenderá el **LED de AVERÍA amarillo** y\
    \ sonará el zumbador → pulsa **Silenciar Zumbador/Mute** [F8].\n4. Selecciona\
    \ **país** e **idioma** en la lista desplegable [F8].\n5. Selecciona **Siguiente**\
    \ → **Ajuste Hora** (horas, minutos, segundos) [F8].\n6. Selecciona **Establecer\
    \ fecha** y configura día, mes y año [F8].\n\n> ℹ️ La fecha/hora debe coincidir\
    \ con la del ordenador portátil para sincronización con el programa **CLSS** [F8].\n\
    \n7. Desplázate a **Información del Sistema** → selecciona ▽ para ampliar y ver\
    \ el módulo de lazo. Inicialmente mostrará **\"Lazo X: 0 Dispositivos — Inicializando...\"\
    ** [F8].\n\n---\n\n## PARTE 5: CONFIGURACIÓN DEL LAZO EN CLSS\n\n> ℹ️ Para lazos\
    \ CLIP o TC800 OPAL/CLIP, la central debe configurarse previamente con **CLSS**\
    \ antes de la Auto Configuración. Por defecto, la central tiene licencia solo\
    \ para **modo OPAL (Protocolo avanzado)** [F9].\n\n1. En CLSS: **Ajustes → Ajustes\
    \ HMI → Tipo de marca** → selecciona **Notifier EN** [F9].\n2. En **Ajustes de\
    \ lazo** [F9]:\n   - Si el lazo **no se usa**: marca ☑ **Sin Uso**\n   - Si se\
    \ usa: selecciona **Limitar a VdS 2540** (Sí/No) — el valor de resistencia cambia\
    \ según la selección\n   - Selecciona el **tipo de cable**\n3. Envía la configuración\
    \ a la central [F9].\n\n---\n\n## PARTE 6: AUTO CONFIGURACIÓN (BÚSQUEDA DE DISPOSITIVOS)\n\
    \n1. En la central, selecciona **Auto Configuración** para buscar dispositivos\
    \ en el lazo. Confirma en la ventana emergente [F10].\n   - Si no hay protocolo\
    \ configurado, el lazo usará **protocolo OPAL** por defecto [F10].\n2. Una vez\
    \ completada, selecciona la flecha **>** junto al botón Auto Búsqueda para ver\
    \ el estado de averías del lazo [F10].\n3. Lee los mensajes de avería y corrige\
    \ los problemas detectados. Selecciona **Hecho** al completar [F10].\n4. Si se\
    \ han corregido averías, **repite los pasos 1 a 3** [F10].\n5. **Repite el proceso\
    \ para cada lazo** hasta descubrir todos [F10].\n\n**Causas típicas de averías\
    \ tras Auto Configuración** [F10]:\n- Discordancia entre diseño e instalación\n\
    - Averías en el cableado\n- Presencia de fuente de RFI fuerte\n- Error de módulo\
    \ o fuente de alimentación\n- Conexionado incorrecto en dispositivos\n\n---\n\n\
    **Fuente:** HOP-138-8ES issue 6 (01-2026) — Instrucciones de puesta en marcha\
    \ INSPIRE E10/E15; HOP-138-9ES issue 5 (11-2025) — Manual de instalación INSPIRE\
    \ E10\n\n---\n\U0001F4D6 **Información adicional del manual:**\n- \"- Left side:\
    \ CPU module with 6 connection terminals and external wiring connection point\
    \ ②\n- Center top: HMI cable connection detail showing CPU with points \"a\" and\
    \ \"b\" marked as ①\n- Center middle: Central unit internal view showing wiring\
    \ connections with color-coded wires (brown, yellow/green, blue) connecting to\
    \ L and N terminals, marked as ②\n- Right side: Power supply terminal block showing\
    \ L (brown wire) and N (blue wire) connections with earth (yellow/green wire)\n\
    - Bottom center: Battery connection diagram showing 2 x 12 V 24 Ah batteries with\
    \ positive and negative terminals, marked as ③\n- Bottom right: Circular detail\
    \ view showing battery terminal connection with + and - markings]\" [F1]"
