  bot_answer: '# FAAST LT-200 — Salidas de relé y sirena


    > **Nota previa:** Los fragmentos provienen de dos variantes del FAAST LT-200
    con diferencias entre sí: la versión **Stand Alone** (I56-6574-005_ES) y la versión
    **Loop** (I56-6575-005_ES / I56-6577-006_ES). Se presentan por separado donde
    difieren.


    ---


    ## 1. Relés disponibles y comportamiento


    ### Versión Stand Alone (I56-6574-005_ES)


    - **Relé de ALARMA 1 / 2** — Se activa cuando se cumple la condición de alarma
    en el canal correspondiente. Condición predeterminada = Nivel 1. El estado de
    alarma **está enclavado por defecto**; se necesita un rearme manual para desactivar
    el LED y el relé [F1].

    - **Relé de PREALARMA 1 / 2** — Se activa cuando se cumple la condición de prealarma
    en el canal. Condición predeterminada = Nivel 1. Cuando PREALARMA = ALARMA = Nivel
    1, la prealarma se activará al **70 % del Nivel 1** [F1].

    - **Relé de AVERÍA 1 / 2** — Se activa ante una condición de avería en el canal
    1 o 2, o ante una avería común. También se activa en **modo de servicio** y cuando
    **se desconecta la alimentación de la unidad**. El estado de avería **no está
    enclavado** (predeterminado) [F1].

    - **Salida SIRENA 1 / 2** — Se activa cuando el canal está en **ALARMA o PREALARMA**.
    La sirena 1 corresponde al canal 1 y la sirena 2 al canal 2. Estado predeterminado
    = activada en ALARMA [F1].


    ### Versión Loop / Notifier (I56-6575-005_ES / I56-6577-006_ES)


    - **Relé de ALARMA 1 / 2** — Controlado por el panel cuando determina que se da
    la condición de alarma. Encendido y apagado por el panel; **no enclavado** [F2].

    - **Relé de AVERÍA 1 / 2** — Igual que en Stand Alone: se activa ante avería en
    canal 1 o 2 o avería común, en modo de servicio y cuando **se desconecta la alimentación**.
    **No enclavado** [F2].

    - **Salida SIRENA 1 / 2** — Se activa cuando el canal está en **ALARMA** (en esta
    variante no menciona prealarma). Sirena 1 → canal 1, sirena 2 → canal 2. Estado
    predeterminado = activada en ALARMA [F2].

    - ⚠️ En la versión Loop **no aparece relé de PREALARMA** en la tabla de relés
    [F2].


    ---


    ## 2. Comportamiento del relé de avería ante fallo o corte de alimentación


    En **ambas variantes**:


    - El relé de avería se activa ante cualquier **condición de avería** en el canal
    1 o 2, o ante una **avería común** [F1][F2].

    - También se activa cuando la unidad está en **modo de servicio** [F1][F2].

    - También se activa cuando **se desconecta la alimentación de la unidad** (corte
    de suministro) [F1][F2].

    - El estado de avería **no está enclavado** (predeterminado): se desactiva automáticamente
    cuando desaparece la condición, sin necesidad de rearme manual [F1][F2].


    ---


    ## 3. Contactos de los relés (terminales de cableado)


    ### Versión Stand Alone — terminales [F6]


    **Relé de alarma canal 1** (bloque T1):

    - Terminal 5: Relé de alarma **NC** — C1

    - Terminal 6: Relé de alarma **C** (común) — C1

    - Terminal 7: Relé de alarma **NA** — C1


    **Relé de alarma canal 2** (bloque T2):

    - Terminal 8: Relé de alarma **NC** — C2

    - Terminal 9: Relé de alarma **C** (común) — C2

    - Terminal 10: Relé de alarma **NA** — C2


    **Relé de avería canal 1** (bloque T3):

    - Terminal 11: Relé de avería **NC** — C1

    - Terminal 12: Relé de avería **C** (común) — C1

    - Terminal 13: Relé de avería **NA** — C1


    **Relé de avería canal 2 (AUX.)** (bloque T4):

    - Terminal 14: Relé de avería **NC** (AUX.) — C2

    - Terminal 15: Relé de avería **C** (AUX.) — C2

    - Terminal 16: Relé de avería **NA** (AUX.) — C2


    **Relé de prealarma canal 1** (bloque T9):

    - Terminal 23: Relé de prealarma **NC** — C1

    - Terminal 24: Relé de prealarma **C** (común) — C1

    - Terminal 25: Relé de prealarma **NA** — C1


    **Relé de prealarma canal 2** (bloque T10):

    - Terminal 26: Relé de prealarma **NC** — C2

    - Terminal 27: Relé de prealarma **C** (común) — C2

    - Terminal 28: Relé de prealarma **NA** — C2


    **Salidas de sirena** (bloques T5 y T6):

    - Terminal 17: Salida sirena 1 **−**

    - Terminal 18: Salida sirena 1 **+**

    - Terminal 19: Salida sirena 2 **−**

    - Terminal 20: Salida sirena 2 **+**


    ### Versión Loop — terminales [F5]


    La asignación de relés de alarma (T2/T3), avería (T4/T5) y sirenas (T6/T7) es
    equivalente en numeración de terminales (1–20), con la diferencia de que **no
    existen terminales de prealarma** en esta variante; los terminales 23–28 están
    asignados a lazo y aislador [F5].


    ---


    ## 4. Resistencia de fin de línea en salidas de sirena


    - Salida sirena 1 (terminales 17/18): **47 kΩ** [F5][F6]

    - Salida sirena 2 (terminales 19/20): **47 kΩ** [F5][F6]


    Las resistencias de fin de línea de **47 kΩ** se suministran con la unidad (2
    unidades incluidas en el kit) [F7].


    ---


    ## 5. Especificación eléctrica de los contactos de relé


    Aplicable a ambas variantes [F3][F4]:


    - Potencia nominal de los contactos (carga resistiva **30 V CC**): máx. **2 A**

    - Potencia nominal de los contactos (carga resistiva **30 V CA**): máx. **0,5
    A**

    - Vida útil mínima: **10⁵ operaciones**


    ---


    **Fuentes:**

    - I56-6574-005_ES — HS Stand Alone FAAST LT-200 QIG (sin revisión registrada)

    - I56-6575-005_ES — FAAST LT-200 Loop QIG (sin revisión registrada)

    - I56-6577-006_ES — FAAST Notifier LT-200 QIG (sin revisión registrada)


    ---


    También puedo ayudarte con: **conexionado de la entrada configurable de rearme**,
    **configuración de niveles de alarma/prealarma** o **puesta en marcha y prueba
    funcional** del FAAST LT-200.'
