  question: En la Notifier ID3000, ¿cómo se programa una zona para que active una
    salida de sirena solo cuando haya coincidencia de dos detectores?
  gold_estado: verificado
  conducta_esperada: answer
  conducta_bot: answer
  veredicto: PARCIAL
  diagnostico: 'La respuesta acierta lo esencial: usar la Matriz de Control con entrada
    ALARMA por zona/subzona, seleccionar COINCIDENCIA 2 EQUIPOS, exigir misma zona/subzona
    y no incluir pulsadores manuales. Pero queda incompleta/imprecisa en la programación
    de la salida de sirena, omite pasos relevantes del flujo oficial como ''UNA ÚNICA
    zona'', selección SMART ''Normal (Combinada) Alarma'', confirmación y detalles
    de niveles de coincidencia, y el procedimiento PK-ID3000 queda truncado.'
  bot_sources:
