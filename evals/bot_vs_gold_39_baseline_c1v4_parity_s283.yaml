  - AM-8200-manu-prog-spa
  - UCIP MODBUS AM8200 V5.1
  coverage_status: appended
  coverage_appended_rows: 1
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: "# Cálculo de capacidad de batería — AM-8200\n\nEl manual proporciona\
    \ un método de cálculo estructurado en tablas. Te explico el procedimiento completo:\n\
    \n---\n\n## Fórmula general\n\n**Ah Batería = (A + B) × 1,2** [F5][F6]\n\nDonde:\n\
    - **A** = Amperios-hora en condiciones de espera (reposo)\n- **B** = Amperios-hora\
    \ en condiciones de alarma\n- **1,2** = Factor de corrección por tolerancias de\
    \ fabricación de las baterías [F4]\n\n---\n\n## Paso a paso\n\n**1. Calcular la\
    \ corriente total en reposo (columna \"NO ALARMA\")**\n\nSuma los consumos de\
    \ todos los componentes instalados usando la **Tabla 1** (para AM-8200) o **Tabla\
    \ 2** (para AM-8200BB) [F6][F5]:\n\nPara la **AM-8200** (Tabla 1) [F6]:\n- AM-8200\
    \ CPU (AM8200-KLCD): **179 mA**\n- LIB-8200 (por unidad): **50 mA**\n- AM82-2S2C:\
    \ **28 mA**\n- AM82-BST-C: **39 mA**\n- Corriente de lazos: ver **Tabla 3** [F6]\n\
    - Corriente salida usuario: máx. **2 A** [F6]\n- Campanas / Sirenas / Flashes\
    \ en reposo: **0** [F6]\n\nPara la **AM-8200BB** (Tabla 2) [F5]:\n- AM-8200BB:\
    \ **135 mA**\n- LIB-8200 (por unidad): **50 mA**\n- AM82-2S2C: **28 mA**\n- AM82-BST-C:\
    \ **39 mA**\n\n**2. Multiplicar por el tiempo de espera requerido**\n\nTotal reposo\
    \ × **(24 h) o (72 h)** = **Espera (A) en Ah** [F6][F5]\n\n> El tiempo aplicable\
    \ (24 h o 72 h) depende de la normativa vigente en la instalación. El manual no\
    \ especifica cuál elegir en los fragmentos disponibles — consúltalo con la normativa\
    \ aplicable.\n\n**3. Calcular la corriente total en alarma (columna \"ALARMA\"\
    )**\n\nPara la **AM-8200** (Tabla 1) [F6]:\n- AM-8200 CPU (AM8200-KLCD): **345\
    \ mA**\n- LIB-8200: **92 mA**\n- AM82-2S2C: **28 mA**\n- AM82-BST-C: **39 mA**\n\
    - Corriente de lazos en alarma: la central enciende **solo los primeros 6 LED**\
    \ de detectores y módulos en alarma [F4]\n- Corriente total de todos los lazos\
    \ debe ser **inferior a 750 mA** [F4]\n- Corriente salida usuario: máx. **2 A**\
    \ [F4]\n\nPara la **AM-8200BB** (Tabla 2) [F5]:\n- AM-8200BB: **177 mA**\n- LIB-8200:\
    \ **92 mA**\n- AM82-2S2C: **28 mA**\n- AM82-BST-C: **39 mA**\n\n**4. Multiplicar\
    \ por el tiempo de alarma**\n\nTotal alarma × **0,5 h** = **Alarma (B) en Ah**\
    \ [F6][F5]\n\n**5. Aplicar la fórmula final**\n\n**Ah Batería = (A + B) × 1,2**\
    \ [F5][F6]\n\n---\n\n## Límites y restricciones a tener en cuenta\n\n- Si la absorción\
    \ calculada supera **3,5 A**, la corriente en exceso durante alarma se extrae\
    \ de las baterías [F4]\n- La corriente total en la línea de 24 Vcc debe ser **inferior\
    \ a 2 A** [F4]\n- La corriente total de todos los lazos debe ser **inferior a\
    \ 750 mA** [F4]\n\n---\n\n## Capacidad admitida y baterías recomendadas\n\n- Número\
    \ de baterías: **2 × 12 V**, mín. **7 Ah**, máx. **18 Ah** [F3]\n- Baterías recomendadas\
    \ (17-18 Ah) [F3]:\n  - Yuasa NP18-12B o NP7-12BFR (UL94): 12 V / 17,2 Ah — 181\
    \ × 77 × 167 mm\n  - Fiamm FG21803 o FGV21803 (UL94): 12 V / 18 Ah — 181 × 77\
    \ × 167 mm\n- Referencia rápida en tabla de resumen: **12 V – 18 Ah** [F9]\n\n\
    ---\n\n> ⚠️ El manual indica que los consumos de los dispositivos de lazo deben\
    \ obtenerse de las **fichas de datos del fabricante** de cada dispositivo instalado\
    \ [F4].\n\n**Fuente:** AM-8200 Manual de Instalación (Doc. AM-8200-ESP Rev. A.3)\n\
    \n---\n\nTambién puedo ayudarte con: **consumos detallados por tarjeta**, **conexionado\
    \ de baterías al cargador** o **umbrales de señalización de batería agotada**\
    \ de la AM-8200.\n\n---\n⚠️ **Información adicional del manual:**\n- \"4 La corriente\
    \ en las condiciones de reposo o alarma no puede superar, en ningún caso, la capacidad\
    \ de la fuente de alimentación.\" [F4]\n\n---\n\U0001F4D6 **Obligaciones de evidencia\
    \ del manual:**\n- \"Calcular la corriente total necesaria para todos los lazos\
    \ usando **la tabla 2 (ver a continuación)** teniendo presente que la central\
    \ enciende **solo los primeros 6 LED** de los detectores y módulos de entrada\
    \ en alarma.\" (AM-8200 Manual Instalacion, p. 53) [F4]"
