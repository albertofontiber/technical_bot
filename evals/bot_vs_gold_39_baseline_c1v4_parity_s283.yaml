    - Ajuste del nivel de prealarma\n- Selección de programación horaria (cambio de\
    \ sensibilidad)\n- Grupo AWACS (**50 grupos** con todos los sensores CLIP salvo\
    \ HEAT)\n- Retardo de alarma\n- Ajuste no silenciable para LED remoto (solo Opal)\n\
