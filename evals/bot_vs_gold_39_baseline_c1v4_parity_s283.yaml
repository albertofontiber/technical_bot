  coverage_status: appended
  coverage_appended_rows: 1
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: '## Desactivación de detector en CCD-103: limitación importante


    La **CCD-103 es una central convencional** [F6], y esto tiene una implicación
    directa en tu pregunta: **el manual no describe ningún procedimiento para desactivar
    un detector individual**. La unidad mínima de desconexión es la **zona completa**.


    ---


    ## Lo que sí permite el sistema: desconexión por zona


    El procedimiento para desconectar una zona completa es el siguiente [F2][F3]:


    1. Asegúrate de que la **llave de bloqueo de teclado (G)** está en posición **abierta**
    (ON). Sin esto, las pulsaciones de teclas no tienen efecto [F3].

    2. Localiza la **tecla de zona** correspondiente (Z1, Z2 o Z3) — teclas tipo **(A)**
    en el panel [F3].

    3. **Primera pulsación** → la zona entra en **modo prueba**.

    4. **Segunda pulsación** → la zona queda **desconectada** (modo desconexión).


    Para **reconectar** la zona: pulsa la tecla de zona **una vez** estando en estado
    desconectado [F2].


    ---


    ## Indicaciones visuales tras la desconexión


    Cuando una zona queda desconectada, se activan los siguientes indicadores [F2][F9]:


    - **Indicador ANULAR (4):** encendido fijo de forma continua.

    - **Indicador Avería/Desconexión/Prueba de zona (6):** encendido **fijo** (fijo
    = desconexión; intermitente = avería o prueba).


    ---


    ## ⚠️ Advertencia importante


    El manual indica explícitamente: *"cuando se desconecta una zona, la central no
    refleja ninguna incidencia o evento en la zona desconectada, por lo tanto es importante
    **limitar el uso de esta maniobra**"* [F2].


    Al desconectar la zona, **todos los detectores y pulsadores de esa zona quedan
    sin vigilancia**. No existe en este equipo un mecanismo para aislar un único detector
    dentro del lazo.


    ---


    **Fuente:** CCD-103_Manual_ES_FR_GB_IT (sin revisión registrada)


    ---


    También puedo ayudarte con: **modo prueba de zona**, **conexionado de detectores
    en la zona** o **resolución de averías en zona** de la CCD-103.'
