- qid: hp011
  question: En la Morley RP1r, después de descargar la extinción el sistema no vuelve
    a estado normal tras resetear. ¿Qué comprobar?
  gold_estado: verificado
  conducta_esperada: answer
  conducta_bot: answer
  veredicto: FALLO
  diagnostico: Aunque acierta en comprobar r.I, averías enclavadas y el rearme en
    nivel 2, omite puntos clave como ABORT enclavado, t.A/duración de descarga, Flow
    Press y zonas en alarma. Además introduce parámetros/explicaciones no documentados
    o confusos como un segundo 'ri' y 'F.1', por lo que alucina y puede desorientar
    al técnico.
  bot_sources:
  - HLSI-MA-103_GuiaRapida_RP1r-Supra_ES_lr
  - HLSI-MN-103I_RP1r-Supra_lr
  - HLSI-MN-103_RP1r-Supra_lr
  coverage_status: appended
  coverage_appended_rows: 3
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: '# RP1r-Supra: Sistema no vuelve a estado normal tras reset post-extinción


    Este comportamiento es **esperado por diseño** según la normativa UNE-EN 12094-1:2004.
    Hay varios puntos a verificar:


    ---


    ## 1. Verificar el parámetro **r.i** (Rearme inhibido tras extinción)


    Según la norma UNE-EN 12094-1:2004, apartado 4.12.2, existe un intervalo de tiempo
    programable durante el cual el sistema **inhibe el rearme** tras la extinción
    [F12].


    Los valores posibles del parámetro **r.i** son [F12]:


    - **- -** → Rearme inhibido hasta finalizar extinción o cuando se agote el tiempo
    configurado en el parámetro **t.Fi** (t.A → 0 seg.)

    - **00** → Rearme permitido en cualquier momento *(valor por defecto)*

    - **01 a 30** → Rearme inhibido durante el intervalo definido en minutos


    **Acción:** Accede a la configuración y comprueba el valor de **r.i**. Si está
    configurado con un valor de 01 a 30, el sistema no permitirá el rearme hasta que
    transcurra ese tiempo.


    ---


    ## 2. Verificar el parámetro **ri** (Resumen inhibido tras extinción)


    Existe también el parámetro **ri** que, de acuerdo con la norma UNE-EN 12094-1:2004,
    apartado 4.1.2, establece un intervalo tras el cual el sistema pasa al **estado
    inhibido** para evitar reiniciar el proceso de extinción [F2].


    Los valores posibles son [F2]:


    - **00** → Resumen inhibido desde finalizar extinción o cuando agotado el tiempo
    configurado en **ri** *(por defecto)*

    - **01 a 30** → Resumen inhibido después de intervención o reposición, en minutos


    ---


    ## 3. Comprobar averías enclavadas activas


    **Todas las averías son por defecto enclavadas y requieren rearme manual** para
    su restablecimiento [F7]. Si hay alguna condición de avería activa (presión baja,
    señal de flujo, puerta abierta, etc.), el sistema no volverá a estado normal aunque
    se pulse RESET.


    **Acción:** Revisa los LEDs de avería en el frontal:

    - Led "Avería presión baja" intermitente → entrada **LOW PRESS SWITCH** [F7]

    - Led "Avería presión flujo" intermitente → entrada **FLOW PRESS SWITCH** [F7]

    - Led "C''to. supervisión puerta abierta" intermitente → entrada **DOOR OPEN SWITCH**
    [F7]


    Elimina la causa de la avería antes de rearmar.


    ---


    ## 4. Procedimiento de rearme correcto


    El rearme requiere [F7]:

    1. Acceder con **nivel 2** de acceso

    2. Pulsar la tecla **"Rearme"**


    Esta acción reinicia la central y restablece todas las entradas enclavadas [F7].


    > ⚠️ Si el parámetro **r.i** tiene un valor de 01 a 30 minutos, el rearme no será
    posible hasta que transcurra ese tiempo, incluso con nivel 2 [F12].


    ---


    ## 5. Si ninguna de las anteriores resuelve el problema


    Verifica si el parámetro **F.1** tiene configurado un tiempo de inhibición del
    reset, que según la norma UNE-EN 12094-1:2004, sección 4.12.2, puede inhibir temporalmente
    la función de reset una vez que el control está ACTIVADO [F1].


    ---


    **Fuentes:**

    - HLSI-MN-103_RP1r-Supra_lr (rev. v.07, 2018-05-01)

    - HLSI-MN-103I_RP1r-Supra_lr (sin revisión registrada)

    - HLSI-MA-103_GuiaRapida_RP1r-Supra_ES_lr (sin revisión registrada)


    ---


    También puedo ayudarte con: **configuración del parámetro r.i paso a paso**, **interpretación
    de LEDs de avería en frontal** o **restauración de valores por defecto de la RP1r-Supra**.'
