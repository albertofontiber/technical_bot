- qid: cat017
  question: ¿Como se cablea y se da de alta (configura) un lazo en la central Notifier
    INSPIRE (E10/E15)?
  answer: "# Cableado y configuración de lazo — INSPIRE E10/E15\n\nEl proceso se divide\
    \ en dos fases: **cableado físico** y **configuración mediante CLSS**.\n\n---\n\
    \n## FASE 1 — CABLEADO FÍSICO DEL LAZO\n\n### Módulo de lazo a usar\n\nEl módulo\
    \ es el **LAZO OPAL X2** (código **HOP-433-100**), de color **morado** [F2]. Proporciona\
    \ **2 circuitos de lazo** por módulo [F2].\n\n### Terminales del módulo OPAL X2\n\
    \n**Lazo 1:**\n- Terminal **1** → Lazo 1 Salida +VE\n- Terminal **2** → Lazo 1\
    \ Salida -VE\n- Terminal **3** → ⊕ (**NO USAR** para pantalla de cable)\n- Terminal\
    \ **4** → Lazo 1 Entrada +VE\n- Terminal **5** → Lazo 1 Entrada -VE\n\n**Lazo\
    \ 2:**\n- Terminal **6** → Lazo 2 Salida +VE\n- Terminal **7** → Lazo 2 Salida\
    \ -VE\n- Terminal **8** → ⊕ (**NO USAR** para pantalla de cable)\n- Terminal **9**\
    \ → Lazo 2 Entrada +VE\n- Terminal **10** → Lazo 2 Entrada -VE\n\n[F2][F3]\n\n\
    > ⚠️ **CRÍTICO:** No utilices los terminales **3** y **8** para la pantalla del\
    \ cable de lazo. La pantalla debe conectarse a la **barra de tierra** de la central\
    \ [F2][F3].\n\n> ℹ️ Se recomienda poner a tierra **un solo extremo** de la pantalla\
    \ del cable de lazo en la barra de tierra de la central [F11].\n\n### Posición\
    \ del módulo en la central\n\nInstala los módulos de lazo comenzando por la **RANURA\
    \ 3** (la contigua a la CPU) hacia la derecha. Los lazos se numeran secuencialmente\
    \ de izquierda a derecha [F2][F4].\n\n---\n\n## FASE 2 — COMPROBACIONES PREVIAS\
    \ AL ENCENDIDO (con multímetro)\n\nAntes de conectar el lazo a la central, realiza\
    \ estas verificaciones [F6][F7][F8]:\n\n1. **Continuidad del lazo:** Comprueba\
    \ la continuidad de cada parte del lazo y mide la resistencia extremo a extremo\
    \ [F6].\n\n2. **Resistencia máxima admisible** [F8]:\n   - Protocolo **OPAL**:\
    \ resistencia inferior a **40 Ω**\n   - Protocolo **CLIP** (detección de duplicados):\
    \ inferior a **40 Ω**\n   - Protocolo **CLIP** (sin detección de duplicados):\
    \ inferior a **71 Ω**\n   - Capacidad del cable: inferior a **0,5 µF** [F8]\n\
    \   - Para calcular: mide entre Lazo X Entrada -VE y Lazo X Salida -VE con el\
    \ lazo desconectado de la central, multiplica el resultado por 2 y añade la resistencia\
    \ de cada aislador (**0,1 a 0,13 Ω** por aislador) [F8].\n\n3. **Pantalla del\
    \ cable:** Comprueba que no hay continuidad entre la pantalla y los cables +VE\
    \ ni -VE [F6][F7].\n\n4. **Prueba de diodo (polaridad de dispositivos)** [F7]:\n\
    \   - Conecta el multímetro en **polaridad invertida** (+VE del multímetro al\
    \ negativo del lazo, -VE al positivo): debe indicar diodo en polarización directa.\n\
    \   - Conecta en **polaridad normal**: la resistencia debe empezar baja y aumentar\
    \ progresivamente al cargarse los condensadores de los dispositivos.\n   - Si\
    \ en polaridad normal aparece un diodo en directa, hay uno o varios dispositivos\
    \ conectados en polaridad inversa o un cortocircuito [F7].\n\n5. **Aisladores:**\
    \ Con dispositivos OPAL, al retirar el detector de la base B501 AP se mantiene\
    \ la continuidad (terminales +2 y +4 de la base se puentean automáticamente).\
    \ En módulos y pulsadores con aisladores: terminales **+2 y +4** en módulos, terminales\
    \ **+3 y +4** en pulsadores [F8].\n\n> ⚠️ **NUNCA** uses un comprobador de alta\
    \ tensión (megóhmetro) en el circuito de lazo una vez conectados los dispositivos\
    \ [F6].\n\nUna vez verificado el cableado, conecta el circuito de lazo al bloque\
    \ de terminales correspondiente en la central [F11].\n\n---\n\n## FASE 3 — CONFIGURACIÓN\
    \ DEL LAZO EN CLSS\n\n### Requisito previo\n\nLa central debe configurarse con\
    \ el **programa de configuración CLSS** antes de realizar la Auto Configuración\
    \ [F9].\n\n> ℹ️ Por defecto, la central tiene licencia para **Protocolo avanzado\
    \ OPAL** únicamente. Para usar CLIP o TC800, se requiere licencia adicional [F9].\n\
    \n### Pasos de configuración\n\n1. Accede a **Ajustes → Ajustes HMI** y en **Tipo\
    \ de marca** selecciona **Notifier EN** [F9][F10].\n\n2. Ve a **Ajustes de lazo**\
    \ y configura cada lazo [F9][F10]:\n   - Si el lazo **no se utiliza**: marca ☑\
    \ **Sin Uso** [F1][F9].\n   - Si el lazo **sí se utiliza**:\n     - **Familia\
    \ de Dispositivos:** Notifier\n     - **Protocolo Lazo:** Opal (o Clip si tienes\
    \ licencia)\n     - **Limitar a VdS 2540:** Sí o No (el valor de resistencia cambia\
    \ según la selección)\n     - **Tipo de Cable:** selecciona el tipo correspondiente\n\
    \     - **Resistencia (Ohm):** introduce el valor medido (el ejemplo de pantalla\
    \ muestra **93,5 Ω**) [F9][F10]\n\n3. **Envía el archivo de configuración a la\
    \ central** siguiendo los pasos 01 a 04 del procedimiento \"Enviar configuración\
    \ a la central\" [F9].\n\n4. Procede a la **Auto Configuración** desde la central\
    \ [F9].\n\n---\n\n## Capacidades del lazo (referencia rápida)\n\n**Protocolo OPAL**\
    \ [F2][F5]:\n- Hasta **159 detectores** OPAL por lazo\n- Hasta **159 módulos**\
    \ OPAL por lazo (sirenas, pulsadores, módulos E/S)\n- Corriente máxima por lazo:\
    \ **750 mA** [F2]\n\n**Protocolo CLIP** [F2][F5]:\n- Hasta **99 detectores** CLIP\
    \ por lazo\n- Hasta **99 módulos** CLIP por lazo\n\n> ⚠️ **EN54-2 (13.7):** Restricción\
    \ de **512 detectores y/o pulsadores** por módulo de lazo (que comprende 2 circuitos)\
    \ [F2].\n\n> ⚠️ **No se permite mezclar dispositivos OPAL y CLIP en el mismo lazo**\
    \ [F2].\n\n> ℹ️ La longitud máxima del cable de lazo puede ser de hasta **3,5\
    \ km** dependiendo del tipo de carga y de cable. Usa el **programa de cálculo\
    \ de lazo y batería de CLSS** para verificar tu configuración concreta [F2].\n\
    \n---\n\n**Fuentes:**\n- HOP-138-8ES issue 6, 01-2026 (Instrucciones de puesta\
    \ en marcha INSPIRE E10/E15)\n- HOP-138-9ES issue 5, 11-2025 (Instrucciones de\
    \ instalación INSPIRE E10)\n- 4188-1132-ES issue 3, 04-2025 (Guía rápida CLSS-10)"
