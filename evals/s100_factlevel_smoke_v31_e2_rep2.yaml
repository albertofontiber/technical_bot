- qid: hp018
  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  answer: '# Conexionado de sirenas convencionales en salidas de sirena de la ZXe


    La ZXe dispone de **2 salidas supervisadas para sirenas convencionales** (Salida
    A y Salida B) en la placa base [F3][F4]. Los terminales se identifican como **SIRENA
    A (+) / SIRENA A (-)** y **SIRENA B (+) / SIRENA B (-)** [F3].


    ---


    ## Requisitos previos


    - **Corriente máxima por circuito: 1 A** [F11]

    - **Resistencia Final de Línea (RFL): 6.800 Ω, 0,5 W mínimo**, instalada al final
    del circuito [F11]

    - **Sección mínima de cable recomendada:** no inferior a **1,5 mm²** [F1]

    - **Longitud máxima recomendada:** no superior a **1 km** (por encima, la capacitancia
    e inductancia pueden afectar al funcionamiento) [F3]


    ---


    ## Procedimiento de conexionado


    1. **Identifica los terminales de sirena** en la placa base de la ZXe. Para la
    ZX2e, los terminales están etiquetados como `A- A+ B- B+` en el bloque de sirenas
    [F4]. Consulta la **Figura 13** (ZX2e) o **Figura 14** (ZX5e) del documento MIE-MI-530rv001
    para la ubicación exacta en placa [F4].


    2. **Conecta las sirenas en línea** (sin ramales paralelos). La supervisión se
    realiza sobre la línea directa hasta la RFL; los ramales paralelos no pueden ser
    supervisados [F2].


    3. **Sirenas con polaridad:** conecta el terminal **+** de cada sirena al conductor
    positivo y el **−** al negativo. Cada sirena debe tener un **diodo integrado**
    para impedir el consumo en polarización inversa durante la supervisión [F4].


    4. **Sirenas/campanas sin polaridad:** instala un **diodo de polarización y protección**
    en cada dispositivo no polarizado, para evitar consumos durante la supervisión
    (la corriente de supervisión circula en sentido inverso a la de activación) [F1][F4].


    5. **Instala la RFL (6.800 Ω, 0,5 W mínimo)** entre el conductor **+** y el conductor
    **−** al final de la última sirena de cada circuito [F11]. Si no se conecta ninguna
    sirena en una salida, instala la RFL directamente en los terminales de la central
    [F1].


    6. **No enrolles el cable en los terminales.** Corta y empalma las conexiones
    adecuadamente para mantener la supervisión de la línea [F3].


    7. Consulta la **Figura 15** del documento MIE-MI-530rv001 para ver el esquema
    completo del circuito de sirenas convencionales [F3].


    ---


    ## Supervisión del circuito


    El circuito se supervisa ante **cortocircuito y circuito abierto** [F11]. En reposo,
    la corriente de supervisión circula en sentido inverso. Al activarse la salida,
    la corriente circula en sentido normal. Cualquier fallo en la línea se mostrará
    en pantalla con un mensaje del tipo:


    ```

    !ATENCION!  CIRCUITO ABIERTO SIRENA B

    ```

    [F5]


    ---


    ## Advertencia de cableado


    > Asegúrate de que la sección del cable es adecuada para garantizar la alimentación
    de las sirenas tanto con alimentación principal como en condiciones de mínima
    tensión de baterías. Revisa las **Tablas 10 y 11** del documento MIE-MI-530rv001
    para las condiciones de tensión mínima del panel [F3].


    ---


    Fuente: Manual de Instalación ZX2e/ZX5e — Documento No. MIE-MI-530, Revisión:
    001 (MIE-MI-530rv001); Manual de Instalación ZXAE/ZXEE — DOC.MIE-MI-310 (sin revisión
    registrada)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "(NOTA: Las salidas de relé no se activan nunca)." (MIE-MU-530rv001, p. 17)
    [F10]

    - "Todas las salidas de sirena quedan configuradas por defecto para sonar de forma
    contínua con cualquier alarma de cualquier zona, quedándo así en el patrón 1."
    (MIE-MP-310, p. 38) [F8]'
