- qid: cat010
  question: ¿Cómo se alimenta la sirena/avisador intrínsecamente seguro IS-mA1 en
    una zona peligrosa (ATEX) y cuáles son sus parámetros de seguridad intrínseca
    de entrada?
  answer: '## Alimentación e parámetros de seguridad intrínseca del IS-mA1


    El IS-mA1 es un avisador acústico certificado **ATEX e IECEx** para seguridad
    intrínseca, apto para zonas 0, 1 y 2 con gases y vapores inflamables de grupos
    **IIA, IIB e IIC**, clases de temperatura T1 a T4 [F1][F2].


    ---


    ### Parámetros de entidad de entrada (terminales + / -)


    Estos son los parámetros máximos admisibles en los bornes de alimentación principal
    del avisador [F1][F3]:


    - **Ui = 28 V**

    - **Ii = 93 mA**

    - **Pi = 660 mW**

    - **Ci = 0**

    - **Li = 0**


    > ⚠️ La capacitancia total conectada a los terminales +/- (cable + cualquier otra
    capacitancia) **no debe superar 83 nF** [F3][F4].


    ---


    ### Parámetros de entidad de entrada (terminales S2 y S3 respecto a -)


    Estos terminales sirven para activar el 2.º y 3.er tono de alarma [F5][F3]:


    - **Ui = 28 V**

    - **Ii = 0 mA** ← corriente de entrada permitida: **cero**

    - **Ci = 0**

    - **Uo = 16,8 V** (salida hacia el área segura)

    - **Io = 7,3 mA**

    - **Po = 31 mW**


    > ⚠️ Al ser Ii = 0 mA, los terminales S2 y S3 **solo pueden conectarse** a [F5][F6]:

    > - Barrera de diodo de retorno (con caída de tensión < **0,9 V**)

    > - Relé intrínsecamente seguro

    > - Aislador galvánico

    >

    > Todos ellos deben estar certificados **Ex ia** por un Organismo Notificado de
    la CE. Alternativamente, pueden conectarse directamente a un **interruptor de
    accionamiento mecánico** en la zona peligrosa [F5][F6].

    >

    > ⚠️ La separación entre los terminales S2 y S3 es **inferior a 6 mm** — tener
    precaución durante el conexionado [F3][F4].


    ---


    ### Aparato asociado requerido (zona segura)


    El IS-mA1 puede alimentarse mediante dos tipos de aparato asociado [F3][F4]:


    **Opción A — Aislador galvánico** (no requiere tierra de alta integridad) [F10]:

    - Uo ≤ **28 V**, Io ≤ **93 mA**, Po ≤ **660 mW**

    - Co ≥ Ccable, Lo ≥ Lcable

    - Debe estar certificado **Ex ia** por Organismo Notificado de la CE [F10]


    **Opción B — Barrera Zener de diodo shunt** [F4]:

    - Uo ≤ **28 V**, Io ≤ **93 mA**, Po ≤ **660 mW**

    - Co ≥ Ccable, Lo ≥ Lcable

    - La resistencia entre la tierra intrínsecamente segura y la tierra de protección
    debe ser **< 1 Ω** [F4]


    ---


    ### Certificación


    - **ATEX:** SIRA 05ATEX2084X (sufijo X → condiciones especiales de uso) [F1]

