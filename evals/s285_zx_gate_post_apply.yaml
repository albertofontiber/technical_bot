  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: "# Conexión de sirenas convencionales en salidas de sirena de la Morley\
    \ ZXe\n\n## Identificación de terminales\n\nLa ZXe dispone de **2 circuitos de\
    \ sirenas supervisados** (Sirena A y Sirena B) [F2]. Los terminales en la placa\
    \ se identifican como:\n\n- **ZX2e**: bloque de terminales etiquetado **\"SOUNDERS\
    \ / B+ B- A+ A-\"** [F2]\n- **ZX5e**: bloque de terminales **TB7** con etiquetas\
    \ **\"A- A+ B- B+ C- C+ D- D+\"** [F2]\n\n---\n\n## Procedimiento de conexión\n\
    \n1. **Conecta las sirenas en serie** entre los terminales **SIRENA A (+)** y\
    \ **SIRENA A (-)** (y/o circuito B), respetando la polaridad de cada dispositivo\
    \ [F1].\n\n2. **Cada sirena debe llevar un diodo integrado** para impedir el consumo\
    \ en polarización inversa durante la supervisión. El circuito se polariza en inverso\
    \ en reposo para supervisar la línea [F2].\n\n3. **Si conectas dispositivos no\
    \ polarizados** (campanas sin polaridad), deberás instalar un diodo de polarización\
    \ y protección en cada uno de ellos [F2].\n\n4. **Instala la Resistencia Final\
    \ de Línea (RFL)** de **6.800 Ω, 0,5 W mínimo** entre el terminal (+) y (−) de\
    \ la **última sirena** del circuito [F1]. Esta resistencia es imprescindible para\
    \ la supervisión de circuito abierto y cortocircuito.\n\n   > Si no se instala\
    \ ninguna sirena en la salida, conecta la RFL directamente en los terminales de\
    \ la central [F4].\n\n5. **No realices ramales (derivaciones)** en el cableado\
    \ de sirenas. La supervisión se realiza en la línea directa hasta la RFL; los\
    \ ramales paralelos no quedan supervisados [F5].\n\n6. **No enrolles el cable\
    \ en los terminales.** Corta y empalma las conexiones adecuadamente para mantener\
    \ la supervisión de la línea [F1].\n\n---\n\n## Parámetros eléctricos clave\n\n\
    - **Resistencia Final de Línea (RFL):** 6.800 Ω, 0,5 W mínimo [F1]\n- **Corriente\
    \ máxima por circuito:** 1 A [F2]\n- **Longitud máxima de cable recomendada:**\
    \ 1 km (por encima, la capacitancia e inductancia pueden afectar al funcionamiento)\
    \ [F1]\n- **Sección mínima de cable recomendada:** no inferior a **1,5 mm²** para\
    \ evitar caídas de tensión excesivas [F4]\n\n---\n\n## Advertencias importantes\n\
    \n⚠️ **Verifica siempre la sección del conductor** para garantizar que la tensión\
    \ en las sirenas cumple las especificaciones del fabricante tanto en alimentación\
    \ principal como en condiciones de mínima tensión de baterías (consulta las Tablas\
    \ 10 y 11 del manual) [F1].\n\n⚠️ **La corriente de sirena disponible depende\
    \ de la carga de alarma completa** del panel. Verifica el cálculo mediante el\
    \ programa de cálculo de lazo y baterías [F6].\n\n---\n\nFuente: Manual de Instalación\
    \ Paneles de Incendio ZX2e / ZX5e — MIE-MI-530rv001 (sin revisión registrada)\n\
    \nTambién puedo ayudarte con: **verificación del circuito con multímetro antes\
    \ de conectar**, **prueba funcional de sirenas desde el panel** o **cableado recomendado\
    \ (sección y tipo de cable)** para la ZXe.\n\n---\n\U0001F4CB **Obligaciones de\
    \ evidencia del manual:**\n- Nota: la fuente es inconsistente: \"* El panel de\
    \ detección y control de incendio ZX5Se tiene 4 circuitos de sirenas supervisados\
    \ y limitados en corriente, identificados como circuitos de sirena A, B, C y D.\"\
    \ (MIE-MI-600, p. 24) [F6] declara 4 circuitos y la enumeración servida lista\
    \ 2 (MIE-MI-600, p. 24) [F6].\n- Nota: la fuente es inconsistente: \"El máximo\
    \ permitido entre los 4 circuitos de sirena de ZX5Se es de 2A.\" (MIE-MI-600,\
    \ p. 24) [F6] declara 4 circuitos y la enumeración servida lista 2 (MIE-MI-600,\
    \ p. 24) [F6].\n- \"* Cada sirena deberá tener un diodo integrado para evitar\
    \ que ésta consuma alimentación en la posición de supervisión normal.\" (MIE-MI-600,\
    \ p. 24) [F6]"
