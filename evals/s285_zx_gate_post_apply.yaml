  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: '# Resistencia de Fin de Línea (RFL) en la ZXe


    La respuesta depende del **tipo de lazo** al que te refieres, ya que la ZXe utiliza
    valores distintos según el circuito:


    ---


    ## Salidas de Sirenas de Placa


    - **RFL: 6.800 Ω (6K8)** [F8]

    - Las 2 salidas de sirenas de placa son supervisadas para circuito abierto y cortocircuito
    [F8]

    - La RFL se instala al final del circuito de sirenas [F1]


    ---


    ## Lazo de Comunicaciones RS-485 (periféricos)


    - **RFL: 150 Ω, 0,5 W mínimo** [F2]

    - Se coloca en los **extremos libres** del principio y final de la cadena (lazo
    abierto) [F2]

    - En lazo cerrado (bucle) no se instalan RFL en los extremos [F2]

    - Longitud máxima del lazo RS-485: **1,2 km** [F2]


    > ⚠️ **Nota importante:** Si el equipo extremo dispone de puente de posición **TERM
    ON**, este puente ya incorpora internamente una resistencia de 150 Ω. En ese caso,
    **no instales además la RFL externa** para evitar duplicar la terminación [F4].


    ---


    ## Resumen rápido


    - **Sirenas:** RFL = **6.800 Ω (6K8)**

    - **RS-485 (periféricos):** RFL = **150 Ω, 0,5 W mín.**


    ---


    Fuente: Manual de Instalación ZX2e/ZX5e — MIE-MI-530rv001 (rev. 001)


    También puedo ayudarte con: **conexionado completo del circuito de sirenas**,
    **cableado recomendado para el lazo RS-485** o **longitud máxima y sección de
    cable para el lazo analógico** de la ZXe.


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "Es imprescindible comprobar que no hay derivación entre los terminales A y
    B y que el lazo entra a un lado del conector y sale por el otro o termina en la
    resistencia RFL de 150 Ohmios." (MIE-MI-431rv2, p. 8) [F4]

    - "Es imprescindible comprobar que no hay conexión entre los terminales A y B
    y que el lazo entra a un lado del conector y sale por el otro o termina en la
    resistencia RFL de 150 Ohmios." (MIE-MI-310, p. 22) [F5]

    - "Debe instalarse siempre la resistencia RFL entre + y - de la ultima sirena
    para controlar la apertura o cierre de la línea de sirenas." (MIE-MP-210, p. 18)
    [F9]'
