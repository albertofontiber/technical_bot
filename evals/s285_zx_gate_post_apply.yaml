  bot_answer: '## Fallo de Tierra (Earth Fault) en la AFP-400


    ### ¿Qué significa?


    El aviso de **"Tierra"** (Earth Fault / Ground Fault) indica que existe una conexión
    no deseada entre algún conductor del sistema y tierra (masa). En el SLC, una falla
    de tierra genera condición de **Alarma/Problema** independientemente del estilo
    de cableado utilizado (Estilo 4, 6 o 7) [F8].


    La **MPS-400** dispone de un **LED específico de "Fallo de Tierra"** en su placa,
    que se activa cuando se detecta esta condición [F3].


    ---


    ### Localización del fallo


    Los fragmentos disponibles no describen un procedimiento paso a paso de localización
    del fallo de tierra para la AFP-400. Lo que sí se puede extraer de los manuales
    es lo siguiente:


    **1. Observa el LED de Fallo de Tierra en la MPS-400**

    La placa de alimentación MPS-400 tiene un LED dedicado a "Fallo de Tierra" [F3].
    Comprueba si está encendido para confirmar que el fallo está activo.


    **2. Consulta el menú de Lectura de Estados**

    Accede al menú sin necesidad de clave [F9]:

    - Pulsa `<Enter>` → selecciona `<2>` (Leer Estados)

    - Pulsa `0` + `Enter` → selecciona `SENSOR`, `MÓDULO`, `EQUIPO` o `Z` e introduce
    la dirección del punto a consultar [F9]

    - Esto te permite identificar qué punto o zona está reportando la condición anormal


    **3. Revisa el histórico**

    Desde el mismo menú de Lectura de Estados [F9]:

    - Pulsa `2` + `Enter` → Leer Histórico

    - Pulsa `4` + `Enter` → Leer Histórico Alarma

    Esto puede ayudarte a identificar cuándo se produjo el fallo y qué dispositivo
    lo originó.


    **4. Verifica el cableado del SLC**

    La resistencia total DC del lazo no puede superar **40 Ω** [F10]. Un fallo de
    tierra puede estar relacionado con deterioro del aislamiento del cable. Comprueba
    físicamente el cableado en las derivaciones del lazo.


    **5. Opción de inhabilitar la detección (solo para diagnóstico)**

    La MPS-400 dispone del puente **JP2**: "Corte para inhabilitar la detección de
    la Falla de Tierra" [F5]. Úsalo únicamente como recurso de diagnóstico temporal
    para confirmar que el fallo proviene del sistema y no de la propia placa.


    ---


    ⚠️ **Nota:** El procedimiento detallado de localización de fallo de tierra no
    está completamente descrito en los fragmentos recuperados. Para el procedimiento
    completo, consulta el **Manual de Programación AFP-300/AFP-400 (Documento 50259)**
    [F7] y el manual de instalación completo.


    ---


    **Fuentes:**

    - MFDT170 (AFP-400, sin revisión registrada)

    - MIDT170 (AFP-400, sin revisión registrada)

    - 50253SP (AFP-300/AFP-400, sin revisión registrada)

    - 15090SP (NRT, sin revisión registrada)


    ---


    También puedo ayudarte con: **resistencia máxima del lazo SLC**, **procedimiento
    de rearme del sistema** o **lectura del histórico de averías** en la AFP-400.


    ---

    📖 **Información adicional del manual:**

    - "- **TB1** (top left): Terminal block with connections labeled TB1

    - **TB2** (top center): Terminal block labeled TB2

    - **TB3-TB6** (top right): Terminal blocks labeled TB3-TB6

    - **TB7-TB10** (far right): Terminal blocks labeled TB7-TB10

    - **Interruptor de Selección de Voltaje 115V/230V** (left side): Voltage selection
    switch

    - **Circuitos de Aviso y Señalizaciones 1-4** (right side): Alarm and signaling
    circuits 1-4

    - **Fallo de Tierra** (right side): Ground fault indicator

    - **Activación de la Alimentación AC** (right side): AC power activation

    - **Placa de Alimentación de la MPS-400** (bottom center): MPS-400 power supply
    board" [F3]'
- qid: hp009
  question: ¿Cuál es la resistencia de fin de línea recomendada para los lazos de
    la central Morley ZXe?
  gold_estado: verificado
  conducta_esperada: answer
  conducta_bot: answer
  veredicto: FALLO
  diagnostico: 'No responde a lo preguntado para el lazo analógico direccionable de
    la Morley ZXe: según el gold no lleva RFL y se cablea como bucle cerrado con retorno
    al panel. El bot deriva a sirenas y RS-485/periféricos con valores 6K8 y 150 Ω,
    mezclando circuitos distintos y citando fuentes no pertinentes para la respuesta
    esperada.'
  bot_sources:
  - MIE-MI-300rv02
  - MIE-MI-310
  - MIE-MI-390
  - MIE-MI-431rv2
  - MIE-MI-530rv001
  - MIE-MI-600
  - MIE-MP-210
