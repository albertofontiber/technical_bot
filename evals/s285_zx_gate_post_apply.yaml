  bot_answer: '# Añadir un nuevo detector al lazo en la Morley DXc (tras puesta en
    marcha)


    El procedimiento para incorporar un nuevo detector al lazo una vez el sistema
    ya está en marcha se realiza mediante la función **Autobúsqueda de equipos** [F1].


    ---


    ## Pasos


    **1. Conecta físicamente el nuevo detector al lazo**

    Instala el detector en el lazo siguiendo el cableado en bucle cerrado [F3]. Asegúrate
    de que está correctamente polarizado (positivo y negativo) [F3].


    > ⚠️ Recuerda: máximo **32 sensores/pulsadores entre aisladores** según **EN54-2:
    12.5.2** [F3].


    **2. Accede al menú de Lazos**

    Desde el menú principal, accede al nivel de programación y selecciona el menú
    de **Lazo** [F1].


    **3. Selecciona la función Autobúsqueda**

    Pulsa la tecla **''2''** en el menú de Lazos para seleccionar **''Autobusqueda''**
    [F1]:


    ```

    [Lazo]

    1:Confg.Equipos    2:Autobusqueda

    ```


    **4. Selecciona el número de lazo**

    Si la central tiene más de un lazo (DXc2 o DXc4), introduce el número del lazo
    donde has conectado el nuevo detector y pulsa **⊙** [F1]:


    ```

    [Autobusqueda]

    Sel.Num.Lazo (1-2) :1

    OK:Confirm  1-2:↕:Edit  ←:Cancel

    ```


    > Nota: el modelo **DXc1** solo dispone del lazo 1; los modelos **DXc2** y **DXc4**
    disponen de cuatro conectores (en el DXc2 solo son operativos los lazos 1 y 2)
    [F3].


    **5. Confirma el inicio de la autobúsqueda**

    La pantalla pedirá confirmación. Pulsa **⊙** para iniciar [F1]:


    ```

    [Autobusqueda]

    Lazo: 1  Autobusqueda?

    OK:Confirm         ←:Cancel

    ```


    **6. Espera a que finalice el proceso**

    La pantalla mostrará una barra de progreso mientras se realiza el reconocimiento
    [F1]:


    ```

    [Autobusqueda]

    Lazo: 1 Reconocimiento en progreso...

    █████████████████

    ```


    **7. Verifica el resultado**

    Al finalizar, la pantalla muestra un resumen con el total de equipos y las diferencias
    encontradas (nuevos, eliminados, modificados) [F1]:


    ```

    [Lazo]                   Total: 13

    Nuevos:0    Elimin.:0    Cambiad:0

    ION: 0 OPT: 1 TMP: 1 MLT: 2

    PUL: 4 MON: 0 SIR: 2 REL: 1 OTROS: 2

    ```


    Comprueba que el número de equipos mostrado en pantalla corresponde con los equipos
    y tipos instalados [F1]. El campo **Nuevos** debe reflejar el detector recién
    añadido.


    **8. Sal del menú**

    Pulsa la tecla **⊞** para abandonar la pantalla de resultados y regresar al menú
    de **Lazo** [F1].


    ---


    > ⚠️ **Aviso importante:** En mercados donde el protocolo es seleccionable, si
    previamente se realizó un cambio de protocolo, **espera dos minutos** antes de
    ejecutar la autobúsqueda. La central necesita ese tiempo para rearmar los equipos
    del lazo [F1].


    ---


    **Fuente:** DXc_Manual de configuracion (sin revisión registrada)


    ---


    También puedo ayudarte con: **configuración manual del detector recién añadido
    (zona, sensibilidad, descripción)**, **verificación del cableado del lazo con
    aisladores** o **consulta de abreviaturas de tipos de equipo (Tabla 4)**.


    ---

    📋 **Obligaciones de evidencia del manual:**

    - Nota: la fuente es inconsistente: "PUL: 4 MON: 0 SIR: 2 REL: 1 OTROS : 2" (DXc_Manual
    de configuracion, p. 48) [F1] declara 1 OTROS y la enumeración servida lista 5
    (DXc_Manual de configuracion, p. 48) [F1].'
- qid: hp018
  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  gold_estado: verificado
  conducta_esperada: answer
  conducta_bot: answer
  veredicto: PARCIAL
  diagnostico: Acierta en lo esencial sobre polaridad, diodo por sirena, RFL 6K8/0,5
    W y límite de 1 A, pero es impreciso/contradictorio al decir que la ZXe tiene
    2 circuitos cuando la ZX5e tiene 4. Además, indicar que las sirenas se conectan
    “en serie” puede inducir a un cableado incorrecto; lo correcto es una línea supervisada
    con la RFL al final del circuito.
  bot_sources:
  - DXc_Manual de configuracion
  - MIE-MI-300rv02
  - MIE-MI-310
  - MIE-MI-530rv001
  - MIE-MI-600
