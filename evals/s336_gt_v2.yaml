# s336 B2 — mini-GT de clasificación (30), etiquetado A MANO leyendo los docs
# ANTES de la pasada (v3 §1.7). Muestreo determinista (sha256(id), cuotas por
# namespace + estratos nº-docs — scripts/s336_gt_muestra.py). `duda: true` queda
# FUERA del gate (límites; la mayoría son HUECOS DEL ENUM que el packet §1
# propondrá a Alberto). `profundidad`: completo = todos los chunks; secciones =
# cabecera + secciones R9/definición localizadas por grep sobre el volcado
# completo (el volcado SIEMPRE es el texto entero — la lectura navegó sobre él).
version: 2
etiquetado: "a mano, sesión s336, 21-ago-2026, sobre volcado full-text de chunks_v2"
re_congelado:
  cuando: "s339, 22-ago-2026"
  por_que: >
    Alberto adjudicó el packet de enum (DEC-282): nacen `audio`, `extincion` y
    `barrera_is`, y se decide que anunciador va a `repetidor`, impresora a
    `accesorio` y que «kit» NO es categoría. SEIS de las ocho dudas del v1 eran
    exactamente esos huecos, así que cinco se resuelven — dos por ADJUDICACIÓN
    (led-10, prn-4: la duda era «¿existe categoría propia?» y la respuesta es no)
    y tres por EVIDENCIA re-leída en la fuente (z978, uds-2n, atg-2).
  se_re_congela_entero: >
    DEC-126: no se tocan sólo las filas que convienen. El fichero entero cambia de
    versión y de sha; el v1 se conserva porque DEC-279 lo cita (c8bb02620b4ade74).
  sin_duda: "22 → 27"
  sigue_en_duda: "be-xp (kit heterogéneo, sin sujeto único), 20-20ub (0 chunks), fa457"
