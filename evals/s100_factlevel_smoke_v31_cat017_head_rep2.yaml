per_gold:
- qid: cat017
  question: ¿Como se cablea y se da de alta (configura) un lazo en la central Notifier
    INSPIRE (E10/E15)?
  answer: "# Cableado y configuración de lazo — INSPIRE E10/E15\n\nA continuación\
    \ se detalla el proceso completo en dos bloques: **cableado físico** y **configuración\
    \ software (CLSS)**.\n\n---\n\n## BLOQUE 1 — CABLEADO FÍSICO DEL LAZO\n\n### Módulo\
    \ de lazo OPAL X2 (HOP-433-100)\n\nEl módulo es de color **morado** [F2] y dispone\
    \ de 10 terminales, 5 por lazo [F2][F3]:\n\n**Lazo 1:**\n- Terminal **1** → Lazo\
    \ 1 Salida +VE\n- Terminal **2** → Lazo 1 Salida -VE\n- Terminal **3** → ⊕ (tierra\
    \ — **NO usar para pantalla de cable**)\n- Terminal **4** → Lazo 1 Entrada +VE\n\
    - Terminal **5** → Lazo 1 Entrada -VE\n\n**Lazo 2:**\n- Terminal **6** → Lazo\
    \ 2 Salida +VE\n- Terminal **7** → Lazo 2 Salida -VE\n- Terminal **8** → ⊕ (tierra\
    \ — **NO usar para pantalla de cable**)\n- Terminal **9** → Lazo 2 Entrada +VE\n\
    - Terminal **10** → Lazo 2 Entrada -VE\n\n> ⚠️ **La pantalla del cable de lazo\
    \ debe conectarse a la barra de tierra de la central, NO a los terminales 3 u\
    \ 8** [F2][F3]. Se recomienda poner a tierra un solo extremo de la pantalla [F11].\n\
    \n> ⚠️ **No mezclar dispositivos OPAL y CLIP en el mismo lazo** [F2].\n\n### Capacidad\
    \ del lazo [F2][F4]\n\n**Modo OPAL:**\n- Hasta **159 detectores** OPAL por lazo\n\
    - Hasta **159 módulos** OPAL por lazo\n- Máximo **750 mA** por lazo\n\n**Modo\
    \ CLIP** (requiere licencia):\n- Hasta **99 detectores** CLIP por lazo\n- Hasta\
    \ **99 módulos** CLIP por lazo\n\n> ⚠️ **Restricción EN54-2, apartado 13.7:**\
    \ máximo **512 detectores y/o pulsadores** por módulo de lazo (los 2 circuitos\
    \ en conjunto) [F2].\n\n### Longitud máxima del lazo\n\nLa longitud puede ser\
    \ de **hasta 3,5 km** dependiendo del tipo de carga y de cable [F2]. El cálculo\
    \ exacto se realiza con el **programa de cálculo de lazo y batería de CLSS** [F2].\n\
    \n---\n\n## BLOQUE 2 — COMPROBACIONES PREVIAS CON MULTÍMETRO\n\nAntes de conectar\
    \ el lazo a la central, realiza estas verificaciones [F5][F6][F7]:\n\n> ⚠️ **NUNCA\
    \ uses un comprobador de alta tensión (megóhmetro) en el circuito de lazo** [F5].\n\
    \n1. Comprueba la **continuidad de cada parte del lazo** y mide la resistencia\
    \ de extremo a extremo [F5][F7].\n\n2. La **resistencia máxima del lazo** no debe\
    \ superar [F7]:\n   - **40 Ω** para lazo protocolo **OPAL**\n   - **40 Ω** para\
    \ lazo protocolo **CLIP** (si se requiere detección de dirección duplicada)\n\
    \   - **71 Ω** para lazo protocolo **CLIP** (si NO se necesita detección de dirección\
    \ duplicada)\n\n   > Para medirla: mide entre \"Lazo X Entrada -VE\" y \"Lazo\
    \ X Salida -VE\" con el lazo desconectado de la central, multiplica el resultado\
    \ por 2 y añade la resistencia de cada aislador (**0,1 a 0,13 Ω** por aislador)\
    \ [F7].\n\n3. La **capacidad del cable** debe ser inferior a **0,5 µF** [F7].\n\
    \n4. Comprueba la **continuidad de la pantalla** del cable (resistencia muy baja)\
    \ y verifica que **no hay continuidad** entre la pantalla y los cables +VE ni\
    \ -VE [F5][F6].\n\n5. Con función de **prueba de diodo** en el multímetro [F6]:\n\
    \   - En **polaridad invertida** (+VE del multímetro al negativo del lazo): debe\
    \ indicar diodo en conducción directa.\n   - En **polaridad normal** (+VE al positivo\
    \ del lazo): al principio resistencia baja que aumenta progresivamente al cargarse\
    \ los condensadores de los dispositivos.\n   - Si en polaridad normal indica diodo\
    \ en conducción directa → hay dispositivos conectados en polaridad inversa o cortocircuito\
    \ [F6].\n\n6. Una vez verificado el cableado, **conecta el circuito de lazo al\
    \ bloque de terminales** seleccionado en la central [F11].\n\n---\n\n## BLOQUE\
    \ 3 — CONFIGURACIÓN SOFTWARE (CLSS)\n\n### Paso previo: primer encendido\n\nLa\
    \ primera vez que se encienda la central, debe hacerse **sin el cableado externo\
    \ conectado**, pero con la fuente de alimentación y un circuito de lazo probado\
    \ conectado [F1].\n\n### Configuración del lazo en CLSS [F8][F10]\n\n1. Conecta\
    \ la herramienta de configuración **CLSS** a la central.\n\n2. Ve a **Ajustes\
    \ → Ajustes HMI** y en **Tipo de marca** selecciona **Notifier EN** [F8][F10].\n\
    \n3. Ve a **Ajustes de lazo** y configura cada lazo [F8][F10]:\n   - Si el lazo\
    \ **no se utiliza**: marca ☑ **Sin Uso**.\n   - Si el lazo se utiliza, configura:\n\
    \     - **Protocolo de lazo**: `Opal` (por defecto) o `Clip` (requiere licencia)\
    \ [F8][F9]\n     - **Limitar a VdS 2540**: Sí o No (el valor de resistencia cambia\
    \ según la selección) [F8]\n     - **Tipo de cable**: selecciona el tipo correspondiente\
    \ [F8]\n     - **Resistencia (Ohm)**: introduce el valor medido [F10]\n\n   >\
    \ ⚠️ De forma predeterminada la central tiene licencia para **protocolo OPAL avanzado**\
    \ únicamente. Para usar CLIP o TC800 OPAL/CLIP se necesita **licencia adicional**\
    \ antes de realizar la Auto Configuración [F8].\n\n4. **Envía el archivo de configuración\
    \ a la central** [F8][F10].\n\n### Auto Configuración (búsqueda de dispositivos)\
    \ [F9]\n\n1. En la central, selecciona **Auto Configuración** para buscar los\
    \ dispositivos conectados al lazo.\n\n2. Lee la ventana emergente y confirma seleccionando\
    \ **Auto Configuración** / **Learn Devices**.\n\n3. Una vez completada, selecciona\
    \ la **flecha derecha (>)** junto al botón Auto Búsqueda para ver el estado de\
    \ averías del lazo.\n\n4. Lee los **mensajes de avería** y rectifica los problemas\
    \ detectados. Las causas típicas son [F9]:\n   - Discordancia entre diseño e instalación\n\
    \   - Averías en el cableado\n   - Fuente de RFI externa\n   - Error de módulo\
    \ o fuente de alimentación\n   - Conexionado incorrecto en dispositivos\n\n5.\
    \ Selecciona **Hecho** al completar. Si no hay averías, vuelve a la página **Información\
    \ del sistema**.\n\n6. **Repite los pasos 1 a 5 para cada lazo** hasta descubrir\
    \ todos los lazos [F9].\n\n---\n\n### Numeración de lazos [F2]\n\nLos circuitos\
    \ de lazo se numeran **secuencialmente de izquierda a derecha** del portamódulos.\
    \ En la E15 (dos filas de portamódulos), la segunda fila continúa la numeración\
    \ desde la primera [F2].\n\n---\n\n**Fuentes:**\n- HOP-138-8ES issue 6, 01-2026\
    \ (Instrucciones de puesta en marcha INSPIRE E10/E15)\n- HOP-138-9ES issue 5,\
    \ 11-2025 (Instalación INSPIRE E10)\n- 4188-1132-ES issue 3, 04-2025 (Guía rápida\
    \ CLSS-10)"
