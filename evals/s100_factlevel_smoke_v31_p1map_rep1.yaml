- qid: hp009
  question: ¿Cuál es la resistencia de fin de línea recomendada para los lazos de
    la central Morley ZXe?
  answer: 'La resistencia de fin de línea (RFL) para los circuitos de sirenas de la
    ZXe es de **6,8 KΩ (6800 Ω), 0,5 W mínimo** [F8][F3].


    Debe instalarse en el final de cada circuito de sirenas para la supervisión ante
    cortocircuito y circuito abierto [F8].


    **Detalles adicionales sobre su instalación:**


    - Se instala entre el terminal **+** y **−** de la última sirena del circuito
    [F1]

    - Si no se conectan sirenas en la salida, la RFL se coloca directamente en los
    terminales de la central [F1]

    - **No se deben realizar ramales** en la línea de sirenas, ya que la supervisión
    se realiza en la línea directa hasta la RFL — los ramales paralelos no quedan
    supervisados [F2]

    - La longitud de cable no debe superar **1 km**; por encima de esa longitud, la
    capacitancia e inductancia del lazo pueden afectar al funcionamiento de la línea
    [F3]


    > ⚠️ La corriente de supervisión circula en sentido **inverso** a la de activación.
    Si se instalan campanas sin polaridad, es necesario instalar un diodo para evitar
    consumos durante la supervisión [F1].


    ---


    **Nota:** Los fragmentos recuperados corresponden al manual de instalación de
    los paneles **ZX2e / ZX5e** (documento MIE-MI-530rv001). Si tu ZXe es un modelo
    distinto (ZXAE/ZXEE), el valor de RFL es el mismo — **6800 Ω, 0,5 W mínimo** —
    según el documento MIE-MI-310 [F1][F2].


    Fuentes: Manual de Instalación Paneles de Incendio ZX2e / ZX5e (Documento No.
    MIE-MI-530, Revisión: 001); Manual de Instalación ZXAE/ZXEE (DOC.MIE-MI-310, sin
    revisión registrada)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "Es imprescindible comprobar que no hay conexión entre los terminales A y B
    y que el lazo entra a un lado del conector y sale por el otro o termina en la
    resistencia RFL de 150 Ohmios." (MIE-MI-310, p. 22) [F4]

    - "Debe instalarse siempre una resistencia RFL entre + y - de la última sirena
    para controlar la apertura o cierre de la línea de sirenas." (MIE-MI-310, p. 18)
    [F1]'
