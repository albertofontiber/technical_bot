- qid: hp010
  question: En la Morley DXc, ¿cómo se añade un nuevo detector al lazo tras la puesta
    en marcha inicial?
  answer: '# Añadir un nuevo detector al lazo en la DXc (post puesta en marcha)


    El procedimiento principal es ejecutar una **Autobúsqueda de equipos** desde el
    menú de Lazo, accediendo previamente al Nivel 3. A continuación, el proceso completo:


    ---


    ## Paso 1 — Acceder al Nivel 3


    1. Desde el menú de Nivel 2, selecciona la opción **''7: Programacion/Niv3''**
    [F2].

    2. Introduce la **clave de acceso de Nivel 3** y pulsa **⊙** para confirmar [F2].

    3. Cuando aparezca el mensaje **"Memoria Bloqueada / Presione OK para desbloquear"**,
    pulsa **⊙** de nuevo [F2].


    > ⚠️ El puente **J5** sobre el conector de PC debe estar puesto para poder desbloquear
    la memoria [F2].


    ---


    ## Paso 2 — Acceder al menú de Lazo


    Desde el menú de programación, pulsa la tecla **''2''** para acceder a **''Lazo''**
    [F2]:


    ```

    [Programar]

    1:Op. Generales    2:Lazo

    3:Entradas Placa   4:Salidas Placa

    ...

    ```


    ---


    ## Paso 3 — Ejecutar la Autobúsqueda


    1. Pulsa la tecla **''2''** en el menú de Lazos para seleccionar **''Autobusqueda''**
    [F1].

    2. Si la central tiene más de un lazo, introduce el **número de lazo** correspondiente
    y pulsa **⊙** [F1].

    3. Confirma que deseas realizar la autobúsqueda pulsando **⊙** [F1].

    4. El proceso se ejecuta automáticamente. En pantalla aparecerá una barra de progreso
    [F1]:


    ```

    [Autobusqueda]

    Lazo: 1  Reconocimiento en progreso...

    █████████████████

    ```


    ---


    ## Paso 4 — Verificar el resultado


    Al finalizar, la pantalla muestra un resumen con el total de equipos y las diferencias
    detectadas [F1]:


    ```

    [Lazo]

    Lazo: 1           Total: 13

    Nuevos:0          Elimin.:0  Cambiad:0

    ION: 0 OPT: 1 TMP: 1 MLT: 2

    PUL: 4 MON: 0 SIR: 2 REL: 1 OTROS : 2

    ```


    - **Comprueba que el campo "Nuevos:" refleja el número de detectores recién añadidos**
    [F1].

    - Verifica que el total de equipos y los tipos mostrados corresponden con los
    equipos físicamente instalados [F1].

    - Si la central tiene más de un lazo, usa las teclas **▲ / ▼** para ver los resultados
    de otros lazos [F1].

    - Pulsa **⊞** para salir de la pantalla de resultados y regresar al menú de Lazo
    [F1].


    ---


    ## ⚠️ Aviso importante — Cambio de protocolo


    Si previamente se ha realizado un cambio de protocolo (en mercados donde el protocolo
    es seleccionable), **espera dos minutos antes de ejecutar la Autobúsqueda**. La
    central necesita ese tiempo para rearmar los equipos del lazo [F1].


    ---


    ## Nota sobre el cableado físico


    Antes de ejecutar la Autobúsqueda, asegúrate de que el nuevo detector está correctamente
    conectado al lazo en bucle cerrado y con la polaridad correcta entre positivo
    y negativo [F4]. Para los detalles del conexionado físico, consulta la **Figura
    12 – Conexiones del lazo** del manual [F4].


    ---


    Fuente: DXc\_Manual de configuracion (sin revisión registrada)


    ---

    📋 **Obligaciones de evidencia del manual:**

    - Nota: la fuente es inconsistente: "PUL: 4 MON: 0 SIR: 2 REL: 1 OTROS : 2" (DXc_Manual
    de configuracion, p. 48) [F1] declara 1 OTROS y la enumeración servida lista 5
    (DXc_Manual de configuracion, p. 48) [F1].'
