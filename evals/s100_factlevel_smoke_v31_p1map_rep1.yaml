- qid: hp020
  question: En la Notifier INSPIRE, ¿cómo se configuran las contraseñas de nivel 2
    y nivel 3?
  answer: "# Configuración de contraseñas Nivel 2 y Nivel 3 — INSPIRE E10/E15\n\n\
    ## Cambiar contraseña de Nivel 2 (desde acceso Nivel 2)\n\nEl código de fábrica\
    \ del Nivel 2 es **\"22222222\"** [F4]. Se recomienda cambiarlo por uno exclusivo\
    \ de entre **4 y 8 dígitos** [F2].\n\nPasos [F2]:\n\n1. Selecciona el icono del\
    \ menú ① y selecciona **\"Configuración\"** ②. Inicia sesión como usuario de **Nivel\
    \ de Acceso 2**.\n2. Selecciona la opción **\"Cambio del código de acceso\"**\
    \ ③.\n3. Asegúrate de que **Nivel de Acceso 2** ④ esté seleccionado y que el cursor\
    \ parpadee ⑤.\n4. Puedes ver la entrada del código haciendo clic en el **icono\
    \ del ojo** ⑥.\n5. Introduce el nuevo código de acceso (**4 a 8 caracteres**)\
    \ con el teclado ⑦.\n6. Confirma seleccionando el símbolo **✓** ⑧.\n7. Repite\
    \ los pasos 3 a 6 para confirmar el código introducido.\n\n---\n\n## Cambiar contraseña\
    \ de Nivel 2 o Nivel 3 (desde acceso Nivel 3)\n\nDesde el Nivel 3 es posible cambiar\
    \ tanto el código de Nivel 2 como el de Nivel 3 [F1].\n\nPasos [F1]:\n\n1. Selecciona\
    \ el icono del menú ① y selecciona **\"Ajustes\"** ②. Inicia sesión como usuario\
    \ de **Nivel de Acceso 3**.\n2. Selecciona la opción **\"Cambio del código de\
    \ acceso\"** ③.\n3. Asegúrate de que el **Nivel de Acceso 2 o 3** ④ esté seleccionado\
    \ y que el cursor parpadee ⑤.\n4. Puedes ver la entrada del código haciendo clic\
    \ en el **icono del ojo** ⑥.\n5. Introduce el nuevo código de acceso (**4 a 8\
    \ caracteres**) con el teclado ⑦.\n6. Confirma seleccionando el símbolo ⑧.\n7.\
    \ Repite los pasos 3 a 6 para confirmar el código introducido.\n8. Observa el\
    \ mensaje **\"Cambio de código de acceso satisfactorio\"** y selecciona **Aceptar**.\n\
    9. **Sincroniza el programa con la central** y realiza una **copia de seguridad\
    \ del cambio en la nube** [F1].\n\n---\n\n## Notas de seguridad importantes\n\n\
    - Si el Nivel 2 no se usa durante **5 minutos**, la central cierra sesión automáticamente\
    \ y vuelve al Nivel de Acceso 1 [F4].\n- El código de acceso (PIN) de Nivel 2/3\
    \ debe tener entre **4 y 8 caracteres** [F3].\n- Asegúrate de que los códigos\
    \ se mantienen seguros y solo los conocen usuarios autorizados [F4].\n\n---\n\n\
    **Fuentes:**\n- HOP-138-8ES issue 6, 01-2026 (Instrucciones de puesta en marcha)\
    \ — sin revisión registrada [F1]\n- HOP-338-9ES issue 4, 01-2026 (Instrucciones\
    \ de usuario) — sin revisión registrada [F2, F4]\n- 4188-1122-ES issue 4, 04-2025\
    \ (Ciberseguridad) — sin revisión registrada [F3]\n\n---\n\U0001F4CB **Información\
    \ adicional del manual:**\n- Nota: el manual también indica: \"Se recomienda cambiar\
    \ la contraseña del código de acceso al nivel de acceso 2/3 contraseña a uno exclusivo\
    \ que tenga entre 4 y 8 dígitos.\" [F1] · \"- Menu icon ① leading to \"Configuraciones\"\
    \n- \"Configuraciones\" screen showing \"Configuración del sistema, red, datos\
    \ y hora, programa de mantenimiento, etc\" ②\n- Arrow pointing to \"Cambio de\
    \ contraseña\" option ③\n- \"Introduzca nueva contraseña\" dialog box with:\n\
    \  - \"Acceso Nivel 2\" dropdown ④\n  - Password input field ⑤\n  - \"Min:4 digitos,Max:8\
    \ digitos\" text with eye icon ⑥\n  - Numeric keypad showing numbers 1-9, 0, backspace\
    \ icon, and checkmark icon ⑧\n  - Backspace arrow ⑦]\" [F1]\n\n---\n\U0001F4D6\
    \ **Obligaciones de evidencia del manual:**\n- \"* El programa de configuración\
    \ de CLSS y la Central INSPIRE de Notifier tienen \"pruebas de autenticación\"\
    \ almacenadas localmente en el programa para que ambas funcionen.\" (4188-1122-ES\
    \ issue 4_04-2025_Cyb, p. 9) [F7]"
