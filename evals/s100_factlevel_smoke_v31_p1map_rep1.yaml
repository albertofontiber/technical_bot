per_gold:
- qid: hp002
  question: El detector ASD535 de Detnov está dando una alarma intermitente de flujo
    bajo. ¿Cuál es la causa más probable y cómo se diagnostica?
  answer: "## ASD535 — Alarma intermitente de flujo bajo: causa y diagnóstico\n\n\
    La causa más probable es una **obstrucción en el conducto de aspiración** (orificios\
    \ de aspiración, salida de aire o filtro), que provoca que el flujo de aire caiga\
    \ por debajo del **80 % del valor nominal** registrado en el reset inicial [F2].\n\
    \n---\n\n### Cómo funciona el disparo\n\nEl ASD535 monitoriza el flujo de aire\
    \ comparándolo con el valor nominal (100 %) registrado en el reset inicial [F1].\
    \ Cuando el flujo real cae por debajo del **80 %** (obstrucción) o sube por encima\
    \ del **120 %** (rotura de tubo), el LED **«Fault»** comienza a **parpadear**\
    \ [F8]. Transcurrido el tiempo de retardo de **300 s** (LS-Ü), el equipo dispara\
    \ el aviso de «fallo flujo de aire» [F1][F2].\n\n> El comportamiento intermitente\
    \ que describes es consistente con el parpadeo del LED «Fault» antes de que se\
    \ cumpla el tiempo de retardo, o con fluctuaciones que entran y salen de la ventana\
    \ de monitorización.\n\n---\n\n### Pasos de diagnóstico\n\n1. **Leer el código\
    \ de evento en el AMB 35** (posición de conmutador E) para delimitar el patrón\
    \ de error [F3]. Busca los siguientes códigos de fallo de flujo de aire [F6]:\n\
    \n   - **Código 001** — Obstrucción en el conducto de aspiración → revisar orificios\
    \ de aspiración, salida de aire en el ASD y sensor de flujo de aire.\n   - **Código\
    \ 002** — Rotura de tubo en el conducto de aspiración → comprobar rotura, orificio\
    \ de inspección, uniones abiertas (racores, transiciones flexibles) y sensor de\
    \ flujo de aire.\n   - **Código 004** — Parámetros LS-Ü no válidos → fuera de\
    \ rango del punto de funcionamiento; inspeccionar y limpiar sensor de flujo de\
    \ aire; si está defectuoso, sustituirlo.\n   - **Código 008** — Sensor de flujo\
    \ de aire defectuoso o inexistente → comprobar cable de conexión; si está defectuoso,\
    \ sustituirlo [F6].\n\n2. **Verificar el valor de flujo actual** mediante la posición\
    \ de conmutador **V** (sección 7.6.1) [F2][F8]:\n   - Valor < 100 % → apunta a\
    \ obstrucción.\n   - Valor > 100 % → apunta a rotura de tubo.\n\n3. **Inspección\
    \ física del conducto de aspiración** [F6]:\n   - Comprobar si los orificios de\
    \ aspiración están obstruidos (suciedad, cinta, objetos).\n   - Inspeccionar y\
    \ limpiar la **caja de filtro / unidad de filtrado de polvo**.\n   - Inspeccionar\
    \ y limpiar el **sensor de flujo de aire**.\n\n4. **Comprobación funcional de\
    \ la monitorización de flujo** [F8]:\n   - Tapar los orificios de aspiración con\
    \ cinta adhesiva.\n   - Verificar que el LED «Fault» parpadea cuando la variación\
    \ supera el ±20 %.\n   - Transcurridos **300 s**, debe dispararse el aviso de\
    \ fallo en la CDI.\n\n---\n\n### Advertencia importante antes de ejecutar reset\
    \ inicial\n\nSi tras los trabajos de limpieza fuera necesario un nuevo reset inicial,\
    \ **solo debe realizarse cuando se tenga la seguridad de que el conducto de aspiración\
    \ está completamente limpio** (incluyendo la instalación de un nuevo elemento\
    \ de filtro si procede). Realizar el reset inicial con orificios obstruidos puede\
    \ impedir que el ASD535 dispare la alarma ante un incendio real [F7].\n\n---\n\
    \n**Fuente:** ASD535, Descripción técnica, T 131 192 h es (sin revisión registrada)"
