- qid: hp013
  question: ¿Cómo se cambia la batería tampón de la Detnov ADW535 sin perder configuración?
  answer: "El manual del ADW535 **no describe un procedimiento específico para sustituir\
    \ la batería de litio sin perder configuración**. Los fragmentos disponibles no\
    \ cubren ese procedimiento paso a paso.\n\nLo que sí puedo confirmar a partir\
    \ de los fragmentos:\n\n**Sobre la batería de litio:**\n- El **Main Board LMB\
    \ 35** incorpora una **batería de litio** [F4][F9], visible en la Fig. 31 del\
    \ manual [F9].\n- Los fragmentos no especifican el tipo, voltaje ni referencia\
    \ de la batería de litio.\n\n**Sobre la retención de configuración:**\n- Los parámetros\
    \ específicos del sistema (clase de respuesta, configuraciones de cliente) se\
    \ almacenan en **Flash-PROM** y **EEPROM** [F4][F11], no en la batería de litio.\
    \ La batería de litio está asociada al **módulo de reloj RTC** [F4].\n- El **reset\
    \ de hardware** (interrupción de tensión de alimentación o pulsación del botón\
    \ reset del LMB 35) **mantiene los parámetros programados** [F3].\n\n**Advertencia\
    \ importante:**\n- Tras cualquier trabajo de reparación en el ADW 535 que implique\
    \ sustitución del **dispositivo de control LSU 35** o del **Main Board LMB 35**,\
    \ es **obligatorio realizar un nuevo reset inicial** [F1][F2].\n- Si la sustitución\
    \ de la batería implica manipular el LMB 35, deberás ejecutar el reset inicial\
    \ completo tras el trabajo.\n- Antes de cualquier trabajo de mantenimiento, es\
    \ **imprescindible** bloquear o desconectar los controles de incendios y alertas\
    \ remotas de la CDI de orden superior [F3][F6].\n\n**Recomendación:**\nConsulta\
    \ directamente el manual físico completo del ADW535 (T 140 358 e es) o el soporte\
    \ técnico de Securiton/Detnov para el procedimiento exacto de sustitución de la\
    \ batería de litio, ya que ese procedimiento no está recogido en los fragmentos\
    \ disponibles.\n\nFuente: ADW535, Descripción técnica, T 140 358 e es (sin revisión\
    \ registrada)\n\n---\n\U0001F4D6 **Información adicional del manual:**\n- \"1.\
    \ Bloquear o desconectar el control de incendios y la alerta remota en la CDI\
    \ de orden superior.\n\n2. La tensión de alimentación de la CDI debe estar configurada\
    \ para la central conforme a la normativa de mantenimiento.\n\n3. Abrir la cubierta\
    \ de la unidad de evaluación. Deberán efectuarse las siguientes mediciones:\n\
    \   * Medir la tensión de servicio en los bornes 1 (+), 2 (-) \U0001F87A Valor\
    \ nominal = 10,8 a 13,8 V-CC (con 12 V-CC) o 21,6 a 27,6 V-CC (con 24 V-CC).\n\
    \   * Leer la configuración establecida y los valores de presión de cada tubo\
    \ sensor en la posición de conmutador *P* (véase el cap. 7.6.1) y compararlos\
    \ con el protocolo de puesta en servicio.\" [F6]"
