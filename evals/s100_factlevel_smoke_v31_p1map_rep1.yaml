- qid: cat007
  question: En el detector por aspiración FAAST LT-200, ¿qué salidas de relé y de
    sirena tiene y con qué contactos, cómo se comporta el relé de avería ante un fallo
    o un corte de alimentación, qué resistencia de fin de línea llevan las salidas
    de sirena y cuál es la especificación eléctrica de los contactos de relé?
  answer: '## FAAST LT-200 — Salidas de relé, sirena y especificaciones eléctricas


    ---


    ### Relés disponibles y comportamiento


    El FAAST LT-200 (versión Stand Alone) dispone de los siguientes relés [F1]:


    **Relé de ALARMA 1 y 2**

    - Se activa cuando se cumple la condición de alarma en un canal [F1]

    - Condición predeterminada = Nivel 1 [F1]

    - Estado **enclavado por defecto**: se requiere REARME manual para desactivar
    el LED y el relé [F1]


    **Relé de PREALARMA 1 y 2**

    - Se activa cuando se cumple la condición de prealarma en un canal [F1]

    - Condición predeterminada = Nivel 1 [F1]

    - Nota: cuando PREALARMA = ALARMA = Nivel 1, la prealarma se activará al **70
    % del Nivel 1** [F1]


    **Relé de AVERÍA 1 y 2**

    - Se activa ante condición de avería en canal 1 o 2, o avería común [F1]

    - También se activa en **modo de servicio** y cuando se **desconecta la alimentación
    de la unidad** [F1]

    - Estado **no enclavado** (predeterminado) [F1]


    **Salida de SIRENA 1 y 2**

    - Se activa cuando el canal está en ALARMA o PREALARMA [F1]

    - Sirena 1 corresponde al canal 1; Sirena 2 corresponde al canal 2 [F1]

    - Estado predeterminado = establecido en ALARMA [F1]


    ---


    ### Contactos de los relés (terminales de cableado)


    Cada relé dispone de contacto **NC, C (común) y NA** [F6]:


    - Terminales 5-6-7: Relé de alarma NC / C / NA — Canal 1 [F6]

    - Terminales 8-9-10: Relé de alarma NC / C / NA — Canal 2 [F6]

    - Terminales 11-12-13: Relé de avería NC / C / NA — Canal 1 [F6]

    - Terminales 14-15-16: Relé de avería NC (AUX.) / C (AUX.) / NA (AUX.) — Canal
    2 [F6]

    - Terminales 23-24-25: Relé de prealarma NC / C / NA — Canal 1 [F6]

    - Terminales 26-27-28: Relé de prealarma NC / C / NA — Canal 2 [F6]


    ---


    ### Salidas de sirena — Resistencia de fin de línea


    - Terminales 17-18: Salida sirena 1 (− / +) con resistencia de fin de línea de
    **47 kΩ** [F6]

    - Terminales 19-20: Salida sirena 2 (− / +) con resistencia de fin de línea de
    **47 kΩ** [F6]


    ---


    ### Especificación eléctrica de los contactos de relé


    - Corriente máxima con carga resistiva **30 V CC: 2,0 A** [F3][F7]

    - Corriente máxima con carga resistiva **30 V CA: 0,5 A** [F3][F7]

    - Vida útil mínima: **10⁵ operaciones** [F3]


    ---


    **Nota sobre variantes:** Los fragmentos recuperados corresponden a dos versiones
    del FAAST LT-200: la versión **Stand Alone** (I56-6574-005_ES) y la versión **Notifier
    en lazo** (I56-6577-006_ES). La versión Stand Alone incluye relés de prealarma;
    la versión en lazo no los menciona y el relé de alarma es controlado por el panel
