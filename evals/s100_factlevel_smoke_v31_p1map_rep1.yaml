- qid: cat020
  question: En una central Morley DXc instalada en Espana, ¿cual es el nivel de alarma
    y de prealarma por defecto de los detectores, y el maximo configurable?
  answer: '## Niveles de alarma y prealarma en la DXc — Protocolo Morley-IAS


    Los valores dependen del tipo de detector. El manual distingue dos casos:


    ---


    ### Detectores ópticos convencionales (OPT) — valores en porcentaje


    - **Prealarma por defecto: 80%** [F1]

    - **Alarma por defecto: 100%** [F1]

    - **Máximo configurable para el nivel de alarma: 108%** [F1]


    ---


    ### Detectores multicriterio óptico-térmicos (OTM) — valores por niveles


    Los valores por defecto que aparecen en pantalla son [F1][F2]:

    - **Alarma (Fuego): Nivel 4**

    - **Prealarma: Nivel 3**


    La tabla de niveles para detectores OTM es [F2]:


    - Nivel 1 → 3,2% osc./m

    - Nivel 2 → 3,2% a 6,5% osc./m (autoajustado)

    - Nivel 3 → 6,5% osc./m *(nivel de prealarma recomendado)*

    - Nivel 4 → 6,5% a 11,5% osc./m (autoajustado) *(nivel de alarma recomendado)*

    - Nivel 5 → 11,5% osc./m

    - Nivel 6 → Solo temperatura


    ---


    ### Detectores láser (LSR) — valores por niveles


    Los valores por defecto que aparecen en pantalla son [F1]:

    - **Alarma (Fuego): Nivel 5**

    - **Prealarma: Nivel 4**


    La tabla de niveles para detectores láser es [F2]:


    - Nivel 1 → 0,06% osc./m

    - Nivel 2 → 0,10% osc./m

    - Nivel 3 → 0,16% osc./m

    - Nivel 4 → 0,32% osc./m *(nivel de prealarma recomendado)*

    - Nivel 5 → 0,65% osc./m *(nivel de alarma recomendado)*

    - Nivel 6 → 1,64% osc./m

    - Nivel 7 → 3,28% osc./m

    - Nivel 8 → 4,92% osc./m

    - Nivel 9 → 6,5% osc./m


    ---


    ### Restricciones de configuración


    - El nivel de prealarma **no puede ser superior al nivel de alarma** [F3].

    - La central **no permite ajustar niveles que impidan el reconocimiento de las
    alarmas** [F3].

    - El ajuste máximo para el nivel de alarma en detectores OPT es **108%** [F1].


    ---


    Fuente: DXc\_Manual variaciones de mercado (sin revisión registrada); DXc\_Manual
    de configuracion (sin revisión registrada)


    ---

    📋 **Información adicional del manual:**

    - Nota: el manual también indica: "### 5.3.10.5.1 Información específica para
    protocolo Morley-IAS


    • El valor analógico debe ser un número normalizado entre 0% – 100%, independientemente
    del tipo de equipo. Para los detectores, el nivel de prealarma por defecto es
    el 80% y el nivel de alarma por defecto es el 100%.


    • El ajuste máximo para el nivel de alarma es el 108%." [F1]


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "* Todas las indicaciones obligatorias que no deben ocultarse durante una condición
    de alarma de incendio se muestran mediante LEDs." (DXc_Manual de usuario, p. 4)
    [F9]

    - "Antes de conectar cualquier cable a la central, se deben realizar las siguientes
    comprobaciones:" (DXc_Guia de instalacion_multiling, p. 4) [F10]

    - Nota: la fuente es inconsistente: "* Las cinco teclas principales están bloqueadas
    en el Nivel 1 (Nota: la tecla SILENCIAR ZUMBADOR está siempre habilitada)." (DXc_Manual
    de usuario, p. 17) [F8] declara 5 teclas y la enumeración servida lista 2 (DXc_Manual
    de usuario, p. 17) [F8].'
