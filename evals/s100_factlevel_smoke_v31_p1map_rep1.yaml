- qid: hp018
  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  answer: '# Conexionado de sirenas convencionales en las salidas de sirena de la
    ZXe


    La ZXe dispone de **2 salidas supervisadas para sirenas convencionales** (Salida
    A y Salida B) [F2], con un consumo máximo de **1 A por circuito** [F2][F11].


    ---


    ## Requisitos previos


    - **Resistencia Final de Línea (RFL):** **6.800 Ω, 0,5 W mínimo**, instalada entre
    + y – de la última sirena del circuito [F2][F11].

    - Si no se instalan sirenas en la salida, conectar la RFL directamente en los
    terminales de la central [F2].

    - **Sección mínima de cable:** 1,5 mm² [F2].

    - **Longitud máxima recomendada:** no superior a **1 km** (por encima, la capacitancia
    e inductancia del lazo pueden afectar al funcionamiento) [F3].


    ---


    ## Reglas de conexionado


    1. **Sirenas con polaridad:** conectar respetando la polaridad (+ y –) de cada
    sirena. Cada sirena debe llevar un **diodo integrado** para impedir el consumo
    en polarización inversa durante la supervisión [F4].


    2. **Dispositivos no polarizados (campanas sin polaridad):** instalar un **diodo
    de polarización y protección** en cada uno, entre el terminal + y uno de los terminales
    de alimentación, para evitar consumos durante la supervisión [F2][F4].


    3. **Sin ramales:** no realizar derivaciones paralelas en la línea de sirenas.
    La supervisión se realiza en la línea directa hasta la RFL; los ramales paralelos
    no podrán ser supervisados [F1].


    4. **No enrollar el cable en los terminales.** Cortar y empalmar las conexiones
    adecuadamente para mantener la supervisión de la línea [F3].


    ---


    ## Funcionamiento de la supervisión


    La supervisión del circuito se realiza con una **corriente inversa** que lee la
    RFL. En reposo, la polarización es inversa; al activarse la salida, la corriente
    circula en sentido normal con la polaridad expresada en los terminales [F2]. Cada
    circuito se supervisa ante **cortocircuito y circuito abierto** [F11].


    ---


    ## Terminales físicos


    Para la identificación exacta de los terminales en la placa, consulta la **Figura
    13** (ZX2e) y la **Figura 14** (ZX5e) del manual de instalación, donde se muestran
    los bloques de terminales de los circuitos de sirena [F4].


    > ⚠️ Asegúrate de revisar las **tablas 10 y 11** del manual para verificar las
    condiciones de tensión mínima del panel, tanto en alimentación principal como
    en condiciones de mínima tensión de baterías [F3].


    ---


    **Fuente:** Manual de Instalación Paneles de Incendio ZX2e / ZX5e — Documento
    No. MIE-MI-530, Revisión: 001 (Morley-IAS); Manual de Instalación ZXAE/ZXEE —
    DOC.MIE-MI-310 (sin revisión registrada)


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "Todas las salidas de sirena quedan configuradas por defecto para sonar de forma
    contínua con cualquier alarma de cualquier zona, quedándo así en el patrón 1."
    (MIE-MP-310, p. 38) [F6]'
