- qid: cat017
  question: ¿Como se cablea y se da de alta (configura) un lazo en la central Notifier
    INSPIRE (E10/E15)?
  answer: "# Cableado y configuración de lazo — INSPIRE E10/E15\n\nA continuación\
    \ se detalla el proceso completo en dos fases: **cableado físico** y **configuración/alta\
    \ en software**.\n\n---\n\n## FASE 1 — CABLEADO FÍSICO DEL LAZO\n\n### 1.1 Módulo\
    \ de lazo OPAL X2 (HOP-433-100)\n\nEl módulo es de color **morado** [F2] y dispone\
    \ de 10 terminales por módulo, con la siguiente asignación [F2][F3]:\n\n**Lazo\
    \ 1:**\n- Terminal **1** → Lazo 1 Salida +VE (OUT +VE)\n- Terminal **2** → Lazo\
    \ 1 Salida -VE (OUT -VE)\n- Terminal **3** → ⊕ (**NO usar para pantalla de cable**)\n\
    - Terminal **4** → Lazo 1 Entrada +VE (IN +VE)\n- Terminal **5** → Lazo 1 Entrada\
    \ -VE (IN -VE)\n\n**Lazo 2:**\n- Terminal **6** → Lazo 2 Salida +VE (OUT +VE)\n\
    - Terminal **7** → Lazo 2 Salida -VE (OUT -VE)\n- Terminal **8** → ⊕ (**NO usar\
    \ para pantalla de cable**)\n- Terminal **9** → Lazo 2 Entrada +VE (IN +VE)\n\
    - Terminal **10** → Lazo 2 Entrada -VE (IN -VE)\n\n> ⚠️ **La pantalla del cable\
    \ de lazo debe conectarse a la barra de tierra de la central, NO a los terminales\
    \ 3 u 8** [F2][F3]. Se recomienda poner a tierra un solo extremo de la pantalla\
    \ [F10].\n\n> ⚠️ **No mezclar dispositivos OPAL y CLIP en el mismo lazo** [F2].\n\
    \n---\n\n### 1.2 Numeración de lazos\n\nLos circuitos de lazo se numeran **secuencialmente\
    \ de izquierda a derecha** del portamódulos [F2]. En la E15, con dos filas de\
    \ portamódulos, la segunda fila continúa la numeración desde la primera [F2].\n\
    \n---\n\n### 1.3 Capacidad máxima por lazo\n\n**Modo OPAL** [F2][F4]:\n- Hasta\
    \ **159 detectores OPAL** por lazo\n- Hasta **159 módulos OPAL** por lazo (sirenas,\
    \ pulsadores, módulos E/S)\n- Corriente máxima: **750 mA por lazo** [F2]\n\n**Modo\
    \ CLIP** [F2][F4]:\n- Hasta **99 detectores CLIP** por lazo\n- Hasta **99 módulos\
    \ CLIP** por lazo\n\n> ⚠️ **Restricción EN54-2, apartado 13.7:** máximo **512\
    \ detectores y/o pulsadores** por módulo de lazo (que comprende 2 circuitos) [F2].\n\
    \n> ℹ️ La longitud máxima del cable se calcula con el **programa de cálculo de\
    \ lazo y batería de CLSS** y puede ser de hasta **3,5 km** dependiendo del tipo\
    \ de carga y cable [F2].\n\n---\n\n### 1.4 Comprobaciones previas con multímetro\
    \ (antes de conectar a la central)\n\n> ⚠️ **NUNCA usar dispositivos de alta tensión\
    \ (megóhmetro, etc.) en el circuito de lazo** [F5].\n\nRealiza las siguientes\
    \ comprobaciones con el lazo desconectado físicamente de los terminales de la\
    \ central [F7]:\n\n1. Comprueba la **continuidad de cada parte del lazo** y mide\
    \ la resistencia de extremo a extremo [F5][F7].\n\n2. Mide entre **Lazo X Entrada\
    \ -VE** y **Lazo X Salida -VE**, multiplica el resultado por 2 y añade la resistencia\
    \ de cada aislador (**0,1 a 0,13 Ω** por aislador). La **capacidad del cable debe\
    \ ser inferior a 0,5 µF** [F7].\n\n   Resistencia máxima admisible [F7]:\n   -\
    \ Protocolo **OPAL**: inferior a **40 Ω**\n   - Protocolo **CLIP** (con detección\
    \ de dirección duplicada): inferior a **40 Ω**\n   - Protocolo **CLIP** (sin detección\
    \ de dirección duplicada): inferior a **71 Ω**\n\n3. Comprueba la **continuidad\
    \ de la pantalla** del cable (debe dar resistencia muy baja) [F5].\n\n4. Verifica\
    \ que **no hay continuidad** entre la pantalla y los cables +VE ni -VE [F5][F6].\n\
    \n5. Con el multímetro en función de prueba de diodo, conecta en **polaridad invertida**\
    \ (+VE del multímetro al negativo del lazo, -VE al positivo): debe indicar **diodo\
    \ en polarización directa** [F6].\n\n6. Conecta en **polaridad normal**: al principio\
    \ debe leer resistencia baja, que irá aumentando a medida que se cargan los condensadores\
    \ de los dispositivos [F6].\n\n   > Si indica diodo en polarización directa en\
    \ este paso, hay dispositivos conectados en polaridad inversa o cortocircuito\
    \ [F6].\n\n7. Si hay dispositivos CLIP, **puentea temporalmente los terminales\
    \ 2 y 4 de cada aislador** para verificar continuidad [F7].\n\n> ℹ️ Se recomienda\
    \ usar la herramienta **POL-200-TS** para diagnósticos más detallados; funciona\
    \ con protocolos OPAL y CLIP [F10].\n\n---\n\n### 1.5 Conexión a la central\n\n\
    **Lazo OPAL:** Una vez verificado el cableado, conecta el circuito al bloque de\
    \ terminales de lazo seleccionado en la central [F10].\n\n**Lazo CLIP:** Antes\
    \ de conectar, **reconecta los aisladores que se puentearon temporalmente** en\
    \ los módulos y pulsadores; después conecta el circuito al bloque de terminales\
    \ [F10].\n\n---\n\n## FASE 2 — CONFIGURACIÓN / ALTA DEL LAZO (Software CLSS)\n\
    \n### 2.1 Primer encendido\n\nLa primera vez que se encienda la central, debe\
    \ hacerse **sin el cableado externo conectado**, pero con la fuente de alimentación\
    \ y un circuito de lazo probado conectado [F1].\n\n> ⚠️ Tomar precauciones para\
    \ evitar la activación inadvertida de equipos conectados (módulos con salidas\
    \ a centros de control, etc.) durante el encendido [F1].\n\n---\n\n### 2.2 Configuración\
    \ previa en CLSS (obligatoria para CLIP o TC800)\n\n> ℹ️ Por defecto, la central\
    \ tiene licencia para **modo OPAL (Protocolo avanzado)** únicamente. Para usar\
    \ **CLIP o TC800 OPAL/CLIP** se requiere licencia adicional antes de realizar\
    \ Auto Configuración [F9].\n\nPasos en el programa CLSS [F9]:\n\n1. Conecta la\
    \ herramienta de configuración a la central.\n2. Ve a **Ajustes → Ajustes HMI**\
    \ y en **Tipo de marca** selecciona **Notifier EN** [F9].\n3. Ve a **Ajustes de\
    \ lazo**:\n   - Si el lazo **no se utiliza**: marca ☑ **Sin Uso** [F9][F1].\n\
    \   - Si el lazo se utiliza: selecciona **Limitar a VdS 2540** (Sí/No) — el valor\
    \ de resistencia cambia según la selección — y elige el **Tipo de cable** [F9].\n\
    4. Configura el lazo vacío con el protocolo deseado (OPAL u otro).\n5. Envía la\
    \ configuración a la central [F9].\n\n---\n\n### 2.3 Auto Configuración (búsqueda\
    \ de dispositivos) desde la central\n\n1. Selecciona **Auto Configuración** en\
    \ el panel para buscar dispositivos conectados al lazo [F8].\n2. Lee la ventana\
    \ emergente informativa y confirma seleccionando **Auto Configuración** / **Learn\
    \ Devices** [F8].\n   > Si no hay protocolo especificado en la configuración,\
    \ el lazo usará por defecto el **protocolo OPAL** [F8].\n3. Una vez completada\
    \ la búsqueda, selecciona la **flecha derecha (>)** junto al botón Auto Búsqueda\
    \ para ver el estado de averías del lazo [F8].\n4. Lee los mensajes de avería\
    \ y corrige los problemas detectados. Selecciona **Hecho** al completar [F8].\n\
    \n   Causas típicas de averías en el lazo [F8]:\n   - Discordancia entre diseño\
    \ e instalación\n   - Averías en el cableado\n   - Fuente de RFI externa\n   -\
    \ Error de módulo o fuente de alimentación\n   - Conexionado incorrecto en dispositivos\n\
    \n5. **Repite los pasos 1 a 4** si se han rectificado averías [F8].\n6. **Repite\
    \ el proceso para cada lazo** hasta descubrir todos [F8].\n\n---\n\n## Resumen\
    \ del flujo\n\n1. Cablear físicamente los terminales del módulo OPAL X2 → pantalla\
    \ a barra de tierra\n2. Verificar con multímetro (resistencias, polaridad, pantalla)\n\
    3. Configurar en CLSS (protocolo, tipo de cable, VdS, licencias si aplica)\n4.\
    \ Enviar configuración a la central\n5. Conectar el lazo a los terminales de la\
    \ central\n6. Ejecutar **Auto Configuración** desde el panel\n7. Revisar y corregir\
    \ averías → repetir por cada lazo\n\n---\n\nFuente: HOP-138-8ES issue 6 (01-2026)\
    \ — Instrucciones de puesta en marcha INSPIRE E10/E15; HOP-138-9ES issue 5 (11-2025)\
    \ — Manual de instalación INSPIRE E10"
