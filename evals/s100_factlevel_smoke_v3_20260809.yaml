- qid: hp018
  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  answer: '## Conexionado de sirenas convencionales en las salidas de sirena de la
    ZXe


    Las salidas de sirena de la ZXe son salidas supervisadas con resistencia final
    de línea de **6,8 kΩ, 0,5 W mínimo** [F11], y cada circuito admite un **consumo
    máximo de 1 A** [F11].


    ---


    ### Terminales físicos


    - **ZX2e**: terminales **A+, A-, B+, B-** en el bloque **SOUNDERS** [F4]

    - **ZX5e**: terminales **A-, A+, B-, B+, C-, C+, D-, D+** en el bloque **TB7**
    [F4]


    ---


    ### Pasos de conexionado


    1. **Conecta las sirenas en línea** (sin ramales paralelos) entre los terminales
    + y – de la salida correspondiente [F2]. Los ramales paralelos no pueden ser supervisados
    [F2].


    2. **Sirenas con polaridad**: conéctalas respetando la polaridad + / – indicada
    en cada dispositivo [F2]. Cada sirena debe tener un **diodo integrado** para impedir
    el consumo en polarización inversa durante la supervisión [F4].


    3. **Dispositivos no polarizados** (campanas sin polaridad): instala un **diodo
    de polarización y protección** en cada uno [F4]. Sin este diodo, la corriente
    inversa de supervisión provocará consumo en reposo [F1].


    4. **Resistencia final de línea (RFL)**: instala una resistencia de **6,8 kΩ,
    0,5 W mínimo** entre el terminal + y – de la **última sirena** del circuito [F1]
    [F11]. Si no se conecta ninguna sirena, coloca la RFL directamente en los terminales
    de la central [F1].


    5. **Longitud de cable**: no se recomienda superar **1 km** de longitud; por encima
    de ese valor, la capacitancia e inductancia del lazo pueden afectar al funcionamiento
    de la línea [F3]. Usa sección mínima de **1,5 mm²** [F1].


    6. **No enrolles el cable en los terminales**: corta y empalma las conexiones
    adecuadamente para mantener la supervisión de la línea [F3].


    ---


    ### Principio de supervisión


    El circuito se polariza en **inverso en reposo** para supervisar la línea (detecta
    circuito abierto y cortocircuito). Al dispararse la salida, la polarización cambia
    a la normal y las sirenas suenan [F4]. Cualquier fallo en la línea se mostrará
    en pantalla con un mensaje del tipo:


    ```

    !ATENCION!  CIRCUITO ABIERTO SIRENA B

    ```

    [F5]


    ---


    ### Número de salidas disponibles


    - **ZX2e**: 2 salidas supervisadas (A y B) [F4]

    - **ZX5e**: 4 salidas supervisadas (A, B, C y D) [F4]


    ---


    > ⚠️ **Verifica la sección de cable adecuada** para garantizar la alimentación
    de las sirenas en condiciones de mínima tensión de baterías. Consulta las tablas
    10 y 11 del manual de instalación para las condiciones de tensión mínima del panel
    [F3].


    Para el esquema visual del circuito, consulta la **Figura 15 – Circuito de sirenas
    convencionales** del documento MIE-MI-530 [F3].


    ---


    **Fuentes:** Manual de Instalación ZX2e/ZX5e (Documento No. MIE-MI-530, Revisión:
    001); Manual de Instalación ZXAE/ZXEE (DOC.MIE-MI-310, sin revisión registrada)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "(NOTA: Las salidas de relé no se activan nunca)." (MIE-MU-530rv001, p. 17)
    [F10]

    - "Todas las salidas de sirena quedan configuradas por defecto para sonar de forma
    contínua con cualquier alarma de cualquier zona, quedándo así en el patrón 1."
    (MIE-MP-310, p. 38) [F8]'
