- qid: cat007
  question: En el detector por aspiración FAAST LT-200, ¿qué salidas de relé y de
    sirena tiene y con qué contactos, cómo se comporta el relé de avería ante un fallo
    o un corte de alimentación, qué resistencia de fin de línea llevan las salidas
    de sirena y cuál es la especificación eléctrica de los contactos de relé?
  answer: 'El FAAST LT-200 dispone de los siguientes relés y salidas de sirena:


    ---


    ## Relés disponibles y sus contactos


    **Relés de alarma (×2, uno por canal):**

    - Terminales 5 (NC), 6 (C), 7 (NA) → Canal 1 [F4]

    - Terminales 8 (NC), 9 (C), 10 (NA) → Canal 2 [F4]

    - Acción: se activa cuando se cumple la condición de alarma en el canal correspondiente
    [F3]

    - Estado de alarma **enclavado por defecto** — requiere rearme manual para desactivar
    el LED y el relé [F3]


    **Relés de avería (×2, uno por canal):**

    - Terminales 11 (NC), 12 (C), 13 (NA) → Canal 1 [F4]

    - Terminales 14 (NC AUX.), 15 (C AUX.), 16 (NA AUX.) → Canal 2 [F4]


    **Relés de prealarma (×2, uno por canal):**

    - Terminales 23 (NC), 24 (C), 25 (NA) → Canal 1 [F4]

    - Terminales 26 (NC), 27 (C), 28 (NA) → Canal 2 [F4]

    - Condición predeterminada = Nivel 1. Cuando PREALARMA = ALARMA = Nivel 1, la
    prealarma se activará al 70 % del nivel 1 [F3]


    ---


    ## Comportamiento del relé de avería ante fallo o corte de alimentación


    El relé de avería se activa en las siguientes situaciones [F3]:

    - Condición de avería en el canal 1 o canal 2

    - Avería común

    - Modo de servicio

    - **Cuando se desconecta la alimentación de la unidad**


    El estado de avería **no está enclavado** (predeterminado) [F3].


    ---


    ## Salidas de sirena y resistencia de fin de línea


    - **Salida sirena 1:** terminales 17 (−) y 18 (+) [F4]

    - **Salida sirena 2:** terminales 19 (−) y 20 (+) [F4]

    - Resistencia de fin de línea: **47 kΩ** en cada salida de sirena [F4]

    - La sirena 1 se corresponde con el canal 1 y la sirena 2 con el canal 2 [F3]

    - Estado predeterminado: se activa cuando el canal está en ALARMA [F3]


    ---


    ## Especificación eléctrica de los contactos de relé


    - Potencia nominal máxima: **2,0 A a 30 V CC** (carga resistiva) [F1]

    - Potencia nominal máxima: **0,5 A a 30 V CA** (carga resistiva) [F1]

    - Vida útil mínima: **10⁵ operaciones** [F1]


    > ⚠️ **Nota sobre cargas inductivas:** El manual incluye una advertencia específica
    sobre la conmutación de cargas inductivas con diagramas de circuito asociados
    [F8]. Consulta la sección "WARNING: Switching Inductive Loads" del manual para
    el circuito de protección recomendado.


    ---


    **Fuentes:**

    - I56-6574-005_ES -HS Stand Alone FAAST LT-200 QIG (sin revisión registrada)

    - I56-6577-006_ES FAAST Notifier LT-200 QIG (sin revisión registrada)

    - I56-6577-006_EN Notifier FAAST LT-200 QIG (sin revisión registrada)'
  family_resolved: true
