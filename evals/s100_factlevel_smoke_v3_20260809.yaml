- qid: cat005
  question: ¿Cuáles son las características técnicas de la central de detección de
    gas Fidegas CS4, y en qué se diferencian las versiones digital y analógica?
  answer: "# Características técnicas de la central Fidegas CS4\n\nLa CS4 es una central\
    \ de alarmas de detección de gas para hasta **4 sensores remotos**, disponible\
    \ en versión digital y analógica [F1].\n\n---\n\n## Características técnicas generales\n\
    \n- **Tensión de alimentación:** 110-230 Vac, 50-60 Hz [F2]\n- **Potencia:** 30\
    \ W, Clase II [F2][F4]\n- **Sensores:** hasta 4 conexiones en modo analógico o\
    \ digital [F2]\n- **Salidas:** 2 salidas conmutadas LP (relé apto para 230 Vac)\
    \ con contactos NA-C-NC [F2]\n- **Corriente máxima:** 250 mA [F2]\n- **Rearme:**\
    \ seleccionable manual o automático [F2]\n- **Indicaciones:** presencia, alarma\
    \ y avería por sensor; avería de central; corte de red [F2]\n- **Dimensiones:**\
    \ 90 x 106 x 58 mm [F2]\n- **Peso:** 300 g [F2]\n- **Firmware:** versión 1.2 (tanto\
    \ en versión digital como analógica) [F4][F7]\n- **Instalación:** carril DIN o\
    \ armario de superficie [F1]\n\n---\n\n## Diferencias entre versión digital y\
    \ analógica\n\n**Código de producto:**\n- Versión digital: **3244** [F2]\n- Versión\
    \ analógica: **3270** [F2]\n\n**Tipo de entrada de señal:**\n- Versión digital:\
    \ entradas **0-10/15 V** [F1]\n- Versión analógica: entradas **4-20 mA** [F1]\n\
    \n**Sensores compatibles:**\n\n- Versión **analógica** [F4]:\n  - Sensores S/3\
    \ gases combustibles\n  - Sensores S/3 y S/2 gases tóxicos\n  - Sensores S/10\
    \ gases tóxicos\n\n- Versión **digital** [F4]:\n  - Sensores S/10 gases combustibles\n\
    \n---\n\n## Indicaciones luminosas y acústicas\n\n- **LED verde PWR:** alimentación\
    \ presente (fijo) / corte de red (intermitente) [F1]\n- **LED bicolor ON/ALARM**\
    \ por sensor: sensor presente (verde) / alarma (rojo) [F1]\n- **LED amarillo ERROR**\
    \ por sensor: avería de sensor remoto [F1]\n- **LED verde OUT1 y OUT2:** salida\
    \ activa (verde) / desactivada (apagado) [F1]\n- **Avisador acústico:** apoyo\
    \ sonoro a las indicaciones ópticas [F1]\n\n---\n\n## Umbral de alarma\n\nLa alarma\
    \ se activa cuando la concentración de gas supera el **20% del fondo de escala**\
    \ [F5]. Las alarmas son enclavadas y requieren acción sobre el botón **RESET**\
    \ para rearmar [F5].\n\n---\n\n## Conexión de sensores (terminales por sensor)\n\
    \n- Terminal **1:** positivo de alimentación (12 a 24 Vdc) [F3]\n- Terminal **2:**\
    \ entrada de señal [F3]\n- Terminal **3:** negativo común de alimentación y señal\
    \ [F3]\n\n---\n\nFuente: Manual de Usuario CS4 (Analógica o Digital), Rev. 2,\
    \ 10/2018 — fabricado por C.A.E., S.L. [F6]\n\n---\n\U0001F4CB **Obligaciones\
    \ de evidencia del manual:**\n- Nota: la fuente es inconsistente: \"Permite la\
    \ conexión de hasta 4 sensores remotos simultaneos a través de sus 4 entradas\
    \ digitales (0-10/15 v) o analógicas (4-20 mA).\" (Manual-de-Usuario-CS4, p. 4)\
    \ [F1] declara 4 sensores y la enumeración servida lista 6 (Manual-de-Usuario-CS4,\
    \ p. 4) [F1].\n- \"Ningún sistema de detección de gas sustituye a una correcta\
    \ instalación y mantenimiento de los aparatos quemadores de gas y debe ser colocado\
    \ por una persona competente o un instalador autorizado.\" (Manual-de-Usuario-CS4,\
    \ p. 2) [F7]"
