- qid: hp007
  question: ¿Cómo se realiza el test anual de un detector VESDA-E VEP según el manual
    del fabricante?
  answer: '## Test anual del detector VESDA-E VEP según el manual del fabricante


    El manual establece **cuatro comprobaciones de mantenimiento anual** para el detector
    VEP-A10-P [F1]:


    ---


    ### Tareas de mantenimiento anual (una vez al año)


    Según la Tabla 7-1 del manual [F1], las comprobaciones anuales son:


    1. **Realizar una prueba de humos** para comprobar la integridad de la red de
    tuberías

    2. **Comprobar el flujo** de las tuberías

    3. **Limpiar los puntos de muestreo**

    4. **Limpiar con agua la red de tuberías**


    ---


    ### Procedimiento de la prueba de humos


    La prueba de humos consiste en introducir una muestra de humo en el **orificio
    de muestreo más alejado** y medir el tiempo que tarda el humo en llegar al detector
    [F2]. Los resultados deben registrarse y compararse con pruebas posteriores para
    tener en cuenta las variaciones del sistema [F2].


    Para los detalles completos del procedimiento, el manual remite a la **VESDA-E
    Commissioning Guide** (guía de puesta en marcha de VESDA-E) [F2].


    ---


    ### Comandos de prueba disponibles desde Xtralis VSC


    Para apoyar las verificaciones anuales, el software **Xtralis VSC** permite ejecutar
    los siguientes comandos [F7]:


    - **Iniciar prueba de alarma ("Start Alarm Test"):** Simula el nivel de humo de
    escala completa, generando condiciones de Alerta, Acción, Fuego 1 y Fuego 2. Se
    activarán los relés de alarma a menos que el detector esté desactivado [F7].

    - **Inicio de la prueba de fallo de circulación del aire ("Start Air Flow Fault
    Test"):** Comprueba el sistema de detección de circulación del aire apagando el
    aspirador [F7].

    - **Iniciar prueba de relés ("Start Relay Test"):** Activa y desactiva los relés
    disponibles para probarlos [F7].

    - **Iniciar prueba de fallo importante ("Start Major Fault Test"):** Genera un
    fallo importante y desactiva el relé de fallo durante **2 minutos** [F7].

    - **Iniciar prueba de fallo menor ("Start Minor Fault Test"):** Genera un fallo
    menor y desactiva el relé de fallo durante **2 minutos** [F7].


    ---


    ### Precauciones obligatorias antes del mantenimiento


    El manual indica expresamente [F1]:


    - **Informar a la autoridad supervisora adecuada** antes de realizar el mantenimiento
    o las pruebas.

    - **Aislar los dispositivos existentes** que dependan del detector antes de ponerlo
    en funcionamiento.

    - Cuando el detector está deshabilitado o en espera, **no emitirá advertencias
    de fuego**.

    - Seguir los procedimientos del sitio para **evitar falsas alarmas** durante las
    pruebas de humo.


    ---


    ### Nota sobre frecuencias


    El manual indica que la frecuencia de las comprobaciones puede variar en función
    de los **códigos y normas locales** y del **entorno de la instalación** [F1].
    El mantenimiento puede realizarlo el instalador original, un distribuidor autorizado
    o el contratista de servicio [F1].


    ---


    **Fuente:** 33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores (sin revisión
    registrada); 33976_13_VESDA-E_VEP-A00-P_Product_Guide_A4_Spanish_lores (sin revisión
    registrada)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "**Atención:** Pendant que le detecteur ou la zone est desactivee, aucun feu
    d''indication va etre emis par le detecteur." (33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores,
    p. 87) [F1]'
