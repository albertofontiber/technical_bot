- qid: hp001
  question: En la Detnov CAD-250, ¿cómo se entra al menú de programación avanzada?
  answer: '## Acceso al menú de programación avanzada — CAD-250


    La ruta de acceso es la siguiente [F1][F10]:


    **AJUSTES** (Menú principal) **> AVANZADO** (Submenú)


    ### Pasos detallados:


    1. Desde la **PANTALLA DE REPOSO**, toca el icono del **candado** (🔒) [F2].

    2. Introduce la **clave de administrador** (por defecto: **2222**) [F2]. Con clave
    de usuario el submenú AVANZADO no estará disponible — requiere nivel de administrador
    [F3].

    3. En el **MENÚ PRINCIPAL** (columna izquierda), selecciona **AJUSTES** [F1][F10].

    4. En el **SUBMENÚ** (columna derecha), selecciona **AVANZADO** [F1][F10].


    ### Una vez dentro, dispones de 3 pestañas [F1]:


    - **SISTEMA** — Número de cabinas (paneles: 1 a 4), número de lazos (2, 4, 6,
    8... hasta 32 según cabinas) y cabina de LEDs de zona (0 ó 1). Los cambios requieren
    pulsar **Guardar y Reiniciar** [F1].

    - **OTROS** — Interruptores para facilitar puesta en marcha y mantenimiento: Tiempo
    de inactividad, Salto a scroll si incidentes, Saltar a último incidente prioritario
    si timeout, Recordar estado de módulos virtuales, y Salir del modo de test automáticamente
    (configurable entre 1 y 24 horas) [F7].

    - **REINICIAR** — Devuelve los valores de configuración de panel a valores por
    defecto (no afecta a entidades, lazos, maniobras, grupos, módulos virtuales, modos
    especiales, filtros de red ni registros de eventos) [F7].


    > ⚠️ **AVISO:** Por razones de seguridad y cumplimiento normativo, los interruptores
    de inactividad, timeout y scroll deben permanecer activados (en verde) por defecto
    [F7][F8].


    ---


    Fuente: CAD-250 Manual de Configuración MC-380-es-2026-c (rev. c, 2026-04-23);
    CAD-250 Manual de Software de Configuración MS-416-es-2026-b (rev. b)'
