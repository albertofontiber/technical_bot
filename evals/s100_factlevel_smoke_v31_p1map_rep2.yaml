- qid: hp010
  question: En la Morley DXc, ¿cómo se añade un nuevo detector al lazo tras la puesta
    en marcha inicial?
  answer: "# Añadir un nuevo detector al lazo en la Morley DXc\n\nEl procedimiento\
    \ consiste en conectar físicamente el detector al lazo y luego ejecutar una **Autobúsqueda**\
    \ desde el menú de programación para que la central lo reconozca.\n\n---\n\n##\
    \ Paso 1 — Acceder al Nivel 3 (programación)\n\n1. Desde el menú de Nivel 2, pulsa\
    \ la opción **'7: Programacion/Niv3'** [F2].\n2. Introduce la **clave de acceso\
    \ de Nivel 3** y pulsa **⊙** [F2].\n3. Cuando aparezca el mensaje **\"Memoria\
    \ Bloqueada / Presione OK para desbloquear\"**, pulsa **⊙** de nuevo [F2].\n \
    \  > ⚠️ El puente **J5** sobre el conector de PC debe estar puesto para poder\
    \ desbloquear la memoria [F2].\n4. Aparecerá el menú de programación [F2]:\n\n\
    ```\n[Programar]\n1:Op. Generales    2:Lazo\n3:Entradas Placa   4:Salidas Placa\n\
    ...\n```\n\n---\n\n## Paso 2 — Acceder al menú de Lazo y ejecutar Autobúsqueda\n\
    \n1. Pulsa **'2'** para entrar en el menú de **Lazo** [F1].\n2. Pulsa **'2'**\
    \ para seleccionar la función **'Autobusqueda'** [F1].\n3. Si la central tiene\
    \ más de un lazo, introduce el **número de lazo** correspondiente y pulsa **⊙**\
    \ [F1].\n4. Confirma que deseas realizar la autobúsqueda pulsando **⊙** [F1].\n\
    5. Espera a que el proceso finalice (se muestra una barra de progreso en pantalla)\
    \ [F1].\n\n> ⚠️ **Importante:** Si previamente se realizó un cambio de protocolo,\
    \ espera **dos minutos** antes de ejecutar la autobúsqueda [F1].\n\n---\n\n##\
    \ Paso 3 — Verificar el resultado\n\nAl finalizar, la pantalla mostrará un resumen\
    \ con el total de equipos y las diferencias detectadas [F1]:\n\n```\n[Lazo]  \
    \                Total: XX\nNuevos: X    Elimin.:X  Cambiad:X\nION: X  OPT: X\
    \  TMP: X  MLT: X\nPUL: X  MON: X  SIR: X  REL: X  OTROS: X\n```\n\n- Comprueba\
    \ que el campo **\"Nuevos\"** refleja el número de detectores añadidos [F1].\n\
    - Verifica que el **total de equipos** y los **tipos** mostrados corresponden\
    \ con los equipos físicamente instalados [F1].\n- Si la central tiene más de un\
    \ lazo, usa las teclas **▲ / ▼** para ver los resultados de otros lazos [F1].\n\
    \n---\n\n## Paso 4 — Salir\n\n- Pulsa **⊞** para abandonar la pantalla de resultados\
    \ y regresar al menú de Lazo [F1].\n\n---\n\n**Nota:** Por defecto, el sistema\
    \ asigna la **zona 1** a cualquier equipo nuevo detectado [F5]. Si necesitas reasignar\
    \ el nuevo detector a otra zona, deberás hacerlo desde la configuración de equipos\
    \ del lazo (menú **'2: Lazo'** → **'1: Confg. Equipos'**) [F1].\n\n---\n\nFuente:\
    \ DXc_Manual de configuracion (sin revisión registrada)\n\n---\n\U0001F4CB **Obligaciones\
    \ de evidencia del manual:**\n- Nota: la fuente es inconsistente: \"PUL: 4 MON:\
    \ 0 SIR: 2 REL: 1 OTROS : 2\" (DXc_Manual de configuracion, p. 48) [F1] declara\
    \ 1 OTROS y la enumeración servida lista 5 (DXc_Manual de configuracion, p. 48)\
    \ [F1]."
