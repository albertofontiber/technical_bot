- qid: cat020
  question: En una central Morley DXc instalada en Espana, ¿cual es el nivel de alarma
    y de prealarma por defecto de los detectores, y el maximo configurable?
  answer: '## Niveles de alarma y prealarma en detectores — Central Morley DXc (España)


    Los valores por defecto y el máximo configurable dependen del **tipo de detector**
    conectado al lazo.


    ---


    ### Detectores con protocolo Morley-IAS (detectores analógicos OTM, LSR, etc.)


    Los niveles se expresan como **niveles discretos** (Niv1 a Niv6/Niv9 según el
    tipo):


    **Valores por defecto** [F1]:

    - Nivel de **alarma (Fuego): Niv4**

    - Nivel de **prealarma: Niv3**


    Esto se puede ver en pantalla para los detectores OTM (óptico-térmicos multicriterio)
    [F1]:

    ```

    S001 OTM  Fuego:Niv4  Prealarma:Niv3

    ```


    **Niveles de referencia recomendados** según tablas del manual [F2]:


    Para detectores **OTM** (óptico-térmicos):

    - Prealarma recomendada (\*P): **Nivel 3** (6,5% osc./m)

    - Alarma recomendada (\*A): **Nivel 4** (6,5% a 11,5% osc./m, autoajustado)


    Para detectores **LSR** (láser):

    - Prealarma recomendada (\*P): **Nivel 4** (0,32% osc./m)

    - Alarma recomendada (\*A): **Nivel 5** (0,65% osc./m)


    ---


    ### Detectores OPT (ópticos convencionales analógicos) — protocolo Morley-IAS


    Los niveles se expresan en **porcentaje** [F1]:

    - Nivel de **alarma (Fuego): 100%**

    - Nivel de **prealarma: 80%**


    Esto se puede ver en pantalla [F1]:

    ```

    S004 OPT  Fuego:100%  Prealarma: 80%

    ```


    ---


    ### Máximo configurable


    - El **ajuste máximo para el nivel de alarma es el 108%** [F1].


    ---


    ### Restricciones de configuración


    - La central **no permite ajustar niveles que impidan el reconocimiento de las
    alarmas** [F3].

    - El **nivel de prealarma no puede ser superior al nivel de alarma** [F3].


    ---


    **Fuentes:**

    - DXc_Manual variaciones de mercado (sección 5.3.10.4 y 5.3.10.5.1), sin revisión
    registrada

    - DXc_Manual de configuración (sección 5.3.10.2 y 5.3.10.3), sin revisión registrada


    ---

    📋 **Información adicional del manual:**

    - Nota: el manual también indica: "### 5.3.10.5.1 Información específica para
    protocolo Morley-IAS


    • El valor analógico debe ser un número normalizado entre 0% – 100%, independientemente
    del tipo de equipo. Para los detectores, el nivel de prealarma por defecto es
    el 80% y el nivel de alarma por defecto es el 100%.


    • El ajuste máximo para el nivel de alarma es el 108%." [F1]


    ---

