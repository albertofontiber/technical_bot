- qid: hp018
  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  answer: '## Conexionado de sirenas convencionales en las salidas de sirena de la
    ZXe


    ⚠️ Conexionado de las sirenas: la fuente citada muestra este detalle en un DIAGRAMA
    que no puede transcribirse con fiabilidad a pasos de texto. Antes de cablear,
    consulta la figura del manual citado en esta respuesta (respeta la resistencia
    final de línea y la polaridad exactas que muestra el diagrama).


    ---


    ### Datos eléctricos clave


    - **Corriente máxima por circuito:** 1 A [F2][F11]

    - **RFL:** 6.800 Ω, 0,5 W mínimo [F2][F11]

    - **Longitud máxima de cable recomendada:** no superior a 1 km (por encima, la
    capacitancia e inductancia pueden afectar al funcionamiento) [F3]

    - **Sección mínima de cable:** no inferior a 1,5 mm² [F2]


    ---


    ### Terminales físicos en placa


    - **ZX2e:** terminales etiquetados **A+ A− B+ B−** en el bloque de sirenas [F4]

    - **ZX5e:** terminales **A− A+ B− B+ C− C+ D− D+** en el bloque **TB7** [F4]


    Para ver la ubicación exacta de los terminales en la placa, consulta la **Figura
    13** (ZX2e) y la **Figura 14** (ZX5e) del manual [F4].


    ---


    ### Procedimiento de conexionado


    1. **Conecta las sirenas en cadena** desde los terminales de salida de la central,
    respetando la polaridad (+ y −) en cada sirena [F3].


    2. **Sirenas con polaridad:** conéctalas directamente respetando + y − [F1].


    3. **Dispositivos sin polaridad (campanas, bobinas):** instala un **diodo de polarización**
    entre el terminal + y uno de los terminales de alimentación del dispositivo, para
    evitar consumo durante la supervisión [F2][F4].


    4. **Instala la RFL (6.800 Ω / 0,5 W mínimo) entre + y − de la última sirena**
    del circuito, al final de la cadena [F2][F11].


    5. **Si no hay ninguna sirena conectada** en una salida, instala la RFL directamente
    en los terminales de la central para esa salida [F2].


    6. **No realices ramales paralelos:** la supervisión se realiza en la línea directa
    hasta la RFL; los ramales no quedan supervisados [F1].


    7. **No enrolles el cable en los terminales:** corta y empalma las conexiones
    adecuadamente para mantener la supervisión de la línea [F3].


    ---


    ### Principio de supervisión


    El circuito se supervisa ante **cortocircuito y circuito abierto** [F11]. La corriente
    de supervisión circula en **sentido inverso** al de activación (pequeña tensión
    con polaridad inversa en reposo). Al dispararse la salida, la corriente circula
    en sentido normal [F2].


    ---


    > ⚠️ **Verifica el consumo total de la central** con todas las sirenas activadas
    para no exceder el límite de corriente total del sistema [F2].


    Para el esquema visual del circuito completo, consulta la **Figura 15 – Circuito
    de sirenas convencionales** del manual de instalación [F3].


    ---


    **Fuente:** Manual de Instalación Paneles de Incendio ZX2e / ZX5e, Documento No.
    MIE-MI-530, Revisión: 001 [F3][F4][F11]; Manual de Instalación ZXAE/ZXEE, DOC.MIE-MI-310,
    sin revisión registrada [F1][F2]


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "Cada sirena deberá tener un diodo integrado, para impedir el consumo en polarización
    inversa (supervisión)." (MIE-MI-530rv001, p. 21) [F4]

    - "Todas las salidas de sirena quedan configuradas por defecto para sonar de forma
    contínua con cualquier alarma de cualquier zona, quedándo así en el patrón 1."
    (MIE-MP-310, p. 38) [F6]'
