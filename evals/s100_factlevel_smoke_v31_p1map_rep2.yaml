- qid: hp013
  question: ¿Cómo se cambia la batería tampón de la Detnov ADW535 sin perder configuración?
  answer: 'El procedimiento de sustitución de la batería de litio **no está documentado
    paso a paso** en los fragmentos disponibles. Sin embargo, sí hay información relevante
    que te afecta directamente:


    ---


    ## Lo que SÍ confirman los fragmentos


    **Sobre la configuración y su almacenamiento:**


    - Las configuraciones específicas del sistema se guardan en una **EEPROM** [F12],
    no en la batería. Esto significa que los parámetros programados **no dependen
    de la batería para su retención**.

    - La batería de litio está ubicada en el **Main Board LMB 35** [F6][F8].

    - Su función principal está asociada al **módulo de reloj RTC** [F8].


    **Sobre el fallo de batería:**


    - El código de fallo **G80 / 008** indica "Fallo reloj" y sus causas son: la cinta
    aislante de la batería de litio aún no retirada, el reloj no ajustado, o batería
    de litio defectuosa → sustituir [F10].

    - Tras sustituir la batería, deberás **ajustar el reloj** (fecha/hora) desde «ADW
    Config» [F6][F10].


    **Sobre el reset de hardware al reconectar:**


    - Si se interrumpe la tensión de alimentación momentáneamente durante el proceso,
    se producirá un **reset de hardware**, que provoca un disparo momentáneo del relé
    de fallo de aproximadamente **1 s** [F3].

    - Los parámetros programados con anterioridad **se mantienen** tras un reset de
    hardware [F3].

    - ⚠️ Es **imprescindible desconectar previamente los controles de incendios y
    las alertas remotas** de la CDI de orden superior antes de realizar trabajos de
    mantenimiento [F3].


    **Sobre el reset inicial:**


    - La sustitución del **Main Board LMB 35** obliga a realizar un nuevo **reset
    inicial** [F1][F2]. Si solo cambias la batería sin sustituir el LMB 35 completo,
    los fragmentos no indican que sea necesario un reset inicial.


    ---


    ## Limitación importante


    El manual **no describe el procedimiento paso a paso de extracción e inserción
    de la batería de litio** en los fragmentos disponibles. Para el procedimiento
    físico exacto (tipo de batería, forma de extracción del soporte), consulta el
    manual físico completo del ADW535 o contacta con el soporte técnico de Securiton/Detnov.


    ---


    Fuente: ADW535, Descripción técnica, T 140 358 e es (sin revisión registrada)


    ---

    ⚠️ **Información adicional del manual:**

    - "* Para la puesta en funcionamiento, así como después de realizar modificaciones
    en el tubo sensor (longitud, reparaciones) es **obligatorio llevar a cabo** un
    reset inicial con la caja del ADW abierta." [F2]'
