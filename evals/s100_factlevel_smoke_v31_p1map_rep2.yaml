per_gold:
- qid: hp002
  question: El detector ASD535 de Detnov está dando una alarma intermitente de flujo
    bajo. ¿Cuál es la causa más probable y cómo se diagnostica?
  answer: '# ASD535 — Alarma intermitente de flujo bajo: causa y diagnóstico


    La causa más probable es una **obstrucción en el conducto de aspiración** (código
    de fallo **G30/001**), que provoca que el flujo de aire caiga por debajo del **80
    %** del valor nominal registrado en el reset inicial [F2][F8].


    ---


    ## Lógica del fallo


    El ASD535 monitoriza el flujo de aire comparando el valor real con el valor nominal
    (100 %) registrado en el último reset inicial [F1]. Cuando el flujo cae por debajo
    del **80 %** (variación > −20 %), el sistema:


    1. Hace parpadear el LED **«Fault»** inmediatamente [F7]

    2. Transcurridos **300 s** de tiempo de retardo (LS-Ü), dispara el aviso de fallo
    de flujo de aire [F1][F2]


    Esto es lo que genera la alarma intermitente que describes.


    ---


    ## Diagnóstico paso a paso


    **1. Leer el valor de flujo actual**

    - Accede a la lectura de flujo mediante la posición de conmutador **V** (sección
    7.6.1 del manual) [F2]

    - Valor < 100 % → apunta a obstrucción [F2]

    - Valor > 100 % → apuntaría a rotura de tubo (no es tu caso)


    **2. Inspeccionar el conducto de aspiración (código G30/001)**

    Según la tabla de fallos [F8], comprobar:

    - Orificios de aspiración: verificar si están tapados o sucios

    - Salida de aire en el ASD: comprobar que no esté obstruida

    - Caja de filtro / unidad de filtrado: inspeccionar y limpiar si procede


    **3. Inspeccionar y limpiar el sensor de flujo de aire**

    El propio código G30/001 indica también inspeccionar y limpiar el sensor de flujo
    de aire [F8]. Si tras la limpieza el sensor sigue dando lecturas erróneas, verificar
    código **G30/004** (parámetros LS-Ü no válidos), que puede indicar sensor defectuoso
    → sustituir [F8].


    **4. Verificar el sensor de flujo de aire (código G30/008)**

    Si el sensor no está enchufado, el cable de conexión está defectuoso, o el sensor
    es inexistente/averiado, se generará el código **G30/008** [F8]:

    - Comprobar que el enchufe A del sensor está correctamente conectado al AMB 35
    [F6]

    - Comprobar el cable de conexión


    **5. Verificar la tensión de alimentación**

    Medir en bornes **1 y 2** (y 3 y 4 si hay alimentación redundante) [F10]:

    - Funcionamiento a **12 V CC**: rango válido **12,3 – 13,8 V CC** [F10]

    - Funcionamiento a **24 V CC**: rango válido **21,6 – 27,6 V CC** [F10]

    - Una tensión fuera de rango puede provocar funcionamiento defectuoso [F10]


    **6. Tras resolver la causa: ejecutar nuevo reset inicial**

    Una vez corregida la obstrucción o sustituido el componente defectuoso, es **imprescindible
    realizar un nuevo reset inicial** para que el sistema registre los nuevos valores
    nominales de flujo [F1][F6].


    ---


    ## ⚠ Advertencia sobre la configuración de la ventana


    Si la ventana de monitorización está configurada por debajo de **±20 %** con un
    tiempo de retardo ≤ 300 s, el riesgo de avisos de fallo erróneos aumenta significativamente
    [F5]. Cualquier modificación de estos parámetros por encima de ±20 % o del tiempo
    de retardo implica incumplimiento de la norma **EN 54-20** y requiere consulta
    previa con el fabricante [F1][F5].


    ---


    **Fuente:** ASD535, Descripción técnica, T 131 192 h es (sin revisión registrada
    en los fragmentos)


    ---

    ⚠️ **Información adicional del manual:**

    - "Al conectar el nuevo AMB 35, debe prestarse atención a la correcta asignación
    de los bornes de conexión y del enchufe de cable plano (véase para ello también
    la Fig." [F6]

    - "Para ello, deberán presionarse las pestañas de agarre C del sensor de flujo
    de aire en dirección al fondo de la caja hasta que la lengüeta de desbloqueo quede
    encajada por encima del sensor 🡺 **Atención: no ejercer presión sobre los cables
    de conexión del sensor de flujo de aire.**" [F6]

    - Nota: el manual también indica: "En las posiciones de conmutador A11 a C32,
    cualquier variación de este valor que supere el ±20 % – es decir, por debajo del
    80 % (suciedad/obstrucción) o por encima del 120 % (rotura de tubo) – disparará
    un aviso «fallo flujo de aire» una vez transcurrido el tiempo de retardo de 300
    s de la LS-Ü." [F1]'
