- qid: hp009
  question: ¿Cuál es la resistencia de fin de línea recomendada para los lazos de
    la central Morley ZXe?
  answer: 'La resistencia de fin de línea (RFL) para los **circuitos de sirenas**
    de la ZXe es de **6,8 KΩ (6800 Ω), 0,5 W mínimo** [F9][F1].


    Debe instalarse en el final de cada circuito de sirena para la supervisión ante
    cortocircuito y circuito abierto [F9].


    **Detalles adicionales sobre la RFL de sirenas:**


    - Se instala entre el terminal **+** y **−** de la última sirena del circuito
    [F1]

    - Si no hay sirenas conectadas en la salida, la RFL se conecta directamente en
    los terminales de la central [F1]

    - No se deben realizar ramales en la línea de sirenas, ya que la supervisión se
    realiza en la línea directa hasta la RFL; los ramales paralelos no quedan supervisados
    [F2]


    ---


    **Nota sobre otros lazos de la ZXe:**


    El lazo **RS-485** (periférico/red de centrales) usa una RFL diferente: **150
    Ω, 0,5 W mínimo**, colocada en los extremos libres del principio y final de la
    cadena [F8].


    El **lazo analógico** de la ZXe no utiliza resistencia de fin de línea; su supervisión
    se realiza mediante la comunicación digital a dos hilos [F9].


    ---


    Fuente: Manual de Instalación Paneles de Incendio ZX2e / ZX5e (Documento No. MIE-MI-530,
    Revisión: 001); Manual de Instalación ZXAE/ZXEE (DOC.MIE-MI-310, sin revisión
    registrada)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "Es imprescindible comprobar que no hay conexión entre los terminales A y B
    y que el lazo entra a un lado del conector y sale por el otro o termina en la
    resistencia RFL de 150 Ohmios." (MIE-MI-310, p. 22) [F4]

    - "Debe instalarse siempre una resistencia RFL entre + y - de la última sirena
    para controlar la apertura o cierre de la línea de sirenas." (MIE-MI-310, p. 18)
    [F1]'
