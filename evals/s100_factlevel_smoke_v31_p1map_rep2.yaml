- qid: cat007
  question: En el detector por aspiración FAAST LT-200, ¿qué salidas de relé y de
    sirena tiene y con qué contactos, cómo se comporta el relé de avería ante un fallo
    o un corte de alimentación, qué resistencia de fin de línea llevan las salidas
    de sirena y cuál es la especificación eléctrica de los contactos de relé?
  answer: '## FAAST LT-200 — Salidas de relé y sirena: contactos, comportamiento y
    especificaciones


    ---


    ### 1. Relés disponibles y su comportamiento


    El FAAST LT-200 (versión Stand-Alone) dispone de los siguientes relés [F1]:


    - **Relé de ALARMA 1 y 2:** Se activa cuando se cumple la condición de alarma
    en el canal correspondiente. Condición predeterminada = Nivel 1. **Estado enclavado
    por defecto** — se requiere REARME manual para desactivar el LED y el relé [F1].

    - **Relé de PREALARMA 1 y 2:** Se activa cuando se cumple la condición de prealarma
    en el canal. Condición predeterminada = Nivel 1. Nota: cuando PREALARMA = ALARMA
    = Nivel 1, la prealarma se activa al **70 % del Nivel 1** [F1].

    - **Relé de AVERÍA 1 y 2:** Se activa ante una condición de avería en el canal
    1 o 2, o ante una avería común. **También se activa en modo de servicio y cuando
    se desconecta la alimentación de la unidad.** Estado de avería **no enclavado**
    (predeterminado) [F1].

    - **Salida de SIRENA 1 y 2:** Se activa cuando el canal está en ALARMA o PREALARMA.
    La sirena 1 corresponde al canal 1 y la sirena 2 al canal 2. Estado predeterminado
    = activada en ALARMA [F1].


    > **Comportamiento del relé de avería ante corte de alimentación:** el relé de
    avería se activa también cuando se desconecta la alimentación de la unidad [F1].
    El estado no está enclavado [F1].


    ---


    ### 2. Contactos de cada relé (terminales)


    Según la tabla de designaciones de terminales [F6]:


    **Relé de ALARMA:**

    - Canal 1 (T1): terminales 5 (NC), 6 (C), 7 (NA)

    - Canal 2 (T2): terminales 8 (NC), 9 (C), 10 (NA)


    **Relé de AVERÍA:**

    - Canal 1 (T3): terminales 11 (NC), 12 (C), 13 (NA)

    - Canal 2 — AUX. (T4): terminales 14 (NC AUX.), 15 (C AUX.), 16 (NA AUX.)


    **Relé de PREALARMA:**

    - Canal 1 (T9): terminales 23 (NC), 24 (C), 25 (NA)

    - Canal 2 (T10): terminales 26 (NC), 27 (C), 28 (NA)


    Todos los relés de alarma, avería y prealarma exponen contactos **NC, C (común)
    y NA** [F6].


    ---


    ### 3. Salidas de sirena y resistencia de fin de línea


    - **Sirena 1** (T5): terminales 17 (–) y 18 (+) — resistencia de fin de línea
    de **47 kΩ** [F6]

    - **Sirena 2** (T6): terminales 19 (–) y 20 (+) — resistencia de fin de línea
    de **47 kΩ** [F6]


    ---


    ### 4. Especificación eléctrica de los contactos de relé


    - Corriente máxima con carga resistiva **30 V CC: 2,0 A** [F3][F7]

    - Corriente máxima con carga resistiva **30 V CA: 0,5 A** [F3][F7]

    - Vida útil mínima: **10⁵ operaciones** [F3]


    ---


    **Fuentes:**

    - I56-6574-005_ES — HS Stand Alone FAAST LT-200 QIG (sin revisión registrada)

    - I56-6577-006_ES — FAAST Notifier LT-200 QIG (sin revisión registrada)'
  family_resolved: true
  gold_families:
