- qid: cat017
  question: ¿Como se cablea y se da de alta (configura) un lazo en la central Notifier
    INSPIRE (E10/E15)?
  answer: "# Cableado y configuración (alta) de lazo en INSPIRE E10/E15\n\nA continuación\
    \ se detalla el proceso completo en dos bloques: **cableado físico** y **configuración\
    \ en CLSS**.\n\n---\n\n## BLOQUE 1 — CABLEADO FÍSICO DEL LAZO\n\n### Terminales\
    \ del módulo LAZO OPAL X2 (HOP-433-100)\n\nEl módulo de lazo es de color **morado**\
    \ [F2] y dispone de 10 terminales [F2][F3]:\n\n**Lazo 1:**\n- Terminal **1**:\
    \ Lazo 1 Salida +VE\n- Terminal **2**: Lazo 1 Salida -VE\n- Terminal **3**: ⊕\
    \ (tierra — **NO usar para pantalla de cable**)\n- Terminal **4**: Lazo 1 Entrada\
    \ +VE\n- Terminal **5**: Lazo 1 Entrada -VE\n\n**Lazo 2:**\n- Terminal **6**:\
    \ Lazo 2 Salida +VE\n- Terminal **7**: Lazo 2 Salida -VE\n- Terminal **8**: ⊕\
    \ (tierra — **NO usar para pantalla de cable**)\n- Terminal **9**: Lazo 2 Entrada\
    \ +VE\n- Terminal **10**: Lazo 2 Entrada -VE\n\n> ⚠️ **No utilice los terminales\
    \ 3 y 8 para la pantalla del cable de lazo. La pantalla debe conectarse a la barra\
    \ de tierra de la central** [F2][F3].\n\n---\n\n### Advertencias previas al cableado\n\
    \n- **No mezclar dispositivos OPAL y CLIP en el mismo lazo** [F2].\n- **NUNCA\
    \ utilice un dispositivo de alta tensión** (como un comprobador de resistencia\
    \ de aislamiento) en el circuito de lazo. Solo se permiten comprobadores de baja\
    \ tensión como multímetro [F6].\n- Se recomienda poner a tierra **un extremo**\
    \ de la pantalla del cable de lazo en la barra de tierra de la central [F5].\n\
    \n---\n\n### Capacidades del lazo [F2][F4]\n\n**Modo OPAL:**\n- Hasta **159 detectores\
    \ OPAL** por lazo\n- Hasta **159 módulos OPAL** por lazo (sirenas, pulsadores,\
    \ módulos E/S)\n- Máximo **750 mA** por lazo\n\n**Modo CLIP** (requiere licencia):\n\
    - Hasta **99 detectores CLIP** por lazo\n- Hasta **99 módulos CLIP** por lazo\n\
    \n> ⚠️ **EN54**: Restricción de **512 detectores y/o pulsadores** por módulo de\
    \ lazo (2 circuitos) según EN54-2, 13.7 [F2].\n\n> ℹ️ Aprobación VdS2540 con **99\
    \ detectores + 99 módulos** por lazo de **∅ 0,8 mm** [F4].\n\n---\n\n### Comprobaciones\
    \ con multímetro ANTES de conectar a la central\n\nRealiza estas verificaciones\
    \ con el lazo desconectado de los terminales de la central [F6][F7][F8]:\n\n**1.\
    \ Continuidad y resistencia del lazo:**\n- Comprueba la continuidad de cada parte\
    \ del lazo [F6].\n- Mide la resistencia de extremo a extremo entre **Lazo X Entrada\
    \ -VE** y **Lazo X Salida -VE** [F8].\n- Multiplica el resultado por 2 y añade\
    \ la resistencia de cada aislador (**0,1 a 0,13 Ω**) [F8].\n- La capacidad del\
    \ cable debe ser **inferior a 0,5 µF** [F8].\n\nLímites de resistencia máxima\
    \ [F8]:\n- Protocolo **OPAL**: resistencia **< 40 Ω**\n- Protocolo **CLIP** (detección\
    \ de dirección duplicada): resistencia **< 40 Ω**\n- Protocolo **CLIP** (sin detección\
    \ de dirección duplicada): resistencia **< 71 Ω**\n\n> ℹ️ Con aisladores en cada\
    \ dispositivo OPAL, el conductor positivo del lazo será un circuito abierto [F6].\
    \ Para dispositivos CLIP con aisladores, puentea temporalmente los terminales\
    \ **2 y 4** de cada aislador [F8].\n\n**2. Comprobación de polaridad con función\
    \ diodo del multímetro** [F7]:\n- Conecta el multímetro en **polaridad invertida**\
    \ (+VE del multímetro al negativo del lazo, -VE al positivo). Debe indicar un\
    \ **diodo en polarización directa**.\n- Conecta en **polaridad normal** (+VE al\
    \ positivo, -VE al negativo). Al principio debe leer resistencia baja, que aumenta\
    \ progresivamente al cargarse los condensadores de los dispositivos.\n- Si en\
    \ polaridad normal indica diodo en directa, hay dispositivos con **polaridad invertida\
    \ o cortocircuito** [F7].\n\n**3. Comprobación de pantalla de cable** [F7]:\n\
    - Verifica que no hay continuidad entre la pantalla y el cable +VE.\n- Verifica\
    \ que no hay continuidad entre la pantalla y el cable -VE.\n- Si la pantalla no\
    \ está conectada a la barra de tierra de la central, comprueba que no tiene ninguna\
    \ otra conexión a tierra en el recorrido del lazo.\n\n> ℹ️ Se recomienda usar\
    \ la herramienta **POL-200-TS** para comprobar y medir circuitos de lazo antes\
    \ de conectar a la central. La herramienta **POL-200** funciona tanto en protocolo\
    \ OPAL como CLIP [F5].\n\n---\n\n### Conexión a la central\n\n**Lazo OPAL:** Una\
    \ vez verificado el cableado, conecta el circuito al bloque de terminales de lazo\
    \ seleccionado en la central [F5].\n\n**Lazo CLIP** [F5]:\n1. Vuelve a conectar\
    \ los aisladores que se puentearon temporalmente, los módulos de lazo y los pulsadores.\n\
    2. Conecta el circuito al bloque de terminales de lazo seleccionado en la central.\n\
    \n---\n\n## BLOQUE 2 — CONFIGURACIÓN (ALTA) DEL LAZO EN CLSS\n\n### Numeración\
    \ de lazos\n\nLos circuitos de lazo se numeran **secuencialmente de izquierda\
    \ a derecha** del portamódulos. El primer módulo de lazo instalado en la ranura\
    \ izquierda tiene el lazo 1, y los siguientes se numeran correlativamente. En\
    \ la E15 (dos filas de portamódulos), la segunda fila continúa la numeración desde\
    \ la primera [F2].\n\n---\n\n### Paso 1 — Configuración previa en CLSS (obligatoria\
    \ antes de Auto Configuración)\n\n> ⚠️ De forma predeterminada, la central tiene\
    \ licencia solo para **protocolo OPAL avanzado**. Para usar CLIP o TC800 OPAL/CLIP\
    \ se requiere **licencia adicional** antes de realizar Auto Configuración [F9].\n\
    \n1. Conecta la herramienta de configuración CLSS a la central [F9].\n2. Ve a\
    \ **\"Ajustes\"** → **\"Ajustes HMI\"** y en **Tipo de marca** selecciona **Notifier\
    \ EN** [F9].\n3. Ve a **\"Ajustes de lazo\"** [F9]:\n   - Si el lazo **no se utiliza**:\
    \ marca ☑ **Sin Uso** [F1][F9].\n   - Si el lazo **se utiliza**: selecciona **\"\
    Limitar a VdS 2540\"** (Sí o No) — el valor de resistencia cambia según la selección.\
    \ Selecciona el **tipo de cable** [F9].\n4. Envía la configuración a la central\
    \ siguiendo los pasos del apartado **\"Enviar configuración a la central\"** [F9].\n\
    \n---\n\n### Paso 2 — Auto Configuración (búsqueda de dispositivos)\n\nCon la\
    \ central encendida y la configuración inicial enviada [F10]:\n\n1. Selecciona\
    \ **Auto Configuración** para buscar dispositivos conectados al circuito de lazo.\
    \ Lee la información de la ventana emergente y confirma seleccionando **Auto Configuración**\
    \ [F10].\n\n   > ℹ️ Si no hay protocolo especificado en la configuración, el lazo\
    \ usará el **protocolo OPAL** por defecto [F10].\n\n2. Una vez completada la Auto\
    \ Configuración, selecciona la **flecha > derecha** junto al botón Auto Búsqueda\
    \ para ver el estado de averías del lazo [F10].\n\n3. Lee los mensajes de avería\
    \ y toma las medidas necesarias. Selecciona **Hecho** al completar. Si no hay\
    \ averías, vuelve ← a la página **Información del sistema** [F10].\n\n4. Si se\
    \ han rectificado averías, **repite los pasos 1 a 3** [F10].\n\n5. **Repite el\
    \ proceso para cada lazo** hasta descubrir todos [F10].\n\n---\n\n### Causas típicas\
    \ de averías tras Auto Configuración [F10]:\n- Discordancia entre el diseño de\
    \ la instalación y el cableado\n- Averías en el cableado\n- Presencia de fuente\
    \ de RFI fuerte\n- Error de un módulo o fuente de alimentación\n- Conexionado\
    \ incorrecto en los dispositivos\n- Dispositivo con dirección 00 (sin asignar)\n\
    \n---\n\n**Fuentes:**\n- HOP-138-8ES issue 6, 01-2026 — INSPIRE E10/E15 Instrucciones\
    \ de puesta en marcha\n- HOP-138-9ES issue 5, 11-2025 — INSPIRE E10/E15 Manual\
    \ de instalación"
