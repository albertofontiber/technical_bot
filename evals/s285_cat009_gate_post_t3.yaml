  bot_answer: "## Resistencia de Fin de Línea (EOL) — NFS Supra\n\nLa central NFS\
    \ Supra admite **dos modos de supervisión de zona**, configurables desde el menú\
    \ de la central [F2][F5]:\n\n---\n\n### Modo por defecto: **Capacitivo (EFL)**\n\
    - Final de línea: **condensador de 47 µF** [F5]\n- Se instala entre el positivo\
    \ y negativo de la línea, en la salida del **último equipo** de la zona [F3]\n\
    - Es el modo de fábrica [F2]\n\n---\n\n### Modo alternativo: **Resistivo (RFL)**\n\
    - Final de línea: **resistencia de 6K8 Ω** [F5]\n- Rango admisible de resistencia:\
    \ entre **3 KΩ** (consumo máx. por zona 2,5 mA) y **7 KΩ** (consumo máx. por zona\
    \ 4 mA) [F5]\n- Se instala igualmente en la salida del **último equipo** de la\
    \ zona [F3]\n\n> ⚠️ **Importante:** Todas las zonas, **incluso las no usadas**,\
    \ deben tener instalada su final de línea según la configuración del sistema (EFL\
    \ o RFL) [F5][F6].\n\n---\n\n### Cómo cambiar el modo de supervisión\n\n1. Acceder\
    \ al menú pulsando simultáneamente **Tecla TECLADO + Tecla EVACUACIÓN** [F2]\n\
    2. Cambiar la opción con la tecla **REARME** (requiere **nivel de acceso 3 — Configuración**)\
    \ [F2]\n3. Verificar el LED activo:\n   - **LED 1 Alarma (Rojo) = ON** → Modo\
    \ **Resistivo 6K8 Ω** [F2]\n   - **LED 2 Anulada (Ámbar) = ON** → Modo **Capacitivo\
    \ 47 µF / Diodo** (por defecto) [F2]\n\n---\n\n### Nota sobre versiones del manual\n\
    \nLos fragmentos recuperados muestran una **discrepancia entre versiones**:\n\
    - Manual **v05** (español e inglés): resistencia resistiva = **6K8 Ω** [F1][F2][F5][F6]\n\
    - Manual **v04** (inglés): resistencia resistiva = **4K7 Ω** [F8]\n\nVerifica\
    \ la versión del manual que corresponde a tu equipo instalado antes de seleccionar\
    \ el valor.\n\n---\n\nFuentes:\n- HLSI-MN-025_NFS Supra (v05, español)\n- HLSI-MN-025-I_NFS\
    \ Supra Series v05 (inglés)\n- HLSI-MN-025-I_NFS Supra Series (v04, inglés)\n\n\
    También puedo ayudarte con: **conexionado de detectores en zona**, **cálculo del\
    \ número máximo de sensores por zona** o **configuración de los circuitos de sirena\
    \ (EOL de salidas)**.\n\n---\n⚠️ **Obligaciones de evidencia del manual:**\n-\
    \ \"Esto significa que debe calcular el número de sensores a instalar dependiendo\
    \ de su consumo sin sobrepasar nunca los 32 sensores.\" (HLSI-MN-025_NFS Supra,\
    \ p. 28) [F3]\n- Nota: la fuente es inconsistente: \"La central NFS Supra tiene\
    \ cuatro, ocho o doce zonas de alarma.\" (HLSI-MN-025_NFS Supra, p. 27) [F5] declara\
    \ 12 zonas y la enumeración servida lista 6 (HLSI-MN-025_NFS Supra, p. 27) [F5]."
