- qid: hp013
  question: ¿Cómo se cambia la batería tampón de la Detnov ADW535 sin perder configuración?
  answer: "El procedimiento específico de sustitución de la batería de litio tampón\
    \ sin pérdida de configuración **no está documentado en los fragmentos disponibles**.\n\
    \nLo que sí puedo confirmar a partir de los fragmentos:\n\n**Sobre la batería\
    \ de litio en el LMB 35:**\n- El **LMB 35** (Main Board) incorpora una **batería\
    \ de litio** y un **módulo de reloj RTC** [F9].\n- La batería de litio aparece\
    \ identificada visualmente en la **Fig. 31** como elemento del LMB 35 [F6].\n\
    - El código de fallo **G50/G60 – 008** indica \"Fallo reloj\" y como causa posible\
    \ señala que **\"la cinta aislante de la batería de litio aún no se ha retirado\"\
    ** [F11], lo que sugiere que la batería viene con cinta protectora de fábrica.\n\
    \n**Sobre la configuración y su persistencia:**\n- Los parámetros de configuración\
    \ del ADW 535 se almacenan en **Flash-PROM** y **EEPROM** del microprocesador\
    \ del LMB 35 [F9]. Estos tipos de memoria son no volátiles, por lo que en principio\
    \ no dependen de la batería para retener la configuración.\n- La batería de litio\
    \ está asociada al **módulo de reloj RTC** (fecha/hora) [F9], no al almacenamiento\
    \ de parámetros de configuración.\n- El **reset de hardware** (interrupción de\
    \ tensión de alimentación) mantiene los parámetros programados [F3].\n\n**Advertencia\
    \ importante:**\n- Cualquier trabajo de reparación en el **LMB 35** obliga a realizar\
    \ un **nuevo reset inicial** del tubo sensor [F1][F2].\n- Antes de cualquier trabajo\
    \ de mantenimiento, es **imprescindible** bloquear o desconectar los controles\
    \ de incendios y alertas remotas de la CDI de orden superior [F8].\n- El reset\
    \ de hardware provoca un **disparo momentáneo del relé de fallo (aprox. 1 s)**\
    \ [F3].\n\n**Recomendación:**\nEl manual no describe el procedimiento paso a paso\
    \ para sustituir la batería de litio. Consulta directamente el soporte técnico\
    \ de Securiton/Detnov o el manual de servicio del LMB 35, ya que la sustitución\
    \ de componentes del Main Board puede requerir reset inicial posterior [F2].\n\
    \n---\nFuente: ADW535, Descripción técnica, T 140 358 e es (sin revisión registrada)\n\
    \n---\n⚠️ **Información adicional del manual:**\n- \"* Para la puesta en funcionamiento,\
    \ así como después de realizar modificaciones en el tubo sensor (longitud, reparaciones)\
    \ es **obligatorio llevar a cabo** un reset inicial con la caja del ADW abierta.\"\
    \ [F2]\n- \"1. Bloquear o desconectar el control de incendios y la alerta remota\
    \ en la CDI de orden superior.\n\n2. La tensión de alimentación de la CDI debe\
    \ estar configurada para la central conforme a la normativa de mantenimiento.\n\
    \n3. Abrir la cubierta de la unidad de evaluación. Deberán efectuarse las siguientes\
    \ mediciones:\n   * Medir la tensión de servicio en los bornes 1 (+), 2 (-) \U0001F87A\
    \ Valor nominal = 10,8 a 13,8 V-CC (con 12 V-CC) o 21,6 a 27,6 V-CC (con 24 V-CC).\n\
    \   * Leer la configuración establecida y los valores de presión de cada tubo\
    \ sensor en la posición de conmutador *P* (véase el cap. 7.6.1) y compararlos\
    \ con el protocolo de puesta en servicio.\" [F8]"
