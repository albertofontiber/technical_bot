- qid: hp010
  question: En la Morley DXc, ¿cómo se añade un nuevo detector al lazo tras la puesta
    en marcha inicial?
  answer: "# Añadir un nuevo detector al lazo en la Morley DXc tras la puesta en marcha\n\
    \nEl procedimiento consiste en conectar físicamente el detector al lazo y luego\
    \ ejecutar una **Autobúsqueda** desde el menú de programación para que la central\
    \ lo reconozca.\n\n---\n\n## Paso 1 — Acceder al Nivel 3\n\n1. Desde el estado\
    \ en reposo, accede al **Nivel 2** mediante la opción **'5: Menú'** [F2].\n2.\
    \ En el menú de Nivel 2, pulsa **'7: Programacion/Niv3'** [F2].\n3. Introduce\
    \ la **clave de acceso de Nivel 3** y pulsa **⊙** para confirmar [F2].\n4. Cuando\
    \ aparezca el mensaje **\"Memoria Bloqueada / Presione OK para desbloquear\"**,\
    \ pulsa **⊙** de nuevo [F2].\n   > ⚠️ El puente **J5** sobre el conector de PC\
    \ debe estar puesto para poder desbloquear la memoria [F2].\n\n---\n\n## Paso\
    \ 2 — Acceder al menú de Lazo\n\nEn el menú de programación, pulsa **'2: Lazo'**\
    \ [F2]:\n\n```\n[Programar]\n1:Op. Generales    2:Lazo\n3:Entradas Placa   4:Salidas\
    \ Placa\n...\n```\n\n---\n\n## Paso 3 — Ejecutar la Autobúsqueda\n\n1. En el menú\
    \ de Lazos, pulsa **'2: Autobusqueda'** [F1].\n2. Si la central tiene más de un\
    \ lazo, introduce el **número de lazo** correspondiente y pulsa **⊙** [F1].\n\
    3. Confirma la autobúsqueda pulsando **⊙** cuando aparezca:\n   ```\n   Lazo:\
    \ X  Autobusqueda?\n   OK:Confirm    ←:Cancel\n   ```\n   [F1]\n4. La central\
    \ mostrará el progreso:\n   ```\n   Lazo: X  Reconocimiento en progreso...\n \
    \  ```\n   [F1]\n\n---\n\n## Paso 4 — Verificar el resultado\n\nAl finalizar,\
    \ la pantalla muestra un resumen con el total de equipos y las diferencias detectadas\
    \ [F1]:\n\n```\n[Lazo]                  Total: XX\nNuevos: X    Elimin.:0   Cambiad:0\n\
    ION: X  OPT: X  TMP: X  MLT: X\nPUL: X  MON: X  SIR: X  REL: X  OTROS: X\n```\n\
    \n- **Comprueba que el campo \"Nuevos\" refleja el detector recién añadido** [F1].\n\
    - Verifica que el total de equipos y los tipos mostrados corresponden con los\
    \ equipos físicamente instalados [F1].\n- Si la central tiene más de un lazo,\
    \ usa las teclas **▲ / ▼** para ver los resultados de otros lazos [F1].\n- Pulsa\
    \ **⊞** para salir y regresar al menú de Lazo [F1].\n\n---\n\n## ⚠️ Aviso importante\
    \ sobre cambio de protocolo\n\nSi previamente se realizó un **cambio de protocolo**,\
    \ espera **dos minutos** antes de ejecutar la autobúsqueda, ya que la central\
    \ necesita tiempo para rearmar los equipos del lazo [F1].\n\n---\n\n**Fuente:**\
    \ DXc_Manual de configuracion (sin revisión registrada)\n\n---\n\U0001F4CB **Obligaciones\
    \ de evidencia del manual:**\n- Nota: la fuente es inconsistente: \"PUL: 4 MON:\
    \ 0 SIR: 2 REL: 1 OTROS : 2\" (DXc_Manual de configuracion, p. 48) [F1] declara\
    \ 1 OTROS y la enumeración servida lista 5 (DXc_Manual de configuracion, p. 48)\
    \ [F1]."
