- qid: cat017
  question: ¿Como se cablea y se da de alta (configura) un lazo en la central Notifier
    INSPIRE (E10/E15)?
  answer: "# Cableado y configuración de lazo en INSPIRE E10/E15\n\nA continuación\
    \ se detalla el proceso completo en dos fases: **cableado físico** y **configuración/alta\
    \ en CLSS**.\n\n---\n\n## FASE 1 — CABLEADO FÍSICO DEL LAZO\n\n### 1.1 Módulo\
    \ de lazo OPAL X2 (HOP-433-100)\n\nEl módulo de doble lazo tiene **10 terminales**\
    \ [F2][F3]:\n\n**Lazo 1:**\n- Terminal **1** → Lazo 1 Salida +VE\n- Terminal **2**\
    \ → Lazo 1 Salida -VE\n- Terminal **3** → ⊕ (**NO usar para pantalla de cable**)\n\
    - Terminal **4** → Lazo 1 Entrada +VE\n- Terminal **5** → Lazo 1 Entrada -VE\n\
    \n**Lazo 2:**\n- Terminal **6** → Lazo 2 Salida +VE\n- Terminal **7** → Lazo 2\
    \ Salida -VE\n- Terminal **8** → ⊕ (**NO usar para pantalla de cable**)\n- Terminal\
    \ **9** → Lazo 2 Entrada +VE\n- Terminal **10** → Lazo 2 Entrada -VE\n\n> ⚠️ **La\
    \ pantalla del cable de lazo debe conectarse a la barra de tierra de la central,\
    \ NO a los terminales 3 u 8** [F2][F3]. Se recomienda poner a tierra un solo extremo\
    \ de la pantalla [F10].\n\n> ⚠️ **No se permite mezclar dispositivos OPAL y CLIP\
    \ en el mismo lazo** [F2].\n\n---\n\n### 1.2 Capacidad del lazo\n\n**Modo OPAL**\
    \ [F2][F4]:\n- Hasta **159 detectores OPAL** por lazo\n- Hasta **159 módulos OPAL**\
    \ por lazo\n- Corriente máxima: **750 mA por lazo**\n\n**Modo CLIP** (requiere\
    \ licencia) [F4]:\n- Hasta **99 detectores CLIP** por lazo\n- Hasta **99 módulos\
    \ CLIP** por lazo\n\n> ⚠️ **Restricción EN54-2, art. 13.7:** máximo **512 detectores\
    \ y/o pulsadores** por módulo de lazo (los 2 circuitos en conjunto) [F2].\n\n\
    **Longitud de cable:** hasta **3,5 km** dependiendo del tipo de carga y cable.\
    \ Calcular con el programa de cálculo de lazo y batería de **CLSS** [F2].\n\n\
    ---\n\n### 1.3 Comprobaciones previas con multímetro (antes de conectar a la central)\n\
    \n> ⚠️ **NUNCA usar dispositivos de alta tensión (megóhmetro, etc.) en el circuito\
    \ de lazo** [F5].\n\nSe recomienda usar la herramienta **POL-200-TS** para diagnóstico\
    \ previo (compatible con OPAL y CLIP) [F10].\n\n**Pasos de verificación** [F5][F6][F7]:\n\
    \n1. Comprobar continuidad de cada parte del lazo y medir resistencia extremo\
    \ a extremo [F5].\n2. Comprobar continuidad de la pantalla del cable (valor de\
    \ resistencia muy bajo) [F5].\n3. Verificar que **no hay continuidad** entre la\
    \ pantalla y los cables +VE y -VE [F5].\n4. Con función de prueba de diodo en\
    \ polaridad **invertida** (+VE del multímetro al negativo del lazo, -VE al positivo):\
    \ el multímetro debe indicar **diodo en polarización directa** [F6].\n5. Con polaridad\
    \ **normal** (+VE al positivo, -VE al negativo): la resistencia debe comenzar\
    \ baja y aumentar progresivamente al cargarse los condensadores de los dispositivos\
    \ [F6].\n   - Si indica diodo en directa en este paso → uno o varios dispositivos\
    \ están conectados en polaridad inversa o hay cortocircuito [F6].\n6. Verificar\
    \ que no hay conexión entre la pantalla y los cables +VE o -VE [F6].\n7. Si la\
    \ pantalla no está conectada a tierra en la central, verificar que no tiene otra\
    \ conexión a tierra en ningún punto del recorrido [F6].\n\n**Límites de resistencia\
    \ de lazo** [F7]:\n- Protocolo **OPAL**: resistencia < **40 Ω**\n- Protocolo **CLIP**:\n\
    \  - < **40 Ω** para detección de dos dispositivos con dirección duplicada\n \
    \ - < **71 Ω** si no se necesita detección de dirección duplicada\n- Capacidad\
    \ del cable: < **0,5 µF** [F7]\n\n> ℹ️ Con aisladores en cada dispositivo OPAL,\
    \ el conductor positivo del lazo será un circuito abierto [F5]. Para dispositivos\
    \ CLIP, puentear temporalmente los terminales 2 y 4 de cada aislador durante las\
    \ comprobaciones [F7].\n\n---\n\n### 1.4 Conexión física a la central\n\n**Lazo\
    \ OPAL** [F10]:\nUna vez verificado el cableado, conectar el circuito al bloque\
    \ de terminales de lazo seleccionado en la central.\n\n**Lazo CLIP** [F10]:\n\
    1. Reconectar los aisladores que se puentearon temporalmente (módulos de lazo\
    \ y pulsadores).\n2. Conectar el circuito al bloque de terminales de lazo seleccionado\
    \ en la central.\n\n---\n\n## FASE 2 — CONFIGURACIÓN / ALTA DEL LAZO EN CLSS\n\
    \n### 2.1 Preparación previa (antes de ir a la instalación)\n\n1. En el portal\
    \ en la nube de CLSS (`https://fire.eu.honeywell.com/#/home`), crear un sitio/edificio\
    \ y añadir una central [F14].\n2. Cargar la configuración con el programa de configuración\
    \ de CLSS y generar el archivo **.bin de licencia** [F14].\n\n---\n\n### 2.2 Primer\
    \ encendido y configuración inicial\n\n> ⚠️ El primer encendido debe realizarse\
    \ **sin el cableado externo conectado**, pero con la fuente de alimentación y\
    \ un circuito de lazo probado conectado [F1].\n\n1. Conectar el cableado del lazo\
    \ y el cable HMI de la puerta a la CPU [F1].\n2. Conectar la corriente principal\
    \ y las baterías (**2 × 12 V 24 Ah** para E10/E15) [F1].\n\n---\n\n### 2.3 Configuración\
    \ del lazo en CLSS\n\nAcceder a **Ajustes → Ajustes HMI** y en **Tipo de marca**\
    \ seleccionar **Notifier EN** [F8].\n\nEn **Ajustes de lazo** [F8]:\n- Si el lazo\
    \ **no se utiliza**: marcar ☑ **Sin Uso**.\n- Si el lazo **se utiliza**:\n  -\
    \ Seleccionar **Limitar a VdS 2540**: Sí o No (el valor de resistencia cambia\
    \ según la selección).\n  - Seleccionar el **Tipo de cable**.\n  - Verificar la\
    \ **Familia de Dispositivos** (Notifier) y el **Protocolo de Lazo** (OPAL por\
    \ defecto).\n\n> ℹ️ De forma predeterminada, la central tiene licencia para **protocolo\
    \ OPAL avanzado** únicamente. Para usar CLIP o TC800, se requiere **licencia adicional**\
    \ antes de realizar la Auto Configuración [F8].\n\nEnviar la configuración a la\
    \ central siguiendo los pasos del apartado **\"Enviar configuración a la central\"\
    ** [F8].\n\n---\n\n### 2.4 Auto Configuración (búsqueda de dispositivos)\n\n1.\
    \ Seleccionar **Auto Configuración** en la central para buscar dispositivos conectados\
    \ al lazo [F9].\n2. Leer la información de la ventana emergente y confirmar seleccionando\
    \ **Auto Configuración** [F9].\n3. Una vez completada, seleccionar la flecha **>**\
    \ junto al botón Auto Búsqueda para ver el estado de averías del lazo [F9].\n\
    4. Leer los mensajes de avería y corregir los problemas detectados. Seleccionar\
    \ **Hecho** al completar [F9].\n5. Si se han corregido averías, **repetir los\
    \ pasos 1 a 4** [F9].\n6. **Repetir el proceso para cada lazo** hasta descubrir\
    \ todos [F9].\n\n**Causas típicas de averías tras Auto Configuración** [F9]:\n\
    - Discordancia entre diseño de instalación y cableado\n- Averías en el cableado\n\
    - Presencia de fuente de RFI fuerte\n- Error de módulo o fuente de alimentación\n\
    - Conexionado incorrecto en dispositivos\n\n---\n\n### 2.5 Numeración de circuitos\
    \ de lazo\n\nLos circuitos se numeran **secuencialmente de izquierda a derecha**\
    \ del portamódulos. En la E15 (dos filas de portamódulos), la segunda fila continúa\
    \ la numeración desde la primera [F2].\n\n---\n\nFuente: HOP-138-8ES issue 6 (01-2026)\
    \ — Instrucciones de puesta en marcha INSPIRE E10/E15; HOP-138-9ES issue 5 (11-2025)\
    \ — Manual de instalación INSPIRE E10\n\n---\n\U0001F4D6 **Información adicional\
    \ del manual:**\n- \"- Left side: CPU module with 6 connection terminals and external\
    \ wiring connection point ②\n- Center top: HMI cable connection detail showing\
    \ CPU with points \"a\" and \"b\" marked as ①\n- Center middle: Central unit internal\
    \ view showing wiring connections with color-coded wires (brown, yellow/green,\
    \ blue) connecting to L and N terminals, marked as ②\n- Right side: Power supply\
    \ terminal block showing L (brown wire) and N (blue wire) connections with earth\
    \ (yellow/green wire)\n- Bottom center: Battery connection diagram showing 2 x\
    \ 12 V 24 Ah batteries with positive and negative terminals, marked as ③\n- Bottom\
    \ right: Circular detail view showing battery terminal connection with + and -\
    \ markings]\" [F1]"
