- qid: hp009
  question: ¿Cuál es la resistencia de fin de línea recomendada para los lazos de
    la central Morley ZXe?
  answer: 'La resistencia de fin de línea (RFL) para los circuitos de sirenas de la
    ZXe es de **6.800 Ω (6,8 KΩ), 0,5 W mínimo** [F8].


    Esta RFL debe instalarse al final de cada circuito de sirena para la supervisión
    ante cortocircuito y circuito abierto [F8]. La ZXe (ZX2e) dispone de 2 circuitos
    de sirenas supervisados (Sirenas A y B), y la ZX5e dispone de 4 circuitos (Sirenas
    A, B, C y D) [F8].


    **Consideraciones adicionales de instalación:**


    - Si no se instalan sirenas en un circuito, la RFL debe conectarse directamente
    entre + y – en el terminal de la central [F1].

    - No se deben realizar ramales en la conexión de sirenas convencionales, ya que
    la supervisión se realiza en la línea directa hasta la RFL; los ramales paralelos
    no podrán ser supervisados [F2].

    - No se recomienda cable de longitud superior a **1 km**, ya que la capacitancia
    e inductancia del lazo pueden afectar al funcionamiento de la línea [F3].

    - La sección mínima de cableado recomendada es **1,5 mm²** [F1].


    ---


    Fuente: Manual de Instalación Paneles de Incendio ZX2e / ZX5e (Documento No. MIE-MI-530,
    Revisión: 001)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "Es imprescindible comprobar que no hay conexión entre los terminales A y B
