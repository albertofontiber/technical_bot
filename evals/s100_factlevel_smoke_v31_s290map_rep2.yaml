- qid: hp020
  question: En la Notifier INSPIRE, ¿cómo se configuran las contraseñas de nivel 2
    y nivel 3?
  answer: "# Configuración de contraseñas Nivel 2 y Nivel 3 — Notifier INSPIRE E10/E15\n\
    \nLos procedimientos difieren según el nivel de acceso con el que estés operando.\n\
    \n---\n\n## Cambiar contraseña de Nivel 2 (desde sesión Nivel 2)\n\n1. Selecciona\
    \ el icono del menú ① y selecciona **\"Configuración\"** ② [F2].\n2. Inicia sesión\
    \ como usuario de **nivel de acceso 2** [F2].\n3. Selecciona la opción **\"Cambio\
    \ del código de acceso\"** ③ [F2].\n4. Asegúrate de que **Nivel de Acceso 2**\
    \ ④ esté seleccionado y el cursor parpadee ⑤ [F2].\n5. Puedes ver la entrada haciendo\
    \ clic en el **icono del ojo** ⑥ [F2].\n6. Introduce el nuevo código de acceso\
    \ (**mínimo 4 dígitos, máximo 8 dígitos**) con el teclado ⑦ [F2].\n7. Confirma\
    \ seleccionando el símbolo **✓** ⑧ [F2].\n8. Repite los pasos 3 a 6 para confirmar\
    \ el código introducido [F2].\n\n---\n\n## Cambiar contraseña de Nivel 2 y/o Nivel\
    \ 3 (desde sesión Nivel 3)\n\n> Si estás en nivel de acceso 3, puedes cambiar\
    \ el código de acceso del nivel 2 **o** del nivel 3 [F1].\n\n1. Selecciona el\
    \ icono del menú ① y selecciona **\"Ajustes\"** ② [F1].\n2. Inicia sesión como\
    \ usuario de **nivel de acceso 3** [F1].\n3. Selecciona la opción **\"Cambio del\
    \ código de acceso\"** ③ [F1].\n4. Asegúrate de que el **Nivel de Acceso 2 o 3**\
    \ ④ esté seleccionado y el cursor parpadee ⑤ [F1].\n5. Puedes ver la entrada haciendo\
    \ clic en el **icono del ojo** ⑥ [F1].\n6. Introduce el nuevo código de acceso\
    \ (**mínimo 4 dígitos, máximo 8 dígitos**) con el teclado ⑦ [F1].\n7. Confirma\
    \ seleccionando el símbolo ⑧ [F1].\n8. Repite los pasos 3 a 6 para confirmar el\
    \ código introducido [F1].\n9. Observa el mensaje **\"Cambio de código de acceso\
    \ satisfactorio\"** y selecciona **Aceptar** [F1].\n10. **Sincroniza el programa\
    \ con la central** y realiza una **copia de seguridad del cambio en la nube**\
    \ [F1].\n\n---\n\n## Datos clave a recordar\n\n- Código de fábrica por defecto\
    \ para nivel 2: **\"22222222\"** [F4].\n- Longitud válida para cualquier código:\
    \ **mínimo 4 dígitos, máximo 8 dígitos** [F1][F4].\n- Si el nivel 2 no usa controles\
    \ durante **5 minutos**, la sesión cierra automáticamente y vuelve al nivel de\
    \ acceso 1 [F4].\n- Se recomienda cambiar siempre la contraseña de fábrica [F4].\n\
    \n---\n\nFuente: HOP-138-8ES issue 6_01-2026_Co (sin revisión registrada); HOP-338-9ES\
    \ issue 4_01-2026_Op (sin revisión registrada)\n\n---\n\U0001F4CB **Información\
    \ adicional del manual:**\n- Nota: el manual también indica: \"Se recomienda cambiar\
    \ la contraseña del código de acceso al nivel de acceso 2/3 contraseña a uno exclusivo\
    \ que tenga entre 4 y 8 dígitos.\" [F1] · \"- Menu icon ① leading to \"Configuraciones\"\
    \n- \"Configuraciones\" screen showing \"Configuración del sistema, red, datos\
    \ y hora, programa de mantenimiento, etc\" ②\n- Arrow pointing to \"Cambio de\
    \ contraseña\" option ③\n- \"Introduzca nueva contraseña\" dialog box with:\n\
    \  - \"Acceso Nivel 2\" dropdown ④\n  - Password input field ⑤\n  - \"Min:4 digitos,Max:8\
    \ digitos\" text with eye icon ⑥\n  - Numeric keypad showing numbers 1-9, 0, backspace\
    \ icon, and checkmark icon ⑧\n  - Backspace arrow ⑦]\" [F1]\n\n---\n\U0001F4D6\
    \ **Obligaciones de evidencia del manual:**\n- \"* El programa de configuración\
    \ de CLSS y la Central INSPIRE de Notifier tienen \"pruebas de autenticación\"\
    \ almacenadas localmente en el programa para que ambas funcionen.\" (4188-1122-ES\
    \ issue 4_04-2025_Cyb, p. 9) [F7]"
