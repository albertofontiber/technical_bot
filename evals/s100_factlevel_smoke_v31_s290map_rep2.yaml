- qid: hp018
  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  answer: '## Conexionado de sirena convencional en salidas de sirena de la ZXe


    La sirena convencional se conecta entre los terminales **+** y **−** de la salida
    correspondiente (Salida A o B en ZX2e; A, B, C o D en ZX5e), respetando la polaridad,
    con una **resistencia final de línea (RFL) de 6.800 Ω, 0,5 W mínimo**, instalada
    entre + y − al final del circuito [F11][F1].


    ---


    ### Requisitos previos y puntos clave


    **Polaridad y diodos:**

    - Cada sirena debe tener un **diodo integrado** para impedir el consumo en polarización
    inversa durante la supervisión [F4].

    - Si se conectan dispositivos **no polarizados** (campanas sin polaridad), es
    obligatorio instalar un **diodo de polarización y protección** en cada uno [F4].


    **Resistencia final de línea (RFL):**

    - Valor: **6.800 Ω (6K8), 0,5 W mínimo** [F11][F2].

    - Se instala entre + y − de la **última sirena** del circuito [F2].

    - Si no se instala ninguna sirena en la salida, la RFL se conecta directamente
    en los terminales de la central [F2].


    **Supervisión del circuito:**

    - El circuito se supervisa ante **cortocircuito y circuito abierto** [F11].

    - La corriente de supervisión circula en **sentido inverso** a la de activación,
    con pequeña tensión de polaridad inversa en reposo. Al dispararse la salida, la
    corriente circula en sentido normal [F2].


    **Corriente máxima por circuito:**

    - Cada circuito admite un consumo máximo de **1 A** [F11][F2].


    **Cableado:**

    - Sección mínima recomendada: **1,5 mm²** [F2].

    - Longitud máxima recomendada: **no superior a 1 km** (por encima, la capacitancia
    e inductancia pueden afectar al funcionamiento) [F1].

    - **No realizar ramales** en la línea de sirenas: la supervisión se realiza en
    la línea directa hasta la RFL; los ramales paralelos no quedan supervisados [F3].

    - **No enrollar el cable en los terminales**: cortar y empalmar adecuadamente
    para mantener la supervisión [F1].


    **Terminales físicos en placa:**

    - ZX2e: terminales etiquetados **A+ A- B+ B-** en el bloque de sirenas [F4].

    - ZX5e: terminales **A- A+ B- B+ C- C+ D- D+** en TB7 [F4].


    ---


    ### Verificación de tensión


    Asegúrate de que la sección de cable es suficiente para garantizar la tensión
    recomendada por el fabricante de la sirena, tanto con alimentación de red como
    en condiciones de **mínima tensión de baterías** (consulta las tablas 10 y 11
    del manual para las condiciones de tensión mínima del panel) [F1].


    ---


    > ⚠️ **Para el esquema de conexionado exacto**, consulta la **Figura 15** del
    documento MIE-MI-530rv001 (circuito de sirenas convencionales) [F1], que muestra
    el diagrama completo con la disposición de los dispositivos y la RFL.


    ---


    **Fuente:** Manual de Instalación Paneles de Incendio ZX2e/ZX5e — Documento MIE-MI-530rv001
    (sin revisión registrada); Manual de Instalación ZXAE/ZXEE — DOC.MIE-MI-310 (sin
    revisión registrada)


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "Todas las salidas de sirena quedan configuradas por defecto para sonar de forma
    contínua con cualquier alarma de cualquier zona, quedándo así en el patrón 1."
    (MIE-MP-310, p. 38) [F6]'
