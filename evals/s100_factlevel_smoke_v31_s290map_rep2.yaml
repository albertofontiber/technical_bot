per_gold:
- qid: hp002
  question: El detector ASD535 de Detnov está dando una alarma intermitente de flujo
    bajo. ¿Cuál es la causa más probable y cómo se diagnostica?
  answer: "## ASD535 — Alarma intermitente de flujo bajo: causa y diagnóstico\n\n\
    La causa más probable es una **obstrucción en el conducto de aspiración** (código\
    \ de fallo **G30/001**), que provoca que el flujo de aire caiga por debajo del\
    \ **80 %** del valor nominal registrado en el reset inicial [F2][F8].\n\n---\n\
    \n### Cómo funciona el umbral de disparo\n\nEl ASD535 registra el flujo nominal\
    \ (100 %) durante el reset inicial. En posiciones de conmutador **A11 a C32**,\
    \ cualquier caída por debajo del **80 %** o subida por encima del **120 %** dispara\
    \ el aviso de fallo de flujo de aire, una vez transcurrido el tiempo de retardo\
    \ de **300 s** de la LS-Ü [F1][F2].\n\n- Valor < 100 % → apunta a **obstrucción**\
    \ [F2]\n- Valor > 100 % → apunta a **rotura de tubo** [F2]\n\nEl carácter **intermitente**\
    \ puede estar relacionado con turbulencias de aire que hacen que el flujo oscile\
    \ alrededor del umbral del ±20 % [F5].\n\n---\n\n### Pasos de diagnóstico\n\n\
    1. **Leer el código de evento en el AMB 35** (posición de conmutador E) para delimitar\
    \ el patrón de error [F3]. Los códigos relevantes para flujo bajo son:\n\n   -\
    \ **G30/001**: Obstrucción, conducto de aspiración I [F8]\n   - **G40/001**: Obstrucción,\
    \ conducto de aspiración II (en ASD535-2 y -4) [F8]\n\n2. **Verificar el valor\
    \ de flujo actual** mediante la posición de conmutador V según el cap. 7.6.1 del\
    \ manual [F7]. Confirma si el valor está por debajo del 80 %.\n\n3. **Inspeccionar\
    \ el conducto de aspiración** [F8]:\n   - Comprobar si los **orificios de aspiración**\
    \ están obstruidos (suciedad, polvo, objetos)\n   - Comprobar la **salida de aire\
    \ en el ASD**\n   - Inspeccionar y limpiar la **caja de filtro / unidad de filtrado**\n\
    \n4. **Inspeccionar y limpiar el sensor de flujo de aire** [F8]:\n   - Si tras\
    \ la limpieza persiste el fallo, verificar el código **G30/008** (sensor de flujo\
    \ defectuoso/inexistente) [F8]\n   - Comprobar el **cable de conexión** del sensor\
    \ [F8]\n   - Si el sensor está defectuoso → **sustituirlo** (ver cap. 9.4.3 del\
    \ manual) [F6]\n\n5. **Comprobar la tensión de alimentación** en los bornes 1\
    \ y 2 (o 3 y 4 si hay alimentación redundante). El rango debe ser **21,6 – 27,6\
    \ V CC** (a 24 V) o **12,3 – 13,8 V CC** (a 12 V) [F10]. Una tensión fuera de\
    \ rango puede provocar funcionamiento defectuoso.\n\n6. **Verificar si el código\
    \ G30/004 está activo** (parámetros LS-Ü no válidos / fuera de rango de punto\
    \ de funcionamiento) [F8]. Si es así, puede ser necesario un nuevo reset inicial\
    \ tras corregir la causa.\n\n---\n\n### Si el problema persiste tras la limpieza\n\
    \n- Comprobar si la ventana de monitorización está configurada con un valor inferior\
    \ a ±20 % con un tiempo de retardo ≤ 300 s, ya que esto **aumenta el riesgo de\
    \ avisos de fallo erróneos** [F5].\n- En entornos con grandes turbulencias de\
    \ aire puede ser necesario aumentar el tiempo de retardo y/o el tamaño de la ventana,\
    \ pero esto requiere **consulta previa con el fabricante** ya que implica incumplimiento\
    \ de la norma **EN 54-20** [F5].\n\n---\n\n### ⚠ Tras cualquier sustitución del\
    \ sensor de flujo\n\nDespués de sustituir un sensor de flujo de aire es **imprescindible\
    \ realizar un nuevo reset inicial** (cap. 7.3.5 del manual) [F6].\n\n---\n\n**Fuente:**\
    \ ASD535, Descripción técnica, T 131 192 h es (sin revisión registrada)\n\n---\n\
    ⚠️ **Información adicional del manual:**\n- \"| ⚠ | **Advertencia**- El aumento\
    \ de los valores de la LS-Ü (> ±20 % / > 300 s) implica el incumplimiento de la\
    \ norma EN 54-20 y solo podrá aplicarse previa consulta con el fabricante.\" [F5]"
