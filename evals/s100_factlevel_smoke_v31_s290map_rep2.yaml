- qid: cat007
  question: En el detector por aspiración FAAST LT-200, ¿qué salidas de relé y de
    sirena tiene y con qué contactos, cómo se comporta el relé de avería ante un fallo
    o un corte de alimentación, qué resistencia de fin de línea llevan las salidas
    de sirena y cuál es la especificación eléctrica de los contactos de relé?
  answer: '# FAAST LT-200 — Salidas de relé, sirena y especificaciones eléctricas


    ## Relés disponibles y comportamiento


    El FAAST LT-200 (versión Stand-Alone) dispone de los siguientes relés [F1]:


    - **Relé de ALARMA 1 y 2**: Se activa cuando se cumple la condición de alarma
    en el canal correspondiente. Condición predeterminada = Nivel 1. El estado de
    alarma está **enclavado por defecto** — se requiere **rearme manual** para desactivar
    el LED y el relé [F1].

    - **Relé de PREALARMA 1 y 2**: Se activa cuando se cumple la condición de prealarma
    en el canal. Condición predeterminada = Nivel 1. Nota: cuando PREALARMA = ALARMA
    = Nivel 1, la prealarma se activará al **70 % del Nivel 1** [F1].

    - **Relé de AVERÍA 1 y 2**: Se activa ante una condición de avería en el canal
    1 o 2, o ante una avería común. También se activa en **modo de servicio** y cuando
    se **desconecta la alimentación** de la unidad. El estado de avería **no está
    enclavado** (predeterminado) [F1].

    - **Relé de SIRENA 1 y 2**: Se activa cuando el canal está en ALARMA o PREALARMA.
    La sirena 1 corresponde al canal 1 y la sirena 2 al canal 2. Estado predeterminado
    = establecido en ALARMA [F1].


    ---


    ## Contactos de los relés (terminales de cableado)


    Cada relé dispone de contacto **NC, C (común) y NA** [F6]:


    - **Relé de alarma C1** → terminales 5 (NC), 6 (C), 7 (NA) [F6]

    - **Relé de alarma C2** → terminales 8 (NC), 9 (C), 10 (NA) [F6]

    - **Relé de avería C1** → terminales 11 (NC), 12 (C), 13 (NA) [F6]

    - **Relé de avería C2 (AUX.)** → terminales 14 (NC), 15 (C), 16 (NA) [F6]

    - **Relé de prealarma C1** → terminales 23 (NC), 24 (C), 25 (NA) [F6]

    - **Relé de prealarma C2** → terminales 26 (NC), 27 (C), 28 (NA) [F6]


    ---


    ## Comportamiento del relé de avería ante fallo o corte de alimentación


    El relé de avería se activa en las siguientes situaciones [F1]:

    - Condición de avería en el canal 1 o 2

    - Avería común

    - Modo de servicio activo

    - **Corte de alimentación de la unidad**


    El estado de avería **no está enclavado** (predeterminado), por lo que se restablece
    automáticamente al desaparecer la condición [F1].


    ---


    ## Salidas de sirena y resistencia de fin de línea


    - **Salida sirena 1** → terminales 17 (−) y 18 (+), con resistencia de fin de
    línea de **47 kΩ** [F6]

    - **Salida sirena 2** → terminales 19 (−) y 20 (+), con resistencia de fin de
    línea de **47 kΩ** [F6]


    ---


