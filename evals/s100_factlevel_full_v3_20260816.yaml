- qid: cat010
  question: ¿Cómo se alimenta la sirena/avisador intrínsecamente seguro IS-mA1 en
    una zona peligrosa (ATEX) y cuáles son sus parámetros de seguridad intrínseca
    de entrada?
  answer: '# Alimentación e Parámetros de Seguridad Intrínseca del IS-mA1


    El IS-mA1 se alimenta desde una **zona segura** a través de una barrera de seguridad
    intrínseca (zener o aislador galvánico), con los siguientes parámetros de entrada
    máximos en bornes **+ / -**:


    ---


    ## Parámetros de Seguridad Intrínseca — Bornes + w.r.t. -


    - **Ui = 28 V** [F1][F2]

    - **Ii = 93 mA** [F1][F2]

    - **Pi = 660 mW** [F1][F2]

    - **Ci = 0** (capacitancia interna nula) [F1][F2]

    - **Li = 0** (inductancia interna nula) [F1][F2]


    > ⚠️ La capacitancia total conectada a los bornes +/- (cable + cualquier otra
    capacitancia) **no debe superar 83 nF** [F2][F3].


    ---


    ## Parámetros de Seguridad Intrínseca — Bornes S2 y S3 w.r.t. -


    Estos bornes controlan el 2.º y 3.er tono de alarma [F5][F8]:


    - **Ui = 28 V** [F2][F5]

    - **Ii = 0 mA** (corriente de entrada permitida = cero) [F2][F5]

    - **Ci = 0** [F2]


    Adicionalmente, los bornes S2/S3 tienen parámetros de **salida** (hacia la zona
    peligrosa) [F2]:

    - **Uo = 16,8 V**

    - **Io = 7,3 mA**

    - **Po = 31 mW**


    ---


    ## Clasificación ATEX / IECEx


    - **Marcado:** Ex ia IIC T4 Ga [F1][F4]

    - **Zonas de uso:** 0, 1 y 2 con gases y vapores inflamables, grupos IIA, IIB
    e IIC, clases de temperatura T1 a T4 [F1][F4]

    - **Temperatura ambiente:** -40 °C ≤ Ta ≤ +60 °C [F1][F4]

    - **Certificados:** SIRA 05ATEX2084X / IECEx SIR 06.0045X [F1]


    ---


    ## Opciones de Aparato Asociado (zona segura)


    ### Opción A — Barreras Zener (requieren tierra de alta integridad)


    **Para bornes + / -:** Barrera zener de diodo shunt con [F3]:

    - Uo ≤ 28 V

    - Io ≤ 93 mA

    - Po ≤ 660 mW

    - Co ≥ Ccable / Lo ≥ Lcable


    **Para bornes S2 y S3:** Barrera de retorno de diodo con [F3]:

    - Uo ≤ 28 V / Io = 0

    - Solo se admiten barreras de retorno de diodo con **caída de tensión inferior
    a 0,9 V** [F5]


    > La resistencia entre la tierra de seguridad intrínseca y la tierra de protección
    debe ser **inferior a 1 Ω** [F3].


    ### Opción B — Aisladores Galvánicos (sin necesidad de tierra de alta integridad)


    **Para bornes + / -:** Aislador galvánico con [F2]:

    - Uo ≤ 28 V

    - Io ≤ 93 mA

    - Po ≤ 660 mW


    **Para bornes S2 y S3:** Relé galvánicamente aislado con [F2]:

    - Uo = 0 / Io = 0


    > Los aisladores galvánicos no requieren tierra de alta integridad, lo que simplifica
    la instalación en sistemas pequeños [F9][F10].


    ---


    ## Requisitos Generales de Instalación


    - El aparato asociado debe estar **certificado Ex ia por un Organismo Notificado**
    [F5][F9]

    - Los bornes S2 y S3 solo pueden conectarse a: barrera de retorno de diodo, relé
    IS o aislador galvánico certificados — o directamente a un **interruptor de accionamiento
    mecánico** en la zona peligrosa [F5]

    - La distancia entre bornes S2 y S3 es **inferior a 6 mm** — precaución en el
    conexionado [F2][F3]

    - La instalación debe realizarla **personal cualificado** [F1][F4]

    - Las reparaciones solo puede realizarlas el **fabricante** o según el código
    de práctica aplicable [F1][F4]

    - ⚠️ **Desconectar la alimentación antes de cualquier intervención** para evitar
    ignición de atmósferas inflamables [F2][F3]

    - Limpiar únicamente con **paño húmedo** para evitar cargas electrostáticas [F1][F4]


    ---


    Para los esquemas de conexionado completos (alarma monofásica y multifásica con
    barreras zener o aisladores galvánicos), consulta las **Fig. 4, 5, 6, 7 y 8**
    del documento IS 5001 [F7][F8][F9][F10].


    **Fuentes:** IS5001-F_IS-mA1_EN (Issue F, 06-08-15); manual IS MA1 (Issue H, 03-01-2020)


    ---

    ⚠️ **Información adicional del manual:**

    - "CAUTION - The clearance between sounder terminals S2 and S3 is less than 6mm."
    [F2]

    - "CAUTION - Bonding between conduit connections is not automatic and must be
    provided as part of this installation." [F2]


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "The IS-mA1 minialarm is an ATEX and IECEx certified intrinsically safe sounder
    which produces a loud warning signal in a hazardous area." (IS5001-F_IS-mA1_EN,
    p. 1) [F11]'
