- qid: cat023
  question: En el detector de humos por aspiración Securiton ASD532, ¿qué clases de
    sensibilidad según EN 54-20 ofrece y cómo se configura la monitorización del flujo
    de aire?
  answer: '## ASD 532 — Clases EN 54-20 y configuración de monitorización de flujo
    de aire


    El ASD 532 cumple las tres clases de la norma **EN 54-20** y dispone de un sistema
    de monitorización de flujo de aire basado en medición calorimétrica.


    ---


    ### 1. Clases de sensibilidad según EN 54-20


    El ASD 532 cubre las tres clases [F8]:


    - **Clase A** — Sensibilidad muy alta

    - **Clase B** — Sensibilidad alta

    - **Clase C** — Sensibilidad normal


    La clase se determina mediante el sensor de humo instalado y la posición de conmutador
    seleccionada. Los tres modelos de sensor disponibles son [F1][F9]:


    - **SSD 532-1**: rango de sensibilidad de alarma **0,5 %/m hasta 10 %/m**

    - **SSD 532-2**: rango de sensibilidad de alarma **0,1 %/m hasta 10 %/m**

    - **SSD 532-3**: rango de sensibilidad de alarma **0,02 %/m hasta 10 %/m**


    La elección del sensor y el ajuste de sensibilidad dentro del rango se realizan
    según los capítulos **4.4.4.3** o mediante el software de cálculo **«ASD PipeFlow»**
    [F1].


    ---


    ### 2. Posiciones de conmutador para uso normativo (EN 54-20)


    Las posiciones homologadas según EN 54-20 son [F3]:


    - **A11** → Clase A (sensibilidad muy alta)

    - **b11 / b21** → Clase B (sensibilidad alta)

    - **C11 / C21 / C31** → Clase C (sensibilidad normal)


    Para estas posiciones (A11 a C31), la configuración se detalla en los capítulos
    **4.4.4.3 y 7.3.3** [F3].


    ---


    ### 3. Monitorización del flujo de aire


    #### Principio de funcionamiento


    La monitorización se basa en el **método de medición calorimétrico** (técnica
    de medición de flujo en masa) [F2]. Un sensor de flujo de aire interno detecta
    cambios en el conducto de aspiración (rotura de tubo u obstrucción).


    #### Registro de valores nominales (reset inicial)


    Al ejecutar el **reset inicial** (posición de conmutador **U01**) [F3], con el
    conducto de aspiración intacto, el sistema registra y memoriza los valores de
    flujo como referencia al **100 %**. Estos valores quedan centrados en la ventana
    de monitorización [F2].


    #### Umbral normativo (EN 54-20)


    Según EN 54-20, debe notificarse como fallo toda variación del flujo de aire superior
    al **±20 %** [F2]:


    - Por debajo del **80 %** → suciedad/obstrucción → aviso «Fallo flujo de aire»

    - Por encima del **120 %** → rotura de tubo → aviso «Fallo flujo de aire»


    El aviso se dispara tras un tiempo de retardo de **300 s** (LS-Ü), aplicable en
    las posiciones **A11 a C31** [F2].


    El ASD 532 incluye además [F2]:

    - **Función de tiempo de retardo ajustable** para descartar turbulencias de aire

    - **Circuito de compensación de temperatura** para mitigar fluctuaciones de temperatura
    ambiente


    #### Advertencia sobre ajustes fuera de norma


    > ⚠️ El aumento de los valores de la LS-Ü por encima de **±20 % o de 300 s** implica
    el incumplimiento de EN 54-20 y solo puede efectuarse previa consulta con el fabricante
    [F7].


    > ⚠️ Por lo general, el tamaño de la ventana **no debería quedar por debajo del
    ±20 %**. Si se usan tamaños menores, el tiempo de retardo debe aumentarse a **10
    min como mínimo** [F7].


    ---


    ### 4. Posiciones de conmutador NO normativas (W01–W44)


    Las posiciones **W01 a W44** cumplen la sensibilidad de alarma según EN 54-20
    (clases A a C), pero **los límites de monitorización de flujo de aire no están
    homologados según EN 54-20** [F2][F5]. Solo deben usarse previa consulta con el
    fabricante [F5][F7].


    Ejemplos de configuración disponibles en estas posiciones [F4]:


    - Clase A, desviación **±20 %**, retardo **10 min** → **W01**

    - Clase A, desviación **±20 %**, retardo **60 min** → **W02**

    - Clase A, desviación **±50 %**, retardo **10 min** → **W03**

    - Clase A, desviación **±50 %**, retardo **60 min** → **W04**

    - Clase B, desviación **±20 %**, retardo **10 min** → **W09** (límite 1) / **W17**
    (límite 2)

    - Clase C, desviación **±20 %**, retardo **10 min** → **W25** (límite 1) / **W33**
    (límite 2) / **W41** (límite 3)

    *(Ver tabla completa en cap. 4.4.4.4 del manual)* [F4]


    ---


    ### 5. Proceso de configuración (resumen)


    1. **Con «ASD PipeFlow»**: calcular el proyecto → introducir resultado en **«ASD
    Config»** → seleccionar posición **X01, X02 o X03** en el ASD [F7].

    2. **Sin «ASD PipeFlow»** (EasyConfig): seleccionar límites del sistema según
    cap. 4.4.4.3 → si se requiere monitorización normativa, seleccionar posición **A11
    a C31**; si no, seleccionar **W01 a W44** (solo con consulta al fabricante) [F7].

    3. Ejecutar **reset inicial** (posición **U01**) con el conducto intacto para
    registrar los valores nominales de flujo [F3][F2].


    ---


    Fuente: ASD532_TD_T140421es_a (sin revisión registrada)


    ---

    📋 **Información adicional del manual:**

    - Nota: el manual también indica: "El detector de humos por aspiración ASD 532
    incluye dos lugares de montaje para módulos adicionales." [F9] · "* XLM 35 módulo
    SecuriLine eXtended

    * RIM 36 módulo de interfaz de relé con 5 relés

    * SIM 35 módulo de interfaz serial" [F9]


