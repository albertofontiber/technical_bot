- qid: hp002
  question: El detector ASD535 de Detnov está dando una alarma intermitente de flujo
    bajo. ¿Cuál es la causa más probable y cómo se diagnostica?
  answer: "## ASD535 — Alarma intermitente de flujo bajo: causa probable y diagnóstico\n\
    \n**La causa más probable es una obstrucción parcial en el conducto de aspiración**\
    \ (orificios de aspiración, salida de aire o filtro). Un valor de flujo por debajo\
    \ del 80 % del valor nominal dispara el aviso de fallo de flujo de aire transcurrido\
    \ el tiempo de retardo de **300 s** [F1][F2].\n\n---\n\n### 1. Entender qué está\
    \ pasando\n\nEl ASD535 monitoriza el flujo mediante dos sensores calorimétricos\
    \ [F1]. Tras el reset inicial, el flujo nominal queda registrado como **100 %**.\
    \ Si el valor real cae **por debajo del 80 %**, el equipo dispara el aviso «fallo\
    \ flujo de aire» [F1][F2].\n\n- Valor < 100 % → apunta a **obstrucción** [F2][F9]\n\
    - Valor > 100 % → apunta a **rotura de tubo** [F2][F9]\n\n---\n\n### 2. Diagnóstico\
    \ paso a paso\n\n**Paso 1 — Leer el valor de flujo actual**\n\nColoca el conmutador\
    \ en posición **V** (lectura de flujo de aire, sección 7.6.1) [F2][F9] y anota\
    \ el porcentaje. Compáralo con el valor registrado en el protocolo de puesta en\
    \ funcionamiento.\n\n- Si el valor está **por debajo del 90 %** (con sensibilidad\
    \ estándar ±20 %), ya es indicativo de obstrucción inminente y requiere inspección\
    \ [F9].\n- Si está **por debajo del 80 %**, el fallo ya está activo o próximo\
    \ a dispararse [F1][F2].\n\n**Paso 2 — Comprobar el conducto de aspiración**\n\
    \nInspecciona en este orden [F6]:\n- Orificios de aspiración: ¿están tapados o\
    \ sucios?\n- Salida de aire del ASD: ¿hay suciedad acumulada?\n- Caja de filtro\
    \ / unidad de filtrado: inspeccionar y limpiar [F6]\n- Sensor de flujo de aire:\
    \ inspeccionar y limpiar [F6]\n\n**Paso 3 — Verificar la tensión de alimentación**\n\
    \nMide en los bornes **1 (+) y 2 (-)** [F9][F10]:\n- Funcionamiento a **12 V-CC**:\
    \ rango nominal **12,3 a 13,8 V-CC** [F9][F10]\n- Funcionamiento a **24 V-CC**:\
    \ rango nominal **21,6 a 27,6 V-CC** [F9][F10]\n\nUna tensión fuera de rango puede\
    \ provocar funcionamiento defectuoso [F10].\n\n**Paso 4 — Consultar el código\
    \ de fallo en el AMB 35 (posición E)**\n\nEl código de evento en el AMB 35 permite\
    \ delimitar el patrón de error [F3]. Para flujo bajo, los códigos relevantes son\
    \ [F6]:\n\n- **Código 001**: Obstrucción en conducto de aspiración → comprobar\
    \ orificios, salida de aire, filtro y sensor de flujo [F6]\n- **Código 004**:\
    \ Parámetros LS-Ü no válidos → fuera de rango de punto de funcionamiento; inspeccionar\
    \ y limpiar sensor de flujo; si está defectuoso, sustituir [F6]\n- **Código 008**:\
    \ Sensor de flujo defectuoso o inexistente → comprobar cable de conexión; sustituir\
    \ si es necesario [F6]\n\n**Paso 5 — Si el conducto está limpio y el fallo persiste**\n\
    \nVerifica si se realizó correctamente el reset inicial con el conducto en perfecto\
    \ estado [F1]. Si el reset inicial no se ejecutó correctamente, pueden aparecer\
    \ códigos de fallo en el grupo de reset inicial [F4]:\n\n- **Código 001** (grupo\
    \ reset): valor de flujo demasiado bajo en reset inicial → consecuencia de timeout\
    \ (código 004 del mismo grupo) [F4]\n- **Código 004** (grupo reset): timeout de\
    \ reset inicial → no se respetó el tiempo de espera; ejecutar nuevo reset inicial\
    \ [F4]\n\n---\n\n### 3. Acción correctiva tras la limpieza\n\nUna vez limpiado\
    \ el conducto y verificado el sensor, realiza un **reset del ASD 535** (preferentemente\
    \ desde la CDI, ya que el reset en el ASD no reinicializa la CDI) [F8]. Comprueba\
    \ que el valor de flujo vuelve al entorno del 100 % en posición V [F9].\n\n> ⚠️\
    \ Antes de cualquier comprobación, **bloquea o desconecta el control de incendios\
    \ y la alerta remota en la CDI** para evitar disparos no deseados [F9].\n\n---\n\
    \n**Fuente:** ASD535, Descripción técnica, T 131 192 h es (sin revisión registrada\
    \ en los fragmentos)\n\n---\n⚠️ **Información adicional del manual:**\n- \"Para\
    \ evitar que los controles de incendios, las alertas remotas y las zonas de extinción\
    \ se disparen al llevar a cabo los trabajos de mantenimiento, es **imprescindible**\
    \ bloquearlos o desconectarlos previamente.\" [F9]\n- Nota: el manual también\
    \ indica: \"1. Bloquear o desconectar el control de incendios y la alerta remota\
    \ en la CDI de orden superior.\n2. La tensión de alimentación de la CDI debe estar\
    \ configurada para la central conforme a la normativa de mantenimiento.\n3. Debe\
    \ comprobarse que la entrada del conducto de aspiración y los tapones de tubo\
    \ del orificio de entrada de la caja del detector que no está en uso (ASD 535-1\
    \ y ASD 535-3) están en la posición correcta.\n4. Debe comprobarse si existe suciedad\
    \ en la salida de aire, en cuyo caso deberá limpiarse.\n5. En caso de que el ASD\
    \ 535 se utilice para la vigilancia de equipos y se hayan instalado transiciones\
    \ insertadas de tubo rígido a tubo flexible, debe comprobarse que dichas transiciones\
    \ están colocadas correctamente (sin fugas).\n6. Debe abrirse la cubierta de la\
    \ caja del detector y fijarse en la posición media de anclaje del fondo de la\
    \ caja. **Atención**: conexión de cable plano (véanse también los cap. 5.4.1 y\
    \ 7.1). Deberán efectuarse las siguientes mediciones:\n * Medir la tensión de\
    \ servicio en los bornes 1 (+), 2 (-) \U0001F87A Valor nominal = 12,3 a 13,8 V-CC\
    \ (funcionamiento a 12 V-CC) o 21,6 a 27,6 V-CC (funcionamiento a 24 V-CC).\n\
    \ * Leer el valor de flujo de aire del conducto de aspiración en la posición de\
    \ conmutador V (véase para ello el cap. 7.6.1) y comparar con el protocolo de\
    \ puesta en funcionamiento. Si existe una desviación superior a la mitad de la\
    \ sensibilidad establecida (véanse ejemplos ➀ y ➁), deberá realizarse una inspección\
    \ del conducto de aspiración de la siguiente manera:\n - Un **aumento** del valor\
    \ (superior al 100 %) implica una **rotura de tubo** inminente \U0001F87A Comprobar\
    \ si el conducto de aspiración tiene fugas (puntos de unión, racores, etc.)\n\
    \ - Una **disminución** del valor (inferior al 100 %) implica una **obstrucción**\
    \ inminente \U0001F87A Comprobar si el conducto de aspiración está obstruido y\
    \ limpiarlo según el **punto 9** o el **punto 10**.\n * ➀ Sensibilidad de LS-Ü\
    \ establecida = ±20 % (estándar); la mitad = ±10 %. También deberá realizarse\
    \ una inspección del conducto de aspiración cuando el valor caiga por debajo del\
    \ 90 % o suba por encima del 110 %.\n * ➁ Sensibilidad de LS-Ü establecida = ±50\
    \ % (no conforme a EN 54-20); la mitad = ±25 %. También deberá realizarse una\
    \ inspección del conducto de aspiración cuando el valor caiga por debajo del 75\
    \ % o suba por encima del 125 %.\n7. Debe desconectarse el ASD (extraer el bloque\
    \ de bornes 1/2 y, en su caso, 3/4 del AMB 35), desconectar con cuidado la conexión\
    \ de cable plano con la unidad de control y retirar completamente la cubierta\
    \ de la caja del detector. Una vez desconectado el cable plano de los sensores\
    \ de humo, estos deberán extraerse del ASD con cuidado.\n8. El espacio interior\
    \ de las cámaras de los sensores de humo y la rejilla protectora contra insectos\
    \ deberán limpiarse con un pincel suave y seco. Para la limpieza también puede\
    \ emplearse nitrógeno o aire comprimido sin aceite.\" [F9]"
