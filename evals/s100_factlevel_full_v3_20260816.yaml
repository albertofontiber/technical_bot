- qid: cat016
  question: En la Detnov CAD-150, ¿como se da de alta un detector nuevo en el lazo
    y como se prueba que funciona?
  answer: "# CAD-150-8: Alta de detector nuevo en lazo y prueba de funcionamiento\n\
    \n## PARTE 1 — Alta de un detector nuevo en el lazo (Autobúsqueda)\n\nEl procedimiento\
    \ para dar de alta un detector nuevo es mediante la **autobúsqueda del lazo**\
    \ [F1]:\n\n1. Accede al **menú BUCLE** desde el teclado de la central [F1].\n\
    2. Realiza la **autobúsqueda del lazo** correspondiente — el sistema escanea el\
    \ lazo y muestra todos los elementos que detecta [F1].\n3. Verifica que los elementos\
    \ encontrados coinciden con los planos de la instalación [F1].\n4. Accede al **menú\
    \ ELEMENTOS** para asignar al nuevo detector:\n   - Un **nombre/texto** identificativo\
    \ [F1][F4]\n   - La **zona** a la que pertenece [F1][F4]\n\n> **Nota:** La configuración\
    \ puede realizarse desde el teclado de la central o mediante el software de configuración,\
    \ siendo este último más sencillo y rápido [F6].\n\n---\n\n## PARTE 2 — Prueba\
    \ del detector\n\n### Opción A — Prueba por zona (recomendada para pruebas sin\
    \ rearme)\n\nAccede al **menú ZONA → Prueba** [F2]:\n\n1. Navega a **menú ZONA**\
    \ y selecciona la opción **PRUEBA** [F2].\n2. Introduce el **rango de zonas**\
    \ a poner en prueba (campo `RANGO: [000] a [250]`) [F2].\n3. El sistema pregunta\
    \ si deben activarse las sirenas (`ACTIVAR SIRENAS: [SI/NO]`) [F2]:\n   - Si seleccionas\
    \ **SÍ**: las sirenas se activarán unos segundos tras la entrada en alarma del\
    \ detector y se silenciarán automáticamente [F2].\n   - Los retardos de sirena\
    \ quedan **anulados** en modo prueba para agilizar el proceso [F2].\n4. Activa\
    \ el detector (aerosol, calor, etc.) y verifica que la central registra la alarma.\n\
    5. Para **salir del modo prueba**, conecta la zona desde el menú ZONA → Conectar\
    \ [F2].\n\n> ⚠️ **Importante:** Si transcurridos **20 minutos** desde la activación\
    \ del modo prueba no se ha producido ningún disparo de alarma, el sistema vuelve\
    \ automáticamente al estado normal [F2][F3].\n\n### Opción B — Verificación general\
    \ del sistema\n\nComo comprobación adicional tras el alta [F7]:\n\n- Verifica\
    \ que al provocar una alarma se activa el **relé de alarma** [F7].\n- Verifica\
    \ que se activan las **salidas de sirena** una vez transcurrido el tiempo de retardo\
    \ programado [F7].\n\n---\n\n## Verificación del estado del elemento\n\nEn cualquier\
    \ momento puedes consultar el estado del nuevo detector desde **menú ELEMENTO\
    \ → Ver** [F4]:\n\n- **BUCLE**: número de bucle al que pertenece\n- **DIR**: dirección\
    \ del elemento\n- **ZONA**: zona asignada\n- **TIPO**: tipo de elemento (óptico,\
    \ térmico, etc.)\n- **MODO**: conectado / desconectado / en prueba\n- **VA**:\
    \ valor analógico actual del detector\n- **TEXTO**: nombre asignado\n\n---\n\n\
    **Fuente:** 55315013 Manual Centrales Analógicas CAD-150-8 Instalación ES FR GB\
    \ IT (sin revisión registrada); 55315008 Manual Centrales Analógicas CAD-150-8\
    \ Usuario ES FR GB IT (sin revisión registrada)\n\n---\n⚠️ **Información adicional\
    \ del manual:**\n- \"En caso de necesidad, se puede encender el equipo solo con\
    \ las baterías conectadas, pero es imprescindible pulsar sobre el pulsador BAT\
    \ para arrancar el equipo.\" [F6]\n\n---\n\U0001F4D6 **Obligaciones de evidencia\
    \ del manual:**\n- \"» Poner el equipo en estado de prueba, y verificar que todos\
    \ los detectores y pulsadores funcionan de acuerdo con las especificaciones del\
    \ fabricante.\" (55315008-Manual-Centrales-Analogicas-CAD-150-8-Usuario-ES-FR-GB-IT,\
    \ p. 37) [F8]"
