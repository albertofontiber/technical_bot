- qid: hp005
  question: En la Notifier ID3000, ¿cómo se programa una zona para que active una
    salida de sirena solo cuando haya coincidencia de dos detectores?
  answer: '## Programación de coincidencia de dos detectores → salida de sirena en
    ID3000


    La función se configura mediante la **Matriz de Control**, creando **dos instrucciones
    separadas**: una para los pulsadores manuales (sin coincidencia) y otra para los
    detectores (con coincidencia). A continuación el procedimiento completo.


    ---


    ### Paso 1 — Acceder a la Matriz de Control


    Desde el menú **Parámetros Sistema**, selecciona **Matriz de control** [F12].
    También puedes acceder pulsando **F6** durante la edición de sensores o módulos
    [F11].


    ---


    ### Paso 2 — Crear la instrucción para Pulsadores Manuales (sin coincidencia)


    Esto es obligatorio para evitar que los MCP queden incluidos en el grupo de coincidencia
    [F1] [F3].


    1. Crea una nueva línea de Matriz de Control.

    2. Define la **entrada** como tipo **Pulsador Manual (MCP)**.

    3. Configura la coincidencia como **Simple** (sin coincidencia) — opción **"UN
    ÚNICO EQUIPO"** [F3].

    4. Define la **salida** hacia la sirena correspondiente.


    ---


    ### Paso 3 — Crear la instrucción para detectores (con coincidencia de 2 equipos)


    1. Crea una **segunda** línea de Matriz de Control.

    2. Define la **entrada** como tipo **ANALÓGICO** (incluye detectores TÉRMICOS,
    IÓNICOS, ÓPTICOS, VIEW y MULTISENSOR) [F1], o el tipo específico que corresponda
    a tu instalación.

    3. En la selección de zona, elige **una zona específica** o **cualquier zona**
    según tu diseño. La función de coincidencia solo está disponible si la entrada
    se especifica como **ZONA**, **SUBZONA** o **CUALQUIERA** — no si es un equipo
    individual [F1].

    4. En el menú de coincidencia de equipos, selecciona **"COINCIDENCIA 2 EQUIPOS"**
    [F3].

    5. Define la **salida** hacia la sirena.


    > ⚠️ **EN54-2: 7.1.4 — No incluyas pulsadores manuales en el grupo de coincidencia**
    [F1] [F3].


    ---


    ### Paso 4 — Verificar condiciones de coincidencia


    - Para que se active la salida, **dos equipos de la misma zona o subzona** deben
    estar en alarma [F3].

    - Los equipos en alarma deben estar en la **misma zona o subzona**. Solo en subzonas,
    si la central está configurada para ello, pueden estar dentro de un rango de subzonas
    (configurable en **Sección 11.21**) [F3] [F5].

    - Si la entrada es **CUALQUIER ZONA**, el comportamiento de coincidencia (misma
    central/red o misma zona) se configura en la pestaña **Coincidencia de Alarma**
    de las opciones de la central (**Sección 2.12**) [F6].


    ---


    ### Paso 5 — Configuración adicional (si necesitas niveles de coincidencia personalizados)


    Si necesitas niveles de coincidencia adicionales (más de 2 equipos), configúralos
    previamente en **Parámetros Sistema → Opciones de la Central → pestaña "Coincidencia
    de Alarma"** (Sección 2.12) [F6]. Los niveles configurados ahí quedan disponibles
    en el menú de edición de entradas de la Matriz de Control.


    ---


    ### Nota sobre conflictos de coincidencia


    Si dos sensores tienen configuraciones de coincidencia distintas entre sí, la
    resolución es: **si cualquiera de las dos configuraciones establece que se ha
    cumplido la coincidencia, ésta se cumple** [F8]. Ten esto en cuenta si mezclas
    detectores con distintos niveles de coincidencia en la misma zona.


    ---


    **Fuentes:**

    - MCDT190 (sin revisión registrada) — Secciones 6.1.5 y 6 Matriz de Control

    - MPDT190 (sin revisión registrada) — Secciones Matriz de Control y 11.21

    - MCDT191 (sin revisión registrada) — Secciones 4.2, 4.3.1, 2.12

    - MADT190_14 (sin revisión registrada) — Sección 4.4


    ---

    📖 **Información adicional del manual:**

    - "- Radio button: Deber estar en la misma Subzona

    - Radio button: Se extiende en el rango de Subzonas especificadas (labeled as
    4)" [F6]

    - "- Nivel 3: [0] [spinner]

    - Nivel 4: [0] [spinner]

    - Nivel 5: [0] [spinner]" [F6]'
