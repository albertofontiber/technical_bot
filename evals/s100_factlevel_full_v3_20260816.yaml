  question: ¿Cual es el MTBF / vida util esperada del detector de gas DGD-600 de Detnov?
  answer: 'El **DGD-600** tiene una **vida útil de 10 años desde su fecha de fabricación**
    [F1], tras los cuales debe ser sustituido.


    El manual no especifica un valor de MTBF (Mean Time Between Failures) para el
    DGD-600. El único dato de durabilidad disponible es la vida útil de 10 años indicada.


    **Dato práctico:** La fecha de fabricación está impresa en la pegatina adherida
    al lateral del dispositivo [F1], lo que permite calcular cuándo debe procederse
    a su sustitución.


    ---


    Fuente: 55360004 Manual Detector Gas DGD-600 ES EN IT FR (sin revisión registrada)


