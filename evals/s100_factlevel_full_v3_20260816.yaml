- qid: cat007
  question: En el detector por aspiración FAAST LT-200, ¿qué salidas de relé y de
    sirena tiene y con qué contactos, cómo se comporta el relé de avería ante un fallo
    o un corte de alimentación, qué resistencia de fin de línea llevan las salidas
    de sirena y cuál es la especificación eléctrica de los contactos de relé?
  answer: '# Salidas de relé y sirena del FAAST LT-200


    ## Relés disponibles y sus contactos


    El FAAST LT-200 dispone de los siguientes relés, con contactos **NC (normalmente
    cerrado), C (común) y NA (normalmente abierto)** [F5]:


    **Relés de alarma (uno por canal):**

    - Terminal 5: Relé de alarma NC — Canal 1 [F5]

    - Terminal 6: Relé de alarma C — Canal 1 [F5]

    - Terminal 7: Relé de alarma NA — Canal 1 [F5]

    - Terminal 8: Relé de alarma NC — Canal 2 [F5]

    - Terminal 9: Relé de alarma C — Canal 2 [F5]

    - Terminal 10: Relé de alarma NA — Canal 2 [F5]


    **Relés de avería (uno por canal):**

    - Terminal 11: Relé de avería NC — Canal 1 [F5]

    - Terminal 12: Relé de avería C — Canal 1 [F5]

    - Terminal 13: Relé de avería NA — Canal 1 [F5]

    - Terminal 14: Relé de avería NC (AUX.) — Canal 2 [F5]

    - Terminal 15: Relé de avería C (AUX.) — Canal 2 [F5]

    - Terminal 16: Relé de avería NA (AUX.) — Canal 2 [F5]


    **Relés de prealarma (uno por canal)** — presentes en la versión Stand Alone [F5]:

    - Terminal 23: Relé de prealarma NC — Canal 1 [F5]

    - Terminal 24: Relé de prealarma C — Canal 1 [F5]

    - Terminal 25: Relé de prealarma NA — Canal 1 [F5]

    - Terminal 26: Relé de prealarma NC — Canal 2 [F5]

    - Terminal 27: Relé de prealarma C — Canal 2 [F5]

    - Terminal 28: Relé de prealarma NA — Canal 2 [F5]


    > **Nota:** Los relés de prealarma (terminales 23–28) aparecen en el manual Stand
    Alone [F5] pero no en la tabla de terminales de la versión Notifier [F6], que
    en esas posiciones indica "Not Used" y terminales de lazo.


    ---


    ## Comportamiento del relé de avería


    El relé de avería se activa en las siguientes condiciones [F1]:

    - Cuando se produce una **condición de avería** en el canal 1 o canal 2.

    - Cuando se produce una **avería común**.

    - Cuando la unidad está en **modo de servicio** (apertura de puerta frontal) [F9].

    - Cuando se **desconecta la alimentación** de la unidad.


    El estado de avería **no está enclavado** (predeterminado): se desactiva automáticamente
    al resolverse la condición, sin necesidad de rearme manual [F1].


    ---


    ## Resistencia de fin de línea en salidas de sirena


    Las salidas de sirena llevan una resistencia de fin de línea de **47 kΩ** [F5]:


    - Terminal 17: Salida sirena 1 − [F5]

    - Terminal 18: Salida sirena 1 + [F5]

    - Terminal 19: Salida sirena 2 − [F5]

    - Terminal 20: Salida sirena 2 + [F5]


    ---


    ## Especificación eléctrica de los contactos de relé


    - **2,0 A a 30 V CC** (carga resistiva) [F4]

    - **0,5 A a 30 V CA** (carga resistiva) [F4]

    - Vida útil mínima: **10⁵ operaciones** [F3]


    > ⚠️ **Advertencia sobre cargas inductivas:** El manual en inglés [F3] incluye
    diagramas de advertencia sobre la conmutación de cargas inductivas. Para el conexionado
    correcto con cargas inductivas, consulta los diagramas del documento **I56-6577-006_EN**,
    que muestran la configuración correcta con diodo (referencia **1N6284CA**) [F3].


    ---


    ## Comportamiento de los relés de alarma y prealarma (Stand Alone)


    - **Relé de alarma:** se activa al cumplirse la condición de alarma (nivel predeterminado
    = Nivel 1). Estado **enclavado por defecto** — requiere rearme manual para desactivar
    el LED y el relé [F1].

    - **Relé de prealarma:** se activa al cumplirse la condición de prealarma. Cuando
    prealarma = alarma = Nivel 1, la prealarma se activa al **70 % del Nivel 1** [F1].

    - **Relé de sirena:** se activa cuando el canal está en alarma (o prealarma, según
    configuración). Estado predeterminado = activado en alarma [F1].


    ---


    **Fuentes:**

    - I56-6574-005_ES — HS Stand Alone FAAST LT-200 QIG (sin revisión registrada)
    [F1, F4, F5]

    - I56-6577-006_ES — FAAST Notifier LT-200 QIG (sin revisión registrada) [F2, F11]

    - I56-6577-006_EN — Notifier FAAST LT-200 QIG (sin revisión registrada) [F3, F6]'
