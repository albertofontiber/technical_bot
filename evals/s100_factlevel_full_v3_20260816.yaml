- qid: cat008
  question: ¿Cómo se cablea el módulo de entrada M710 / MI-DMMI en el lazo, y qué
    resistencias necesita (fin de línea y modo 3 estados)?
  answer: '## Conexionado del M710 / MI-DMMI en el lazo


    Los fragmentos cubren ambos módulos. A continuación se detalla el conexionado
    por terminales y las resistencias necesarias.


    ---


    ### Asignación de terminales (lazo)


    - **T1** – Salida del lazo – [F5]

    - **T2** – Salida del lazo + (con aislador de cortocircuito activo) [F5]

    - **T3** – Entrada del lazo – [F5]

    - **T4** – Entrada del lazo + [F5]

    - **T5** – Salida del lazo + (sin aislador de cortocircuito) [F5]


    > **Nota sobre el aislador interno:** Si **no** se necesita aislamiento de cortocircuitos,
    conecta la salida + del lazo al **terminal 5** en lugar del terminal 2. El terminal
    5 está conectado internamente con el terminal 4 (M710/M720) [F9] / terminal 2
    (MI-DMMI) [F8]. Para el MI-DMMI en contexto ID3000: los positivos in/out de lazo
    deben conectarse a los terminales 4 y 5 para eliminar el aislador interno [F1].


    ---


    ### Resistencia de fin de línea (EOL)


    - **Valor: 47 kΩ** [F1][F7]

    - Referencia de componente para M710: **M200E-EOL-R** [F4]

    - Referencia de componente para MI-DMMIE: **M200-EOL-R** (mencionada en Fig. 2)
    [F7]


    ---


    ### Modo 2 estados vs. 3 estados


    **Modo 2 estados:**

    - Conexionado estándar con la resistencia EOL de **47 kΩ** [F1]

    - Un cortocircuito en la entrada se señaliza como **alarma** [F1]


    **Modo 3 estados:**

    - Requiere añadir una resistencia de **18 kΩ** en serie con cada contacto/conmutador
    de dispositivo que se desee supervisar [F1][F3][F4][F9]

    - Referencia de componente para M710: **M200E-EOL-R18** [F9]

    - Con este modo, si el panel de control lo permite, un cortocircuito se señaliza
    como **avería** en lugar de alarma [F4][F9]

    - Para el MI-DMMI, la nota indica: *"Es necesario poner una resistencia de 18
    kΩ en serie con el contacto abierto"* [F1]


    ---


    ### Advertencias importantes


    - Los **terminales 8 y 9** (circuito de aislador externo en línea de puntos) **no
    tienen conexión en el MI-DMMI ni en el M710**. Esos terminales son exclusivos
    del MI-DMM2I / M720 [F6][F9].

    - Para la supervisión de cortocircuito con 3 estados, el panel de control debe
    ser compatible con esta función [F3][F4][F9].

    - Para la programación del módulo en la central ID3000, consulta el artículo específico
    de programación de módulos de entrada [F1].

    - Para consultas técnicas: `soporteHLSI@honeywell.com` [F1]


    ---


    Para el conexionado exacto (esquema visual de terminales), consulta la **Figura
    3** del manual I56-2005-002 (M710) [F4] y la **Figura 2** del manual I56-4406-001
    (MI-DMMIE) [F7], ya que los diagramas de cableado completos están en esas figuras.


    **Fuentes:**

    - Conexionado-del-modulo-M710-MI-DMMI (sin revisión registrada)

    - I56-2005-002 M710 M720 M721 M701 (sin revisión registrada)

    - I56-2006-004 MI-DMMI_DMM2I_D2ICMO (sin revisión registrada)

    - I56-4406-001 MI-DMMIE MI-DMM2IE MI-D2ICMOE (sin revisión registrada)


    ---

    📖 **Información adicional del manual:**

    - "1. Si no se necesita el aislamiento de cortocircuitos, se debe conectar la
    salida + del lazo al terminal 5 en vez de al terminal 2. El terminal 5 está conectado
    internamente con el terminal 4.

    2. El circuito con línea intermitente conectado a los terminales 8 y 9 se debe
    utilizar únicamente con el M720. El M710 no tiene conexiones con estos terminales.

    3. Si el panel de control lo permite, se podrá indicar un cortocircuito como avería
    en lugar de alarma. Para ello hay que conectar una resistencia de 18 KΩ (M200E-EOL-R18)
    en serie con cada equipo que se desee supervisar." [F4]'
