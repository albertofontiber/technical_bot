- qid: cat017
  question: ¿Como se cablea y se da de alta (configura) un lazo en la central Notifier
    INSPIRE (E10/E15)?
  answer: '# Cableado y configuración de lazo en Notifier INSPIRE E10/E15


    A continuación se detalla el proceso completo en dos bloques: **cableado físico**
    y **configuración en CLSS**.


    ---


    ## BLOQUE 1 — CABLEADO FÍSICO DEL LAZO


    ### Módulo de lazo (OPAL X2 — HOP-433-100)


    El módulo de lazo tiene **color morado** y dispone de 10 terminales [F2]:


    **Lazo 1:**

    - Terminal **1** → Lazo 1 Salida +VE (OUT +VE)

    - Terminal **2** → Lazo 1 Salida -VE (OUT -VE)

    - Terminal **3** → ⊕ (**NO USAR para pantalla de cable**)

    - Terminal **4** → Lazo 1 Entrada +VE (IN +VE)

    - Terminal **5** → Lazo 1 Entrada -VE (IN -VE)


    **Lazo 2:**

    - Terminal **6** → Lazo 2 Salida +VE (OUT +VE)

    - Terminal **7** → Lazo 2 Salida -VE (OUT -VE)

    - Terminal **8** → ⊕ (**NO USAR para pantalla de cable**)

    - Terminal **9** → Lazo 2 Entrada +VE (IN +VE)

    - Terminal **10** → Lazo 2 Entrada -VE (IN -VE)


    > ⚠️ **IMPORTANTE:** No utilices los terminales 3 y 8 para la pantalla del cable
    de lazo. La pantalla debe conectarse a la **barra de tierra** de la central [F2][F3].


    > ⚠️ **NO mezcles dispositivos OPAL y CLIP en el mismo lazo** [F2].


    ### Orden de instalación de módulos recomendado


    1. Insertar el **cargador en RANURA 1** y la **CPU en RANURA 2** [F4].

    2. Insertar los **módulos de lazo a partir de RANURA 3** (junto a la CPU) en adelante
    [F4].

    3. Los lazos se numeran **secuencialmente de izquierda a derecha** del portamódulos
    [F2].


    ### Comprobaciones previas con multímetro (ANTES de conectar a la central)


    > ⚠️ **NUNCA uses un dispositivo de alta tensión (p. ej. megóhmetro) en el circuito
    de lazo** [F6].


    Realiza estas comprobaciones con el lazo **desconectado físicamente** de los terminales
    de la central [F8]:


    1. Comprueba la **continuidad** de cada parte del lazo y mide la resistencia extremo
    a extremo [F6].

    2. Comprueba la **continuidad de la pantalla** del cable (debe dar resistencia
    muy baja) [F6].

    3. Verifica que **no hay continuidad** entre la pantalla y los cables +VE y -VE
    [F6].

    4. Con función de **prueba de diodo** en polaridad invertida (+VE del multímetro
    al negativo del lazo, -VE al positivo): debe indicar diodo en polarización directa
    [F7].

    5. En polaridad **normal** (+VE al positivo, -VE al negativo): la resistencia
    debe empezar baja y aumentar progresivamente al cargarse los condensadores de
    los dispositivos [F7].


    ### Límites de resistencia del lazo [F8]


    - **Protocolo OPAL:** resistencia máxima **< 40 Ω**

    - **Protocolo CLIP (detección de dirección duplicada):** resistencia máxima **<
    40 Ω**

    - **Protocolo CLIP (sin detección de dirección duplicada):** resistencia máxima
    **< 71 Ω**

    - **Capacidad del cable:** debe ser **< 0,5 µF** [F8]


    > ℹ️ Para calcular: mide entre Lazo X Entrada -VE y Lazo X Salida -VE, multiplica
    el resultado por 2 y añade la resistencia de cada aislador (**0,1 a 0,13 Ω** por
    aislador) [F8].


    > ℹ️ Se recomienda usar la herramienta **POL-200-TS** para comprobar y medir circuitos
    de lazo antes de conectar a la central [F5].


    ### Capacidad máxima por lazo [F2][F10]


    **Protocolo OPAL:**

    - Hasta **159 detectores OPAL** + hasta **159 módulos OPAL** por lazo

    - El módulo de lazo dual permite hasta **318 dispositivos OPAL por lazo** (159
    detectores + 159 módulos)


    **Protocolo CLIP:**

    - Hasta **99 detectores CLIP** + hasta **99 módulos CLIP** por lazo


    > ⚠️ **Restricción EN54-2 (13.7):** máximo **512 detectores y/o pulsadores** por
    módulo de lazo (que consta de 2 circuitos de lazo) [F2].


    > ℹ️ La **longitud máxima del cable de lazo** puede ser de hasta **3,5 km** dependiendo
    del tipo de carga y de cable, y debe calcularse con el **programa de cálculo de
    lazo y batería de CLSS** [F2].


    ### Conexión final del lazo a la central


    - **Lazo OPAL:** una vez verificado el cableado, conecta el circuito al bloque
    de terminales de lazo seleccionado [F5].

    - **Lazo CLIP:** reconecta primero los aisladores que se puentearon temporalmente,
    luego conecta el circuito al bloque de terminales [F5].

    - Se recomienda **poner a tierra un extremo de la pantalla** del cable de lazo
    a la barra de tierra de la central [F5].


    ---


    ## BLOQUE 2 — CONFIGURACIÓN (ALTA DEL LAZO EN CLSS)


    ### Paso previo obligatorio: preparación en CLSS


    Antes del primer encendido [F14]:

    1. En el **portal en la nube de CLSS** (https://fire.eu.honeywell.com/#/home),
    crea un sitio/edificio y añade una central.

    2. Carga la configuración de la central con el **programa de configuración de
    CLSS**.

    3. Genera el **archivo .bin de licencia** de la central.


    > ⚠️ La búsqueda de dispositivos **no puede ejecutarse sin preconfigurar la central
    en CLSS** [F9].


    > ℹ️ Para ejecutar un lazo en protocolo OPAL o CLIP se necesita una **licencia**
    [F9].


    ### Configuración del lazo en CLSS [F12]


    En **"Configuración de lazo"**:

    1. Establece el **"Protocolo de lazo"** en **OPAL** (o CLIP si aplica).

    2. Introduce la **resistencia de los cables de lazo**.

    3. Si es necesario, selecciona el **límite al requisito de VdS**.

    4. Selecciona el **tipo de cable**.

    5. Si el circuito de lazo **no se va a utilizar**, marca la casilla **"Sin Uso"
    ☑** [F1][F12].

    6. Envía el **archivo de configuración** a la central.


    ### Primer encendido y autobúsqueda de dispositivos [F9]


    1. Selecciona **País e Idioma** en la lista desplegable → **SIGUIENTE**.

    2. Define **hora y fecha**, selecciona formato de reloj 12/24 h → **SIGUIENTE**.

    3. Aparece la pantalla **"Información del sistema"** con los módulos instalados.
    Desplázate hasta el primer módulo de lazo y selecciona la flecha hacia abajo para
    ver los lazos (inicialmente mostrará **0 dispositivos** en cada lazo).

    4. Selecciona **"Auto Configuración"** para buscar los dispositivos conectados
    al circuito de lazo. Lee la información de la ventana emergente y confirma seleccionando
    **"Auto Configuración"** [F11].


    > ℹ️ Si un módulo instalado no aparece en la información del sistema, puede que
    no esté correctamente instalado o que el **firmware no coincida** [F9].


    ---


    **Fuentes:**

    - HOP-138-8ES issue 6 (rev. issue HOP-138-8ES CO = 6, 01-2026) — Instrucciones
    de puesta en marcha

    - HOP-138-9ES issue 5 (rev. issue HOP-138-9ES IN = 5, 11-2025) — Instrucciones
    de instalación

    - 4188-1132-ES issue 3 (rev. issue 4188-1132-ES QREF = 3, 04-2025) — Guía rápida


    ---

    ⚠️ **Información adicional del manual:**

    - "- Warning text in red: "Do not use 3 + & 8 +." [F4]

    - "A warning triangle symbol (△) is shown.]" [F4]'
