- qid: cat009
  question: ¿Qué resistencia de fin de línea (EOL) hay que instalar en las líneas
    de zona de la central convencional NFS Supra?
  answer: "La resistencia de fin de línea (EOL/RFL) para las líneas de zona de la\
    \ NFS Supra es de **6K8 Ω** en modo resistivo, o un **condensador de 47 µF** en\
    \ modo capacitivo (por defecto) [F4][F5].\n\n## Detalles importantes:\n\n**Valores\
    \ de EOL según modo de supervisión:**\n- Modo capacitivo (EFL) — **por defecto**:\
    \ condensador de **47 µF** [F4][F5]\n- Modo resistivo (RFL): resistencia de **6K8\
    \ Ω** [F4][F5]\n\n**Rango admitido en modo resistivo (RFL):**\nLa central admite\
    \ un rango de resistencia final de línea entre **3 KΩ** (consumo máx. por zona\
    \ 2,5 mA) y **7 KΩ** (consumo máx. por zona 4 mA) [F4].\n\n**Obligatoriedad:**\n\
    Todas las zonas, **incluso las no usadas**, deben tener instalada su final de\
    \ línea según la configuración del sistema (EFL o RFL) [F4][F5].\n\n**Ubicación\
    \ de instalación:**\nEl EOL/RFL se instala entre el positivo y negativo de la\
    \ línea, después del último equipo conectado [F9].\n\n---\n\n## Cómo cambiar entre\
    \ modo capacitivo y resistivo:\n\n1. Acceder al menú de configuración pulsando\
    \ **Tecla TECLADO + Tecla EVACUACIÓN** simultáneamente [F3][F7]\n2. Cambiar la\
    \ opción con la tecla **REARME** [F3]\n   - **Led 1 Alarma Rojo = ON** → Final\
    \ de Línea Resistivo **6K8 Ω** [F3]\n   - **Led 2 Anulada Ámbar = ON** → Final\
    \ de Línea Capacitivo **47 µF / Diodo** (por defecto) [F3]\n3. Requiere **Nivel\
    \ de acceso 3** (Configuración) [F3]\n\n---\n\n> ⚠️ **Nota:** Existe una discrepancia\
    \ entre versiones del manual. La versión en inglés (v05) indica **4K7 Ω** como\
    \ valor resistivo en la sección de conexionado de detectores [F1], mientras que\
    \ la versión en español (v05) y la sección de circuitos de zona indican **6K8\
    \ Ω** [F3][F4][F5][F7]. El valor **6K8 Ω** es el que aparece de forma consistente\
    \ en la documentación en español y en las secciones de especificación de zona.\
    \ Verifica con el manual físico de tu instalación qué versión corresponde a tu\
    \ equipo.\n\n---\n\nFuentes: HLSI-MN-025_NFS Supra (rev. v05, sin fecha registrada);\
    \ HLSI-MN-025-I_NFS Supra Series v05 (sin revisión registrada); HLSI-MA-025 Guía\
    \ Rápida NFS_Supra_ES (sin revisión registrada)\n\n---\n\U0001F4CB **Obligaciones\
    \ de evidencia del manual:**\n- Nota: la fuente es inconsistente: \"La central\
    \ NFS Supra tiene cuatro, ocho o doce zonas de alarma.\" (HLSI-MN-025_NFS Supra,\
    \ p. 27) [F4] declara 12 zonas y la enumeración servida lista 6 (HLSI-MN-025_NFS\
    \ Supra, p. 27) [F4]."
