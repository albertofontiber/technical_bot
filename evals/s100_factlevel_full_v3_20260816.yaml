- qid: hp021
  question: ¿Cómo se accede al menú de configuración avanzada en la Detnov CAD-171?
  answer: 'El submenú **AVANZADO** de la CAD-171 se accede desde:


    **AJUSTES** (Menú principal) **> AVANZADO** (Submenú) [F1]


    ## Pasos para acceder:


    1. Desde la **PANTALLA DE REPOSO**, toca el icono del candado (🔒) [F3].

    2. Introduce la **clave de administrador** (por defecto: **2222**) [F3].

    3. En el **Menú principal** (columna izquierda), selecciona **AJUSTES** [F1].

    4. En el **Submenú** (columna derecha), selecciona **AVANZADO** [F1].


    ## Submenús disponibles bajo AJUSTES:


    El submenú de AJUSTES incluye las siguientes opciones [F1]:

    - **GENERAL**

    - **VERSIONES**

    - **USUARIOS**

    - **AVANZADO**

    - **CONECTIVIDAD**

    - **IMPRESORA**

    - **LOGS**

    - **TEST**

    - **INICIO**


    > ⚠️ **Nota importante:** El manual indica que "dependiendo de la clave introducida,
    ciertos parámetros de configuración no estarán disponibles". Asegúrate de acceder
    con nivel de administrador para tener acceso completo [F3].


    > 📄 El manual menciona que para información detallada de configuración avanzada
    debes consultar la **Guía Avanzada de Configuración** [F3].


    ---


    **Fuente:** Manual_CAD-171-MI-716-es (sin revisión registrada)'
