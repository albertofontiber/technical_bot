- qid: hp013
  question: ¿Cómo se cambia la batería tampón de la Detnov ADW535 sin perder configuración?
  answer: 'El manual del ADW535 **no describe un procedimiento específico para sustituir
    la batería de litio sin perder configuración**. Los fragmentos disponibles no
    cubren ese procedimiento paso a paso.


    Lo que sí puedo confirmar a partir de los fragmentos:


    **Sobre la batería de litio:**

    - El Main Board **LMB 35** incorpora una **batería de litio** [F1], y antes del
    primer encendido debe retirarse la cinta aislante de dicha batería [F4].

    - Existe un parámetro de fallo configurable llamado **"Fallo batería de litio
    / reloj"** (on/off), guardado en posiciones de conmutador X01–X03 [F6].


    **Sobre dónde se almacena la configuración:**

    - Los parámetros específicos del sistema se almacenan en la **EEPROM** del ADW535
    [F11].

    - El firmware reside en la **Flash-PROM** [F11].

    - Tras un **reset de hardware** (interrupción de tensión o pulsación del botón
    reset del LMB 35), los parámetros programados con anterioridad **se mantienen**
    [F8].


    **Implicación práctica:** dado que la configuración reside en EEPROM (memoria
    no volátil), en principio no depende de la batería para su conservación. Sin embargo,
    el manual **no confirma explícitamente** que la sustitución de la batería no afecte
    a la configuración, ni describe el procedimiento de sustitución.


    **Lo que sí advierte el manual:**

    - En caso de sustitución del **Main Board LMB 35**, es obligatorio realizar un
    nuevo **reset inicial** [F2].

    - Al sustituir la unidad de evaluación completa, deben reajustarse **todas las
    configuraciones específicas del cliente** [F3].

    - Cualquier trabajo de mantenimiento en el ADW535 solo puede llevarlo a cabo **personal
    autorizado y formado por el fabricante** [F3].


    ---


    **Recomendación:** Consulta directamente el procedimiento de sustitución de batería
    con el soporte técnico de **Securiton/Detnov** o en el manual físico completo,
    ya que los fragmentos disponibles no cubren ese procedimiento concreto.


    Fuente: ADW535_TD_T140358es_e (sin revisión registrada)


    ---

    ⚠️ **Información adicional del manual:**

    - "Para evitar que los controles de incendios, las alertas remotas y las zonas
    de extinción se disparen al llevar a cabo los trabajos de mantenimiento, es **imprescindible**
    bloquearlos o desconectarlos previamente." [F3]

    - "Por ello, cuando se realicen trabajos de mantenimiento en el ADW 535, es imprescindible
    desconectar previamente los controles de incendios y las alertas remotas de los
    sistemas de orden superior (CDI)." [F8]'
