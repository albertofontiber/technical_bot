- qid: hp003
  question: ¿Cómo se conectan las baterías de 24V en la Detnov CAD-150?
  answer: '## Conexión de baterías en la CAD-150-8


    Las baterías se conectan en **serie** para obtener los **24V** de funcionamiento
    [F3][F8].


    ### Especificaciones de las baterías

    - **Tipo requerido:** dos baterías de **12V 7Ah** [F3][F8]

    - **Ubicación:** parte inferior de la caja, en posición vertical, en el espacio
    reservado para ello [F3]


    ### Procedimiento de conexión


    1. **Conecta las dos baterías en serie** mediante el cable puente suministrado
    con la central, uniendo el polo positivo de una batería con el polo negativo de
    la otra [F3][F8].


    2. **Conecta los cables del circuito** (rojo → positivo, negro → negativo) a los
    bornes libres de las baterías [F1][F8].


    3. **El conector de baterías** en la PCB base corresponde al punto **11 (Conector
    Batería)**, protegido por el **fusible de baterías (punto 10)** [F2].


    ### ⚠️ Orden de conexión obligatorio


    El orden de conexión es crítico y debe respetarse siempre [F7]:


    1. **Primero:** conectar la alimentación de red (**230VAC**) activando el magnetotérmico
    bipolar [F6][F7].

    2. **Segundo:** conectar las baterías [F6][F7].


    > **Advertencia:** Si no se respeta este orden, el equipo podría sufrir daños
    [F7].


    ### Verificación previa a la puesta en marcha

    Antes de conectar, verifica que las baterías tienen una tensión superior a **24V**
    [F6].


    ---


    Fuente: 55315013 Manual Centrales Analógicas CAD-150-8 Instalación ES FR GB IT
    (sin revisión registrada); 55315008 Manual Centrales Analógicas CAD-150-8 Usuario
    ES FR GB IT (sin revisión registrada)


    ---

    ⚠️ **Información adicional del manual:**

    - "<ins>En cada una de las conexiones del bucle es imprescindible dar continuidad
    a la pantalla.</ins> Algunos de los módulos precisan de alimentación auxiliar,
    que deberá ser suministrada con la salida auxiliar de la placa base, (no se recomienda
    de alimentar más de 10), o con un fuente auxiliar, situada lo más próxima posible
    al módulo." [F1]

    - "Es imprescindible que se usen los orificios marcados en la caja para conexionar
    los cables tanto de alimentación como de zonas al regletero." [F3]

    - "* En primer lugar, conectar el equipo a la red principal (230VAC)

    * En segundo lugar, conectar las baterías" [F7]'
