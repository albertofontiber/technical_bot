- qid: hp017
  question: ¿Cómo se programa el retardo de salida de alarma principal en la Notifier
    PEARL?
  answer: 'El retardo de salida de alarma principal en la PEARL **no se programa como
    un parámetro único**, sino que se configura dentro de las **reglas de causa-efecto**
    de la central [F1].


    ## Cómo se programa el retardo de salida


    El retardo de salida se asigna dentro de cada regla de causa-efecto. El proceso
    general es:


    No puedo confirmar de forma segura el número de menú de Causa y Efecto con los
    fragmentos servidos. Confirma el manual y la revisión exactos antes de usar un
    número de menú.


    ## Los seis tipos de retardo disponibles


    Los tipos de retardo que puedes asignar a una regla son [F1][F2]:


    - **Estándar**

    - **Fijo**

    - **Est. Ext.** (Estándar con extensión)

    - **No Silenc.** (No silenciable)

    - **No Sil. Ext** (No silenciable con extensión)

    - **Estándar 0** / **SinRetExt**


    ## Comportamiento de cada tipo (según la tabla de acciones) [F2]


    - **La salida se detiene al pulsar SILENCIAR SIRENAS durante el retardo:** Solo
    en tipos Estándar, Est. Ext. y RetExtStd.

    - **El retardo puede anularse (nivel acceso 2, opción «Anular retardos»):** En
    todos excepto Fijo.

    - **El tiempo restante se muestra en la pestaña ALARMA:** En todos excepto Fijo.

    - **El retardo puede detenerse con FIN RETARDO (nivel acceso 2):** En todos excepto
    Fijo.

    - **La salida se detiene al pulsar AMPLIAR RETARDO:** Solo en Est. Ext. y No Sil.
    Ext.

    - **El temporizador comienza en RETARDO AMPLIADO:** Solo en RetExtStd y SinRetExt.


    ## Nota sobre el pulsador AMPLIAR RETARDO


    El pulsador **AMPLIAR RETARDO** puede habilitarse o deshabilitarse desde los parámetros
    de la central, opción **«10: Extend Delay Button»** [F5], ya que en algunos mercados
    no se requiere esta función.


    ## Anulación del retardo desde el panel (operación)


    Si necesitas anular/habilitar el retardo en campo (sin reprogramar):


    1. Accede al **Menú Anular/Habilitar** [F3].

    2. Selecciona **«5: Retardo Activación Salidas»** [F3].

    3. Pulsa **✓** para cambiar el estado entre HABILITADO y ANULADO [F3].

    4. Pulsa **✕** para salir [F3].


    ---


    ⚠️ **Importante:** Los fragmentos disponibles no especifican el procedimiento
    paso a paso para introducir el valor numérico del tiempo de retardo (en segundos/minutos)
    dentro de una regla de causa-efecto concreta. Para ese nivel de detalle, consulta
    el manual de configuración completo o usa el software de configuración por ordenador
    [F12].


    ---


    **Fuente:** Manual de configuración de la central PEARL (rev. 997-671-005-3);
    Manual de funcionamiento PEARL 997-670-005-3 (sin revisión registrada)


    ---

    ⚠️ **Información adicional del manual:**

    - "**Al programar reglas de causa-efecto evite las lógicas contradictorias.**"
    [F12]

    - "**Es de vital importancia probar rigurosamente todas las reglas durante la
    puesta en marcha del sistema para verificar que no haya conflictos lógicos entre
    ellas.**" [F12]


    ---

    📋 **Obligaciones de evidencia del manual:**

    - Nota: la fuente es inconsistente: "Se puede asignar uno de seis tipos de retardo
    de salida a una regla, como se explica a continuación." (997-671-005-3_Configuration_ES,
    p. 44) [F1] declara 6 tipos y la enumeración servida lista 8 (997-671-005-3_Configuration_ES,
    p. 44) [F1].

    - Nota: la fuente es inconsistente: "Sección 4 - 4" (997-671-005-3_Configuration_ES,
    p. 21) [F7] declara 4 Equipos y la enumeración servida lista 20 (997-671-005-3_Configuration_ES,
    p. 20) [F8].'
