per_gold:
- qid: cat001
  question: En la Notifier PEARL, ¿cuántos equipos admite un lazo SLC y qué límites
    de cableado hay (aisladores), y cómo se dan de alta y editan esos equipos desde
    la central?
  answer: "# Notifier PEARL — Capacidad de lazo SLC, límites de aisladores y alta/edición\
    \ de equipos\n\n---\n\n## 1. Capacidad máxima del lazo SLC\n\nLa PEARL admite\
    \ **hasta 318 equipos por lazo analógico**: máximo **159 sensores** y **159 módulos**\
    \ (protocolo Opal) [F1].\n\nDesglose por protocolo [F2]:\n- **Protocolo Opal:**\
    \ hasta 159 sensores + 159 módulos por lazo\n- **Protocolo CLIP:** hasta 99 sensores\
    \ + 99 módulos por lazo\n- **Protocolo mixto Opal + CLIP:** el límite de equipos\
    \ CLIP en lazo mixto es de **40**; si se supera, la autoconfiguración continúa\
    \ pero señala fallos [F6]\n- **Carga máxima por lazo:** 0,75 A [F2]\n\nLímite\
    \ global del sistema (norma EN54-2: 13-7) [F1]:\n- **Máximo 512 sensores y/o pulsadores\
    \ manuales** en total entre ambos lazos analógicos, incluyendo detectores y pulsadores\
    \ de zona convencionales conectados\n\nCaso especial BS5839 parte 1 con pulsadores\
    \ CLIP [F1]:\n- Si se instalan pulsadores CLIP y se requiere tiempo de respuesta\
    \ de 3 segundos, el máximo de equipos CLIP **será de 6**\n\n---\n\n## 2. Límites\
    \ de cableado — Aisladores\n\n**Regla general EN54-2: 12.5.2** — máximo **32 equipos\
    \ entre aisladores** [F1].\n\nPara la PEARL, los límites concretos son [F1][F8]:\n\
    \n- **Equipos sin aisladores internos** (incluidos CLIP y algunos Opal): **no\
    \ más de 20 equipos entre aisladores** [F1]\n- **Equipos con aisladores internos\
    \ FET** (con base B501 AP): **no más de 20 equipos entre aisladores** [F8] — el\
    \ fragmento F8 indica \"20 si utiliza aisladores FET\"\n- **Equipos con aisladores\
    \ internos Opal** (con base B501 AP): los lazos deben cumplir los requisitos de\
    \ EN54-2 (≤32 equipos entre aisladores) [F1]\n\n> ⚠️ **Nota importante sobre bases:**\
    \ Los equipos con aisladores internos requieren la base **B501 AP** (con conectores\
    \ de cable de lazo de extremo positivo adicionales). Con bases sin estos conectores,\
    \ el aislador interno queda inutilizado una vez instalado [F1].\n\nRegla adicional\
    \ para inicio del lazo (cierre de aisladores al aplicar alimentación) [F3]:\n\
    - La carga entre aisladores no debe superar **20 SU** (unidades de carga)\n\n\
    Longitud máxima del lazo [F10]:\n- La longitud total del par de lazo de comunicaciones\
    \ **no puede superar los 2000 metros**\n\nResistencia y capacitancia del cableado\
    \ [F12]:\n- La **capacitancia del cable debe ser inferior a 0,5 µF**\n- La resistencia\
    \ máxima del lazo no debe superar los límites definidos en la sección **6.4.2**\
    \ del manual de instalación; para calcularla: medir entre IN- y OUT-, multiplicar\
    \ por 2 y añadir la resistencia de cada aislador (**entre 0,1 y 0,13 ohms cada\
    \ uno**)\n\n> ⚠️ **Advertencia:** NUNCA utilice un multímetro de alta tensión\
    \ (tipo Megger) en el lazo de detección. Si hay aisladores instalados, el conductor\
    \ positivo (+) del lazo estará en circuito abierto [F1].\n\n---\n\n## 3. Alta\
    \ de equipos — Autoconfiguración desde la central\n\nLa forma recomendada es usar\
    \ el **programa de configuración ITS**; no obstante, puede hacerse directamente\
    \ desde la central [F5].\n\n**Pasos para la autoconfiguración:**\n\n1. Accede\
    \ al menú de configuración de equipos de lazo [F5]\n2. Pulsa **1: Autoconfiguración**\
    \ [F5]\n3. Selecciona el alcance: **todos los lazos** o **un lazo específico**\
    \ [F5]\n4. Elige la opción de protocolo [F5][F6]:\n   - **1: Todos Prot. OPAL/CLIP**\
    \ — detecta duplicidades de dirección\n   - **2: OPAL/CLIP (No detecta duplicidad)**\
    \ — más rápido, sin comprobación de duplicados\n   - **3: Sólo con protocolo CLIP**\
    \ — solo autoconfigura equipos CLIP aunque haya Opal en el lazo\n5. Selecciona\
    \ el modo de actualización [F6]:\n   - **1: Permite Añadir/Borrar/Cambiar**\n\
    \   - **2: Sólo Añadir Nuevos Equipos**\n6. El proceso se inicia automáticamente.\
    \ Los sensores y módulos Opal y CLIP se detectan en la misma pasada [F5]\n7. Al\
    \ finalizar, los resultados se muestran por lazo de forma independiente. Usa las\
    \ teclas **◁/▷** para navegar entre lazos [F6]\n\n> **Nota:** Si un equipo Opal\
    \ se autoconfigura, por defecto será Opal. Si el número de equipos CLIP supera\
    \ los 40, selecciona manualmente la opción **\"Sólo con protocolo CLIP\"** [F6].\n\
    \nLos equipos configurados pueden consultarse en cualquier momento desde **nivel\
    \ de acceso 2 → \"Resumen de Equipos\"** [F5].\n\n---\n\n## 4. Edición individual\
    \ de equipos desde la central\n\nDesde el menú de configuración es posible editar\
    \ individualmente sensores o módulos [F4].\n\n**Parámetros editables para sensores**\
    \ [F4]:\n- Números de referencia de la zona de red\n- Tipo de equipo\n- Entorno\
    \ del número de referencia de zona (opcional)\n- Número de central (LOCAL o 1-125\
    \ para centrales de red)\n- Número de zonas (hasta **255 zonas locales** o **8192\
    \ zonas de red**)\n- Número de células (hasta **255**)\n- Prioridad de interrogación\
    \ (solo protocolo CLIP: limitada a **30 equipos**)\n- Acción de parpadeo en equipo\
    \ interrogado (elección de color solo para equipos Opal)\n- Opción de tipo de\
    \ equipo (VIEW, Optiplex y SMART)\n- Ajuste del nivel de alarma\n- Ajuste del\
    \ nivel de alarma horaria\n- Ajuste del nivel de prealarma\n- Selección de programación\
    \ horaria (cambio de sensibilidad)\n- Grupo AWACS (50 grupos, con todos los sensores\
    \ CLIP salvo HEAT)\n- Retardo de alarma\n- Ajuste no silenciable para función\
    \ de LED remoto (solo Opal); respuesta a la orden SILENCIAR SIRENAS\n- Operación\
    \ solo modo térmico (L6) (solo SMART y Optiplex)\n- Número de aplicación (solo\
    \ equipos SMART 4)\n- Ajuste de la función LED remota (solo Opal): **\"Seguir\
    \ el equipo\"** (predeterminada) o **\"Controlada por las reglas de causa-efecto\"\
    **\n- Retardo de confirmación de coincidencia de detector: ajustable hasta **240\
    \ s (4 min)**; puede usarse con dependencia tipo B\n\n---\n\n**Fuentes:**\n- Manual\
    \ de instalación y puesta en marcha PEARL: `997-669-005-3_Instal-Comm_ES` (sin\
    \ revisión registrada)\n- Manual de configuración de la central PEARL: `997-671-005-3_Configuration_ES`\
    \ (rev. 997-671-005-3)\n- Manual de funcionamiento PEARL: `997-670-005-3_Operating_ES`\
    \ (sin revisión registrada)\n\n---\n⚠️ **Información adicional del manual:**\n\
    - \"La resistencia máxima del lazo no debe superar los límites definidos en **«6.4.2\
    \ Comprobaciones del lazo antes de conectar el cableado»**, paso 2.\" [F12]\n\
    - \"Es de vital importancia que el cable utilizado sea de buena calidad y que\
    \ se instale de forma correcta.\" [F12]"
