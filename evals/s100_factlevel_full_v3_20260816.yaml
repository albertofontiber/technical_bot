- qid: cat020
  question: En una central Morley DXc instalada en Espana, ¿cual es el nivel de alarma
    y de prealarma por defecto de los detectores, y el maximo configurable?
  answer: '## Niveles de alarma y prealarma en detectores — Central Morley DXc (variación
    España)


    Los valores por defecto y el máximo configurable dependen del **tipo de detector**:


    ---


    ### Detectores con protocolo Morley-IAS (OPT, y similares con valor analógico
    en %)


    - **Nivel de prealarma por defecto: 80%** [F1]

    - **Nivel de alarma por defecto: 100%** [F1]

    - **Nivel de alarma máximo configurable: 108%** [F1]


    ---


    ### Detectores Multicriterio OTM (óptico-térmicos)


    Los niveles se expresan en **niveles discretos**, no en porcentaje [F2]:


    - **Nivel de prealarma recomendado (\*P): Nivel 3** (valor analógico 72, sensibilidad
    6,5% osc./m) [F2]

    - **Nivel de alarma recomendado (\*A): Nivel 4** (valor analógico 86, sensibilidad
    6,5% a 11,5% osc./m, autoajustado) [F2]


    Los niveles disponibles van del **Nivel 1 al Nivel 6** [F2].


    ---


    ### Detectores Láser LSR


    También con niveles discretos [F2]:


    - **Nivel de prealarma recomendado (\*P): Nivel 4** (valor analógico 69, sensibilidad
    0,32% osc./m) [F2]

    - **Nivel de alarma recomendado (\*A): Nivel 5** (valor analógico 76, sensibilidad
    0,65% osc./m) [F2]


    Los niveles disponibles van del **Nivel 1 al Nivel 9** [F2].


    ---


    ### Restricciones de configuración a tener en cuenta


    - **El nivel de prealarma no puede ser superior al nivel de alarma** [F3].

    - La central no permite ajustar niveles que impidan el reconocimiento de las alarmas
    [F3].

    - Por defecto, los detectores se ajustan a los **niveles de alarma recomendados
    por el fabricante** [F4].

    - Esta función de ajuste de sensibilidad es muy flexible y **solo debe utilizarse
    en aplicaciones especiales y con sumo cuidado** [F4].


    ---


    > **Nota:** Los valores mostrados en pantalla para un OTM en la instalación de
    ejemplo son Fuego: Niv4 / Prealarma: Niv3 [F1], lo que coincide con los niveles
    recomendados (\*A y \*P) de la tabla de detectores OTM [F2].


    ---


    Fuente: DXc_Manual variaciones de mercado (sin revisión registrada); DXc_Manual
    de configuracion (sin revisión registrada)


    ---

    📖 **Información adicional del manual:**

    - "Fuego : Niv4

    Prealarma: Niv3" [F2]


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "Revise que las averías registradas han recibido la atención adecuada." (DXc_Guia
    de usuario_multiling, p. 1) [F9]

    - "el umbral de alarma de fuego depende del ajuste del nivel/modo y es diferente
    para cada nivel de alarma." (DXc_Manual variaciones de mercado, p. 5) [F2]

    - "**Mensual:** Deben activarse, como mínimo, un pulsador o detector (de diferentes
    zonas cada mes) para probar la central y los dispositivos de señalización y alarma."
    (DXc_Guia de usuario_multiling, p. 1) [F9]'
