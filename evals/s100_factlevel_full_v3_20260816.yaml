- qid: hp011
  question: En la Morley RP1r, después de descargar la extinción el sistema no vuelve
    a estado normal tras resetear. ¿Qué comprobar?
  answer: '# RP1r-Supra: Sistema no vuelve a estado normal tras resetear después de
    extinción


    Hay varias causas posibles que impiden el rearme correcto. Comprueba en este orden:


    ---


    ## 1. Inhibición de rearme activa (causa más probable)


    La central puede tener configurado un **intervalo de inhibición de rearme** tras
    la extinción. El parámetro **r.i** define este comportamiento [F13]:


    - **`- -`** → Rearme inhibido hasta finalizar extinción o cuando se agote el tiempo
    configurado en el parámetro **t.A** (t.A → 0 seg.)

    - **`00`** → Rearme permitido en cualquier momento *(valor por defecto)*

    - **`01 a 30`** → Rearme inhibido durante el intervalo definido (en minutos)


    Además, según la norma **UNE-EN 12094-1:2004, apartado 4.12.2**, existe la posibilidad
    de inhibir temporalmente la función de rearme una vez la central ha entrado en
    modo ACTIVADO [F12].


    **Acción:** Accede al modo de programación y verifica el valor del parámetro **r.i**.
    Si está configurado con un valor de 01 a 30, espera a que transcurra ese intervalo
    o ajústalo a `00`.


    ---


    ## 2. LED "Extinción realizada" fijo — estado fin extinción no resuelto


    Tras la descarga, la central entra en **estado fin extinción** y muestra [F4]:

    - LED **"Extinción realizada"** iluminado de forma **fija**

    - Temporizador de disparo en **00 seg.** fijo


    Este estado requiere **rearme manual desde nivel de acceso 2** [F2]: accede con
    código de nivel 2 y pulsa la tecla **"Rearme"**.


    ---


    ## 3. Averías enclavadas en circuitos supervisados


    **Todas las averías son por defecto enclavadas y requieren rearme manual** [F2].
    Tras la extinción, es habitual que queden activas averías en:


    - **Circuito extinción 1 o 2** (bloques 1/2, `CCT EXT 1/2`) → LED "Avería circuito
    extinción" intermitente [F3]

    - **Señal de flujo** (bloque I, `FLOW PRESS SWITCH`) → LED "Avería presión flujo"
    intermitente [F2]

    - **Señal de baja presión** (bloque H, `LOW PRESS SWITCH`) → LED "Presión baja"
    iluminado [F10] — esta entrada es **auto-rearmable** [F10]


    **Acción:** Identifica qué LEDs de avería están activos. Si la condición de avería
    **persiste físicamente** (p. ej. botella vacía → baja presión real, circuito de
    extinción abierto), el rearme no será efectivo hasta que se resuelva la causa
    física.


    ---


    ## 4. Pulsador de paro (ABORT) accionado


    Si el pulsador **ABORT** fue activado durante la secuencia, el circuito D (`ABORT
    SWITCH`) **requiere rearme manual obligatorio** y no admite rearme automático
    [F3][F6]. El LED "Avería en paro" aparecerá **intermitente** y el LED "Paro" **fijo**
    [F3].


    **Acción:** Verifica que el pulsador ABORT esté físicamente liberado (no accionado)
    antes de rearmar.


    ---


    ## Resumen de comprobaciones


    1. Verificar parámetro **r.i** en programación — ¿hay inhibición de rearme activa?
    [F13]

    2. Acceder con **nivel 2** y pulsar tecla **"Rearme"** [F2]

    3. Identificar LEDs de avería activos y resolver la causa física antes de rearmar
    [F3]

    4. Comprobar que el pulsador **ABORT** no está accionado [F3][F6]


    ---


    Fuente: Manual de usuario RP1r-Supra (rev. v.07, 2018-05-01) — HLSI-MN-103_RP1r-Supra_lr;
    Manual de usuario RP1r-Supra — HLSI-MN-103I_RP1r-Supra_lr (sin revisión registrada)'
