- qid: hp004
  question: ¿Cuál es la tensión de funcionamiento y el consumo en reposo del detector
    DGD-600 de Detnov?
  answer: 'El **DGD-600** tiene dos variantes de alimentación con valores distintos.
    Aquí los datos de ambas [F3]:


    **Modelo 24V:**

    - Tensión de funcionamiento: **22 V a 38 V**

    - Consumo en reposo: **45 mA**


    **Modelo 220V:**

    - Tensión de funcionamiento: **180 V a 240 V**

    - Consumo en reposo: **70 mA**


    Como dato adicional, el consumo en alarma es de **65 mA** (modelo 24V) y **70
    mA** (modelo 220V) [F3].


    ---


    Fuente: 55360004 Manual Detector Gas DGD-600 ES EN IT FR (sin revisión registrada)'
