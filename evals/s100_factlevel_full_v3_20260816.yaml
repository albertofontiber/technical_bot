- qid: hp019
  question: ¿Cuál es el rango de temperatura de funcionamiento del detector de aspiración
    ASD535 (Securiton, distribuido por Detnov)?
  answer: 'El rango de temperatura de funcionamiento del **ASD 535** es el siguiente
    [F1]:


    **Caja del detector:**

    - Rango estándar: **–30 °C hasta +60 °C** (para certificación UL, máximo **+40
    °C**) [F1]

    - Según estándar australiano **AS 1603.8**: **–30 °C hasta +55 °C** [F1]


    **Conducto de aspiración:**

    - Rango estándar: **–30 °C hasta +60 °C** [F1]

    - Según estándar australiano **AS 1603.8**: **–30 °C hasta +55 °C** [F1]


    **Restricciones adicionales a tener en cuenta:**


    - La fluctuación de temperatura máxima permitida durante el funcionamiento (tanto
    en la caja del detector como en el conducto de aspiración) es de **20 °C** [F1].
    En caso de oscilaciones superiores, se requieren ajustes especiales [F4][F5].

    - En recintos con temperatura ambiente superior a **50 °C** o humedad superior
    al **80 % H rel.**, puede ser necesario instalar tramos de refrigeración en el
    conducto de aspiración [F4].

    - Para uso en **almacenes de ultracongelación**, el rango de temperatura restringido
    es **–30 °C hasta 0 °C** [F3].

    - La temperatura máxima de almacenamiento permitida en la caja del detector (sin
    condensación) es **–30 °C hasta +70 °C** [F1].


    > ⚠️ Nota: Los rangos indicados pueden ampliarse o reducirse previo acuerdo con
    el fabricante. La instalación en rango de condensación solo puede llevarse a cabo
    previa consulta con Securiton [F2].


    ---


    Fuente: ASD535_TD_T131192es_h (sin revisión registrada)


    ---

    ⚠️ **Información adicional del manual:**

    - "Es imprescindible garantizar el retorno de aire a la zona con riesgo de explosión
    (recinto vigilado)." [F4]

    - "* Los límites restringidos del sistema en relación con las longitudes máximas
    de tubería y el número máximo de orificios de aspiración.

    * El uso de puntos de aspiración con calefacción y su programación con el software
    de configuración «ASD Config».

    * El rango restringido de temperatura (–30 °C hasta 0 °C)" [F3]


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "* Los orificios de aspiración de ambas tuberías y de la caja del detector deben
    encontrarse en la misma zona climática (presión y temperatura) (posible retorno
    del aire aspirado a la otra zona climática)." (ASD535_TD_T131192es_h, p. 61) [F4]'
