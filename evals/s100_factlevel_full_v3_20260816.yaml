- qid: hp008
  question: ¿Qué detectores de humo analógicos son compatibles con la Notifier ID3000?
  answer: 'Los detectores de humo analógicos compatibles con la ID3000 son los siguientes:


    **Detectores de humo por dispersión de luz (ópticos):**

    - **SDX-551E** – Óptico [F2]

    - **SDX-751** – Óptico [F2]

    - **SDX-751EM** – Óptico [F1][F2]

    - **SDX-751TEM (OptiPlex)** – Combinado óptico/térmico [F1][F2]

    - **SDX-551THE** – Óptico [F2]

    - **HPX-751E (HARSH/FILTREX)** – Óptico para entornos agresivos [F1][F2]

    - **IDX-751 (HAZARD)** – Óptico intrínsecamente seguro [F1][F2]


    **Detectores de humo por ionización:**

    - **CPX-551E** – Iónico [F2]

    - **CPX-751E** – Iónico de bajo perfil [F1][F2]


    **Detectores de humo láser (VIEW™):**

    - **FSL-751E / LPX-751** – Humo láser VIEW™ [F1][F2]


    **Detectores multicriterio (humo + otros principios):**

    - **IRX-751TEM (SMART 3)** – Multicriterio [F2]

    - **IRX-751CTEM (SMART 4)** – Óptico/térmico/infrarrojo/CO [F2][F5]


    **Detectores por rayo:**

    - **LPB500** – Máximo 4 por lazo [F2]

    - **LBP-700 / LBP-700T** [F2]


    ---


    **Notas relevantes:**

    - Todos estos equipos utilizan el **protocolo de comunicaciones Notifier** [F1].

    - La central admite un **máximo de 512 sensores y pulsadores manuales por panel**,
    salvo que se utilicen ELIBs (según **EN54-2: 13.7**) [F4].

    - Para los sensores **IDX-751** se requiere el aislador galvánico de seguridad
    intrínseca **Y72221** [F2].


    ---


    Fuentes: MPDT190 (rev. sin revisión registrada); MIDT190 (rev. sin revisión registrada)'
