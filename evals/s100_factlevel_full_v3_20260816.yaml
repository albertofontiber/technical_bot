- qid: cat024
  question: ¿Cuál es el consumo en alarma de la sirena analógica de zócalo Detnov
    MAD-472?
  answer: 'El consumo en alarma de la **MAD-472** es **7 mA** [F5][F6][F7].


    Adicionalmente, el propio manual de la sirena especifica **17 mA a 80 dB A** [F1],
    que corresponde al consumo en alarma según las características técnicas del producto.


    > **Nota:** Existe una discrepancia entre los valores:

    > - El manual propio de la MAD-472 indica **17 mA (80 dB A)** [F1].

    > - Las tablas de dispositivos compatibles de la CAD-250 indican **7 mA** [F5][F6][F7].

    >

    > Para el cálculo de consumos del lazo en la CAD-250, utiliza el valor de **7
    mA** que figura en las tablas de compatibilidad de esa central. Para especificaciones
    propias del dispositivo, el manual de la sirena indica **17 mA**.


    **Resto de especificaciones eléctricas de la MAD-472:**

    - Consumo en reposo: **< 350 μA** [F1] / **0,35 mA** [F5]

    - Tensión de funcionamiento: **22-38 VDC** [F1]

    - Aislador incorporado: **No** [F5]

    - Direcciones de lazo: **1** [F5]


    ---


