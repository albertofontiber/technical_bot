- qid: hp018
  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  answer: '## Conexionado de sirena convencional en salidas de sirena de la ZXe


    Las sirenas convencionales se conectan a los terminales **A+ / A-** y **B+ / B-**
    de la placa base [F4], respetando las siguientes reglas:


    ---


    ### Requisitos previos


    - **Corriente máxima por circuito: 1 A** [F11]. No superar este límite sumando
    el consumo de todas las sirenas del circuito.

    - **Resistencia Final de Línea (RFL): 6,8 kΩ, 0,5 W mínimo**, instalada entre
    + y − de la última sirena del circuito [F11].

    - Si no se instala ninguna sirena en la salida, conectar la RFL directamente en
    los terminales de la central [F2].

    - **Sección mínima de cable recomendada: 1,5 mm²** [F2]. Verificar que la caída
    de tensión en la línea no impida la alimentación correcta de las sirenas (consultar
    tablas 10 y 11 del manual de instalación para tensiones mínimas) [F1].

    - **Longitud máxima recomendada: no superior a 1 km**, ya que por encima de esta
    longitud la capacitancia e inductancia del lazo pueden afectar al funcionamiento
    [F1].


    ---


    ### Sirenas con polaridad


    1. Conectar el terminal **+** de cada sirena al conductor positivo del circuito
    (SIRENA A+ o B+).

    2. Conectar el terminal **−** de cada sirena al conductor negativo (SIRENA A−
    o B−).

    3. Cada sirena debe llevar un **diodo integrado** para impedir el consumo en polarización
    inversa durante la supervisión [F4].

    4. Instalar la **RFL (6,8 kΩ)** entre + y − al final del último dispositivo de
    la línea [F11].


    ---


    ### Campanas/sirenas sin polaridad


    - Es obligatorio instalar un **diodo entre el terminal + del circuito y uno de
    los terminales de alimentación de la campana**, para evitar consumo durante la
    supervisión (corriente inversa) [F2].

    - En caso de conectar otros dispositivos no polarizados, usar **diodos de polarización
    y protección en cada uno** [F4].


    ---


    ### Advertencias críticas de cableado


    - **No realizar ramales (derivaciones paralelas)** en la línea de sirenas. La
    supervisión se realiza en la línea directa hasta la RFL; los ramales paralelos
    no quedan supervisados [F3].

    - **No enrollar el cable en los terminales**. Cortar y empalmar las conexiones
    adecuadamente para mantener la supervisión de la línea [F1].


    ---


    ### Terminales físicos en placa


    - **ZX2e**: terminales etiquetados **A+ A− B+ B−** en el bloque "SOUNDERS" [F4]
    — ver Figura 13 del manual de instalación.

    - **ZX5e**: terminales **A− A+ B− B+ C− C+ D− D+** en bloque **TB7** [F4] — ver
    Figura 14 del manual de instalación.


    > La ZX2e dispone de **2 salidas** (A y B) y la ZX5e dispone de **4 salidas**
    (A, B, C y D) [F5].


    ---


    ### Funcionamiento de la supervisión


    El circuito se polariza en **inverso en reposo** para supervisar la línea. Al
    dispararse la salida, la corriente circula en sentido normal y las sirenas suenan
    [F4]. Cualquier fallo (circuito abierto o cortocircuito) se mostrará en pantalla
    como avería [F5].


    ---


    **Fuentes:**

    - Manual de Instalación ZX2e/ZX5e — MIE-MI-530rv001 (sin revisión registrada)

    - Manual de Instalación ZXAE/ZXEE — MIE-MI-310 (sin revisión registrada)

    - Manual de Configuración ZX2e/ZX5e — MIE-MP-530rv001 (sin revisión registrada)


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "Todas las salidas de sirena quedan configuradas por defecto para sonar de forma
    contínua con cualquier alarma de cualquier zona, quedándo así en el patrón 1."
    (MIE-MP-310, p. 38) [F8]'
