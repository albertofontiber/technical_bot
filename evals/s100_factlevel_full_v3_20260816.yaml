- qid: hp007
  question: ¿Cómo se realiza el test anual de un detector VESDA-E VEP según el manual
    del fabricante?
  answer: '## Test anual del detector VESDA-E VEP-A10-P


    Según el calendario de mantenimiento del manual [F1], las tareas que corresponden
    a la frecuencia **anual** son las siguientes cuatro:


    - **Realizar una prueba de humos** para comprobar la integridad de la red de tubería
    [F1]

    - **Comprobar el flujo** de la red de tubería [F1]

    - **Limpiar los puntos de muestreo** [F1]

    - **Limpiar con agua la red de tubería** [F1]


    ---


    ### Consideraciones previas obligatorias antes de iniciar cualquier prueba


    Antes de comenzar el mantenimiento o las pruebas, el manual indica [F1]:


    1. Informar a la autoridad supervisora adecuada.

    2. Asegurarse de que se aíslen los dispositivos existentes que dependan del detector
    antes de ponerlo en funcionamiento.

    3. Cuando se realicen las pruebas de humo, seguir los procedimientos del sitio
    para evitar falsas alarmas para los servicios supervisados.


    > ⚠️ **Precaución:** Cuando el detector está deshabilitado o en espera, **no emitirá
    advertencias de fuego** [F1].


    ---


    ### Procedimiento para la prueba de humos anual


    El manual describe la prueba de humos de la siguiente forma [F2]:


    1. Introducir una muestra de humo en el **orificio de muestreo más alejado** de
    la red de tubería.

    2. Medir el **tiempo que tarda el humo en llegar al detector** (tiempo de transporte).

    3. Registrar los resultados y compararlos con pruebas anteriores para detectar
    variaciones del sistema.


    > El manual remite a la **VESDA-E Commissioning Guide** para los detalles completos
    del procedimiento de prueba de humos [F2].


    ---


    ### Modo en espera durante el mantenimiento de tubería y puntos de muestreo


    Cuando se realiza el mantenimiento de la red de tubería o los puntos de muestreo,
    el manual recomienda establecer el detector en **modo en espera** [F9]:


    - En **Xtralis VSC**: seleccionar *"Go to Standby"* en el menú *"Device"*.

    - El LED desactivado parpadeará y se desactivará el aspirador [F9].

    - Para volver a activar la unidad: seleccionar *"End Standby"* en el menú *"Device"*
    [F9].


    > ⚠️ En modo en espera se desactiva el aspirador y se detiene la detección de
    alarmas, aunque **sí continúa la detección y señalización de fallos** [F9].


    ---


    ### Notas adicionales del manual [F1]


    - La frecuencia de las comprobaciones puede variar en función de los **códigos
    y normas locales** y del **entorno de la instalación**.

    - El mantenimiento puede realizarlo el instalador original, un distribuidor autorizado
    o el contratista de servicio.


    ---


    **Fuente:** 33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores (sin revisión
    registrada)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "**Atención:** Pendant que le detecteur ou la zone est desactivee, aucun feu
    d''indication va etre emis par le detecteur." (33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores,
    p. 87) [F1]

    - "Se debe realizar una comprobación preliminar del sistema después de instalar
    el detector VEP-A10-P y antes de ponerlo en marcha." (33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores,
    p. 54) [F6]'
