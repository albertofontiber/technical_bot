- qid: hp014
  question: ¿Cómo se conecta un módulo de aislamiento de línea en un lazo ID2000?
  answer: "## Conexión del módulo de aislamiento de línea en lazo ID2000\n\nLos aisladores\
    \ en el lazo ID2000 se conectan a través de sus **terminales 1, 2, 3 y 4**, y\
    \ deben instalarse respetando los límites de equipos entre ellos. A continuación,\
    \ los puntos clave:\n\n---\n\n### Requisitos de instalación (norma EN54-2)\n\n\
    - Máximo **32 equipos de lazo entre aisladores** para cumplir EN54-2: 12.5.2 [F8]\n\
    - En la central ID2000, **no colocar más de 25 equipos entre aisladores** (o **20\
    \ si se usan aisladores tipo FET**) [F8][F3]\n\n---\n\n### Procedimiento de conexión\
    \ al lazo\n\n1. **Antes de las comprobaciones del lazo**, desconecta temporalmente\
    \ los aisladores cortocircuitando los **terminales 2 y 4** de cada aislador [F3]\n\
    \   > ⚠️ El cableado del lazo DEBE estar desconectado del panel durante este procedimiento\
    \ [F3]\n\n2. Realiza las comprobaciones de continuidad, resistencia y polaridad\
    \ del lazo con los aisladores desconectados (cortocircuitados) [F3][F8]\n   >\
    \ **Nota:** Las comprobaciones de continuidad en el lazo se deben realizar **antes**\
    \ de conectar los aisladores [F8]\n\n3. Una vez verificado el cableado, **retira\
    \ las conexiones temporales** (los puentes en terminales 2 y 4) de las unidades\
    \ aisladoras [F1]\n\n4. Conecta el cableado del lazo al panel comprobando que\
    \ la **polaridad es correcta**: los extremos marcados como **A y B** deben conectarse\
    \ en los terminales adecuados [F1]\n\n---\n\n### Comportamiento ante cortocircuito\n\
    \nCuando se produce un cortocircuito entre dos aisladores, el sistema lo señaliza\
    \ como **'Posible corte'** [F7]. Los equipos instalados entre los puntos de aislamiento\
    \ aparecerán como **NO RESPONDE/PERDIDO**, o como **PÉRDIDA PARCIAL DEL LAZO**\
    \ si faltan más de tres equipos [F7].\n\n---\n\n### Parámetros eléctricos del\
    \ lazo a verificar\n\n- Resistencia máxima del lazo: **no superar los 35 Ω** (medida\
    \ uniendo B+ y B- y midiendo en A+ y A-) [F11]\n- Capacidad del cable: **inferior\
    \ a 0,5 µF** [F11]\n- Longitud máxima del lazo: **2000 metros** con cable de **1,5\
    \ mm² de sección o superior** [F3][F11]\n\n---\n\n> ⚠️ **NO utilices nunca un\
    \ multímetro de alta tensión (tipo \"Megger\") en el lazo** [F8]\n\n---\n\n**Fuente:**\
    \ Panel ID2000 - Manual de instalación y puesta en marcha, MIDT180 (rev. MI-DT-180,\
    \ 2003-03-31)\n\n---\n⚠️ **Información adicional del manual:**\n- \"Es de vital\
    \ importancia que el cable utilizado sea de buena calidad y que se instale de\
    \ forma correcta.\" [F11]\n- \"Avería central 5 - Reinicio de alimentación\nAvería\
    \ de sistema 29 - Avería Checksum LIB ROM**\" [F7]"
