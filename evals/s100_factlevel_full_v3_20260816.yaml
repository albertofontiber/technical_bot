- qid: hp001
  question: En la Detnov CAD-250, ¿cómo se entra al menú de programación avanzada?
  answer: "Para acceder al menú de programación avanzada de la **CAD-250**, sigue\
    \ estos pasos:\n\n1. **Desbloquea la pantalla:** En la pantalla de reposo, toca\
    \ el icono del candado (\U0001F512) [F3][F4].\n\n2. **Introduce la clave de administrador:**\
    \ Introduce el código **2222** (clave por defecto de administrador) en el teclado\
    \ numérico y confirma con ✓ [F3][F4].\n\n3. **Navega al menú AVANZADO:** Una vez\
    \ en la pantalla de administrador, sigue la ruta:\n\n   **AJUSTES** (Menú principal)\
    \ **> AVANZADO** (Submenú) [F1]\n\nUna vez dentro, dispones de **3 pestañas**\
    \ de configuración [F1]:\n\n- **SISTEMA:** Configura número de cabinas (PANELES:\
    \ 1 a 4), número de lazos (2, 4, 6, 8... hasta 32 según cabinas) y cabina de LEDs\
    \ de zona (0 ó 1) [F1].\n- **OTROS:** Interruptores para facilitar puesta en marcha\
    \ y mantenimiento (tiempo de inactividad, salto a scroll si incidentes, saltar\
    \ a último incidente prioritario si timeout, entre otros) [F1][F7].\n- **REINICIAR:**\
    \ Devuelve la configuración completa de la central a valores de fábrica [F6].\n\
    \n> ⚠️ **AVISO:** El uso indebido del nivel de administrador puede provocar un\
    \ mal funcionamiento de la instalación. Asegúrate de tener la autorización necesaria\
    \ antes de operar en este nivel [F3][F4].\n\n> ⚠️ **AVISO:** Por razones de seguridad\
    \ y cumplimiento normativo, los interruptores de inactividad, timeout y scroll\
    \ deben estar activados (en verde) por defecto [F6][F7].\n\n---\n\n**Fuentes:**\n\
    - CAD-250 Manual de Configuración MC-380-es-2026-c (rev. c, 2026-04-23)\n- Manual\
    \ de Instalación CAD-250 MI-372-es-2024-e (sin revisión registrada)\n- CAD-250\
    \ Manual de Software de Configuración MS-416-es-2026-b (rev. b)"
