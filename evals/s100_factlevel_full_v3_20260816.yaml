- qid: hp012
  question: ¿Cuántos lazos direccionables soporta la Notifier AM2020/AFP1010 y cuántos
    dispositivos por lazo?
  answer: "## Capacidad de lazos y dispositivos — AM2020 / AFP1010\n\n### AM2020\n\
    \n- **Lazos SLC máximos: 10** [F4] [F6]\n- Conseguidos con: hasta **10 módulos\
    \ LIB-200/LIB-200A** (un lazo cada uno) o hasta **5 módulos LIB-400** (dos lazos\
    \ cada uno), o combinación de ambos [F4] [F6]\n- **Dispositivos totales en el\
    \ sistema: 1.980** [F1] [F6]\n  - Detectores inteligentes (iónicos, fotoeléctricos,\
    \ térmicos): **990** [F6]\n  - Estaciones manuales direccionables + módulos de\
    \ monitoreo + módulos de control + circuitos Transponder XP: **990** [F6]\n\n\
    ### AFP1010\n\nAquí hay una discrepancia entre fragmentos — te la indico explícitamente:\n\
    \n- **Fragmento F4 y F6** indican: máximo **4 lazos SLC** (hasta 4 módulos LIB-200/LIB-200A\
    \ o hasta 2 módulos LIB-400), con **792 dispositivos totales** [F4] [F6]\n- **Fragmento\
    \ F3** (manual MPDT280) indica: *\"limitado a un máximo de dos LIB-200 (un total\
    \ de 396 dispositivos en el sistema)\"* [F3]\n\n> ⚠️ **Atención:** Los datos de\
    \ F3 (396 dispositivos, solo LIB-200) y los de F4/F6 (792 dispositivos, hasta\
    \ 4 LIB-200/LIB-200A o 2 LIB-400) son contradictorios. F3 proviene del manual\
    \ MPDT280 y puede referirse a una configuración específica o versión distinta.\
    \ Para la instalación, verifica con el manual físico de tu versión de AFP1010.\n\
    \n### Por lazo SLC (ambos modelos)\n\n- Hasta **99 direcciones de detectores**\
    \ por lazo [F2] [F4]\n- Hasta **99 direcciones de módulos** (monitoreo + control)\
    \ por lazo [F2] [F4]\n- Resistencia máxima de lazo:\n  - **40 Ω** con LIB-200\
    \ [F2]\n  - **50 Ω** con LIB-200A o LIB-400 [F2]\n- Longitud máxima de lazo:\n\
    \  - **10.000 pies (3.048 m)** con LIB-200 [F2]\n  - **12.500 pies (3.810 m)**\
    \ con LIB-200A o LIB-400 [F2]\n\n---\n\nFuentes: Manual AM2020/AFP1010 PN 15088SP\
    \ (sin revisión registrada); Manual MPDT280 (Rev. A); Manual BTDT032 (sin revisión\
    \ registrada)\n\n---\n\U0001F4CB **Obligaciones de evidencia del manual:**\n-\
    \ Nota: la fuente es inconsistente: \"La figura 13 representa un gabinete CAB-A3\
    \ utilizado con los módulos del LIB-400 exclusivamente, lo que significa que puede\
    \ dar alojo a un máximo de cuatro lazos del sistema AFP1010.\" (15088SP, p. 30)\
    \ [F9] declara 4 lazos y la enumeración servida lista 2 (15088SP, p. 30) [F9].\n\
    - \"Sin embargo, para hacer uso de estas funciones, la opción de Silenciado de\
    \ Señal (para los módulos de control silenceable) y la opción de Verificación\
    \ de Alarma (para los detectores direccionables) tienen que todavía estar habilitadas/inhabilitadas\
    \ individualmente para cada dispositivo del Lazo SLC bajo la Programación Parcial\
    \ o Total.\" (15088SP, p. 153) [F11]"
