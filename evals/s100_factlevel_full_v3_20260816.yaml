- qid: hp015
  question: En la Detnov CCD-103, ¿cómo se desactiva un detector individualmente sin
    afectar al resto del lazo?
  answer: 'La **CCD-103 no permite desactivar un detector individual**: la unidad
    mínima de desconexión es la **zona completa** [F1].


    Lo que sí puedes hacer es desconectar la zona que contiene ese detector:


    1. Asegúrate de que la **llave de bloqueo de teclado (G)** está en posición **abierta**
    (desbloqueada) [F2].

    2. Pulsa **una vez** la tecla de zona correspondiente → la zona entra en **modo
    prueba** [F2].

    3. Pulsa **una segunda vez** la tecla de zona → la zona pasa a **modo desconexión**
    [F1][F2].


    **Indicaciones visuales que confirman la desconexión** [F1][F5]:

    - **Indicador de Anular (4):** encendido fijo continuo.

    - **Indicador amarillo de la zona (6):** encendido fijo continuo.


    **Para volver a conectar la zona** [F1]:

    - Pulsa **una vez** la tecla de zona desconectada → zona conectada de nuevo.


    ---


    ⚠️ **Advertencia importante:** Cuando una zona está desconectada, la central **no
    refleja ninguna incidencia ni evento** de esa zona [F1]. Recuerda que la CCD-103
    tiene 3 zonas, y la Zona 1 y Zona 2 actúan como **zonas cruzadas** para el proceso
    automático de extinción [F4]. Desconectar cualquiera de ellas inhabilita esa lógica
    de disparo automático.


    ---


    Fuente: CCD-103_Manual_ES_FR_GB_IT (sin revisión registrada)'
