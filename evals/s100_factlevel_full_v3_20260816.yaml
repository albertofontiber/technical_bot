- qid: hp010
  question: En la Morley DXc, ¿cómo se añade un nuevo detector al lazo tras la puesta
    en marcha inicial?
  answer: '# Añadir un nuevo detector al lazo en la DXc tras la puesta en marcha


    El procedimiento principal es ejecutar una **Autobúsqueda de equipos** desde el
    menú de Lazo. A continuación, el proceso completo:


    ---


    ## Requisitos previos


    - Acceder al **Nivel de acceso 3** [F2].

    - El puente **J5** sobre el conector de PC debe estar puesto para desbloquear
    la memoria [F2].


    ---


    ## Pasos


    **1. Acceder al menú de programación:**


    - Desde el menú de Nivel 2, pulsa la opción **''7: Programacion/Niv3''** [F2].

    - Introduce la **clave de acceso de Nivel 3** y pulsa **⊙** [F2].

    - Cuando aparezca el mensaje *"Memoria Bloqueada / Presione OK para desbloquear"*,
    pulsa **⊙** de nuevo [F2].

    - En pantalla aparecerá el menú de programación [F2]:


    ```

    [Programar]

    1:Op. Generales       2:Lazo

    3:Entradas Placa      4:Salidas Placa

    ...

    ```


    **2. Acceder al menú de Lazo:**


    - Pulsa la tecla **''2''** para entrar en el menú de **Lazo** [F1].


    **3. Ejecutar la Autobúsqueda:**


    - Pulsa la tecla **''2''** para seleccionar la función **''Autobusqueda''** [F1].

    - Si la central tiene más de un lazo, introduce el **número de lazo** correspondiente
    y pulsa **⊙** [F1].

    - Confirma la autobúsqueda pulsando **⊙** cuando aparezca la pantalla de confirmación
    [F1].

    - La central iniciará el reconocimiento del lazo [F1]:


    ```

    [Autobusqueda]

    Lazo: 1  Reconocimiento en progreso...

    ```


    **4. Revisar el resultado:**


    - Al finalizar, la pantalla mostrará un resumen con el **total de equipos encontrados**,
    y los campos **Nuevos**, **Elimin.** y **Cambiad.** [F1].

    - Comprueba que el número de equipos y tipos mostrados corresponden con los equipos
    físicamente instalados [F1].

    - El resumen muestra subtotales por tipo: ION, OPT, TMP, MLT, PUL, MON, SIR, REL,
    OTROS [F1].


    > ⚠️ **Nota importante:** En mercados donde el protocolo es seleccionable, si
    se ha realizado un cambio de protocolo previo, **espera dos minutos** antes de
    ejecutar la autobúsqueda [F1].


    **5. Salir:**


    - Pulsa **⊞** para abandonar la pantalla de resultados y regresar al menú de Lazo
    [F1].


    ---


    ## Referencia de abreviaturas de tipos de equipos


    - **OPT**: Detector óptico [F6]

    - **ION**: Detector de humo iónico [F6]

    - **TMP / TER**: Detector térmico [F6]

    - **MLT**: Detector multicriterio [F6]

    - **PUL**: Pulsador / Módulo monitor [F6]


    ---


    Fuente: DXc_Manual de configuracion (sin revisión registrada); DXc-Tipos-Abreviaturas-de-equipos
    (sin revisión registrada)


    ---

    📋 **Obligaciones de evidencia del manual:**

    - Nota: la fuente es inconsistente: "PUL: 4 MON: 0 SIR: 2 REL: 1 OTROS : 2" (DXc_Manual
    de configuracion, p. 48) [F1] declara 1 OTROS y la enumeración servida lista 5
    (DXc_Manual de configuracion, p. 48) [F1].'
