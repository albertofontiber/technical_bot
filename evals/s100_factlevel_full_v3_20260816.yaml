- qid: cat022
  question: En los detectores de llama Spectrex SharpEye 40/40, ¿qué diferencia hay
    entre el modelo 40/40L y el 40/40L4, y qué significa el sufijo «B» (p. ej. 40/40LB)?
  answer: '## Diferencias entre 40/40L, 40/40L4 y sufijo «B»


    ### 40/40L vs 40/40L4 — Longitud de onda IR


    La diferencia clave está en la longitud de onda del sensor IR [F11]:


    - **S40/40L**: sensor IR que funciona a una longitud de onda entre **2,5 y 3,0
    µm**. Detecta combustibles a base de hidrocarburos y fuegos de gas, fuegos de
    hidróxido e hidrógeno, y fuegos de metales o materia inorgánica [F11].

    - **S40/40L4**: funciona a una longitud de onda de **4,5 µm** y **solo es adecuado
    para la detección de fuegos de hidrocarburos** [F11].


    Ambos modelos comparten la misma base UV/IR; la diferencia es exclusivamente la
    longitud de onda del canal IR y, por tanto, el tipo de fuego que pueden detectar
    [F11].


    ---


    ### Sufijo «B» — Prueba incorporada (BIT)


    El sufijo **«B»** indica que el modelo incluye la función de **Prueba Incorporada
    (BIT)** [F11]:


    - **S40/40L** → **sin BIT**

    - **S40/40LB** → **con BIT**

    - **S40/40L4** → **sin BIT**

    - **S40/40L4B** → **con BIT**


    La BIT permite realizar pruebas automáticas y manuales del funcionamiento del
    detector [F11].


    ---


    ### Diferencia de sensibilidad entre modelos (dato adicional)


    El software WinHost muestra ajustes de sensibilidad distintos según el modelo
    [F2]:


    - **40/40L y 40/40LB**: ajuste de sensibilidad disponible en **15** (equivalente
    a **50 ft / 15 m**) [F2].

    - **40/40L4 y 40/40L4B**: ajuste de sensibilidad disponible en **28** (equivalente
    a **93 ft / 28 m**) [F2].


    ---


    **Fuente:** MNDT722_40-40L (sin revisión registrada); manual-sharpeye-40-40-series-winhost-spectrex-en-us-4845694
    (sin revisión registrada)'
