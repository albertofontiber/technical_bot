- qid: cat018
  question: ¿Como se programa una ecuacion causa-efecto (CBE) en la Notifier AM-8200
    para que un evento active una salida?
  answer: "# Programación de ecuación CBE en AM-8200 para activar una salida\n\nLa\
    \ CBE se programa en la **Pestaña Programación** del punto de salida (módulo de\
    \ salida), en el campo **CBE**. A continuación el procedimiento completo:\n\n\
    ---\n\n## Pasos para programar la CBE en un módulo de salida\n\n1. **Accede al\
    \ menú del módulo de salida:**\n   Navega a `MENU PROGRAMMAZIONE \\ Punti \\ Módulos`\
    \ y localiza el módulo de salida que quieres programar [F3].\n\n2. **Ve a la Pestaña\
    \ Programación:**\n   Selecciona la pestaña **Programmazione** con las teclas\
    \ de navegación [F1].\n\n3. **Selecciona el campo CBE:**\n   Usa las teclas flecha\
    \ **▲▼** para posicionarte sobre el campo **CBE** y pulsa la tecla de confirmación\
    \ **☑** para entrar en edición [F1].\n\n4. **Introduce la ecuación:**\n   Usa\
    \ el teclado alfanumérico para escribir la ecuación. Pulsa **Enter** para confirmar\
    \ [F1].\n   - La longitud máxima de una CBE es de **64 caracteres** [F1].\n\n\
    ---\n\n## Operadores disponibles y ejemplos prácticos\n\n### OR — Al menos un\
    \ evento activo [F7]\nActiva la salida si **cualquiera** de los operandos está\
    \ en alarma.\n- Sintaxis: `OR (G9 G15 G23)` — también válido omitir OR: `(G9 G15\
    \ G23)`\n- Ejemplo: si el grupo G9 **o** G15 **o** G23 está en alarma → salida\
    \ activa.\n\n### AND — Todos los eventos activos [F7]\nActiva la salida solo si\
    \ **todos** los operandos están en alarma simultáneamente.\n- Sintaxis: `AND (G9\
    \ G15 G23)`\n- Ejemplo: G9 **y** G15 **y** G23 en alarma → salida activa.\n\n\
    ### NOT — Negación [F7]\nLa salida permanece activa hasta que el operando entre\
    \ en alarma.\n- Sintaxis: `NOT (G23)`\n- Ejemplo: si G23 entra en alarma → salida\
    \ se desactiva.\n\n### XGRP — Doble coincidencia [F8]\nActiva la salida cuando\
    \ **al menos dos** elementos del grupo indicado están activos.\n- Sintaxis: `XGRP\
    \ (G23)`\n- **Importante:** solo se permite un grupo. `XGRP (G23 G24)` **no está\
    \ permitido** [F8].\n\n### PRE — Estado de pre-alarma de un sensor [F9]\nActiva\
    \ la salida cuando un sensor específico está en pre-alarma.\n- Sintaxis: `OR (PRE(C1L1S2)\
    \ PRE(C2L1S10))`\n- Formato del operando: `CxxLxxSxxx` (Central / Lazo / Sensor)\
    \ [F9].\n\n### FLT — Estado de avería [F10]\nActiva la salida cuando un dispositivo\
    \ o zona está en avería.\n- Sintaxis ejemplo 1: `OR (FLT(C1L1S2) PRE(C2L1S10))`\n\
    - Sintaxis ejemplo 2: `OR (FLT(Z1) FLT(Z2))` — también admite zonas [F10].\n\n\
    ---\n\n## Restricciones importantes\n\n- **Para módulos de salida:** la central\
    \ **no permite** programar una ecuación CBE si el módulo tiene un **TIPO ID para\
    \ señalizaciones de carácter general** [F7].\n- **Para grupos directos:** no se\
    \ permite que los operandos dentro del paréntesis sean grupos con índice **menor**\
    \ que el grupo al que se asocia la CBE [F7].\n  - ❌ No permitido: `G33 = (G23\
    \ G24)`\n  - ✅ Permitido: `G21 = (G23 G24)`\n- **Para grupos inversos:** no se\
    \ permite que los operandos sean grupos con índice **mayor** que el grupo al que\
    \ se asocia la CBE [F7].\n  - ❌ No permitido: `G305 = (G306 G307)`\n  - ✅ Permitido:\
    \ `G307 = (G305 G306)`\n\n---\n\n> **Nota:** Para la sintaxis completa y todos\
    \ los operadores disponibles, consulta el **Apéndice «A» Control By Event** al\
    \ final del manual [F1].\n\n---\n\n**Fuente:** AM-8200 Manual de programación\
    \ — Doc. M-162.1-AM8200-ESP Rev A.3 (Honeywell Life Safety Iberia)\n\n---\n⚠️\
    \ **Información adicional del manual:**\n- \"Si, por el contrario, el dispositivo\
    \ en cuestión es un módulo de salida, esta salida no se activará nunca, a no ser\
    \ que se programe con software TIPO ID para señalizaciones generales.\" [F7]\n\
    - Nota: el manual también indica: \"Si **CUALQUIERA** de los tres operandos de\
    \ esta ecuación (G9 G15 G23) está en alarma, el módulo de salida se activará,\
    \ es decir:\" [F7] · \"- **SI** el grupo software 9 está en alarma, o\n- **SI**\
    \ el grupo software 15 está en alarma, o\n- **SI** el grupo software 23 está en\
    \ alarma\n- **ENTONCES** este módulo de salida se activará.\" [F7]\n- \"**Zona**\
    \ - número de zona asignada\n\n**CBE** - ecuación CBE del punto.\" [F1]"
