- qid: cat021
  question: Necesito un detector de llama SharpEye «40/40» (Spectrex / Notifier) para
    una instalación; ¿qué modelo pido?
  answer: 'La familia SharpEye «40/40» tiene **varias variantes con tecnología de
    detección distinta** y no son intercambiables entre sí. Necesito que me indiques
    el tipo de riesgo/combustible para recomendarte el modelo correcto.


    Aquí tienes las variantes disponibles según la documentación:


    - **S40/40I** — Detector de llama de **triple espectro infrarrojo (IR3)** [F1]

    - **S40/40R** — Detector de llama de **infrarrojo simple (Single IR)** [F2][F6]

    - **S40/40M** — Detector de llama de **múltiple infrarrojo**, para llamas de **hidrógeno
    e hidrocarburo** [F3]

    - **S40/40L / LB / L4 / L4B** — Detector de llama **UV/IR** [F4]

    - **S40/40U / UB** — Detector de llama **UV** [F5]


    Adicionalmente, el documento de referencia de la serie menciona dos variantes
    ultrarrápidas [F7]:

    - **40/40UFI** — Ultra Fast IR3

    - **40/40UFL** — Ultra Fast UV/IR


    ---


    Para ayudarte a elegir, dime:

    - **¿Qué combustible o tipo de llama necesitas detectar?** (hidrocarburos, hidrógeno,
    ambos, etc.)

    - **¿El entorno requiere detección UV, IR o combinada?**

    - **¿Hay requisitos de velocidad de respuesta especiales?**


    Con eso te indico el modelo exacto y el código de pedido (carcasa, entrada de
    cable, homologación ATEX/FM, etc.).


    ---


    Fuentes: MNDT721_40-40I; MNDT724_40-40R; MNDT725_40-40M; MNDT722_40-40L; MNDT723_40-40U;
    guide-40-40r-single-ir-flame-detector-spectrex-en-us-1459812; manual-sharpeye-40-40-series-winhost-spectrex-en-us-4845694
    (todos sin revisión registrada en metadatos)'
