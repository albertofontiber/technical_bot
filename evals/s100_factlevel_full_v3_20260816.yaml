- qid: cat019
  question: '¿Como se configura una maniobra (causa-efecto) completa en la Detnov
    CAD-250: como se crea, como se definen las entradas/eventos que la disparan y
    como se asignan las salidas?'
  answer: '# Configuración de maniobras (causa-efecto) en la CAD-250


    La estructura de una maniobra en la CAD-250 sigue el esquema **Entradas (Eventos)
    → Lógica (Coincidencias) → Salidas (Acciones)** [F1].


    > ⚠️ La programación de maniobras es una de las funciones más críticas de la configuración
    del sistema. Requiere conocimiento específico del sistema instalado, del plan
    de protección y del producto [F5].


    ---


    ## PASO 1 — Acceder al menú y crear la maniobra


    Ruta de acceso [F1]:


    **MENÚ** → **MANIOBRAS** → **+AÑADIR** (barra de navegación inferior)


    Esto abre la pantalla de edición de la maniobra. El contador muestra el número
    de maniobra en curso [F3].


    ---


    ## PASO 2 — Definir las ENTRADAS (Eventos)


    **2.1.** Pulsa **AÑADIR** en el margen inferior. La pantalla emergente ofrece
    dos opciones [F2]:

    - **EVENTO** → define una entrada

    - **ACCIÓN** → define una salida


    Selecciona **EVENTO**.


    **2.2.** A continuación se elige el tipo de evento [F2]:

    - **ENTIDAD**: cualquier elemento de la jerarquía del sistema (instalación, panel,
    lazo, área, zona, dispositivo, grupo o módulo virtual), tanto del sistema local
    como de la red

    - **CONDICIÓN TEMPORAL**: establece un periodo de tiempo para el que la ecuación
    de entrada sea verdadera


    **2.3.** Si seleccionas **ENTIDAD**, accedes a la pantalla **EVENTO DE LA ENTIDAD**
    donde configuras [F5] [F9]:


    - **Origen:** Local o Red

    - **Entidad:** Instalación, Panel, Lazo, Área, Zona, Dispositivo, Grupo o Módulo
    Virtual

    - **Condición:** Alarma, Avería, Técnico

    - **Tipo:** Todos, Pulsador, Detector o Entradas

    - **Estado lógico:** Normal o Negado (si se selecciona Negado con condición Alarma,
    la condición será válida si **no** hay alarma)

    - **Repeticiones:** Valor entero hasta **9999** — el evento debe repetirse ese
    número de veces en la entidad para que la entrada sea válida [F2] [F5]


    > ⚠️ La configuración de maniobras gestiona **eventos** (cambios de estado), no
    estados. El evento, si coincide con la condición establecida, provocará la activación
    de las salidas [F2].


    Puedes añadir tantos eventos como necesites. El número máximo de maniobras entre
    eventos y acciones es de **100.000** [F2].


    Para editar un evento ya creado: doble clic sobre él en el menú de **CREACIÓN
    DE MANIOBRA**, o selecciónalo y pulsa **EDITAR** [F12].


    ---


    ## PASO 3 — Configurar la LÓGICA (Coincidencias)


    En el campo **Coincidencias** se indica cuántos eventos deben cumplirse simultáneamente
    para que la maniobra sea verdadera [F3] [F6]:


    - **Coincidencias = 1** con 2 eventos → comportamiento **OR**: basta con que se
    cumpla cualquiera de los eventos [F3] [F6]

    - **Coincidencias = 2** con 2 eventos → comportamiento **AND**: deben cumplirse
    los dos eventos [F3] [F6]

    - **Coincidencias = 3** con 4 eventos → deben cumplirse 3 de los n eventos, cualesquiera
    de ellos [F3]


    ---


    ## PASO 4 — Definir las SALIDAS (Acciones)


    **4.1.** Pulsa de nuevo **AÑADIR** y selecciona **ACCIÓN** [F4].


    **4.2.** Se presentan los campos [F4]:


    - **Retraso:** tiempo configurable entre **0 y 600 segundos** antes de iniciar
    la acción. Se inicia a partir del momento en que la condición de entrada es verdadera
    [F4] [F5]

    - **Entidad:** Panel, Lazo, Área, Zona, Dispositivo, Grupo o Módulo Virtual (siempre
    relativa al sistema local) [F4]


    **4.3.** En la pantalla **ACCIÓN DE LA ENTIDAD** se configuran [F7]:


    **Acción** (qué hace):

    - **Activar** las salidas

    - **Desactivar** las salidas

    - **Habilitar** la entidad

    - **Deshabilitar** la entidad

    - **Test** — pone en modo test la entidad

    - **Reiniciar** la entidad

    - **Pulso** — activa las salidas con anchura de pulso configurable entre **0 y
    600 segundos** (**10 segundos** por defecto)

    - **Configuración** — permite la cancelación de retardos


    **Tipo de elemento** (a qué afecta dentro de la entidad):

    - **Todos** — todas las salidas de la entidad

    - **Sirenas**

    - **Relés**

    - **Sirena discontinua**

    - **Sirena PCB1** — sirena 1 de la central

    - **Sirena PCB2** — sirena 2 de la central


    > Las opciones disponibles dependen de la entidad seleccionada [F7]. La combinación
    Acción × Tipo × Entidad válida se recoge en la tabla de la sección correspondiente
    del manual [F8].


    **4.4.** Pulsa **GUARDAR** para actualizar la base de datos, o **CANCELAR** para
    deshacer los cambios [F7].


    ---


    ## PASO 5 — Verificar la maniobra


    Desde el icono **MANIOBRAS** en el **MENÚ PRINCIPAL** puedes ver el listado de
    maniobras con su ID, número de coincidencias, resumen de eventos y resumen de
    acciones [F7] [F10].


    ---


    ## Elementos adicionales del módulo de maniobras


    Desde el submenú **MANIOBRAS** también están disponibles [F1]:

    - **Grupos:** asociaciones de elementos (áreas, zonas, dispositivos) para facilitar
    la creación de reglas

    - **Módulos virtuales:** permiten crear bucles interdependientes; un conjunto
    de entradas determina el estado del módulo virtual, que a su vez puede actuar
    como entrada de otra maniobra

    - **Estado VM:** visualización y activación de módulos virtuales, o uso como botones
    de acceso rápido desde la pantalla principal


    ---


    Fuentes:

    - CAD-250 Manual de Configuración MC-380-es-2026-c (rev. c, 2026-04-23)

    - Manual de Instalación CAD-250 MI-372-es-2024-e (sin revisión registrada)

    - CAD-250 Manual Software Configuración MS-416-es-2026-b (rev. b)


    ---

    📖 **Información adicional del manual:**

