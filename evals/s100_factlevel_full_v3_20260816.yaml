- qid: cat013
  question: Tengo una central Detnov CAD-150 y me ha sobrado de otra instalacion un
    detector optico Notifier SDX-751; ¿es compatible / puedo montarlo en su lazo?
  answer: 'La respuesta corta es: **no puedo confirmarte compatibilidad**, y el propio
    manual del SDX-751EM lo advierte explícitamente.


    ---


    ## Por qué no es posible afirmar compatibilidad


    El manual del **SDX-751EM** indica literalmente que estos detectores:


    > *"must only be connected to control panels that use a compatible proprietary
    analogue addressable communication protocol for monitoring and control"* [F2]


    En español, el mismo documento lo repite:


    > *"sólo deben conectarse a cuadros de control que empleen un protocolo propio
    de comunicaciones que sea compatible y direccionable analógicamente"* [F1]


    Es decir, el detector SDX-751EM **requiere que la central hable el mismo protocolo
    propietario** que él. Los fragmentos disponibles **no especifican qué protocolo
    usa el SDX-751EM** ni qué protocolos admite la **CAD-150** de Detnov, por lo que
    no tengo base documental para afirmar compatibilidad entre ambos.


    ---


    ## Lo que sí consta en los fragmentos sobre el SDX-751


    El SDX-751 (sin sufijo EM) aparece listado como detector compatible en manuales
    de centrales **Notifier**:


    - Compatible con la central **ID-200** de Notifier, usando base **B501** [F6]

    - Compatible con la central **AFP-200** de Notifier, usando base **BX-501** [F7]


    Esto confirma que el SDX-751 es un detector del ecosistema **Notifier**, diseñado
    para centrales Notifier con su protocolo propietario.


    ---


    ## Recomendación


    Para saber si la CAD-150 de Detnov admite detectores Notifier SDX-751/SDX-751EM,
    debes consultar directamente:


    1. **El manual de instalación de la CAD-150** (sección de dispositivos compatibles
    de lazo) — los fragmentos disponibles de la CAD-150 solo cubren introducción e
    índice [F8][F10], sin lista de dispositivos compatibles.

    2. **El soporte técnico de Detnov**, que puede confirmar si su protocolo de lazo
    es compatible con el protocolo del SDX-751EM.


    ⚠️ **No instales el detector en el lazo sin esta confirmación.** Un detector con
    protocolo incompatible puede no ser supervisado correctamente por la central,
    comprometiendo la seguridad de la instalación.


    ---


    Fuentes:

    - Manual SDX-751EM: I56-1306-002_SDX-751EM (sin revisión registrada)

    - Manual CAD-150-8: 55315008-Manual-Centrales-Analogicas-CAD-150-8-Usuario-ES-FR-GB-IT
    (sin revisión registrada)

    - Manual ID-200: MNDT150 (sin revisión registrada)

    - Manual AFP-200: MNDT120 (sin revisión registrada)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "No se pretende que ofrezcan protección total contra todo tipo de contaminación,
    por lo que antes de iniciarse cualquier construcción, decoración u otra actividad
    causante de polvo, los detectores deben ser retirados." (I56-1306-002_SDX-751EM,
    p. 3) [F9]'
