- qid: cat012
  question: ¿Cómo se calcula la capacidad de batería (en Ah) necesaria para la central
    AM-8200?
  answer: '## Cálculo de capacidad de batería para la AM-8200


    La fórmula de cálculo es: **Ah Batería = (A + B) × 1,2** [F4][F5], donde:


    - **A** = Amperios-hora en condiciones de reposo (espera)

    - **B** = Amperios-hora en condiciones de alarma

    - **1,2** = Factor de corrección por tolerancias de fabricación de las baterías
    [F6]


    ---


    ### Paso 1 — Calcular la corriente total en reposo (columna A)


    Suma los consumos en condiciones de **NO ALARMA** de todos los componentes instalados
    [F4]:


    **Para la AM-8200 (con CPU AM-8200-KLCD):**

    - AM-8200 CPU (AM8200-KLCD): **179 mA**

    - LIB-8200 (por cada tarjeta instalada): **50 mA**

    - AM82-2S2C (si instalada): **28 mA**

    - AM82-BST-C (si instalada): **39 mA**

    - Corriente de los lazos: ver Tabla 3 del manual [F4][F6]

    - Corriente salida usuario (máx. 2 A): según dispositivos conectados [F4]

    - Dispositivos de sirena, campanas, flashes: consumo en reposo = **0** [F4]


    > Suma todos los valores → **Total corriente reposo (mA)**


    ---


    ### Paso 2 — Multiplicar por el tiempo de reposo requerido


    Multiplica el total de corriente en reposo por la duración exigida [F4]:


    - **(Total reposo en A) × 24 h** → para autonomía de 24 horas

    - **(Total reposo en A) × 72 h** → para autonomía de 72 horas


    → Resultado = **Espera (A) en Ah**


    ---


    ### Paso 3 — Calcular la corriente total en alarma (columna B)


    Suma los consumos en condiciones de **ALARMA** de todos los componentes [F4]:


    **Para la AM-8200 (con CPU AM-8200-KLCD):**

    - AM-8200 CPU (AM8200-KLCD): **345 mA**

    - LIB-8200 (por cada tarjeta): **92 mA**

    - AM82-2S2C (si instalada): **28 mA**

    - AM82-BST-C (si instalada): **39 mA**

    - Corriente de los lazos en alarma: la central enciende **solo los primeros 6
    LED** de detectores y módulos en alarma; corriente total de todos los lazos debe
    ser **inferior a 750 mA** [F6]

    - Corriente salida usuario: **inferior a 2 A** [F6]


    > Suma todos los valores → **Total corriente alarma (mA)**


    ---


    ### Paso 4 — Multiplicar por el tiempo de alarma


    Multiplica el total de corriente en alarma por **0,5 h** [F4]:


    - **(Total alarma en A) × 0,5 h** → **Alarma (B) en Ah**


    ---


    ### Paso 5 — Aplicar la fórmula final


    **Ah Batería = (A + B) × 1,2** [F4][F6]


    ---


    ### Restricciones del sistema a tener en cuenta


    - Capacidad de baterías admitida: **2 × 12 V, mínimo 7 Ah, máximo 18 Ah** [F1]

    - Si la corriente calculada supera **3,5 A**, la corriente en exceso durante alarma
    se extrae de las baterías [F6]

    - La corriente total en reposo o alarma no puede superar en ningún caso la capacidad
    de la fuente de alimentación [F6]


    ---


    ### Nota sobre la variante AM-8200BB


    Si tu central es la **AM-8200BB**, los consumos de la CPU son distintos (reposo:
    **135 mA**, alarma: **177 mA**) y debes usar la **Tabla 2** del manual [F5]. El
    procedimiento de cálculo es idéntico.


    ---


    > ⚠️ El manual indica expresamente: **"Ver el apéndice al final del presente manual
    para el cálculo de las baterías en reposo y en alarma"** [F2]. Consulta ese apéndice
    para el formulario completo con todas las filas de dispositivos de tu instalación
    concreta.


    **Fuente:** AM-8200 Manual de Instalación (Doc. AM-8200-ESP Rev. A.3)


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "Calcular la corriente total necesaria para todos los lazos usando **la tabla
    2 (ver a continuación)** teniendo presente que la central enciende **solo los
    primeros 6 LED** de los detectores y módulos de entrada en alarma." (AM-8200 Manual
    Instalacion, p. 53) [F6]'
