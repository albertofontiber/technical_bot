- qid: cat011
  question: Necesito un detector de humos analógico direccionable «751» para una instalación
    Notifier; ¿cuál es el modelo correcto?
  answer: 'El modelo correcto para un detector de humo óptico analógico direccionable
    con sufijo «751» en instalaciones Notifier depende de la variante que necesites.
    Los fragmentos muestran varios modelos con ese sufijo:


    ---


    **Modelos ópticos analógicos direccionables «751» disponibles en Notifier:**


    - **SDX-751** — Sensor óptico analógico de bajo perfil (versión de bajo perfil
    del SDX-551) [F6]

    - **SDX-751TEM** — Sensor combinado óptico-térmico analógico direccionable (OPTIPLEX).
    Incorpora detección fotoeléctrica + temperatura fija a **58 °C** [F2][F7]

    - **SDX-751XXXX** — Sensor óptico de bajo perfil (listado en equipos de lazo compatibles
    con ID50/60) [F7]

    - **HPX-751E** — Sensor óptico HARSH (entornos hostiles) [F7]

    - **FSL-751E** — Sensor de humo láser VIEW [F7]

    - **IDX-751** — Sensor óptico analógico **intrínsecamente seguro** (para zonas
    ATEX; requiere barrera y traductor IMX-1) [F4]

    - **CPX-751E** — Sensor por **ionización** analógico direccionable (no óptico)
    [F5][F7]


    ---


    **Para una instalación estándar (zona no ATEX, solo humo óptico):**


    El modelo más habitual es el **SDX-751TEM** si necesitas detección combinada óptico-térmica
    [F2], o el **SDX-751** si solo necesitas detección óptica pura [F6].


    ---


    **Para concretar el modelo correcto, necesito saber:**


    1. ¿Es una zona con riesgo de atmósfera explosiva (ATEX)? → Si sí: **IDX-751**
    [F4]

    2. ¿Necesitas solo humo óptico o también detección térmica? → Solo óptico: **SDX-751**
    / Combinado: **SDX-751TEM** [F2][F6]

    3. ¿A qué central Notifier se conecta? La compatibilidad varía según el panel
    [F6][F7][F8]


    ---


    Fuentes:

    - Manual AFP4000 (MIDT230, sin revisión registrada) [F6]

    - Manual ID50/60 (MIDT156, sin revisión registrada) [F7]

    - Manual SDX-751TEM (I56-1320-001, sin revisión registrada) [F2]

    - Manual IDX-751 (MN-DT-1020, sin revisión registrada) [F4]

    - Manual CPX-751E (I56-0790-003, sin revisión registrada) [F5]


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "Todos los sensores analógicos de temperatura o humo se montan en una base B501
    para facilitar su instalación y sustitución." (MIDT230, p. 16) [F6]'
