- qid: cat015
  question: ¿Como se actualiza el firmware de la central Detnov CAD-150?
  answer: 'El procedimiento de actualización de firmware de la CAD-150 **no está documentado
    en los fragmentos disponibles**.


    Los fragmentos recuperados corresponden al manual de usuario (55315008) y al manual
    de instalación (55315013) de la CAD-150-8, y cubren únicamente:


    - Descripción general de la serie [F3]

    - Panel de control e indicadores [F4][F5]

    - Índice general del manual de usuario [F2]

    - PCB base y PCB carátula [F6]


    Ninguno de estos fragmentos describe el procedimiento de actualización de firmware.


    **Lo que sí puedo indicar** es que la PCB de carátula dispone de un **conector
    USB** [F6], que podría estar relacionado con la actualización, pero el manual
    no especifica el procedimiento en los fragmentos disponibles.


    **Recomendación:** Consulta directamente con el soporte técnico de Detnov o solicita
    el manual de programación/instalación completo de la CAD-150, que puede contener
    el procedimiento de actualización de firmware.


    Fuente: 55315008-Manual-Centrales-Analogicas-CAD-150-8-Usuario-ES-FR-GB-IT (sin
    revisión registrada); 55315013 Manual Centrales Analogicas CAD-150-8 Instalacion
    ES FR GB IT (sin revisión registrada)


    ---

    📖 **Información adicional del manual:**

    - "* De 1 lazo no ampliable con capacidad para baterías de 7A/h

    * De 2 lazos no ampliables con capacidad para baterías de 7A/h

    * De 4 lazos no ampliables con capacidad para baterías de 7A/h

    * De 4 lazos ampliable a 8 lazos con capacidad para batería de 18A/h

    * De 4 lazos ampliable a 8 lazos con capacidad para batería de 24A/h" [F3]'
