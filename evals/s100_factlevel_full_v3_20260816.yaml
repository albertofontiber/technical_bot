- qid: hp006
  question: La Notifier AFP-400 muestra el aviso 'Tierra' (Earth Fault). ¿Qué significa
    y cómo se localiza?
  answer: '## Fallo de Tierra (Earth Fault) en la AFP-400


    El aviso **''Tierra''** indica que se ha detectado una fuga a tierra en algún
    conductor del sistema. La MPS-400 dispone de un **LED de Fallo de Tierra** (Ground
    Fault LED) en la placa de alimentación que se activa ante esta condición [F1].


    ---


    ### ¿Qué ocurre en el SLC cuando hay fallo de tierra?


    Según la tabla de condiciones de fallo del SLC [F7], una falta de tierra genera
    **Alarma/Problema** en todos los estilos de circuito (Estilo 4, Estilo 6 y Estilo
    7). Esto significa que el panel generará tanto señal de avería como potencialmente
    señal de alarma.


    ---


    ### Cómo localizar el fallo de tierra


    Los fragmentos disponibles no describen un procedimiento paso a paso de localización
    de fallo de tierra para la AFP-400. Lo que sí está documentado es:


    1. **Identificar el LED activo**: El LED **"Fallo de Tierra"** (Ground Fault LED)
    en la placa MPS-400 confirma la condición [F1][F3].


    2. **Verificar si la detección de fallo de tierra está habilitada**: En la MPS-400
    existe el puente **JP2** (o **JP6** según la variante del documento), cuyo corte
    **inhabilita la detección de Falla de Tierra** [F2][F3]. Comprueba que este puente
    no esté cortado accidentalmente.


    3. **Revisar el cableado del SLC**: Una falta de tierra en el lazo SLC genera
    condición de Alarma/Problema [F7]. Inspecciona el aislamiento de los conductores
    del lazo, especialmente en zonas con rozaduras, prensaestopas o cajas de registro.


    4. **Revisar el cableado de alimentación (TB1)**: El terminal **TB1-3** es la
    toma de tierra de la alimentación AC [F1][F3]. Verifica que no haya conductores
    activos en contacto con la malla o chasis.


    ---


    ### Nota sobre aislamiento del fallo


    Si el SLC está configurado en **Estilo 7**, los módulos aisladores **ISO-X** permiten
    aislar zonas del lazo para localizar el fallo por secciones [F9]. Esto facilita
    la localización: ve desconectando tramos hasta que el fallo de tierra desaparezca.


    ---


    > ⚠️ **Precaución**: Antes de intervenir en la MPS-400, desconecta **todas las
    entradas de alimentación** (AC y baterías). Varias fuentes de alimentación pueden
    estar conectadas simultáneamente [F3].


    ---


    **Fuente:** MIDT170 – Manual de Instalación AFP-400 (sin revisión registrada);
    50253SP – AFP-300/AFP-400 Installation (sin revisión registrada)


    ---

    📖 **Información adicional del manual:**

    - "- **TB1** (top left): Terminal block with connections labeled TB1

    - **TB2** (top center): Terminal block labeled TB2

    - **TB3-TB6** (top right): Terminal blocks labeled TB3-TB6

    - **TB7-TB10** (far right): Terminal blocks labeled TB7-TB10

    - **Interruptor de Selección de Voltaje 115V/230V** (left side): Voltage selection
    switch

    - **Circuitos de Aviso y Señalizaciones 1-4** (right side): Alarm and signaling
    circuits 1-4

    - **Fallo de Tierra** (right side): Ground fault indicator

    - **Activación de la Alimentación AC** (right side): AC power activation

    - **Placa de Alimentación de la MPS-400** (bottom center): MPS-400 power supply
    board" [F1]

    - "* 1 Falla de Tierra

    * 2 Neutro

    * 3 Tierra

    * 4 Caliente

    * 5 Instalación

    * 6 +24 VDC batería

    * 7 –24 VDC batería

    * Refiérase a las "Conexiones de la Alimentación AC y de Batería (MPS-400)" en
    la página 2-45." [F3]

    - "* 2 – 1.25 A max." [F3]

    - "* 6 – 1.25 A max." [F3]'
