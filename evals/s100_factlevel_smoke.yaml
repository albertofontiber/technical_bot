- qid: hp007
  question: ¿Cómo se realiza el test anual de un detector VESDA-E VEP según el manual
    del fabricante?
  answer: '## Test anual del detector VESDA-E VEP según el manual


    Según la **Tabla 7-1** del manual [F1], las tareas que corresponden a frecuencia
    **anual (una vez al año)** para el detector **VEP-A10-P** son las siguientes:


    ---


    ### Tareas anuales obligatorias


    1. **Realizar una prueba de humos** para comprobar la integridad de la red de
    tubería [F1]

    2. **Comprobar el flujo de la red de tubería** [F1]

    3. **Limpiar los puntos de muestreo** [F1]

    4. **Limpiar con agua la red de tubería** [F1]


    ---


    ### Procedimiento previo a cualquier tarea de mantenimiento


    Antes de iniciar el mantenimiento, el manual indica obligatoriamente [F1]:


    - Informar a la autoridad supervisora adecuada

    - Asegurarse de que se aíslen los dispositivos existentes que dependan del detector
    antes de ponerlo en funcionamiento

    - ⚠️ **Precaución:** Cuando el detector está deshabilitado o en espera, **no emitirá
    advertencias de fuego**


    ---


    ### Poner el detector en modo "En espera" durante el mantenimiento


    Cuando se trabaja sobre la red de tubería o los puntos de muestreo, se recomienda
    establecer el detector en **modo en espera** [F6]:


    1. Desde **Xtralis VSC**, selecciona **"Go to Standby"** en el menú **"Device"**
    [F6]

    2. El LED desactivado parpadeará y se desactivará el aspirador [F6]

    3. Al terminar, selecciona **"End Standby"** en el menú **"Device"** para reactivar
    la unidad [F6]


    > Nota: En modo en espera se desactiva el aspirador y se detiene la detección
    de alarmas, pero **no** la detección ni señalización de fallos [F6]


    ---


    ### Sobre la prueba de humos anual


    La prueba de humos consiste en introducir una muestra de humo en el **orificio
    de muestreo más alejado** y medir el tiempo que tarda en llegar al detector [F2].
    Los resultados deben registrarse y compararse con pruebas posteriores para detectar
    variaciones del sistema [F2].


    > ⚠️ El manual remite al procedimiento detallado de la prueba de humos a la **VESDA-E
    Commissioning Guide** (Guía de puesta en marcha de VESDA-E) [F2]. Los fragmentos
    disponibles no contienen ese procedimiento paso a paso — consulta ese documento
    para el detalle completo.


    ---


    ### Notas adicionales del manual [F1]


    - La frecuencia puede variar según **códigos y normas locales** y el entorno de
    instalación

    - El mantenimiento puede realizarlo el instalador original, un distribuidor autorizado
    o el contratista de servicio

    - Cuando se realicen pruebas de humo, seguir los **procedimientos del sitio**
    para evitar falsas alarmas


    ---


    **Fuente:** 33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores (sin revisión
    registrada)


    ---


    También puedo ayudarte con: **sustitución del filtro (tarea bienal)**, **comandos
    de prueba disponibles desde Xtralis VSC** o **comprobaciones trimestrales y semestrales**
    del VEP-A10-P.'
