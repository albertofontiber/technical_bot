- qid: cat007
  question: En el detector por aspiración FAAST LT-200, ¿qué salidas de relé y de
    sirena tiene y con qué contactos, cómo se comporta el relé de avería ante un fallo
    o un corte de alimentación, qué resistencia de fin de línea llevan las salidas
    de sirena y cuál es la especificación eléctrica de los contactos de relé?
  answer: '# FAAST LT-200 — Salidas de relé y sirena: contactos, comportamiento y
    especificaciones


    ---


    ## 1. Relés disponibles y sus contactos


    El FAAST LT-200 (versión Stand Alone) dispone de los siguientes relés, con terminales
    de contacto **NC, C y NA** para cada uno [F4]:


    **Relés de ALARMA:**

    - Relé de alarma Canal 1 → terminales **5 (NC), 6 (C), 7 (NA)** [F4]

    - Relé de alarma Canal 2 → terminales **8 (NC), 9 (C), 10 (NA)** [F4]


    **Relés de AVERÍA:**

    - Relé de avería Canal 1 → terminales **11 (NC), 12 (C), 13 (NA)** [F4]

    - Relé de avería Canal 2 (AUX.) → terminales **14 (NC), 15 (C), 16 (NA)** [F4]


    **Relés de PREALARMA:**

    - Relé de prealarma Canal 1 → terminales **23 (NC), 24 (C), 25 (NA)** [F4]

    - Relé de prealarma Canal 2 → terminales **26 (NC), 27 (C), 28 (NA)** [F4]


    ---


    ## 2. Salidas de SIRENA y resistencia de fin de línea


    - Salida sirena 1 → terminales **17 (–) y 18 (+)** con resistencia de fin de línea
    de **47 kΩ** [F4]

    - Salida sirena 2 → terminales **19 (–) y 20 (+)** con resistencia de fin de línea
    de **47 kΩ** [F4]


    > La sirena 1 se corresponde con el canal 1 y la sirena 2 con el canal 2 [F1].
    El estado predeterminado es activación en ALARMA [F1].


    ---


    ## 3. Comportamiento del relé de AVERÍA ante fallo o corte de alimentación


    El relé de avería se activa en las siguientes condiciones [F1]:

    - Cuando se produce una **condición de avería en el canal 1 o 2**, o una **avería
    común**

    - Cuando la unidad está en **modo de servicio**

    - Cuando se **desconecta la alimentación** de la unidad


    > **Importante:** El estado de avería **no está enclavado** (predeterminado),
    lo que significa que se restablece automáticamente sin necesidad de rearme manual
    [F1].


    ---


    ## 4. Especificación eléctrica de los contactos de relé


    - Corriente máxima con **carga resistiva 30 V CC: 2,0 A** [F3][F5]

    - Corriente máxima con **carga resistiva 30 V CA: 0,5 A** [F3][F5]

    - Vida útil mínima: **10⁵ operaciones** [F3]


    ---


    ## Nota sobre variantes


    Los fragmentos incluyen dos variantes del FAAST LT-200:

    - **Stand Alone** (manual I56-6574-005_ES): incluye relés de prealarma y la tabla
    completa de terminales [F1][F4]

    - **Versión para lazo/Notifier** (manual I56-6577-006_ES): no incluye relé de
    prealarma en la tabla de relés [F2]


    Verifica qué variante tienes instalada para confirmar la disponibilidad del relé
    de prealarma.


    ---


    **Fuentes:**

    - I56-6574-005_ES — HS Stand Alone FAAST LT-200 QIG (sin revisión registrada)

    - I56-6577-006_ES — FAAST Notifier LT-200 QIG (sin revisión registrada)


    ---


    También puedo ayudarte con: **conexionado de la entrada configurable de rearme**,
    **especificaciones de cableado (sección de conductor y longitudes de tubería)**
    o **procedimiento de puesta en marcha del FAAST LT-200**.'
