- qid: cat007
  question: En el detector por aspiración FAAST LT-200, ¿qué salidas de relé y de
    sirena tiene y con qué contactos, cómo se comporta el relé de avería ante un fallo
    o un corte de alimentación, qué resistencia de fin de línea llevan las salidas
    de sirena y cuál es la especificación eléctrica de los contactos de relé?
  answer: '## FAAST LT-200 — Salidas de relé y sirena: resumen completo


    ---


    ### 1. Relés disponibles y sus contactos


    El equipo dispone de los siguientes relés, cada uno con contactos **NC (normalmente
    cerrado), C (común) y NA (normalmente abierto)**:


    **Versión Stand-Alone (I56-6574):**

    - Relé de **Alarma Canal 1** → terminales 5 (NC), 6 (C), 7 (NA) [F6]

    - Relé de **Alarma Canal 2** → terminales 8 (NC), 9 (C), 10 (NA) [F6]

    - Relé de **Avería Canal 1** → terminales 11 (NC), 12 (C), 13 (NA) [F6]

    - Relé de **Avería Canal 2 (AUX.)** → terminales 14 (NC), 15 (C), 16 (NA) [F6]

    - Relé de **Prealarma Canal 1** → terminales 23 (NC), 24 (C), 25 (NA) [F6]

    - Relé de **Prealarma Canal 2** → terminales 26 (NC), 27 (C), 28 (NA) [F6]


    **Versión Loop (I56-6575):**

    - Relé de **Alarma Canal 1** → terminales 5 (NC), 6 (C), 7 (NA) [F5]

    - Relé de **Alarma Canal 2** → terminales 8 (NC), 9 (C), 10 (NA) [F5]

    - Relé de **Avería Canal 1** → terminales 11 (NC), 12 (C), 13 (NA) [F5]

    - Relé de **Avería Canal 2 (AUX.)** → terminales 14 (NC), 15 (C), 16 (NA) [F5]


    > **Nota:** La versión Loop no incluye relés de Prealarma en la tabla de terminales
    [F5]. La versión Stand-Alone sí los incluye [F6].


    ---


    ### 2. Comportamiento de cada relé


    **Versión Stand-Alone [F3]:**

    - **Alarma 1 o 2:** Se activa cuando se cumple la condición de alarma en el canal.
    Estado predeterminado = Nivel 1. El estado de alarma **está enclavado por defecto**
    — se necesita un rearme manual para desactivar el LED y el relé.

    - **Prealarma 1 o 2:** Se activa cuando se cumple la condición de prealarma en
    el canal. Estado predeterminado = Nivel 1. Cuando Prealarma = Alarma = Nivel 1,
    la prealarma se activará al **70 % del nivel 1**.

    - **Avería 1 o 2:** Se activa ante condición de avería en canal 1 o 2, o avería
    común. También se indica en modo de servicio y **cuando se desconecta la alimentación
    de la unidad**. El estado de avería **no está enclavado** (predeterminado).

    - **Sirena 1 o 2:** Se activa cuando el canal está en Alarma/Prealarma. Sirena
    1 → Canal 1; Sirena 2 → Canal 2. Estado predeterminado = establecido en Alarma.


    **Versión Loop [F4]:**

    - **Alarma 1 o 2:** Controlada por el panel cuando determina que se da la condición
    de alarma. Encendido y apagado por el panel; **no enclavado**.

    - **Avería 1 o 2:** Igual que Stand-Alone — se activa ante avería en canal 1 o
    2 o avería común, en modo de servicio y **cuando se desconecta la alimentación**.
    El estado de avería **no está enclavado**.

    - **Sirena 1 o 2:** Se activa cuando el canal está en Alarma. Sirena 1 → Canal
    1; Sirena 2 → Canal 2. Estado predeterminado = establecido en Alarma.


    ---


    ### 3. Comportamiento del relé de avería ante fallo o corte de alimentación


    El relé de avería se activa en tres situaciones [F3][F4]:

    1. Condición de avería en Canal 1 o Canal 2

    2. Avería común

    3. **Modo de servicio activo**

    4. **Cuando se desconecta la alimentación de la unidad**


    El estado de avería **no está enclavado** (predeterminado) — se restablece automáticamente
    al desaparecer la condición [F3][F4].


    ---


    ### 4. Resistencia de fin de línea en salidas de sirena


    Ambas salidas de sirena llevan resistencia de fin de línea de **47 kΩ** [F5][F6]:

    - Salida Sirena 1: terminales 17 (−) y 18 (+), con **47 kΩ** [F5][F6]

    - Salida Sirena 2: terminales 19 (−) y 20 (+), con **47 kΩ** [F5][F6]


    ---


    ### 5. Especificación eléctrica de los contactos de relé


    - Corriente máxima (carga resistiva CC): **2 A a 30 V CC** [F1][F2]

    - Corriente máxima (carga resistiva CA): **0,5 A a 30 V CA** [F1][F2]

    - Vida útil mínima: **10⁵ operaciones** [F1][F2]


    ---


    **Fuentes:**

    - I56-6574-005_ES -HS Stand Alone FAAST LT-200 QIG (sin revisión registrada)

    - I56-6575-005_ES FAAST LT-200 Loop QIG (sin revisión registrada)

    - I56-6577-006_ES FAAST Notifier LT-200 QIG (sin revisión registrada)'
