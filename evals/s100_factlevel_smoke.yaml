- qid: hp001
  question: En la Detnov CAD-250, ¿cómo se entra al menú de programación avanzada?
  answer: "## Acceso al menú de programación avanzada — CAD-250\n\nLa ruta de acceso\
    \ es la siguiente [F1][F10]:\n\n1. Desde la **PANTALLA DE REPOSO**, toca el icono\
    \ del **candado** (\U0001F512) [F2].\n2. Introduce la **clave de administrador**\
    \ (por defecto: **2222**) en el teclado numérico y confirma con ✓ [F2].\n3. En\
    \ el **Menú Principal** (barra lateral izquierda), selecciona **AJUSTES** [F1].\n\
    4. En el **SubMenú** (barra lateral derecha), selecciona **AVANZADO** [F1].\n\n\
    Una vez dentro, dispones de **3 pestañas** [F1]:\n\n- **SISTEMA** — Número de\
    \ cabinas (paneles), lazos y LEDs de zona. Valores configurables:\n  - PANELES:\
    \ 1 a 4 [F1]\n  - LAZOS: 2, 4, 6, 8 (1 cabina) hasta 32 (4 cabinas) [F1]\n  -\
    \ LEDes: 0 ó 1 [F1]\n  - Para aplicar cambios pulsa **Guardar y Reiniciar** [F1]\n\
    \n- **OTROS** — Interruptores de puesta en marcha y mantenimiento [F1][F7]:\n\
    \  - Tiempo de inactividad\n  - Salto a scroll si incidentes\n  - Saltar a último\
    \ incidente prioritario si timeout\n\n  > ⚠️ Por razones de seguridad y cumplimiento\
    \ normativo, todos estos interruptores deben estar **activados (en verde)** por\
    \ defecto [F7].\n\n- **REINICIAR** — Devuelve la configuración completa de la\
    \ central a valores de fábrica [F7].\n\n> ⚠️ Este nivel requiere **privilegios\
    \ de administrador**. El uso indebido puede provocar un mal funcionamiento de\
    \ la instalación [F2].\n\n---\n\nFuente: CAD-250 Manual de Configuración MC-380-es-2026-c\
    \ (rev. c, 2026-04-23)"
