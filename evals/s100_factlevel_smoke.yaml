- qid: hp018
  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  answer: '# Conexionado de sirena convencional en salidas de sirena de la ZXe


    ## Identificación de terminales


    La **ZX2e** dispone de **2 salidas de sirena** (A y B), con terminales identificados
    como [F4]:

    - **A+, A-** (Sirena A)

    - **B+, B-** (Sirena B)


    La **ZX5e** dispone de **4 salidas de sirena** (A, B, C y D), con terminales en
    bloque **TB7** identificados como [F4]:

    - **A-, A+, B-, B+, C-, C+, D-, D+**


    ---


    ## Procedimiento de conexionado


    ### 1. Sirenas con polaridad

    Conecta respetando la polaridad **+/−** de cada sirena en serie a lo largo de
    la línea [F3]:

    - Línea **+** de la salida → terminal **+** de la primera sirena

    - Terminal **−** de la primera sirena → terminal **+** de la siguiente

    - Continúa en serie hasta la última sirena

    - Al final de la última sirena, instala la **Resistencia Final de Línea (RFL)
    de 6.800 Ω** entre **+** y **−** [F1][F3]


    ### 2. Sirenas/campanas sin polaridad

    Cada dispositivo no polarizado **requiere un diodo de polarización** instalado
    en serie, para evitar consumo durante la supervisión (corriente inversa en reposo)
    [F1][F4]:

    - Instala el diodo entre el terminal **+** de la salida y uno de los terminales
    de alimentación de la campana [F1]


    ### 3. Resistencia Final de Línea (RFL)

    - Valor: **6.800 Ω, mínimo 0,5 W** [F1]

    - Se instala siempre entre **+** y **−** de la **última sirena** de la línea [F1]

    - Si **no hay sirenas** conectadas en esa salida, instala la RFL directamente
    en los terminales de la central [F1]


    ---


    ## Reglas críticas de cableado


    - **No realizar ramales** en la línea de sirenas. La supervisión se realiza sobre
    la línea directa hasta la RFL; los ramales paralelos no quedan supervisados [F2]

    - **No enrollar el cable en los terminales**. Cortar y empalmar adecuadamente
    para mantener la supervisión [F3]

    - Sección mínima de cable recomendada: **1,5 mm²** [F1]

    - Longitud máxima recomendada: **1 km**. Por encima, la capacitancia e inductancia
    del lazo pueden afectar al funcionamiento [F3]

    - Corriente máxima por circuito: **1 A** [F1]


    ---


    ## Principio de supervisión


    El circuito se polariza en **inverso en reposo** para supervisar la línea. Al
    activarse la salida, la corriente circula en sentido normal y las sirenas suenan
    [F4]. Cualquier fallo (circuito abierto o cortocircuito) se mostrará en pantalla
    como avería, por ejemplo [F5]:


    ```

    !ATENCION!  CIRCUITO ABIERTO SIRENA B

    ```


    ---


    **Fuentes:**

    - Manual de Instalación ZX2e/ZX5e — Documento No. MIE-MI-530, Revisión: 001

    - Manual de Configuración ZX2e/ZX5e — Documento No. MIE-MP-530, Revisión: 001


    ---


    También puedo ayudarte con: **programación del patrón de disparo de las sirenas**,
    **verificación de la supervisión en puesta en marcha** o **conexionado de sirenas
    analógicas de lazo**.'
  family_resolved: true
  gold_families:
