  question: ¿Cómo se realiza el test anual de un detector VESDA-E VEP según el manual
    del fabricante?
  answer: '# Test anual del detector VESDA-E VEP según el manual


    El manual establece **cuatro tareas de mantenimiento anual** para el detector
    VEP-A10-P [F1]:


    ---


    ## Tareas anuales (frecuencia: una vez al año)


    Según la **Tabla 7-1: Calendario de mantenimiento sugerido para el detector VEP-A10-P**
    [F1]:


    - **Realizar una prueba de humos** para comprobar la integridad de la red de tubería

    - **Comprobar el flujo** de la red de tubería

    - **Limpiar los puntos de muestreo**

    - **Limpiar con agua la red de tubería**


    ---


    ## Antes de comenzar cualquier prueba — Precauciones obligatorias


    ⚠️ **PRECAUCIÓN** [F1]:

    - Informa a la **autoridad supervisora adecuada** antes de iniciar el mantenimiento
    o las pruebas

    - Asegúrate de que se **aíslen los dispositivos existentes** que dependan del
    detector antes de ponerlo en funcionamiento

    - Cuando el detector está deshabilitado o en espera, **no emitirá advertencias
    de fuego**

    - Cuando se realicen pruebas de humo, **sigue los procedimientos del sitio para
    evitar falsas alarmas** a los servicios supervisados [F1]


    ---


    ## Procedimiento recomendado para el mantenimiento de tubería y puntos de muestreo


    Cuando se realiza mantenimiento de la red de tubería o los puntos de muestreo,
    se recomienda establecer el detector en **modo en espera** para apagar el aspirador
    [F8]:


    1. Desde **Xtralis VSC**, selecciona **"Go to Standby"** (Ir a modo en espera)
    en el menú **"Device"** (Dispositivo) [F8]

    2. El **LED desactivado parpadeará** y se desactivará el aspirador [F8]

    3. Si está configurado, el zumbador emitirá **un pitido por minuto** (si se ha
    marcado la casilla de pitido en espera en la pantalla de configuración de relés,
    sección 5.5.10) [F8]

    4. Realiza las tareas de mantenimiento

    5. Al finalizar, selecciona **"End Standby"** (Finalizar modo en espera) en el
    menú **"Device"** para volver a activar la unidad [F8]


    > ⚠️ Nota: En modo en espera se detiene la detección de alarmas, pero **no** la
    detección ni la señalización de fallos [F8]


    ---


    ## Prueba de humos anual — Detalle


    La prueba de humos consiste en introducir una muestra de humo en el **orificio
    de muestreo más alejado** y medir el tiempo que tarda el humo en llegar al detector
    [F4]. Los resultados se registran y se comparan con pruebas posteriores para detectar
    variaciones del sistema [F4].


    > 📋 El manual remite a la **VESDA-E Commissioning Guide** para los detalles completos
    del procedimiento de prueba de humo [F4].


    ---


    ## Notas adicionales del manual [F1]


    - La frecuencia de las comprobaciones puede variar según **códigos y normas locales**
    y el entorno de la instalación

    - El mantenimiento puede realizarlo el **instalador original**, un **distribuidor
    autorizado** o el **contratista de servicio**


    ---


    **Fuente:** 33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores (sin revisión
    registrada)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "**Atención:** Pendant que le detecteur ou la zone est desactivee, aucun feu
    d''indication va etre emis par le detecteur." (33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores,
    p. 87) [F1]

    - "Se debe realizar una comprobación preliminar del sistema después de instalar
    el detector VEP-A10-P y antes de ponerlo en marcha." (33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores,
    p. 54) [F7]'
