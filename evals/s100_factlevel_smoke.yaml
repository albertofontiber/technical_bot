- qid: hp001
  question: En la Detnov CAD-250, ¿cómo se entra al menú de programación avanzada?
  answer: "## Acceso al menú de Programación Avanzada — CAD-250\n\nPara acceder al\
    \ menú **AVANZADO** en la CAD-250, sigue estos pasos:\n\n**1. Acceder como administrador**\n\
    \nDesde la **PANTALLA DE REPOSO**, toca el icono del candado (\U0001F512) [F2].\
    \ Se mostrará la pantalla de introducción de contraseña [F2].\n\nIntroduce la\
    \ clave de administrador por defecto: **2222** [F2].\n\n> ⚠️ Este nivel requiere\
    \ autorización y conocimientos adecuados. El uso indebido puede provocar un mal\
    \ funcionamiento de la instalación [F2].\n\n**2. Navegar al menú AVANZADO**\n\n\
    Una vez dentro como administrador, la ruta de acceso es [F1]:\n\n**AJUSTES** (Menú\
    \ principal) **> AVANZADO** (Submenú)\n\n**3. Contenido del menú AVANZADO**\n\n\
    Dentro encontrarás **3 pestañas** [F1]:\n\n- **SISTEMA:** Configuración del número\
    \ de cabinas (PANELES: 1 a 4), número de lazos y si hay cabina con LEDs de zona\
    \ [F1].\n- **OTROS:** Interruptores para facilitar tareas de puesta en marcha\
    \ y mantenimiento [F1][F7]:\n  - Tiempo de inactividad\n  - Salto a scroll si\
    \ incidentes\n  - Saltar a último incidente prioritario si timeout\n  - Recordar\
    \ estado de módulos virtuales en pantalla incidentes [F7]\n  - Salir del modo\
    \ de test automáticamente (horas) [F7]\n- **REINICIAR:** Devuelve la configuración\
    \ del panel a valores de fábrica. No afecta a entidades, lazos, maniobras, grupos,\
    \ módulos virtuales, modos especiales, filtros de red ni registros de eventos\
    \ [F7].\n\n> ⚠️ Por razones de seguridad y cumplimiento normativo, los interruptores\
    \ de inactividad, timeout y scroll deben estar activados (en verde) por defecto\
    \ [F6].\n\n---\n\n**Fuentes:**\n- CAD-250 Manual de Configuración MC-380-es-2026-c\
    \ (rev. c, 2026-04-23) — Secciones 3.2, 4.1, 5.4\n- CAD-250 Manual de Software\
    \ de Configuración MS-416-es-2026-b (rev. b) — Sección 4.16.2\n\n---\n\nTambién\
    \ puedo ayudarte con: **configuración del número de lazos y cabinas (pestaña SISTEMA)**,\
    \ **gestión de usuarios y contraseñas** o **navegación por el resto del menú AJUSTES**\
    \ de la CAD-250."
