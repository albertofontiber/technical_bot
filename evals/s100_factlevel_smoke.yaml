- qid: cat005
  question: ¿Cuáles son las características técnicas de la central de detección de
    gas Fidegas CS4, y en qué se diferencian las versiones digital y analógica?
  answer: '# Central de Detección de Gas FIDEGAS® CS4 — Características Técnicas


    ## Especificaciones generales


    - **Tensión de alimentación:** 110-230 Vac 50-60 Hz [F1]

    - **Potencia:** 30 W (Clase II) [F1][F2]

    - **Sensores:** Hasta 4 conexiones en modo analógico o digital [F1]

    - **Salidas:** 2 salidas conmutadas LP (relé apto para 230 Vac) con contactos
    NA-C-NC [F1]

    - **Corriente máxima:** 250 mA [F1]

    - **Rearme:** Seleccionable manual o automático [F1]

    - **Dimensiones:** 90 x 106 x 58 mm [F1]

    - **Peso:** 300 g [F1]

    - **Montaje:** Carril DIN o armario de superficie [F3]

    - **Firmware:** versión 1.2 (tanto en versión digital como analógica) [F2][F8]


    ## Indicaciones disponibles


    - **LED verde PWR:** alimentación presente (fijo) / corte de red (intermitente)
    [F3]

    - **LED bicolor ON/ALARM por sensor:** presencia de sensor remoto (verde) / alarma
    (rojo) [F3]

    - **LED amarillo ERROR por sensor:** avería de sensor remoto [F3]

    - **LED verde OUT1 y OUT2:** salida activa (verde) / desactivada (apagado) [F3]

    - **Avisador acústico:** apoyo sonoro a las indicaciones ópticas [F3]

    - **Indicaciones generales:** presencia, alarma y avería por sensor, avería de
    central, corte de red [F1]


    ## Comportamiento en alarma


    - Umbral de alarma: **20% del fondo de escala** [F6]

    - Las alarmas son **enclavadas** hasta rearme manual (RESET) [F6]

    - Si la concentración no ha disminuido, la alarma puede **silenciarse durante
    24 horas** con el botón RESET, pero no se puede rearmar [F6]

    - En alarma, las salidas asignadas pasan a NA y se apagan los LEDs OUT1/OUT2 correspondientes
    [F6]


    ---


    ## Diferencias entre versión Digital y Analógica


    ### Código de producto

    - **Versión digital:** 3244 [F1]

    - **Versión analógica:** 3270 [F1]


    ### Tipo de entrada de señal

    - **Versión digital:** entradas digitales **0-10/15 V** [F3]

    - **Versión analógica:** entradas analógicas **4-20 mA** [F3]


    ### Sensores compatibles

    **Versión analógica:** [F2]

    - Sensores S/3 gases combustibles

    - Sensores S/3 y S/2 gases tóxicos

    - Sensores S/10 gases tóxicos


    **Versión digital:** [F2]

    - Sensores S/10 gases combustibles


    ---


    > ⚠️ **Nota importante:** La versión a adquirir debe seleccionarse en función
    del tipo de sensor remoto que se va a conectar, ya que los sensores compatibles
    son distintos para cada versión.


    **Fuente:** Manual de Usuario CS4 (Analógica o Digital), Rev. 2 (10/2018) — C.A.E.,
    S.L. / FIDEGAS®


    ---


    También puedo ayudarte con: **conexionado de sensores S/3 o S/10**, **configuración
    de salidas OUT1/OUT2** o **procedimiento de puesta en marcha y rearme** de la
    CS4.'
