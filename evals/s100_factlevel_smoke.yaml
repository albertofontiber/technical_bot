- qid: hp018
  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  answer: '# Conexión de sirenas convencionales en salidas de sirena de la Morley
    ZXe


    La ZXe dispone de **2 circuitos de sirenas supervisados** (Sirena A y Sirena B),
    limitados en corriente [F2].


    ---


    ## Requisitos previos obligatorios


    - **Cada sirena debe tener un diodo integrado** para evitar consumo en polarización
    inversa durante la supervisión [F2].

    - Si se conectan dispositivos **no polarizados** (campanas sin polaridad), se
    deben instalar diodos de polarización y protección en cada uno [F2].

    - **No realizar ramales** en la línea de sirenas: la supervisión se realiza en
    la línea directa hasta la RFL; los ramales paralelos no quedan supervisados [F6].

    - **No enrollar el cable en los terminales**: cortar y empalmar adecuadamente
    para mantener la supervisión [F1].


    ---


    ## Parámetros eléctricos clave


    - **Consumo máximo por circuito:** 1 A [F2]

    - **Resistencia de final de línea (RFL):** 6.800 Ω (6k8), 0,5 W mínimo [F2]

    - **Longitud máxima de cable recomendada:** no superior a 1 km (por encima, la
    capacitancia e inductancia pueden afectar al funcionamiento) [F1]

    - **Sección mínima de cable recomendada:** no inferior a 1,5 mm² [F5]


    ---


    ## Principio de supervisión


    El circuito se polariza en **inverso en reposo** para supervisar la línea. Al
    activarse la alarma, la polaridad cambia a la normal, permitiendo el funcionamiento
    de las sirenas [F2]. La supervisión detecta circuito abierto y cortocircuito [F2].


    ---


    ## Conexión paso a paso


    1. **Identifica los terminales de sirena en la placa** de la ZX2e: bloque etiquetado
    `SOUNDERS / B+ B- A+ A-` [F2].


    2. **Conecta las sirenas en cadena** desde los terminales A+ y A- (o B+ y B-),
    respetando la polaridad de cada sirena (+ con +, - con -) [F1].


    3. **Instala la RFL (6k8, ≥0,5 W)** entre + y - al final de la última sirena del
    circuito [F2].


    4. **Si no hay sirenas conectadas** en una salida, instala igualmente la RFL directamente
    en los terminales de la central [F5].


    5. **Verifica la sección de cableado** para garantizar la tensión adecuada en
    las sirenas tanto con alimentación principal como con mínima tensión de baterías
    (consulta las Tablas 10 y 11 del manual) [F1].


    ---


    ## Topología del circuito


    El manual describe el circuito en la **Figura 15** del documento MIE-MI-530 [F1].
    Para la topología exacta de conexionado (orden de dispositivos, polaridad entre
    ellos), consulta directamente esa figura en el manual físico.


    > ⚠️ **Advertencia:** La supervisión solo cubre la línea directa hasta la RFL.
    Cualquier ramal paralelo quedará sin supervisión [F6].


    ---


    **Fuente:** Manual de Instalación Paneles de Incendio ZX2e / ZX5e — Documento
    MIE-MI-530, Revisión 001


    ---

    📋 **Obligaciones de evidencia del manual:**

    - Nota: la fuente es inconsistente: "* El panel de detección y control de incendio
    ZX5Se tiene 4 circuitos de sirenas supervisados y limitados en corriente, identificados
    como circuitos de sirena A, B, C y D." (MIE-MI-600, p. 24) [F4] declara 4 circuitos
    y la enumeración servida lista 2 (MIE-MI-600, p. 24) [F4].

    - Nota: la fuente es inconsistente: "El máximo permitido entre los 4 circuitos
    de sirena de ZX5Se es de 2A." (MIE-MI-600, p. 24) [F4] declara 4 circuitos y la
    enumeración servida lista 2 (MIE-MI-600, p. 24) [F4].'
