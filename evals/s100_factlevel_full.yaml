- qid: cat024
  question: ¿Cuál es el consumo en alarma de la sirena analógica de zócalo Detnov
    MAD-472?
  answer: 'El consumo en alarma de la **MAD-472** es **7 mA** [F5][F6][F7].


    Adicionalmente, del propio manual de la sirena se confirma que el consumo en alarma
    es de **17 mA a 80 dB A** [F1], lo que indica que los valores difieren entre fuentes.


    > ⚠️ **Discrepancia entre documentos:** El manual propio de la MAD-472 indica
    **17 mA (80 dB A)** [F1], mientras que las tablas de dispositivos compatibles
    de la CAD-250 indican **7 mA** [F5][F6][F7]. Verifica con Detnov cuál es el valor
    correcto para tu cálculo de carga de lazo.


    **Resumen de consumos MAD-472:**

    - Consumo en reposo: **< 350 μA** [F1] / **0,35 mA** [F5]

    - Consumo en alarma: **17 mA (80 dB A)** según manual propio [F1] / **7 mA** según
    tablas CAD-250 [F5][F6][F7]

    - Tensión de funcionamiento: **22-38 VDC** [F1]

    - Aislador incorporado: **No** [F5]

    - Direcciones de lazo: **1** [F5]


    ---


    Fuentes:

    - 55347200 Manual Sirena Analógica MAD-472 ES GB FR IT_V2 (sin revisión registrada)

    - Manual instalación CAD-250 (MI_372_es_2024 e) (sin revisión registrada)

    - CAD-250_Manual-Configuracion-MC-380-es-2026-c (rev. c, 2026-04-23)

    - CAD-250_Manual-software-configuracion-MS-416-es-2026-b (rev. b)'
