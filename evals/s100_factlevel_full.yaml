- qid: cat017
  question: ¿Como se cablea y se da de alta (configura) un lazo en la central Notifier
    INSPIRE (E10/E15)?
  answer: "# Cableado y configuración de lazo en INSPIRE E10/E15\n\nA continuación\
    \ se detalla el proceso completo en dos bloques: **cableado físico** y **configuración\
    \ (alta) del lazo**.\n\n---\n\n## BLOQUE 1 — CABLEADO FÍSICO DEL LAZO\n\n### Módulo\
    \ de lazo OPAL X2 (HOP-433-100)\n\nEl módulo de doble lazo tiene **10 terminales**\
    \ [F2][F3]:\n\n**Lazo 1:**\n- Terminal **1** → Lazo 1 Salida +VE (OUT +VE)\n-\
    \ Terminal **2** → Lazo 1 Salida -VE (OUT -VE)\n- Terminal **3** → ⊕ (**NO usar\
    \ para pantalla de cable**)\n- Terminal **4** → Lazo 1 Entrada +VE (IN +VE)\n\
    - Terminal **5** → Lazo 1 Entrada -VE (IN -VE)\n\n**Lazo 2:**\n- Terminal **6**\
    \ → Lazo 2 Salida +VE (OUT +VE)\n- Terminal **7** → Lazo 2 Salida -VE (OUT -VE)\n\
    - Terminal **8** → ⊕ (**NO usar para pantalla de cable**)\n- Terminal **9** →\
    \ Lazo 2 Entrada +VE (IN +VE)\n- Terminal **10** → Lazo 2 Entrada -VE (IN -VE)\n\
    \n> ⚠️ **La pantalla del cable de lazo debe conectarse a la barra de tierra**,\
    \ NO a los terminales 3 u 8 [F2][F3].\n\n> ⚠️ **No se permite mezclar dispositivos\
    \ OPAL y CLIP en el mismo lazo** [F2].\n\n### Capacidad del lazo [F2][F4]\n\n\
    **Modo OPAL:**\n- Hasta **159 detectores OPAL** por lazo\n- Hasta **159 módulos\
    \ OPAL** por lazo\n- Máximo **750 mA** por lazo\n\n**Modo CLIP** (requiere licencia):\n\
    - Hasta **99 detectores CLIP** por lazo\n- Hasta **99 módulos CLIP** por lazo\n\
    \n> ⚠️ **EN54:** Restricción de **512 detectores y/o pulsadores** por módulo de\
    \ lazo (2 circuitos) según EN54-2, 13.7 [F2].\n\n### Longitud del cable\n\nLa\
    \ longitud puede ser de **hasta 3,5 km** dependiendo del tipo de carga y de cable\
    \ [F2]. Usa el **programa de cálculo de lazo y batería de CLSS** para determinar\
    \ la longitud exacta según tu instalación [F2].\n\n---\n\n## BLOQUE 2 — COMPROBACIONES\
    \ PREVIAS AL ENCENDIDO\n\nAntes de encender la central, realiza las siguientes\
    \ pruebas con multímetro [F5][F6]:\n\n> ⚠️ **NUNCA uses un dispositivo de alta\
    \ tensión (p. ej. comprobador de aislamiento) en el circuito de lazo** [F5].\n\
    \n1. Comprueba la **continuidad de cada parte del lazo** y mide la resistencia\
    \ de extremo a extremo. Se recomienda conectar solo con **cable de 2 hilos** [F5].\n\
    2. Comprueba la **continuidad de la pantalla del cable** (debe dar resistencia\
    \ muy baja) [F5].\n3. Verifica que **no hay continuidad entre la pantalla y los\
    \ cables +VE y -VE** [F5].\n4. Con el multímetro en **función de prueba de diodo**,\
    \ conecta en **polaridad invertida** (+VE del multímetro al negativo del lazo,\
    \ -VE al positivo). Debe indicar **símbolo de diodo en polarización directa**\
    \ [F6].\n5. Conecta en **polaridad normal** (+VE al positivo, -VE al negativo).\
    \ Al principio debe leer resistencia baja, que **aumenta progresivamente** al\
    \ cargarse los condensadores de los dispositivos [F6].\n   - Si indica diodo en\
    \ polarización directa en este paso → uno o varios dispositivos están **conectados\
    \ en polaridad inversa o hay cortocircuito** [F6].\n6. Comprueba que **no hay\
    \ conexión entre la pantalla y los cables +VE o -VE** [F6].\n7. Si la pantalla\
    \ no está conectada a la barra de tierra en la central, verifica que **no tiene\
    \ otra conexión a tierra** en ningún punto del recorrido [F6].\n\n---\n\n## BLOQUE\
    \ 3 — CONFIGURACIÓN (ALTA) DEL LAZO\n\n### Paso previo: Primer encendido\n\nLa\
    \ primera vez, enciende la central **sin cableado externo conectado**, pero con\
    \ la fuente de alimentación y un circuito de lazo probado [F1].\n\n1. Conecta\
    \ el cableado del lazo y el cable HMI de la puerta a la CPU [F1].\n2. Conecta\
    \ la corriente principal y las baterías (**2 × 12 V 24 Ah** para E10/E15) [F1].\n\
    3. Al encender, el **LED verde \"Alimentación\"** se encenderá. Si hay averías,\
    \ se encenderá el **LED de AVERÍA amarillo** y sonará el zumbador — pulsa **Silenciar\
    \ Zumbador/Mute** [F8].\n4. Selecciona **país** e **idioma** [F8].\n5. Selecciona\
    \ **Siguiente** → **Ajuste Hora** (hora, minutos, segundos) [F8].\n6. Selecciona\
    \ **Establecer fecha** (día, mes, año) [F8].\n7. Elige formato de reloj 12 o 24\
    \ horas → **Siguiente** [F8].\n8. Desplázate a **Información del Sistema** → selecciona\
    \ ▽ para ver el módulo de lazo. Inicialmente mostrará **\"Lazo 1: 0 Dispositivos\
    \ — Inicializando...\"** [F8].\n\n> ℹ️ La fecha y hora deben coincidir con las\
    \ del ordenador portátil para la sincronización con el programa CLSS [F8].\n\n\
    ---\n\n### Configuración del lazo con CLSS\n\n9. Abre el programa **CLSS** y ve\
    \ a **Ajustes → Ajustes HMI** → en **Tipo de marca** selecciona **Notifier EN**\
    \ [F9][F10].\n10. En **Ajustes de lazo** (Configuración de lazo), configura los\
    \ siguientes parámetros [F9][F10]:\n    - **Protocolo de Lazo:** `Opal` (por defecto;\
    \ para CLIP o TC800 se requiere licencia adicional)\n    - **Sin Uso:** marca\
    \ ☑ si el lazo no se va a utilizar\n    - **Limitar a VdS 2540:** Sí o No (el\
    \ valor de resistencia cambia según la selección)\n    - **Tipo de Cable:** selecciona\
    \ el tipo correspondiente\n    - **Resistencia (Ohm):** introduce el valor medido\
    \ (ejemplo en pantalla: `93.5 Ω`)\n11. Envía el archivo de configuración a la\
    \ central [F9][F10].\n\n> ℹ️ De forma predeterminada, la central tiene licencia\
    \ para **modo Protocolo avanzado OPAL únicamente**. Para CLIP o TC800 OPAL/CLIP\
    \ se necesita licencia adicional antes de realizar la Auto Configuración [F9].\n\
    \n---\n\n### Auto Configuración (búsqueda de dispositivos)\n\n12. En la central,\
    \ selecciona **Auto Configuración** para buscar dispositivos en el lazo [F7].\n\
    13. Lee la ventana emergente y confirma seleccionando **Auto Configuración** /\
    \ **Learn Devices** [F7].\n14. Al completarse, selecciona la **flecha > derecha**\
    \ junto al botón Auto Búsqueda para ver el estado de averías del lazo [F7].\n\
    15. Lee los mensajes de avería y rectifica los problemas. Selecciona **Hecho**\
    \ al completar [F7].\n    - Causas típicas de averías: discordancia diseño/cableado,\
    \ averías en cableado, RFI, error de módulo o FA, conexionado incorrecto en dispositivos\
    \ [F7].\n16. **Repite los pasos 12 a 15** para cada lazo hasta descubrir todos\
    \ [F7].\n\n### Numeración de lazos [F2]\n\nLos circuitos de lazo se numeran **secuencialmente\
    \ de izquierda a derecha** del portamódulos. En la E15 (dos filas de portamódulos),\
    \ la segunda fila continúa la numeración desde la primera [F2].\n\n---\n\n**Fuentes:**\n\
    - HOP-138-8ES issue 6, 01-2026 (Instrucciones de puesta en marcha INSPIRE E10/E15)\n\
    - HOP-138-9ES issue 5, 11-2025 (Instalación INSPIRE E10)\n- 4188-1132-ES issue\
    \ 3, 04-2025 (Guía rápida CLSS-10)"
