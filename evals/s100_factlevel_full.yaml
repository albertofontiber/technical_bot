  question: ¿Como se actualiza el firmware de la central Detnov CAD-150?
  answer: 'El procedimiento de actualización de firmware de la CAD-150 **no está documentado
    en los fragmentos disponibles**.


    Los fragmentos recuperados corresponden al manual de usuario (55315008) y al manual
    de instalación (55315013) de la CAD-150-8, y cubren únicamente:


    - Descripción general de la serie [F3]

    - Panel de control e indicadores [F4][F5]

    - Índice general del manual de usuario [F2]

    - PCB Base y PCB Carátula (donde se menciona un **conector USB** [F6], que podría
    estar relacionado con la actualización, pero el manual no describe ningún procedimiento
    asociado)


    Para obtener el procedimiento de actualización de firmware, te recomiendo:


    1. Consultar el **manual de instalación completo** (55315013) en su versión física,
    ya que los fragmentos recuperados son parciales.

    2. Contactar directamente con el **soporte técnico de Detnov**, que podrá facilitarte
    la herramienta y el procedimiento oficial de actualización.


