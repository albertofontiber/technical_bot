- qid: cat019
  question: '¿Como se configura una maniobra (causa-efecto) completa en la Detnov
    CAD-250: como se crea, como se definen las entradas/eventos que la disparan y
    como se asignan las salidas?'
  answer: "# Configuración de una maniobra completa en la CAD-250\n\nLa maniobra en\
    \ la CAD-250 es una relación causa-efecto: uno o varios **eventos** (entradas)\
    \ disparan una o varias **acciones** (salidas), con lógica de coincidencias configurable\
    \ [F1].\n\n---\n\n## PASO 1 — Crear la maniobra\n\n1. Navega a **MENU > MANIOBRAS**\
    \ [F1].\n2. Pulsa **+AÑADIR** en la barra de navegación inferior [F1].\n3. Se\
    \ abre la pantalla de edición de la maniobra. El contador muestra el número de\
    \ maniobra actual (ej. \"Maniobra 0001\") [F4].\n4. En el campo **COINCIDENCIAS**,\
    \ indica cuántos eventos deben cumplirse simultáneamente para que la maniobra\
    \ se active [F4].\n\n> ⚠️ La programación de maniobras es una de las funciones\
    \ más críticas de la configuración del sistema. Requiere conocimiento específico\
    \ del sistema instalado, del plan de protección y del producto [F5].\n\n---\n\n\
    ## PASO 2 — Definir las entradas (EVENTOS)\n\n1. Pulsa **AÑADIR** en el margen\
    \ inferior de la pantalla de la maniobra [F2].\n2. En la pantalla emergente, selecciona\
    \ **EVENTO** [F2].\n3. Elige el tipo de evento [F2]:\n   - **ENTIDAD**: cualquier\
    \ elemento de la jerarquía del sistema (instalación, panel, lazo, área, zona,\
    \ dispositivo, grupo o módulo virtual), tanto local como en red [F2].\n   - **CONDICIÓN\
    \ TEMPORAL**: establece un periodo de tiempo durante el cual la condición de entrada\
    \ es verdadera [F2].\n\n4. Si seleccionas **ENTIDAD**, accedes a la pantalla **EVENTO\
    \ DE LA ENTIDAD**, donde configuras [F5]:\n   - **Origen**: Local o red [F5].\n\
    \   - **Condición**: Alarma, avería, técnico [F5].\n   - **Tipo**: Todos, pulsador,\
    \ detector o entradas [F5].\n   - **Estado lógico**: Normal o Negado (si se selecciona\
    \ Negado, la condición es válida cuando NO se da el estado indicado) [F5].\n \
    \  - **Coincidencias**: número de entradas que deben ser verdaderas [F5].\n  \
    \ - **Repeticiones**: valor entero hasta **9999**; el evento debe repetirse ese\
    \ número de veces en la entidad para que la entrada sea válida [F2][F5].\n\n5.\
    \ Repite el proceso para añadir tantos eventos como necesites. El número máximo\
    \ de entradas y salidas entre todas las maniobras es de **100.000** [F2][F10].\n\
    \n> **Nota**: La configuración gestiona **eventos** (cambios de estado), no estados\
    \ estáticos. Solo el cambio de estado que coincida con la condición establecida\
    \ disparará las salidas [F2].\n\n> **Nota adicional**: Desde la versión **1.1.1**\
    \ es posible seleccionar un elemento de salida como condición de entrada; en ese\
    \ caso, el cambio a condición de avería hace verdadera la entrada. Para ello,\
    \ desmarca la casilla **\"Sólo dispositivos de entrada\"** [F9].\n\n---\n\n##\
    \ PASO 3 — Configurar la lógica de COINCIDENCIAS\n\nEl campo **COINCIDENCIAS**\
    \ determina cuántos eventos deben ser verdaderos para activar las salidas [F4][F6]:\n\
    \n- **Coincidencias = 1** con 2 eventos → comportamiento **OR**: basta con que\
    \ cualquiera de los eventos se cumpla [F4][F6].\n- **Coincidencias = 2** con 2\
    \ eventos → comportamiento **AND**: ambos eventos deben cumplirse [F4][F6].\n\
    - **Coincidencias = 3** con 4 eventos → lógica **3 de N**: se deben cumplir 3\
    \ eventos cualesquiera de los 4 [F4].\n\n---\n\n## PASO 4 — Definir las salidas\
    \ (ACCIONES)\n\n1. Pulsa **AÑADIR** en el margen inferior de la pantalla de la\
    \ maniobra [F3].\n2. En la pantalla emergente, selecciona **ACCION** [F3].\n3.\
    \ Aparecen los campos [F3]:\n   - **Retraso**: tiempo configurable entre **0 y\
    \ 600 segundos** antes de iniciar la acción [F3][F5].\n   - **Entidad**: panel,\
    \ lazo, área, zona, dispositivo, grupo o módulo virtual (siempre entidad local)\
    \ [F3].\n\n4. En la pantalla **ACCION DE LA ENTIDAD** configuras [F3][F7]:\n\n\
    \   **Acción disponible:**\n   - **Activar**: activa las salidas [F7].\n   - **Desactivar**:\
    \ desactiva las salidas [F7].\n   - **Habilitar**: habilita la entidad [F7].\n\
    \   - **Deshabilitar**: deshabilita la entidad [F7].\n   - **Test**: pone en modo\
    \ test la entidad [F7].\n   - **Reiniciar**: reinicia la entidad [F7].\n   - **Pulso**:\
    \ activa las salidas con anchura de pulso configurable entre **0 y 600 segundos**\
    \ (por defecto **10 segundos**) [F7].\n   - **Configuración**: permite cancelación\
    \ de retardos [F7].\n\n   **Tipo de elemento:**\n   - **Todos**: todas las salidas\
    \ de la entidad [F7].\n   - **Sirenas**: únicamente las sirenas [F7].\n   - **Relés**:\
    \ únicamente los relés [F7].\n   - **Sirena discontinua**: sirenas en modo discontinuo\
    \ [F7].\n   - **Sirena PCB1**: sirena 1 de la central [F7].\n   - **Sirena PCB2**:\
    \ sirena 2 de la central [F7].\n\n   > Las opciones disponibles dependen de la\
    \ entidad seleccionada. Consulta la tabla de compatibilidad Tipo/Entidad del manual\
    \ [F8].\n\n   > El programa **no permite mezclar acciones sobre entidades de paneles\
    \ diferentes** [F10].\n\n5. Pulsa **GUARDAR** para actualizar la base de datos\
    \ [F7].\n\n---\n\n## Resumen del flujo completo\n\n**MENU > MANIOBRAS > +AÑADIR**\
    \ → fijar COINCIDENCIAS → **AÑADIR > EVENTO** (definir entidad/condición temporal,\
    \ condición, tipo, estado lógico, repeticiones) → **AÑADIR > ACCION** (definir\
    \ retraso, entidad destino, acción, tipo de elemento) → **GUARDAR** [F1][F2][F3][F4][F7].\n\
    \n---\n\nFuente: CAD-250 Manual de Configuración MC-380-es-2026-c (rev. c, 2026-04-23);\
    \ CAD-250 Manual Software de Configuración MS-416-es-2026-b (rev. b)\n\n---\n\U0001F4D6\
    \ **Información adicional del manual:**\n- \"Screenshot 1: Shows the main interface\
    \ with \"Panel 12 08:08 - viernes, 19 de abril de 2019\" at top, displaying \"\
    Maniobra 0001\" with \"Borrar maniobra\" button and \"MANIOBRAS\" section. Left\
    \ sidebar shows menu items: LAZO, SECTORIZACION, MANIOBRAS, LOGS, RED, AJUSTES,\
    \ INSTALACION. The main area shows \"Coincidencias: Eventos\" and \"Acciones\"\
    \ tabs with a hand cursor pointing to an add button.\n\nScreenshot 2: Shows a\
    \ popup dialog titled \"Seleccione Eve\" with two options: \"EVENTO\" and \"ACCION\"\
    \n\nScreenshot 3: Shows \"Seleccione tipo de evento\" dialog with options for\
    \ \"ENTIDAD\" and \"CONDICION TEMPORAL\", with a \"CERRAR\" button and \"Evento\
    \ de entidad\" label with \"Repeticiones =? 3\" notation\n\nScreenshot 4: Shows\
    \ a diagram with numbered nodes (1, 2, 3) connected in sequence, with a counter\
    \ showing \"Contador 0\" and \"Entidad\" field with \"una entidad\" text, and\
    \ \"Repeticiones =? 3\" label with \"CANCELAR\" button\n\nScreenshot 5: Shows\
    \ \"Seleccionar entidad\" dialog with two options: \"Local\" and \"Red\", with\
    \ a \"CLOSE\" button at bottom]\" [F2]\n\n---\n\U0001F4D6 **Obligaciones de evidencia\
    \ del manual:**\n- \"Seleccione el elemento de cualquiera de los dos cuadrid de\
    \ la maniobra, eventos o acciones y pulse este botón para borrarlo,\" (CAD-250_Manual-software-configuracion-MS-416-es-2026-b,\
    \ p. 56) [F10]\n- \"**Editar.** Seleccione el elemento de cualquiera de los dos\
    \ cuadrid de la maniobra, eventos o acciones y pulse este botón para entrar en\
    \ el menú de edición del elemento.\" (CAD-250_Manual-software-configuracion-MS-416-es-2026-b,\
    \ p. 56) [F10]"
