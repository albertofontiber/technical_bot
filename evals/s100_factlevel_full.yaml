- qid: hp020
  question: En la Notifier INSPIRE, ¿cómo se configuran las contraseñas de nivel 2
    y nivel 3?
  answer: "## Configuración de contraseñas Nivel 2 y Nivel 3 — INSPIRE E10/E15\n\n\
    ---\n\n### Información general\n\nEl código de acceso de fábrica para Nivel 2\
    \ es **\"22222222\"** [F3]. Se recomienda cambiarlo por uno exclusivo de entre\
    \ **4 y 8 dígitos** [F1][F2][F3].\n\n---\n\n### Cambiar contraseña de Nivel 2\
    \ (desde sesión Nivel 2)\n\nPuedes cambiar la contraseña de Nivel 2 si has iniciado\
    \ sesión como usuario de Nivel 2 [F1]:\n\n1. Selecciona el icono del menú ① y\
    \ selecciona **\"Configuración\"** ② [F2].\n2. Inicia sesión como usuario de **nivel\
    \ de acceso 2** [F2].\n3. Selecciona la opción **\"Cambio del código de acceso\"\
    ** ③ [F2].\n4. Asegúrate de que **Nivel de Acceso 2** ④ esté seleccionado y que\
    \ el cursor parpadee ⑤ [F2].\n5. Puedes ver la entrada haciendo clic en el **icono\
    \ del ojo** ⑥ [F2].\n6. Introduce el nuevo código de acceso (4–8 caracteres) con\
    \ el teclado ⑦ [F2].\n7. Confirma seleccionando el símbolo **✓** ⑧ [F2].\n8. Repite\
    \ los pasos 3 a 6 para confirmar la entrada [F2].\n\n---\n\n### Cambiar contraseña\
    \ de Nivel 2 y/o Nivel 3 (desde sesión Nivel 3)\n\nSi estás en Nivel 3, puedes\
    \ cambiar el código de acceso del **Nivel 2 o del Nivel 3** [F1]:\n\n1. Selecciona\
    \ el icono del menú ① y selecciona **\"Ajustes\"** ② [F1].\n2. Inicia sesión como\
    \ usuario de **nivel de acceso 3** [F1].\n3. Selecciona la opción **\"Cambio del\
    \ código de acceso\"** ③ [F1].\n4. Asegúrate de que el **Nivel de Acceso 2 o 3**\
    \ ④ esté seleccionado y que el cursor parpadee ⑤ [F1].\n5. Puedes ver la entrada\
    \ haciendo clic en el **icono del ojo** ⑥ [F1].\n6. Introduce el nuevo código\
    \ de acceso (4–8 caracteres) con el teclado ⑦ [F1].\n7. Confirma seleccionando\
    \ el símbolo ⑧ [F1].\n8. Repite los pasos 3 a 6 para confirmar la entrada [F1].\n\
    9. Observa el mensaje **\"Cambio de código de acceso satisfactorio\"** y selecciona\
    \ **Aceptar** [F1].\n\n---\n\n### ⚠️ Paso adicional obligatorio tras el cambio\n\
    \nDespués de cambiar cualquier contraseña, debes [F1]:\n- **Sincronizar** el programa\
    \ con la central.\n- Realizar una **copia de seguridad del cambio del código de\
    \ acceso en la nube**.\n\n---\n\n### Nota de seguridad\n\n> El sistema cierra\
    \ sesión automáticamente del Nivel 2 si los controles no se utilizan durante **5\
    \ minutos**, volviendo al Nivel 1 [F3]. Asegúrate de que los códigos de acceso\
    \ se mantienen seguros y solo los conocen usuarios autorizados [F3].\n\n---\n\n\
    **Fuentes:**\n- HOP-138-8ES issue 6_01-2026 (Instrucciones de puesta en marcha)\
    \ — sin revisión registrada\n- HOP-338-9ES issue 4_01-2026 (Instrucciones de usuario)\
    \ — sin revisión registrada\n\n---\n\U0001F4CB **Información adicional del manual:**\n\
    - Nota: el manual también indica: \"Se recomienda cambiar la contraseña del código\
    \ de acceso al nivel de acceso 2/3 contraseña a uno exclusivo que tenga entre\
    \ 4 y 8 dígitos.\" [F1] · \"- Menu icon ① leading to \"Configuraciones\"\n- \"\
    Configuraciones\" screen showing \"Configuración del sistema, red, datos y hora,\
    \ programa de mantenimiento, etc\" ②\n- Arrow pointing to \"Cambio de contraseña\"\
    \ option ③\n- \"Introduzca nueva contraseña\" dialog box with:\n  - \"Acceso Nivel\
    \ 2\" dropdown ④\n  - Password input field ⑤\n  - \"Min:4 digitos,Max:8 digitos\"\
    \ text with eye icon ⑥\n  - Numeric keypad showing numbers 1-9, 0, backspace icon,\
    \ and checkmark icon ⑧\n  - Backspace arrow ⑦]\" [F1]"
