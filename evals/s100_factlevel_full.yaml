- qid: hp018
  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  answer: '# Conexión de sirenas convencionales en salidas de sirena de la Morley
    ZXe


    Los circuitos de sirena de la ZXe son salidas supervisadas y limitadas en corriente.
    Aquí tienes los puntos clave para el conexionado:


    ---


    ## Requisitos previos del circuito


    - **Cada sirena debe tener un diodo integrado** para evitar consumo en polarización
    inversa durante la supervisión [F2]. Si conectas dispositivos no polarizados (campanas
    sin polaridad), deberás añadir diodos de polarización y protección en cada uno
    [F2].

    - **Resistencia de Final de Línea (RFL): 6.800 Ω, 0,5 W mínimo** (Ref: 170-073-682)
    instalada en la última sirena del circuito [F4].

    - **No realizar ramales** en la línea de sirenas: la supervisión se realiza en
    la línea directa hasta la RFL; los ramales paralelos no quedan supervisados [F6].

    - **No enrollar el cable en los terminales**: cortar y empalmar adecuadamente
    para mantener la supervisión [F1].


    ---


    ## Principio de supervisión


    El circuito se polariza en **inverso en reposo** para supervisar la línea. Al
    activarse la alarma, la polaridad se invierte a la normal, permitiendo el funcionamiento
    de las sirenas [F2]. Las salidas están supervisadas para **circuito abierto y
    cortocircuito** [F4].


    ---


    ## Terminales de conexión


    Los terminales de sirena en la ZXe (modelo ZX2e) están identificados como **SIRENA
    A (+) / SIRENA A (−)** y **SIRENA B (+) / SIRENA B (−)** [F1]. Consulta la **Figura
    13** del manual para la ubicación física del bloque de terminales en la placa
    del ZX2e [F2].


    ---


    ## Capacidad de los circuitos


    - **Consumo máximo por circuito: 1 A** [F4].

    - El máximo total entre los dos circuitos (A y B) del ZX2e es también **1 A**
    [F4].


    > ⚠️ La corriente de sirena disponible depende de la carga de alarma **completa**
    del panel y **debe** verificarse mediante el programa de cálculo de lazo y baterías
    [F4].


    ---


    ## Longitud y sección de cable


    - **No se recomienda longitud superior a 1 km**: la capacitancia e inductancia
    del lazo pueden afectar al funcionamiento [F1].

    - Verifica que la sección del cable sea adecuada para garantizar la tensión correcta
    en las sirenas tanto en alimentación principal como en **mínima tensión de baterías**
    (consulta las Tablas 10 y 11 del manual) [F1].


    ---


    ## Esquema de conexionado


    El manual describe el circuito en la **Figura 15** como dos circuitos paralelos
    (Sirena A y Sirena B), cada uno con las sirenas conectadas en la línea y terminados
    con la RFL de 6.800 Ω [F1]. Para el detalle visual del conexionado, consulta directamente
    la **Figura 15 – Circuito de sirenas convencionales** del documento MIE-MI-530
    [F1].


    ---


    Fuente: Manual de Instalación Paneles de Incendio ZX2e / ZX5e — Documento MIE-MI-530,
    Revisión 001 (MIE-MI-530rv001)


    ---

    📋 **Obligaciones de evidencia del manual:**

    - Nota: la fuente es inconsistente: "* El panel de detección y control de incendio
    ZX5Se tiene 4 circuitos de sirenas supervisados y limitados en corriente, identificados
    como circuitos de sirena A, B, C y D." (MIE-MI-600, p. 24) [F4] declara 4 circuitos
    y la enumeración servida lista 2 (MIE-MI-600, p. 24) [F4].

    - Nota: la fuente es inconsistente: "El máximo permitido entre los 4 circuitos
    de sirena de ZX5Se es de 2A." (MIE-MI-600, p. 24) [F4] declara 4 circuitos y la
    enumeración servida lista 2 (MIE-MI-600, p. 24) [F4].'
