- qid: hp013
  question: ¿Cómo se cambia la batería tampón de la Detnov ADW535 sin perder configuración?
  answer: 'Los fragmentos disponibles no contienen el procedimiento de sustitución
    de la batería de litio del ADW 535.


    Lo que sí confirman los fragmentos es que:


    - La batería de litio está ubicada en la **Main Board LMB 35** [F2][F3].

    - Existe un parámetro de fallo denominado **"Fallo batería de litio / reloj"**
    configurable en las posiciones *X01 a X03* [F1].

    - En la primera puesta en funcionamiento se indica retirar la **cinta aislante
    de la batería de litio** del LMB 35 [F6], pero no se describe el procedimiento
    de sustitución posterior.

    - Respecto a la conservación de configuración: el manual indica que los parámetros
    programados **se mantienen** tras un reset de hardware (interrupción de tensión
    momentánea) [F5], pero no especifica si esto aplica también durante la sustitución
    física de la batería.

    - El manual advierte que si se sustituye una **unidad de evaluación completa**,
    es necesario reajustar todas las configuraciones específicas del cliente desde
    cero [F4].


    **El manual no especifica el procedimiento paso a paso para cambiar únicamente
    la batería de litio ni confirma explícitamente si la configuración se preserva
    durante esa operación.**


    Recomendación: Contacta directamente con el soporte técnico de **Securiton/Detnov**
    o consulta el manual completo físico (T 140 358 e es), ya que los fragmentos recuperados
    no cubren este procedimiento.


    Fuente: ADW535_TD_T140358es_e (sin revisión registrada)


    ---

    ⚠️ **Información adicional del manual:**

    - "* Justo antes del primer encendido del ADW 535, debe retirarse la cinta aislante
    de la batería de litio (LMB 35)." [F6]

    - "* Antes del encendido deben montarse en la unidad de evaluación todos los módulos
    adicionales y conectarse al Main Board LMB 35 mediante el cable plano suministrado."
    [F6]'
