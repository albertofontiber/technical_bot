- qid: cat018
  question: ¿Como se programa una ecuacion causa-efecto (CBE) en la Notifier AM-8200
    para que un evento active una salida?
  answer: "# Programación de ecuación CBE en AM-8200 para activar una salida\n\nLa\
    \ CBE (Control By Event) se programa en la **Pestaña Programación** del punto\
    \ de salida (módulo de salida), en el campo **CBE** [F1]. A continuación el procedimiento\
    \ completo:\n\n---\n\n## Paso 1 — Navegar al módulo de salida\n\nAccede a **MENU\
    \ PROGRAMMAZIONE → Punti → Módulos** y localiza el módulo de salida que quieres\
    \ activar [F6].\n\n---\n\n## Paso 2 — Acceder al campo CBE\n\n1. Dentro del módulo,\
    \ ve a la **Pestaña Programación** [F1].\n2. Con las teclas **▲▼** selecciona\
    \ el campo **CBE** [F1].\n3. Pulsa la tecla de confirmación **☑** para entrar\
    \ en edición [F1].\n\n---\n\n## Paso 3 — Escribir la ecuación CBE\n\nUsa el teclado\
    \ alfanumérico para introducir la ecuación [F1]. La **longitud máxima es de 64\
    \ caracteres** [F1].\n\nLos operadores disponibles son [F8]:\n\n- **OR (Gxxx Gyyy\
    \ ...)** — Se activa si AL MENOS UN grupo está en alarma.\n  Ejemplo: `OR (G9\
    \ G15 G23)` → el módulo se activa si cualquiera de los tres grupos entra en alarma.\
    \ También es válido omitir OR y escribir directamente `(G9 G15 G23)` [F8].\n\n\
    - **AND (Gxxx Gyyy ...)** — Se activa solo si TODOS los grupos están en alarma.\n\
    \  Ejemplo: `AND (G9 G15 G23)` [F8].\n\n- **NOT (Gxxx)** — Niega el operando.\
    \ El módulo permanece activo hasta que el grupo entre en alarma.\n  Ejemplo: `NOT\
    \ (G23)` [F8].\n\n- **XGRP (Gxxx)** — Se activa cuando AL MENOS DOS elementos\
    \ del grupo indicado están activos [F9].\n  Ejemplo: `XGRP (G23)` [F9].\n  ⚠️\
    \ **No se permite** usar más de un grupo con XGRP: `XGRP (G23 G24)` no es válido\
    \ [F9].\n\n---\n\n## Paso 4 — Confirmar la ecuación\n\nPulsa **Enter** para confirmar\
    \ la ecuación introducida [F1].\n\n---\n\n## Reglas importantes a tener en cuenta\n\
    \n- **Si el módulo de salida tiene un TIPO ID para señalizaciones de carácter\
    \ general, la central NO permite programarle una ecuación CBE** [F8].\n- Para\
    \ grupos directos: no se permite que los operandos dentro del paréntesis sean\
    \ grupos con índice **menor** que el grupo al que se asocia la CBE.\n  Ejemplo\
    \ no permitido: `G33 = (G23 G24)` → Correcto: `G21 = (G23 G24)` [F8].\n- Para\
    \ grupos inversos: no se permite que los operandos sean grupos con índice **mayor**\
    \ que el grupo al que se asocia la CBE.\n  Ejemplo no permitido: `G305 = (G306\
    \ G307)` → Correcto: `G307 = (G305 G306)` [F8].\n\n---\n\n## Ejemplo práctico\
    \ completo\n\nSi necesitas activar un módulo de salida cuando cualquiera de los\
    \ grupos G9, G15 o G23 entre en alarma [F8]:\n\n`OR (G9 G15 G23)`\n\nSi la memoria\
    \ no permite un OR de muchos grupos, puedes usar grupos inversos intermedios [F10]:\n\
    \n- `G301 = OR (G1 G2 G3 G4 G5 G6 G7 G8)`\n- `G302 = OR (G9 G10 G11 G12 G13 G14\
    \ G15 G16)`\n- `L01M01 = CBE = OR (G301 G302)` [F10]\n\n---\n\n> ⚠️ El manual\
    \ remite al **Apéndice «A» Control By Event** al final del manual para la referencia\
    \ completa de las ecuaciones CBE [F1]. Consulta ese apéndice para casos avanzados\
    \ no cubiertos en estos fragmentos.\n\n**Fuente:** AM-8200 Manual de programación\
    \ — Doc. M-162.1-AM8200-ESP Rev A.3 (Honeywell Life Safety Iberia)\n\n---\n⚠️\
    \ **Información adicional del manual:**\n- \"Si, por el contrario, el dispositivo\
    \ en cuestión es un módulo de salida, esta salida no se activará nunca, a no ser\
    \ que se programe con software TIPO ID para señalizaciones generales.\" [F8]\n\
    - \"**Zona** - número de zona asignada\n\n**CBE** - ecuación CBE del punto.\"\
    \ [F1]"
