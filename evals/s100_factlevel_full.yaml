- qid: hp011
  question: En la Morley RP1r, después de descargar la extinción el sistema no vuelve
    a estado normal tras resetear. ¿Qué comprobar?
  answer: '## RP1r-Supra: Sistema no vuelve a estado normal tras resetear después
    de extinción


    El problema más probable es que persiste alguna condición de avería o entrada
    activa que impide el rearme completo. Comprueba lo siguiente:


    ---


    ### 1. Verifica el estado del LED "Extinción Realizada"


    Tras la descarga, el LED "Extinción Realizada" queda iluminado de forma **fija**
    [F4][F5]. Este estado es normal y **no desaparece solo** — requiere rearme manual
    desde nivel de acceso 2 pulsando la tecla "Rearme" [F2].


    Confirma que estás accediendo con **nivel 2** antes de pulsar Rearme [F2].


    ---


    ### 2. Comprueba si el pulsador de PARO (ABORT) fue accionado


    El circuito de paro (bloque **D / ABORT SWITCH**) es el único que **siempre requiere
    rearme manual** y NO admite rearme automático [F3][F6]. Si fue accionado durante
    la secuencia:


    - LED "Avería en paro": **intermitente** [F3]

    - LED "Paro": **fijo** [F3]


    Mientras esta condición esté activa, el sistema no volverá a estado normal. Comprueba
    físicamente que el pulsador de paro está liberado y en posición correcta antes
    de rearmar.


    ---


    ### 3. Revisa si hay averías en circuitos supervisados que bloqueen el rearme


    Comprueba los LEDs de avería de los circuitos supervisados [F3][F6]. Si alguno
    está **intermitente**, hay una condición de avería activa. Los circuitos a revisar
    son:


    - **CCT EXT 1 / CCT EXT 2** (bloques 1 y 2): avería en circuito de extinción

    - **SND1 / SND2** (bloques 5 y 6): sirenas en fallo/anuladas

    - **AUX. MAN. REL. / MANUAL REL.2** (bloques A y B): extinción manual

    - **HOLD MAN. REL.** (bloque C): pulsador de espera

    - **Z1, Z2, Z3** (bloques E, F, G): zonas de detección

    - **LOW PRESS SWITCH** (bloque H): presión baja

    - **FLOW PRESS SWITCH** (bloque I): señal de flujo


    > ⚠️ **Importante:** Todas las averías son, **por defecto, enclavadas y requieren
    rearme manual** para su restablecimiento [F2]. La excepción es el circuito de
    paro (ABORT), que siempre requiere rearme manual sin posibilidad de configurarlo
    como automático [F2][F3].


    ---


    ### 4. Comprueba el parámetro de inhibición de rearme [F.1]


    Según la norma **UNE-EN 12094-1:2004, sección 4.12.2**, es posible inhibir temporalmente
    la función de rearme una vez que el control está ACTIVADO [F1]. Si el parámetro
    **[F.1]** tiene configurado un período de inhibición, el rearme no será posible
    hasta que ese tiempo expire [F1]. Consulta la sección **5. Configuración de la
    central** del manual para verificar este parámetro [F1].


    ---


    ### Resumen de comprobaciones en orden:


    1. Accede con **nivel 2** y pulsa "Rearme" [F2]

    2. Verifica que el pulsador **ABORT** está liberado (bloque D) [F3][F6]

    3. Revisa todos los LEDs de avería — elimina la causa física de cualquier avería
    activa antes de rearmar [F3][F6]

    4. Comprueba si el parámetro **[F.1]** tiene activo un período de inhibición de
    rearme [F1]


    ---


    Fuentes:

    - HLSI-MN-103_RP1r-Supra_lr (rev. v.07, 2018-05-01)

    - HLSI-MN-103I_RP1r-Supra_lr (sin revisión registrada)'
