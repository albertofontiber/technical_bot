- qid: hp012
  question: ¿Cuántos lazos direccionables soporta la Notifier AM2020/AFP1010 y cuántos
    dispositivos por lazo?
  answer: '## Capacidad de lazos y dispositivos — AM2020 / AFP1010


    ### AM2020


    - **Número máximo de lazos SLC: 10** [F6]

    - **Dispositivos por lazo:** hasta **99 detectores analógicos** + hasta **99 módulos**
    (monitores o de control) [F6]

    - Los lazos se implementan con tarjetas **LIB-200**, **LIB-200A** (un lazo cada
    una) o **LIB-400** (dos lazos por tarjeta) [F4]

    - Combinaciones válidas: de 1 a 5 LIB-400, o de 1 a 10 LIB-200/LIB-200A, o combinación
    de ambas [F4]


    ### AFP1010


    - **Número máximo de lazos SLC: 4** (máximo dos LIB-400, lo que da un total de
    cuatro SLCs) [F4]

    - **Número máximo de dispositivos en el sistema: 396** (con un máximo de dos LIB-200)
    [F1]

    - **Dispositivos por lazo:** hasta **99 detectores inteligentes** + hasta **99
    módulos** (monitores o de control) [F4]


    ### Resumen comparativo


    - **AM2020:** hasta **10 lazos SLC**, con **99 detectores + 99 módulos por lazo**

    - **AFP1010:** hasta **4 lazos SLC** (2× LIB-400), con **99 detectores + 99 módulos
    por lazo**


    ---


    Fuentes: Manual 15088SP (sin revisión registrada); MFDT280 (sin revisión registrada);
    MPDT280 rev. Rev A


    ---

    📖 **Información adicional del manual:**

    - "Durante el estado de alarma de incendio, entre 9 y 99 LEDs de equipos direccionables
    (detectores de humo, detectores de calor, módulos MMX, etc.) puede estar permanentemente
    activados." [F6]


    ---

    📋 **Obligaciones de evidencia del manual:**

    - Nota: la fuente es inconsistente: "La AM2020 puede soportar hasta 10 lazos,
    cada uno de los cuales soporta hasta 99 detectores analógicos y 99 módulos monitores
    o de control." (MFDT280, p. 4) [F6] declara 10 lazos y la enumeración servida
    lista 3 (MFDT280, p. 4) [F6].

    - Nota: la fuente es inconsistente: "La figura 13 representa un gabinete CAB-A3
    utilizado con los módulos del LIB-400 exclusivamente, lo que significa que puede
    dar alojo a un máximo de cuatro lazos del sistema AFP1010." (15088SP, p. 30) [F7]
    declara 4 lazos y la enumeración servida lista 2 (15088SP, p. 30) [F7].

    - Derivación declarada según (15088SP, p. 61) [F4]: 4 × (99 + 99) = 792 — operandos
    citados: "total de cuatro SLCs", "hasta 99 detectores" y "hasta 99 estaciones".'
