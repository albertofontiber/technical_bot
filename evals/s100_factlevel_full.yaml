- qid: hp014
  question: ¿Cómo se conecta un módulo de aislamiento de línea en un lazo ID2000?
  answer: "## Conexión del módulo de aislamiento de línea en lazo ID2000\n\nLos fragmentos\
    \ disponibles no incluyen el esquema de conexionado físico pin a pin del módulo\
    \ aislador (ese detalle aparece en las instrucciones propias del módulo), pero\
    \ sí recogen los requisitos de instalación y el procedimiento de verificación\
    \ del lazo. Aquí tienes todo lo que el manual especifica:\n\n---\n\n### Requisitos\
    \ de instalación de aisladores\n\n- Los aisladores deben instalarse entre un **máximo\
    \ de 32 equipos de lazo** para cumplir la norma **EN54-2: 12.5.2** [F5].\n- En\
    \ la central **ID2000**, el límite es más restrictivo: **no más de 25 equipos\
    \ entre aisladores** (o **20 equipos si se utilizan aisladores tipo FET**) [F5].\n\
    - Las comprobaciones de continuidad del lazo **deben realizarse antes de conectar\
    \ los aisladores** [F5].\n\n---\n\n### Procedimiento de verificación del lazo\
    \ con aisladores instalados\n\n1. **Antes de conectar el cableado al panel**,\
    \ desconecta temporalmente los aisladores cortocircuitando los **terminales 2\
    \ y 4** de cada aislador [F3].\n\n   > ⚠️ El cableado del lazo **DEBE estar desconectado\
    \ del panel** mientras realizas este procedimiento [F3].\n\n2. Comprueba la continuidad\
    \ de cada extremo del lazo y mide la resistencia final de línea. Verifica que\
    \ es inferior a [F3]:\n   - **Placa base y LIB con detección de dirección duplicada:**\
    \ 14,5 Ω\n   - **Placa base y LIB sin detección de dirección duplicada:** 28,5\
    \ Ω\n   - **Placa base y LIB con detección de dirección duplicada (segundo rango):**\
    \ 18,5 Ω\n   - **Placa base y LIB sin detección de dirección duplicada (segundo\
    \ rango):** 35,5 Ω\n\n3. Con multímetro en **polaridad invertida** (+ al lazo\
    \ − y − al lazo +), verifica que aparece un número de diodos polarizados en paralelo\
    \ [F3].\n\n4. Con multímetro en **polaridad normal** (+ al lazo + y − al lazo\
    \ −), comprueba que la resistencia aumenta progresivamente a medida que se cargan\
    \ los condensadores de los equipos. Si indica un único diodo polarizado, hay un\
    \ equipo con polaridad invertida o cableado cruzado [F3].\n\n5. Comprueba que\
    \ **no hay continuidad entre el cable de pantalla y el positivo (+) ni el negativo\
    \ (−)** del cable. La pantalla solo debe conectarse a tierra en el panel [F3].\n\
    \n---\n\n### Conexión del cableado al panel (tras verificaciones)\n\n1. **Retira\
    \ las conexiones temporales** (cortocircuitos) de los terminales 2 y 4 de cada\
    \ aislador [F1].\n2. Conecta el cableado del lazo al panel. **Verifica la polaridad**:\
    \ los extremos marcados como **A** y **B** deben conectarse en los terminales\
    \ correspondientes [F1].\n\n---\n\n### Longitud máxima del lazo\n\n- La longitud\
    \ total del par de lazo de comunicaciones **no puede exceder los 2000 metros**,\
    \ y solo si se utiliza **cable de 1,5 mm² de sección o superior** [F3].\n\n---\n\
    \n### Nota importante sobre el conexionado físico del aislador\n\nEl manual indica\
    \ que los equipos (sensores y módulos) **van acompañados de instrucciones propias\
    \ en las que se muestran las interconexiones adecuadas para cada aplicación**\
    \ [F5]. Para el detalle del conexionado pin a pin del módulo aislador concreto\
    \ (terminales 1, 2, 3, 4), consulta las instrucciones de instalación del propio\
    \ módulo aislador.\n\n---\n\n**Fuente:** Panel ID2000 - Manual de instalación\
    \ y puesta en marcha, MIDT180 (rev. MI-DT-180, 2003-03-31)\n\n---\n⚠️ **Información\
    \ adicional del manual:**\n- \"> ⚠️ **NO utilice NUNCA un multímetro de alta tensión\
    \ en el lazo.**\" [F5]\n- \"> ⚠️ **¡NUNCA conecte las baterías antes que la fuente\
    \ de alimentación!**\" [F1]"
