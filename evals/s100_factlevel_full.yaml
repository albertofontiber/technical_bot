- qid: hp006
  question: La Notifier AFP-400 muestra el aviso 'Tierra' (Earth Fault). ¿Qué significa
    y cómo se localiza?
  answer: '## Fallo de Tierra (Earth Fault) en la AFP-400


    El aviso **''Tierra''** indica que existe una fuga a tierra en algún conductor
    del sistema — ya sea del lazo SLC, de los circuitos de aviso (NAC) o del cableado
    de alimentación. En el SLC, una falla de tierra genera condición de **Alarma/Problema**
    independientemente del estilo de circuito (Estilo 4, 6 o 7) [F9].


    ---


    ### ¿Cómo se presenta en el panel?


    El LED **"Avería del Sistema"** (amarillo) parpadea cuando la avería no está reconocida,
    y se ilumina fijo cuando se reconoce [F1]. Para desactivarlo hay que **eliminar
    la condición de avería** [F1].


    ---


    ### Localización del fallo de tierra


    **1. Identificar la zona afectada**


    Accede al menú de **Lectura de Estados** sin necesidad de clave de acceso [F10]:


    1. Pulsa `<Enter>` → aparece la pantalla de menú [F10]

    2. Pulsa `<2>` para entrar en "Leer Estados" [F10]

    3. Pulsa `0` + `<Enter>` → selecciona "Leer Puntos" [F10]

    4. Selecciona `SENSOR`, `MÓDULO`, `EQUIPO` o `Z` e introduce la dirección del
    equipo o zona [F10]


    Esto te permitirá identificar qué punto o zona está reportando la condición anormal.


    **2. Verificar el LED de fallo de tierra en la MPS-400**


    La placa de alimentación **MPS-400** dispone de un **LED específico de "Fallo
    de Tierra"** [F2]. Comprueba visualmente si está encendido para confirmar que
    el fallo está en el circuito de alimentación.


    **3. Revisar el jumper de inhibición de detección de tierra**


    En la MPS-400 existe el puente **JP2**: cortarlo inhabilita la detección de falla
    de tierra [F4]. Verifica que no esté cortado accidentalmente, lo que podría enmascarar
    el fallo.


    **4. Inspección física del cableado**


    Revisa el cableado de los circuitos afectados:

    - Lazo SLC: busca conductores pelados o en contacto con masa metálica

    - Circuitos NAC (TB7–TB10): comprueba los conductores de aviso [F2]

    - Alimentación AC (TB1): verifica el cableado de entrada [F2]


    ---


    ### Nota importante sobre el SLC


    En el lazo SLC, la condición de **"Tierra"** genera **Alarma/Problema** en los
    tres estilos de circuito (Estilo 4, Estilo 6 y Estilo 7) [F9]. Esto significa
    que además del aviso de avería, puede haberse generado una señal de alarma — verifica
    el histórico del panel.


    ---


    Fuente: MFDT170 (sin revisión registrada); MIDT170 (sin revisión registrada);
    50253SP (sin revisión registrada)


    ---

    📖 **Información adicional del manual:**

    - "- **TB1** (top left): Terminal block with connections labeled TB1

    - **TB2** (top center): Terminal block labeled TB2

    - **TB3-TB6** (top right): Terminal blocks labeled TB3-TB6

    - **TB7-TB10** (far right): Terminal blocks labeled TB7-TB10

    - **Interruptor de Selección de Voltaje 115V/230V** (left side): Voltage selection
    switch

    - **Circuitos de Aviso y Señalizaciones 1-4** (right side): Alarm and signaling
    circuits 1-4

    - **Fallo de Tierra** (right side): Ground fault indicator

    - **Activación de la Alimentación AC** (right side): AC power activation

    - **Placa de Alimentación de la MPS-400** (bottom center): MPS-400 power supply
    board" [F2]

    - "**TB7–TB10** – NAC (Circuitos de Aviso/ Extinción)


    1) + NAC/Salida de Extinción (salida)

    2) – NAC/Salida de Extinción (salida)

    3) + Clase A (retorno)

    4) – Clase A (retorno)


    **TB3-TB6** – Contactos Secos


    1) Com

    2) NC

    3) NO" [F2]'
