- qid: cat007
  question: En el detector por aspiración FAAST LT-200, ¿qué salidas de relé y de
    sirena tiene y con qué contactos, cómo se comporta el relé de avería ante un fallo
    o un corte de alimentación, qué resistencia de fin de línea llevan las salidas
    de sirena y cuál es la especificación eléctrica de los contactos de relé?
  answer: '## Salidas de relé y sirena del FAAST LT-200


    El equipo dispone de **relés de alarma, avería y sirena** (y prealarma en la variante
    Stand Alone), con contactos NC, C y NA por canal, y salidas de sirena supervisadas
    con resistencia de fin de línea.


    ---


    ### 1. Relés disponibles y su comportamiento


    Los fragmentos cubren dos variantes del LT-200 con diferencias en los relés disponibles:


    #### Variante Loop (conexión a lazo de central)


    - **Relé de ALARMA 1 y 2**: Controlado por la central cuando determina la condición
    de alarma. Se activa y desactiva por la central; **no está enclavado** [F3].

    - **Relé de AVERÍA 1 y 2**: Se activa ante condición de avería en canal 1, canal
    2 o avería común. También se activa en **modo de servicio** y cuando **se desconecta
    la alimentación** de la unidad. **El estado de avería no está enclavado** [F3].

    - **Relé de SIRENA 1 y 2**: Se activa cuando el canal correspondiente entra en
    ALARMA. Sirena 1 → Canal 1; Sirena 2 → Canal 2. Estado predeterminado = activado
    en ALARMA [F3].


    #### Variante Stand Alone (autónoma)


    - **Relé de ALARMA 1 y 2**: Se activa cuando se cumple la condición de alarma
    en el canal. Condición predeterminada = Nivel 1. **El estado de alarma está enclavado
    por defecto; se requiere REARME manual** para desactivar el LED y el relé [F4].

    - **Relé de PREALARMA 1 y 2**: Se activa cuando se cumple la condición de prealarma
    en el canal. Condición predeterminada = Nivel 1. Nota: cuando PREALARMA = ALARMA
    = Nivel 1, la prealarma se activará al **70 % del nivel 1** [F4].

    - **Relé de AVERÍA 1 y 2**: Igual que en la variante Loop — avería en canal 1,
    canal 2 o avería común, modo de servicio y corte de alimentación. **El estado
    de avería no está enclavado (predeterminado)** [F4].

    - **Relé de SIRENA 1 y 2**: Se activa cuando el canal está en ALARMA o PREALARMA.
    Sirena 1 → Canal 1; Sirena 2 → Canal 2. Estado predeterminado = activado en ALARMA
    [F4].


    ---


    ### 2. Contactos de los relés (terminales de cableado)


    #### Variante Loop — terminales [F8]


    **Relé de alarma:**

    - Terminal 5: Relé de alarma **NC** — Canal 1

    - Terminal 6: Relé de alarma **C** — Canal 1

    - Terminal 7: Relé de alarma **NA** — Canal 1

    - Terminal 8: Relé de alarma **NC** — Canal 2

    - Terminal 9: Relé de alarma **C** — Canal 2

    - Terminal 10: Relé de alarma **NA** — Canal 2


    **Relé de avería:**

    - Terminal 11: Relé de avería **NC** — Canal 1

    - Terminal 12: Relé de avería **C** — Canal 1

    - Terminal 13: Relé de avería **NA** — Canal 1

    - Terminal 14: Relé de avería **NC (AUX.)** — Canal 2

    - Terminal 15: Relé de avería **C (AUX.)** — Canal 2

    - Terminal 16: Relé de avería **NA (AUX.)** — Canal 2


    #### Variante Stand Alone — terminales [F9]


    **Relé de alarma:**

    - Terminal 5: Relé de alarma **NC** — Canal 1

    - Terminal 6: Relé de alarma **C** — Canal 1

    - Terminal 7: Relé de alarma **NA** — Canal 1

    - Terminal 8: Relé de alarma **NC** — Canal 2

    - Terminal 9: Relé de alarma **C** — Canal 2

    - Terminal 10: Relé de alarma **NA** — Canal 2


    **Relé de avería:**

    - Terminal 11: Relé de avería **NC** — Canal 1

    - Terminal 12: Relé de avería **C** — Canal 1

    - Terminal 13: Relé de avería **NA** — Canal 1

    - Terminal 14: Relé de avería **NC (AUX.)** — Canal 2

    - Terminal 15: Relé de avería **C (AUX.)** — Canal 2

    - Terminal 16: Relé de avería **NA (AUX.)** — Canal 2


    **Relé de prealarma** (exclusivo de Stand Alone):

    - Terminal 23: Relé de prealarma **NC** — Canal 1

    - Terminal 24: Relé de prealarma **C** — Canal 1

    - Terminal 25: Relé de prealarma **NA** — Canal 1

    - Terminal 26: Relé de prealarma **NC** — Canal 2

    - Terminal 27: Relé de prealarma **C** — Canal 2

    - Terminal 28: Relé de prealarma **NA** — Canal 2


    ---


    ### 3. Salidas de sirena y resistencia de fin de línea


    Ambas variantes incluyen dos salidas de sirena con **resistencia de fin de línea
    de 47 kΩ** [F8][F9]:


    **Variante Loop** [F8]:

    - Terminal 17: Salida sirena 1 **−**

    - Terminal 18: Salida sirena 1 **+**

    - Terminal 19: Salida sirena 2 **−**

    - Terminal 20: Salida sirena 2 **+**


    **Variante Stand Alone** [F9]:

    - Terminal 17: Salida sirena 1 **−**

    - Terminal 18: Salida sirena 1 **+**

    - Terminal 19: Salida sirena 2 **−**

    - Terminal 20: Salida sirena 2 **+**


    ---


    ### 4. Especificación eléctrica de los contactos de relé


    - Potencia nominal de los contactos (carga resistiva CC): **máx. 2 A a 30 V CC**
    [F1][F2]

    - Potencia nominal de los contactos (carga resistiva CA): **máx. 0,5 A a 30 V
    CA** [F1][F2]

    - Vida útil: **mín. 10⁵ operaciones** [F1][F2]


    ---


    ### 5. Comportamiento del relé de avería ante fallo o corte de alimentación


    El relé de avería se activa en tres situaciones [F3][F4]:

    1. Condición de avería en **canal 1 o canal 2**

    2. **Avería común**

    3. Cuando la unidad está en **modo de servicio** o cuando se **desconecta la alimentación**


    En todos los casos, **el estado de avería no está enclavado** — no requiere rearme
    manual para volver al estado normal una vez resuelta la causa [F3][F4].


    ---


    **Fuentes:**

    - I56-6575-005_ES FAAST LT-200 Loop QIG (sin revisión registrada)

    - I56-6574-005_ES -HS Stand Alone FAAST LT-200 QIG (sin revisión registrada)

    - I56-6577-006_ES FAAST Notifier LT-200 QIG (sin revisión registrada)'
