  question: ¿Cómo se cablea el módulo de entrada M710 / MI-DMMI en el lazo, y qué
    resistencias necesita (fin de línea y modo 3 estados)?
  answer: '## Conexionado del M710 / MI-DMMI en el lazo


    ### Terminales de lazo (conexión estándar con aislador interno activo)


    - **T1:** Salida del lazo – [F6]

    - **T2:** Salida del lazo + [F6]

    - **T3:** Entrada del lazo – [F6]

    - **T4:** Entrada del lazo + [F6]


    > **Nota sobre el aislador interno:** Si **no** se necesita aislamiento de cortocircuitos,
    conecta la salida + del lazo al **terminal 5** en lugar del terminal 2. El terminal
    5 está conectado internamente con el terminal 4 (en el M710/M720) [F4] / con el
    terminal 2 (en el MI-DMMI según otra fuente) [F9]. Consulta el diagrama de tu
    manual para confirmar la conexión interna exacta de tu variante.


    ---


    ### Resistencia de fin de línea (EOL)


    - **Valor:** **47 kΩ** [F1][F8]

    - Modelo de referencia para el M710: **M200E-EOL-R** [F4]

    - Modelo de referencia para el MI-DMMIE: **M200-EOL-R** [F8]


    ---


    ### Modo 2 estados vs. 3 estados


    **Modo 2 estados:**

    - Cortocircuito en la entrada se señaliza como **alarma** [F1]

    - No se requiere resistencia adicional en serie con el contacto


    **Modo 3 estados:**

    - Permite distinguir cortocircuito como **avería** en lugar de alarma [F4][F6]

    - **Requisito:** Conectar una resistencia de **18 kΩ** en serie con cada conmutador/dispositivo
    que se desee supervisar [F1][F4][F6]

    - Modelo de referencia para el M710: **M200E-EOL-R18** [F4]

    - **Condición:** Solo disponible si el panel de control lo permite [F4][F6]


