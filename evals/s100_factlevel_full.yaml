- qid: cat023
  question: En el detector de humos por aspiración Securiton ASD532, ¿qué clases de
    sensibilidad según EN 54-20 ofrece y cómo se configura la monitorización del flujo
    de aire?
  answer: '## ASD 532 — Clases EN 54-20 y monitorización del flujo de aire


    ### Clases de sensibilidad según EN 54-20


    El ASD 532 cumple las tres clases de la norma **EN 54-20** [F8]:


    - **Clase A** — Sensibilidad muy alta

    - **Clase B** — Sensibilidad alta

    - **Clase C** — Sensibilidad normal


    La clase se determina en función del sensor de humo instalado y de la posición
    de conmutador seleccionada. Los tres sensores disponibles son [F1][F9]:


    - **SSD 532-1**: rango de sensibilidad de alarma **0,5 %/m hasta 10 %/m**

    - **SSD 532-2**: rango de sensibilidad de alarma **0,1 %/m hasta 10 %/m**

    - **SSD 532-3**: rango de sensibilidad de alarma **0,02 %/m hasta 10 %/m**


    La elección del sensor y el ajuste de sensibilidad dentro del rango se realiza
    siguiendo las indicaciones del cap. 4.4.4.3 o con el software **«ASD PipeFlow»**
    [F1].


    ---


    ### Configuración de la clase mediante posiciones de conmutador


    Las posiciones de conmutador normativas (homologadas EN 54-20) son [F3]:


    - **A11** → Clase A (límites normativos)

    - **b11 / b21** → Clase B (límites normativos)

    - **C11 / C21 / C31** → Clase C (límites normativos)


    Para detalles de cada posición, el manual remite a los **cap. 4.4.4.3 y 7.3.3**
    [F3].


    Si no se usa «ASD PipeFlow», se selecciona la posición de conmutador directamente
    en el ASD mediante el mando del **AMB 32** [F1]. Si se usa «ASD PipeFlow», el
    resultado se introduce en el software **«ASD Config»** y se memoriza en las posiciones
    **X01, X02 o X03** [F7].


    ---


    ### Monitorización del flujo de aire


    **Principio de medición:** método calorimétrico (técnica de medición de flujo
    en masa) [F2].


    **Puesta en marcha — registro de valores nominales:**

    El flujo de aire se registra durante el **reset inicial** con el conducto de aspiración
    intacto y limpio. Ese valor queda memorizado como **100 %** (valor nominal). El
    sistema crea electrónicamente una ventana de monitorización centrada en ese valor
    [F2].


    **Umbral normativo EN 54-20:**

    Una variación superior a **±20 %** (es decir, por debajo del **80 %** por obstrucción/suciedad,
    o por encima del **120 %** por rotura de tubo) dispara el aviso **«Fallo flujo
    de aire»** tras un tiempo de retardo de **300 s** (LS-Ü). Esto aplica a las posiciones
    de conmutador **A11 a C31** [F2].


    **Adaptaciones con «ASD Config»:**

    Se pueden ajustar el tamaño de la ventana de monitorización y el tiempo de retardo.
    Restricciones importantes [F7]:


    - Aumentar los valores de LS-Ü por encima de **±20 % / > 300 s** implica incumplimiento
    de EN 54-20 y requiere consulta con el fabricante.

    - El tamaño de la ventana **no debería quedar por debajo de ±20 %**. Si se reduce
    por debajo de ese valor, el tiempo de retardo debe aumentarse a **10 min como
    mínimo**.

    - Ventanas < ±20 % con tiempo de retardo ≤ 300 s aumentan el riesgo de avisos
    de fallo erróneos.


    **Posiciones W01–W44 (no normativas):**

    Estas posiciones cumplen la sensibilidad de alarma según EN 54-20 (clases A–C)
    pero **no están homologadas** en cuanto a la monitorización del flujo de aire
    [F2][F5]. Solo deben usarse previa consulta con el fabricante [F5][F7]. Los parámetros
    disponibles en estas posiciones son [F4]:


    - Tiempo de retardo: **10 min** o **60 min**

    - Desviación de ventana: **±20 %** o **±50 %**

    - Clases A, B y C con distintos límites de sistema (1, 2 o 3 según clase)


    El valor actual del flujo volumétrico puede consultarse en la posición de conmutador
    **V01** (valor en %) [F3].


    ---


    **Fuente:** ASD 532, Descripción técnica, T 140 421 a es (sin revisión registrada)


    ---

    📋 **Información adicional del manual:**

    - Nota: el manual también indica: "El detector de humos por aspiración ASD 532
    incluye dos lugares de montaje para módulos adicionales." [F9] · "* XLM 35 módulo
    SecuriLine eXtended

    * RIM 36 módulo de interfaz de relé con 5 relés

    * SIM 35 módulo de interfaz serial" [F9]


    ---

    📋 **Obligaciones de evidencia del manual:**

    - Nota: la fuente es inconsistente: "El detector de humos por aspiración ASD 532
    incluye dos lugares de montaje para módulos adicionales." (ASD532_TD_T140421es_a,
    p. 13) [F9] declara 2 lugares y la enumeración servida lista 3 (ASD532_TD_T140421es_a,
    p. 13) [F9].

    - "Según EN 54-20, debe notificarse como fallo toda variación del flujo de aire
    superior al ±20 %." (ASD532_TD_T140421es_a, p. 24) [F2]

    - "Con carácter general, para la instalación, el proyecto y el uso del detector
    de humos por aspiración ASD 532 serán aplicables las disposiciones y directrices
    específicas de cada país." (ASD532_TD_T140421es_a, p. 37) [F8]'
