- qid: cat011
  question: Necesito un detector de humos analógico direccionable «751» para una instalación
    Notifier; ¿cuál es el modelo correcto?
  answer: 'El sufijo «751» corresponde a varios modelos de Notifier según la tecnología
    de detección que necesites. Los fragmentos disponibles documentan los siguientes
    detectores de humo analógicos direccionables con ese sufijo:


    **Detectores ópticos (fotoeléctricos):**


    - **SDX-751** — Sensor óptico analógico de bajo perfil [F5]

    - **SDX-751E** — Sensor óptico de bajo perfil (variante E) [F6] [F10]

    - **SDX-751TEM** — Sensor combinado óptico + térmico fijo (58 °C), certificado
    EN54:2000 partes 5 y 7 y CEA4021 [F2] [F7]

    - **SDX-751EM** — Sensor óptico analógico direccionable (variante EM) [F1]


    **Detectores por ionización:**


    - **CPX-751** — Sensor iónico analógico de bajo perfil [F5] [F9]

    - **CPX-751E** — Sensor iónico analógico direccionable (variante E) [F4] [F6]


    **Detector láser:**


    - **FSL-751E** — Sensor de humo láser VIEW [F6]

    - **LPX-751** — Sensor de humo láser VIEW de bajo perfil [F6]


    **Detector multicriterio:**


    - **IRX-751TEM** — Sensor multicriterio SMART 3 [F6]

    - **IRX-751CTEM** — Sensor multicriterio SMART 4 [F6]


    **Detector intrínsecamente seguro (zonas ATEX):**


    - **IDX-751** — Sensor óptico analógico intrínsecamente seguro; requiere traductor
    IMX-1 y aislador galvánico Y772221 [F3] [F6]


    ---


    **Para elegir el modelo correcto, necesito que me confirmes:**


    1. **Tipo de detección** que requiere la instalación: solo humo óptico, combinado
    óptico+térmico, iónico, láser, multicriterio, o zona ATEX.

    2. **Central a la que se conectará** (AFP-400, AFP4000, ID50/60, AM-2020…), ya
    que la lista de compatibles varía por central.


    Por ejemplo, si la central es una **AFP-400**, el listado de compatibles incluye
    **CPX-751** y **CPX-551** pero no lista explícitamente el SDX-751E [F9]. Si es
    una **ID50/60**, el listado incluye **SDX-751TEM**, **SDX-751XXXX**, **CPX-751E**,
    **FSL-751E**, **LPX-751**, **IRX-751TEM** e **IRX-751CTEM** [F6].


    Dime la central y el tipo de detección y te indico el modelo exacto.


    ---


    Fuentes: I56-1306-002_SDX-751EM; I56-1320-001 SDX-751TEM; MNDT1020 (IDX-751, 15
    junio 2004); I56-0790-003_CPX-751E; MIDT230 (AFP4000); MIDT156 (ID50/60); MIDT170
    (AFP-400); MIDT260 (AM-2000); MNDT1025 (FSL-751E)


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "Todos los sensores analógicos de temperatura o humo se montan en una base B501
    para facilitar su instalación y sustitución." (MIDT230, p. 16) [F5]'
