- qid: cat005
  question: ¿Cuáles son las características técnicas de la central de detección de
    gas Fidegas CS4, y en qué se diferencian las versiones digital y analógica?
  answer: "# Central de Detección de Gas Fidegas CS4 — Características Técnicas\n\n\
    La CS4 es una central de alarmas para detección de gas disponible en dos versiones\
    \ (digital y analógica), con las siguientes especificaciones:\n\n---\n\n## Características\
    \ técnicas generales\n\n- **Tensión de alimentación:** 110–230 Vac, 50/60 Hz [F1]\n\
    - **Potencia:** 30 W, Clase II [F1][F8]\n- **Sensores:** hasta 4 conexiones en\
    \ modo analógico o digital [F1]\n- **Salidas:** 2 salidas conmutadas LP (relé\
    \ apto para 230 Vac) con contactos NA-C-NC [F1]\n- **Corriente máxima:** 250 mA\
    \ [F1]\n- **Rearme:** seleccionable manual o automático [F1]\n- **Dimensiones:**\
    \ 90 × 106 × 58 mm [F1]\n- **Peso:** 300 g [F1]\n- **Montaje:** carril DIN o armario\
    \ de superficie [F3]\n- **Firmware:** versión 1.2 (tanto en versión digital como\
    \ analógica) [F8][F2]\n\n---\n\n## Indicaciones\n\n- **LED verde PWR:** alimentación\
    \ presente (fijo) o corte de red (intermitente) [F3]\n- **LED bicolor ON/ALARM**\
    \ por sensor: presencia de sensor remoto (verde) / alarma (rojo) [F3]\n- **LED\
    \ amarillo ERROR** por sensor: avería de sensor remoto [F3]\n- **LED verde OUT1\
    \ y OUT2:** salida activa (verde) / desactivada (apagado) [F3]\n- **Avisador acústico:**\
    \ apoyo sonoro a las indicaciones ópticas [F3]\n\n---\n\n## Diferencias entre\
    \ versión digital y analógica\n\n**Código de producto:**\n- Versión digital: **3244**\
    \ [F1]\n- Versión analógica: **3270** [F1]\n\n**Tipo de entrada de señal:**\n\
    - Versión digital: entradas **0–10/15 V** [F3]\n- Versión analógica: entradas\
    \ **4–20 mA** [F3]\n\n**Sensores compatibles:**\n- Versión analógica [F2]:\n \
    \ - Sensores S/3 gases combustibles\n  - Sensores S/3 y S/2 gases tóxicos\n  -\
    \ Sensores S/10 gases tóxicos\n- Versión digital [F2]:\n  - Sensores S/10 gases\
    \ combustibles\n\n---\n\n## Funcionamiento — puntos clave\n\n- Tras el encendido,\
    \ el LED PWR parpadea durante **30 segundos** mientras las salidas OUT1 y OUT2\
    \ están en posición NA [F6]\n- El umbral de alarma es el **20% del fondo de escala**\
    \ [F6]\n- Las alarmas son enclavadas; si la concentración no ha disminuido, la\
    \ alarma puede silenciarse durante **24 horas** con el botón RESET sin poder rearmar\
    \ [F6]\n- En alarma, las salidas asignadas pasan a NA [F6]\n\n---\n\n> **Nota:**\
    \ El Fragmento 4 incluye diagramas de conexionado de los sensores S/3 (analógico\
    \ 4-20 mA) y S/10 combustibles (digital). Para el conexionado exacto, consulta\
    \ la figura de la sección 3 del manual físico.\n\n**Fuente:** Manual de Usuario\
    \ CS4 — Fidegas (Rev. 2, 10/2018), elaborado por C.A.E., S.L.\n\n---\n\U0001F4CB\
    \ **Obligaciones de evidencia del manual:**\n- Nota: la fuente es inconsistente:\
    \ \"Permite la conexión de hasta 4 sensores remotos simultaneos a través de sus\
    \ 4 entradas digitales (0-10/15 v) o analógicas (4-20 mA).\" (Manual-de-Usuario-CS4,\
    \ p. 4) [F3] declara 4 sensores y la enumeración servida lista 6 (Manual-de-Usuario-CS4,\
    \ p. 4) [F3].\n- \"Ningún sistema de detección de gas sustituye a una correcta\
    \ instalación y mantenimiento de los aparatos quemadores de gas y debe ser colocado\
    \ por una persona competente o un instalador autorizado.\" (Manual-de-Usuario-CS4,\
    \ p. 2) [F8]"
