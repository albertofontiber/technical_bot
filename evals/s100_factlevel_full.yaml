- qid: hp009
  question: ¿Cuál es la resistencia de fin de línea recomendada para los lazos de
    la central Morley ZXe?
  answer: 'La resistencia de fin de línea (RFL) para el **lazo RS-485** de la central
    **ZXe** es de **150 Ω, 0,5 W mínimo** [F1].


    Se coloca en los **extremos libres** del principio y final de la cadena (en topología
    abierta), entre los terminales A y B [F1].


    ---


    **Importante — dos tipos de lazo, dos valores de RFL distintos:**


    **Lazo RS-485 (red de centrales / periféricos):**

    - Resistencia RFL: **150 Ω, 0,5 W mínimo** [F1]

    - Se instala en los extremos libres del primer y último equipo de la cadena [F1]

    - Longitud máxima del lazo: **1,2 km** [F1]


    **Salidas de sirenas de placa (circuito de sirenas convencionales):**

    - Resistencia RFL: **6.800 Ω (6K8)** [F6] [F7]

    - Se instala al final de cada circuito de sirenas [F6]

    - Carga máxima por salida: **1 A** [F7]


    ---


    **Nota sobre topología en lazo abierto RS-485:**

    El manual indica que si el equipo extremo tiene el puente en posición **TERM ON**,
    este ya incorpora internamente una resistencia de 150 Ω, por lo que **no debes
    instalar además la RFL externa** en ese extremo [F3].


    ---


    Fuente: Manual de Instalación ZX2e/ZX5e — MIE-MI-530rv001 (rev. 001)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "Es imprescindible comprobar que no hay derivación entre los terminales A y
    B y que el lazo entra a un lado del conector y sale por el otro o termina en la
    resistencia RFL de 150 Ohmios." (MIE-MI-431rv2, p. 8) [F3]

    - "Es imprescindible comprobar que no hay conexión entre los terminales A y B
    y que el lazo entra a un lado del conector y sale por el otro o termina en la
    resistencia RFL de 150 Ohmios." (MIE-MI-310, p. 22) [F5]

    - "Debe instalarse siempre la resistencia RFL entre + y - de la ultima sirena
    para controlar la apertura o cierre de la línea de sirenas." (MIE-MP-210, p. 18)
    [F9]'
