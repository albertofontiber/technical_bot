- qid: hp008
  question: ¿Qué detectores de humo analógicos son compatibles con la Notifier ID3000?
  answer: 'Los detectores de humo analógicos compatibles con la ID3000 son los siguientes:


    **Detectores ópticos (humo por dispersión de luz):**

    - **SDX-751EM** — Óptico [F1][F3]

    - **SDX-751** — Óptico [F3]

    - **SDX-551E** — Óptico [F3]

    - **SDX-551THE** — Óptico [F3]

    - **HPX-751E** — Óptico HARSH/FILTREX [F1][F3]

    - **IDX-751** — Óptico intrínsecamente seguro HAZARD [F1][F3]


    **Detectores combinados óptico/térmico (multicriterio):**

    - **SDX-751TEM** — Optiplex, combinado térmico/humo [F1][F3]


    **Detectores iónicos:**

    - **CPX-751E** — Iónico bajo perfil [F1][F3]

    - **CPX-551E** — Iónico [F3]


    **Detectores de humo láser (VIEW™):**

    - **FSL-751E / LPX-751** — VIEW, humo láser de alta sensibilidad [F1][F3]


    **Detectores multicriterio SMART (óptico/térmico/IR/CO):**

    - **IRX-751CTEM** — SMART 4 [F3]

    - **IRX-751TEM** — SMART 3 [F3]


    **Detectores por rayo:**

    - **LPB500** (máximo 4 por lazo) [F3]

    - **LBP-700 / LBP-700T** [F3]


    ---


    **Nota importante sobre capacidad del lazo:** En cada lazo analógico se puede
    instalar un máximo de **99 sensores** (y 99 módulos, hasta 198 equipos en total)
    [F6]. La comunicación utiliza el protocolo **CLIP** de Notifier [F6].


    ---


    Fuentes: MPDT190 - Panel ID3000 Manual de programación (sin revisión registrada);
    MIDT190 - Panel ID3000 Manual de instalación y puesta en marcha (sin revisión
    registrada)'
