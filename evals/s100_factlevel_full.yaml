- qid: hp005
  question: En la Notifier ID3000, ¿cómo se programa una zona para que active una
    salida de sirena solo cuando haya coincidencia de dos detectores?
  answer: "# Programación de coincidencia de 2 detectores para activar sirena — ID3000\n\
    \nLa función que necesitas es **\"COINCIDENCIA 2 EQUIPOS\"** en la Matriz de Control.\
    \ A continuación el procedimiento completo:\n\n---\n\n## Paso 1 — Configurar la\
    \ Coincidencia de Alarma en los ajustes de la central\n\nAntes de programar la\
    \ Matriz de Control, verifica que la central tiene habilitada la coincidencia\
    \ de equipos:\n\n- Accede a la pestaña **\"Coincidencia de Alarma\"** en las opciones\
    \ de la central [F4].\n- En la sección **\"Nivel de Coincidencia de los Equipos\
    \ en Alarma\"**, los niveles 3, 4 y 5 permiten configurar coincidencias adicionales\
    \ (n y p equipos). Para coincidencia de 2 equipos, las opciones **\"UN ÚNICO EQUIPO\"\
    ** y **\"COINCIDENCIA 2 EQUIPOS\"** están siempre disponibles sin configuración\
    \ adicional [F3].\n- Configura el **\"Funcionamiento de la Coincidencia en Subzonas\"\
    ** según tu instalación [F4]:\n  - **\"Debe estar en la misma Subzona\"** (opción\
    \ por defecto)\n  - **\"Se extiende en el rango de Subzonas especificadas\"**\n\
    \n---\n\n## Paso 2 — Crear la instrucción de Matriz de Control para los pulsadores\
    \ manuales (MCP)\n\n⚠️ **OBLIGATORIO según EN54-2: 7.1.4** — Los pulsadores manuales\
    \ NO deben incluirse en el grupo de coincidencia [F1][F3]. Debes crear **dos instrucciones\
    \ separadas**:\n\n**Primera instrucción** (para pulsadores manuales):\n\n- Entrada:\
    \ tipo **\"Pulsador Manual\" (MCP)** de la zona\n- Coincidencia: **\"UN ÚNICO\
    \ EQUIPO\"** (sin coincidencia) [F1][F3]\n- Salida: la sirena correspondiente\n\
    \n---\n\n## Paso 3 — Crear la instrucción de Matriz de Control para los detectores\
    \ con coincidencia\n\n**Segunda instrucción** (para detectores analógicos):\n\n\
    1. Accede a **Añadir/Editar Entrada → Alarma** en la Matriz de Control [F7].\n\
    2. Selecciona el tipo de entrada: **zona específica** o **cualquier zona** [F2].\n\
    3. En **\"¿Limitado por TIPO?\"**, selecciona el tipo de detector al que aplicar\
    \ la coincidencia, por ejemplo **\"ANALÓGICO\"** (incluye detectores térmicos,\
    \ iónicos, ópticos, VIEW y multisensor) [F1].\n\n   > ⚠️ **Nota importante:**\
    \ No se permite usar las funciones de coincidencia de zonas y limitación por tipo\
    \ en la misma entrada de Matriz de Control [F3].\n\n4. En **\"Indique tipo de\
    \ coincidencia\"**, selecciona [F3]:\n   - **\"2: COINCIDENCIA 2 EQUIPOS\"**\n\
    5. Salida: asigna la sirena que debe activarse.\n\n---\n\n## Condición de funcionamiento\
    \ resultante\n\n- Con esta configuración, la salida de sirena **solo se activa\
    \ cuando dos detectores de la zona entran en alarma** [F1].\n- Los dos detectores\
    \ en alarma **deben estar en la misma zona o subzona** para que se cumpla la coincidencia\
    \ [F3].\n- Si la entrada es **\"Cualquier zona\"**, el comportamiento de la coincidencia\
    \ (misma central/red o misma zona) depende del ajuste configurado en la **Sección\
    \ 11.21** de la central [F3][F8].\n\n---\n\n## Nota sobre conflictos de coincidencia\n\
    \nSi los detectores tienen configuraciones de coincidencia individuales distintas,\
    \ la resolución es: **si cualquiera de las configuraciones establece que se ha\
    \ cumplido la coincidencia, ésta se cumple** [F9].\n\n---\n\n**Fuentes:**\n- MCDT190\
    \ (sin revisión registrada) — Sección 6.1.5\n- MCDT191_F v. 2.17e — Secciones\
    \ 2.12 y 4.3.1\n- MPDT190 — Secciones Matriz de Control y 11.21\n- MADT190_14\
    \ — Sección 4.4\n\n---\n\U0001F4D6 **Información adicional del manual:**\n- \"\
    - Radio button: Deber estar en la misma Subzona\n- Radio button: Se extiende en\
    \ el rango de Subzonas especificadas (labeled as 4)\" [F4]\n- \"- Radio button:\
    \ Misma Central o Red\n- Radio button: Siempre la misma Zona\" [F4]"
