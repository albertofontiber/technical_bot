- qid: cat013
  question: Tengo una central Detnov CAD-150 y me ha sobrado de otra instalacion un
    detector optico Notifier SDX-751; ¿es compatible / puedo montarlo en su lazo?
  answer: 'La respuesta es **no**: el SDX-751 de Notifier **no aparece en ninguna
    lista de equipos compatibles con la CAD-150 de Detnov**. Los fragmentos disponibles
    no contienen ninguna referencia a compatibilidad entre la CAD-150 y detectores
    Notifier.


    Lo que sí puedo confirmar de los fragmentos:


    - El **SDX-751** aparece como detector analógico fotoeléctrico de bajo perfil
    compatible con las centrales **AFP-200** [F3] e **ID-200** [F4] de Notifier, y
    también figura en la lista de equipos de lazo de la **ID3000** de Notifier [F8].

    - Los fragmentos de la **CAD-150** (Detnov) [F5, F6, F7, F10] no incluyen ninguna
    lista de detectores compatibles con su lazo analógico, por lo que no puedo confirmar
    ni descartar compatibilidad técnica desde la documentación disponible.


    **Conclusión práctica:**

    Se trata de una consulta cross-brand (Detnov + Notifier). No tengo documentación
    sobre interoperabilidad entre ambos fabricantes. Antes de montar el SDX-751 en
    el lazo de la CAD-150, consulta directamente con **Detnov** para verificar si
    su protocolo de lazo es compatible con ese detector Notifier. Usar un detector
    no homologado para esa central puede provocar fallos de comunicación, alarmas
    espurias o ausencia de detección.


    Fuente: Manual CAD-150-8 (55315008-Manual-Centrales-Analogicas-CAD-150-8-Usuario-ES-FR-GB-IT,
    sin revisión registrada); Manual AFP-200 (MNDT120, sin revisión registrada); Manual
    ID-200 (MNDT150, sin revisión registrada); Manual ID3000 (MIDT190, sin revisión
    registrada).


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "Estos detectores analógicos direccionables proporcionan información analógica
    a la central, que continuamente la va procesando para determinar el estado de
    cada equipo, ya sea normal, en alarma o mantenimiento requerido." (MNDT150, p.
    6) [F4]'
