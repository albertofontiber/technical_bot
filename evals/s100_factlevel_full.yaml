- qid: cat009
  question: ¿Qué resistencia de fin de línea (EOL) hay que instalar en las líneas
    de zona de la central convencional NFS Supra?
  answer: "La NFS Supra admite **dos tipos de final de línea (EFL/EOL)** en las líneas\
    \ de zona, y el sistema debe configurarse para que coincida con el tipo instalado:\n\
    \n---\n\n## Opción 1 — Modo Capacitivo (EFL) — **Por defecto**\n\n- **Condensador\
    \ de 47 µF** instalado entre el positivo y negativo de la línea, en la salida\
    \ del último equipo [F5][F2]\n- Es el modo de fábrica [F4][F3]\n- Ofrece mayor\
    \ estabilidad ante transitorios EMC y menor consumo en reposo [F4]\n\n## Opción\
    \ 2 — Modo Resistivo (RFL)\n\n- **Resistencia de 6K8 Ω** instalada entre el positivo\
    \ y negativo de la línea, en la salida del último equipo [F5][F2]\n- La central\
    \ admite un rango de resistencia final de línea entre **3 KΩ** y **7 KΩ** en este\
    \ modo [F5]\n- Consumo máximo por zona: **2,5 mA** con 3 KΩ y **4 mA** con 7 KΩ\
    \ [F5]\n\n---\n\n## Regla importante\n\n**Todas las zonas, incluidas las no usadas,\
    \ deben tener instalada su EFL/RFL** según la configuración del sistema [F5][F6].\n\
    \n---\n\n## Cómo configurar el tipo de supervisión en la central\n\n1. Accede\
    \ al menú de configuración pulsando simultáneamente **Tecla TECLADO + Tecla EVACUACIÓN**\
    \ [F4]\n2. Cambia la opción con la tecla **REARME** [F4]:\n   - **Led 1 Alarma\
    \ Rojo encendido** = Final de Línea Resistivo **6K8 Ω** [F4]\n   - **Led 2 Anulada\
    \ Ámbar encendido** = Final de Línea Capacitivo **47 µF / Diodo** (por defecto)\
    \ [F4]\n\n> ⚠️ El tipo de EFL físicamente instalado en las zonas **debe coincidir**\
    \ con la configuración seleccionada en la central.\n\n---\n\n**Fuentes:** HLSI-MN-025_NFS\
    \ Supra (rev. HLS-MN-025 v.05); HLSI-MN-025-I_NFS Supra Series (sin revisión registrada);\
    \ HLSI-MA-025 Guia Rapida NFS_Supra_ES (sin revisión registrada)\n\n---\n⚠️ **Obligaciones\
    \ de evidencia del manual:**\n- \"Esto significa que debe calcular el número de\
    \ sensores a instalar dependiendo de su consumo sin sobrepasar nunca los 32 sensores.\"\
    \ (HLSI-MN-025_NFS Supra, p. 28) [F2]\n- Nota: la fuente es inconsistente: \"\
    La central NFS Supra tiene cuatro, ocho o doce zonas de alarma.\" (HLSI-MN-025_NFS\
    \ Supra, p. 27) [F5] declara 12 zonas y la enumeración servida lista 6 (HLSI-MN-025_NFS\
    \ Supra, p. 27) [F5]."
