- qid: cat022
  question: En los detectores de llama Spectrex SharpEye 40/40, ¿qué diferencia hay
    entre el modelo 40/40L y el 40/40L4, y qué significa el sufijo «B» (p. ej. 40/40LB)?
  answer: '## Diferencias entre 40/40L, 40/40L4 y sufijo «B»


    Los fragmentos disponibles permiten responder parcialmente esta pregunta.


    ---


    ### Modelos cubiertos por el manual


    El manual **MNDT722_40-40L** cubre los modelos **S40/40L, LB, L4 y L4B** [F1],
    confirmando que son variantes de la misma familia y están documentados en el mismo
    documento.


    ---


    ### Diferencia entre 40/40L y 40/40L4: sensibilidad


    El único dato diferenciador que aparece explícitamente en los fragmentos es la
    **sensibilidad de detección** [F2]:


    - **40/40L y 40/40LB:** ajuste de sensibilidad disponible en **15** → alcance
    **50 ft / 15 m** [F2]

    - **40/40L4 y 40/40L4B:** ajuste de sensibilidad disponible en **28** → alcance
    **93 ft / 28 m** [F2]


    Esto indica que el modelo **L4** tiene un **mayor alcance de detección** que el
    modelo **L** estándar.


    ---


    ### Significado del sufijo «B»


    Los fragmentos del manual del 40/40L no definen explícitamente qué significa el
    sufijo «B» para la familia L/L4. Sin embargo, en el manual del detector **S40/40U**
    (MNDT723_40-40U), la misma lógica de sufijos se define así [F3]:


    - Sin sufijo «B» → **sin BIT** (prueba incorporada automática)

    - Con sufijo «B» → **con BIT** (prueba incorporada automática)


    Dado que ambos manuales son de la misma familia SharpEye y el manual MNDT722 cubre
    conjuntamente los modelos L, **LB**, L4 y **L4B** [F1], esta definición es coherente.
    No obstante, el manual MNDT722 no define el sufijo «B» en texto literal para la
    familia L — el técnico debería verificarlo en las especificaciones completas del
    Apéndice A del manual físico.


    ---


    ### Resumen


    - **40/40L:** detector UV/IR, alcance 15 m, sin BIT automático

    - **40/40LB:** detector UV/IR, alcance 15 m, **con BIT automático**

    - **40/40L4:** detector UV/IR, alcance 28 m, sin BIT automático

    - **40/40L4B:** detector UV/IR, alcance 28 m, **con BIT automático**


    > ⚠️ La definición del sufijo «B» para la familia L/L4 se infiere del manual del
    40/40U [F3], no está enunciada literalmente en el manual MNDT722. Confirma en
    el Apéndice A del manual físico (MNDT722) si necesitas certeza absoluta.


    ---


    **Fuentes:**

    - MNDT722_40-40L (sin revisión registrada)

    - manual-sharpeye-40-40-series-winhost-spectrex-en-us-4845694, TM777050 Rev. (Da),
    octubre 2017

    - MNDT723_40-40U (sin revisión registrada)'
