- qid: hp003
  question: ¿Cómo se conectan las baterías de 24V en la Detnov CAD-150?
  answer: '## Conexión de baterías en la CAD-150-8


    Las baterías requeridas son **dos unidades de 12V 7Ah**, conectadas en **serie**
    para obtener los 24V de funcionamiento [F4].


    ### Pasos de conexión


    1. **Coloca las baterías** en la parte inferior de la caja, en el espacio reservado
    para ello, de forma **vertical** [F4].


    2. **Conecta el cable puente** (suministrado con la central) uniendo el **polo
    positivo de una batería con el polo negativo de la otra** — esto las pone en serie
    [F4].


    3. **Conecta los cables del circuito** (rojo y negro) al **positivo y negativo
    libres** de las baterías, en el **Conector Batería** (posición 11 de la PCB Base)
    [F1][F2].


    4. **Verifica antes de energizar** que las baterías tienen una tensión superior
    a **24V** [F9].


    ### Orden de conexión obligatorio ⚠️


    El orden de conexión es crítico y debe respetarse siempre [F6]:


    - **Primero:** conectar la alimentación de red (**230VAC**) activando el magnetotérmico
    bipolar.

    - **Segundo:** conectar las baterías.


    > Si no se respeta este orden, el equipo podría sufrir daños [F6].


    ### Nota sobre arranque solo con baterías


    Si es necesario encender el equipo únicamente con baterías, es imprescindible
    pulsar el pulsador **BAT** (posición 9 de la PCB Base) para arrancar el equipo
    [F9].


    ---


    Fuente: 55315013 Manual Centrales Analógicas CAD-150-8 Instalación ES FR GB IT
    (sin revisión registrada)


    ---

    📖 **Información adicional del manual:**

    - "* Comprobar que el equipo se ha instalado correctamente.

    * Con la ayuda de un voltímetro verificar que en los lazos no existen ni cortocircuitos
    ni circuitos abiertos. Use el tester para comprobar la continuidad de la línea.

    * Verificar que las líneas de zona conectadas a módulos de zona tienen las resistencias
    de final de línea (4K7)

    * Verificar que las líneas de sirenas, conectadas a módulos de sirenas están conectadas
    respetando la polaridad, y que tienen las resistencias (4k7) de final de línea.

    * Verificar las conexiones de salida de la placa base. Compruebe que están correctamente
    instaladas.

    * Ajustar el retardo deseado de las sirenas.

    * Verificar que la tensión de red es de 230VAC mediante el uso de un voltímetro
    y compruebe que las baterías tienen una tensión superior a 24V." [F9]'
