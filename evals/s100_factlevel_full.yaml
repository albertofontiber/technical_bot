- qid: hp010
  question: En la Morley DXc, ¿cómo se añade un nuevo detector al lazo tras la puesta
    en marcha inicial?
  answer: "# Añadir un nuevo detector al lazo en la Morley DXc\n\nEl procedimiento\
    \ para añadir un nuevo detector tras la puesta en marcha es la función **Autobúsqueda\
    \ de equipos**, accesible desde el menú de Lazos [F1].\n\n---\n\n## Pasos\n\n\
    1. **Accede al menú de Lazos** desde el nivel de acceso de programador.\n\n2.\
    \ **Pulsa la tecla `2`** en el menú de Lazos para seleccionar la función **'Autobúsqueda'**\
    \ [F1]:\n\n   ```\n   [Lazo]                 Mie 13/04/2011 17:33:50\n   1:Confg.Equipos\
    \        2:Autobusqueda\n   ```\n\n3. **Introduce el número de lazo** donde has\
    \ conectado el nuevo detector y pulsa **⊙** para confirmar [F1]:\n\n   ```\n \
    \  [Autobusqueda]  Mie 13/04/2011 17:35:57\n   Sel.Num.Lazo (1-2) :1\n   OK:Confirm\
    \  1-2:↕:Edit        ←:Cancel\n   ```\n\n4. **Confirma que deseas realizar la\
    \ autobúsqueda** pulsando **⊙** [F1]:\n\n   ```\n   [Autobusqueda]  Mie 13/04/2011\
    \ 17:35:57\n   Lazo: 1  Autobusqueda?\n   OK:Confirm                 ←:Cancel\n\
    \   ```\n\n   > Para cancelar en cualquier momento, pulsa **⊞**.\n\n5. **Espera**\
    \ a que finalice el proceso. La pantalla mostrará una barra de progreso [F1]:\n\
    \n   ```\n   [Autobusqueda]           Mie 13/04/2011 17:37:11\n   Lazo: 1 Reconocimiento\
    \ en progreso...\n   █████████████████\n   ```\n\n6. **Verifica el resumen de\
    \ resultados** al finalizar. Comprueba que el campo **Nuevos** refleja el detector\
    \ recién añadido y que el total de equipos y tipos coincide con lo instalado [F1]:\n\
    \n   ```\n   [Lazo]                     Mie 13/04/2011 17:37:31\n   Lazo: 1  \
    \         Total: 13\n   Nuevos:0          Elimin.:0  Cambiad:0\n   ION: 0 OPT:\
    \ 1 TMP: 1 MLT: 2\n   PUL: 4 MON: 0 SIR: 2 REL: 1 OTROS : 2\n   ```\n\n7. **Pulsa\
    \ ⊞** para abandonar la pantalla de resultados y regresar al menú de Lazos [F1].\n\
    \n---\n\n## Notas importantes\n\n- Si la central dispone de **más de un lazo**,\
    \ usa las teclas **▲ / ▼** para ver los resultados de otros lazos [F1].\n- La\
    \ línea superior del resumen muestra sensores (ION, OPT, TMP, MLT) y la inferior\
    \ módulos (PUL, MON, SIR, REL, OTROS) [F1].\n- Consulta la **Tabla 4** del manual\
    \ para el significado de las abreviaturas de tipos de equipos [F1].\n- ⚠️ En mercados\
    \ donde el protocolo es seleccionable: si previamente se realizó un **cambio de\
    \ protocolo**, espera **dos minutos** antes de ejecutar la autobúsqueda [F1].\n\
    \n---\n\n**Fuente:** DXc_Manual de configuracion (sin revisión registrada)\n\n\
    ---\n\U0001F4CB **Obligaciones de evidencia del manual:**\n- Nota: la fuente es\
    \ inconsistente: \"PUL: 4 MON: 0 SIR: 2 REL: 1 OTROS : 2\" (DXc_Manual de configuracion,\
    \ p. 48) [F1] declara 1 OTROS y la enumeración servida lista 5 (DXc_Manual de\
    \ configuracion, p. 48) [F1]."
