per_gold:
- qid: cat001
  question: En la Notifier PEARL, ¿cuántos equipos admite un lazo SLC y qué límites
    de cableado hay (aisladores), y cómo se dan de alta y editan esos equipos desde
    la central?
  answer: "# Notifier PEARL — Capacidad de lazo SLC, aisladores y alta/edición de\
    \ equipos\n\n## 1. Capacidad máxima por lazo\n\n- **Protocolo Opal:** hasta **159\
    \ sensores + 159 módulos** por lazo [F2]\n- **Protocolo CLIP:** hasta **99 sensores\
    \ + 99 módulos** por lazo [F2]\n- **Protocolo mixto Opal + CLIP:** el límite de\
    \ equipos CLIP en lazo mixto es de **40**; si se supera, la autoconfiguración\
    \ continúa pero señala fallos [F3]\n- **Máximo total por lazo:** **318 equipos**\
    \ (159 sensores + 159 módulos, protocolo Opal) [F1]\n- **Límite global del sistema\
    \ (ambos lazos):** máximo **512 sensores y/o pulsadores manuales** en total para\
    \ cumplir EN54-2: 13-7 [F1]\n- **Carga máxima:** **0,75 A por lazo** [F2]\n\n\
    ---\n\n## 2. Requisitos de aisladores (EN54-2: 12.5.2)\n\n- **Regla general EN54:**\
    \ máximo **32 equipos entre aisladores** [F1]\n- **Equipos sin aislador interno**\
    \ (incluidos CLIP y algunos Opal): **no más de 20 equipos entre aisladores** [F1]\n\
    - **Equipos con aislador interno FET** (con base B501 AP): el lazo cumple directamente\
    \ los requisitos de EN54-2 [F1]\n- **Nota adicional del Apéndice 10:** para asegurar\
    \ que los aisladores se cierren al aplicar alimentación, la carga entre aisladores\
    \ no debe superar **20 SU** [F6]\n- **Nota de la sección 6.4.2:** no colocar más\
    \ de **25 equipos entre aisladores** (o **20 si se usan aisladores FET**) [F9]\n\
    - Los equipos Opal con aislador interno FET usan bases **B501 AP**, con el aislador\
    \ conectado a los terminales **+2 y +4** en el extremo positivo [F1]\n\n> ⚠️ **Advertencia:**\
    \ NUNCA utilices un multímetro de alta tensión (tipo Megger) en el lazo de detección.\
    \ Si hay aisladores instalados, el conductor positivo (+) del lazo estará en circuito\
    \ abierto [F1].\n\n---\n\n## 3. Alta de equipos: Autoconfiguración desde la central\n\
    \nEl acceso a la configuración requiere **clave de nivel 3** [F10]. Hay dos vías\
    \ de acceso [F10]:\n\n1. Pulsar la tecla → seleccionar «Conf/Mant.Ingeniero» →\
    \ introducir clave → pulsar de nuevo para mostrar la pestaña **CONFIG**\n2. Girar\
    \ la llave de acceso 90° → seleccionar «**5: Pestaña Configuración**» → introducir\
    \ clave de nivel 3\n\nUna vez dentro, el proceso de autoconfiguración es [F5]:\n\
    \n1. Seleccionar **«1: Autoconfiguración»** en el menú de equipos de lazo\n2.\
    \ Elegir si aplica a **todos los lazos** o a un **lazo específico**\n3. Seleccionar\
    \ el modo de autoconfiguración [F5]:\n   - **«1: Todos Prot. OPAL/CLIP»** — detecta\
    \ duplicidades de dirección\n   - **«2: OPAL/CLIP (No detecta duplicidad)»** —\
    \ más rápido, sin comprobación de duplicados\n   - **«3: Sólo con protocolo CLIP»**\
    \ — solo autoconfigura equipos CLIP aunque haya Opal en el lazo\n4. Seleccionar\
    \ el modo de actualización [F3]:\n   - **«1: Permite Añadir/Borrar/Cambiar»**\n\
    \   - **«2: Sólo Añadir Nuevos Equipos»**\n5. El proceso se inicia automáticamente;\
    \ sensores y módulos Opal y CLIP se detectan en la misma pasada [F5]\n6. Al finalizar,\
    \ se muestran los resultados por lazo; usa las teclas **◁/▷** para navegar entre\
    \ lazos [F3]\n\n> **Nota:** Si se autoconfigura un equipo Opal, por defecto será\
    \ Opal. Si el número de equipos CLIP supera 40, selecciona manualmente «Sólo con\
    \ protocolo CLIP» [F3].\n\nLa configuración puede transferirse a un ordenador\
    \ portátil con el programa **ITS** para editarla y archivarla [F5]. Los equipos\
    \ configurados pueden consultarse en cualquier momento desde nivel de acceso 2,\
    \ opción **«Resumen de Equipos»** [F5].\n\n---\n\n## 4. Edición individual de\
    \ equipos\n\nDesde el menú de configuración se puede editar cada sensor o módulo\
    \ individualmente [F4]. Los parámetros editables para **sensores** incluyen:\n\
    \n- Números de referencia de zona de red [F4]\n- Tipo de equipo [F4]\n- Entorno\
    \ del número de referencia de zona (opcional) [F4]\n- Número de central (LOCAL\
    \ o 1-125 para centrales de red) [F4]\n- Número de zonas (hasta **255 zonas locales**\
    \ o **8192 zonas de red**) [F4]\n- Número de células (hasta **255**) [F4]\n- Prioridad\
    \ de interrogación (solo CLIP, limitada a **30 equipos**) [F4]\n- Acción de parpadeo\
    \ en equipo interrogado; elección de color solo para equipos Opal [F4]\n- Opción\
    \ de tipo de equipo (VIEW, Optiplex y SMART) [F4]\n- Ajuste del nivel de alarma\
    \ [F4]\n- Ajuste del nivel de alarma horaria [F4]\n- Ajuste del nivel de prealarma\
    \ [F4]\n- Selección de programación horaria (cambio de sensibilidad) [F4]\n- Grupo\
    \ AWACS (50 grupos, todos los sensores CLIP salvo HEAT) [F4]\n- Retardo de alarma\
    \ [F4]\n- Ajuste no silenciable para LED remoto (solo Opal); respuesta a orden\
    \ SILENCIAR SIRENAS [F4]\n- Operación solo modo térmico L6 (solo SMART y Optiplex)\
    \ [F4]\n- Número de aplicación (solo equipos SMART 4) [F4]\n- Ajuste de función\
    \ LED remota (solo Opal): «Seguir el equipo» (predeterminada) o «Controlada por\
    \ reglas de causa-efecto» [F4]\n- Retardo de confirmación de coincidencia de detector:\
    \ hasta **240 s (4 min)**; puede usarse con dependencia tipo B [F4]\n\n---\n\n\
    **Fuentes:**\n- Manual de instalación y puesta en marcha 997-669-005-3 (sin revisión\
    \ registrada)\n- Manual de configuración de la central 997-671-005-3 (rev. 997-671-005-3)\n\
    - Manual de funcionamiento 997-670-005-3 (sin revisión registrada)\n\n---\n\U0001F4D6\
    \ **Obligaciones de evidencia del manual:**\n- \"Las centrales Pearl admiten equipos\
    \ que incorporen aisladores internos, siempre y cuando se utilicen las bases con\
    \ los conectores de cable de lazo de extremo positivo adicionales (tipo B501 AP).\"\
    \ (997-669-005-3_Instal-Comm_ES, p. 21) [F1]"
