- qid: hp001
  question: En la Detnov CAD-250, ¿cómo se entra al menú de programación avanzada?
  answer: 'Para acceder al menú de programación avanzada de la **CAD-250**, sigue
    estos pasos:


    1. En la **PANTALLA DE REPOSO**, toca el icono del candado (🔒) [F2][F3].

    2. Introduce la **clave de administrador** (por defecto: **2222**) en el teclado
    numérico que aparece [F2][F3].

    3. Una vez en el menú principal, pulsa **AJUSTES** en la barra lateral izquierda
    [F1][F10].

    4. En el submenú de la derecha, selecciona **AVANZADO** [F1][F10].


    La ruta completa es: **AJUSTES** (Menú principal) **> AVANZADO** (Submenú) [F1].


    ---


    Una vez dentro, dispones de **3 pestañas** [F1]:


    - **SISTEMA**: configura número de cabinas (PANELES: 1 a 4), número de lazos (2,
    4, 6, 8... hasta 32 según cabinas) y cabina de LEDs de zona (0 ó 1) [F1].

    - **OTROS**: interruptores para facilitar puesta en marcha y mantenimiento (tiempo
    de inactividad, salto a scroll si incidentes, saltar a último incidente prioritario
    si timeout, entre otros) [F1][F6][F7].

    - **REINICIAR**: devuelve los valores de configuración del panel a valores por
    defecto (no afecta a entidades, lazos, maniobras, grupos, módulos virtuales, modos
    especiales, filtros de red ni registros de eventos) [F6].


    > ⚠️ **AVISO:** El uso indebido del nivel de administrador puede provocar un mal
    funcionamiento de la instalación. Asegúrate de tener la autorización necesaria
    antes de operar en este nivel [F2][F3].


    ---


    **Fuente:** CAD-250 Manual de Configuración MC-380-es-2026-c (rev. c, 2026-04-23)'
