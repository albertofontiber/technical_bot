- qid: cat016
  question: En la Detnov CAD-150, ¿como se da de alta un detector nuevo en el lazo
    y como se prueba que funciona?
  answer: "# Alta de detector nuevo y prueba en CAD-150-8\n\n## 1. Dar de alta un\
    \ detector nuevo en el lazo\n\nEl procedimiento para incorporar un nuevo detector\
    \ es mediante la **autobúsqueda del lazo** [F1]:\n\n1. Accede al **menú BUCLE**\
    \ [F1].\n2. Realiza una **autobúsqueda del lazo** correspondiente — el sistema\
    \ escaneará el lazo y mostrará todos los elementos que detecte [F1].\n3. Verifica\
    \ que los elementos encontrados coinciden con los planos de la instalación [F1].\n\
    4. Accede al **menú ELEMENTOS** para asignar al nuevo detector:\n   - Un **nombre/texto**\
    \ identificativo [F1]\n   - La **zona** a la que pertenece [F1]\n\n> **Nota:**\
    \ Puedes verificar que el detector ha quedado correctamente registrado desde el\
    \ **menú ELEMENTO → VER**, donde podrás comprobar el BUCLE, DIRECCIÓN, ZONA, TIPO,\
    \ MODO y valor analógico (VA) del elemento [F2].\n\n---\n\n## 2. Probar que el\
    \ detector funciona\n\nEl método recomendado es el **modo PRUEBA de zona**, que\
    \ permite probar detectores **sin necesidad de rearmar la central** [F3]:\n\n\
    1. Accede al **menú ZONA → PRUEBA** [F3].\n2. Introduce el **rango de zonas**\
    \ a poner en prueba (campo RANGO) [F3].\n3. Selecciona si deseas **activar las\
    \ sirenas** durante la prueba (campo ACTIVAR SIRENAS: SI/NO) [F3].\n4. Pulsa **Aceptar**\
    \ [F3].\n5. Activa el detector (con spray de prueba, calor, etc.).\n\n**Comportamiento\
    \ esperado en modo prueba** [F3]:\n- Si ACTIVAR SIRENAS = SI: las sirenas se activarán\
    \ unos segundos tras la entrada en alarma del detector y se silenciarán automáticamente.\n\
    - Cualquier retardo de sirena programado queda **anulado** en modo prueba para\
    \ agilizar la verificación [F3].\n- Si transcurren **20 minutos** sin que se produzca\
    \ ningún disparo de alarma, el sistema **cancela automáticamente el modo prueba**\
    \ y vuelve al estado normal [F3].\n\n6. Para **salir del modo prueba** una vez\
    \ finalizada la verificación: conecta la zona desde el menú ZONA → CONECTAR [F3].\n\
    \n---\n\n**Verificación adicional del sistema** [F7]:\n- Comprueba que al provocar\
    \ la alarma se activa el **relé de alarma**.\n- Comprueba que se activan las **salidas\
    \ de sirena** una vez transcurrido el tiempo de retardo programado.\n\n---\n\n\
    **Fuentes:**\n- `55315013 Manual Centrales Analógicas CAD-150-8 Instalación ES\
    \ FR GB IT` (sin revisión registrada)\n- `55315008 Manual Centrales Analógicas\
    \ CAD-150-8 Usuario ES FR GB IT` (sin revisión registrada)\n\n---\n\U0001F4D6\
    \ **Obligaciones de evidencia del manual:**\n- \"» Poner el equipo en estado de\
    \ prueba, y verificar que todos los detectores y pulsadores funcionan de acuerdo\
    \ con las especificaciones del fabricante.\" (55315008-Manual-Centrales-Analogicas-CAD-150-8-Usuario-ES-FR-GB-IT,\
    \ p. 37) [F8]"
