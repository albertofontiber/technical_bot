- qid: hp002
  question: El detector ASD535 de Detnov está dando una alarma intermitente de flujo
    bajo. ¿Cuál es la causa más probable y cómo se diagnostica?
  answer: "## ASD535 — Alarma de flujo bajo: causa probable y diagnóstico\n\n**La\
    \ causa más probable es una obstrucción en el conducto de aspiración** (código\
    \ de fallo *001*) [F2]. Un valor de flujo por debajo del **80 %** del nominal\
    \ dispara el aviso de fallo de flujo de aire una vez transcurrido el tiempo de\
    \ retardo de **300 s** de la LS-Ü [F1][F3].\n\n---\n\n### Cómo interpretar el\
    \ valor de flujo\n\nEl ASD535 registra el flujo nominal como **100 %** tras el\
    \ reset inicial con el conducto limpio e intacto [F3]. La regla de interpretación\
    \ es:\n\n- **Valor < 100 %** → apunta a **obstrucción** [F1]\n- **Valor > 100\
    \ %** → apunta a **rotura de tubo** [F1]\n- El fallo se dispara cuando la desviación\
    \ supera **±20 %** (es decir, < 80 % o > 120 %) en posiciones de conmutador **A11\
    \ a C32** [F1][F3]\n\n> ⚠️ En posiciones de conmutador **W01 a W48**, los valores\
    \ de monitorización **no están homologados según EN 54-20** y solo deben usarse\
    \ previa consulta con el fabricante [F3].\n\n---\n\n### Pasos de diagnóstico\n\
    \n1. **Leer el valor de flujo actual**: coloca el conmutador en posición **V**\
    \ (según cap. 7.6.1) y anota el porcentaje [F5]. Compáralo con el protocolo de\
    \ puesta en funcionamiento.\n\n2. **Evaluar la desviación**:\n   - Si la sensibilidad\
    \ LS-Ü es **±20 %** (estándar), realiza inspección del conducto cuando el valor\
    \ caiga por debajo del **90 %** (la mitad de la sensibilidad = ±10 %) [F5].\n\
    \   - Si la sensibilidad LS-Ü es **±50 %** (no conforme EN 54-20), inspecciona\
    \ cuando caiga por debajo del **75 %** [F5].\n\n3. **Verificar el código de fallo\
    \ en el AMB 35** (posición de conmutador **E**) [F4]:\n   - Código ***001*** →\
    \ Obstrucción en conducto de aspiración [F2]\n   - Código ***002*** → Rotura de\
    \ tubo [F2]\n   - Código ***004*** → Parámetros LS-Ü no válidos / sensor fuera\
    \ de rango [F2]\n   - Código ***008*** → Sensor de flujo defectuoso o no conectado\
    \ [F2]\n\n4. **Para el código *001* (obstrucción)**, comprueba [F2]:\n   - Orificios\
    \ de aspiración y salida de aire obstruidos\n   - Caja de filtro / unidad de filtrado\
    \ → inspeccionar y limpiar\n   - Sensor de flujo de aire → inspeccionar y limpiar\n\
    \n5. **Verificar la tensión de alimentación** en bornes **1 (+) y 2 (-)** [F5][F7]:\n\
    \   - Funcionamiento a **12 V-CC**: rango nominal **12,3 a 13,8 V-CC**\n   - Funcionamiento\
    \ a **24 V-CC**: rango nominal **21,6 a 27,6 V-CC**\n   - Una tensión fuera de\
    \ rango puede provocar funcionamiento defectuoso [F7]\n\n6. **Antes de cualquier\
    \ trabajo de mantenimiento**: bloquear o desconectar el control de incendios y\
    \ la alerta remota en la CDI de orden superior [F5].\n\n---\n\n> \U0001F4A1 **Nota**:\
    \ El LED «Fault» empieza a **parpadear** en cuanto la variación del flujo supera\
    \ el ±20 %. El aviso de fallo formal a la CDI se produce transcurridos los **300\
    \ s** de retardo de la LS-Ü [F6].\n\n---\n\n**Fuente:** ASD535_TD_T131192es_h\
    \ (sin revisión registrada)\n\n---\n⚠️ **Información adicional del manual:**\n\
    - \"Para evitar que los controles de incendios, las alertas remotas y las zonas\
    \ de extinción se disparen al llevar a cabo los trabajos de mantenimiento, es\
    \ **imprescindible** bloquearlos o desconectarlos previamente.\" [F5]\n- Nota:\
    \ el manual también indica: \"1. Bloquear o desconectar el control de incendios\
    \ y la alerta remota en la CDI de orden superior.\n2. La tensión de alimentación\
    \ de la CDI debe estar configurada para la central conforme a la normativa de\
    \ mantenimiento.\n3. Debe comprobarse que la entrada del conducto de aspiración\
    \ y los tapones de tubo del orificio de entrada de la caja del detector que no\
    \ está en uso (ASD 535-1 y ASD 535-3) están en la posición correcta.\n4. Debe\
    \ comprobarse si existe suciedad en la salida de aire, en cuyo caso deberá limpiarse.\n\
    5. En caso de que el ASD 535 se utilice para la vigilancia de equipos y se hayan\
    \ instalado transiciones insertadas de tubo rígido a tubo flexible, debe comprobarse\
    \ que dichas transiciones están colocadas correctamente (sin fugas).\n6. Debe\
    \ abrirse la cubierta de la caja del detector y fijarse en la posición media de\
    \ anclaje del fondo de la caja. **Atención**: conexión de cable plano (véanse\
    \ también los cap. 5.4.1 y 7.1). Deberán efectuarse las siguientes mediciones:\n\
    \   * Medir la tensión de servicio en los bornes 1 (+), 2 (-) \U0001F87A Valor\
    \ nominal = 12,3 a 13,8 V-CC (funcionamiento a 12 V-CC) o 21,6 a 27,6 V-CC (funcionamiento\
    \ a 24 V-CC).\n   * Leer el valor de flujo de aire del conducto de aspiración\
    \ en la posición de conmutador V (véase para ello el cap. 7.6.1) y comparar con\
    \ el protocolo de puesta en funcionamiento. Si existe una desviación superior\
    \ a la mitad de la sensibilidad establecida (véanse ejemplos ➀ y ➁), deberá realizarse\
    \ una inspección del conducto de aspiración de la siguiente manera:\n     - Un\
    \ **aumento** del valor (superior al 100 %) implica una **rotura de tubo** inminente\
    \ \U0001F87A Comprobar si el conducto de aspiración tiene fugas (puntos de unión,\
    \ racores, etc.)\n     - Una **disminución** del valor (inferior al 100 %) implica\
    \ una **obstrucción** inminente \U0001F87A Comprobar si el conducto de aspiración\
    \ está obstruido y limpiarlo según el **punto 9** o el **punto 10**.\n   * ➀ Sensibilidad\
