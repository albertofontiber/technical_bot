- qid: cat020
  question: En una central Morley DXc instalada en Espana, ¿cual es el nivel de alarma
    y de prealarma por defecto de los detectores, y el maximo configurable?
  answer: '## Niveles de alarma y prealarma por defecto en la DXc — Protocolo Morley-IAS


    Los valores dependen del **tipo de detector**:


    ---


    ### Detectores estándar (ópticos, térmicos, óptico-térmicos en modo porcentaje)


    - **Prealarma por defecto: 80%** [F1]

    - **Alarma por defecto: 100%** [F1]

    - **Máximo configurable para el nivel de alarma: 108%** [F1]


    El rango de ajuste para ambos niveles (alarma y prealarma) es de **80 a 108%**
    [F6], introducido mediante teclado numérico en el menú de sensibilidad.


    > ⚠️ El nivel de prealarma **no puede ser superior al nivel de alarma** [F6].


    ---


    ### Detectores Multicriterio / Óptico-Térmicos (OTM) — modo por niveles


    Estos detectores trabajan con niveles discretos en lugar de porcentajes [F2]:


    - **Prealarma por defecto: Nivel 3** (valor analógico 72, sensibilidad 6,5% osc./m)
    [F2]

    - **Alarma por defecto: Nivel 4** (valor analógico 86, sensibilidad 6,5% a 11,5%
    osc./m, autoajustado) [F2]

    - Rango disponible: **Nivel 1 a Nivel 6** [F2]


    ---


    ### Detectores Láser — modo por niveles


    - **Prealarma por defecto: Nivel 4** (valor analógico 69, sensibilidad 0,32% osc./m)
    [F2]

    - **Alarma por defecto: Nivel 5** (valor analógico 76, sensibilidad 0,65% osc./m)
    [F2]

    - Rango disponible: **Nivel 1 a Nivel 9** [F2]


    ---


    ### Nota sobre instalaciones en España


    El fragmento del manual de variaciones de mercado de la DXc confirma que para
    el protocolo Morley-IAS, el valor analógico es un número normalizado entre **0%
    y 100%**, siendo **80% la prealarma por defecto** y **100% la alarma por defecto**,
    con un **ajuste máximo de alarma del 108%** [F1].


    ---


    Fuente: DXc_Manual variaciones de mercado, sección 5.3.10.4 y 5.3.10.5.1 (sin
    revisión registrada) [F1]; DXc_Manual variaciones de mercado, sección 5.3.10.3
    (sin revisión registrada) [F2]


    ---

    📖 **Información adicional del manual:**

    - "### 5.3.10.5.1 Información específica para protocolo Morley-IAS


    • El valor analógico debe ser un número normalizado entre 0% – 100%, independientemente
    del tipo de equipo. Para los detectores, el nivel de prealarma por defecto es
    el 80% y el nivel de alarma por defecto es el 100%.


    • El ajuste máximo para el nivel de alarma es el 108%." [F1]

    - "Fuego    : Niv4

    Prealarma: Niv3


    Introd nivel Fuego     : 3" [F1]


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "el umbral de alarma de fuego depende del ajuste del nivel/modo y es diferente
    para cada nivel de alarma." (DXc_Manual variaciones de mercado, p. 5) [F2]

    - "Estos valores se definen para cada equipo y su configuración es automática
    en la central de forma que el valor del pulso analógico varia para cada equipo,
    pero los recomendados por el fabricante se corresponden siempre con «100» para
    alarma y «80» para prealarma." (MIE-MI-320, p. 3) [F8]

    - "El valor normal de Prealarma es de 80% y el de Alarma de 100% para cualquier
    sensor." (MIE-MP-530rv001, p. 24) [F9]'
