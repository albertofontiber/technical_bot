- qid: hp015
  question: En la Detnov CCD-103, ¿cómo se desactiva un detector individualmente sin
    afectar al resto del lazo?
  answer: 'La CCD-103 **no permite desactivar detectores individuales**: la unidad
    mínima de desconexión es la **zona completa**.


    Según el manual, el procedimiento para desconectar una zona es el siguiente [F1][F2]:


    1. Asegúrate de que la **llave de bloqueo de teclado (G)** está en posición **abierta**
    (desbloqueada) [F2].

    2. Pulsa la **tecla de zona (A)** correspondiente **una primera vez** → la zona
    entra en **modo prueba** [F2].

    3. Pulsa la **tecla de zona (A)** una **segunda vez** → la zona queda en **modo
    desconexión** [F1][F2].


    **Indicaciones visuales que confirman la desconexión** [F1][F5]:

    - **Indicador de anular (4):** se enciende de forma continua [F1].

    - **Indicador amarillo de zona (6):** se enciende fijo indicando la zona concreta
    anulada [F1][F5].


    **Para reconectar la zona** [F1]:

    - Pulsa la tecla de zona **una vez** → zona conectada de nuevo.


    ---


    ⚠️ **Advertencia importante:** Cuando una zona está desconectada, la central **no
    refleja ninguna incidencia ni evento** en esa zona. El manual indica expresamente
    que es importante **limitar el uso de esta maniobra** [F1].


    Dado que la CCD-103 es una central convencional con un máximo de **32 detectores
    o pulsadores por zona** [F3][F4], si necesitas aislar un detector individual sin
    afectar al resto, el manual no describe ningún procedimiento para ello. Consulta
    directamente el soporte técnico de Detnov o el manual completo para verificar
    si existe alguna opción de configuración adicional no cubierta en los fragmentos
    disponibles.


    ---


