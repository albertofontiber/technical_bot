- qid: hp017
  question: ¿Cómo se programa el retardo de salida de alarma principal en la Notifier
    PEARL?
  answer: "## Programación del retardo de salida de alarma en la Notifier PEARL\n\n\
    El retardo de salida de alarma en la PEARL se configura a través de las **reglas\
    \ de causa-efecto**, asignando un tipo de retardo a cada regla [F1].\n\n---\n\n\
    ### 1. Tipos de retardo disponibles\n\nSe puede asignar uno de **seis tipos de\
    \ retardo de salida** a una regla de causa-efecto [F1]. Los tipos disponibles\
    \ son [F2]:\n\n- **Fijo**\n- **Estándar**\n- **No Silenc.**\n- **Est. Ext.**\n\
    - **RetExtStd**\n- **No Sil. Ext**\n- **SinRetExt**\n\nEl comportamiento de cada\
    \ tipo ante las acciones del usuario es el siguiente [F2]:\n\n- **La salida se\
    \ detiene al pulsar SILENCIAR SIRENAS durante el retardo:**\n  Estándar ✓ | Est.\
    \ Ext. ✓ | RetExtStd ✓ | Resto ✗\n\n- **El retardo puede anularse (nivel acceso\
    \ 2, opción «Anular retardos»):**\n  Fijo ✗ | Resto ✓\n\n- **El tiempo restante\
    \ se muestra en la pestaña ALARMA:**\n  Fijo ✗ | Resto ✓\n\n- **El retardo activo\
    \ puede detenerse (nivel acceso 2, tecla FIN RETARDO):**\n  Fijo ✗ | Resto ✓\n\
    \n- **La salida se detiene al pulsar AMPLIAR RETARDO:**\n  Est. Ext. ✓ | No Sil.\
    \ Ext ✓ | Resto ✗\n\n- **El temporizador comienza en RETARDO AMPLIADO:**\n  RetExtStd\
    \ ✓ | SinRetExt ✓ | Resto ✗\n\n---\n\n### 2. Retardo de alarma a nivel de equipo\
    \ individual\n\nAdicionalmente, existe un parámetro **«Retardo de alarma»** configurable\
    \ de forma individual para cada sensor o módulo dentro de la sección de edición\
    \ de equipos [F7]. Para módulos, este parámetro aparece como columna **«Ret.Alarma»**\
    \ en la pantalla de edición del lazo [F8].\n\n---\n\n### 3. Anular/habilitar los\
    \ retardos desde el panel (operación)\n\nSi necesitas activar o desactivar los\
    \ retardos configurados en operación (nivel acceso 2) [F3]:\n\n1. Accede al **Menú\
    \ Anular/Habilitar**.\n2. Selecciona **«5: Retardo Activación Salidas»**.\n3.\
    \ Pulsa **✓** para cambiar el estado entre HABILITADO y ANULADO.\n4. Pulsa **✕**\
    \ para salir.\n\n> ⚠️ Esta opción solo está disponible si se han configurado retardos\
    \ en alguna regla de causa-efecto. El **LED de RETARDO ACTIVO** se ilumina cuando\
    \ hay un retardo en curso [F3].\n\n---\n\n### 4. Tecla AMPLIAR RETARDO\n\nLa tecla\
    \ **AMPLIAR RETARDO** puede desactivarse desde los parámetros de la central (opción\
    \ **«10: Extend Delay Button»**), ya que no se requiere en algunos mercados [F5].\n\
    \n---\n\n### Nota sobre la configuración detallada de los valores de tiempo\n\n\
    Los fragmentos disponibles describen los **tipos de retardo y su comportamiento**,\
    \ pero **no especifican el procedimiento paso a paso para introducir el valor\
    \ numérico del tiempo de retardo** dentro del editor de reglas de causa-efecto.\
    \ Consulta el Apéndice 5 completo del manual de configuración para el procedimiento\
    \ de edición de reglas.\n\n---\n\n**Fuentes:**\n- Manual de configuración de la\
    \ central PEARL (rev. 997-671-005-3)\n- Manual de funcionamiento PEARL 997-670-005-3\
    \ (sin revisión registrada)\n- Manual de instalación/puesta en marcha PEARL 997-669-005-3\
    \ (sin revisión registrada)\n\n---\n\U0001F4D6 **Información adicional del manual:**\n\
    - \"- Números de referencia de la zona de red\n- Tipo de equipo\n- Entorno del\
    \ número de referencia de zona (opcional)\n- Número de central (Central LOCAL;\
    \ 1-125: otras centrales de red). Esta columna no siempre se muestra, ya que depende\
    \ del tipo de numeración de zona seleccionada.\n- Número de zonas (hasta 255 zonas\
    \ locales o 8192 zonas de red)\n- Número de células (hasta 255)\n- Prioridad de\
    \ interrogación (operación solo protocolo CLIP: limitada a 30 equipos)\n- Acción\
    \ de parpadeo en equipo interrogado. Elección del color solo para equipos Opal.\n\
    - Opción de tipo de equipo (VIEW, Optiplex y SMART)\n- Ajuste del nivel de alarma\n\
    - Ajuste del nivel de alarma horaria\n- Ajuste del nivel de prealarma\n- Selección\
    \ de programación horaria (cambio de sensibilidad de sensor)\n- Grupo AWACS (50\
    \ grupos con todos los sensores CLIP salvo HEAT)\n- Retardo de alarma\n- Ajuste\
    \ no silenciable para la función de LED remoto (solo equipos Opal); respuesta\
    \ a la orden SILENCIAR SIRENAS.\n- Operación solo modo térmico (L6) (solo SMART\
    \ y Optiplex)\n- Número de aplicación (solo equipos SMART 4)\n- Ajuste de la función\
    \ LED remota (solo equipos Opal): las opciones son: Seguir el equipo (predeterminada)\
    \ o Controlada por las reglas de causa-efecto.\n- Retardo de confirmación de coincidencia\
    \ de detector; puede ajustarse hasta 240 s (4 min). Puede usarse con dependencia\
    \ tipo B.\" [F7]\n\n---\n\U0001F4CB **Obligaciones de evidencia del manual:**\n\
    - Nota: la fuente es inconsistente: \"Se puede asignar uno de seis tipos de retardo\
    \ de salida a una regla, como se explica a continuación.\" (997-671-005-3_Configuration_ES,\
    \ p. 44) [F1] declara 6 tipos y la enumeración servida lista 8 (997-671-005-3_Configuration_ES,\
    \ p. 44) [F1].\n- Nota: la fuente es inconsistente: \"Sección 4 - 4\" (997-671-005-3_Configuration_ES,\
    \ p. 21) [F8] declara 4 Equipos y la enumeración servida lista 20 (997-671-005-3_Configuration_ES,\
    \ p. 20) [F7]."
