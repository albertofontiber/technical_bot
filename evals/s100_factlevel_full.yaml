- qid: cat010
  question: ¿Cómo se alimenta la sirena/avisador intrínsecamente seguro IS-mA1 en
    una zona peligrosa (ATEX) y cuáles son sus parámetros de seguridad intrínseca
    de entrada?
  answer: '## Alimentación e IS del IS-mA1 en zona peligrosa (ATEX)


    El IS-mA1 es apto para zonas 0, 1 y 2 con gases y vapores inflamables de grupos
    IIA, IIB e IIC, clases de temperatura T1 a T4 [F1].


    ---


    ### Clasificación ATEX


    - Marcado: **II 1G Ex ia IIC T4 Ga** [F1]

    - Temperatura ambiente: **-40 °C ≤ Ta ≤ +60 °C** [F1]

    - Certificado: **SIRA 05ATEX2084X** (sufijo X = condiciones especiales de uso)
    [F1]

    - Norma: **EN54-3, Tipo B** [F1]


    ---


    ### Parámetros de seguridad intrínseca de entrada (Entity Parameters)


    **Terminales + respecto a − (alimentación principal):**

    - **Ui = 28 V** [F1][F3]

    - **Ii = 93 mA** [F1][F3]

    - **Pi = 660 mW** [F1][F3]

    - **Ci = 0** [F1][F3]

    - **Li = 0** [F1][F3]


    **Terminales S2 y S3 respecto a − (cambio de tono/etapa):**

    - **Ui = 28 V** [F1][F3]

    - **Ii = 0 mA** [F1][F3]

    - **Ci = 0** [F3]


    > ⚠️ **Importante:** La corriente de entrada permitida en S2 y S3 es **cero**.
    Por ello, estos terminales **solo pueden conectarse** a una barrera de retorno
    de diodo, un relé intrínsecamente seguro o un aislador galvánico, todos ellos
    certificados por un Organismo Notificado CE. Solo se admiten barreras de retorno
    de diodo con **caída de tensión inferior a 0,9 V** [F5][F6].


    ---


    ### Aparato asociado requerido (zona segura)


    El aparato asociado debe proporcionar parámetros de salida **iguales o inferiores**
    a los de entrada del IS-mA1 [F3]:


    **Para terminales +/− → Barrera Zener o aislador galvánico:**

    - Uo ≤ 28 V

    - Io ≤ 93 mA

    - Po ≤ 660 mW

    - Co ≥ Ccable

    - Lo ≥ Lcable


    **Para terminales S2/S3 → Barrera de retorno de diodo o relé galvánico aislado:**

    - Uo = 0 / Io = 0 (relé galvánico aislado) [F3]

    - Uo ≤ 28 V / Io = 0 (barrera de retorno de diodo) [F4]


    ---


    ### Limitación de capacitancia de cable


    La capacitancia total conectada a los terminales +/− (Ccable más cualquier otra
    capacitancia) **no debe superar 83 nF** [F3][F4].


    ---


    ### Opciones de diseño del circuito


    **Con barreras Zener:**

    - Alarma de una etapa con interruptor en positivo: barrera Zener de un solo canal
    [F8]

    - Alarma de una etapa con interruptor en negativo: barrera Zener + barrera de
    retorno de diodo [F8]

    - Alarma multietapa: barrera Zener (28 V / 93 mA) + barreras de retorno de diodo
    para S2 (2.ª etapa) y S3 (3.ª etapa) [F7]


    **Con aisladores galvánicos:**

    - No requieren conexión a tierra de alta integridad [F10]

    - Alarma de una etapa: aislador galvánico certificado Ex ia con parámetros dentro
    de los límites de la sección 4.3 [F10]

    - Alarma multietapa: aislador galvánico + relés galvánicos aislados con parámetros
    dentro de los límites de la sección 4.4 [F10]


    ---


    ### Advertencias adicionales


    - ⚠️ El número de certificado lleva sufijo **''X''**: consultar las condiciones
    especiales de uso del certificado **SIRA 05ATEX2084X** antes de instalar [F1]

    - ⚠️ La distancia entre terminales S2 y S3 es **inferior a 6 mm** — precaución
    en el conexionado [F3][F4]

    - ⚠️ La unión entre conexiones de conducto no es automática y debe realizarse
    como parte de la instalación [F3]

    - ⚠️ Desconectar la alimentación antes de cualquier intervención para evitar ignición
    [F3]

    - La carcasa es de **plástico ABS** — proteger de sustancias agresivas [F1]

    - Grado de protección: **IP65** [F3]

    - La instalación debe realizarse por personal cualificado [F1]

    - Las reparaciones solo pueden realizarse por el fabricante o según el código
    de práctica aplicable [F1]


    ---


    **Fuentes:**

    - IS5001-F_IS-mA1_EN (Issue E, 27-11-09)

    - manual IS MA1 (Issue H, 03-01-2020)


    ---

    ⚠️ **Información adicional del manual:**

    - "CAUTION - The clearance between sounder terminals S2 and S3 is less than 6mm."
    [F3]

    - "CAUTION - Bonding between conduit connections is not automatic and must be
    provided as part of this installation." [F3]'
