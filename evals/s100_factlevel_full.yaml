- qid: hp007
  question: ¿Cómo se realiza el test anual de un detector VESDA-E VEP según el manual
    del fabricante?
  answer: '## Test anual del detector VESDA-E VEP según el manual del fabricante


    Según la **Tabla 7-1** del manual [F1], las tareas que corresponden a frecuencia
    **anual** (una vez al año) para el detector **VEP-A10-P** son las siguientes:


    ---


    ### Tareas de mantenimiento anual


    1. **Realizar una prueba de humos** para comprobar la integridad de la red de
    tubería [F1]

    2. **Comprobar el flujo de la red de tubería** [F1]

    3. **Limpiar los puntos de muestreo** [F1]

    4. **Limpiar con agua la red de tubería** [F1]


    ---


    ### Consideraciones previas obligatorias antes de cualquier prueba


    Antes de iniciar el mantenimiento o las pruebas, el manual indica [F1]:


    - Informar a la autoridad supervisora adecuada.

    - Asegurarse de que se aíslen los dispositivos existentes que dependan del detector
    antes de que se ponga en funcionamiento.

    - Cuando se realicen las pruebas de humo, seguir los procedimientos del sitio
    para evitar falsas alarmas para los servicios supervisados.


    > ⚠️ **Precaución [F1]:** Cuando el detector está deshabilitado o en espera, **no
    emitirá advertencias de fuego**.


    ---


    ### Modo en espera durante el mantenimiento de tubería


    Para el mantenimiento de la red de tubería o los puntos de muestreo, el manual
    recomienda establecer el detector en **modo en espera** [F7]:


    - Desde **Xtralis VSC**: selecciona *"Go to Standby"* en el menú *"Device"* [F7].

    - En este modo se desactiva el aspirador y se detiene la detección de alarmas
    (pero **no** la detección ni señalización de fallos) [F7].

    - Para volver a activar la unidad: selecciona *"End Standby"* en el menú *"Device"*
    [F7].


    ---


    ### Prueba de humos: detalle del procedimiento


    El manual indica que la prueba de humos consiste en [F2]:


    - Introducir una muestra de humo en el **orificio de muestreo más alejado**.

    - Medir el **tiempo de transporte** hasta que el humo llega al detector.

    - Registrar los resultados y compararlos con pruebas posteriores para tener en
    cuenta variaciones del sistema.


    > 📋 Para el procedimiento detallado de la prueba de humos, el manual remite a
    la **VESDA-E Commissioning Guide** [F2].


    ---


    ### Comandos de prueba disponibles desde Xtralis VSC


    El software **Xtralis VSC** permite ejecutar los siguientes comandos de prueba
    relevantes [F5]:


    - **Start Alarm Test**: simula nivel de humo de escala completa, generando condiciones
    de Alerta, Acción, Fuego 1 y Fuego 2. Activa los relés de alarma salvo que el
    detector esté desactivado.

    - **Start Air Flow Fault Test**: comprueba el sistema de detección de circulación
    del aire apagando el aspirador.

    - **Start Relay Test**: activa y desactiva los relés disponibles para probarlos.

    - **Start Major Fault Test**: genera un fallo importante y desactiva el relé de
    fallo durante **2 minutos** [F5].

    - **Start Minor Fault Test**: genera un fallo menor y desactiva el relé de fallo
    durante **2 minutos** [F5].


    ---


    ### Nota sobre otras frecuencias de mantenimiento


    - **Cada 3 meses**: Fuente de alimentación y batería [F1].

    - **Cada 6 meses**: Comprobar la red de tubería [F1].

    - **Cada 2 años**: Sustitución del filtro [F1].


    El manual indica que la frecuencia puede variar en función de los códigos y normas
    locales, y del entorno de la instalación [F1].


    ---


    **Fuente:** 33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores (sin revisión
    registrada); 33976_13_VESDA-E_VEP-A00-P_Product_Guide_A4_Spanish_lores (sin revisión
    registrada)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "**Atención:** Pendant que le detecteur ou la zone est desactivee, aucun feu
    d''indication va etre emis par le detecteur." (33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores,
    p. 87) [F1]

    - "Se debe realizar una comprobación preliminar del sistema después de instalar
    el detector VEP-A10-P y antes de ponerlo en marcha." (33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores,
    p. 54) [F6]'
