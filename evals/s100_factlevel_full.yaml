  question: Necesito un detector de llama SharpEye «40/40» (Spectrex / Notifier) para
    una instalación; ¿qué modelo pido?
  answer: 'La familia SharpEye "40/40" tiene **cinco variantes con tecnología de detección
    distinta** y no son intercambiables entre sí. Necesito que me indiques el tipo
    de riesgo/combustible para recomendarte el modelo correcto.


    Estas son las variantes disponibles según los fragmentos:


    - **S40/40I** — Detector de llama de **triple espectro infrarrojo (IR3)** [F1]

    - **S40/40L / LB / L4 / L4B** — Detector de llama **UV/IR** [F2]

    - **S40/40R** — Detector de llama **infrarrojo simple (Single IR)** [F3]

    - **S40/40M** — Detector de llama de **múltiple infrarrojo** (llamas de hidrógeno
    e hidrocarburo) [F4]

    - **S40/40U / UB** — Detector de llama **UV** [F5]


    Además, los fragmentos mencionan dos variantes adicionales en la documentación
    de la serie: **S40/40UFI** (Ultra Fast IR3) y **S40/40UFL** (Ultra Fast UV/IR)
    [F7], aunque no tengo manuales completos de estas dos en los fragmentos disponibles.


    ---


    **Para elegir el modelo correcto, dime:**


    1. ¿Qué tipo de combustible/riesgo cubre la instalación? (hidrocarburos, hidrógeno,
    alcoholes, otros)

    2. ¿Necesitas homologación ATEX/IECEx o FM/CSA?

    3. ¿Hay requisitos de velocidad de respuesta (detección ultra rápida)?


    Con esos datos te indico el modelo exacto y el código de pedido con sus opciones
    (carcasa, entrada de cable, rango de temperatura, configuración de cableado).


    ---


    Fuentes: MNDT721_40-40I; MNDT722_40-40L; MNDT724_40-40R; MNDT725_40-40M; MNDT723_40-40U;
    manual-sharpeye-40-40-series-winhost-spectrex-en-us-4845694 (todas sin revisión
    registrada)'
