- qid: cat012
  question: ¿Cómo se calcula la capacidad de batería (en Ah) necesaria para la central
    AM-8200?
  answer: "# Cálculo de capacidad de batería (Ah) para la central AM-8200\n\nLa fórmula\
    \ de cálculo es: **Ah Batería = (A + B) × 1,2** [F6][F7], donde:\n\n- **A** =\
    \ Corriente en espera (reposo) × horas de autonomía requeridas\n- **B** = Corriente\
    \ en alarma × **0,5 h** [F6][F7]\n- **1,2** = Factor de corrección por tolerancias\
    \ de fabricación de las baterías [F5]\n\n---\n\n## Paso a paso del cálculo\n\n\
    ### PASO 1 — Calcular la corriente total en reposo (columna A)\n\nSuma los consumos\
    \ de cada tarjeta instalada en condiciones de NO alarma (valores a 24 Vcc desde\
    \ baterías) [F1]:\n\n- **AM-8200-KLCD (CPU-AM-8200):** 113 mA\n- **AM-82-BBMB\
    \ (CPU-AM-8200BB):** 95 mA\n- **LIB-8200:** 53 mA\n- **AM82-2S2C (RS232/485/BUS-CAN):**\
    \ 32 mA\n\nA estos valores añade:\n- Corriente de los lazos en reposo (consultar\
    \ fichas de datos de cada dispositivo) [F5]\n- Corriente de dispositivos en salida\
    \ de 24 Vcc usuario (máx. 2 A) [F7]\n- Corriente de campanas, sirenas, flashes\
    \ en reposo = **0** [F7]\n\nMultiplica el total por las horas de autonomía requeridas:\
    \ **(x 24 h) o (x 72 h)** según la normativa aplicable [F7] → resultado en **Ah\
    \ (valor A)**\n\n---\n\n### PASO 2 — Calcular la corriente adicional en alarma\
    \ (columna B)\n\nSuma los consumos adicionales en condiciones de ALARMA (valores\
    \ a 24 Vcc desde baterías) [F1]:\n\n- **AM-8200-KLCD (CPU-AM-8200):** 255 mA\n\
    - **AM-82-BBMB (CPU-AM-8200BB):** 95 mA\n- **LIB-8200:** 53 mA\n- **AM82-2S2C:**\
    \ 32 mA\n\nA estos valores añade:\n- Corriente de los lazos en alarma — la central\
    \ activa **solo los primeros 6 LED** de detectores y módulos en alarma [F5]\n\
    - Corriente de sirenas, campanas, flashes y otros dispositivos activados en alarma\
    \ [F7]\n- Corriente de salida usuario en alarma (máx. 2 A) [F7]\n\nMultiplica\
    \ el total por **0,5 h** [F7] → resultado en **Ah (valor B)**\n\n> ⚠️ **Nota importante:**\
    \ Si la corriente total calculada supera **3,5 A**, la corriente en exceso durante\
    \ alarma se extrae de las baterías [F5]. Tenlo en cuenta al dimensionar.\n\n---\n\
    \n### PASO 3 — Aplicar la fórmula final\n\n**Ah Batería = (A + B) × 1,2** [F6][F7]\n\
    \n---\n\n## Límites del sistema a verificar\n\n- Corriente total de todos los\
    \ lazos: **inferior a 750 mA** [F5]\n- Corriente total en salida de 24 Vcc usuario:\
    \ **inferior a 2 A** [F5]\n- Capacidad de baterías admitida: **mín. 7 Ah — máx.\
    \ 18 Ah** (2 × 12 V) [F3]\n\n---\n\n## Baterías recomendadas por el fabricante\
    \ [F3]\n\n- Yuasa **NP18-12B** o **NP7-12BFR** (UL94) — 12 V / 17,2 Ah (20 h)\n\
    - Fiamm **FG21803** o **FGV21803** (UL94) — 12 V / 18 Ah (20 h)\n\n---\n\n> \U0001F4CB\
    \ El manual indica que para completar el cálculo debes usar la **Tabla 2** (para\
    \ consumos de lazos) y el **apéndice al final del manual** con las hojas de cálculo\
    \ completas [F1][F5].\n\n---\n\n**Fuente:** AM-8200 Manual de Instalación — Doc.\
    \ AM-8200-ESP Rev. A.3 (sin revisión de fecha registrada)\n\n---\n⚠️ **Información\
    \ adicional del manual:**\n- \"4 La corriente en las condiciones de reposo o alarma\
    \ no puede superar, en ningún caso, la capacidad de la fuente de alimentación.\"\
    \ [F5]\n- Nota: el manual también indica: \"## *<ins>3.13 - CONSUMO DE CORRIENTE\
    \ DE LAS BATERÍAS</ins>*\n\n* Consumo de las baterías en **condiciones normales**\
    \ en ausencia de la tensión de red 230 Vca:\n\n  * **Tarjeta AM-8200-KLCD (CPU-AM-8200)**\
    \ con tensión nominal (24 Vcc): 113 mA\n  * **Tarjeta AM-82-BBMB (CPU-AM-8200BB)**\
    \ con tensión nominal (24 Vcc): 95 mA\n  * **Tarjeta LIB-8200 (LIB)** con tensión\
    \ nominal (24 Vcc): 53 mA\n  * **Tarjeta AM82-2S2C (INTERFAZ RS232/485/BUS-CAN)**\
    \ con tensión nominal (24 Vcc): 32 mA\n\n* Consumo de las baterías en **condiciones\
    \ de alarma** en ausencia de la tensión de red 230 Vca:\n\n  * **Tarjeta AM-8200-KLCD\
    \ (CPU-AM-8200)** con tensión nominal (24 Vcc): 255 mA\n  * **Tarjeta AM-82-BBMB\
    \ (CPU-AM-8200BB)** con tensión nominal (24 Vcc): 95 mA\n  * **Tarjeta LIB-8200\
    \ (LIB)** con tensión nominal (24 Vcc): 53mA\n  * **Tarjeta AM82-2S2C (INTERFAZ\
    \ RS232/485/BUS-CAN)** con tensión nominal (24 Vcc): 32 mA\" [F1]\n\n---\n\U0001F4D6\
    \ **Obligaciones de evidencia del manual:**\n- \"Calcular la corriente total necesaria\
    \ para todos los lazos usando **la tabla 2 (ver a continuación)** teniendo presente\
    \ que la central enciende **solo los primeros 6 LED** de los detectores y módulos\
    \ de entrada en alarma.\" (AM-8200 Manual Instalacion, p. 53) [F5]"
