  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: '## Sustitución de la batería de litio del ADW535 — conservación de
    configuración


    La configuración del ADW535 **no se pierde al cambiar la batería**, porque los
    parámetros específicos del sistema están almacenados en la **EEPROM** del equipo
    [F7], no en la batería de litio. La batería de litio está asociada al **módulo
    de reloj RTC** [F1].


    ---


    ### Lo que sí debes tener en cuenta


    **Antes de intervenir:**

    - Bloquea o desconecta los controles de incendios y alertas remotas en la CDI
    de orden superior [F3], ya que cualquier interrupción de tensión provoca un disparo
    momentáneo del relé de fallo (aprox. **1 s**) [F5].


    **Sobre la batería:**

    - El fragmento recuperado indica que el código de fallo **008 "Fallo reloj"**
    puede deberse a que la **cinta aislante de la batería de litio aún no se ha retirado**,
    o a que el reloj no está ajustado [F6].

    - La batería de litio está ubicada en el **Main Board LMB 35** [F1].


    **Tras la sustitución:**

    - Verifica que el **reloj RTC esté correctamente ajustado** [F6].

    - Si solo sustituyes la batería (sin cambiar el LMB 35), **no es necesario un
    reset inicial** — los parámetros se conservan en la EEPROM [F7].


    ---


    ### ⚠️ Advertencia importante


    El manual no describe un procedimiento paso a paso específico para la sustitución
    de la batería de litio en los fragmentos disponibles. Lo que sí documenta es el
    procedimiento completo de sustitución del **LMB 35** completo [F2], que es una
    operación más invasiva y **sí requiere reset inicial y reconfiguración** [F2].


    Si necesitas el procedimiento detallado de cambio de batería, consulta el manual
    físico **ADW535_TD_T140358es_e** o contacta con el soporte técnico de Securiton/Detnov.


    ---


    Fuente: ADW535 Descripción técnica, T 140 358 e es (sin revisión registrada)


    ---

    ⚠️ **Información adicional del manual:**

    - "* Una vez sustituido el LMB 35, será imprescindible realizar un **nuevo reset
    inicial** (véase al respecto el cap." [F2]

    - "Para evitar que los controles de incendios, las alertas remotas y las zonas
    de extinción se disparen al llevar a cabo los trabajos de mantenimiento, es **imprescindible**
    bloquearlos o desconectarlos previamente." [F3]'
