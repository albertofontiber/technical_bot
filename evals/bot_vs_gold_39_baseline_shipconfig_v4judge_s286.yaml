  bot_answer: '## Conexionado del M710 / MI-DMMI en el lazo


    Hay **dos modos de conexionado** disponibles: 2 estados y 3 estados.


    ---


    ### Terminales de lazo (comunes a ambos modos)


    - **Terminal 1:** Salida del lazo – [F3]

    - **Terminal 2:** Salida del lazo + (con aislador interno activo) [F3]

    - **Terminal 3:** Entrada del lazo – [F3]

    - **Terminal 4:** Entrada del lazo + [F3]

    - **Terminal 5:** Salida del lazo + alternativa (ver nota aislador) [F3]


    ---


    ### Modo 2 estados (contacto en corto = alarma)


    - Resistencia de fin de línea: **RFL = 47 kΩ** conectada a los terminales **6-7**
    (Entrada A) [F1]

    - El cortocircuito en el contacto supervisado se señaliza como **alarma** [F1]


    ---


    ### Modo 3 estados (cortocircuito = avería, no alarma)


    - Resistencia de fin de línea: **RFL = 47 kΩ** [F1]

    - Adicionalmente, se debe conectar una resistencia de **18 kΩ en serie con cada
    contacto de alarma** que se desee supervisar [F1][F3]

    - El modelo de resistencia para el M710 es **M200E-EOL-R18** [F3][F5]

    - Esto permite que la central distinga cortocircuito como **avería** en lugar
    de alarma, siempre que el panel de control sea compatible [F3]


    ---


    ### Nota sobre el aislador interno de cortocircuitos


    - **Con aislador activo:** conectar la salida + del lazo al **terminal 2** [F3]

    - **Sin aislador (bypass):** conectar la salida + del lazo al **terminal 5** en
    lugar del terminal 2. El terminal 5 está conectado internamente con el terminal
    4 [F3][F5]


    > ⚠️ El M710 **no tiene conexiones en los terminales 8 y 9** — esos terminales
    son exclusivos del M720 (entrada doble) [F3][F5]


    ---


    Para el detalle visual del esquema de conexionado, consulta la **Figura 3** del
    manual I56-2005-002 (M710) [F3] y la **Figura 3** del manual I56-2006-004 (MI-DMMI)
    [F2].


    **Fuentes:**

    - Conexionado-del-modulo-M710-MI-DMMI (sin revisión registrada)

    - I56-2005-002 M710 M720 M721 M701 (sin revisión registrada)

    - I56-2006-004 MI-DMMI_DMM2I_D2ICMO (sin revisión registrada)


    ---

    📖 **Información adicional del manual:**

    - "1. Si no se necesita el aislamiento de cortocircuitos, se debe conectar la
    salida + del lazo al terminal 5 en vez de al terminal 2. El terminal 5 está conectado
    internamente con el terminal 4.

    2. El circuito con línea intermitente conectado a los terminales 8 y 9 se debe
    utilizar únicamente con el M720. El M710 no tiene conexiones con estos terminales.

    3. Si el panel de control lo permite, se podrá indicar un cortocircuito como avería
    en lugar de alarma. Para ello hay que conectar una resistencia de 18 KΩ (M200E-EOL-R18)
    en serie con cada equipo que se desee supervisar." [F3]

    - "1. En no se necesita el aislamiento de cortocircuitos, se debe conectar la
    salida + del lazo al terminal 5 en vez de al terminal 2. El terminal 5 está conectado
    internamente con el terminal 2.


    2. Si el panel de control lo permite, se podrá indicar un cortocircuito como puede
    el lugar de alarma. Para ello hay que conectar una resistencia de 18 kΩ en serie
    con cada conmutador de alarma. Para ello hay que conectar una resistencia de 18
    kΩ en serie con cada conmutador de alarma." [F2]'
