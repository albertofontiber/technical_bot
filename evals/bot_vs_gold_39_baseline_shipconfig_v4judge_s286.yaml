  question: ¿Cómo se alimenta la sirena/avisador intrínsecamente seguro IS-mA1 en
    una zona peligrosa (ATEX) y cuáles son sus parámetros de seguridad intrínseca
    de entrada?
  judge_vara: v4
  gold_estado: verificado
  conducta_esperada: answer
  conducta_bot: answer
  veredicto: PARCIAL
  diagnostico: 'Cubre correctamente los parámetros de seguridad intrínseca de entrada
    Ui/Ii/Pi/Ci/Li y el marcado ATEX. Sin embargo, falta el fact CORE de alimentación
    completa: no indica que se alimenta a 24 Vdc mediante barrera/aislador 28 V/93
    mA resistivo ni la advertencia de no operar continuamente sin barrera por encima
    de 16 V.'
  bot_sources:
  - IS5001-F_IS-mA1_EN
  - manual IS MA1
  coverage_status: appended
  coverage_appended_rows: 1
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: '## Alimentación e parámetros de seguridad intrínseca del IS-mA1


    La sirena **IS-mA1** se alimenta desde una ubicación no peligrosa a través de
    un aparato asociado certificado (barrera zener, aislador galvánico o barrera de
    diodo de retorno), conectado a los **terminales + y −** del equipo [F1][F3][F4].


    ---


    ### Clasificación ATEX / IECEx


    - Marcado: **II 1G Ex ia IIC T4 Ga** [F1]

    - Temperatura ambiente: **-40 °C ≤ Ta ≤ +60 °C** [F1]

    - Zonas de uso: **Zona 0, 1 y 2** con gases y vapores inflamables, grupos **IIA,
    IIB e IIC**, clases de temperatura **T1 a T4** [F1]

    - Certificados: **SIRA 05ATEX2084X** / **IECEx SIR 06.0045X** [F1]

    - Norma de producto: **EN54-3 Tipo B** [F1]


    ---


    ### Parámetros de entidad — Terminales + / − (alimentación principal)


    - **Ui = 28 V** [F1][F3]

    - **Ii = 93 mA** [F1][F3]

    - **Pi = 660 mW** [F1][F3]

    - **Ci = 0** [F1][F3]

    - **Li = 0** [F1][F3]


    > ⚠️ La capacitancia total conectada a los terminales +/−, incluyendo la capacitancia
    del cable (C_cable) más cualquier otra capacitancia, **no debe superar 83 nF**
    [F3][F4].


    ---


    ### Parámetros de entidad — Terminales S2 y S3 (cambio de tono de alarma)


    - **Ui = 28 V** [F3][F5]

    - **Ii = 0 mA** [F3][F5]

    - **Ci = 0** [F3]

    - Uo = 16,8 V / Io = 7,3 mA / Po = 31 mW (parámetros de salida hacia la zona segura)
    [F3]


    > ⚠️ Dado que la corriente de entrada permitida es **cero**, los terminales S2
    y S3 **solo pueden conectarse** a: barrera de diodo de retorno, relé intrínsecamente
    seguro o aislador galvánico, todos certificados por un Organismo Notificado. Solo
    se admiten barreras de diodo de retorno con **caída de tensión inferior a 0,9
    V**. Alternativamente, pueden conectarse directamente a un **interruptor de accionamiento
    mecánico** dentro de la zona peligrosa [F5].


    > ⚠️ La distancia entre los terminales S2 y S3 es **inferior a 6 mm** — precaución
    durante el conexionado [F3][F4].


    ---


    ### Requisitos del aparato asociado (zona segura)


    **Opción 1 — Barrera zener con diodo de retorno** [F3]:

    - Uo ≤ 28 V

    - Io ≤ 93 mA

    - Po ≤ 660 mW

    - Co ≥ C_cable

    - Lo ≥ L_cable


    **Opción 2 — Fuente galvánicamente aislada** [F4]:

    - Uo ≤ 28 V

    - Io ≤ 93 mA

    - Po ≤ 660 mW

    - Co ≥ C_cable

    - Lo ≥ L_cable


    En ambos casos, el aparato asociado debe estar **aprobado/certificado** y se debe
    seguir el plano de instalación del fabricante del aparato asociado [F3][F4].


    ---


    ### Advertencias generales de instalación


    - La instalación debe realizarla **personal cualificado** [F1]

    - La reparación solo puede realizarla el **fabricante** o según el código de práctica
    aplicable [F1]

    - La carcasa es de **plástico ABS** — protegerla de sustancias agresivas (ácidos,
    disolventes) [F1]

    - El certificado lleva sufijo **''X''**: existen condiciones especiales de uso
    seguro que deben consultarse en el certificado [F1]

    - **Desconectar la alimentación antes de cualquier intervención** para evitar
    ignición de atmósferas inflamables [F3][F4]

    - La unión entre conexiones de conducto **no es automática** y debe garantizarse
    en la instalación [F3][F4]

    - Limpiar únicamente con **paño húmedo** para evitar cargas electrostáticas [F1]


    ---


    Fuente: IS5001-F_IS-mA1_EN (sin revisión registrada); manual IS MA1 (Issue H,
    03-01-2020)


    ---

    ⚠️ **Información adicional del manual:**

    - "CAUTION - The clearance between sounder terminals S2 and S3 is less than 6mm."
    [F3]

    - "CAUTION - Bonding between conduit connections is not automatic and must be
    provided as part of this installation." [F3]


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "The IS-mA1 minialarm is an ATEX and IECEx certified intrinsically safe sounder
    which produces a loud warning signal in a hazardous area." (IS5001-F_IS-mA1_EN,
    p. 1) [F6]'
