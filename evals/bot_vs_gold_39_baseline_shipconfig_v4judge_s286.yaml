    del fabricante?
  judge_vara: v4
  gold_estado: verificado
  conducta_esperada: answer
  conducta_bot: answer
  veredicto: PASS
  diagnostico: 'Cubre todos los facts CORE del mantenimiento anual: prueba de humos,
    comprobación de flujo, limpieza de puntos de muestreo y limpieza con agua de la
    tubería. Además incluye precauciones relevantes y no presenta errores sustantivos
    frente al gold.'
  bot_sources:
  - 33976_13_VESDA-E_VEP-A00-P_Product_Guide_A4_Spanish_lores
  - 33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores
  coverage_status: appended
  coverage_appended_rows: 1
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: '# Test anual del detector VESDA-E VEP-A10-P


    Según la **Tabla 7-1** del manual, las tareas que corresponden a frecuencia **anual**
    para el VEP-A10-P son las siguientes [F1]:


    - **Realizar una prueba de humos** para comprobar la integridad de la red de tubería

    - **Comprobar el flujo** de la red de tubería

    - **Limpiar los puntos de muestreo**

    - **Limpiar con agua la red de tubería**


    ---


    ## Procedimiento previo obligatorio (antes de cualquier tarea)


    Antes de iniciar el mantenimiento, el manual indica [F1]:


    1. **Informar a la autoridad supervisora adecuada.**

    2. **Aislar los dispositivos existentes** que dependan del detector antes de ponerlo
    en funcionamiento.


    > ⚠️ **Precaución:** Cuando el detector está deshabilitado o en espera, **no emitirá
    advertencias de fuego** [F1].


    ---


    ## Puesta en modo en espera (recomendado durante el mantenimiento de tubería y
    puntos de muestreo)


    Para trabajar sobre la red de tubería o los puntos de muestreo, se recomienda
    establecer el detector en **modo en espera** [F5]:


    1. Desde **Xtralis VSC**, selecciona **"Ir a modo en espera" (Go to Standby)**
    en el menú **Dispositivo (Device)**.

    2. El **LED desactivado parpadeará** y se apagará el aspirador.

    3. Al terminar, selecciona **"Finalizar modo en espera" (End Standby)** en el
    menú **Dispositivo (Device)** para reactivar la unidad [F5].


    > Nota: En modo en espera se desactiva el aspirador y se detiene la detección
    de alarmas, pero **no** la detección ni señalización de fallos [F5].


    ---


    ## Prueba de humos anual


    La prueba de humos consiste en introducir una muestra de humo en el **orificio
    de muestreo más alejado** y medir el tiempo que tarda en llegar al detector [F2].
    Los resultados se registran y se comparan con pruebas posteriores para detectar
    variaciones del sistema [F2].


    > 📋 El manual remite al documento **"VESDA-E Commissioning Guide"** para los detalles
    completos del procedimiento de prueba de humos [F2]. Consulta ese documento para
    el paso a paso detallado.


    ---


    ## Notas adicionales del fabricante [F1]


    - La frecuencia puede variar según **códigos y normas locales** y el entorno de
    la instalación.

    - El mantenimiento puede realizarlo el **instalador original, un distribuidor
    autorizado o el contratista de servicio**.

    - Durante las pruebas de humo, seguir los **procedimientos del sitio para evitar
    falsas alarmas**.


    ---


    **Fuente:** 33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores (sin revisión
    registrada)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "**Atención:** Pendant que le detecteur ou la zone est desactivee, aucun feu
    d''indication va etre emis par le detecteur." (33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores,
    p. 87) [F1]

    - "Se debe realizar una comprobación preliminar del sistema después de instalar
    el detector VEP-A10-P y antes de ponerlo en marcha." (33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores,
    p. 54) [F6]'
