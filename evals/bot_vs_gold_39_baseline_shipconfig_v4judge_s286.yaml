  diagnostico: 'Cubre parte del flujo de programación y da ejemplos de sintaxis, pero
    omite o desvirtúa facts CORE: no indica claramente el Tipo SW de los módulos de
    salida y no cita el Apéndice A ''Control By Event''. Además introduce una nota
