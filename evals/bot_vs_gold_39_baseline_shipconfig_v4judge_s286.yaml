  question: En la Morley RP1r, después de descargar la extinción el sistema no vuelve
    a estado normal tras resetear. ¿Qué comprobar?
  judge_vara: v4
  gold_estado: verificado
  conducta_esperada: answer
  conducta_bot: answer
  veredicto: PARCIAL
  diagnostico: 'La respuesta cubre ABORT, r.I y averías enclavadas, y añade comprobaciones
    útiles como Flow Press y rearme en nivel 2. Falta el fact CORE del parámetro t.A:
    duración de descarga/soak time, rango 05-295 s y valor por defecto ''--'' con
    circuito activo hasta rearme.'
  bot_sources:
  - HLSI-MA-103_GuiaRapida_RP1r-Supra_ES_lr
  - HLSI-MA-103_Quick start guide RP1r_Supra_GB
  - HLSI-MN-103_RP1r-Supra_lr
  coverage_status: appended
  coverage_appended_rows: 4
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: '# RP1r-Supra: Sistema no vuelve a estado normal tras resetear después
    de extinción


    El motivo más probable es que el **rearme esté inhibido temporalmente** por configuración,
    o que exista una **condición de avería activa** que impide el restablecimiento
    completo.


    ---


    ## Comprobaciones por orden


    ### 1. Verifica si el rearme está inhibido tras extinción (parámetro r.i)


    La central puede tener configurado un intervalo de inhibición del rearme tras
    la extinción [F8]:


    - **Valor `- -`**: Rearme inhibido hasta que finalice la extinción o se agote
    el tiempo configurado en el parámetro **t.A** (t.A → 0 seg.) [F8]

    - **Valor `00`** (por defecto): Rearme permitido en cualquier momento [F8]

    - **Valores `01` a `30`**: Rearme inhibido durante ese número de minutos desde
    que la central entró en estado ACTIVADO [F8]


    → Accede al modo de programación y comprueba el valor del parámetro **r.i**. Si
    está configurado con un valor de 01 a 30, la central no permitirá el rearme hasta
    que transcurra ese intervalo [F7][F8].


    ---


    ### 2. Comprueba si hay averías enclavadas activas


    Todas las averías son **por defecto enclavadas y requieren rearme manual** [F1].
    Revisa los LEDs de avería en el panel:


    - **LED "Avería circuito extinción"** intermitente → fallo en circuito extinción
    1 o 2 [F5]

    - **LED "Avería en paro"** intermitente + **LED "Paro"** fijo → el pulsador ABORT
    está activo o en fallo. **Este circuito requiere rearme manual obligatorio** y
    no admite rearme automático [F5]

    - **LED "Sirenas fallo/anuladas"** intermitente → fallo en circuito de sirenas
    [F5]

    - **LED "Avería presión baja"** o **"Avería presión flujo"** intermitente → señal
    de presión baja o flujo activa [F1]


    ---


    ### 3. Verifica el estado del pulsador ABORT


    Si el pulsador de paro de emergencia (ABORT) fue accionado durante la secuencia,
    la central **inhibe totalmente la lógica de extinción y requiere reseteo manual**
    para reanudar [F3]. Comprueba:


    - Que el pulsador ABORT esté físicamente liberado (no enclavado mecánicamente)

    - Que la entrada ABORT no esté en cortocircuito o fallo de supervisión [F5]


    ---


    ### 4. Procedimiento de rearme correcto


    Para rearmar la central [F1]:


    1. Accede al **nivel 2** de acceso (consultar sección **4.3. Niveles de acceso**
    del manual) [F1]

    2. Pulsa la tecla **"Rearme"** [F1]

    3. La central se reiniciará y todas las entradas enclavadas se restablecerán [F1]


    > ⚠️ Si el rearme sigue sin funcionar tras estos pasos, verifica que el tiempo
    de inhibición configurado en **r.i** haya transcurrido completamente antes de
    intentar rearmar [F8].


    ---


    Fuente: HLSI-MN-103_RP1r-Supra_lr (rev. v.07, 2018-05-01); HLSI-MA-103_GuiaRapida_RP1r-Supra_ES_lr
    (sin revisión registrada)'
