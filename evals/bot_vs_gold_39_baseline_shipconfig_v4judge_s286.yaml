  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: "# Cableado y configuración (alta) de lazo en INSPIRE E10/E15\n\nA continuación\
    \ se detalla el proceso completo en dos bloques: **cableado físico** y **configuración/auto-búsqueda**.\n\
    \n---\n\n## BLOQUE 1 — CABLEADO FÍSICO DEL LAZO\n\n### Módulo de lazo (OPAL X2\
    \ — código color Morado, ref. HOP-433-100)\n\nEl módulo gestiona **2 circuitos\
    \ de lazo independientes** [F2]. Los terminales son [F2][F3]:\n\n**Lazo 1:**\n\
    - Terminal **1** → Lazo 1 Salida +VE\n- Terminal **2** → Lazo 1 Salida -VE\n-\
    \ Terminal **3** → ⊕ *(NO usar para pantalla de cable)*\n- Terminal **4** → Lazo\
    \ 1 Entrada +VE\n- Terminal **5** → Lazo 1 Entrada -VE\n\n**Lazo 2:**\n- Terminal\
    \ **6** → Lazo 2 Salida +VE\n- Terminal **7** → Lazo 2 Salida -VE\n- Terminal\
    \ **8** → ⊕ *(NO usar para pantalla de cable)*\n- Terminal **9** → Lazo 2 Entrada\
    \ +VE\n- Terminal **10** → Lazo 2 Entrada -VE\n\n> ⚠️ **Los terminales 3 y 8 NO\
    \ deben usarse para la pantalla del cable de lazo. La pantalla debe conectarse\
    \ a la barra de tierra de la central** [F2][F3].\n\n### Topología del lazo\n\n\
    El lazo tiene **Salida** (terminales 1-2 / 6-7) y **Entrada** (terminales 4-5\
    \ / 9-10), lo que indica una topología en bucle cerrado. Para el esquema exacto\
    \ de conexionado entre dispositivos, consulta el diagrama del manual de instalación\
    \ **HOP-138-9ES** [F1].\n\n### Capacidad por lazo [F2]\n\n- Dispositivos **OPAL**:\
    \ hasta **159 detectores** + hasta **159 módulos** por lazo\n- Dispositivos **CLIP**:\
    \ hasta **99 detectores** + hasta **99 módulos** por lazo\n- Corriente máxima\
    \ por lazo: **750 mA** [F2]\n- Longitud máxima de cable: **hasta 3,5 km** (dependiendo\
    \ del tipo de carga y cable, calculado con la herramienta CLSS) [F2]\n\n> ⚠️ **No\
    \ mezclar dispositivos OPAL y CLIP en el mismo lazo** [F2].\n\n> ⚠️ **Restricción\
    \ EN54-2, art. 13.7**: máximo **512 detectores y/o pulsadores** por módulo de\
    \ lazo (los 2 circuitos en conjunto) [F2].\n\n### Numeración de lazos [F2]\n\n\
    Los circuitos se numeran **secuencialmente de izquierda a derecha** del portamódulos.\
    \ En la E15 (dos filas), la segunda fila continúa la numeración desde la primera\
    \ [F2].\n\n---\n\n## BLOQUE 2 — COMPROBACIONES PREVIAS AL ENCENDIDO\n\nAntes de\
    \ encender, realiza estas verificaciones con multímetro [F6][F7][F8]:\n\n1. Comprueba\
    \ la **continuidad** de cada parte del lazo y mide la resistencia extremo a extremo\
    \ [F6].\n2. Para medir: desconecta físicamente el lazo de los terminales de la\
    \ central, mide entre **Lazo X Entrada -VE** y **Lazo X Salida -VE**, multiplica\
    \ el resultado por 2 y suma la resistencia de cada aislador (**0,1 a 0,13 Ω**\
    \ por aislador) [F6].\n3. Verifica que la pantalla del cable no tenga conexión\
    \ a tierra en ningún otro punto del recorrido [F7].\n\n> ⚠️ **NUNCA uses un comprobador\
    \ de alta tensión (megóhmetro) en el circuito de lazo una vez conectados los dispositivos.\
    \ Solo multímetro de baja tensión** [F8].\n\n---\n\n## BLOQUE 3 — PRIMER ENCENDIDO\
    \ Y CONFIGURACIÓN INICIAL\n\n1. El **primer encendido** debe realizarse **sin\
    \ cableado externo conectado**, pero con la fuente de alimentación y un circuito\
    \ de lazo probado conectado [F1].\n2. Conecta el cable HMI de la puerta a la CPU\
    \ [F1].\n3. Conecta la corriente principal y las baterías (**2 × 12 V 24 Ah**\
    \ para E10/E15) [F1].\n\n---\n\n## BLOQUE 4 — AUTO CONFIGURACIÓN (alta del lazo)\n\
    \n### Paso previo obligatorio para lazos CLIP o TC800\n\n> ⚠️ La central tiene\
    \ licencia por defecto solo para **protocolo OPAL avanzado**. Para usar **CLIP\
    \ o TC800**, es necesaria una licencia adicional y configuración previa desde\
    \ **CLSS** antes de ejecutar Auto Configuración [F5].\n\n### Procedimiento de\
    \ Auto Configuración [F4][F5]\n\n1. En la pantalla de la central, selecciona **Auto\
    \ Configuración** para buscar dispositivos en el lazo. Lee el aviso emergente\
    \ y confirma seleccionando **Auto Configuración** / **Learn Devices** [F4].\n\n\
    2. Si necesitas cambiar el protocolo del lazo (OPAL/CLIP), el flujo es [F4]:\n\
    \   - Conecta la herramienta de configuración CLSS\n   - Configura un lazo vacío\
    \ con el protocolo deseado\n   - Envía la configuración a la central\n   - Ejecuta\
    \ la búsqueda de dispositivos\n\n3. Una vez completada la Auto Configuración,\
    \ selecciona la **flecha derecha >** junto al botón para ver el estado de averías\
    \ del lazo [F4].\n\n4. Lee los mensajes de avería y corrige los problemas detectados.\
    \ Selecciona **Hecho** al completar [F4].\n\n5. Si se han corregido averías, **repite\
    \ los pasos 1 a 4** [F4].\n\n6. **Repite el proceso para cada lazo** hasta descubrir\
    \ todos [F4].\n\n### Configuración de lazo desde CLSS [F5]\n\nEn **Ajustes → Ajustes\
    \ HMI → Tipo de marca**: selecciona **Notifier EN** [F5].\n\nEn **Ajustes de lazo**\
    \ [F5]:\n- Si el lazo **no se usa**: marca ☑ **Sin Uso**\n- Si se usa: configura\
    \ **Limitar a VdS 2540** (Sí/No) — el valor de resistencia cambia según la selección\
    \ (ejemplo: **93,5 Ω** con VdS2540 = No, protocolo OPAL) [F5]\n- Selecciona el\
    \ **Tipo de Cable**\n\n### Causas típicas de averías tras Auto Configuración [F4]\n\
    \n- Discordancia entre diseño de instalación y cableado\n- Averías en el cableado\n\
    - Fuente de RFI fuerte en el entorno\n- Error de módulo o fuente de alimentación\n\
    - Conexionado incorrecto en dispositivos\n\n---\n\n**Fuente:** HOP-138-8ES issue\
    \ 6 (01-2026) — INSPIRE E10/E15 Instrucciones de puesta en marcha; HOP-138-9ES\
    \ issue 5 (11-2025) — INSPIRE E10 Manual de instalación\n\n---\n\U0001F4D6 **Información\
    \ adicional del manual:**\n- \"- Left side: CPU module with 6 connection terminals\
    \ and external wiring connection point ②\n- Center top: HMI cable connection detail\
    \ showing CPU with points \"a\" and \"b\" marked as ①\n- Center middle: Central\
    \ unit internal view showing wiring connections with color-coded wires (brown,\
    \ yellow/green, blue) connecting to L and N terminals, marked as ②\n- Right side:\
    \ Power supply terminal block showing L (brown wire) and N (blue wire) connections\
    \ with earth (yellow/green wire)\n- Bottom center: Battery connection diagram\
    \ showing 2 x 12 V 24 Ah batteries with positive and negative terminals, marked\
    \ as ③\n- Bottom right: Circular detail view showing battery terminal connection\
    \ with + and - markings]\" [F1]"
