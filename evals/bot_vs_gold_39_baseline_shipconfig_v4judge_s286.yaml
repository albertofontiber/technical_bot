    °C hasta +60 °C** para la caja del detector y para el conducto de aspiración [F1].


    Detalles adicionales según variante de aplicación:


    - **Rango estándar — caja del detector:** –30 °C a +60 °C (UL: máx. +40 °C) [F1]

    - **Rango estándar — conducto de aspiración:** –30 °C a +60 °C [F1]

    - **Según estándar australiano AS 1603.8 — caja del detector:** –30 °C a +55 °C
    [F1]

    - **Según estándar australiano AS 1603.8 — conducto de aspiración:** –30 °C a
    +55 °C [F1]

    - **Uso en almacenes de ultracongelación:** rango restringido de –30 °C a 0 °C
    (requiere seguir la directriz T 131 390) [F3]

    - **Temperatura máx. de almacenamiento** (sin condensación): –30 °C a +70 °C [F1]


    **Consideraciones importantes:**


    - La fluctuación de temperatura máxima permitida durante el funcionamiento (tanto
    en la caja como en el conducto) es de **20 °C** [F1]. Si se superan oscilaciones
    de más de 20 °C, pueden ser necesarios ajustes especiales [F4][F5].

    - En recintos con temperatura superior a **50 °C** o humedad superior al **80
    % H rel.**, puede ser necesario instalar tramos de refrigeración en el conducto
    de aspiración [F4].

    - Es posible acordar con el fabricante rangos de temperatura inferiores o superiores.
