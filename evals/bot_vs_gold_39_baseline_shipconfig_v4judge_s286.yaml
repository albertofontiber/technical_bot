  coverage_status: appended
  coverage_appended_rows: 1
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: '## ASD532 — Clases EN 54-20 y configuración de monitorización de flujo
    de aire


    El ASD532 ofrece las **tres clases de sensibilidad según EN 54-20**: clase A (sensibilidad
    muy alta), clase B (sensibilidad alta) y clase C (sensibilidad normal) [F3].


    ---


    ### Clases de sensibilidad y posiciones de conmutador normativas


    La selección de clase se realiza mediante las **posiciones de conmutador del AMB
    32** [F4]:


    - **Clase A** → posición **A11** [F3]

    - **Clase B** → posiciones **b11 / b21** [F3]

    - **Clase C** → posiciones **C11 / C21 / C31** [F3]


    Estas posiciones son los **límites normativos del sistema según EN 54-20** [F3].
    Para la elección del sensor de humo adecuado según la clase, el manual remite
    a los capítulos 4.4.4.3 o al software **«ASD PipeFlow»** [F4].


    Los sensores de humo disponibles son [F4]:

    - **SSD 532-1**: rango de sensibilidad **0,5 %/m a 10 %/m**

    - **SSD 532-2**: rango de sensibilidad **0,1 %/m a 10 %/m**

    - **SSD 532-3**: rango de sensibilidad **0,02 %/m a 10 %/m**


    ---


    ### Monitorización del flujo de aire


    El ASD532 usa el **método de medición calorimétrico** (técnica de medición de
    flujo en masa) [F1].


    **Puesta en marcha — registro de valores nominales:**

    1. Con el conducto de aspiración intacto y limpio, ejecuta un **reset inicial**
    (posición de conmutador **U01**) [F3].

    2. El sistema registra y memoriza los valores de flujo medidos como **valor nominal
    = 100 %** [F1].

    3. Estos valores quedan centrados en la ventana de monitorización electrónica
    [F1].


    **Disparo de «Fallo flujo de aire»:**


    En las posiciones normativas **A11 a C31**, una variación superior a **±20 %**
    del valor nominal (es decir, por debajo del **80 %** por obstrucción/suciedad,
    o por encima del **120 %** por rotura de tubo) dispara el aviso «Fallo flujo de
    aire» tras un **tiempo de retardo de 300 s** [F1].


    Este umbral de **±20 %** es el exigido por **EN 54-20** para notificación de fallo
    [F1].


    **Compensación de perturbaciones:**

    - Función de **tiempo de retardo ajustable** para descartar turbulencias de aire
    [F1].

    - **Circuito de compensación de temperatura** para mitigar fluctuaciones de temperatura
    ambiente [F1].


    ---


    ### ⚠️ Posiciones no normativas W01–W44


    Las posiciones **W01 a W44** permiten configurar la monitorización del flujo con
    parámetros distintos [F2]:


    - Tiempo de retardo: **10 min o 60 min**

    - Desviación permitida: **±20 % o ±50 %**


    Sin embargo, estas posiciones **no están homologadas según EN 54-20** para la
    monitorización del flujo de aire [F1][F5]. Solo deben utilizarse **previa consulta
    con el fabricante** [F5].


    > Nota: las posiciones W01–W44 sí cumplen la sensibilidad de respuesta de alarma
    según EN 54-20 (clases A a C), pero no los límites normativos de monitorización
    de flujo [F5].


    ---


    Fuente: ASD532_TD_T140421es_a (sin revisión registrada)'
