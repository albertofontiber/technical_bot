  bot_answer: '## Conexionado de sirenas convencionales en la ZXe


    La ZXe dispone de **2 circuitos de sirena supervisados** (Salida A y Salida B)
    en placa [F2], cada uno con un consumo máximo de **1 A** [F6].


    ---


    ### Requisitos previos clave


    - **Sirenas polarizadas**: deben llevar diodo integrado para bloquear el consumo
    en supervisión inversa [F2].

    - **Sirenas/campanas sin polaridad**: es obligatorio instalar un diodo de polarización
    y protección en cada una [F2].

    - **Resistencia Final de Línea (RFL)**: **6,8 kΩ, 0,5 W mínimo**, al final del
    circuito, entre + y – de la última sirena [F6]. Si no hay ninguna sirena conectada,
    instala la RFL directamente en los terminales de la central [F4].


    ---


    ### Principio de supervisión


    El circuito se polariza en **inverso en reposo** para supervisar la línea (detecta
    apertura y cortocircuito). Al activarse la alarma, la polaridad se invierte a
    la normal y las sirenas disparan [F2]. La corriente de supervisión circula en
    sentido contrario a la de activación [F4].


    ---


    ### Pasos de conexionado


    1. **Localiza los terminales de sirena** en la placa de la ZXe (ZX2e: bloque etiquetado
    `SOUNDERS A+ A- B+ B-`; ZX5e: bloque `TB7` con terminales `A- A+ B- B+`) [F2].


    2. **Conecta las sirenas en cadena** desde los terminales de la central, respetando
    la polaridad (+/–) de cada dispositivo. Consulta la **Figura 15** del documento
    MIE-MI-530 para el esquema visual del circuito [F1].


    3. **Instala la RFL (6,8 kΩ / 0,5 W)** entre el terminal + y – de la **última
    sirena** del circuito [F6].


    4. **No realices ramales paralelos**: la supervisión se realiza sobre la línea
    directa hasta la RFL; los ramales no quedan supervisados [F5].


    ---


    ### Advertencias de cableado


    - **Sección mínima recomendada**: no inferior a **1,5 mm²** [F4], y verifica que
    la caída de tensión en la línea no impida el funcionamiento de las sirenas a mínima
    tensión de baterías (consulta las Tablas 10 y 11 del manual) [F1].

    - **Longitud máxima recomendada**: no superior a **1 km**; por encima de esa longitud,
    la capacitancia e inductancia del lazo pueden afectar al funcionamiento [F1].

    - **No enrolles el cable en los terminales**: corta y empalma correctamente para
    mantener la supervisión de línea [F1].


    ---


    > ⚠️ El conexionado exacto (topología visual del circuito) está representado en
    la **Figura 15** del documento MIE-MI-530rv001. Consulta esa figura en el manual
    físico para verificar el esquema antes de ejecutar el cableado.


    ---


    **Fuente:** Manual de Instalación ZX2e / ZX5e — Documento MIE-MI-530, Revisión
    001 (sin fecha registrada)


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "Cada sirena deberá tener un diodo integrado, para impedir el consumo en polarización
    inversa (supervisión)." (MIE-MI-530rv001, p. 21) [F2]

    - "Cada circuito de sirena se supervisa ante cortocircuito y circuito abierto."
    (MIE-MI-530rv001, p. 20) [F6]'
