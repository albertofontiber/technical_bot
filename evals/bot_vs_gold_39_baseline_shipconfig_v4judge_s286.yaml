  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: "## ASD535 — Alarma de flujo bajo: causa y diagnóstico\n\n**Flujo bajo\
    \ (valor < 100 %) indica obstrucción en el conducto de aspiración** [F1][F2].\n\
    \n---\n\n### Causa más probable\n\nSegún el manual, un valor de flujo por debajo\
    \ del **80 %** (con sensibilidad estándar ±20 %) dispara el aviso «fallo flujo\
    \ de aire» tras un tiempo de retardo de **300 s** [F1][F2]. El código de evento\
    \ asociado es el **código 001 — Obstrucción, conducto de aspiración** [F3].\n\n\
    Las causas concretas del código 001 son [F3]:\n- Orificios de aspiración obstruidos\n\
    - Salida de aire del ASD obstruida\n- Caja de filtro / unidad de filtrado sucia\
    \ o bloqueada\n- Sensor de flujo de aire sucio\n\n---\n\n### Procedimiento de\
    \ diagnóstico\n\n1. **Bloquea o desconecta** el control de incendios y la alerta\
    \ remota en la CDI de orden superior antes de intervenir [F5].\n\n2. **Lee el\
    \ valor de flujo actual**: abre la cubierta de la caja del detector, coloca el\
    \ conmutador en posición **V** y lee el porcentaje de flujo (cap. 7.6.1 del manual)\
    \ [F5].\n   - Valor < 100 % → confirma obstrucción [F1][F5].\n   - Si el valor\
    \ ya está por debajo del **90 %** (con sensibilidad ±20 % estándar), la inspección\
    \ del conducto es obligatoria aunque no haya disparado fallo todavía [F5].\n\n\
    3. **Inspecciona el conducto de aspiración** [F3][F5]:\n   - Comprueba los orificios\
    \ de aspiración y la salida de aire del ASD.\n   - Verifica que las transiciones\
    \ de tubo rígido a flexible no tienen fugas (si aplica) [F5].\n   - Comprueba\
    \ el orificio de inspección.\n\n4. **Inspecciona y limpia la caja de filtro /\
    \ unidad de filtrado** [F3].\n\n5. **Inspecciona y limpia el sensor de flujo de\
    \ aire** [F3].\n\n6. **Verifica la tensión de servicio** en los bornes **1 (+)\
    \ y 2 (−)**: valor nominal **12,3 a 13,8 V CC** (funcionamiento a 12 V) o **21,6\
    \ a 27,6 V CC** (funcionamiento a 24 V) [F5].\n\n7. Si tras la limpieza el fallo\
    \ persiste, comprueba también el **código 004** (parámetros LS-Ü fuera de rango\
    \ o sensor defectuoso) y el **código 008** (sensor de flujo defectuoso o no conectado)\
    \ [F3].\n\n8. Tras resolver la causa, realiza un **reset inicial** para que el\
    \ ASD535 registre de nuevo los valores nominales al 100 % [F2].\n\n---\n\n> ⚠️\
    \ **Advertencia**: En posiciones de conmutador **W01 a W48**, los valores de monitorización\
    \ de flujo **no están homologados según EN 54-20** y solo deben usarse previa\
    \ consulta con el fabricante [F2].\n\n---\n\n**Fuente:** ASD535 Descripción técnica,\
    \ T 131 192 h es (sin revisión registrada)\n\n---\n⚠️ **Información adicional\
    \ del manual:**\n- \"Para evitar que los controles de incendios, las alertas remotas\
    \ y las zonas de extinción se disparen al llevar a cabo los trabajos de mantenimiento,\
    \ es **imprescindible** bloquearlos o desconectarlos previamente.\" [F5]\n- Nota:\
    \ el manual también indica: \"1. Bloquear o desconectar el control de incendios\
