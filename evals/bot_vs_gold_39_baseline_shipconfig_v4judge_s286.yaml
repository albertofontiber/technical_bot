  bot_answer: "## Resistencia de fin de línea (EOL) en zonas de la NFS Supra\n\nLa\
    \ NFS Supra admite **dos tipos de final de línea** en las zonas, seleccionables\
    \ por configuración [F5]:\n\n- **Condensador de 47 µF** → modo EFL (capacitivo)\
    \ — **opción por defecto** [F3]\n- **Resistencia de 6K8 Ω** → modo RFL (resistivo)\
    \ [F5]\n\n---\n\n### Detalles del modo resistivo (RFL)\n\nEn modo resistivo, la\
    \ central admite un rango de resistencia final de línea entre **3 KΩ** y **7 KΩ**\
    \ [F5]:\n\n- **3 KΩ** → consumo máximo por zona: **2,5 mA** [F5]\n- **7 KΩ** →\
    \ consumo máximo por zona: **4 mA** [F5]\n- Valor estándar recomendado: **6K8\
    \ Ω** [F5]\n\n---\n\n### Cómo cambiar entre modo capacitivo y resistivo\n\n1.\
    \ Pulsa simultáneamente **Tecla TECLADO = ON + Tecla EVACUACIÓN = ON** para acceder\
    \ al menú de configuración de final de línea [F3]\n2. Usa la **Tecla REARME**\
    \ para cambiar cíclicamente la opción [F3]:\n   - **Led 1 Alarma (Rojo) encendido**\
    \ = Final de línea resistivo **6K8 Ω** [F3]\n   - **Led 2 Anulada (Ámbar) encendido**\
    \ = Final de línea capacitivo **47 µF** (por defecto) [F3]\n\n> ⚠️ Esta configuración\
    \ requiere **nivel de acceso 3** [F3]. Todas las zonas, incluidas las no usadas,\
    \ deben tener instalado su final de línea según la configuración elegida [F5].\n\
    \n---\n\nFuente: HLSI-MN-025_NFS Supra (rev. sin revisión registrada); HLSI-MN-025-I_NFS\
    \ Supra Series (rev. sin revisión registrada)\n\n---\n⚠️ **Obligaciones de evidencia\
    \ del manual:**\n- \"Esto significa que debe calcular el número de sensores a\
    \ instalar dependiendo de su consumo sin sobrepasar nunca los 32 sensores.\" (HLSI-MN-025_NFS\
    \ Supra, p. 28) [F2]\n- Nota: la fuente es inconsistente: \"La central NFS Supra\
    \ tiene cuatro, ocho o doce zonas de alarma.\" (HLSI-MN-025_NFS Supra, p. 27)\
