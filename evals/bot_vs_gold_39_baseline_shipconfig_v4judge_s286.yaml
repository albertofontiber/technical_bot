  bot_answer: "# CAD-150-8: Alta de detector nuevo en el lazo y prueba de funcionamiento\n\
    \n---\n\n## PARTE 1 — Dar de alta un detector nuevo (autobúsqueda del lazo)\n\n\
    El procedimiento para registrar un nuevo detector es realizar una **autobúsqueda\
    \ del lazo** [F1]:\n\n1. Accede al **menú BUCLE** desde la central [F1].\n2. Ejecuta\
    \ la **autobúsqueda** del lazo donde está instalado el nuevo detector. El sistema\
    \ escaneará el lazo y mostrará todos los elementos que detecte [F1].\n3. Verifica\
    \ que los elementos encontrados coinciden con los planos de la instalación [F1].\n\
    4. Una vez confirmado, accede al **menú ELEMENTOS** para asignar al nuevo detector:\n\
    \   - **Nombre/texto** identificativo [F1]\n   - **Zona** de ubicación [F1]\n\
    5. Si es necesario, accede al **menú ZONA** para crear o asignar la zona correspondiente\
    \ al nuevo detector [F1].\n6. Si el detector debe activar alguna salida o sirena,\
    \ configura la maniobra correspondiente en el **menú MANIOBRAS** [F1].\n\n> Puedes\
    \ verificar el estado del detector recién dado de alta desde **menú ELEMENTO →\
    \ VER**, donde se muestra: tipo de elemento, zona asignada, modo (conectado/desconectado/prueba)\
    \ y valor analógico (VA) [F4].\n\n---\n\n## PARTE 2 — Probar que el detector funciona\
    \ (modo prueba de zona)\n\nEl procedimiento recomendado es usar el **modo PRUEBA\
    \ de zona**, que permite verificar los detectores **sin necesidad de rearmar la\
    \ central** [F2]:\n\n1. Accede al **menú ZONA → Prueba** [F2].\n2. Introduce el\
    \ **rango de zonas** a poner en prueba (campo `RANGO`) [F2].\n3. El sistema preguntará\
    \ si deben dispararse las sirenas (`ACTIVAR SIRENAS: [SI/NO]`) [F2]:\n   - Si\
    \ seleccionas **SÍ**: las sirenas se activarán unos segundos tras la alarma del\
    \ detector y luego se silenciarán automáticamente [F2].\n   - Cualquier retardo\
    \ configurado en las sirenas queda **anulado** durante la prueba para agilizarla\
    \ [F2].\n4. Activa el detector (con aerosol de prueba u otro método) y verifica\
    \ que la central registra la alarma.\n5. Para **salir del modo prueba**, conecta\
    \ la zona desde el menú ZONA → Conectar [F2].\n\n> **Aviso de tiempo límite:**\
    \ Si transcurren **20 minutos** desde la activación del modo prueba sin que se\
    \ produzca ningún disparo de alarma, el sistema **cancela automáticamente el modo\
    \ prueba** y vuelve al estado normal [F2].\n\n---\n\n**Fuente:** Manual de Usuario\
    \ CAD-150-8 (55315008-Manual-Centrales-Analogicas-CAD-150-8-Usuario-ES-FR-GB-IT,\
