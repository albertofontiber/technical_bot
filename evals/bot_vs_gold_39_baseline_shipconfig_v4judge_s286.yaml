  question: En la Detnov CCD-103, ¿cómo se desactiva un detector individualmente sin
    afectar al resto del lazo?
  judge_vara: v4
  gold_estado: verificado
  conducta_esperada: answer
  conducta_bot: answer
  veredicto: PARCIAL
  diagnostico: 'Acerta en lo esencial: no se puede desactivar un detector individual
    y la desconexión se hace por zona, con indicaciones y advertencia correctas. Faltan
    facts CORE: indicar que la CCD-103 es convencional de 3 zonas de detección + 1
    de extinción/no direccionable, y que cada zona admite hasta 32 detectores/pulsadores,
    por lo que al anularla quedan anulados todos.'
  bot_sources:
  - CCD-103_Manual_ES_FR_GB_IT
  coverage_status: appended
  coverage_appended_rows: 1
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: 'La CCD-103 **no permite desactivar un detector individual**: la unidad
    mínima de desconexión es la **zona completa**, no un detector concreto.


    Lo que sí puedes hacer es **desconectar la zona** a la que pertenece ese detector:


    1. Asegúrate de que la **llave de bloqueo de teclado (G)** está en posición **abierta**
    [F2]; si está cerrada, el teclado está inhibido y las pulsaciones no tienen efecto
    [F2].

    2. Pulsa la **tecla de zona (A)** correspondiente **una primera vez** → la zona
    entra en **modo prueba** [F2].

    3. Pulsa la **tecla de zona (A)** una **segunda vez** → la zona queda en **modo
    desconexión** [F1][F2].


    **Indicaciones visuales que confirman la desconexión** [F1][F4]:

    - **Indicador de anular (4):** encendido fijo [F1][F4].

    - **Indicador amarillo de zona (6):** encendido fijo (fijo = desconexión; intermitente
    = avería o prueba) [F4].


    **Para reconectar la zona** [F1]:

    - Pulsa la tecla de zona **una vez** → zona conectada de nuevo.


    ---


    ⚠️ **Advertencia importante:** Cuando una zona está desconectada, la central **no
    refleja ninguna incidencia ni evento** de esa zona [F1]. Limita el tiempo de uso
    de esta maniobra al mínimo imprescindible.


    ---


    Fuente: CCD-103_Manual_ES_FR_GB_IT (sin revisión registrada)'
