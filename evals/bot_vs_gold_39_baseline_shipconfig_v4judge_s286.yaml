- qid: hp003
  question: ¿Cómo se conectan las baterías de 24V en la Detnov CAD-150?
  judge_vara: v4
  gold_estado: verificado
  conducta_esperada: answer
  conducta_bot: answer
  veredicto: PARCIAL
  diagnostico: La respuesta cubre la conexión en serie, el puente entre positivo y
    negativo, los cables rojo/negro y el orden general red antes que baterías. Falta
    el CORE de desconectar el magnetotérmico bipolar exterior antes de manipular la
    central, y la advertencia sobre no conectar la red hasta la puesta en marcha queda
    algo imprecisa.
  bot_sources:
  - 55315013 Manual Centrales Analogicas CAD-150-8 Instalacion ES FR GB IT
  coverage_status: appended
  coverage_appended_rows: 2
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: '## Conexión de baterías en la CAD-150-8


    Las baterías se conectan **en serie** (dos baterías de **12V 7Ah** cada una) [F5].


    ### Pasos de conexión:


    1. **Coloca las dos baterías** en la parte inferior de la caja, en el espacio
    reservado para ello, de forma vertical [F5].


    2. **Conecta el cable puente** (suministrado con la central) uniendo el **polo
    positivo de una batería con el polo negativo de la otra** — esto las pone en serie
    para obtener 24V [F5].


    3. **Conecta los cables del circuito** (rojo al positivo, negro al negativo) al
    conjunto de baterías ya unidas entre sí [F1].


    4. El conector de batería en la placa base corresponde al **punto 11** de la PCB
    Base, protegido por el **fusible de baterías (punto 10)** [F2].


    ### ⚠️ Advertencia de seguridad:


    El orden de conexión es **siempre primero la red y después las baterías** [F5].
    No conectes la central a la red hasta haber completado la puesta en marcha.


    > **Nota:** Para arrancar el equipo solo con baterías (sin red), es imprescindible
    pulsar el pulsador **BAT** (punto 9 de la PCB Base) [F6][F2].


    ---


    Fuente: 55315013 Manual Centrales Analógicas CAD-150-8 Instalación ES FR GB IT
    (sin revisión registrada)'
