  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: "# Configuración de maniobras (causa-efecto) en la CAD-250\n\nLa CAD-250\
    \ implementa la lógica causa-efecto mediante el menú **MANIOBRAS**, que relaciona\
    \ eventos de entrada con acciones de salida a través de una condición de coincidencia\
    \ [F4].\n\n> ⚠️ La programación de maniobras es una de las funciones más críticas\
    \ de la configuración del sistema. Requiere conocimiento específico del sistema\
    \ instalado, del plan de protección y del producto [F4].\n\n---\n\n## PASO 1 —\
    \ Crear la maniobra\n\n1. Accede al menú **MANIOBRAS** desde el menú principal\
    \ [F1].\n2. Pulsa el botón **AÑADIR** para crear una nueva maniobra [F1].\n3.\
    \ Se abre la pantalla de edición de la maniobra (**Maniobra 0001**, etc.). La\
    \ barra de navegación permite moverse entre maniobras [F1].\n4. Define el campo\
    \ **COINCIDENCIAS**: número de eventos de entrada que deben cumplirse simultáneamente\
    \ para que la salida se active [F1]:\n   - **Coincidencias = 1** → lógica **OR**\
    \ (cualquier evento activa la salida) [F1]\n   - **Coincidencias = N (igual al\
    \ total de eventos)** → lógica **AND** (todos deben cumplirse) [F1]\n   - **Coincidencias\
    \ = valor intermedio** → lógica **M de N** (p. ej. 3 de 4 eventos) [F1]\n\n> El\
    \ número máximo de maniobras entre eventos y acciones es de **100.000** [F2].\n\
    \n---\n\n## PASO 2 — Añadir eventos de entrada\n\n1. En la pantalla de la maniobra,\
    \ pulsa **AÑADIR** en el margen inferior [F2].\n2. En la pantalla emergente, selecciona\
    \ **EVENTO** [F2].\n3. Elige el tipo de evento [F2]:\n   - **ENTIDAD**: cualquier\
    \ elemento de la jerarquía del sistema (instalación, panel, lazo, área, zona,\
    \ dispositivo, grupo o modo virtual), tanto del sistema local como de la red [F2].\n\
    \   - **CONDICIÓN TEMPORAL**: establece un periodo de tiempo para el que la ecuación\
    \ de entrada sea verdadera [F2].\n\n4. Si seleccionas **ENTIDAD**, accedes a la\
    \ pantalla **EVENTO DE LA ENTIDAD** donde configuras [F4]:\n   - **Origen:** Local\
    \ o red [F4]\n   - **Condición:** Alarma, avería, técnico [F4]\n   - **Tipo:**\
    \ Todos, pulsador, detector o entradas [F4]\n   - **Estado lógico:** Normal o\
    \ Negado (si se selecciona Negado, la condición es válida cuando NO se cumple\
    \ el estado) [F4]\n   - **Repeticiones:** Valor entero hasta **9999**; número\
    \ de veces que el evento debe repetirse en la entidad para que la entrada sea\
    \ válida [F4]\n\n5. Repite el proceso para añadir tantos eventos de entrada como\
    \ necesites [F5].\n\n> ⚠️ La maniobra gestiona **eventos** (cambios de estado),\
    \ no estados estáticos. Solo el cambio de estado, si coincide con la condición\
    \ establecida, provoca la activación de las salidas [F2].\n\n> Desde la versión\
    \ **1.1.1** es posible seleccionar un elemento de salida como condición de entrada.\
    \ En ese caso, será el cambio a condición de avería el que hará verdadera la entrada.\
    \ Para ello, desmarca la casilla **\"Sólo dispositivos de entrada\"** [F5].\n\n\
    ---\n\n## PASO 3 — Añadir acciones de salida\n\n1. En la misma pantalla de la\
    \ maniobra, pulsa **AÑADIR** en el margen inferior [F3].\n2. En la pantalla emergente,\
    \ selecciona **ACCIÓN** [F3].\n3. Se presentan los campos [F3]:\n   - **RETRASO:**\
    \ tiempo configurable entre **0 y 600 segundos** antes de que se inicie la acción.\
    \ El retardo se inicia desde el momento en que la condición de entrada es verdadera\
    \ [F3][F4].\n   - **ENTIDAD:** elemento de la jerarquía del sistema local (panel,\
    \ lazo, área, zona, dispositivo, grupo o modo virtual) sobre el que se ejecutará\
    \ la acción [F3].\n\n4. En la pantalla **ACCIÓN DE LA ENTIDAD** configuras [F3][F4]:\n\
    \   - **Tipo:** identifica la acción y el tipo de elemento al que se aplica (todos,\
    \ sirenas, relés, sirena discontinua) [F4]\n   - **Acción:** Activar, desactivar,\
    \ habilitar, deshabilitar, test, reiniciar o pulso [F4]\n\n> Las acciones siempre\
    \ serán relativas a la entidad seleccionada [F3].\n\n---\n\n## Funcionalidad adicional:\
    \ Módulos virtuales\n\nLos **módulos virtuales** permiten crear bucles interdependientes:\
    \ un conjunto de entradas determina el estado del módulo virtual, y este puede\
    \ actuar a su vez como entrada de otra maniobra [F6].\n\n---\n\n## Resumen del\
    \ flujo completo\n\n**Eventos de entrada** → **Lógica de coincidencias (OR / AND\
    \ / M de N)** → **Acciones de salida** [F4][F7]\n\nParámetros de entrada: coincidencia,\
    \ negación, estado, tipo, repeticiones [F4][F7]\nParámetros de salida: retardo\
    \ (0–600 s), entidad destino, tipo de elemento, acción [F3][F4]\n\n---\n\nFuentes:\n\
    - CAD-250 Manual de Configuración MC-380-es-2026-c (rev. c, 2026-04-23)\n- CAD-250\
    \ Manual de Software de Configuración MS-416-es-2026-b (rev. b)\n\n---\n\U0001F4D6\
    \ **Información adicional del manual:**\n- \"Screenshot 1: Shows the main interface\
    \ with \"Panel 12 08:08 - viernes, 19 de abril de 2019\" at top, displaying \"\
    Maniobra 0001\" with \"Borrar maniobra\" button and \"MANIOBRAS\" section. Left\
    \ sidebar shows menu items: LAZO, SECTORIZACION, MANIOBRAS, LOGS, RED, AJUSTES,\
    \ INSTALACION. The main area shows \"Coincidencias: Eventos\" and \"Acciones\"\
    \ tabs with a hand cursor pointing to an add button.\n\nScreenshot 2: Shows a\
    \ popup dialog titled \"Seleccione Eve\" with two options: \"EVENTO\" and \"ACCION\"\
    \n\nScreenshot 3: Shows \"Seleccione tipo de evento\" dialog with options for\
    \ \"ENTIDAD\" and \"CONDICION TEMPORAL\", with a \"CERRAR\" button and \"Evento\
    \ de entidad\" label with \"Repeticiones =? 3\" notation\n\nScreenshot 4: Shows\
