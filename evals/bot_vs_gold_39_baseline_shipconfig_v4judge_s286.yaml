  question: ¿Cómo se calcula la capacidad de batería (en Ah) necesaria para la central
    AM-8200?
  judge_vara: v4
  gold_estado: verificado
  conducta_esperada: answer
  conducta_bot: answer
  veredicto: PARCIAL
  diagnostico: Cubre correctamente la fórmula Ah=(A+B)×1,2, los periodos 24/72 h y
    0,5 h, los consumos principales y el límite de baterías 2×12 V hasta 18 Ah. Falta
    explicitar el dato [CORE] de que la alimentación interna es 24 Vcc con un total
    de 4 A.
  bot_sources:
  - AM-8200 Manual Instalacion
  coverage_status: appended
  coverage_appended_rows: 1
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: '# Cálculo de capacidad de batería — AM-8200


    La fórmula del manual es: **Ah Batería = (A + B) × 1,2** [F3][F4], donde:


    - **A** = Corriente total en reposo (A) × horas de reposo requeridas (24 h o 72
    h según normativa aplicable)

    - **B** = Corriente total en alarma (A) × **0,5 h** [F3][F4]

    - **Factor 1,2** = margen por tolerancias de fabricación de las baterías [F5]


    ---


    ## Pasos del cálculo


    **Paso 1 — Suma de corrientes en reposo (NO ALARMA)**


    Suma los consumos de todos los componentes instalados. Valores de referencia del
    manual:


    Para la variante **AM-8200 (CPU AM-8200-KLCD)**:

    - AM-8200 CPU (AM8200-KLCD): **179 mA** [F3]

    - LIB-8200 (por tarjeta): **50 mA** [F3]

    - AM82-2S2C: **28 mA** [F3]

    - AM82-BST-C: **39 mA** [F3]

    - Dispositivos de lazos: consultar fichas de datos del fabricante de cada dispositivo
    [F5]

    - Salida usuario (24 Vcc, máx. **2 A**): consumo real de dispositivos conectados
    [F3]

    - Sirenas/campanas/flashes en reposo: 0 si no consumen en reposo [F3]


    Para la variante **AM-8200BB (CPU AM-82-BBMB)**:

    - AM-8200BB: **135 mA** [F4]

    - LIB-8200: **50 mA** [F4]

    - AM82-2S2C: **28 mA** [F4]

    - AM82-BST-C: **39 mA** [F4]


    > ⚠️ La corriente total de todos los lazos no puede superar **750 mA** [F5]. La
    corriente total de la salida de usuario no puede superar **2 A** [F5].


    **Paso 2 — Suma de corrientes en alarma**


    Mismos componentes, con sus valores en alarma:


    Para **AM-8200 (KLCD)**:

    - CPU: **345 mA** [F3]

    - LIB-8200: **92 mA** [F3]

    - AM82-2S2C: **28 mA** [F3]

    - AM82-BST-C: **39 mA** [F3]

    - Dispositivos de lazos en alarma: la central activa **solo los primeros 6 LED**
    de detectores y módulos de entrada en alarma [F5]


    Para **AM-8200BB**:

    - CPU: **177 mA** [F4]

    - LIB-8200: **92 mA** [F4]

    - AM82-2S2C: **28 mA** [F4]

    - AM82-BST-C: **39 mA** [F4]


    > ⚠️ Si la corriente total calculada supera **3,5 A**, el exceso durante alarma
    se extrae de las baterías [F5].


    **Paso 3 — Aplicar la fórmula**


    ```

    Ah Batería = (A + B) × 1,2

    ```


    Donde:

    - A = Total reposo (A) × 24 h (o × 72 h según normativa) [F3][F4]

    - B = Total alarma (A) × 0,5 h [F3][F4]


    **Paso 4 — Verificar límites físicos**


    El manual especifica que las baterías admitidas son **2 × 12 V**, con capacidad
    mínima **7 Ah** y máxima **18 Ah** [F2].


    Baterías recomendadas (capacidad máxima estándar 17–18 Ah) [F2]:

    - Yuasa NP18-12B o NP7-12BFR

    - Fiamm FG21803 o FGV21803


    ---


    > 📋 El manual incluye las **Tablas 1 y 2** (para AM-8200 y AM-8200BB respectivamente)
    como hojas de cálculo rellenables con todos los componentes. Consulta el apéndice
    del manual físico para completarlas con tu instalación concreta [F1][F3][F4].


    ---


    **Fuente:** AM-8200 Manual de Instalación — Doc. AM-8200-ESP Rev. A.3 (AM8200_manu-inst_ESP)


    ---

    ⚠️ **Información adicional del manual:**

    - "4 La corriente en las condiciones de reposo o alarma no puede superar, en ningún
    caso, la capacidad de la fuente de alimentación." [F5]


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "Calcular la corriente total necesaria para todos los lazos usando **la tabla
    2 (ver a continuación)** teniendo presente que la central enciende **solo los
    primeros 6 LED** de los detectores y módulos de entrada en alarma." (AM-8200 Manual
    Instalacion, p. 53) [F5]'
