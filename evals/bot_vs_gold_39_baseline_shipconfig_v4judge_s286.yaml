  bot_answer: '## Conexión del módulo de aislamiento de línea en lazo ID2000


    Los fragmentos disponibles no incluyen el procedimiento de conexionado físico
    del módulo aislador (terminales, polaridad, esquema de bornes). Sin embargo, sí
    contienen información relevante sobre su uso e instalación en el lazo.


    ---


    ### Lo que sí está documentado:


    **Regla de instalación (densidad de aisladores):**

    - Para cumplir los requisitos de **EN54-2**, los aisladores deben instalarse entre
    un máximo de **32 equipos de lazo** [F4].

    - En la central **ID2000**, no colocar más de **25 equipos de lazo entre aisladores**
    (o **20 si se utilizan aisladores FET**) [F4].


    **Terminales del aislador referenciados en el manual:**

    - El aislador dispone de terminales numerados **1, 2, 3 y 4** [F4].

    - Durante las comprobaciones previas a la puesta en marcha, los aisladores se
    desconectan temporalmente **cortocircuitando los terminales 2 y 4** de cada aislador
    [F4].


    **Procedimiento de puesta en marcha con aisladores:**

    1. Antes de conectar el cableado del lazo al panel, **cortocircuita temporalmente
    los terminales 2 y 4** de cada aislador para realizar las comprobaciones de continuidad,
    polaridad y resistencia [F4].

    2. Una vez verificado el cableado, **retira las conexiones temporales** en las
    unidades aisladoras [F1].

    3. Conecta el cableado del lazo al panel, verificando que los extremos **A y B**
    se conectan en los terminales correctos [F1].


    ---


    ### ⚠️ Limitación importante:


    El esquema de conexionado interno del aislador (qué terminales van al cable de
    entrada y cuáles al de salida del lazo) **solo aparece como diagrama en el manual**
    [F4], y la extracción del PDF no permite reproducirlo fielmente. Para el conexionado
    exacto de los terminales 1-2-3-4, consulta la figura de la **sección 8.4.2 del
    manual MIDT180** directamente.


    ---


    Fuente: Panel ID2000 - Manual de instalación y puesta en marcha, MIDT180 (rev.
    MI-DT-180, 2003-03-31)


    ---

    ⚠️ **Información adicional del manual:**

    - "> ⚠️ **¡NUNCA conecte las baterías antes que la fuente de alimentación!**"
    [F1]

    - "**1** Vuelva a conectar la alimentación principal - NUNCA conecte las baterías
    antes que la alimentación principal." [F1]'
