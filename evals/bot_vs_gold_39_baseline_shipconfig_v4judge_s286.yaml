  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: "# Programación de ecuación CBE en AM-8200 para activar una salida\n\
    \nLa lógica CBE de la AM-8200 vincula eventos (sensores/grupos) con salidas mediante\
    \ operadores lógicos programados en el módulo de salida o en el grupo.\n\n---\n\
    \n## Concepto clave: cómo funciona la cadena CBE\n\nLa AM-8200 dispone de **400\
    \ grupos** [F2]. El flujo típico es:\n\n1. Un sensor/módulo de entrada se asigna\
    \ a un **grupo** (mediante su ecuación CBE).\n2. Un **módulo de salida** tiene\
    \ su propia ecuación CBE que referencia ese grupo.\n3. Cuando el grupo se activa,\
    \ el módulo de salida se activa.\n\n> **NOTA importante** [F1]: Para los módulos\
    \ de salida, la central **no permite programar una ecuación si el módulo tiene\
    \ un TIPO ID para señalizaciones de carácter general.**\n\n---\n\n## Paso a paso\n\
    \n### PASO 1 — Asignar el sensor/módulo de entrada a un grupo\n\nAccede a: `MENU\
    \ PROGRAMMAZIONE \\ Punti \\ Sensor` → pestaña **Programación** [F3]\n\n- Campo\
    \ **Zona**: número de zona asociada.\n- Campo **CBE**: introduce la ecuación que\
    \ asigna el sensor al grupo.\n  - Ejemplo: `(G9)` → el sensor pertenece al grupo\
    \ software 9.\n\nPara módulos de entrada, el procedimiento es equivalente [F4]:\n\
    - Campo **CBE**: ejemplo `(G2)` → el módulo de entrada pertenece al grupo 2.\n\
    \n---\n\n### PASO 2 — Configurar el grupo (si es necesario)\n\nAccede a: `MENU\
    \ PROGRAMMAZIONE \\ Gruppi` → pestaña **Programación** [F2]\n\n- **Tipo D** (Activación\
    \ directa): se activa desde entradas que tienen el grupo en su CBE. Activa lo\
    \ que contiene su propia ecuación CBE.\n- **Tipo I** (Activación inversa): se\
    \ activa desde su ecuación CBE. Activa salidas que tienen el grupo en su CBE [F2].\n\
    \n---\n\n### PASO 3 — Programar la ecuación CBE en el módulo de salida\n\nAccede\
    \ a: `MENU PROGRAMMAZIONE \\ Punti \\ Moduli` → pestaña **Programación**\n\nEn\
    \ el campo **CBE** del módulo de salida, introduce la ecuación con el operador\
    \ adecuado [F1]:\n\n**Operador OR** — se activa si AL MENOS UN grupo está en alarma:\n\
    ```\nOR (G9 G15 G23)\n```\n*(también válido omitir OR: `(G9 G15 G23)`)*\n\n**Operador\
    \ AND** — se activa solo si TODOS los grupos están en alarma:\n```\nAND (G9 G15\
    \ G23)\n```\n\n**Operador NOT** — el módulo se desactiva cuando el grupo entra\
    \ en alarma:\n```\nNOT (G23)\n```\n\n**Operador XGRP** — se activa cuando AL MENOS\
    \ DOS elementos del grupo indicado están activos (doble coincidencia) [F5]:\n\
    ```\nXGRP (G23)\n```\n> **NOTA** [F5]: Con XGRP **no se permite** referenciar\
    \ más de un grupo: `XGRP (G23 G24)` → **CBE no permitida**.\n\n---\n\n## Restricciones\
    \ de índice de grupos a tener en cuenta [F1]\n\n- Para **grupos directos**: los\
    \ operandos dentro del paréntesis deben tener índice **mayor** que el grupo al\
    \ que se asigna la CBE.\n  - ✗ No permitida: `G33 = (G23 G24)`\n  - ✓ Permitida:\
    \ `G21 = (G23 G24)`\n\n- Para **grupos inversos**: los operandos deben tener índice\
    \ **menor** que el grupo al que se asigna la CBE.\n  - ✗ No permitida: `G305 =\
    \ (G306 G307)`\n  - ✓ Permitida: `G307 = (G305 G306)`\n\n---\n\n## Ejemplo completo\
    \ (caso típico: detector activa sirena)\n\n| Elemento | CBE programada | Resultado\
    \ |\n|---|---|---|\n| Sensor (detector) | `(G9)` | Se asigna al grupo 9 |\n| Módulo\
    \ de salida (sirena) | `OR (G9)` | Se activa cuando el grupo 9 entra en alarma\
    \ |\n\n---\n\nFuente: AM-8200 Manual de programación — Doc. M-162.1-AM8200-ESP\
    \ Rev A.3 — HONEYWELL LIFE SAFETY IBERIA (sin fecha de revisión registrada en\
    \ los fragmentos)\n\n---\n⚠️ **Información adicional del manual:**\n- \"Si, por\
    \ el contrario, el dispositivo en cuestión es un módulo de salida, esta salida\
    \ no se activará nunca, a no ser que se programe con software TIPO ID para señalizaciones\
    \ generales.\" [F1]"
