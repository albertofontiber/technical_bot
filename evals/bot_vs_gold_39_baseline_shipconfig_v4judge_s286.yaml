  bot_answer: '## FAAST LT-200 — Salidas de relé y sirena: especificaciones completas


    ---


    ### Tipos de relés disponibles


    El FAAST LT-200 dispone de los siguientes relés [F3][F4]:


    - **ALARMA 1 y ALARMA 2**

    - **AVERÍA 1 y AVERÍA 2**

    - **SIRENA 1 y SIRENA 2**


    > ⚠️ Nota: existe una diferencia entre variantes. En la versión **Stand Alone**
    (manual I56-6574-005_ES), el relé de ALARMA incluye también **PREALARMA 1 y PREALARMA
    2** como relés independientes [F3]. En la versión **Loop/Notifier** (manuales
    I56-6577-006_ES e I56-6575-005_ES), no se mencionan relés de prealarma separados
    [F4].


    ---


    ### Comportamiento de cada relé


    **Relé de ALARMA 1 o 2:**

    - Versión Stand Alone: se activa cuando se cumple la condición de alarma en un
    canal. Estado enclavado por defecto; requiere **rearme manual** para desactivar
    el LED y el relé [F3].

    - Versión Loop/Notifier: controlado por el panel cuando determina que se da la
    condición de alarma. **No enclavado** [F4].


    **Relé de PREALARMA 1 o 2** (solo Stand Alone):

    - Se activa cuando se cumple la condición de prealarma en un canal [F3].

    - Cuando PREALARMA = ALARMA = Nivel 1, la prealarma se activará al **70 % del
    nivel 1** [F3].


    **Relé de AVERÍA 1 o 2:**

    - Se activa ante una condición de avería en el canal 1 o 2, o ante una **avería
    común** [F3][F4].

    - También se activa en **modo de servicio** y cuando se **desconecta la alimentación**
    de la unidad [F3][F4].

    - **Estado no enclavado** (predeterminado) [F3][F4].


    **Relé de SIRENA 1 o 2:**

    - Se activa cuando el canal correspondiente entra en **ALARMA** [F3][F4].

    - Sirena 1 → Canal 1 / Sirena 2 → Canal 2 [F3][F4].

    - Estado predeterminado: activado en ALARMA [F3][F4].

    - En la versión Stand Alone también puede activarse en **PREALARMA** [F3].


    ---


    ### Comportamiento del relé de AVERÍA ante corte de alimentación


    El relé de avería **se activa (señaliza avería) cuando se desconecta la alimentación
    de la unidad** [F3][F4]. El estado no está enclavado [F3][F4].


    ---


    ### Especificación eléctrica de los contactos de relé


    - **Corriente máxima (carga resistiva 30 V CC):** **2 A** [F1][F2]

    - **Corriente máxima (carga resistiva 30 V CA):** **0,5 A** [F1][F2]

    - **Vida útil mínima:** **10⁵ operaciones** [F1][F2]


    ---


    ### Resistencia de fin de línea en salidas de sirena


    Los fragmentos disponibles **no especifican el valor de resistencia de fin de
    línea** para las salidas de sirena del FAAST LT-200. Consulta el manual completo
    o el soporte técnico de Notifier para este dato.


    ---


    ### Tipo de contactos (NA/NC)


    Los fragmentos recuperados **no especifican explícitamente si los contactos son
    NA (normalmente abierto) o NC (normalmente cerrado)**. Consulta el diagrama de
    conexionado del manual físico para verificar la configuración de contactos.


    ---


    **Fuentes:**

    - I56-6574-005_ES FAAST LT-200 HS Stand Alone QIG (sin revisión registrada)

    - I56-6577-006_ES FAAST Notifier LT-200 QIG (sin revisión registrada)

    - I56-6575-005_ES FAAST LT-200 Loop QIG (sin revisión registrada)'
