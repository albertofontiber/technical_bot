  bot_answer: '## Programación del retardo de salida de alarma en la PEARL


    El retardo de salida de alarma en la PEARL se programa mediante las **reglas de
    causa-efecto**, asignando un **tipo de retardo** a cada regla. No existe un parámetro
    único de "retardo de alarma principal" — el retardo se define dentro de la lógica
    causa-efecto.


    ---


    ### Paso 1 — Acceder al editor de causa-efecto


    No puedo confirmar de forma segura el número de menú de Causa y Efecto con los
    fragmentos servidos. Confirma el manual y la revisión exactos antes de usar un
    número de menú.


    > ⚠️ Si no se ha transferido un archivo de configuración previo, aparecerán dos
    reglas por defecto. **Deben eliminarse si vas a crear reglas personalizadas**
    [F6].


    ---


    ### Paso 2 — Asignar el tipo de retardo a la regla


    Dentro de cada regla de causa-efecto puedes asignar uno de **seis tipos de retardo
    de salida** [F1]. Los tipos disponibles son [F2]:


    - **Fijo** — Sin posibilidad de silenciar ni ampliar durante el retardo.

    - **Estándar** — Permite silenciar sirenas y anular el retardo (nivel acceso 2).

    - **No Silenc.** — No permite silenciar sirenas, pero sí anular el retardo (nivel
    acceso 2).

    - **Est. Ext.** — Estándar con posibilidad de ampliar retardo (tecla AMPLIAR RETARDO).

    - **RetExtStd** — Inicia temporizador de retardo ampliado al pulsar AMPLIAR RETARDO.

    - **No Sil. Ext** — No permite silenciar, pero sí ampliar retardo.

    - **SinRetExt** — Inicia temporizador de retardo ampliado sin opción de silenciar.


    El tipo de retardo determina qué acciones puede realizar el usuario mientras el
    retardo está activo [F1].


    ---


    ### Paso 3 — Comportamiento durante el retardo (referencia rápida)


    Según el tipo seleccionado [F2]:


    - **Silenciar sirenas durante retardo:** Solo disponible en tipos Estándar, Est.
    Ext. y RetExtStd.

    - **Anular retardo (nivel acceso 2, opción «Anular retardos»):** Disponible en
    todos excepto Fijo.

    - **Ver tiempo restante en pestaña ALARMA:** Disponible en todos excepto Fijo.

    - **Finalizar retardo con tecla FIN RETARDO (nivel acceso 2):** Disponible en
    todos excepto Fijo.

    - **Detener salida con tecla AMPLIAR RETARDO:** Solo en Est. Ext. y No Sil. Ext.

    - **Iniciar temporizador de retardo ampliado:** Solo en RetExtStd y SinRetExt.


    ---


    ### Paso 4 — Método recomendado de programación


    > **Se recomienda usar el programa de configuración por ordenador como método
    principal.** El menú de la central debe emplearse solo para modificaciones menores
    [F7].


    ---


    ### Notas adicionales


    - El LED **RETARDO ACTIVO** se enciende cuando hay un retardo configurado y activo
    [F3].

    - El retardo puede anularse/habilitarse globalmente desde **Menú Anular/Habilitar
    → «5: Retardo Activación Salidas»** [F3].

    - La tecla **AMPLIAR RETARDO** puede desactivarse desde los parámetros de la central:
    **«10: Extend Delay Button»** [F5].

    - ⚠️ Si configuras un retardo de fallo AC 220 superior a **30 minutos**, se contravienen
    los requisitos de **EN54-4, párrafo 5.4 (a)** [F8].


    ---


    **Fuentes:**

    - 997-671-005-3_Configuration_ES (rev. 997-671-005-3)

    - 997-670-005-3_Operating_ES (sin revisión registrada)


    ---

