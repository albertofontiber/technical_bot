    \ E10/E15\n\nHay dos procedimientos distintos según el nivel de acceso desde el\
    \ que se opera.\n\n---\n\n## Cambiar contraseña de Nivel 2 (desde Nivel 2)\n\n\
    1. Selecciona el icono del menú ① y selecciona **\"Configuración\"** ② [F2]. Inicia\
    \ sesión como usuario de **nivel de acceso 2** [F2].\n2. Selecciona la opción\
    \ **\"Cambio del código de acceso\"** ③ [F2].\n3. Asegúrate de que **Nivel de\
    \ Acceso 2** ④ esté seleccionado y que el cursor parpadee ⑤ [F2].\n4. Puedes ver\
    \ la entrada del código haciendo clic en el **icono del ojo** ⑥ [F2].\n5. Introduce\
    \ el nuevo código de acceso (**mínimo 4 dígitos, máximo 8 dígitos**) con el teclado\
    \ ⑦ [F2].\n6. Confirma la entrada seleccionando el símbolo **✓** ⑧ [F2].\n7. Repite\
    \ los pasos 3 a 6 para confirmar el código [F2].\n\n---\n\n## Cambiar contraseña\
    \ de Nivel 2 y/o Nivel 3 (desde Nivel 3)\n\n1. Selecciona el icono del menú ①\
    \ y selecciona **\"Ajustes\"** ② [F1]. Inicia sesión como usuario de **nivel de\
    \ acceso 3** [F1].\n2. Selecciona la opción **\"Cambio del código de acceso\"\
    ** ③ [F1].\n3. Asegúrate de que el **Nivel de Acceso 2 o 3** ④ esté seleccionado\
    \ y que el cursor parpadee ⑤ [F1].\n4. Puedes ver la entrada del código haciendo\
    \ clic en el **icono del ojo** ⑥ [F1].\n5. Introduce el nuevo código de acceso\
    \ (**mínimo 4 dígitos, máximo 8 dígitos**) con el teclado ⑦ [F1].\n6. Confirma\
    \ la entrada seleccionando el símbolo **✓** ⑧ [F1].\n7. Repite los pasos 3 a 6\
    \ para confirmar el código [F1].\n8. Observa el mensaje **\"Cambio de código de\
    \ acceso satisfactorio\"** y selecciona **Aceptar** [F1].\n9. Sincroniza el programa\
    \ con la central y realiza una **copia de seguridad del cambio en la nube** [F1].\n\
    \n---\n\n## Notas importantes\n\n- El código de fábrica del **Nivel 2** es **\"\
    22222222\"** [F3]. Se recomienda cambiarlo.\n- Si el Nivel 2 no se usa durante\
    \ **5 minutos**, la central cierra sesión automáticamente y vuelve al **Nivel\
    \ 1** [F3].\n- Desde el **Nivel 2** solo puedes cambiar la contraseña de Nivel\
    \ 2 [F1].\n- Desde el **Nivel 3** puedes cambiar tanto la contraseña de Nivel\
