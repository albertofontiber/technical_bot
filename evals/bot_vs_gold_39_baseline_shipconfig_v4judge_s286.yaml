  bot_answer: "## Notifier PEARL — Capacidad de lazo SLC, límites de aisladores y\
    \ alta/edición de equipos\n\n---\n\n### 1. Capacidad máxima por lazo\n\nUn lazo\
    \ analógico de la PEARL admite un máximo de **318 equipos por lazo**: hasta **159\
    \ sensores** y **159 módulos** (protocolo Opal) [F1].\n\nEn protocolo **CLIP**,\
    \ el límite es de **99 sensores más 99 módulos** por lazo [F2].\n\nPara el conjunto\
    \ del sistema (ambos lazos), la norma **EN54-2: 13-7** limita a un máximo de **512\
    \ sensores y/o pulsadores manuales** en total [F1].\n\nLa **carga máxima eléctrica**\
    \ es de **0,75 A por lazo** [F2].\n\n---\n\n### 2. Límites de aisladores (EN54-2:\
    \ 12.5.2)\n\nLa norma **EN54-2: 12.5.2** exige que entre aisladores haya como\
    \ máximo **32 equipos** [F1]. Para la PEARL, los criterios concretos son:\n\n\
    - **Equipos sin aisladores internos** (incluidos equipos CLIP y algunos Opal):\
    \ **no más de 20 equipos entre aisladores** [F1].\n- **Equipos con aisladores\
    \ internos** (usados con base **B501 AP**): el lazo cumple directamente los requisitos\
    \ de EN54-2 [F1].\n- La mayoría de equipos Opal incorporan **aisladores internos\
    \ FET**; con bases compatibles Opal, el aislador se conecta a los terminales **+2\
    \ y +4** en el extremo positivo [F1].\n\n> ⚠️ **Nota de arranque del lazo:** Para\
    \ garantizar que los aisladores se cierren al aplicar alimentación, la carga entre\
    \ aisladores no debe superar **20 unidades de carga (SU)** [F5].\n\n**Referencia\
    \ de cargas SU para equipos CLIP** [F5]:\n- Detector por rayo LPB-700: **6 SU**\n\
    - Sirenas de lazo: **3 SU**\n- Módulo ZMX-1: **3 SU**\n- Módulo MMX-10M/CMX10-RM:\
    \ **10 SU**\n- Resto de equipos: **1 SU**\n\n**Límite de cableado:** La resistencia\
    \ máxima del lazo debe respetar los límites definidos en la sección **6.4.2**\
    \ del manual de instalación. La capacitancia del cable debe ser **inferior a 0,5\
    \ µF** [F6]. Cada aislador añade entre **0,1 y 0,13 Ω** [F6].\n\n---\n\n### 3.\
    \ Alta de equipos: Autoconfiguración desde la central\n\nLa forma recomendada\
    \ es usar el **programa de configuración ITS** (más óptima), pero también puede\
    \ hacerse desde la central [F3].\n\n**Pasos para la autoconfiguración:**\n\n1.\
    \ Accede al menú de configuración con nivel de acceso adecuado.\n2. Selecciona\
    \ **1: Autoconfiguración** [F3].\n3. Elige si aplica a **todos los lazos** o a\
    \ un **lazo específico** [F3].\n4. Selecciona el modo de autoconfiguración [F3]:\n\
    \   - **1: Todos Prot. OPAL/CLIP** → detecta duplicidades de dirección.\n   -\
    \ **2: OPAL/CLIP (No detecta duplicidad)** → más rápido, sin comprobación de duplicados.\n\
    \   - **3: Sólo con protocolo CLIP** → solo autoconfigura equipos CLIP aunque\
    \ haya Opal en el lazo.\n5. Selecciona el modo de gestión de cambios [F3]:\n \
    \  - **\"Permite Añadir/Borrar/Cambiar\"**\n   - **\"Sólo Añadir Nuevos Equipos\"\
    **\n6. El proceso se inicia automáticamente. Al finalizar, los resultados se muestran\
    \ en la **pantalla LCD** [F3].\n\n> Los equipos configurados pueden consultarse\
    \ en cualquier momento desde el **nivel de acceso 2**, opción **«Resumen de Equipos»**\
    \ [F3].\n\nTras la autoconfiguración, la configuración puede transferirse a un\
    \ ordenador portátil para editarla y archivarla mediante el programa ITS [F3].\n\
    \n---\n\n### 4. Edición individual de equipos\n\nDesde la central es posible editar\
    \ individualmente sensores o módulos [F4]. Los parámetros editables para **sensores**\
    \ incluyen [F4]:\n\n- Tipo de equipo\n- Número de zona (hasta **255 zonas locales**\
    \ o **8192 zonas de red**)\n- Número de células (hasta **255**)\n- Ajuste del\
    \ nivel de alarma, prealarma y alarma horaria\n- Retardo de alarma\n- Retardo\
    \ de confirmación de coincidencia de detector (hasta **240 s / 4 min**)\n- Prioridad\
    \ de interrogación (solo CLIP, limitada a **30 equipos**)\n- Grupo AWACS (hasta\
    \ **50 grupos**, solo sensores CLIP salvo HEAT)\n- Selección de programación horaria\
    \ (cambio de sensibilidad)\n- Opción de tipo de equipo (VIEW, Optiplex, SMART)\n\
    - Número de aplicación (solo equipos **SMART 4**)\n- Ajuste de función LED remota\
    \ (solo equipos Opal): \"Seguir el equipo\" o \"Controlada por reglas de causa-efecto\"\
    \n- Acción de parpadeo en equipo interrogado (elección de color solo para Opal)\n\
    \n---\n\n**Fuentes:**\n- Manual de instalación y puesta en marcha 997-669-005-3\\\
    _Instal-Comm\\_ES (sin revisión registrada)\n- Manual de configuración 997-671-005-3\\\
    _Configuration\\_ES (rev. 997-671-005-3)\n\n---\n⚠️ **Información adicional del\
    \ manual:**\n- \"La resistencia máxima del lazo no debe superar los límites definidos\
    \ en **«6.4.2 Comprobaciones del lazo antes de conectar el cableado»**, paso 2.\"\
    \ [F6]\n- \"**NUNCA utilice un multímetro de alta tensión en el lazo de detección.**\"\
    \ [F1]\n\n---\n⚠️ **Obligaciones de evidencia del manual:**\n- \"Es de vital importancia\
    \ que el cable utilizado sea de buena calidad y que se instale de forma correcta.\"\
    \ (997-669-005-3_Instal-Comm_ES, p. 17) [F6]"
