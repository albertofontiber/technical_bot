  bot_answer: "# Central de Detección de Gas Fidegas CS4 — Características Técnicas\n\
    \n## Especificaciones generales\n\n- **Tensión de alimentación:** 110-230 Vac,\
    \ 50-60 Hz [F2]\n- **Potencia/Consumo:** 30 W, Clase II [F2][F3]\n- **Número de\
    \ sensores:** hasta 4 conexiones simultáneas [F1][F2]\n- **Salidas:** 2 salidas\
    \ conmutadas LP (relé apto para 230 Vac) con contactos NA-C-NC [F2]\n- **Corriente\
    \ máxima:** 250 mA [F2]\n- **Rearme:** seleccionable manual o automático [F2]\n\
    - **Dimensiones:** 90 x 106 x 58 mm [F2]\n- **Peso:** 300 g [F2]\n- **Montaje:**\
    \ carril DIN o armario de superficie [F1]\n- **Firmware (versión analógica):**\
    \ 1.2 [F3]\n\n---\n\n## Diferencias entre versión digital y analógica\n\n**Versión\
    \ digital — Código de producto: 3244** [F2]\n- Tipo de entrada: **0-10/15 V**\
    \ [F1]\n- Sensores compatibles: **S/10 gases combustibles** [F3]\n\n**Versión\
    \ analógica — Código de producto: 3270** [F2]\n- Tipo de entrada: **4-20 mA**\
    \ [F1]\n- Sensores compatibles [F3]:\n  - S/3 gases combustibles\n  - S/3 y S/2\
    \ gases tóxicos\n  - S/10 gases tóxicos\n\n> **Nota importante:** La versión analógica\
    \ tiene mayor variedad de sensores compatibles (combustibles y tóxicos), mientras\
    \ que la versión digital solo es compatible con el sensor S/10 de gases combustibles\
    \ [F3].\n\n---\n\n## Indicaciones y funcionamiento básico\n\n- **LED PWR (verde):**\
    \ alimentación presente (fijo) / corte de red (intermitente) [F1]\n- **LED ON/ALARM\
    \ (bicolor):** sensor presente (verde) / alarma (rojo) [F1]\n- **LED ERROR (amarillo):**\
    \ avería de sensor remoto [F1]\n- **LEDs OUT1/OUT2 (verde):** salida activa (encendido)\
    \ / desactivada (apagado) [F1]\n- **Avisador acústico:** apoyo sonoro a las indicaciones\
    \ ópticas [F1]\n- **Umbral de alarma:** 20% del fondo de escala [F5]\n- **Tiempo\
    \ de arranque:** 30 segundos con salidas en posición NA [F5]\n- **Silenciado de\
    \ alarma:** posible durante 24 horas mediante botón RESET si la concentración\
    \ no ha disminuido [F5]\n\n---\n\nFuente: Manual-de-Usuario-CS4, Fidegas CS4 (sin\
    \ revisión registrada)\n\n---\n\U0001F4CB **Obligaciones de evidencia del manual:**\n\
    - Nota: la fuente es inconsistente: \"Permite la conexión de hasta 4 sensores\
    \ remotos simultaneos a través de sus 4 entradas digitales (0-10/15 v) o analógicas\
    \ (4-20 mA).\" (Manual-de-Usuario-CS4, p. 4) [F1] declara 4 sensores y la enumeración\
    \ servida lista 6 (Manual-de-Usuario-CS4, p. 4) [F1]."
