- qid: hp005
  question: En la Notifier ID3000, ¿cómo se programa una zona para que active una
    salida de sirena solo cuando haya coincidencia de dos detectores?
  judge_vara: v4
  gold_estado: verificado
  conducta_esperada: answer
  conducta_bot: answer
  veredicto: FALLO
  diagnostico: 'Aunque menciona la Matriz de Control, la opción COINCIDENCIA 2 EQUIPOS
    y la condición de misma zona/subzona, omite o deja imprecisos CORE importantes
    como ENTRADA = ALARMA y la selección concreta de salida ''Salidas activadas''
    -> ''CIRCUITO SIRENA/RELÉ'' o módulos de sirena. Además introduce errores/confusión:
    presenta como obligatorio crear una instrucción para pulsadores y en PK-ID3000
    habla de seleccionar ''2 zonas'' en vez de coincidencia de 2 equipos/detectores.'
  bot_sources:
  - MCDT190
  - MCDT191
  - MPDT190
  coverage_status: appended
  coverage_appended_rows: 2
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: "# Programación de coincidencia de dos detectores para activar sirena\
    \ — ID3000\n\nLa función se configura en la **Matriz de Control** usando la opción\
    \ **\"COINCIDENCIA 2 EQUIPOS\"** en la entrada, de forma que la salida de sirena\
    \ solo se activa cuando dos detectores de la misma zona están en alarma.\n\n---\n\
    \n## Procedimiento (vía teclado de la central)\n\n### Paso 1 — Crear la instrucción\
    \ para pulsadores manuales (obligatorio)\n\n> ⚠️ **EN54-2: 7.1.4** — No incluyas\
    \ pulsadores manuales en el grupo de coincidencia [F1][F3].\n\nDebes programar\
    \ **dos instrucciones separadas** en la Matriz de Control [F3]:\n\n**Primera instrucción**\
    \ — Para que los pulsadores manuales (MCP/PUL) activen la sirena sin coincidencia\
    \ [F1][F3]:\n- Entrada: tipo **Pulsador Manual (MCP/PUL)**\n- Coincidencia: **UN\
    \ ÚNICO EQUIPO** (sin coincidencia)\n- Salida: sirena\n\n---\n\n### Paso 2 — Crear\
    \ la instrucción con coincidencia de dos detectores\n\n**Segunda instrucción**\
    \ — Para detectores analógicos con coincidencia [F1][F3]:\n\n1. Accede a la **Matriz\
    \ de Control** (menú Parámetros Sistema → Matriz de control, o pulsa **\\<F6\\\
    >** desde la edición de sensores) [F6][F7].\n\n2. Crea un nuevo evento de Matriz\
    \ de Control [F3].\n\n3. **Limitado por tipo** — Selecciona el tipo de detector\
    \ al que aplica la coincidencia [F3]:\n   - Opciones disponibles: `CUALQUIER TIPO\
    \ DE EQUIPO`, `CUALQUIER SENSOR TÉRMICO`, `CUALQUIER SENSOR IÓNICO`, etc.\n  \
    \ - El grupo **ANALÓGICO** incluye detectores térmicos, iónicos, ópticos, VIEW\
    \ y multisensor [F1].\n\n4. **Selección de zona** — Elige la zona específica donde\
    \ se aplica la coincidencia [F2][F3]:\n   - Opción **\"Una única zona\"** (párrafo\
    \ 6 del procedimiento de teclado) [F3].\n   - > ⚠️ No se permite usar coincidencia\
    \ de zonas y limitación por tipo en la misma entrada de Matriz de Control [F3].\n\
    \n5. **Coincidencia de equipos** — Selecciona [F3]:\n   \n\n⚠️ Conexionado de\
    \ las sirenas: la fuente citada muestra este detalle en un DIAGRAMA que no puede\
    \ transcribirse con fiabilidad a pasos de texto. Antes de cablear, consulta la\
    \ figura del manual citado en esta respuesta (respeta la resistencia final de\
    \ línea y la polaridad exactas que muestra el diagrama).\n\n\n   - Esta opción\
    \ aparece solo si en el paso anterior se seleccionó **\"Una única zona\"** y el\
    \ tipo no es la opción 9, 10 u 11 (que ya incluyen coincidencia propia) [F3].\n\
    \n6. **Condición de coincidencia**: los dos equipos en alarma deben estar en la\
    \ **misma zona o subzona** [F3].\n\n7. **Salida**: asigna la salida de sirena\
    \ correspondiente [F6][F7].\n\n---\n\n## Vía software PK-ID3000\n\nEn el software\
    \ de configuración, al definir la entrada de la Matriz de Control [F2]:\n\n- Selecciona\
    \ la zona específica.\n- En la ventana **\"Seleccionar Zona\"**, activa la casilla\
    \ de **Coincidencia** y selecciona **2 zonas** en el desplegable (si usas \"Cualquier\
    \ zona\") o marca la casilla de coincidencia en la selección de zona específica\
    \ [F2].\n- > Nota: si la casilla no está seleccionada, no hay coincidencia [F2].\n\
    \nEn la columna **Coincidencia** de la Matriz de Control (vía teclado), pulsa\
    \ la **barra ESPACIADORA** para cambiar de **NO** a **SÍ** [F1].\n\n---\n\n##\
    \ Resumen de condiciones para que funcione la coincidencia\n\n- Solo aplica si\
    \ la entrada está especificada como **ZONA**, **SUBZONA** o **CUALQUIER ZONA**\
    \ — no para equipo individual ni tecla [F1].\n- Los dos equipos deben estar en\
    \ la **misma zona o subzona** [F3].\n- En subzonas, si la central está configurada\
    \ para ello, los equipos pueden estar dentro de un **rango de subzonas** (configurable\
    \ en **Sección 11.21** de la central) [F5].\n- Las opciones de coincidencia adicionales\
    \ (n equipos, p equipos) solo aparecen si están configuradas en los ajustes de\
    \ la central — **Sección 11.21** [F3].\n\n---\n\n**Fuentes:**\n- MCDT190 — ID3000\
    \ Manual de programación (sin revisión registrada), Sección 6.1.5\n- MPDT190 —\
    \ ID3000 Manual (sin revisión registrada), Sección Matriz de control y Sección\
    \ 11.21\n- MCDT191\\_F v. 2.17e — ID3000 Manual del programa de configuración\
    \ PK-ID3000, Sección 4.3"
- qid: hp006
  question: La Notifier AFP-400 muestra el aviso 'Tierra' (Earth Fault). ¿Qué significa
    y cómo se localiza?
  judge_vara: v4
  gold_estado: verificado
  conducta_esperada: answer
  conducta_bot: answer
  veredicto: FALLO
  diagnostico: 'Acierta en que es una avería por fuga/aislamiento a tierra y menciona
    JP2, pero faltan facts CORE: LED/terminales de la MPS-400, reconocimiento de ''Tierra''
    en el SLC y uso de aisladores ISO-X para acotar el lazo. Además alucina o infiere
    que el Documento 50259 contiene el procedimiento completo de localización de fallas
    de tierra, cuando el gold indica que no hay procedimiento paso a paso en los manuales
    disponibles.'
  bot_sources:
  - 15090SP
  - 50253SP
  - MFDT170
  coverage_status: appended
  coverage_appended_rows: 1
  release_profile: coverage_c1_v4
  harness_variant: serving_seam_v1_historical_single_turn_inputs
  bot_answer: '## Aviso de Tierra (Earth Fault) en la AFP-400


    El aviso **"Tierra"** en la AFP-400 es una condición de **avería del sistema**
    que indica una fuga a tierra en el cableado o en algún dispositivo conectado al
    panel.


    ---


    ### ¿Qué indica en el panel?


    Cuando existe esta condición, el LED **"Avería del Sistema"** (color amarillo)
    parpadea si no ha sido reconocida, y se ilumina de forma fija una vez reconocida
    [F2]. Para desactivarlo, debes **eliminar la condición de avería** [F2].


    ---


    ### Cómo inhabilitar/localizar la detección de Tierra


    El manual indica que el puente **JP2** de la **MPS-400** puede cortarse para **inhabilitar
    la detección de Falla de Tierra** [F1]. Esto puede usarse temporalmente durante
    el proceso de localización para confirmar que la detección está activa y funcional.


    ---


    ### Limitación importante


    Los fragmentos disponibles **no describen un procedimiento paso a paso para localizar
    físicamente la fuga a tierra** en la AFP-400. El manual referenciado para procedimientos
    de resolución de problemas de dispositivos es el **Manual de Programación del
    AFP-300/AFP-400 (Documento 50259)** [F5], donde encontrarás información detallada
    sobre tipos de problemas y localización por dirección de dispositivo (formato:
    Nodo XXX, LIB XX, Módulo XX) [F5].


    **Recomendación:** Consulta el Documento 50259 para el procedimiento completo
    de localización de fallas de tierra.


    ---


    Fuente: Manual de Usuario AFP-400 – MFDT170 (sin revisión registrada); Manual
    de Instalación AFP-300/AFP-400 – PN 50253:D (09/22/98)'
