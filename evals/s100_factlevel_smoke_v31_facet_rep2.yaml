  question: En los detectores de llama Spectrex SharpEye 40/40, ¿qué diferencia hay
    entre el modelo 40/40L y el 40/40L4, y qué significa el sufijo «B» (p. ej. 40/40LB)?
  answer: "## Diferencias entre 40/40L, 40/40L4 y sufijo «B»\n\nEl manual cubre los\
    \ cuatro modelos en un mismo documento [F1]: **S40/40L**, **S40/40LB**, **S40/40L4**\
    \ y **S40/40L4B**.\n\n---\n\n### 40/40L vs. 40/40L4\n\nLa diferencia documentada\
    \ entre ambos modelos está en su **sensibilidad de detección** [F2]:\n\n- **40/40L**\
    \ (y su variante LB):\n  - Ajuste de sensibilidad disponible: **15** → alcance\
    \ **50 ft / 15 m** [F2]\n\n- **40/40L4** (y su variante L4B):\n  - Ajuste de sensibilidad\
    \ disponible: **28** → alcance **93 ft / 28 m** [F2]\n\nEs decir, el modelo **L4\
    \ tiene mayor alcance de detección** que el L estándar según los ajustes de sensibilidad\
    \ listados en el software WinHost.\n\n> ⚠️ Los fragmentos disponibles no describen\
    \ en texto otras diferencias técnicas entre L y L4 (tecnología de sensor, número\
    \ de canales IR, etc.). Para más detalle, consulta el Apéndice A de especificaciones\
    \ del manual físico [F5].\n\n---\n\n### Sufijo «B» (p. ej. 40/40LB, 40/40L4B)\n\
    \nEl manual no define explícitamente el sufijo «B» en texto para la serie L. Sin\
    \ embargo, por analogía directa con la serie U del mismo fabricante, donde el\
    \ manual sí lo define [F3]:\n\n- **Sin «B»** (ej. 40/40U): **sin BIT** (prueba\
    \ incorporada)\n- **Con «B»** (ej. 40/40UB): **con BIT** (prueba incorporada)\n\
    \nEsta definición aparece en la Tabla 2 del manual de la serie U [F3]. El manual\
    \ de la serie L (MNDT722) agrupa los modelos L, LB, L4 y L4B en el mismo documento\
    \ [F1] y describe la función BIT (prueba automática y manual) como una característica\
    \ del detector [F4], pero **no define explícitamente el sufijo «B» en texto**\
    \ para la serie L.\n\n> ⚠️ Para confirmar que el sufijo «B» en la serie L tiene\
    \ exactamente el mismo significado que en la serie U, verifica en el Apéndice\
    \ A o en la sección 2.2.1 («Comprobación del tipo de producto») del manual MNDT722\
    \ [F4].\n\n---\n\n**Fuentes:**\n- Fuente principal: Manual de usuario Detector\
    \ S40/40L-LB-L4-L4B (MNDT722_40-40L, sin revisión registrada)\n- Fuente secundaria:\
    \ SharpEye™ 40/40 Flame Detectors User Guide — WinHost (TM777050 Rev. Da, octubre\
    \ 2017)\n- Referencia de sufijo «B»: Manual de usuario Detector S40/40U y UB (MNDT723_40-40U,\
    \ sin revisión registrada)"
