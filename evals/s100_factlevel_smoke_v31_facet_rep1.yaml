- qid: cat022
  question: En los detectores de llama Spectrex SharpEye 40/40, ¿qué diferencia hay
    entre el modelo 40/40L y el 40/40L4, y qué significa el sufijo «B» (p. ej. 40/40LB)?
  answer: '## Diferencias entre 40/40L, 40/40L4 y sufijo «B»


    ### Modelos cubiertos por el manual


    El manual **MNDT722_40-40L** cubre los modelos **S40/40L, LB, L4 y L4B** [F1].
    Son variantes de la misma familia de detectores de llama UV/IR SharpEye.


    ---


    ### Diferencia entre 40/40L y 40/40L4


    La diferencia documentada en los fragmentos es la **sensibilidad**:


    - **40/40L** (y su variante 40/40LB): sensibilidad ajustable con setting **15
    → 50 ft / 15 m** [F2]

    - **40/40L4** (y su variante 40/40L4B): sensibilidad con setting **28 → 93 ft
    / 28 m** [F2]


    El manual no especifica en los fragmentos recuperados qué diferencia tecnológica
    (óptica, espectral, etc.) justifica ese distinto alcance entre el L y el L4. Para
    el detalle completo, consulta el **Apéndice A – Especificaciones** del manual
    MNDT722_40-40L.


    ---


    ### Significado del sufijo «B»


    El sufijo **«B»** indica que el detector incorpora **BIT (Prueba Incorporada /
    Built-In Test)** [F4].


    - **40/40L** → sin BIT

    - **40/40LB** → con BIT


    Esto es coherente con la nomenclatura de la misma familia: en el manual del modelo
    U se documenta explícitamente que el sufijo «B» distingue la versión con BIT de
    la versión sin BIT [F3].


    El BIT permite al detector realizar pruebas de funcionamiento automáticas y manuales
    [F5], y un fallo en esa prueba genera el estado **«Fallo en prueba (BIT)»** con
    LED amarillo intermitente a **4 Hz** [F6].


    ---


    **Resumen rápido:**


    - **L vs L4**: diferente alcance/sensibilidad (15 m vs 28 m según los settings
    documentados) [F2]

    - **Sufijo B**: incorpora BIT (prueba incorporada) [F3][F4]

    - **Sin sufijo B**: sin BIT


    ---


    Fuente: MNDT722_40-40L (sin revisión registrada); manual-sharpeye-40-40-series-winhost-spectrex-en-us-4845694
    (sin revisión registrada); MNDT723_40-40U (sin revisión registrada)'
