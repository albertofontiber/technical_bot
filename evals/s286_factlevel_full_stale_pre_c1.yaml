- qid: cat005
  question: ¿Cuáles son las características técnicas de la central de detección de
    gas Fidegas CS4, y en qué se diferencian las versiones digital y analógica?
  answer: "# Central de Alarmas FIDEGAS® CS4 — Características Técnicas\n\n## Especificaciones\
    \ generales\n\nLas siguientes características son comunes a ambas versiones [F2]:\n\
    \n- **Tensión de alimentación:** 110-230 Vac, 50-60 Hz [F2]\n- **Potencia:** 30\
    \ W [F2]\n- **Clase:** Clase II [F3] [F7]\n- **Firmware:** 1.2 (tanto versión\
    \ digital como analógica) [F3] [F7]\n- **Sensores:** Hasta 4 conexiones simultáneas\
    \ (modo analógico o digital según versión) [F2]\n- **Salidas:** 2 salidas conmutadas\
    \ LP (relé apto para 230 Vac) con contactos NA-C-NC [F2]\n- **Corriente máxima:**\
    \ 250 mA [F2]\n- **Rearme:** Seleccionable manual o automático [F2]\n- **Indicaciones:**\
    \ Presencia, alarma y avería por sensor; avería de central; corte de red [F2]\n\
    - **Dimensiones:** 90 x 106 x 58 mm [F2]\n- **Peso:** 300 g [F2]\n- **Instalación:**\
    \ En carril DIN o armario de superficie [F1]\n\n## Indicaciones luminosas y acústicas\n\
    \n- **LED verde PWR:** Alimentación presente (fijo) / corte de red (intermitente)\
    \ [F1]\n- **LED bicolor ON/ALARM** (por sensor): Sensor presente (verde) / alarma\
    \ (rojo) [F1]\n- **LED amarillo ERROR** (por sensor): Avería de sensor remoto\
    \ [F1]\n- **LED verde OUT1 / OUT2:** Salida activa (verde) / desactivada (apagado)\
    \ [F1]\n- **Avisador acústico:** Apoyo sonoro a las indicaciones ópticas [F1]\n\
    \n## Diferencias entre versión digital y analógica\n\n### Tipo de señal de entrada\n\
    - **Versión analógica:** Entradas 4-20 mA [F1]\n- **Versión digital:** Entradas\
    \ 0-10/15 V [F1]\n\n### Código de producto\n- **Versión digital:** 3244 [F2]\n\
    - **Versión analógica:** 3270 [F2]\n\n### Sensores compatibles\n- **Versión analógica:**\
    \ [F3]\n  - Sensores S/3 gases combustibles\n  - Sensores S/3 y S/2 gases tóxicos\n\
    \  - Sensores S/10 gases tóxicos\n- **Versión digital:** [F3]\n  - Sensores S/10\
    \ gases combustibles\n\n## Conexionado de sensores\n\nCada sensor se conecta mediante\
    \ 3 terminales [F4]:\n1. Positivo de alimentación (12 a 24 Vdc)\n2. Entrada de\
    \ señal\n3. Negativo común de alimentación y señal\n\nEn la parte inferior de\
    \ la central se encuentran los conectores de alimentación y los de las dos salidas\
    \ OUT1 y OUT2 con terminales NA-C-NC [F4].\n\n## Umbral de alarma\n\n- La alarma\
    \ se activa cuando la concentración de gas supera el **20% del fondo de escala**\
    \ [F5]\n- Las alarmas son **enclavadas**: se guardan en memoria hasta que el usuario\
    \ pulsa **RESET** [F5]\n- Si la concentración no ha disminuido, la alarma puede\
    \ **silenciarse durante 24 horas** con el botón RESET, pero no se puede rearmar\
    \ [F5]\n\n---\n\nFuente: Manual de Usuario CS4 (Analógica o Digital), Rev. 2,\
    \ 10/2018 — Fabricado por C.A.E., S.L. [F6]\n\n---\n\nTambién puedo ayudarte con:\
    \ **procedimiento de configuración de la CS4**, **conexionado detallado de los\
    \ sensores S/3 o S/10**, o **funcionamiento del rearme automático vs. manual**."
