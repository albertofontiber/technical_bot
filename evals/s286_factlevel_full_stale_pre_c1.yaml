  question: ¿Cuántos lazos direccionables soporta la Notifier AM2020/AFP1010 y cuántos
    dispositivos por lazo?
  answer: "## Lazos y dispositivos por lazo — AM2020 / AFP1010\n\n### AM2020\n\n-\
    \ **Número máximo de lazos SLC: 10** [F3][F5]\n- Se pueden usar **de uno a cinco\
    \ LIB-400** (cada LIB-400 controla 2 lazos) **o de uno a diez LIB-200/LIB-200A**\
    \ (cada uno controla 1 lazo), o combinación de ambos [F5]\n- **Dispositivos por\
    \ lazo:**\n  - Hasta **99 detectores analógicos** por lazo [F3][F5]\n  - Hasta\
    \ **99 módulos** (monitores o de control) por lazo [F3][F5]\n\n### AFP1010\n\n\
    - **Número máximo de lazos SLC: 4** (máximo dos LIB-400, lo que da un total de\
    \ cuatro SLCs) [F5]\n- Existe también la referencia de que el AFP1010 está **limitado\
    \ a un máximo de dos LIB-200**, con un total de **396 dispositivos en el sistema**\
    \ [F1]\n- **Dispositivos por lazo:** misma capacidad que la AM2020 — **99 detectores\
    \ + 99 módulos** por lazo [F5]\n\n---\n\n**Resumen rápido:**\n\n- **AM2020:**\
    \ hasta **10 lazos** × (99 detectores + 99 módulos) = hasta **1.980 dispositivos**\n\
    - **AFP1010:** hasta **4 lazos** (con LIB-400) o **2 lazos** (con LIB-200), con\
    \ un máximo de **396 dispositivos** en la configuración con LIB-200 [F1][F5]\n\
    \n> ⚠️ Nota: El dato de 396 dispositivos para AFP1010 con LIB-200 aparece en el\
    \ manual MPDT280 [F1]. El manual 15088SP [F5] indica que el AFP1010 soporta hasta\
    \ cuatro SLCs con LIB-400. Verifica qué tarjetas de lazo tienes instaladas para\
    \ aplicar el límite correcto.\n\n---\n\nFuentes: MFDT280 (sin revisión registrada);\
    \ 15088SP (sin revisión registrada); MPDT280 (rev. Rev A)\n\n---\n\nTambién puedo\
    \ ayudarte con: **instalación y numeración de tarjetas LIB**, **configuración\
    \ del modo local por lazo** o **programación de lazos SLC (Estilo 4 vs Estilo\
    \ 6)** en la AM2020/AFP1010."
