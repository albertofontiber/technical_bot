- qid: hp002
  question: El detector ASD535 de Detnov está dando una alarma intermitente de flujo
    bajo. ¿Cuál es la causa más probable y cómo se diagnostica?
  answer: "## ASD535 — Alarma intermitente de flujo bajo: diagnóstico\n\n### Causa\
    \ más probable\n\nUna alarma intermitente de flujo bajo indica que el valor de\
    \ flujo real ha caído **por debajo del 80 %** del valor nominal registrado en\
    \ el reset inicial [F1][F2]. Esto apunta a una **obstrucción en el conducto de\
    \ aspiración** [F6].\n\nEl ASD535 dispara el aviso de fallo de flujo de aire una\
    \ vez transcurrido el tiempo de retardo de **300 s** (LS-Ü) [F1][F2]. Si la alarma\
    \ es intermitente, puede indicar que la obstrucción es parcial o que hay turbulencias\
    \ que hacen que el valor oscile cerca del umbral del **80 %** [F5].\n\n---\n\n\
    ### Procedimiento de diagnóstico paso a paso\n\n**1. Leer el valor de flujo actual**\n\
    \n- Coloca el conmutador en posición **V** (cap. 7.6.1 del manual) [F2][F9].\n\
    - Compara el valor leído con el registrado en el protocolo de puesta en funcionamiento\
    \ [F9].\n- Valor < 100 % → apunta a obstrucción [F2][F9].\n- Si la sensibilidad\
    \ LS-Ü establecida es **±20 %** (estándar), ya debes inspeccionar el conducto\
    \ cuando el valor caiga por debajo del **90 %** (mitad de la sensibilidad = ±10\
    \ %) [F9].\n\n**2. Inspeccionar el conducto de aspiración**\n\nSegún el código\
    \ de fallo **G30/001** (Obstrucción, conducto de aspiración) [F6]:\n\n- Comprobar\
    \ si el conducto de aspiración está obstruido: **orificios de aspiración y salida\
    \ de aire** [F6].\n- Inspeccionar y limpiar la **caja de filtro / unidad de filtrado**\
    \ [F6].\n- Inspeccionar y limpiar el **sensor de flujo de aire** [F6].\n\n**3.\
    \ Verificar la salida de aire del detector**\n\n- Comprobar si existe suciedad\
    \ en la **salida de aire** de la caja del detector y limpiarla si es necesario\
    \ [F9].\n\n**4. Comprobar el sensor de flujo de aire**\n\n- Si tras limpiar el\
    \ conducto el fallo persiste, consulta el código **G30/008** (Sensor de flujo\
    \ de aire defectuoso / inexistente) [F6]:\n  - Verificar que el sensor está correctamente\
    \ enchufado.\n  - Comprobar el cable de conexión.\n  - Si está defectuoso → **sustituir**\
    \ [F6].\n\n**5. Verificar la tensión de alimentación**\n\n- Mide la tensión en\
    \ los bornes **1 (+) y 2 (-)** del AMB 35 [F9]:\n  - Funcionamiento a 12 V-CC\
    \ → valor nominal: **12,3 a 13,8 V-CC** [F9].\n  - Funcionamiento a 24 V-CC →\
    \ valor nominal: **21,6 a 27,6 V-CC** [F9].\n- Una tensión fuera de rango puede\
    \ generar lecturas de flujo erróneas.\n\n**6. Evaluar si hay turbulencias ambientales**\n\
    \n- Si el entorno tiene grandes turbulencias de aire, estas pueden provocar avisos\
    \ intermitentes [F5].\n- En ese caso, puede ser necesario aumentar el tiempo de\
    \ retardo y/o el tamaño de la ventana de monitorización, pero **esto implica incumplimiento\
    \ de EN 54-20** y solo puede realizarse previa consulta con el fabricante [F5].\n\
    \n**7. Ejecutar nuevo reset inicial si es necesario**\n\n- Si tras la limpieza\
    \ el valor de flujo no se estabiliza correctamente, ejecuta un **nuevo reset inicial**\
    \ con el conducto limpio y en perfecto estado [F1][F4].\n- ⚠️ Asegúrate de respetar\
    \ el tiempo de espera previo al reset inicial para evitar el código de fallo **004**\
    \ (Timeout reset inicial) [F4].\n\n---\n\n> ⚠️ **Importante**: Antes de realizar\
    \ cualquier comprobación, bloquea o desconecta el control de incendios y la alerta\
    \ remota en la CDI de orden superior para evitar disparos no deseados [F9].\n\n\
    ---\n\n**Fuente:** ASD535, Descripción técnica, T 131 192 h es (sin revisión registrada)\n\
    \n---\n\nTambién puedo ayudarte con: **procedimiento completo de reset inicial**,\
    \ **lectura de códigos de evento en el AMB 35** o **limpieza de sensores de humo\
    \ del ASD535**."
