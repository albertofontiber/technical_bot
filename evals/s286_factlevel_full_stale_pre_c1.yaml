- qid: hp005
  question: En la Notifier ID3000, ¿cómo se programa una zona para que active una
    salida de sirena solo cuando haya coincidencia de dos detectores?
  answer: "# Programación de coincidencia de dos detectores para activar sirena —\
    \ ID3000\n\n## Concepto previo\n\nLa función de coincidencia requiere que **dos\
    \ equipos de la misma zona/subzona** estén en alarma antes de activar la salida\
    \ [F1]. Esta función **solo se aplica si la entrada está especificada como 'ZONA',\
    \ 'SUBZONA' o 'CUALQUIERA'**, no si es un equipo individual o una tecla [F1].\n\
    \n> ⚠️ **PRECAUCIÓN EN54-2: 7.1.4 — No incluyas pulsadores manuales (MCP/PUL)\
    \ en el grupo de coincidencia** [F1][F2].\n\n---\n\n## Procedimiento (vía software\
    \ PK-ID3000)\n\n### Paso 1 — Instrucción para pulsadores manuales (sin coincidencia)\n\
    \nPara evitar que los pulsadores queden dentro del grupo de coincidencia, debes\
    \ crear **dos instrucciones de Matriz de Control separadas** [F1][F2]:\n\n1. Crea\
    \ una primera instrucción de Matriz de Control con:\n   - **Entrada:** tipo `Pulsador\
    \ Manual (MCP/PUL)` → zona donde están los detectores\n   - **Coincidencia:**\
    \ `UN ÚNICO EQUIPO` (sin coincidencia) [F2]\n   - **Salida:** sirena\n\n### Paso\
    \ 2 — Instrucción para detectores con coincidencia\n\n2. Crea una segunda instrucción\
    \ de Matriz de Control con:\n   - **Entrada:** tipo `ANALÓGICO` (incluye detectores\
    \ térmicos, iónicos, ópticos, VIEW y multisensor) [F1], o el tipo específico que\
    \ corresponda según tu instalación\n   - En la selección de zona: elige **Una\
    \ única zona** (opción 1 en el paso 6 del menú) [F2]\n   - En **\"Limitado por\
    \ TIPO\"**: selecciona el tipo de detector correspondiente [F2]\n   - En **\"\
    Indique tipo de coincidencia\"**: selecciona `2: COINCIDENCIA 2 EQUIPOS` [F2]\n\
    \   - **Salida:** sirena\n\n> **Nota:** La opción `COINCIDENCIA 2 EQUIPOS` solo\
    \ aparece si en el paso anterior se ha seleccionado **\"Una única zona\"** y el\
    \ tipo seleccionado **no es** la opción 9, 10 u 11 (que ya incluyen coincidencia\
    \ interna) [F2].\n\n> **Nota:** No se permite usar simultáneamente la coincidencia\
    \ de zonas y la limitación por tipo en la misma entrada de Matriz de Control [F2].\n\
    \n---\n\n### Paso 3 — Verificar comportamiento de coincidencia en subzonas (si\
    \ aplica)\n\nSi la zona usa **subzonas**, ve a **Sección 2.12 — Pestaña de Coincidencia\
    \ de Alarma** del PK-ID3000 [F4] y configura:\n\n- **Coincidencia de Equipos en\
    \ Subzonas:**\n  - Opción a: los dos equipos deben estar en la **misma subzona**\
    \ (opción por defecto) [F4][F7]\n  - Opción b: los dos equipos pueden estar dentro\
    \ de un **rango de subzonas** configurado [F4][F7]\n\n---\n\n## Resumen del flujo\n\
    \n- **1 detector en alarma** → la instrucción del Paso 1 activa la sirena directamente\
    \ (sin coincidencia, por el MCP) — o bien no activa nada si solo hay detectores\
    \ analógicos y no se alcanza la coincidencia.\n- **2 detectores en alarma en la\
    \ misma zona** → la instrucción del Paso 2 activa la sirena [F1][F2].\n\n---\n\
    \n**Fuentes:**\n- MCDT190 — ID3000 Manual de Programación, Sección 6.1.5 (sin\
    \ revisión registrada)\n- MPDT190 — ID3000 Manual de Programación, Sección Matriz\
    \ de Control (sin revisión registrada)\n- MCDT191 — ID3000 Manual del Programa\
    \ de Configuración PK-ID3000, Secciones 4.3.1 y 2.12 (rev. v. 2.17e)\n\n---\n\n\
    También puedo ayudarte con: **configuración de niveles de coincidencia avanzados\
    \ (n equipos)**, **programación de retardo en la salida de sirena** o **verificación\
    \ del comportamiento en sistemas de red con múltiples centrales**."
