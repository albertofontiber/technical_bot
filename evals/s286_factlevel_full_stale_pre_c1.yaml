- qid: cat022
  question: En los detectores de llama Spectrex SharpEye 40/40, ¿qué diferencia hay
    entre el modelo 40/40L y el 40/40L4, y qué significa el sufijo «B» (p. ej. 40/40LB)?
  answer: '## Diferencias entre 40/40L, 40/40L4 y sufijo «B»


    ### Modelos cubiertos por el manual


    El manual MNDT722_40-40L cubre los modelos **S40/40L, LB, L4 y L4B** de SharpEye
    [F1]. Todos ellos son detectores de llama UV/IR de la misma familia.


    ---


    ### Diferencia entre 40/40L y 40/40L4


    Los fragmentos disponibles no incluyen una descripción textual explícita de qué
    diferencia técnica existe entre el modelo **L** y el modelo **L4** (p. ej. tecnología
    de sensores, ángulo de visión, tipo de llama detectada).


    Lo que sí se puede extraer es una diferencia funcional concreta en **sensibilidad**:


    - **40/40L y 40/40LB** → sensibilidad ajustable a **50/15 ft/m** [F2]

    - **40/40L4 y 40/40L4B** → sensibilidad ajustable a **93/28 ft/m** [F2]


    Esto indica que el **L4 tiene mayor alcance de detección** que el L (28 m frente
    a 15 m en la configuración disponible en los fragmentos).


    ---


    ### Significado del sufijo «B»


    El manual no define explícitamente el sufijo «B» para la familia L en los fragmentos
    recuperados. Sin embargo, en el manual del modelo **40/40U** (familia paralela),
    la tabla de versiones establece:


    - **U** → UV **sin** BIT (prueba incorporada) [F3]

    - **UB** → UV **con** BIT (prueba incorporada) [F3]


    Por analogía estructural con la nomenclatura de la misma familia de productos,
    el sufijo **«B» indica la presencia de BIT (Built-In Test / Prueba Incorporada)**.
    No obstante, esta relación no aparece definida **literalmente** en los fragmentos
    del manual MNDT722_40-40L para los modelos L/L4 — el manual del 40/40L sí menciona
    la función BIT como parte del funcionamiento del detector [F9], pero no vincula
    explícitamente el sufijo «B» a esa función en un texto literal.


    > ⚠️ Para confirmar la definición exacta del sufijo «B» en los modelos L y L4,
    consulta la **Tabla de versiones del detector** en el manual físico MNDT722_40-40L
    (equivalente a la Tabla 2 del manual del 40/40U [F3]).


    ---


    **Fuente:** Manual de usuario Detector S40/40L-LB-L4-L4B (MNDT722_40-40L, sin
    revisión registrada); SharpEye™ 40/40 Flame Detectors User Guide (TM777050 Rev.
    Da, octubre 2017); Manual de usuario Detector S40/40U y UB (MNDT723_40-40U, sin
    revisión registrada)


    ---


    También puedo ayudarte con: **especificaciones eléctricas del 40/40L**, **opciones
    de cableado disponibles** o **procedimiento de mantenimiento y solución de problemas**
    de esta familia de detectores.'
