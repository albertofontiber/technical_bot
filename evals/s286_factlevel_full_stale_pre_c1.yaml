- qid: hp003
  question: ¿Cómo se conectan las baterías de 24V en la Detnov CAD-150?
  answer: "## Conexión de baterías en la CAD-150-8\n\n### Especificaciones de las\
    \ baterías\n\n- **Tipo requerido:** dos baterías de **12V 7A/h** [F6]\n- **Conexión:**\
    \ en **serie** (para obtener 24V) [F6]\n- Antes de conectar, verificar que las\
    \ baterías tienen una tensión superior a **24V** [F8]\n\n---\n\n### Procedimiento\
    \ de conexión\n\n1. **Conecta primero la red (230VAC)** activando el magnetotérmico\
    \ bipolar. Las baterías se conectan **siempre en segundo lugar** — si no se respeta\
    \ este orden, el equipo podría sufrir daños [F5][F6].\n\n2. **Coloca las baterías**\
    \ en la parte inferior de la caja, en el espacio reservado para ello, de forma\
    \ **vertical** [F6].\n\n3. **Conecta el cable puente** (suministrado con la central)\
    \ uniendo el **polo positivo (+) de una batería con el polo negativo (−) de la\
    \ otra**, para ponerlas en serie [F6].\n\n4. **Conecta los cables del circuito**\
    \ al conector de batería (posición **11** en la PCB Base) [F2]:\n   - Cable **rojo\
    \ → polo positivo (+)**\n   - Cable **negro → polo negativo (−)**\n   de las baterías\
