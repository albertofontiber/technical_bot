- qid: cat020
  question: En una central Morley DXc instalada en Espana, ¿cual es el nivel de alarma
    y de prealarma por defecto de los detectores, y el maximo configurable?
  answer: '## Niveles de alarma y prealarma por defecto en la DXc — Protocolo Morley-IAS


    La respuesta varía según el **tipo de detector**:


    ---


    ### Detectores ópticos estándar (OPT) — valores en porcentaje


    - **Prealarma por defecto: 80%** [F1]

    - **Alarma por defecto: 100%** [F1]

    - **Máximo configurable para el nivel de alarma: 108%** [F1]


    ---


    ### Detectores multicriterio óptico-térmicos (OTM) — valores por niveles


    - **Prealarma por defecto: Nivel 3** [F1][F2]

    - **Alarma por defecto: Nivel 4** [F1][F2]


    La tabla de correspondencia entre niveles y sensibilidad para los OTM es [F2]:


    - Nivel 1 → 3,2% osc./m

    - Nivel 2 → 3,2% a 6,5% osc./m (autoajustado)

    - Nivel 3 → 6,5% osc./m *(nivel de prealarma recomendado)*

    - Nivel 4 → 6,5% a 11,5% osc./m (autoajustado) *(nivel de alarma recomendado)*

    - Nivel 5 → 11,5% osc./m

    - Nivel 6 → Solo temperatura


    ---


    ### Detectores láser (LSR) — valores por niveles


    - **Prealarma por defecto: Nivel 4** [F1]

    - **Alarma por defecto: Nivel 5** [F1]


    La tabla de correspondencia para el detector láser es [F2]:


    - Nivel 1 → 0,06% osc./m

    - Nivel 2 → 0,10% osc./m

    - Nivel 3 → 0,16% osc./m

    - Nivel 4 → 0,32% osc./m *(nivel de prealarma recomendado)*

    - Nivel 5 → 0,65% osc./m *(nivel de alarma recomendado)*

    - Nivel 6 → 1,64% osc./m

    - Nivel 7 → 3,28% osc./m

    - Nivel 8 → 4,92% osc./m

    - Nivel 9 → 6,5% osc./m


    ---


    ### Restricciones importantes al modificar niveles


    - **El nivel de prealarma no puede ser superior al nivel de alarma** [F3]

    - La central no permite ajustar niveles que impidan el reconocimiento de alarmas
    [F3]

    - Por defecto, los detectores se ajustan a los **niveles de alarma recomendados
    por el fabricante** [F4]

    - Esta función debe utilizarse solo en aplicaciones especiales y con sumo cuidado
