- qid: cat009
  question: ¿Qué resistencia de fin de línea (EOL) hay que instalar en las líneas
    de zona de la central convencional NFS Supra?
  answer: "## Resistencia de Fin de Línea (EOL) en zonas de la NFS Supra\n\nLa central\
    \ NFS Supra admite **dos tipos de final de línea** para las zonas de detección,\
    \ y el sistema debe configurarse para que coincida con el tipo instalado físicamente.\n\
    \n---\n\n### Opciones de EOL disponibles\n\n**Modo capacitivo (por defecto):**\n\
    - Condensador de **47 µF** [F5][F6]\n- Es la configuración de fábrica [F4][F3]\n\
    \n**Modo resistivo (RFL):**\n- Resistencia de **6K8 Ω** [F5][F6]\n- El sistema\
    \ acepta un rango de resistencia final de línea entre **3 KΩ** (consumo máx. por\
    \ zona 2,5 mA) y **7 KΩ** (consumo máx. por zona 4 mA) [F5]\n\n> ⚠️ **Importante:**\
    \ Todas las zonas, incluidas las no usadas, deben tener instalado su final de\
    \ línea según la configuración del sistema [F5][F6].\n\n---\n\n### Dónde instalar\
    \ el EOL\n\nEl EOL (condensador de 47 µF o resistencia de 6K8 Ω) se instala **entre\
    \ el positivo y el negativo de la línea, en la conexión de salida del último equipo**\
    \ de la zona [F2][F8].\n\n---\n\n### Cómo configurar el tipo de supervisión en\
    \ la central\n\nSi cambias el tipo de EOL físico, debes configurar la central\
    \ para que coincida [F4]:\n\n1. Pulsa simultáneamente **Tecla TECLADO + Tecla\
    \ EVACUACIÓN** para acceder al menú de configuración de EOL [F4]\n2. Usa la tecla\
    \ **REARME** para cambiar cíclicamente la opción [F4]:\n   - **Led 1 Alarma (Rojo)\
    \ = ON** → Final de Línea Resistivo **6K8 Ω** [F4]\n   - **Led 2 Anulada (Ámbar)\
    \ = ON** → Final de Línea Capacitivo **47 µF / Diodo** (por defecto) [F4]\n3.\
    \ Este ajuste requiere **Nivel de acceso 3 (Configuración)** [F4]\n\n---\n\n###\
    \ Nota sobre versiones del manual\n\nExiste una discrepancia menor entre las versiones\
    \ del manual:\n- La versión en inglés (HLSI-MN-025-I) indica **4K7 Ω** como alternativa\
    \ resistiva en la sección de conexionado de detectores [F1][F3]\n- La versión\
    \ en español (HLSI-MN-025) y la sección de circuitos de zona de ambas versiones\
    \ indican **6K8 Ω** [F2][F4][F5][F6]\n\nEl valor **6K8 Ω** es el que aparece de\
    \ forma consistente en las secciones de especificación y configuración de ambas\
    \ versiones [F5][F6], por lo que es el valor de referencia para la instalación.\n\
    \n---\n\nFuentes: HLSI-MN-025_NFS Supra (rev. sin revisión registrada); HLSI-MN-025-I_NFS\
    \ Supra Series (rev. sin revisión registrada); HLSI-MA-025 Guia Rapida NFS_Supra_ES\
    \ (rev. sin revisión registrada)\n\n---\n\nTambién puedo ayudarte con: **consumo\
    \ máximo de detectores por zona**, **conexionado de pulsadores con diodo Zener**\
    \ o **configuración de las salidas de sirena (EOL de sirenas)** de la NFS Supra."
