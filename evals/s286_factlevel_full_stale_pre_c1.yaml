- qid: hp017
  question: ¿Cómo se programa el retardo de salida de alarma principal en la Notifier
    PEARL?
  answer: '## Programación del retardo de salida de alarma en la Notifier PEARL


    El retardo de salida de alarma en la PEARL se configura a través de las **reglas
    de causa-efecto**. Los fragmentos disponibles cubren los tipos de retardo y su
    comportamiento, pero no describen paso a paso el procedimiento completo de creación
    de una regla con retardo. Te explico lo que sí está documentado:


    ---


    ### 1. Dónde se configura


    El retardo se asigna dentro de la **matriz de causa-efecto** (Apéndice 5 del manual
    de configuración) [F1]. Cada regla de causa-efecto puede tener asignado un tipo
    de retardo de salida.


    ---


    ### 2. Tipos de retardo disponibles


    Hay **seis tipos de retardo** que se pueden asignar a una regla [F1][F2]:


    - **Fijo**: No permite silenciar sirenas durante el retardo, no muestra cuenta
    atrás en LCD, no puede anularse ni detenerse con FIN RETARDO [F2].

    - **Estándar**: La salida se detiene si se pulsa **SILENCIAR SIRENAS** durante
    el retardo. Permite anular en nivel de acceso 2 con «Anular retardos». Muestra
    tiempo restante en pestaña ALARMA. Permite FIN RETARDO [F2].

    - **No Silenc.**: No se detiene con SILENCIAR SIRENAS. Sí permite anular retardos
    (nivel 2), muestra cuenta atrás y permite FIN RETARDO [F2].

    - **Est. Ext.**: La salida se detiene si se pulsa **AMPLIAR RETARDO**. Permite
    anular, muestra cuenta atrás y permite FIN RETARDO [F2].

    - **RetExtStd**: El temporizador comienza en **RETARDO AMPLIADO** al pulsar AMPLIAR
    RETARDO. Permite anular, muestra cuenta atrás y permite FIN RETARDO [F2].

    - **No Sil. Ext**: La salida se detiene con AMPLIAR RETARDO. No se detiene con
    SILENCIAR SIRENAS. Permite anular, muestra cuenta atrás y permite FIN RETARDO
    [F2].

    - **SinRetExt**: El temporizador comienza en RETARDO AMPLIADO. No se detiene con
    SILENCIAR SIRENAS ni AMPLIAR RETARDO. Permite anular, muestra cuenta atrás y permite
    FIN RETARDO [F2].


    ---


    ### 3. Retardo de alarma a nivel de equipo (sensor/módulo)


    Adicionalmente, existe un parámetro **«Retardo de alarma»** configurable individualmente
    para cada sensor o módulo en la sección **4.2 Editar equipos** [F7][F8]. También
    hay un parámetro de **«Retardo de confirmación de coincidencia de detector»**,
    ajustable hasta **240 s (4 min)**, utilizable con dependencia tipo B [F7].


    ---


    ### 4. Habilitación/anulación del retardo desde el panel (operación)


    Desde el menú **Anular/Habilitar**, opción **«5: Retardo Activación Salidas»**
    [F3]:


    1. Accede al menú Anular/Habilitar (requiere nivel de acceso 2).

    2. Selecciona **«5: Retardo Activación Salidas»**.

    3. Pulsa **✓** para cambiar el estado entre **HABILITADO** y **ANULADO**.

    4. Pulsa **✕** para salir [F3].


    ---


    ### 5. Tecla AMPLIAR RETARDO


    La tecla **AMPLIAR RETARDO** puede desactivarse desde los parámetros de la central
    (opción **«10: Extend Delay Button»**) si no se requiere en la instalación [F5].


    ---


    > ⚠️ **Nota importante**: Los fragmentos disponibles no incluyen el procedimiento
    paso a paso para crear o editar una regla de causa-efecto con un valor de tiempo
    de retardo concreto (p. ej., introducir 30 segundos). Para ese procedimiento detallado,
    consulta el Apéndice 5 completo del manual de configuración.


    ---


    **Fuentes:**

    - Manual de configuración de la central Pearl, ref. 997-671-005-3 (rev. 997-671-005-3)

    - Manual de funcionamiento de la central Pearl, ref. 997-670-005-3 (sin revisión
    registrada)


    ---


    También puedo ayudarte con: **borrar o editar una regla de causa-efecto**, **configuración
    del retardo de confirmación de coincidencia (tipo B)** o **anulación manual del
    retardo desde el panel**.'
