- qid: hp013
  question: ¿Cómo se cambia la batería tampón de la Detnov ADW535 sin perder configuración?
  answer: 'Los fragmentos recuperados del manual **ADW535_TD_T140358es_e** no contienen
    ningún procedimiento específico para la sustitución de la batería tampón (batería
    de litio del LMB 35) sin pérdida de configuración.


    Lo que sí puedo confirmar a partir de los fragmentos:


    - El **LMB 35** (Main Board) incluye una **batería de litio** y un **módulo de
    reloj RTC** [F5][F9].

    - Tras trabajos de reparación en el ADW 535, incluyendo la **sustitución del Main
    Board LMB 35**, es obligatorio realizar un nuevo **reset inicial** [F1]. Esto
    implica que la sustitución del LMB 35 sí requiere reset inicial posterior.

    - Los parámetros de configuración específicos del sistema se almacenan y **se
    mantienen tras un reset de hardware** (corte de tensión o pulsador reset) [F4],
    pero el manual no especifica explícitamente qué ocurre con la configuración al
    sustituir únicamente la batería de litio sin cambiar el LMB 35.

    - En caso de sustituir la **unidad de evaluación completa**, hay que reajustar
    todas las configuraciones específicas del cliente y realizar un reset inicial
    [F7].


    **Lo que el manual no especifica en los fragmentos disponibles:**

    - Procedimiento paso a paso para cambiar solo la batería de litio.

    - Si la configuración (EEPROM/Flash-PROM) se conserva al retirar la batería de
    litio con la alimentación principal conectada.

    - Tiempo máximo sin batería antes de pérdida de datos del RTC u otros parámetros.


    **Recomendación:** Consulta directamente el soporte técnico de **Securiton/Detnov**
    o el manual completo físico, ya que este procedimiento puede estar en una sección
    no recuperada. Dado que el LMB 35 dispone de **Flash-PROM y EEPROM** [F5], es
    probable que la configuración no dependa exclusivamente de la batería, pero esto
    no puedo afirmarlo sin respaldo en los fragmentos.


    Fuente: ADW535 Descripción técnica, T 140 358 e es (sin revisión registrada)


    ---

    También puedo ayudarte con: **procedimiento de reset inicial tras reparación**,
    **interpretación de fallos G50/G60** o **comprobaciones de mantenimiento del ADW535**.'
