- qid: hp010
  question: En la Morley DXc, ¿cómo se añade un nuevo detector al lazo tras la puesta
    en marcha inicial?
  answer: '# Añadir un nuevo detector al lazo en la DXc (tras puesta en marcha)


    El procedimiento para incorporar un nuevo detector al lazo después de la puesta
    en marcha inicial se realiza mediante la función **Autobúsqueda de equipos** (sección
    5.3.5.2) [F1].


    ---


    ## Paso 1 — Acceder al nivel de programación (Nivel 3)


    1. Desde el panel, accede al **Nivel 2**: opción `5: Menú` [F3].

    2. Pulsa `7: Programación/Niv3` [F3].

    3. Introduce la **clave de acceso de Nivel 3** y pulsa **⊙** [F3].

    4. Cuando aparezca el mensaje `Memoria Bloqueada`, pulsa **⊙** de nuevo para desbloquear
    (el puente **J5** sobre el conector de PC debe estar puesto) [F3].

    5. En el menú de programación, pulsa `2: Lazo` [F3].


    ---


    ## Paso 2 — Ejecutar la Autobúsqueda


    1. En el menú de Lazos, pulsa `2: Autobúsqueda` [F1].

    2. Si la central tiene más de un lazo, introduce el **número de lazo** correspondiente
    y pulsa **⊙** [F1].

    3. Confirma la operación pulsando **⊙** cuando aparezca `Lazo: X Autobúsqueda?`
    [F1].

    4. Espera a que finalice el proceso (se muestra una barra de progreso en pantalla)
    [F1].


    > ⚠️ **Aviso importante:** En mercados donde el protocolo es seleccionable, si
    se ha realizado un cambio de protocolo previamente, **espera 2 minutos** antes
    de ejecutar la autobúsqueda [F1].


    ---


    ## Paso 3 — Verificar el resultado


    Al finalizar, la pantalla mostrará un resumen con [F1]:

    - **Total** de equipos encontrados

    - **Nuevos**: número de equipos nuevos detectados (aquí debe aparecer el nuevo
    detector)

    - **Elimin.**: equipos eliminados

