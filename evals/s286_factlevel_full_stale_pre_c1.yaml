- qid: cat010
  question: ¿Cómo se alimenta la sirena/avisador intrínsecamente seguro IS-mA1 en
    una zona peligrosa (ATEX) y cuáles son sus parámetros de seguridad intrínseca
    de entrada?
  answer: '# Alimentación e IS del IS-mA1 en zona peligrosa (ATEX)


    ## Clasificación ATEX y zonas de uso


    El IS-mA1 está certificado como [F1]:

    - **II 1G Ex ia IIC T4 Ga**

    - Temperatura ambiente: **-40 °C ≤ Ta ≤ +60 °C**

    - Apto para zonas **0, 1 y 2** con gases y vapores inflamables, grupos **IIA,
    IIB e IIC**, clases de temperatura **T1, T2, T3 y T4** [F1]

    - Certificado: **SIRA 05ATEX2084X** (sufijo X = condiciones especiales de uso)
    [F1]


    ---


    ## Parámetros de seguridad intrínseca de entrada (Entity Parameters)


    ### Terminales **+ / −** (alimentación principal del avisador)


    - **Ui = 28 V** [F1][F3]

    - **Ii = 93 mA** [F1][F3]

    - **Pi = 660 mW** [F1][F3]

    - **Ci = 0** [F1][F3]

    - **Li = 0** [F1][F3]


    > ⚠️ La capacitancia total conectada a los terminales +/− (cable + cualquier otra
    capacitancia) **no debe superar 83 nF** [F3][F4].


    ### Terminales **S2 y S3** respecto a terminal − (cambio de tono/etapa de alarma)


    - **Ui = 28 V** [F1][F3]

    - **Ii = 0 mA** [F1][F3]

    - **Ci = 0** [F3]


    Adicionalmente, los terminales S2 y S3 tienen parámetros de **salida** (actúan
    como fuente hacia el área segura) [F3]:

    - Uo = **16,8 V**

    - Io = **7,3 mA**

    - Po = **31 mW**


    ---


    ## Cómo alimentar el IS-mA1 desde el área segura


    ### Opción A — Barreras Zener (requieren tierra de alta integridad)


    **Alarma de una etapa:**

    - Terminales +/−: barrera Zener de canal único con parámetros de salida ≤ Ui/Ii/Pi
    del avisador [F8]

    - Si el interruptor de control está en el positivo → barrera de canal único (Fig
    4) [F8]

    - Si el interruptor está en el negativo → barrera de canal único + barrera de
    retorno de diodo (Fig 5) [F8]


    **Alarma multietapa (S2/S3):**

    - Conectar S2 a 0 V activa la 2.ª etapa; S3 a 0 V activa la 3.ª etapa [F9]

    - Usar barreras de retorno de diodo para S2 y S3 (Fig 6) [F9]

    - Si solo se necesitan dos etapas, se puede omitir la barrera de la 3.ª etapa
    [F9]


    > ⚠️ **Restricción crítica para S2/S3:** Como Ii = 0 mA, estos terminales **solo
    pueden conectarse a** [F5][F6]:

    > - Barrera de retorno de diodo (con caída de tensión < **0,9 V**)

    > - Relé intrínsecamente seguro

    > - Aislador galvánico

    > - Todos deben estar certificados por un **Organismo Notificado CE**

    > - Alternativamente, a un interruptor de accionamiento mecánico en la zona peligrosa


    ### Opción B — Aisladores galvánicos (no requieren tierra de alta integridad)


    - El IS-mA1 puede alimentarse desde cualquier aislador galvánico con parámetros
    de salida dentro de los límites de los terminales +/− y certificado **Ex ia**
    por un Organismo Notificado CE [F10]

    - Para multietapa (S2/S3): usar relés galvánicamente aislados con parámetros dentro
    de los límites de S2/S3, certificados **Ex ia** [F10]


    **Parámetros requeridos del aparato asociado (lado seguro):**


    Para la alimentación principal (+/−) [F3]:

    - Uo ≤ **28 V**

    - Io ≤ **93 mA**

    - Po ≤ **660 mW**

    - Co ≥ Ccable

    - Lo ≥ Lcable


    ---


    ## Advertencias adicionales


    - La resistencia entre la tierra IS y la tierra de protección debe ser **< 1 Ω**
    [F3]

    - La separación entre terminales S2 y S3 es **inferior a 6 mm** — precaución en
    el conexionado [F3][F4]

    - La unión entre conexiones de conducto no es automática y debe realizarse como
    parte de la instalación [F3][F4]

    - Limpiar únicamente con **paño húmedo** para evitar carga electrostática [F1]

    - La carcasa es de **plástico ABS** — verificar compatibilidad con sustancias
    agresivas del entorno [F1]


    ---


    Fuente: IS5001-F_IS-mA1_EN (Issue F, 06-08-15); manual IS MA1 (Issue H, 03-01-2020)


    ---


    También puedo ayudarte con: **selección de tono y configuración de etapas de alarma**,
    **requisitos de cableado y secciones de cable**, o **procedimiento de montaje
    e IP65 del IS-mA1**.'
