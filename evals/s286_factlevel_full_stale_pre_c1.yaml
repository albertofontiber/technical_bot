- qid: cat016
  question: En la Detnov CAD-150, ¿como se da de alta un detector nuevo en el lazo
    y como se prueba que funciona?
  answer: "# CAD-150-8: Alta de detector nuevo en lazo y prueba de funcionamiento\n\
    \n---\n\n## PARTE 1 — DAR DE ALTA UN DETECTOR NUEVO EN EL LAZO\n\nEl proceso para\
    \ incorporar un detector nuevo sigue estos pasos [F1][F5]:\n\n**Paso 1 — Verificación\
    \ previa (antes de alimentar)**\n- Comprobar que el detector está correctamente\
    \ instalado en el lazo [F5]\n- Verificar con voltímetro que no existen cortocircuitos\
    \ ni circuitos abiertos en el lazo [F5]\n- Comprobar continuidad de la línea con\
    \ tester [F5]\n\n**Paso 2 — Autobúsqueda del lazo**\n- Accede al **menú BUCLE**\
    \ [F1]\n- Realiza la **autobúsqueda** del lazo correspondiente: el sistema escaneará\
    \ y mostrará todos los elementos que detecta [F1]\n- Verifica que los elementos\
    \ encontrados coinciden con los planos de la instalación [F1]\n\n**Paso 3 — Asignar\
    \ zona al detector**\n- Accede al **menú ZONA** para crear y asignar zonas a los\
    \ elementos [F1]\n\n**Paso 4 — Configurar el elemento**\n- Accede al **menú ELEMENTOS**\
    \ [F1]\n- Desde el submenú **VER**, puedes comprobar el estado del elemento: bucle,\
    \ dirección, zona, tipo, modo y valor analógico (VA) [F4]\n- Asigna un **nombre\
    \ identificativo** (campo TEXTO) y la **zona de ubicación** al detector [F1][F4]\n\
    \n**Paso 5 — Configurar maniobras si procede**\n- Accede al **menú MANIOBRAS**\
    \ para definir las acciones que generará el nuevo detector (punto de entrada →\
    \ punto de salida) [F1]\n- Las maniobras pueden llevar retardo en segundos para\
    \ evitar falsas alarmas [F1]\n\n---\n\n## PARTE 2 — PROBAR QUE EL DETECTOR FUNCIONA\n\
    \n### Método recomendado: Modo PRUEBA de zona\n\nEste modo permite probar los\
    \ detectores **sin necesidad de rearmar la central** tras cada disparo [F2][F3].\n\
    \n**Procedimiento:**\n\n1. Accede al **menú ZONA** → submenú **PRUEBA** [F2]\n\
    2. Introduce el **rango de zonas** a poner en prueba (campo RANGO: `[000]` a `[250]`)\
    \ [F2]\n3. El sistema pregunta: **ACTIVAR SIRENAS: [SI/NO]** [F2]\n   - Si seleccionas\
    \ **SÍ**: las sirenas se activarán unos segundos tras el disparo del detector\
    \ y se silenciarán automáticamente. Los retardos de sirena quedan **anulados**\
    \ en modo prueba para agilizar el proceso [F2][F3]\n   - Si seleccionas **NO**:\
    \ la prueba se realiza sin activar sirenas [F2]\n4. Provoca la alarma en el detector\
    \ (aerosol, calor, etc.)\n5. Verifica que el detector entra en alarma\n\n> ⚠️\
    \ **Importante:** Si transcurren **20 minutos** desde la activación del modo prueba\
    \ sin que se produzca ningún disparo de alarma, el sistema **vuelve automáticamente\
    \ al estado normal**, cancelando el modo prueba [F2][F3]\n\n**Para salir del modo\
    \ prueba:** Conecta la zona desde el menú ZONA → opción **CONECTAR** [F2]\n\n\
    ### Verificación adicional del sistema [F6]\n- Verifica que al provocar una alarma\
    \ se activa el **relé de alarma** [F6]\n- Verifica que se activan las **salidas\
    \ de sirena** una vez transcurrido el tiempo de retardo programado [F6]\n\n---\n\
    \n## Códigos de acceso de fábrica [F6]\n- Nivel usuario: **1111**\n- Nivel instalador:\
    \ **2222**\n\n---\n\n**Fuentes:**\n- `55315013 Manual Centrales Analógicas CAD-150-8\
    \ Instalación ES FR GB IT` (sin revisión registrada)\n- `55315008 Manual Centrales\
    \ Analógicas CAD-150-8 Usuario ES FR GB IT` (sin revisión registrada)\n\n---\n\
    \nTambién puedo ayudarte con: **configuración de maniobras**, **desconexión/reconexión\
    \ de elementos individuales** o **mantenimiento periódico** de la CAD-150-8."
