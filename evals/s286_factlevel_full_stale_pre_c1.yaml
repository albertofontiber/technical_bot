- qid: hp001
  question: En la Detnov CAD-250, ¿cómo se entra al menú de programación avanzada?
  answer: '## Acceso al menú de Programación Avanzada — CAD-250


    El acceso al menú **AVANZADO** requiere estar previamente autenticado como administrador.
    El proceso completo es:


    ### Paso 1 — Acceder como administrador


    1. Desde la **PANTALLA DE REPOSO**, toca el icono del candado (🔒) [F2][F3].

    2. Se mostrará la **PANTALLA DE ACCESO** solicitando contraseña [F2][F3].

    3. Introduce la clave de administrador por defecto: **2222** [F2][F3].


    > ⚠️ El uso indebido del nivel de administrador puede provocar un mal funcionamiento
    de la instalación. Asegúrate de tener la autorización necesaria [F2][F3].


    ---


    ### Paso 2 — Navegar al menú AVANZADO


    Una vez dentro como administrador, la ruta de acceso es [F1][F10]:


    **AJUSTES** (Menú principal) **> AVANZADO** (Submenú)


    ---


    ### Paso 3 — Pestañas disponibles en AVANZADO


    Dentro del submenú **AVANZADO** dispones de 3 pestañas [F1]:


    - **SISTEMA:** configuración del número de cabinas (PANELES: 1 a 4), número de
    lazos y si hay cabina con LEDs de zona (LEDes: 0 ó 1). Para validar cambios pulsa
    **Guardar y Reiniciar** [F1].

    - **OTROS:** interruptores para facilitar tareas de puesta en marcha y mantenimiento
    (tiempo de inactividad, salto a scroll si incidentes, saltar a último incidente
    prioritario si timeout, entre otros) [F1][F6].

    - **REINICIAR:** devuelve los valores de configuración del panel a valores por
    defecto. No afecta a configuración de entidades, lazos, maniobras, grupos, módulos
    virtuales, modos especiales, filtros de red ni registros de eventos [F6].


    > ⚠️ Por razones de seguridad y cumplimiento normativo, por defecto todos los
    interruptores de inactividad, timeout y scroll deben estar activados (en verde)
    [F6][F7].


    ---


    **Nota:** El menú **AVANZADO** es accesible desde el **Nivel 2 de configuración**
    (código de administrador). Desde el Nivel 1 de usuario no está disponible [F4][F5].


    ---


    Fuente: CAD-250 Manual de Configuración MC-380-es-2026-c (rev. c, 2026-04-23);
    Manual de Instalación CAD-250 MI_372_es_2024-e (sin revisión registrada); CAD-250
    Manual de Software de Configuración MS-416-es-2026-b (rev. b)


    ---


    También puedo ayudarte con: **configuración del número de lazos y cabinas en pestaña
    SISTEMA**, **gestión de usuarios y niveles de acceso** o **opciones de la pestaña
    OTROS para puesta en marcha**.'
