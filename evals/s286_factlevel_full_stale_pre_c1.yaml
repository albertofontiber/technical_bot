- qid: cat019
  question: '¿Como se configura una maniobra (causa-efecto) completa en la Detnov
    CAD-250: como se crea, como se definen las entradas/eventos que la disparan y
    como se asignan las salidas?'
  answer: "# Configuración de una maniobra completa en la CAD-250\n\n> ⚠️ La programación\
    \ de maniobras es una de las funciones más críticas de la configuración del sistema.\
    \ Requiere conocimiento específico del sistema instalado, del plan de protección\
    \ y del producto [F5].\n\n---\n\n## CONCEPTO PREVIO\n\nUna maniobra es un conjunto\
    \ de **Entradas (Eventos) → Lógica (Coincidencias) → Salidas (Acciones)** [F1].\
    \ La configuración gestiona **eventos** (cambios de estado), no estados estáticos\
    \ [F3]. El sistema soporta hasta **100.000 entradas y salidas** configuradas en\
    \ distintas maniobras [F3][F10].\n\n---\n\n## PASO 1 — Acceder al menú y crear\
    \ la maniobra\n\n1. Navega: **MENÚ > MANIOBRAS** [F1]\n2. Pulsa **+AÑADIR** en\
    \ la barra de navegación inferior [F1][F2]\n3. Se abre la pantalla de edición\
    \ de **Maniobra 000X** [F2]\n\n---\n\n## PASO 2 — Definir la lógica de coincidencias\n\
    \nEn el campo **COINCIDENCIAS** indica cuántos eventos deben cumplirse simultáneamente\
    \ [F2]:\n\n- **Coincidencias = 1** → Comportamiento **OR**: basta con que cualquiera\
    \ de los eventos sea verdadero [F2][F6]\n- **Coincidencias = 2** (con 2 eventos)\
    \ → Comportamiento **AND**: deben cumplirse los dos [F2][F6]\n- **Coincidencias\
    \ = N de M** → Deben cumplirse N eventos cualesquiera de los M configurados [F2]\n\
    \n---\n\n## PASO 3 — Añadir Eventos (Entradas)\n\n1. Pulsa **AÑADIR** en el margen\
    \ inferior → selecciona **EVENTO** [F3]\n2. Elige el tipo de evento [F3]:\n  \
    \ - **ENTIDAD**: cualquier elemento de la jerarquía del sistema\n   - **CONDICIÓN\
    \ TEMPORAL**: periodo de tiempo durante el que la ecuación de entrada es verdadera\n\
    \n### Si eliges ENTIDAD:\n\nSelecciona el **origen** [F5]:\n- **Local** (central\
    \ actual) o **Red** (cualquier central del sistema en red) [F3][F5]\n- Nivel de\
    \ entidad: Instalación, Panel, Lazo, Área, Zona, Dispositivo, Grupo o Módulo Virtual\
    \ [F3][F5]\n\nDefine las **condiciones del evento** [F5]:\n- **Condición:** Alarma,\
    \ Avería o Técnico\n- **Tipo:** Todos, Pulsador, Detector o Entradas\n- **Estado\
    \ lógico:** Normal o **Negado** (si se selecciona Negado con condición Alarma,\
    \ la condición es válida cuando NO hay alarma)\n- **Repeticiones:** valor entero\
    \ hasta **9999** — el evento debe repetirse ese número de veces en la entidad\
    \ para que la entrada sea válida [F3][F5]\n\n> **Nota:** Desde la versión **1.1.1**\
    \ es posible seleccionar un elemento de salida como condición de entrada. En ese\
    \ caso, el cambio a condición de avería hace verdadera la entrada. Para ello,\
    \ desmarca la casilla **\"Sólo dispositivos de entrada\"** [F9].\n\nPuedes añadir\
    \ tantos eventos como necesites. Edita cada uno haciendo **2 clics** sobre él\
    \ o seleccionándolo y pulsando **EDITAR** [F9].\n\n---\n\n## PASO 4 — Añadir Acciones\
    \ (Salidas)\n\n1. Pulsa **AÑADIR** en el margen inferior → selecciona **ACCIÓN**\
    \ [F3][F4]\n2. Configura los campos [F4][F5][F7]:\n\n**RETRASO:**\n- Tiempo configurable\
    \ entre **0 y 600 segundos** antes de iniciar la acción [F4][F5]\n- Se inicia\
    \ a partir del momento en que la condición de entrada es verdadera [F5]\n\n**ENTIDAD\
    \ (destino):**\n- Panel, Lazo, Área, Zona, Dispositivo, Grupo o Módulo Virtual\
    \ [F4][F5]\n- ⚠️ El programa **no permite mezclar acciones sobre entidades de\
    \ paneles diferentes** [F10]\n\n**ACCIÓN (tipo de acción):** [F7]\n- **Activar**\
    \ las salidas\n- **Desactivar** las salidas\n- **Habilitar** la entidad\n- **Deshabilitar**\
    \ la entidad\n- **Test** — pone en modo test la entidad\n- **Reiniciar** la entidad\n\
    - **Pulso** — activa las salidas con anchura de pulso configurable entre **0 y\
    \ 600 segundos** (10 s por defecto) [F7]\n- **Configuración** — permite la cancelación\
    \ de retardos\n\n**TIPO DE ELEMENTO** (qué salidas se activan dentro de la entidad)\
    \ [F7]:\n- **Todos** — todas las salidas de la entidad\n- **Sirenas** — únicamente\
    \ las sirenas\n- **Relés** — únicamente los relés\n- **Sirena discontinua** —\
    \ sirenas en modo discontinuo\n- **Sirena PCB1** — sirena 1 de la central\n- **Sirena\
    \ PCB2** — sirena 2 de la central\n\n### Compatibilidad Acción × Tipo × Entidad\
    \ [F8]:\n\nLas combinaciones válidas son (extracto de la tabla del manual):\n\n\
    - **ACTIVAR / Todos** → Panel, Lazo, Área, Zona, Disp.OUT, Grupo, VM\n- **ACTIVAR\
    \ / Sirenas** → Panel, Lazo, Área, Zona, Grupo\n- **ACTIVAR / Relés** → Panel,\
    \ Lazo, Área, Zona, Grupo\n- **ACTIVAR / Sirenas discontinua** → Panel, Lazo,\
    \ Área, Zona, Grupo\n- **ACTIVAR / Sirena 1 y Sirena 2** → solo Panel\n- **DESACTIVAR\
    \ / Todos** → Panel, Lazo, Área, Zona, Disp.OUT, Grupo, VM\n- **DESACTIVAR / Sirenas**\
    \ → Panel, Lazo, Área, Zona, Grupo\n- **DESACTIVAR / Relés** → Panel, Lazo, Área,\
    \ Zona, Grupo\n- **PULSO** → Panel, Lazo, Área, Zona, Disp.OUT, Grupo, VM\n- **HABILITAR\
    \ / DESHABILITAR** → Panel, Área, Zona, Disp.OUT, Disp.IN, Grupo, VM\n- **TEST**\
    \ → Panel, Área, Zona\n- **PROGRAMACIÓN / Cancelar retardo** → solo Panel\n\n\
    ---\n\n## PASO 5 — Guardar\n\n- Pulsa **GUARDAR** para actualizar la base de datos\
    \ [F7]\n- Pulsa **CANCELAR** para deshacer los cambios [F7]\n- La central devuelve\
    \ al listado de maniobras donde puedes verificar el resumen de eventos y acciones\
    \ configurados [F7][F10]\n\n---\n\n## ELEMENTOS ADICIONALES DEL MENÚ MANIOBRAS\
    \ [F1]\n\n- **GRUPOS**: asociaciones de elementos (áreas, zonas, dispositivos)\
    \ para simplificar reglas\n- **MÓDULOS VIRTUALES**: permiten crear bucles interdependientes\
    \ — un conjunto de entradas determina el estado del módulo virtual, que a su vez\
    \ puede actuar como entrada de otra maniobra\n- **ESTADO VM**: visualización y\
    \ activación de módulos virtuales, o uso como botones de acceso rápido desde la\
    \ pantalla principal\n\n---\n\n**Fuentes:**\n- CAD-250 Manual de Configuración\
    \ MC-380-es-2026-c (rev. c, 2026-04-23)\n- CAD-250 Manual Software de Configuración\
    \ MS-416-es-2026-b (rev. b)\n\n---\n\nTambién puedo ayudarte con: **configuración\
    \ de Grupos**, **creación de Módulos Virtuales** o **ejemplos prácticos de maniobras**\
    \ (p. ej. alarma en zona → activar sirenas con retardo)."
