- qid: cat008
  question: ¿Cómo se cablea el módulo de entrada M710 / MI-DMMI en el lazo, y qué
    resistencias necesita (fin de línea y modo 3 estados)?
  answer: "# Conexionado del módulo M710 / MI-DMMI en el lazo\n\n## Terminales de\
    \ lazo (conexión al SCI)\n\nLos terminales de lazo son los mismos en ambos modelos\
    \ [F4][F6]:\n\n- **Terminal 1** → Salida del lazo –\n- **Terminal 2** → Salida\
    \ del lazo + *(con aislador interno activo)*\n- **Terminal 3** → Entrada del lazo\
    \ –\n- **Terminal 4** → Entrada del lazo +\n- **Terminal 5** → Salida del lazo\
    \ + *(alternativa sin aislador, ver nota abajo)*\n\n> **Nota sobre el aislador\
    \ interno:** Si **no** se necesita aislamiento de cortocircuitos, conecta la salida\
    \ + del lazo al **terminal 5** en lugar del terminal 2. El terminal 5 está conectado\
    \ internamente con el terminal 4 [F4][F6].\n\n---\n\n## Modo 2 estados (conexionado\
    \ estándar)\n\n- Un **cortocircuito** en la entrada se señaliza como **alarma**\
    \ [F1].\n- Resistencia de fin de línea (RFL): **47 kΩ** conectada entre los terminales\
    \ de entrada (terminales 6-7 en el MI-DMMI) [F1].\n- El contacto del dispositivo\
    \ supervisado se conecta en paralelo con la RFL de 47 kΩ.\n\n---\n\n## Modo 3\
    \ estados (supervisión de cortocircuito como avería)\n\n- Requiere que la **central\
    \ sea compatible** con este modo [F4][F6].\n- Se debe conectar una resistencia\
    \ de **18 kΩ en serie** con cada contacto/conmutador del dispositivo que se desee\
    \ supervisar [F1][F4][F6].\n- Referencia de la resistencia para el M710: **M200E-EOL-R18**\
    \ [F4][F5].\n- Con este modo, un cortocircuito en el circuito de entrada se indica\
    \ como **avería** en lugar de alarma [F4][F6].\n- La RFL de **47 kΩ** sigue siendo\
    \ necesaria en el circuito [F1].\n\n---\n\n## Resumen de resistencias\n\n- **Fin\
    \ de línea (RFL):** 47 kΩ [F1][F4]\n- **Serie para modo 3 estados:** 18 kΩ por\
    \ cada contacto supervisado [F1][F4][F6]\n  - Referencia M700: **M200E-EOL-R18**\
    \ [F4]\n\n---\n\n> ⚠️ **Importante:** Los terminales 8 y 9 del M710/MI-DMMI **no\
    \ tienen conexión** — son exclusivos del modelo de doble entrada (M720/MI-DMM2I)\
    \ [F4][F6].\n\n---\n\n**Fuentes:**\n- Conexionado-del-modulo-M710-MI-DMMI (sin\
    \ revisión registrada)\n- I56-2005-002 M710 M720 M721 M701 (sin revisión registrada)\n\
    - I56-2006-004 MI-DMMI_DMM2I_D2ICMO (sin revisión registrada)\n- I56-4406-001\
    \ MI-DMMIE MI-DMM2IE MI-D2ICMOE (sin revisión registrada)\n\n---\n\nTambién puedo\
    \ ayudarte con: **programación del M710/MI-DMMI en la central ID3000**, **conexionado\
    \ del modelo de doble entrada M720/MI-DMM2I** o **configuración del modo 3 estados\
    \ en la central**."
