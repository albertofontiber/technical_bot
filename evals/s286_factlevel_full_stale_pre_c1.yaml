- qid: cat018
  question: ¿Como se programa una ecuacion causa-efecto (CBE) en la Notifier AM-8200
    para que un evento active una salida?
  answer: "# Programación de ecuación CBE en AM-8200 para activar una salida\n\n##\
    \ Concepto previo\n\nLas **CBE (Control By Events)** son ecuaciones que activan\
    \ un comando en función de un evento [F1]. La lógica se basa en **grupos software\
    \ (G)** como operandos, y los módulos de salida se activan cuando se cumple la\
    \ condición de la ecuación [F8].\n\n---\n\n## Paso a paso: programar la CBE en\
    \ el módulo de salida\n\n### 1. Acceder al punto de salida\n\nNavega a: **MENU\
    \ PROGRAMMAZIONE → Punti → Módulos** [F6]\n\nSelecciona el módulo de salida que\
    \ quieres activar.\n\n### 2. Ir a la pestaña \"Programación\"\n\nEn la pestaña\
    \ **Programmazione** encontrarás el campo **CBE** [F6].\n\n- Selecciona el campo\
    \ **CBE** con las teclas flecha **▲▼**\n- Pulsa la tecla de confirmación **☑**\
    \ para editarlo [F1]\n\n### 3. Introducir la ecuación CBE\n\nUsa el teclado alfanumérico\
    \ para escribir la ecuación. La **longitud máxima es de 64 caracteres** [F1].\
    \ Pulsa **Enter** para confirmar [F1].\n\nLos operadores disponibles son [F8]:\n\
    \n- **OR (Gx Gy Gz)** → Se activa si **al menos uno** de los grupos está en alarma\n\
    \  - Ejemplo: `OR (G9 G15 G23)` — también válido sin el OR: `(G9 G15 G23)` [F8]\n\
    \n- **AND (Gx Gy Gz)** → Se activa solo si **todos** los grupos están en alarma\n\
    \  - Ejemplo: `AND (G9 G15 G23)` [F8]\n\n- **NOT (Gx)** → La salida está activa\
    \ hasta que el grupo **NO** esté en alarma\n  - Ejemplo: `NOT (G23)` [F8]\n\n\
    - **XGRP (GXXX)** → Se activa si **al menos dos** elementos del grupo indicado\
    \ están activos [F9]\n  - Formato: `XGRP (G23)` — **solo admite un grupo**, no\
    \ varios [F9]\n\n---\n\n## Paso a paso: asignar el sensor/entrada al grupo\n\n\
    Para que la ecuación funcione, el sensor o módulo de entrada debe tener programada\
    \ su propia CBE con el grupo correspondiente.\n\n1. Navega al sensor: **MENU PROGRAMMAZIONE\
    \ → Punti → Sensori** [F1]\n2. Ve a la pestaña **Programmazione** [F2]\n3. Selecciona\
    \ el campo **CBE** con **▲▼** y pulsa **☑** [F1]\n4. Introduce el grupo al que\
    \ pertenece ese sensor, por ejemplo: `G9` [F1]\n\n---\n\n## Reglas críticas a\
    \ respetar\n\n- **Para grupos directos**: no se puede escribir una CBE donde los\
    \ operandos tengan índice **menor** que el grupo al que se asocia la CBE [F8]\n\
    \  - ❌ No permitida: `G33 = (G23 G24)`\n  - ✅ Permitida: `G21 = (G23 G24)` [F8]\n\
    \n- **Para grupos inversos**: no se puede escribir una CBE donde los operandos\
    \ tengan índice **mayor** que el grupo al que se asocia la CBE [F8]\n  - ❌ No\
    \ permitida: `G305 = (G306 G307)`\n  - ✅ Permitida: `G307 = (G305 G306)` [F8]\n\
    \n- **Para módulos de salida con TIPO ID de señalización general**: la central\
    \ **no permite** programar una ecuación CBE [F8]\n\n- **XGRP solo admite un grupo**\
    \ en el paréntesis [F9]:\n  - ❌ No permitida: `XGRP (G23 G24)`\n\n---\n\n## Ejemplo\
    \ completo\n\nSensor en CPU1, Línea1, Sensor2 → asignado al grupo G9:\n```\nCBE\
    \ del sensor: G9\n```\n\nMódulo de salida → se activa si G9 o G15 están en alarma:\n\
    ```\nCBE del módulo: OR (G9 G15)\n```\n\nPara casos donde la memoria no permite\
    \ un OR de muchos grupos, se pueden usar **grupos inversos intermedios** [F10]:\n\
    ```\nG301 = OR (G1 G2 G3 G4 G5 G6 G7 G8)\nG302 = OR (G9 G10 G11 G12 G13 G14 G15\
    \ G16)\nMódulo salida CBE = OR (G301 G302)\n```\n\n---\n\n> ⚠️ **Nota**: Para\
    \ la sintaxis completa y todos los operadores disponibles (TIM, DIS, PRE, FLT,\
    \ TAC, TONE, SDEL...), consulta el **Apéndice «A» Control By Event** del manual\
    \ completo [F1].\n\n**Fuente:** AM-8200 Manual de programación — Doc. M-162.1-AM8200-ESP\
    \ Rev A.3 (Honeywell Life Safety Iberia)\n\n---\n\nTambién puedo ayudarte con:\
    \ **programación de grupos software (G)**, **operadores TIM/DIS/PRE** del apéndice\
    \ CBE, o **configuración de módulos de salida** en la AM-8200."
