- qid: cat013
  question: Tengo una central Detnov CAD-150 y me ha sobrado de otra instalacion un
    detector optico Notifier SDX-751; ¿es compatible / puedo montarlo en su lazo?
  answer: 'La pregunta es **cross-brand** (Detnov CAD-150 + Notifier SDX-751), por
    lo que debo ser muy preciso sobre lo que los fragmentos sí y no dicen.


    ---


    ## Lo que dicen los fragmentos sobre cada equipo por separado


    ### Sobre la CAD-150 (Detnov)

    Los fragmentos recuperados del manual de la CAD-150-8 [F6][F8][F9][F10] describen
    la central (lazos, panel de control, menús), pero **no incluyen ninguna lista
    de detectores compatibles con su lazo**. El manual no especifica qué sensores
    o protocolos de lazo admite la CAD-150.


    ### Sobre el SDX-751 (Notifier)

    El SDX-751 aparece en los fragmentos como detector analógico fotoeléctrico de
    bajo perfil [F3], compatible con:

    - La central **AFP-200** de Notifier, usando base **BX-501** [F1][F3]

    - La central **ID-200** de Notifier, usando base **B501** [F2][F4]

    - La central **ID3000** de Notifier, donde aparece listado como equipo de lazo
    compatible [F5]


    En todos los casos, el SDX-751 opera en el **lazo de comunicaciones analógico
    de Notifier**.


    ---


    ## Conclusión


    **No tengo documentación sobre interoperabilidad entre la CAD-150 (Detnov) y el
    SDX-751 (Notifier).** Los fragmentos disponibles de la CAD-150 no especifican
    qué detectores son compatibles con su lazo, y el SDX-751 solo está documentado
    para centrales Notifier (AFP-200, ID-200, ID3000).


    > ⚠️ La compatibilidad entre equipos de distintos fabricantes **debe verificarse
    directamente con Detnov y/o Notifier** antes de cualquier instalación. Mezclar
    dispositivos de lazo de fabricantes distintos sin confirmación del fabricante
    puede provocar fallos de comunicación o no detección, con consecuencias graves
    en la seguridad.


    ---


    Fuentes:

    - Manual CAD-150-8 (`55315008-Manual-Centrales-Analogicas-CAD-150-8-Usuario-ES-FR-GB-IT`,
    sin revisión registrada)

    - AFP-200 manual (`MNDT120`, sin revisión registrada)

    - ID-200 manual (`MNDT150`, sin revisión registrada)

    - ID3000 manual de instalación (`MIDT190`, sin revisión registrada)'
