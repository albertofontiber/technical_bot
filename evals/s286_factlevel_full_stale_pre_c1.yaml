- qid: cat021
  question: Necesito un detector de llama SharpEye «40/40» (Spectrex / Notifier) para
    una instalación; ¿qué modelo pido?
  answer: 'La familia SharpEye "40/40" tiene **varias variantes con tecnología de
    detección distinta y no son intercambiables**. Necesito que me indiques el tipo
    de riesgo/combustible y el entorno para orientarte al modelo correcto.


    Estas son las variantes presentes en la documentación:


    - **S40/40I** — Detector de triple espectro infrarrojo (**IR3**). Para hidrocarburos
    en general [F1].

    - **S40/40L / LB / L4 / L4B** — Detector **UV/IR** combinado. Variantes según
    longitud de onda IR (2,8 µm o 4,5 µm) y con/sin BIT incorporado [F2][F9].

    - **S40/40R** — Detector de **infrarrojo simple (Single IR)** [F3][F6].

    - **S40/40M** — Detector de **múltiple infrarrojo**, específico para **llamas
    de hidrógeno e hidrocarburo** [F4].

    - **S40/40U / UB** — Detector **UV** (ultravioleta), con/sin BIT incorporado [F5][F8].


    Adicionalmente, los documentos de referencia de la serie mencionan también los
    modelos **40/40UFI** (Ultra Fast IR3) y **40/40UFL** (Ultra Fast UV/IR) [F7],
    aunque no dispongo de sus manuales completos en esta base.


    ---


    Para orientarte al modelo correcto, dime:

    1. **¿Qué tipo de combustible/riesgo** hay en la instalación? (hidrocarburos,
    hidrógeno, alcoholes, otro)

    2. **¿Necesitas BIT** (prueba incorporada automática)?

    3. **¿El entorno requiere ATEX/IECEx** u otra homologación específica?


    Fuentes: MNDT721_40-40I; MNDT722_40-40L; MNDT724_40-40R; MNDT725_40-40M; MNDT723_40-40U;
