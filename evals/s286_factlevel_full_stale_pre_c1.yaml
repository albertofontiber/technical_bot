- qid: cat007
  question: En el detector por aspiración FAAST LT-200, ¿qué salidas de relé y de
    sirena tiene y con qué contactos, cómo se comporta el relé de avería ante un fallo
    o un corte de alimentación, qué resistencia de fin de línea llevan las salidas
    de sirena y cuál es la especificación eléctrica de los contactos de relé?
  answer: '# FAAST LT-200 — Salidas de relé y sirena: resumen técnico completo


    ---


    ## 1. Relés disponibles y su comportamiento


    El equipo dispone de los siguientes relés [F2][F6]:


    **Relé de ALARMA 1 y 2**

    - Se activa cuando se cumple la condición de alarma en el canal correspondiente
    [F2]

    - Estado de alarma **enclavado por defecto** — se necesita **rearme manual** para
    desactivar el LED y el relé [F2]

    - Condición predeterminada = Nivel 1 [F2]


    **Relé de PREALARMA 1 y 2**

    - Se activa cuando se cumple la condición de prealarma en el canal [F2]

    - Condición predeterminada = Nivel 1 [F2]

    - Nota: cuando PREALARMA = ALARMA = Nivel 1, la prealarma se activará al **70
    % del Nivel 1** [F2]


    **Relé de AVERÍA 1 y 2**

    - Se activa ante condición de avería en canal 1 o 2, o avería común [F2]

    - También se activa en **modo de servicio** y cuando se **desconecta la alimentación**
    de la unidad [F2]

    - El estado de avería **no está enclavado** (predeterminado) [F2]


    **Relé de SIRENA 1 y 2**

    - Se activa cuando el canal está en ALARMA o PREALARMA [F2]

    - Sirena 1 → Canal 1 / Sirena 2 → Canal 2 [F2]

    - Estado predeterminado = establecido en ALARMA [F2]


    ---


    ## 2. Contactos de cada relé (terminales de cableado)


    Cada relé dispone de **tres contactos: NC (normalmente cerrado), C (común) y NA
    (normalmente abierto)** [F6]:


    - **Relé de alarma CH1** → terminales 5 (NC), 6 (C), 7 (NA) [F6]

    - **Relé de alarma CH2** → terminales 8 (NC), 9 (C), 10 (NA) [F6]

    - **Relé de avería CH1** → terminales 11 (NC), 12 (C), 13 (NA) [F6]

    - **Relé de avería CH2 (AUX.)** → terminales 14 (NC), 15 (C), 16 (NA) [F6]

    - **Relé de prealarma CH1** → terminales 23 (NC), 24 (C), 25 (NA) [F6]

    - **Relé de prealarma CH2** → terminales 26 (NC), 27 (C), 28 (NA) [F6]


    ---


    ## 3. Comportamiento del relé de avería ante fallo o corte de alimentación


    - Ante cualquier **condición de avería** (canal 1, canal 2 o avería común): el
    relé se activa [F2]

    - Ante **corte de alimentación** de la unidad: el relé de avería también se activa
    [F2]

    - El estado de avería **no está enclavado** — se desactiva automáticamente al
    resolverse la condición, sin necesidad de rearme manual [F2]


    ---


    ## 4. Resistencia de fin de línea en salidas de sirena


    - **Salida sirena 1** (terminales 17 − y 18 +): resistencia de fin de línea de
    **47 kΩ** [F6]

    - **Salida sirena 2** (terminales 19 − y 20 +): resistencia de fin de línea de
    **47 kΩ** [F6]


    ---


    ## 5. Especificación eléctrica de los contactos de relé


    - Corriente máxima: **2 A** con carga resistiva a **30 V CC** [F3][F5]

    - Corriente máxima: **0,5 A** con carga resistiva a **30 V CA** [F3][F5]

    - Vida útil mínima: **10⁵ operaciones** [F3]


    > ⚠️ **Advertencia — cargas inductivas:** Las cargas inductivas pueden provocar
    sobretensiones de desconexión que dañen los contactos. Se recomienda instalar
    un supresor de tensión transitoria (p. ej. **1N6284CA**) en paralelo con la carga.
    Para aplicaciones CC sin supervisión, puede usarse un diodo con tensión de ruptura
    inversa superior a diez veces la tensión del circuito [F9].


    ---


    **Fuentes:**

    - I56-6574-005_ES — HS Stand Alone FAAST LT-200 QIG (sin revisión registrada)

    - I56-6577-006_ES — FAAST Notifier LT-200 QIG (sin revisión registrada)

    - I56-6577-006_EN — Notifier FAAST LT-200 QIG (sin revisión registrada)

    - I56-3947-202 — FAAST LT MULTI (sin revisión registrada)


    ---


    También puedo ayudarte con: **conexionado de la entrada configurable (rearme)**,
    **especificaciones de cableado y secciones admitidas** o **procedimiento de puesta
    en marcha del FAAST LT-200**.'
