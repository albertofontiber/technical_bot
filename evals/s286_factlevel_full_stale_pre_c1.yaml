- qid: hp011
  question: En la Morley RP1r, después de descargar la extinción el sistema no vuelve
    a estado normal tras resetear. ¿Qué comprobar?
  answer: '# RP1r — Sistema no vuelve a estado normal tras resetear después de extinción


    Tras una descarga de extinción, hay varias causas posibles por las que el rearme
    no devuelve la central al estado normal. Comprueba en este orden:


    ---


    ## 1. Verificar que el rearme se ejecuta correctamente


    Para rearmar la central es obligatorio estar en **nivel de acceso 2** (giro de
    llave o habilitación de teclado) y pulsar la tecla **Rearme** [F10]. Sin nivel
    2 activo, la tecla no tiene efecto.


    ---


    ## 2. Comprobar si está activa la inhibición de rearme (parámetro rI / SW1-6)


    Según la normativa **EN12094:1/2003 Punto 4.12.2**, la central puede tener programado
    un periodo de inhibición del rearme de **0 a 30 minutos** desde que se activó
    el estado ACTIVADO [F3].


    - Esta función se habilita con el **micro interruptor SW1-6 en posición ON** [F3][F10].

    - Si está habilitada, hasta que no transcurra el tiempo programado en el parámetro
    **rI**, no será posible rearmar [F3].

    - **Excepción:** si la central está en modo *paro/espera*, sí se puede rearmar
    aunque no haya transcurrido el tiempo [F3].


    → Comprueba la posición del SW1-6 y el valor del parámetro rI en programación.


    ---


    ## 3. Verificar si hay avería de "Fallo de Sistema" activa


    Si tras el rearme el led **Fallo Sistema** permanece encendido, puede deberse
    a que uno de los dos microprocesadores tardó en inicializar o detectó tensiones
    fuera de rango al arrancar [F5].


    - Esta avería impide que la central funcione correctamente [F5].

    - **Acción:** realizar un nuevo rearme. Si la avería desaparece tras el rearme,
    el sistema es funcional [F5].

    - Si persiste, puede indicar una perturbación externa o un problema de hardware.


    ---


    ## 4. Comprobar averías enclavadas en circuitos de supervisión


    Todas las averías son **enclavadas por defecto** y requieren rearme manual para
    su restablecimiento [F4]. Sin embargo, si la condición de avería **sigue presente
    físicamente**, el rearme no eliminará la indicación. Comprueba:


    - **Presión baja** (LOW PRESS SWITCH) → led "Avería presión baja" intermitente
    [F4]

    - **Señal de flujo** (FLOW PRESS SWITCH) → led "Avería presión flujo" intermitente
    [F4]

    - **Puerta abierta** (DOOR OPEN SWITCH) → led "C''to. supervisión puerta abierta"
    intermitente [F4]


    → Si alguno de estos leds está intermitente, la condición física de avería sigue
    activa. Resuélvela primero y luego rearma.


    > ⚠️ **Nota:** Para los circuitos anteriores (excepto el circuito de paro), es
    posible configurar rearme automático cuando desaparece la condición de avería,
    mediante las **funciones especiales** (sección 5.4 del manual RP1r-Supra) [F4].


    ---


    ## 5. Estado esperado tras un rearme correcto


    Después de una extinción y un rearme exitoso, el led **"Extinción Realizada"**
    debe apagarse y la central debe volver al estado de vigilancia normal [F1][F2].
    Si el led permanece fijo tras el rearme, hay alguna condición no resuelta de las
    anteriores.


    ---


    **Fuentes:**

    - MNDT102 — Manual de usuario RP1r (sin revisión registrada) [F1, F3, F10]

    - HLSI-BT-001 — Boletín técnico HLSI, 04/11/2011 [F5, F6]

    - HLSI-MN-103_RP1r-Supra_lr (rev. v.07, 2018-05-01) [F2, F4]


    ---


    También puedo ayudarte con: **configuración del parámetro rI (inhibición de rearme)**,
    **interpretación de leds de avería tras extinción** o **procedimiento de prueba
    funcional del circuito de solenoide** en la RP1r.'
