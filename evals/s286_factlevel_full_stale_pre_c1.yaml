- qid: hp007
  question: ¿Cómo se realiza el test anual de un detector VESDA-E VEP según el manual
    del fabricante?
  answer: '# Test anual del detector VESDA-E VEP según el manual del fabricante


    ## Tareas de mantenimiento anual


    Según la **Tabla 7-1** del manual [F1], las comprobaciones que corresponden a
    frecuencia **una vez al año** son:


    - **Realizar una prueba de humos** para comprobar la integridad de la red de tubería

    - **Comprobar el flujo** de la red de tubería

    - **Limpiar los puntos de muestreo**

    - **Limpiar con agua la red de tubería**


    ---


    ## Procedimiento previo obligatorio antes de cualquier prueba


    Antes de iniciar el mantenimiento, el manual indica [F1]:


    1. **Informar a la autoridad supervisora adecuada**

    2. **Aislar los dispositivos existentes** que dependan del detector antes de ponerlo
    en funcionamiento

    3. ⚠️ **Precaución:** Mientras el detector está deshabilitado o en espera, **no
    emitirá advertencias de fuego**


    ---


    ## Modo en espera durante el mantenimiento de tubería


    Cuando se realiza mantenimiento de la red de tubería o los puntos de muestreo,
    el manual recomienda establecer el detector en **modo en espera** [F8]:


    - En **Xtralis VSC**: selecciona *"Go to Standby"* en el menú *"Device"*

    - El LED desactivado parpadeará y se desactivará el aspirador

    - La detección de fallos **sigue activa** (solo se detiene la detección de alarmas)

    - Para volver a activar: selecciona *"End Standby"* en el menú *"Device"* [F8]


    ---


    ## Prueba de humos anual


    La prueba de humos consiste en [F2]:


    1. Introducir una muestra de humo en el **orificio de muestreo más alejado**

    2. Medir el **tiempo de transporte** hasta que el humo llega al detector

    3. Registrar los resultados y **compararlos con pruebas anteriores** para detectar
    variaciones del sistema


    > El manual remite a la **VESDA-E Commissioning Guide** para los detalles completos
    del procedimiento de prueba de humos [F2].


    ---


    ## Herramientas de prueba disponibles vía Xtralis VSC


    El software **Xtralis VSC** permite ejecutar los siguientes comandos de prueba
    relevantes [F9]:


    - **Start Alarm Test**: simula nivel de humo de escala completa, activando condiciones
    de Alerta, Acción, Fuego 1 y Fuego 2

    - **Start Air Flow Fault Test**: comprueba el sistema de detección de circulación
    de aire apagando el aspirador

    - **Start Relay Test**: activa y desactiva los relés disponibles para verificar
    su funcionamiento

    - **Start Major Fault Test** / **Start Minor Fault Test**: genera fallos para
    verificar la señalización al panel


    ---


    ## Notas importantes del manual [F1]


    - La frecuencia puede variar según **códigos y normas locales** y el entorno de
    instalación

    - El mantenimiento puede realizarlo el **instalador original**, un **distribuidor
    autorizado** o el **contratista de servicio**

    - Durante las pruebas de humo, seguir los **procedimientos del sitio** para evitar
    falsas alarmas


    ---


    **Fuente:** 33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores (sin revisión
    registrada); 33976_13_VESDA-E_VEP-A00-P_Product_Guide_A4_Spanish_lores (sin revisión
    registrada)


    ---


    También puedo ayudarte con: **procedimiento de limpieza de puntos de muestreo**,
    **comprobación del flujo de tubería** o **configuración de relés en Xtralis VSC**
    para el VEP.'
