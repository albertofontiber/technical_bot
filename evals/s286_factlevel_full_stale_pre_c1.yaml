per_gold:
- qid: cat001
  question: En la Notifier PEARL, ¿cuántos equipos admite un lazo SLC y qué límites
    de cableado hay (aisladores), y cómo se dan de alta y editan esos equipos desde
    la central?
  answer: "# Notifier PEARL — Capacidad de lazo SLC, aisladores y alta/edición de\
    \ equipos\n\n---\n\n## 1. Capacidad máxima de equipos por lazo\n\n**Protocolo\
    \ Opal:**\n- Hasta **159 sensores + 159 módulos** por lazo [F2]\n\n**Protocolo\
    \ CLIP:**\n- Hasta **99 sensores + 99 módulos** por lazo [F2]\n\n**Protocolo mixto\
    \ Opal + CLIP:**\n- El límite de equipos CLIP en lazo mixto es de **40**; si se\
    \ supera, la autoconfiguración continúa pero señala fallos [F3]\n\n**Límite global\
    \ del sistema (ambos lazos):**\n- Máximo **512 sensores y/o pulsadores manuales**\
    \ en total entre los dos lazos analógicos, incluyendo detectores y pulsadores\
    \ de zona convencionales conectados [F1]\n- Este límite aplica para cumplir **EN54-2:\
    \ 13-7** [F1]\n\n**Carga máxima por lazo:** **0,75 A** [F2]\n\n---\n\n## 2. Requisitos\
    \ de aisladores (EN54-2: 12.5.2)\n\nLa norma exige un máximo de **32 equipos entre\
    \ aisladores** [F1]. Para la Pearl, los límites concretos son:\n\n**Equipos sin\
    \ aisladores internos** (incluidos CLIP y algunos Opal):\n- No más de **20 equipos\
    \ entre aisladores** [F1]\n\n**Equipos con aisladores internos FET** (con base\
    \ B501 AP):\n- No más de **20 equipos entre aisladores** (aisladores FET) [F9]\n\
    - Con aisladores no FET: hasta **25 equipos entre aisladores** [F9]\n\n> ⚠️ **Nota\
    \ importante sobre bases:** Los equipos con aisladores internos deben usarse con\
    \ bases **B501 AP** (con conectores de cable de lazo de extremo positivo adicionales).\
    \ Si se usan bases sin estos conectores, el aislador interno queda inutilizado\
    \ [F1].\n\n**Para el arranque del lazo:** La carga entre aisladores no debe superar\
    \ **20 SU** para garantizar que los aisladores se cierren al aplicar alimentación\
    \ [F6].\n\n**Cargas SU de equipos CLIP relevantes:**\n- Detector por rayo LPB-700:\
    \ **6 SU** [F6]\n- Sirenas de lazo: **3 SU** [F6]\n- Módulo ZMX-1: **3 SU** [F6]\n\
    - Módulo MMX-10M/CMX10-RM: **10 SU** [F6]\n- Resto de equipos: **1 SU** [F6]\n\
    \n> ⚠️ **Comprobación de cableado:** Con aisladores instalados, el conductor positivo\
    \ (+) del lazo estará en circuito abierto. **NUNCA usar multímetro de alta tensión\
    \ (Megger)** en el lazo con equipos conectados [F1].\n\n---\n\n## 3. Alta de equipos:\
    \ Autoconfiguración\n\nLa forma recomendada de dar de alta equipos es mediante\
    \ la **función de autoconfiguración** desde la central [F5].\n\n### Acceso al\
    \ menú de configuración\n\nRequiere **clave de acceso de nivel 3**. Dos vías [F10]:\n\
    \n1. Pulsar la tecla de acceso → seleccionar «Conf/Mant.Ingeniero» → introducir\
    \ clave → pulsar de nuevo para mostrar la pestaña **CONFIG**\n2. Girar la llave\
    \ de acceso 90° en sentido horario → seleccionar «**5: Pestaña Configuración**»\
    \ → introducir clave de nivel 3\n\n### Procedimiento de autoconfiguración [F5]\n\
    \n1. Seleccionar **«1: Autoconfiguración»**\n2. Elegir si aplica a **todos los\
    \ lazos** o a un **lazo específico**\n3. Seleccionar el modo de protocolo:\n \
    \  - **«1: Todos Prot. OPAL/CLIP»** — detecta duplicidades de dirección\n   -\
    \ **«2: OPAL/CLIP (No detecta duplicidad)»** — más rápido, sin comprobación de\
    \ duplicados\n   - **«3: Sólo con protocolo CLIP»** — solo autoconfigura equipos\
    \ CLIP aunque haya Opal en el lazo\n4. Seleccionar el modo de actualización:\n\
    \   - **«1: Permite Añadir/Borrar/Cambiar»**\n   - **«2: Sólo Añadir Nuevos Equipos»**\n\
    5. El proceso se inicia automáticamente. Sensores y módulos Opal y CLIP se detectan\
    \ en la misma pasada [F5]\n6. Al finalizar, se muestran los resultados por lazo.\
    \ Usar teclas **◁/▷** para navegar entre lazos [F3]\n\n> **Nota:** Si se autoconfigura\
    \ un equipo Opal, por defecto quedará como Opal. Si el número de equipos CLIP\
    \ supera 40, seleccionar manualmente «Sólo con protocolo CLIP» [F3].\n\n> La configuración\
    \ puede transferirse a un ordenador portátil con el programa **ITS** para editarla\
    \ y archivarla [F5].\n\n---\n\n## 4. Edición individual de equipos\n\nDesde el\
    \ menú de configuración (nivel 3) se puede editar cada sensor o módulo individualmente\
    \ [F4]. Parámetros editables para **sensores**:\n\n- Números de referencia de\
    \ zona de red [F4]\n- Tipo de equipo [F4]\n- Entorno del número de referencia\
    \ de zona (opcional) [F4]\n- Número de central (LOCAL o 1-125 para centrales de\
    \ red) [F4]\n- Número de zonas (hasta **255 zonas locales** o **8192 zonas de\
    \ red**) [F4]\n- Número de células (hasta **255**) [F4]\n- Prioridad de interrogación\
    \ (solo CLIP: limitada a **30 equipos**) [F4]\n- Acción de parpadeo en equipo\
    \ interrogado; elección de color solo para Opal [F4]\n- Opción de tipo de equipo\
    \ (VIEW, Optiplex y SMART) [F4]\n- Ajuste del nivel de alarma [F4]\n- Ajuste del\
    \ nivel de alarma horaria [F4]\n- Ajuste del nivel de prealarma [F4]\n- Selección\
    \ de programación horaria (cambio de sensibilidad) [F4]\n- Grupo AWACS (50 grupos,\
    \ todos los sensores CLIP salvo HEAT) [F4]\n- Retardo de alarma [F4]\n- Ajuste\
    \ no silenciable para LED remoto (solo Opal); respuesta a orden SILENCIAR SIRENAS\
    \ [F4]\n- Operación solo modo térmico L6 (solo SMART y Optiplex) [F4]\n- Número\
    \ de aplicación (solo equipos SMART 4) [F4]\n- Ajuste de función LED remota (solo\
    \ Opal): «Seguir el equipo» (predeterminada) o «Controlada por reglas de causa-efecto»\
    \ [F4]\n- Retardo de confirmación de coincidencia de detector: hasta **240 s (4\
    \ min)**; puede usarse con dependencia tipo B [F4]\n\n---\n\n**Fuentes:**\n- Manual\
    \ de instalación y puesta en marcha 997-669-005-3 (sin revisión registrada)\n\
    - Manual de configuración de la central 997-671-005-3 (rev. 997-671-005-3)\n-\
    \ Manual de funcionamiento 997-670-005-3 (sin revisión registrada)\n\n---\n\n\
    También puedo ayudarte con: **conexionado físico del lazo SLC**, **configuración\
    \ del Loop Splitter 795-131** o **reglas de causa-efecto para módulos de salida**."
