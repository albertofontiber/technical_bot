- qid: hp015
  question: En la Detnov CCD-103, ¿cómo se desactiva un detector individualmente sin
    afectar al resto del lazo?
  answer: '## Desactivación en la CCD-103: por zona, no por detector individual


    La CCD-103 **no permite desactivar un detector individual**. La unidad mínima
    de desconexión es la **zona completa** [F1][F2].


    El manual no describe ningún procedimiento para aislar un único detector sin afectar
    al resto del lazo. Los fragmentos disponibles solo cubren la desconexión a nivel
    de zona y de sirenas [F1][F2].


    ---


    ## Procedimiento para desconectar una zona completa


    Si necesitas dejar fuera de servicio la zona donde está el detector problemático,
    el procedimiento es el siguiente [F2]:


    1. Asegúrate de que la **llave de bloqueo de teclado (G)** está en posición **abierta**
    (desbloqueada) [F2].

    2. Pulsa **una vez** la tecla de zona correspondiente (Z1, Z2 o Z3) → la zona
    entra en **modo prueba** [F2].

    3. Pulsa **una segunda vez** la misma tecla de zona → la zona entra en **modo
    desconexión** [F1][F2].


    ### Indicaciones visuales que confirman la desconexión [F1][F5]:

    - **Indicador de Anular (4):** encendido fijo [F1][F5].

    - **Indicador amarillo de la zona (6):** encendido fijo [F1][F5].


    ### Para reconectar la zona [F1]:

    - Pulsa **una vez** la tecla de zona desconectada → zona conectada de nuevo.


    ---


    ## ⚠️ Advertencia importante


    Cuando una zona está desconectada, **la central no refleja ninguna incidencia
    ni evento** en esa zona [F1]. Limita el tiempo de uso de esta maniobra al mínimo
    imprescindible.


    Recuerda también que la CCD-103 tiene **3 zonas**, siendo la Zona 1 y Zona 2 las
    zonas cruzadas para el proceso automático de extinción [F4]. Desconectar cualquiera
    de ellas inhabilita esa lógica de disparo.


    ---


    **Fuente:** CCD-103_Manual_ES_FR_GB_IT (sin revisión registrada)


    ---


    También puedo ayudarte con: **sustitución física del detector en la zona**, **resistencia
    de final de línea 4K7** o **diagnóstico de avería en zona** de la CCD-103.'
