- qid: cat012
  question: ¿Cómo se calcula la capacidad de batería (en Ah) necesaria para la central
    AM-8200?
  answer: '# Cálculo de capacidad de batería — AM-8200


    El manual proporciona un método estructurado en dos tablas (Tabla 1 para AM-8200
    / Tabla 2 para AM-8200BB) con la siguiente fórmula final [F6][F7]:


    ---


    ## Fórmula general


    **Ah Batería = (A + B) × 1,2**


    Donde:

    - **A** = Corriente total en reposo (No Alarma) × horas de autonomía requeridas

    - **B** = Corriente total en alarma × **0,5 h** [F6][F7]

    - **Factor 1,2** = margen por tolerancias de fabricación de las baterías [F5]


    ---


    ## Paso a paso


    **Paso 1 — Calcular la corriente total en condiciones de NO ALARMA (columna A)**


    Suma los consumos de cada tarjeta instalada. Valores de referencia para la **AM-8200**
    [F7]:


    - AM-8200 CPU (AM-8200-KLCD): **179 mA**

    - LIB-8200 (por tarjeta): **50 mA**

    - AM82-2S2C (interfaz RS232/485/CAN-BUS): **28 mA**

    - AM82-BST-C: **39 mA**

    - Corriente de lazos (ver Tabla 3 del manual) [F7]

    - Corriente salida usuario (máx. **2 A**) [F7]

    - Dispositivos externos (campanas, sirenas, flashes, otros)


    Para la **AM-8200BB**, los valores son [F6]:

    - AM-8200BB: **135 mA**

    - LIB-8200: **50 mA**

    - AM82-2S2C: **28 mA**

    - AM82-BST-C: **39 mA**


    > Para los consumos de los lazos, consulta las fichas de datos de cada dispositivo
    instalado [F5].


    **Paso 2 — Multiplicar por las horas de autonomía en reposo**


    El manual indica dos opciones de autonomía [F7]:

    - **(× 24 h)** o **(× 72 h)** → resultado = **Espera (A) en Ah**


    **Paso 3 — Calcular la corriente total en condiciones de ALARMA (columna B)**


    Suma los consumos en alarma de cada tarjeta. Valores para la **AM-8200** [F7]:

    - AM-8200 CPU: **345 mA**

    - LIB-8200: **92 mA**

    - AM82-2S2C: **28 mA**

    - AM82-BST-C: **39 mA**

    - Corriente de lazos en alarma (la central enciende **solo los primeros 6 LED**
    de detectores y módulos en alarma) [F5]

    - Dispositivos externos en alarma


    > **Nota importante:** Si la corriente total calculada supera **3,5 A**, el exceso
    durante alarma se extrae de las baterías [F5]. Tenlo en cuenta al sumar la columna
    B.


    **Paso 4 — Multiplicar por 0,5 h**


    Corriente total alarma × **0,5 h** = **Alarma (B) en Ah** [F7]


    **Paso 5 — Aplicar la fórmula final**


    **Ah Batería = (A + B) × 1,2** [F7]


    ---


    ## Límites del sistema de baterías


    - Capacidad mínima admitida: **7 Ah** [F3]

    - Capacidad máxima admitida: **18 Ah** [F3]

    - Configuración: **2 × 12 V** en serie [F3]

    - Corriente de carga: **1 A** [F3]


    ---


    ## Baterías recomendadas por el fabricante [F3]


    - Yuasa **NP18-12B** o **NP7-12BFR** (UL94) — 12 V / 17,2 Ah — 181 × 77 × 167
    mm

    - Fiamm **FG21803** o **FGV21803** (UL94) — 12 V / 18 Ah — 181 × 77 × 167 mm


    ---


    > **Nota:** El manual indica que el apéndice al final del documento contiene el
    cálculo completo de baterías en reposo y en alarma [F1]. Consulta ese apéndice
    para la Tabla 3 (consumos de lazos), que es necesaria para completar el cálculo.


    ---


    **Fuente:** AM-8200 Manual de Instalación — Doc. AM-8200-ESP Rev. A.3 (Honeywell
    Life Safety Iberia / Notifier)


    ---


    También puedo ayudarte con: **conexionado físico de las baterías**, **umbrales
    de señalización de batería agotada** o **consumos de dispositivos de lazo (Tabla
    3)** de la AM-8200.'
