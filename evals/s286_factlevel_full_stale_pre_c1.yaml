- qid: cat023
  question: En el detector de humos por aspiración Securiton ASD532, ¿qué clases de
    sensibilidad según EN 54-20 ofrece y cómo se configura la monitorización del flujo
    de aire?
  answer: '## ASD 532 — Clases EN 54-20 y configuración de monitorización de flujo
    de aire


    ---


    ### 1. Clases de sensibilidad según EN 54-20


    El ASD 532 cumple los tres niveles de la norma **EN 54-20** [F8]:


    - **Clase A** — Sensibilidad muy alta

    - **Clase B** — Sensibilidad alta

    - **Clase C** — Sensibilidad normal


    La elección de clase se implementa mediante el sensor de humo instalado y la posición
    de conmutador seleccionada. Los tres modelos de sensor disponibles son [F1][F9]:


    - **SSD 532-1** — Rango de sensibilidad de alarma **0,5 %/m hasta 10 %/m**

    - **SSD 532-2** — Rango de sensibilidad de alarma **0,1 %/m hasta 10 %/m**

    - **SSD 532-3** — Rango de sensibilidad de alarma **0,02 %/m hasta 10 %/m**


    > ⚠️ Solo deben instalarse los sensores detallados en la certificación del dispositivo.
    El uso de otros tipos revoca la certificación [F6].


    ---


    ### 2. Configuración de la clase: posiciones de conmutador normativas


    Para uso **homologado según EN 54-20**, las posiciones de conmutador son [F3]:


    - **A11** → Clase A (sensibilidad muy alta)

    - **b11 / b21** → Clase B (sensibilidad alta)

    - **C11 / C21 / C31** → Clase C (sensibilidad normal)


    La selección se realiza mediante el mando del **AMB 32** o mediante el software
    de configuración **«ASD Config»** (véanse cap. 4.4.4.3 y 7.3.3) [F1][F3].


    Alternativamente, si se usa el software de cálculo **«ASD PipeFlow»**, los resultados
    se introducen en **«ASD Config»** y se memorizan en las posiciones **X01, X02
    o X03** [F7].


    ---


    ### 3. Monitorización del flujo de aire


    **Principio de medición:** método calorimétrico (técnica de medición de flujo
    en masa) [F2].


    **Puesta en marcha — registro de valores nominales:**

    1. Con el conducto de aspiración intacto y limpio, ejecutar el **reset inicial**
    (posición de conmutador **U01**) [F3].

    2. El ASD 532 registra y memoriza los valores de flujo medidos como **100 %**
    (valores nominales) [F2].

    3. El sistema crea electrónicamente una **ventana de monitorización** centrada
    en ese 100 %.


    **Umbral normativo EN 54-20:**

    - Cualquier desviación **superior a ±20 %** (es decir, < 80 % por obstrucción
    o > 120 % por rotura de tubo) dispara el aviso **«Fallo flujo de aire»** [F2].

    - Tiempo de retardo normativo: **300 s** (en posiciones A11 a C31) [F2].


    **Parámetros ajustables con «ASD Config»** [F7]:

    - Tamaño de la ventana de monitorización (obstrucción / rotura de tubo)

    - Tiempo de retardo del aviso de fallo


    > ⚠️ Superar los valores **±20 % / 300 s** implica incumplimiento de EN 54-20
    y solo puede efectuarse previa consulta con el fabricante [F7].

    > El tamaño de ventana **no debería quedar por debajo de ±20 %**. Si se usan ventanas
    más pequeñas, el tiempo de retardo debe aumentarse a **10 min como mínimo** [F7].


    ---


    ### 4. Posiciones W01–W44: uso NO normativo


    Las posiciones **W01 a W44** cumplen la sensibilidad de alarma según EN 54-20
    (clases A–C), pero **los valores de monitorización de flujo de aire NO están homologados
    según EN 54-20** [F2][F5]. Solo deben usarse previa consulta con el fabricante
    [F5][F7].


    Ejemplo de combinaciones disponibles en estas posiciones [F4]:


    - Tiempo de retardo: **10 min** o **60 min**

    - Desviación de ventana: **±20 %** o **±50 %**


    ---


    Fuente: ASD532_TD_T140421es_a (sin revisión registrada)


    ---


    También puedo ayudarte con: **procedimiento completo de reset inicial (U01)**,
    **selección del sensor SSD 532-x según clase requerida** o **conexionado del ASD
    532 a una central de detección de incendios**.'
