- qid: cat017
  question: ¿Como se cablea y se da de alta (configura) un lazo en la central Notifier
    INSPIRE (E10/E15)?
  answer: "# Cableado y configuración de lazo — INSPIRE E10/E15\n\n---\n\n## PARTE\
    \ 1: CABLEADO FÍSICO DEL LAZO\n\n### Terminales del módulo LAZO OPAL X2 (HOP-433-100)\n\
    \nEl módulo de doble lazo tiene **10 terminales** [F2][F3]:\n\n**Lazo 1:**\n-\
    \ Terminal **1** → Lazo 1 Salida +VE\n- Terminal **2** → Lazo 1 Salida -VE\n-\
    \ Terminal **3** → ⊕ *(no usar para pantalla de cable)*\n- Terminal **4** → Lazo\
    \ 1 Entrada +VE\n- Terminal **5** → Lazo 1 Entrada -VE\n\n**Lazo 2:**\n- Terminal\
    \ **6** → Lazo 2 Salida +VE\n- Terminal **7** → Lazo 2 Salida -VE\n- Terminal\
    \ **8** → ⊕ *(no usar para pantalla de cable)*\n- Terminal **9** → Lazo 2 Entrada\
    \ +VE\n- Terminal **10** → Lazo 2 Entrada -VE\n\n> ⚠️ **Los terminales 3 y 8 NO\
    \ deben usarse para la pantalla del cable de lazo. La pantalla debe conectarse\
    \ a la barra de tierra de la central.** [F2][F3]\n\n---\n\n### Topología y dispositivos\n\
    \n- El lazo se cablea en **bucle cerrado**: la Salida de la central llega al primer\
    \ dispositivo y la Entrada regresa al último [F1].\n- Se recomienda conectar solo\
    \ con **cable de 2 hilos** [F5].\n- Se recomienda poner a tierra **un extremo**\
    \ de la pantalla del cable en la barra de tierra de la central [F7].\n\n> ⚠️ **No\
    \ mezclar dispositivos OPAL y CLIP en el mismo lazo.** [F2]\n\n---\n\n### Capacidad\
    \ por lazo [F2][F4]\n\n**Lazo OPAL:**\n- Hasta **159 detectores OPAL** + **159\
    \ módulos OPAL** por lazo\n- Corriente máxima por lazo: **750 mA** [F2]\n\n**Lazo\
    \ CLIP** *(requiere licencia)*:\n- Hasta **99 detectores CLIP** + **99 módulos\
    \ CLIP** por lazo [F2][F4]\n\n> ⚠️ **Restricción EN54-2, art. 13.7:** máximo **512\
    \ detectores y/o pulsadores** por módulo de lazo (2 circuitos). [F2]\n\n---\n\n\
    ## PARTE 2: COMPROBACIONES ANTES DE CONECTAR\n\n### Comprobaciones con multímetro\
    \ [F5][F6][F8]\n\n> ⚠️ **NUNCA usar dispositivos de alta tensión (p.ej. megóhmetro)\
    \ en el circuito de lazo.** Solo multímetro de baja tensión. [F5]\n\n1. Comprueba\
    \ la **continuidad** de cada parte del lazo y mide la resistencia extremo a extremo\
    \ [F5].\n2. Comprueba la **continuidad de la pantalla** del cable (debe dar resistencia\
    \ muy baja) [F5].\n3. Verifica que **no hay continuidad** entre la pantalla y\
    \ los cables +VE y -VE [F5].\n4. Con función de **prueba de diodo**, conecta el\
    \ multímetro en **polaridad invertida** (+VE del multímetro al negativo del lazo,\
    \ -VE al positivo). Debe indicar **diodo en polarización directa** [F6].\n5. Conecta\
    \ en **polaridad normal** (+VE al positivo del lazo). Al inicio debe leer resistencia\
    \ baja, que **aumenta progresivamente** al cargarse los condensadores de los dispositivos\
    \ [F6].\n   - Si indica diodo en directa en este paso → hay dispositivos con **polaridad\
    \ invertida** o cortocircuito [F6].\n6. Comprueba que **no hay conexión** entre\
    \ la pantalla y los cables +VE ni -VE [F6].\n\n### Resistencias máximas admisibles\
    \ [F8]\n\n- **Lazo OPAL:** resistencia < **40 Ω** para comunicación correcta\n\
    - **Lazo CLIP:**\n  - < **40 Ω** para detección de dos dispositivos\n  - < **71\
    \ Ω** si no se necesita detección de dirección duplicada\n- Capacidad del cable:\
    \ inferior a **0,5 µF** [F8]\n\n> ℹ️ Para calcular: mide entre Lazo X Entrada\
    \ -VE y Lazo X Salida -VE con el lazo desconectado de la central, multiplica el\
    \ resultado por 2 y suma la resistencia de cada aislador (**0,1 a 0,13 Ω** por\
    \ aislador). Verifica alineación con el Calculador Global de Baterías de Bucle\
    \ en **CLSS Suite** [F8].\n\n### Herramienta de diagnóstico recomendada [F7]\n\
    \nSe recomienda usar la herramienta **POL-200-TS** para comprobar y medir circuitos\
    \ de lazo antes de conectar a la central. La herramienta **POL-200** funciona\
    \ tanto en protocolo **OPAL como CLIP** [F7].\n\n---\n\n### Nota sobre aisladores\
    \ [F8]\n\n- En bases **B501 AP** (OPAL): al retirar el detector, los terminales\
    \ **+2 y +4** se cortocircuitan automáticamente manteniendo la continuidad del\
    \ lazo.\n- En módulos de lazo y pulsadores con aislador: terminales **+2 y +4**\
    \ en módulos; terminales **+3 y +4** en pulsadores.\n- Para dispositivos CLIP\
    \ con aisladores: puentea temporalmente los terminales **2 y 4** de cada aislador\
    \ para las comprobaciones [F8].\n\n---\n\n## PARTE 3: CONFIGURACIÓN DEL LAZO EN\
    \ CLSS\n\nUna vez verificado el cableado y conectado el lazo a la central [F7],\
    \ la configuración se realiza desde el **programa CLSS** [F9][F10]:\n\n1. Accede\
    \ a **Ajustes → Ajustes HMI** y en **Tipo de Marca** selecciona **Notifier EN**\
    \ [F9][F10].\n\n2. En **Ajustes de Lazo**, configura los siguientes parámetros\
    \ [F9][F10]:\n   - **Protocolo de Lazo:** selecciona `OPAL` (modo por defecto\
    \ con licencia incluida) o `CLIP` *(requiere licencia adicional)*\n   - **Limitar\
    \ a VdS 2540:** Sí o No *(el valor de resistencia cambia según la selección)*\n\
    \   - **Resistencia (Ohm):** introduce el valor medido del lazo (ejemplo en pantalla:\
    \ **93,5 Ω**)\n   - **Tipo de Cable:** selecciona el tipo correspondiente\n  \
    \ - Si el lazo **no se utiliza**: marca ☑ **Sin Uso**\n\n3. **Envía el archivo\
    \ de configuración a la central** siguiendo los pasos de \"Enviar configuración\
    \ a la central\" del CLSS [F9].\n\n4. Una vez enviada la configuración, ejecuta\
    \ la **Auto Configuración** desde la central [F9].\n\n> ⚠️ Para lazo CLIP o lazo\
    \ TC800 OPAL/CLIP, la central **debe configurarse previamente con CLSS antes de\
    \ ejecutar Auto Configuración**. De forma predeterminada, la central solo tiene\
    \ licencia para **protocolo OPAL avanzado** [F9].\n\n---\n\n### Numeración de\
    \ lazos [F2]\n\nLos circuitos de lazo se numeran **secuencialmente de izquierda\
    \ a derecha** del portamódulos. En la E15 (dos filas de portamódulos), la segunda\
    \ fila continúa la numeración desde la primera.\n\n---\n\n**Fuente:** HOP-138-8ES\
    \ issue 6 (01-2026) — INSPIRE E10/E15 Instrucciones de puesta en marcha; HOP-138-9ES\
    \ issue 5 (11-2025) — INSPIRE E10 Manual de instalación; 4188-1132-ES issue 3\
    \ (04-2025) — CLSS Quick Reference\n\n---\n\nTambién puedo ayudarte con: **Auto\
    \ Configuración paso a paso desde la central**, **conexionado de dispositivos\
    \ OPAL/CLIP específicos** o **interpretación de averías de lazo en pantalla**."
