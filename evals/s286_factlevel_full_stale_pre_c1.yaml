- qid: cat011
  question: Necesito un detector de humos analógico direccionable «751» para una instalación
    Notifier; ¿cuál es el modelo correcto?
  answer: 'El sufijo «751» identifica la **familia de bajo perfil** de detectores
    analógicos direccionables de Notifier. Dentro de esa familia existen varios modelos
    ópticos (de humo), y el modelo correcto depende de la aplicación concreta. Los
    fragmentos recogen los siguientes:


    ---


    **Detectores ópticos (fotoeléctricos) de humo con sufijo 751:**


    - **SDX-751** — Detector óptico analógico de bajo perfil (versión de bajo perfil
    del SDX-551) [F6][F10]

    - **SDX-751TEM** — Detector combinado óptico + térmico fijo (58 °C), multicriterio
    OPTIPLEX [F2][F7]

    - **SDX-751XXXX** — Sensor óptico de bajo perfil (listado en equipos compatibles
    ID50/60) [F7]


    **Otros modelos 751 de humo (no ópticos puros):**


    - **CPX-751** — Detector de humo por ionización, bajo perfil [F6][F9]

    - **CPX-751E** — Versión E del sensor iónico de bajo perfil [F5][F7]

    - **IPX-751** — Multicriterio (fotoeléctrico + iónico + térmico) [F10]

    - **LPX-751** — Óptico láser de alta sensibilidad [F7][F10]

    - **IDX-751** — Óptico analógico intrínsecamente seguro (para zonas ATEX, requiere
    barrera IMX-1) [F4]

    - **IRX-751TEM** — Multicriterio SMART 3 [F7]

    - **IRX-751CTEM** — Multicriterio SMART 4 [F7]

    - **FSL-751E** — Sensor de humo láser VIEW [F7]

    - **HPX-751E** — Sensor óptico HARSH (entornos agresivos) [F7]


    ---


    **Para orientarte hacia el modelo correcto, necesito saber:**


    1. ¿Es una aplicación estándar (zona diáfana) o un entorno especial (zona ATEX,
    conducto, ambiente agresivo)?

    2. ¿Requiere solo detección de humo óptico, o también elemento térmico combinado?

    3. ¿A qué central Notifier se va a conectar (AFP-400, ID50/60, AFP4000…)?


    Con esos datos puedo confirmarte el modelo exacto y verificar la compatibilidad
    con tu central.


    ---


    Fuentes: Manual AFP4000 (MIDT230, sin revisión registrada); Manual AFP-400 (MIDT170,
    sin revisión registrada); Manual SDX-751TEM (I56-1320-001, sin revisión registrada);
    Manual IDX-751 (MNDT1020, sin revisión registrada); Manual ID50/60 (MIDT156, sin
    revisión registrada); Manual CPX-751E (I56-0790-003, sin revisión registrada)'
