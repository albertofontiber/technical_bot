- qid: hp018
  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  answer: '# Conexionado de sirena convencional en salidas de sirena de la ZXe


    ## Terminales disponibles


    **ZX2e** [F4]: terminales en la placa base etiquetados como **A+ A- B+ B-** (sección
    SOUNDERS).


    **ZX5e** [F4]: terminales en bloque **TB7**, etiquetados como **A- A+ B- B+ C-
    C+ D- D+**.


    ---


    ## Procedimiento de conexionado


    ### 1. Polaridad de las sirenas


    Cada sirena debe ser **polarizada** [F4]. El circuito se polariza en inverso en
    reposo para supervisar la línea, y cambia a polaridad normal al dispararse [F4].


    - Si la sirena **tiene polaridad**: conecta **+** y **-** respetando la polaridad
    indicada en los terminales [F1][F3].

    - Si la sirena **no tiene polaridad** (campana sin polaridad): **instala un diodo**
    entre el terminal **+** de la salida y uno de los terminales de alimentación de
    la campana, para evitar consumo durante la supervisión [F2][F3].


    ### 2. Conexión en serie (línea directa)


    Conecta las sirenas en **línea directa** (serie), sin realizar ramales [F3]:


    - El conductor **+** de la salida pasa por el terminal **+** de cada sirena en
    secuencia.

    - El conductor **-** de la salida pasa por el terminal **-** de cada sirena en
    secuencia.

    - **No hagas ramales paralelos**: los ramales no quedan supervisados [F3].


    ### 3. Resistencia Final de Línea (RFL)


    Al final de la última sirena, instala una **resistencia final de línea de 6.800
    Ω (6K8), mínimo 0,5 W**, conectada entre **+** y **-** [F1][F2]:


    - Esta RFL permite la supervisión de apertura y cierre de la línea [F2].

    - Si **no hay ninguna sirena** conectada en esa salida, instala la RFL directamente
    en los terminales de la central [F2].


    ### 4. Corriente máxima por circuito


    - Cada circuito de sirenas tiene un **consumo máximo de 1 A** [F2].

    - Ten en cuenta el consumo total de la central con todas las sirenas activadas
    para no exceder el límite [F2].


    ### 5. Cableado


    - Sección mínima recomendada: **1,5 mm²** [F2].

    - Longitud máxima recomendada: **no superior a 1 km** — longitudes mayores pueden
    afectar al funcionamiento por capacitancia e inductancia del lazo [F1].

    - Verifica la sección adecuada para garantizar la tensión correcta en las sirenas
    tanto con alimentación de red como en condiciones de mínima tensión de baterías
    (consulta las **tablas 10 y 11** del manual de instalación) [F1].


    ### 6. Advertencia de cableado


    > ⚠️ **No enrolles el cable en los terminales. Corta y empalma las conexiones
    adecuadamente para mantener la supervisión de la línea** [F1].


    ---


    ## Resumen visual del circuito


    ```

    SALIDA A (+) ──→ [Sirena 1 +/-] ──→ [Sirena 2 +/-] ──→ [RFL 6K8 Ω]

    SALIDA A (-) ─────────────────────────────────────────────────────┘

    ```

    *(Sirenas con polaridad: conexión directa. Sin polaridad: añadir diodo en cada
    una)* [F3]


    ---


    **Fuente:** Manual de Instalación ZX2e/ZX5e — MIE-MI-530rv001 (sin revisión registrada);
    Manual de Instalación ZXAE/ZXEE — MIE-MI-310 (sin revisión registrada)


    También puedo ayudarte con: **configuración del programa de disparo de sirenas**,
    **prueba funcional de la línea de sirenas** o **interpretación de averías de supervisión
    de sirena** en la ZXe.'
