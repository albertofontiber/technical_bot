- qid: hp009
  question: ¿Cuál es la resistencia de fin de línea recomendada para los lazos de
    la central Morley ZXe?
  answer: '## Resistencia de Fin de Línea (RFL) en la ZXe


    La pregunta aplica a dos tipos de circuitos distintos en la ZXe. Te detallo ambos:


    ---


    ### 1. Circuitos de Sirenas (Salidas A y B)


    La RFL para los circuitos de sirenas es de **6.800 Ω (6,8 kΩ), 0,5 W mínimo**
    [F6].


    - Debe instalarse al **final del circuito** de sirenas [F6].

    - El circuito se supervisa ante **cortocircuito y circuito abierto** [F6].

    - **No se deben realizar ramales** en la conexión de sirenas, ya que la supervisión
    se realiza en la línea directa hasta la RFL [F3].

    - No se recomienda cable de longitud superior a **1 km** para estos circuitos
    [F3].


    > ⚠️ Si no se instalan sirenas en la salida, la RFL debe conectarse directamente
    entre + y − del terminal de la central [F1].


    ---


    ### 2. Lazo Analógico


    El lazo analógico de la ZXe **no utiliza resistencia de fin de línea**. El cableado
    se realiza en **bucle cerrado** con aisladores de cortocircuito [F8]. La impedancia
    máxima admisible del cableado de lazo analógico es de **40 Ω** [F10].


    ---


    **Fuentes:**

    - Circuitos de sirenas: Manual de Instalación ZX2e/ZX5e — Documento No. MIE-MI-530,
    Revisión: 001 [F3, F6]

    - Lazo analógico: Manual de Instalación ZX2e/ZX5e — Documento No. MIE-MI-530,
    Revisión: 001 [F8, F10]


    ---


    También puedo ayudarte con: **conexionado físico de las sirenas en la ZXe**, **verificaciones
    de cableado previas a la puesta en servicio** o **carga máxima del lazo analógico**.'
