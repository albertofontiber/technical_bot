- qid: hp019
  question: ¿Cuál es el rango de temperatura de funcionamiento del detector de aspiración
    ASD535 (Securiton, distribuido por Detnov)?
  answer: '## Rango de temperatura de funcionamiento — ASD 535


    El manual especifica los siguientes rangos de temperatura en condiciones ambientales
    ampliadas [F1]:


    **Caja del detector:**

    - Rango de temperatura estándar: **–30 °C hasta +60 °C** [F1]

    - Rango según norma **UL**: máx. **+40 °C** [F1]

    - Rango según estándar australiano **AS 1603.8**: **–30 °C hasta +55 °C** [F1]


    **Conducto de aspiración:**

    - Rango de temperatura estándar: **–30 °C hasta +60 °C** [F1]

    - Rango según estándar australiano **AS 1603.8**: **–30 °C hasta +55 °C** [F1]


    **Temperatura de almacenamiento** (sin condensación):

    - **–30 °C hasta +70 °C** [F1]


    **Restricciones adicionales a tener en cuenta:**


    - La fluctuación de temperatura máxima permitida durante el funcionamiento (tanto
    en caja como en conducto) es de **20 °C** [F1]. En entornos con oscilaciones superiores
    a 20 °C pueden ser necesarios ajustes especiales (ventana de flujo de aire más
    grande, mayor tiempo de retardo, etc.) [F5].

    - En recintos con temperatura ambiente superior a **50 °C** o humedad superior
    al **80 % H rel.**, puede ser necesario instalar tramos de refrigeración en el
    conducto de aspiración [F8].

    - Para uso en **almacenes de ultracongelación**, el rango restringido aplicable
    es **–30 °C hasta 0 °C**, siguiendo la directriz T 131 390 [F3].

    - Es posible acordar con el fabricante rangos de temperatura inferiores o superiores
    a los estándar [F2].


    ---


    Fuente: ASD535_TD_T131192es_h (sin revisión registrada)


    ---


    También puedo ayudarte con: **consumos de corriente por variante (ASD 535-1/2/3/4)**,
    **accesorios para entornos con humedad elevada o polvo** o **uso en almacenes
    de ultracongelación (directriz T 131 390)**.'
