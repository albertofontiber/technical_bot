- qid: hp008
  question: ¿Qué detectores de humo analógicos son compatibles con la Notifier ID3000?
  answer: '## Detectores de humo analógicos compatibles con la ID3000


    La ID3000 es compatible con los siguientes **sensores analógicos de humo** que
    utilizan protocolo de comunicaciones Notifier [F1][F2]:


    ### Detectores ópticos (humo por dispersión de luz)

    - **SDX-751EM** — Óptico [F1]

    - **SDX-751** — Óptico [F2]

    - **SDX551E** — Óptico [F2]

    - **SDX-551THE** — Óptico [F2]


    ### Detectores iónicos (humo por ionización)

    - **CPX-751E** — Iónico, bajo perfil [F1][F2]

    - **CPX-551E** — Iónico [F2]


    ### Detectores combinados humo/temperatura (multicriterio)

    - **SDX-751TEM** — Optiplex (combinado térmico/humo) [F1][F2]

    - **IRX-751TEM** — SMART 3 (multicriterio) [F2]

    - **IRX-751CTEM** — SMART 4 (multicriterio) [F2]


    ### Detectores de humo láser

    - **FSL-751E** — VIEW (humo láser) [F1]

    - **LPX-751** — VIEW [F2][F3]


    ### Detectores para entornos especiales

    - **HPX-751E** — HARSH/FILTREX, óptico para ambientes hostiles [F1][F2]

    - **IDX-751** — HAZARD, óptico intrínsecamente seguro [F1][F2]


    ---


    **Notas relevantes:**

    - El tipo **SMART 4** (IRX-751CTEM) incorpora detección fotoeléctrica, infrarroja,
    térmica y de monóxido de carbono [F5].

    - El **SDX-751TEM** (Optiplex) dispone de modo de funcionamiento "solo térmico"
    activable por programación horaria o tecla Modo Día [F10].

    - Los sensores **VIEW** se configuran con 9 niveles de sensibilidad (L1 más sensible,
    L9 menos sensible), expresados en % de oscurecimiento por metro [F7].

    - Para el sensor **IDX-751** (HAZARD) se requiere el aislador galvánico de seguridad
    intrínseca **Y72221** [F2].


    ---


    Fuente: MPDT190 (Manual de programación ID3000, sin revisión registrada); MIDT190
    (Manual de instalación y puesta en marcha ID3000, sin revisión registrada)


    ---


    También puedo ayudarte con: **configuración de sensibilidad de los detectores
    VIEW**, **programación del modo térmico del Optiplex** o **capacidad máxima de
    sensores por lazo** en la ID3000.'
