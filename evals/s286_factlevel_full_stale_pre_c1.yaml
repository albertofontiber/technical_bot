- qid: hp006
  question: La Notifier AFP-400 muestra el aviso 'Tierra' (Earth Fault). ¿Qué significa
    y cómo se localiza?
  answer: '## Fallo de Tierra (Earth Fault) en la AFP-400


    ### ¿Qué significa?


    El aviso **"Tierra"** (Earth Fault / Fallo de Tierra) indica que existe una conexión
    no deseada entre algún conductor del sistema y tierra. En el SLC, esta condición
    genera una señal de **Alarma/Problema** independientemente del estilo de circuito
    configurado (Estilo 4, 6 o 7) [F10].


    ---


    ### Impacto según el tipo de circuito SLC


    Según la Tabla 2-18 del manual de instalación [F10], una falta a tierra en el
    SLC produce:


    - **Estilo 4:** Alarma/Problema

    - **Estilo 6:** Alarma/Problema

    - **Estilo 7:** Alarma/Problema


    Es decir, en **todos los estilos** una falta a tierra activa tanto señal de alarma
    como de problema [F10].


    ---


    ### Indicadores en el panel


    - El LED **"Avería del Sistema"** (amarillo) parpadeará si la condición no ha
    sido reconocida, y quedará fijo una vez reconocida [F1].

    - La placa **MPS-400** dispone de un LED específico de **"Fallo de Tierra"** en
    la propia fuente de alimentación [F2].


    ---


    ### Localización del fallo


    Los fragmentos disponibles no describen un procedimiento paso a paso de localización
    del fallo de tierra para la AFP-400. Lo que sí se puede extraer es:


    1. **Verificar el LED de Fallo de Tierra** en la placa MPS-400 [F2] — confirma
    si el fallo está en la fuente de alimentación o en el cableado externo.


    2. **Comprobar el puente JP2** (en la MPS-400): existe un puente denominado **JP2**
    cuyo corte inhabilita la detección de Falla de Tierra [F3]. Si está cortado, la
    detección estará desactivada — verificar que esté en posición correcta.


    3. **Revisar el cableado del SLC** en busca de conductores con aislamiento dañado
    o en contacto con masa metálica (bandejas, cajas, estructuras).


    4. **Revisar el cableado de alimentación** en TB1 de la MPS-400, especialmente
    los terminales de Neutro (TB1-2), Toma Tierra (TB1-3) y Fase (TB1-4) [F2].


    > ⚠️ **Precaución:** Antes de intervenir en la MPS-400, desconecta **todas** las
    entradas de alimentación (red AC y baterías). Varias fuentes de alimentación pueden
    estar conectadas simultáneamente [F4].


    ---


    **Fuentes:**

    - MFDT170 (AFP-400, sin revisión registrada) [F1, F2, F5, F8]

    - MIDT170 (AFP-400, sin revisión registrada) [F2, F9]

    - 50253SP (AFP-300/AFP-400 Installation, sin revisión registrada) [F3, F4, F10]


    ---


    También puedo ayudarte con: **procedimiento de rearme tras eliminar el fallo**,
    **cableado del SLC en Estilo 7 con módulos ISO-X** o **verificación de la fuente
    MPS-400**.'
