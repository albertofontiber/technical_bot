- qid: hp014
  question: ¿Cómo se conecta un módulo de aislamiento de línea en un lazo ID2000?
  answer: "# Conexión del módulo de aislamiento de línea en lazo ID2000\n\n## Requisitos\
    \ de instalación (norma EN54-2)\n\nAntes de conectar el aislador, ten en cuenta\
    \ los límites obligatorios [F5]:\n\n- **Máximo 32 equipos** de lazo entre aisladores\
    \ (requisito EN54-2: 12.5.2) [F5]\n- **En la ID2000: máximo 25 equipos** entre\
    \ aisladores [F5]\n- **Si se usan aisladores tipo FET: máximo 20 equipos** entre\
    \ aisladores [F5]\n\n> ⚠️ Superar estos límites contraviene la norma EN54-2 en\
    \ caso de avería en la transmisión [F5].\n\n---\n\n## Terminales del aislador\n\
    \nEl aislador dispone de **4 terminales numerados del 1 al 4** [F3]:\n\n- Terminales\
    \ **1 y 2**: conexión de un lado del lazo\n- Terminales **3 y 4**: conexión del\
    \ otro lado del lazo\n\nDurante las comprobaciones previas a la puesta en marcha,\
    \ los terminales **2 y 4 se cortocircuitan temporalmente** para desconectar el\
    \ aislador y poder verificar el cableado del lazo [F3].\n\n---\n\n## Procedimiento\
    \ de conexión\n\n### Paso 1 — Comprobaciones previas (con lazo desconectado del\
    \ panel)\n\n1. **Cortocircuita temporalmente los terminales 2 y 4** de cada aislador\
    \ para desconectarlos [F3].\n2. Con el lazo desconectado del panel, comprueba\
    \ la continuidad y mide la resistencia final de línea. Verifica que es inferior\
    \ a [F3]:\n   - **Placa base y LIB (detección duplicada):** 14,5 Ω\n   - **Placa\
    \ base y LIB (sin detección duplicada):** 28,5 Ω\n   - **Placa base y LIB (detección\
    \ duplicada, segundo rango):** 18,5 Ω\n   - **Placa base y LIB (sin detección\
    \ duplicada, segundo rango):** 35,5 Ω\n3. Comprueba con multímetro en polaridad\
    \ invertida que el lazo presenta diodos polarizados en paralelo (confirma polaridad\
    \ correcta de los equipos) [F3].\n4. Comprueba que no hay conexión entre el cable\
    \ de pantalla y el positivo (+) ni el negativo (-) del cable [F2].\n\n> ⚠️ **Nunca\
    \ uses multímetros de alta tensión (tipo \"Megger\") en el lazo** [F5].\n\n###\
    \ Paso 2 — Conexión al panel\n\n1. **Retira las conexiones temporales** (cortocircuitos)\
    \ de los terminales 2 y 4 de cada aislador [F1].\n2. Conecta el cableado del lazo\
    \ al panel. **Verifica la polaridad**: los extremos marcados como **A** y **B**\
    \ deben conectarse en los terminales correspondientes [F1].\n\n### Paso 3 — Verificación\
    \ tras conexión\n\n1. Reconecta la alimentación principal [F1].\n   > ⚠️ **NUNCA\
    \ conectes las baterías antes que la alimentación principal** [F1].\n2. Comprueba\
    \ si la pantalla LCD indica alguna avería. Consulta el **Apéndice 1** del manual\
    \ para los mensajes de avería y sus causas [F1].\n\n---\n\n## Nota sobre longitud\
    \ máxima del lazo\n\nLa longitud total del par de lazo de comunicaciones **no\
    \ puede exceder los 2000 metros**, y solo si se utiliza **cable de 1,5 mm² de\
    \ sección o superior** [F3].\n\n---\n\n## Comportamiento en caso de cortocircuito\n\
    \nSi se produce un cortocircuito entre dos aisladores, el sistema desconecta la\
    \ sección afectada y lo señaliza como **\"Posible corte\"**. Los equipos en la\
    \ sección aislada aparecerán como **NO RESPONDE / PERDIDO** o como **PÉRDIDA PARCIAL\
    \ DEL LAZO** si faltan más de tres equipos [F8].\n\n---\n\nFuente: MIDT180 — Panel\
    \ ID2000, Manual de instalación y puesta en marcha (rev. MI-DT-180, 2003-03-31)\n\
    \n---\n\nTambién puedo ayudarte con: **comprobación de las salidas auxiliares\
    \ de 24V**, **conexión de baterías** o **mensajes de avería del lazo** en la ID2000."
