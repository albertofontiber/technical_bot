per_gold:
- qid: cat010
  question: ¿Cómo se alimenta la sirena/avisador intrínsecamente seguro IS-mA1 en
    una zona peligrosa (ATEX) y cuáles son sus parámetros de seguridad intrínseca
    de entrada?
  answer: '## Alimentación e parámetros de seguridad intrínseca del IS-mA1


    La sirena IS-mA1 se alimenta a través de los **terminales + y −** desde una barrera
    Zener ATEX o un aislador galvánico certificado, con parámetros de salida iguales
    o inferiores a los de entrada del equipo [F10].


    ---


    ### Clasificación de zona y certificación


    - Certificación ATEX: **Ex ia IIC T4 Ga** [F3]

    - Zonas de uso: **Zona 0, 1 y 2** [F10]

    - Grupos de gas: **IIA, IIB, IIC** (propano, etileno, hidrógeno) [F10]

    - Temperatura ambiente: **−40 °C ≤ Ta ≤ +60 °C** [F2]

    - Clasificación de temperatura: **T4 (135 °C)** [F10]

    - Certificado: **SIRA 05ATEX2084X** [F3]


    ---


    ### Parámetros de seguridad intrínseca de entrada — Terminales + y − (alimentación
    principal)


    - **Ui = 28 V** [F10]

    - **Ii = 93 mA** [F10]

    - **Pi = 660 mW** [F10]

    - **Ci = 0** [F10]

    - **Li = 0** [F10]


    > La capacitancia total conectada a los terminales +/− (cable + cualquier otra
    capacitancia) **no debe superar 83 nF** [F10].


    ---


    ### Parámetros de seguridad intrínseca de entrada — Terminales S2 y S3 (2.º y
    3.er tono de alarma)


    - **Ui = 28 V** [F7]

    - **Ii = 0 mA** [F7]


    Adicionalmente, estos terminales presentan parámetros de salida (actúan como fuente
    hacia el circuito de control) [F1]:

    - **Uo = 16,8 V**

    - **Io = 7,3 mA**

    - **Po = 31 mW**

    - **Ci = 0**


    > Dado que la corriente de entrada permitida es **cero**, los terminales S2 y
    S3 **solo pueden conectarse** a una barrera de retorno de diodo, un relé intrínsecamente
    seguro o un aislador galvánico, todos certificados por un organismo notificado.
    Solo se admiten barreras de retorno de diodo con **caída de tensión inferior a
    0,9 V** [F7].


    ---


    ### Tipos de aparatos asociados admitidos


    **Opción A — Barrera Zener (zona segura):**

    - Barrera Zener de canal único, aprobada FM/ATEX, con limitación resistiva [F1]

    - Parámetros requeridos: Uo ≤ 28 V / Io ≤ 93 mA / Po ≤ 660 mW [F1]

    - Para S2/S3: barrera de retorno de diodo con Uo ≤ 28 V / Io = 0 [F1]

    - La resistencia entre la tierra intrínsecamente segura y la tierra de protección
    debe ser **inferior a 1 Ω** [F1]


    **Opción B — Aislador galvánico (zona segura):**

    - No requiere conexión de tierra de alta integridad [F5]

    - Parámetros requeridos: Uo ≤ 28 V / Io ≤ 93 mA / Po ≤ 660 mW [F2]

    - Para S2/S3: relé galvánicamente aislado con Uo = 0 / Io = 0 [F2]


    ---


    ### Conexión en paralelo


    Se pueden conectar **hasta 3 sirenas IS-mA1 en paralelo** alimentadas desde una
    barrera o aislador común [F10]:

    - Conectar 2 en paralelo reduce la salida de cada una aproximadamente **3 dB**
    [F10]

    - Con 3 en paralelo, solo se recomienda cuando está disponible la **tensión máxima
    de alimentación** [F10]


    ---


    ### Requisitos de instalación destacados


    - El aparato asociado debe estar **certificado ATEX por organismo notificado**
    [F10]

    - Seguir la instalación conforme a **ANSI/ISA RP12.06.01** y **ANSI/NFPA 70**
    [F1]

    - Protección de envolvente: **IP65** [F1]

    - Si se suministra sin prensaestopas, instalar entradas de cable metálicas o plásticas
    que garanticen la protección ambiental requerida [F1]

    - **Desconectar la alimentación antes de cualquier intervención** para evitar
    ignición [F1]

    - La sustitución de componentes puede comprometer la seguridad [F1]

    - Limpiar únicamente con **paño húmedo** (riesgo de carga electrostática en la
    carcasa de ABS) [F10]


    ---


    **Fuente:** manual IS MA1 / IS5001-F_IS-mA1_EN (Document No. IS 5001, Issue H,
    03-01-2020; sin revisión registrada en metadatos)


    ---

    ⚠️ **Información adicional del manual:**

    - "CAUTION - The clearance between sounder terminals S2 and S3 is less than 6mm."
    [F1]

    - "CAUTION - Bonding between conduit connections is not automatic and must be
    provided as part of this installation." [F1]'
