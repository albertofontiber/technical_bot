- qid: hp006
  question: La Notifier AFP-400 muestra el aviso 'Tierra' (Earth Fault). ¿Qué significa
    y cómo se localiza?
  answer: '## Fallo de Tierra (Earth Fault) en la AFP-400


    El aviso **''Tierra''** (Earth Fault) indica que existe una fuga a tierra en algún
    punto del cableado o de los circuitos del sistema. En la AFP-400, este fallo se
    detecta y señaliza mediante un **LED específico de "Fallo de Tierra"** ubicado
    en la placa de alimentación **MPS-400** [F2].


    ---


    ### ¿Qué significa?


    Según la tabla de condiciones de fallo del SLC [F9], una falla de tipo **"Tierra"**
    en el lazo SLC genera una condición de **Alarma/Problema** en todos los estilos
    de circuito (Estilo 4, Estilo 6 y Estilo 7). Esto significa que el sistema puede
    generar tanto una señal de avería como potencialmente una señal de alarma dependiendo
    del estilo configurado [F9].


    ---


    ### Localización del fallo


    **Paso 1 — Confirmar el fallo en el panel**

    - El LED **"Fallo de Tierra"** de la placa **MPS-400** estará encendido [F2].

    - El LED **"Avería del Sistema"** (amarillo) del frontal de la AFP-400 estará
    activo [F1].

    - Pulsa `<Enter>` → `<2>` para acceder al menú **Leer Estados** [F10] y consultar
    qué punto o zona está reportando la condición.


    **Paso 2 — Consultar el histórico y los puntos afectados**

    Desde el menú de Lectura de Estados [F10]:

    - Pulsa `0` + `Enter` → selecciona `SENSOR`, `MÓDULO`, `EQUIPO` o `Z` para leer
    el estado del punto sospechoso.

    - Pulsa `2` + `Enter` para leer el **Histórico** y ver cuándo se generó el fallo.


    **Paso 3 — Verificar si la detección de fallo de tierra está habilitada**

    En la placa **MPS-400** existe un puente **JP2** cuya función es **inhabilitar
    la detección de Falla de Tierra** [F4]. Verifica que este puente esté en su posición
    correcta (no cortado) si el fallo parece espurio.


    **Paso 4 — Revisar el cableado físico**

    - Inspecciona el cableado del lazo SLC en busca de conductores con aislamiento
    dañado en contacto con masa o estructura metálica.

    - Revisa también el cableado de la fuente de alimentación en **TB1** (terminales
    de entrada AC y batería) [F2].


    ---


    ### ⚠️ Nota de seguridad

    Los fragmentos disponibles no describen un procedimiento paso a paso completo
    de localización de fallo de tierra más allá de lo indicado. Para el procedimiento
    detallado de diagnóstico, consulta el **Manual de Instalación AFP-300/AFP-400
    (Documento 50253)** referenciado en [F6] y [F7].


    ---


    **Fuentes:**

    - MFDT170 (Manual de usuario AFP-400, sin revisión registrada) [F1, F5, F10]

    - MIDT170 (Manual de instalación AFP-400, sin revisión registrada) [F2, F11]

    - 50253SP (Manual de instalación AFP-300/AFP-400, sin revisión registrada) [F3,
    F4, F9]

    - 15090SP (NRT, sin revisión registrada) [F6, F7]


    ---

    📖 **Información adicional del manual:**

    - "- **TB1** (top left): Terminal block with connections labeled TB1

    - **TB2** (top center): Terminal block labeled TB2

    - **TB3-TB6** (top right): Terminal blocks labeled TB3-TB6

    - **TB7-TB10** (far right): Terminal blocks labeled TB7-TB10

    - **Interruptor de Selección de Voltaje 115V/230V** (left side): Voltage selection
    switch

    - **Circuitos de Aviso y Señalizaciones 1-4** (right side): Alarm and signaling
    circuits 1-4

    - **Fallo de Tierra** (right side): Ground fault indicator

    - **Activación de la Alimentación AC** (right side): AC power activation

    - **Placa de Alimentación de la MPS-400** (bottom center): MPS-400 power supply
    board" [F2]'
