per_gold:
- qid: cat001
  question: En la Notifier PEARL, ¿cuántos equipos admite un lazo SLC y qué límites
    de cableado hay (aisladores), y cómo se dan de alta y editan esos equipos desde
    la central?
  answer: "# Notifier PEARL — Capacidad de lazo SLC, límites de aisladores y alta/edición\
    \ de equipos\n\n---\n\n## 1. Capacidad máxima del lazo SLC\n\nLa central Pearl\
    \ admite un máximo de **318 equipos por lazo analógico**, desglosados en hasta\
    \ **159 sensores + 159 módulos** (protocolo Opal) [F1].\n\nEn protocolo **CLIP**,\
    \ el límite es de **99 sensores + 99 módulos** por lazo [F2].\n\nEn lazos de **protocolo\
    \ mixto** (Opal + CLIP), el límite de equipos CLIP es de **40**; si se supera,\
    \ la autoconfiguración continúa pero señala fallos [F7].\n\nLímite global del\
    \ sistema (ambos lazos):\n- Máximo **512 sensores y/o pulsadores manuales** en\
    \ total por sistema (requisito EN54-2: 13-7) [F1].\n- La carga máxima es de **0,75\
    \ A por lazo** [F2].\n\n---\n\n## 2. Límites de cableado y aisladores\n\n**Longitud\
    \ máxima del lazo:** la longitud total del par de comunicaciones no puede superar\
    \ los **2000 metros** [F9].\n\n**Resistencia y capacitancia del cable:**\n- La\
    \ capacitancia del cable debe ser inferior a **0,5 µF** [F12].\n- La resistencia\
    \ máxima del lazo: mide entre IN- y OUT-, multiplica el resultado por 2 y añade\
    \ la resistencia de cada aislador (**entre 0,1 y 0,13 Ω cada uno**) [F12]. El\
    \ límite exacto se define en la sección «6.4.2 Comprobaciones del lazo antes de\
    \ conectar el cableado» del manual de instalación [F12].\n\n**Regla de aisladores\
    \ (EN54-2: 12.5.2):**\n- Máximo **32 equipos entre aisladores** según EN54-2 [F1].\n\
    - Para la Pearl específicamente:\n  - Equipos **sin aisladores internos** (incluidos\
    \ CLIP y algunos Opal): no más de **20 equipos entre aisladores** [F1].\n  - Equipos\
    \ **con aisladores internos** (con base B501 AP): deben cumplir los requisitos\
    \ de EN54-2 [F1].\n  - Nota adicional del apéndice de diseño: no colocar más de\
    \ **25 equipos entre aisladores** (20 si se usan aisladores FET) [F8].\n\n**Equipos\
    \ Opal con aislador interno FET:** requieren base **B501 AP** para que el aislador\
    \ quede operativo (conectado a terminales **+2 y +4** en el extremo positivo).\
    \ Con bases sin estos conectores, el aislador interno no puede utilizarse [F1].\n\
    \n**Arranque del lazo:** para asegurar que los aisladores se cierran al aplicar\
    \ alimentación, la carga entre aisladores no debe superar **20 SU** [F4]. Cargas\
    \ de referencia para equipos CLIP:\n- Detector por rayo LPB-700: **6 SU** [F4]\n\
    - Sirenas de lazo: **3 SU** [F4]\n- Módulo ZMX-1: **3 SU** [F4]\n- Módulo MMX-10M/CMX10-RM:\
    \ **10 SU** [F4]\n- El resto: **1 SU** [F4]\n\n> ⚠️ **NUNCA utilices un multímetro\
    \ de alta tensión (tipo Megger) en el lazo de detección.** Si hay aisladores instalados,\
    \ el conductor positivo (+) del lazo estará en circuito abierto [F1].\n\n---\n\
    \n## 3. Alta de equipos: Autoconfiguración\n\nLa forma más rápida de dar de alta\
    \ equipos es mediante la **función de autoconfiguración** desde el menú de la\
    \ central [F6].\n\n**Pasos:**\n\n1. Accede al menú de configuración (nivel de\
    \ acceso requerido) y selecciona **1: Autoconfiguración** [F6].\n2. Elige si aplicar\
    \ la autoconfiguración a **todos los lazos** o a un **lazo específico** [F6].\n\
    3. Selecciona el protocolo:\n   - **1: Todos Prot. OPAL/CLIP** — detecta duplicidades\
    \ de dirección [F6].\n   - **2: OPAL/CLIP (No detecta duplicidad)** — más rápido,\
    \ sin comprobación de duplicados [F6].\n   - **3: Sólo con protocolo CLIP** —\
    \ solo autoconfigura equipos CLIP aunque haya Opal en el lazo [F6].\n4. Selecciona\
    \ el modo de actualización:\n   - **1: Permite Añadir/Borrar/Cambiar** [F7].\n\
    \   - **2: Sólo Añadir Nuevos Equipos** [F7].\n5. El proceso se inicia automáticamente.\
    \ Los sensores y módulos Opal y CLIP se detectan en la misma pasada [F6].\n6.\
    \ Al finalizar, se muestran los resultados por lazo. Usa las teclas **◄/►** para\
    \ navegar entre lazos [F7].\n\n> **Nota:** Si un equipo Opal se autoconfigura,\
    \ por defecto será Opal. Si el número de equipos CLIP supera 40, selecciona manualmente\
    \ la opción «Sólo con protocolo CLIP» [F7].\n> Los pulsadores CLIP se autoconfiguran\
    \ como «MON» y deben cambiarse manualmente a tipo **«cPUL»** [F10].\n\nLa configuración\
    \ puede transferirse a un ordenador portátil para editarla y archivarla usando\
    \ el programa **ITS** [F6].\n\n---\n\n## 4. Edición individual de equipos\n\n\
    Tras la autoconfiguración, cada sensor o módulo puede editarse individualmente\
    \ [F5].\n\n**Para sensores**, los parámetros editables incluyen [F5]:\n- Números\
    \ de referencia de zona de red\n- Tipo de equipo\n- Número de zonas (hasta **255\
    \ zonas locales** o **8192 zonas de red**)\n- Número de células (hasta **255**)\n\
    - Prioridad de interrogación (solo CLIP: limitada a **30 equipos**)\n- Ajuste\
    \ del nivel de alarma, prealarma y alarma horaria\n- Selección de programación\
    \ horaria (cambio de sensibilidad)\n- Grupo AWACS (**50 grupos**, solo sensores\
    \ CLIP salvo HEAT)\n- Retardo de alarma\n- Retardo de confirmación de coincidencia\
    \ de detector (hasta **240 s / 4 min**), usable con dependencia tipo B\n- Acción\
    \ de parpadeo en equipo interrogado (elección de color solo para Opal)\n- Ajuste\
    \ no silenciable para LED remoto (solo Opal)\n- Operación solo modo térmico L6\
    \ (solo SMART y Optiplex)\n- Número de aplicación (solo equipos SMART 4)\n- Función\
    \ LED remota (solo Opal): «Seguir el equipo» o «Controlada por reglas de causa-efecto»\n\
    \n**Para módulos**, los parámetros editables incluyen [F10]:\n- Números de referencia\
    \ de zona de red\n- Tipo de equipo\n- Número de zonas (hasta **255 zonas locales**\
    \ o **8192 zonas de red**)\n- Número de células (hasta **255**)\n- Prioridad de\
    \ interrogación (solo CLIP: limitada a **30 equipos**)\n- Asignar alimentación\
    \ de potenciador de lazo (solo para alarma)\n- Función de acción de subdirecciones\
    \ (entrada o salida)\n- Ajuste de acción de fallo no AUX: entrada de alarma o\
