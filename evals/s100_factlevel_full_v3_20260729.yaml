- qid: cat017
  question: ¿Como se cablea y se da de alta (configura) un lazo en la central Notifier
    INSPIRE (E10/E15)?
  answer: "# Cableado y configuración de lazo en INSPIRE E10/E15\n\nEl lazo se conecta\
    \ al módulo **LAZO OPAL X2 (HOP-433-100)** y se da de alta mediante el software\
    \ **CLSS** y la función **Auto Configuración**. A continuación el procedimiento\
    \ completo:\n\n---\n\n## PARTE 1 — CABLEADO DEL LAZO\n\n### Terminales del módulo\
    \ LAZO OPAL X2\n\nEl módulo tiene código de color **morado** [F2] y sus terminales\
    \ son [F2][F3]:\n\n**Lazo 1:**\n- Terminal 1: Lazo 1 Salida +VE\n- Terminal 2:\
    \ Lazo 1 Salida -VE\n- Terminal 3: ⊕ (**NO USAR para pantalla de cable**)\n- Terminal\
    \ 4: Lazo 1 Entrada +VE\n- Terminal 5: Lazo 1 Entrada -VE\n\n**Lazo 2:**\n- Terminal\
    \ 6: Lazo 2 Salida +VE\n- Terminal 7: Lazo 2 Salida -VE\n- Terminal 8: ⊕ (**NO\
    \ USAR para pantalla de cable**)\n- Terminal 9: Lazo 2 Entrada +VE\n- Terminal\
    \ 10: Lazo 2 Entrada -VE\n\n> ⚠️ **La pantalla del cable de lazo debe conectarse\
    \ a la barra de tierra de la central, NO a los terminales 3 u 8** [F2][F3].\n\n\
    > ⚠️ **No mezclar dispositivos OPAL y CLIP en el mismo lazo** [F2].\n\n---\n\n\
    ### Capacidad del lazo [F2][F5]\n\n**Protocolo OPAL:**\n- Hasta **159 detectores**\
    \ + **159 módulos** por lazo\n- Corriente máxima por lazo: **750 mA**\n\n**Protocolo\
    \ CLIP** (requiere licencia):\n- Hasta **99 detectores** + **99 módulos** por\
    \ lazo\n\n> ⚠️ **EN54-2 (13.7):** Restricción de **512 detectores y/o pulsadores**\
    \ por módulo de lazo (2 circuitos) [F2].\n\n---\n\n### Numeración de lazos [F2]\n\
    \nLos circuitos de lazo se numeran secuencialmente de **izquierda a derecha**\
    \ del portamódulos. En la E15 (dos filas), la segunda fila continúa la numeración\
    \ desde la primera.\n\n---\n\n## PARTE 2 — COMPROBACIONES PREVIAS AL ENCENDIDO\n\
    \nAntes de conectar el lazo a la central, realiza estas verificaciones con multímetro\
    \ [F6][F7][F9]:\n\n> ⚠️ **NUNCA uses un comprobador de alta tensión (megóhmetro)\
    \ en el circuito de lazo** [F6].\n\n1. **Continuidad del lazo:** Comprueba la\
    \ continuidad de cada parte del lazo y mide la resistencia extremo a extremo [F6][F9].\n\
    \n2. **Resistencia máxima admisible** [F9]:\n   - Protocolo **OPAL**: resistencia\
    \ < **40 Ω**\n   - Protocolo **CLIP** (detección de duplicados): < **40 Ω**\n\
    \   - Protocolo **CLIP** (sin detección de duplicados): < **71 Ω**\n   - Capacidad\
    \ del cable: < **0,5 µF** [F9]\n\n   > Para medir: desconecta el lazo de los terminales\
    \ de la central, mide entre Lazo X Entrada -VE y Lazo X Salida -VE, multiplica\
    \ el resultado por 2 y añade la resistencia de cada aislador (**0,1 a 0,13 Ω**\
    \ por aislador) [F9].\n\n3. **Continuidad de la pantalla:** Mide la resistencia\
    \ de la pantalla extremo a extremo (debe ser muy baja) [F6].\n\n4. **Aislamiento\
    \ pantalla/conductores:** Comprueba que NO hay continuidad entre la pantalla y\
    \ los cables +VE ni -VE [F6][F7].\n\n5. **Comprobación de polaridad con función\
    \ diodo** [F7]:\n   - Conecta el multímetro en **polaridad invertida** (+VE del\
    \ multímetro al -VE del lazo): debe indicar diodo en conducción directa.\n   -\
    \ Conecta en **polaridad normal** (+VE al +VE del lazo): debe leer resistencia\
    \ baja que va aumentando (carga de condensadores de los dispositivos).\n   - Si\
    \ en polaridad normal indica diodo en conducción directa → hay dispositivos con\
    \ polaridad invertida o cortocircuito [F7].\n\n> ℹ️ Se recomienda usar la herramienta\
    \ **POL-200-TS** para diagnósticos más detallados (compatible con OPAL y CLIP)\
    \ [F8].\n\n> ℹ️ Con aisladores en cada dispositivo OPAL, el conductor positivo\
    \ del lazo será un circuito abierto [F6]. Para dispositivos CLIP con aisladores,\
    \ puentea temporalmente los terminales 2 y 4 de cada aislador durante las comprobaciones\
    \ [F9].\n\n---\n\n## PARTE 3 — CONEXIÓN A LA CENTRAL Y PRIMER ENCENDIDO\n\n1.\
    \ Una vez verificado el cableado, conecta el circuito de lazo al bloque de terminales\
    \ correspondiente del módulo LAZO OPAL X2 [F8].\n2. Para lazo CLIP: reconecta\
    \ los aisladores que hayas puenteado temporalmente antes de conectar a la central\
    \ [F8].\n3. Conecta el cable HMI de la puerta a la CPU [F1].\n4. Conecta la corriente\
    \ principal y las baterías (**2 × 12 V 24 Ah** para E10/E15) [F1].\n\n> ⚠️ El\
    \ primer encendido debe realizarse **sin cableado externo conectado**, pero con\
    \ la fuente de alimentación y un circuito de lazo probado [F1].\n\n---\n\n## PARTE\
    \ 4 — CONFIGURACIÓN DEL LAZO EN CLSS (Auto Configuración)\n\n### Paso previo —\
    \ Configuración en CLSS Suite [F10]\n\n> ℹ️ De forma predeterminada, la central\
    \ tiene licencia para **protocolo OPAL avanzado** únicamente. Para CLIP o TC800\
    \ se requiere licencia adicional [F10].\n\n1. Accede al programa de configuración\
    \ **CLSS**.\n2. Ve a **Ajustes → Ajustes HMI** y en **Tipo de marca** selecciona\
    \ **Notifier EN** [F10].\n3. En **Ajustes de lazo**:\n   - Si el lazo **no se\
    \ usa**: marca ☑ **Sin Uso** [F1][F10].\n   - Si el lazo **se usa**: selecciona\
    \ **Limitar a VdS 2540** (Sí/No) — el valor de resistencia cambia según la selección\
    \ — y elige el **Tipo de cable** [F10].\n4. Envía la configuración a la central\
    \ siguiendo los pasos del apartado **\"Enviar configuración a la central\"** [F10].\n\
    \n### Auto Configuración desde la central [F12]\n\n1. Selecciona **Auto Configuración**\
    \ para buscar los dispositivos conectados al circuito de lazo.\n2. Lee la información\
    \ de la ventana emergente y confirma seleccionando **Auto Configuración**.\n3.\
    \ La central escaneará el lazo. En la pantalla **Información del sistema** podrás\
    \ ver los módulos instalados; desplázate hasta el módulo de lazo para ver el recuento\
    \ de dispositivos detectados [F11].\n\n---\n\nFuentes:\n- HOP-138-8ES issue 6,\
    \ 01-2026 (Instrucciones de puesta en marcha INSPIRE E10/E15)\n- HOP-138-9ES issue\
    \ 5, 11-2025 (Instrucciones de instalación INSPIRE E10)\n- 4188-1132-ES issue\
    \ 3, 04-2025 (Guía rápida CLSS-10)\n\n---\n\U0001F4D6 **Información adicional\
    \ del manual:**\n- \"- Left side: CPU module with 6 connection terminals and external\
    \ wiring connection point ②\n- Center top: HMI cable connection detail showing\
    \ CPU with points \"a\" and \"b\" marked as ①\n- Center middle: Central unit internal\
    \ view showing wiring connections with color-coded wires (brown, yellow/green,\
    \ blue) connecting to L and N terminals, marked as ②\n- Right side: Power supply\
    \ terminal block showing L (brown wire) and N (blue wire) connections with earth\
    \ (yellow/green wire)\n- Bottom center: Battery connection diagram showing 2 x\
    \ 12 V 24 Ah batteries with positive and negative terminals, marked as ③\n- Bottom\
    \ right: Circular detail view showing battery terminal connection with + and -\
    \ markings]\" [F1]"
