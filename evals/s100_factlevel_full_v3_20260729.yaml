- qid: cat016
  question: En la Detnov CAD-150, ¿como se da de alta un detector nuevo en el lazo
    y como se prueba que funciona?
  answer: "# CAD-150-8: Alta de detector nuevo en el lazo y prueba de funcionamiento\n\
    \n## PARTE 1 — Dar de alta un detector nuevo (autobúsqueda de lazo)\n\nEl procedimiento\
    \ para incorporar un nuevo detector al sistema es realizar una **autobúsqueda\
    \ del lazo**, que escanea todos los elementos presentes y los registra [F1]:\n\
    \n1. Accede al **menú BUCLE** desde el teclado de la central [F1].\n2. Ejecuta\
    \ la **autobúsqueda** del lazo donde está instalado el nuevo detector. El sistema\
    \ escaneará el lazo y mostrará todos los elementos que encuentra [F1].\n3. **Verifica**\
    \ que los elementos encontrados coinciden con los planos de la instalación [F1].\n\
    4. Accede al **menú ELEMENTOS** para asignar al nuevo detector:\n   - Un **nombre/texto**\
    \ identificativo [F1][F4]\n   - La **zona** a la que pertenece [F1][F4]\n5. Si\
    \ es necesario, accede al **menú ZONA** para crear o asignar zonas [F1].\n6. Si\
    \ el detector debe activar alguna salida o sirena, configura la **maniobra** correspondiente\
    \ desde el **menú MANIOBRAS** [F1].\n\n> **Nota:** La configuración puede realizarse\
    \ desde el teclado de la central o mediante el software de configuración, siendo\
    \ este último más sencillo y rápido [F7].\n\n---\n\n## PARTE 2 — Verificar el\
    \ estado del detector recién dado de alta\n\nAntes de hacer la prueba funcional,\
    \ puedes comprobar el estado del elemento desde el **menú ELEMENTO → VER** [F4]:\n\
    \n- **BUCLE**: número de lazo al que pertenece [F4]\n- **DIR**: dirección del\
    \ detector en el lazo [F4]\n- **ZONA**: zona asignada [F4]\n- **TIPO**: tipo de\
    \ elemento (óptico, térmico, etc.) [F4]\n- **MODO**: estado actual (conectado,\
    \ desconectado, en prueba) [F4]\n- **VA**: valor analógico del detector [F4]\n\
    - **TEXTO**: denominación asignada [F4]\n\n---\n\n## PARTE 3 — Probar el detector\
    \ sin rearmar la central (modo prueba de zona)\n\nEl método recomendado para probar\
    \ el detector sin necesidad de rearmar la central es el **modo PRUEBA de zona**\
    \ [F2]:\n\n1. Accede al **menú ZONA → Prueba** [F2].\n2. Introduce el **rango\
    \ de zonas** a poner en prueba (campo `RANGO`) [F2]:\n   ```\n   PRUEBA ZONA\n\
    \   RANGO  : [000] a [250]\n   ACTIVAR SIRENAS: [SI]\n   < Aceptar >    < Salir\
    \ >\n   ```\n3. Selecciona si deseas **activar las sirenas** durante la prueba\
    \ (`SI` o `NO`) [F2].\n4. Pulsa **Aceptar**.\n5. Activa el detector (con aerosol\
    \ de prueba, calor, etc.). Si el detector entra en alarma:\n   - Si seleccionaste\
    \ `ACTIVAR SIRENAS: SI` → las sirenas se activarán unos segundos y se silenciarán\
    \ automáticamente [F2].\n   - Cualquier **retardo de sirena** programado queda\
    \ **anulado** en modo prueba para agilizar la verificación [F2].\n6. Para **salir\
    \ del modo prueba**, conecta la zona desde el menú ZONA → Conectar [F2].\n\n>\
    \ ⚠️ **Tiempo límite:** Si transcurren **20 minutos** desde la activación del\
    \ modo prueba sin que se produzca ningún disparo de alarma, el sistema saldrá\
    \ automáticamente del modo prueba y volverá al estado normal [F2][F3].\n\n---\n\
    \n## PARTE 4 — Prueba general del sistema (puesta en marcha)\n\nComo verificación\
    \ final tras la instalación [F8]:\n\n- Provoca una **avería** y verifica que se\
    \ activa el **relé de avería** [F8].\n- Provoca una **alarma** y verifica que\
    \ se activa el **relé de alarma** y que las **salidas de sirena** se activan una\
    \ vez transcurrido el tiempo de retardo programado [F8].\n\n---\n\n**Fuentes:**\n\
    - `55315013 Manual Centrales Analógicas CAD-150-8 Instalación ES FR GB IT` (sin\
    \ revisión registrada)\n- `55315008 Manual Centrales Analógicas CAD-150-8 Usuario\
    \ ES FR GB IT` (sin revisión registrada)\n\n---\n⚠️ **Información adicional del\
    \ manual:**\n- \"En caso de necesidad, se puede encender el equipo solo con las\
    \ baterías conectadas, pero es imprescindible pulsar sobre el pulsador BAT para\
    \ arrancar el equipo.\" [F7]\n\n---\n\U0001F4D6 **Obligaciones de evidencia del\
    \ manual:**\n- \"» Poner el equipo en estado de prueba, y verificar que todos\
    \ los detectores y pulsadores funcionan de acuerdo con las especificaciones del\
    \ fabricante.\" (55315008-Manual-Centrales-Analogicas-CAD-150-8-Usuario-ES-FR-GB-IT,\
    \ p. 37) [F9]"
