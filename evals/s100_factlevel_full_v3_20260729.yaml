- qid: hp009
  question: ¿Cuál es la resistencia de fin de línea recomendada para los lazos de
    la central Morley ZXe?
  answer: 'La resistencia de fin de línea (RFL) de la ZXe depende del tipo de lazo:


    **Salidas de sirenas de placa:**

    - **6.800 Ω (6K8)** [F10], confirmado también en el diagrama de la Figura 15 [F1].


    **Lazo RS-485 (red de centrales / lazo periférico):**

    - **150 Ω, 0,5 W mínimo** [F2], colocada entre terminales A y B en cada extremo
    libre de la cadena.


    > ⚠️ Nota importante para el lazo RS-485: si los equipos extremos disponen de
    puente **TERM ON**, ese puente ya incorpora internamente una resistencia de 150
    Ω. En ese caso, **no instales además la resistencia externa**, ya que quedarían
    en paralelo [F4].


    ---


    **Fuente:** Manual de Instalación ZX2e/ZX5e — MIE-MI-530rv001 (sin revisión registrada)
    [F1, F2, F9, F10]; Manual de Instalación ZXr-A/ZXr-P — MIE-MI-431 (rev. 2) [F4]


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "Es imprescindible comprobar que no hay derivación entre los terminales A y
    B y que el lazo entra a un lado del conector y sale por el otro o termina en la
    resistencia RFL de 150 Ohmios." (MIE-MI-431rv2, p. 8) [F4]

    - "Es imprescindible comprobar que no hay conexión entre los terminales A y B
    y que el lazo entra a un lado del conector y sale por el otro o termina en la
    resistencia RFL de 150 Ohmios." (MIE-MI-310, p. 22) [F6]

    - "Debe instalarse siempre la resistencia RFL entre + y - de la ultima sirena
    para controlar la apertura o cierre de la línea de sirenas." (MIE-MP-210, p. 18)
    [F7]'
