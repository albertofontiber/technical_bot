- qid: hp012
  question: ¿Cuántos lazos direccionables soporta la Notifier AM2020/AFP1010 y cuántos
    dispositivos por lazo?
  answer: '## Capacidad de lazos y dispositivos — AM2020 / AFP1010


    ### Número de lazos SLC


    - **AM2020**: soporta hasta **10 lazos SLC** [F8]. Pueden emplearse de uno a cinco
    **LIB-400** (doble lazo cada uno), o de uno a diez **LIB-200** / **LIB-200A**
    (un lazo cada uno), o combinación de ambos [F4].

    - **AFP1010**: soportará un máximo de **dos LIB-400** (un total de **cuatro SLCs**)
    [F4]. Adicionalmente, el fragmento [F1] indica que el AFP1010 está limitado a
    un máximo de **dos LIB-200** (un total de **396 dispositivos en el sistema**).


    ### Dispositivos por lazo


    Cada lazo SLC (independientemente del tipo de LIB) soporta [F4] [F8]:

    - Hasta **99 detectores inteligentes**

    - Más una combinación adicional de hasta **99 estaciones direccionables, módulos
    de monitoreo y módulos de control**


    Es decir, hasta **99 detectores + 99 módulos** por lazo SLC.


    ### Resumen


    - **AM2020**: hasta **10 lazos** × (99 detectores + 99 módulos) = hasta **1.980
    dispositivos** teóricos [F4] [F8].

    - **AFP1010**: hasta **4 lazos SLC** (con LIB-400) [F4], con el límite global
    de **396 dispositivos** cuando se usan LIB-200 [F1].


    > ⚠️ **Nota**: El límite de 396 dispositivos para AFP1010 con LIB-200 aparece
    literalmente en [F1]. Para configuraciones con LIB-400 en AFP1010, el manual no
    especifica un límite global de dispositivos distinto en los fragmentos disponibles
    — consulta el manual completo para esa configuración.


    ---


    Fuentes: Manual 15088SP (sin revisión registrada); Manual MFDT280 (sin revisión
    registrada); Manual MPDT280 (rev. Rev A)


    ---

    📖 **Información adicional del manual:**

    - "Durante el estado de alarma de incendio, entre 9 y 99 LEDs de equipos direccionables
    (detectores de humo, detectores de calor, módulos MMX, etc.) puede estar permanentemente
    activados." [F8]


    ---

    📋 **Obligaciones de evidencia del manual:**

