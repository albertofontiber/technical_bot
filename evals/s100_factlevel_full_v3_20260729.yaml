- qid: cat007
  question: En el detector por aspiración FAAST LT-200, ¿qué salidas de relé y de
    sirena tiene y con qué contactos, cómo se comporta el relé de avería ante un fallo
    o un corte de alimentación, qué resistencia de fin de línea llevan las salidas
    de sirena y cuál es la especificación eléctrica de los contactos de relé?
  answer: "## Salidas de relé y sirena del FAAST LT-200\n\nEl equipo dispone de **relés\
    \ de alarma, avería y sirena** (y prealarma en la variante Stand Alone), con contactos\
    \ NC/C/NA para cada canal.\n\n---\n\n### Relés disponibles y su comportamiento\n\
    \n**Versión Loop (conectada a panel)** [F3, F8]:\n\n- **Relé de ALARMA 1 y 2**\
    \ (terminales 5-6-7 para C1 y 8-9-10 para C2 [F8]):\n  Controlado por el panel\
    \ cuando determina que se cumple la condición de alarma. Se activa y desactiva\
    \ por el panel; **no está enclavado** [F3].\n\n- **Relé de AVERÍA 1 y 2** (terminales\
    \ 11-12-13 para C1 y 14-15-16 para C2 [F8]):\n  Se activa cuando se produce una\
    \ condición de avería en el canal 1 o 2, o una avería común. **También se activa\
    \ en modo de servicio y cuando se desconecta la alimentación de la unidad.** El\
    \ estado de avería **no está enclavado** [F3].\n\n- **Sirena 1 y 2** (terminales\
    \ 17-18 para sirena 1 y 19-20 para sirena 2 [F8]):\n  Se activa cuando el canal\
    \ está en ALARMA. La sirena 1 corresponde al canal 1 y la sirena 2 al canal 2.\
    \ Estado predeterminado = establecido en ALARMA [F3].\n\n**Versión Stand Alone\
    \ (HS)** [F4, F9]:\n\nIncluye los mismos relés anteriores más:\n\n- **Relé de\
    \ PREALARMA 1 y 2** (terminales 23-24-25 para C1 y 26-27-28 para C2 [F9]):\n \
    \ Se activa cuando se cumple la condición de prealarma en un canal. Condición\
    \ predeterminada = Nivel 1. Nota: cuando PREALARMA = ALARMA = Nivel 1, la prealarma\
    \ se activará al **70 % del nivel 1** [F4].\n\n- **Relé de ALARMA** (Stand Alone):\
    \ estado de alarma **enclavado por defecto**; se necesita un rearme manual para\
    \ desactivar el LED y el relé [F4].\n\n- **Relé de AVERÍA** (Stand Alone): el\
    \ estado de avería **no está enclavado** (predeterminado). Igual que en la versión\
    \ Loop, también se activa en modo de servicio y al desconectar la alimentación\
    \ [F4].\n\n- **Sirena** (Stand Alone): se activa cuando el canal está en ALARMA/PREALARMA\
    \ [F4].\n\n---\n\n### Contactos de los relés\n\nCada relé dispone de **tres contactos:\
    \ NC (normalmente cerrado), C (común) y NA (normalmente abierto)** [F8, F9].\n\
    \n---\n\n### Comportamiento del relé de avería ante fallo o corte de alimentación\n\
    \nEl relé de avería **se activa** (indica avería) tanto ante una condición de\
    \ avería en cualquier canal como cuando **se desconecta la alimentación de la\
    \ unidad** [F3, F4]. El estado de avería **no está enclavado** [F3, F4].\n\n---\n\
    \n### Resistencia de fin de línea en salidas de sirena\n\nLas salidas de sirena\
    \ 1 y 2 llevan una resistencia de fin de línea de **47 kΩ** [F8, F9].\n\n---\n\
    \n### Especificación eléctrica de los contactos de relé\n\n- Potencia nominal\
    \ de los contactos (carga resistiva CC): **máx. 2 A a 30 V CC** [F1, F2]\n- Potencia\
    \ nominal de los contactos (carga resistiva CA): **máx. 0,5 A a 30 V CA** [F1,\
    \ F2]\n- Vida útil: mínimo **10⁵ operaciones** [F1, F2]\n\n---\n\nFuentes:\n-\
    \ I56-6575-005_ES FAAST LT-200 Loop QIG (sin revisión registrada) [F1, F8]\n-\
    \ I56-6577-006_ES FAAST Notifier LT-200 QIG (sin revisión registrada) [F2, F3]\n\
    - I56-6574-005_ES -HS Stand Alone FAAST LT-200 QIG (sin revisión registrada) [F4,\
    \ F9]"
