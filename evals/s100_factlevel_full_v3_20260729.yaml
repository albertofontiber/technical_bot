- qid: cat011
  question: Necesito un detector de humos analógico direccionable «751» para una instalación
    Notifier; ¿cuál es el modelo correcto?
  answer: 'El modelo correcto es el **SDX-751**, detector de humo óptico (fotoeléctrico)
    analógico direccionable de bajo perfil de Notifier.


    Dependiendo de la variante que necesites, existen varias opciones dentro de la
    familia «751»:


    **Variantes ópticas (fotoeléctrico):**

    - **SDX-751** — Sensor óptico analógico de bajo perfil (versión del SDX-551) [F6][F10]

    - **SDX-751TEM** — Sensor combinado óptico-térmico (OPTIPLEX), con elemento térmico
    de temperatura fija a **58°C** [F2][F7]

    - **SDX-751XXXX** — Sensor óptico de bajo perfil (listado en equipos compatibles
    ID50/60) [F7]


    **Otras variantes «751» de humo (no ópticas):**

    - **CPX-751** — Detector de humo por ionización analógico, bajo perfil [F6][F8]

    - **CPX-751E** — Sensor por ionización analógico direccionable [F5]

    - **LPX-751** — Sensor óptico láser analógico de alta sensibilidad [F7][F10]

    - **IPX-751** — Detector multicriterio (fotoeléctrico + iónico + térmico) [F10]

    - **IDX-751** — Sensor de humo óptico analógico **intrínsecamente seguro** (para
    zonas ATEX, requiere barrera/traductor **IMX-1**) [F3]

    - **IRX-751TEM** / **IRX-751CTEM** — Sensores multicriterio SMART 3 y SMART 4
    [F7]

    - **HPX-751E** — Sensor óptico HARSH (para entornos hostiles) [F7]

    - **FSL-751E** — Sensor de humo láser VIEW [F7]


    **Base recomendada:** todos los sensores analógicos se montan en base **B501**
    [F2][F6].


    ---


    **Para una instalación estándar en zona diáfana**, el modelo más habitual es el
    **SDX-751** (solo óptico) o el **SDX-751TEM** (óptico + térmico). Si la zona tiene
    riesgo de atmósfera explosiva, necesitarás el **IDX-751** con su barrera galvánica.


    ¿Puedes indicarme en qué central Notifier se va a instalar y el tipo de zona?
    Así puedo confirmarte la compatibilidad exacta del modelo.


    ---


