- qid: cat009
  question: ¿Qué resistencia de fin de línea (EOL) hay que instalar en las líneas
    de zona de la central convencional NFS Supra?
  answer: '## Resistencia de fin de línea (EOL) en zonas de la NFS Supra


    La NFS Supra admite **dos tipos de equipo final de línea (EFL)** para las líneas
    de zona, según el modo configurado [F5]:


    ---


    ### Modo por defecto — Capacitivo (EFL)

    - **Condensador de 47 µF** instalado entre positivo y negativo de la línea, en
    la salida del último equipo [F5][F1]

    - Es el modo de fábrica [F3]


    ### Modo alternativo — Resistivo (RFL)

    - **Resistencia de 6K8 Ω** [F5][F1]

    - En este modo, la central admite un rango de resistencia final de línea entre
    **3 KΩ** (consumo máx. por zona **2,5 mA**) y **7 KΩ** (consumo máx. por zona
    **4 mA**) [F5]


    ---


    ### Punto de instalación

    El EFL/RFL debe instalarse **en el último equipo de la línea**, entre el positivo
    (+) y negativo (−) de la zona [F1][F9]. **Todas las zonas, incluso las no usadas,
    deben tener instalada su final de línea** [F5].


    ---


    ### Cómo cambiar entre modo capacitivo y resistivo

    Se configura desde el panel pulsando simultáneamente **Tecla TECLADO + Tecla EVACUACIÓN**,
    y luego con la **Tecla REARME** se cambia la opción [F3]:

    - **Led 1 Alarma Rojo encendido** → Final de Línea Resistivo **6K8 Ω**

    - **Led 2 Anulada Ámbar encendido** → Final de Línea Capacitivo **47 µF** (por
    defecto)


    > ⚠️ Esta configuración es de **Nivel de acceso 3** [F3].


    ---


    **Fuente:** HLSI-MN-025_NFS Supra (Manual de usuario, HLS-MN-025 v.05, sin revisión
    registrada); HLSI-MA-025 Guía Rápida NFS_Supra_ES (sin revisión registrada)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "Esto significa que debe calcular el número de sensores a instalar dependiendo
    de su consumo sin sobrepasar nunca los 32 sensores." (HLSI-MN-025_NFS Supra, p.
    28) [F1]

    - Nota: la fuente es inconsistente: "La central NFS Supra tiene cuatro, ocho o
    doce zonas de alarma." (HLSI-MN-025_NFS Supra, p. 27) [F5] declara 12 zonas y
    la enumeración servida lista 6 (HLSI-MN-025_NFS Supra, p. 27) [F5].'
