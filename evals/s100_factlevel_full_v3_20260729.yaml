- qid: cat021
  question: Necesito un detector de llama SharpEye «40/40» (Spectrex / Notifier) para
    una instalación; ¿qué modelo pido?
  answer: 'La familia SharpEye "40/40" tiene **varias variantes con tecnología de
    detección distinta y no son intercambiables**. Necesito saber qué tipo de riesgo/combustible
    vas a proteger para indicarte el modelo correcto.


    Las variantes presentes en mi documentación son:


    - **S40/40I** — Detector de triple espectro infrarrojo (**IR3**) [F1]

    - **S40/40L / LB / L4 / L4B** — Detector **UV/IR** (IR a 2,8 µm o 4,5 µm, con
    o sin BIT) [F2]

    - **S40/40R** — Detector de **infrarrojo simple (Single IR)** [F3]

    - **S40/40M** — Detector de **múltiple infrarrojo** (llamas de hidrógeno e hidrocarburo)
    [F4]

    - **S40/40U / UB** — Detector **UV** (con o sin BIT) [F5]


    Además, los documentos de referencia de la serie mencionan también los modelos
    **S40/40UFI** (Ultra Fast IR3) y **S40/40UFL** (Ultra Fast UV/IR) [F7], aunque
    no tengo sus manuales completos en mi base.


    ---


    Para orientarte en la elección, dime:


    1. **¿Qué combustible o tipo de llama necesitas detectar?** (hidrocarburos, hidrógeno,
    alcoholes, otro)

    2. **¿El entorno requiere detección UV, IR o combinada?**

    3. **¿Necesitas BIT (prueba incorporada automática)?**


    Con eso te indico el modelo exacto y el código de pedido con sufijos de carcasa,
    entrada de cable y homologación.


    ---


