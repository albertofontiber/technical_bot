- qid: hp014
  question: ¿Cómo se conecta un módulo de aislamiento de línea en un lazo ID2000?
  answer: "## Conexión del módulo de aislamiento de línea en lazo ID2000\n\nLos fragmentos\
    \ del manual no incluyen el diagrama de conexionado interno del aislador (terminales\
    \ pin a pin), ya que ese detalle aparece en las instrucciones que acompañan al\
    \ propio equipo [F5]. Sin embargo, el manual sí recoge los requisitos de instalación\
    \ y el procedimiento de verificación del lazo con aisladores. Aquí tienes todo\
    \ lo documentado:\n\n---\n\n### Requisitos de instalación (norma EN54-2: 12.5.2)\n\
    \n- Máximo **32 equipos de lazo** entre aisladores [F5].\n- En la central **ID2000**,\
    \ no colocar más de **25 equipos de lazo** entre aisladores [F5].\n- Si se utilizan\
    \ **aisladores tipo FET**, el límite baja a **20 equipos** entre aisladores [F5]\
    \ [F3].\n- Los aisladores deben instalarse en **cada lazo analógico**, incluyendo\
    \ lazos con detectores de zona convencional y/o pulsadores [F5].\n\n---\n\n###\
    \ Terminales del aislador\n\nEl manual referencia el aislador con **4 terminales\
    \ numerados: 1, 2, 3 y 4** [F3]. La asignación funcional de cada terminal no se\
    \ describe en texto en los fragmentos recuperados — aparece únicamente en el diagrama\
    \ del manual. Para el conexionado pin a pin, consulta la figura de la **Sección\
    \ 8.4.2** del manual MI-DT-180 (pág. 41) y la documentación que acompaña al equipo\
    \ [F3] [F5].\n\n---\n\n### Procedimiento de verificación del lazo con aisladores\
    \ instalados\n\nAntes de conectar el cableado al panel [F3]:\n\n1. **Desconecta\
    \ temporalmente los aisladores** cortocircuitando los terminales **2 y 4** de\
    \ cada aislador [F3].\n   > ⚠️ El cableado del lazo **DEBE estar desconectado\
    \ del panel** durante este procedimiento [F3].\n\n2. Comprueba la continuidad\
    \ de cada extremo del lazo y mide la resistencia final de línea. Verifica que\
    \ es inferior a [F3]:\n   - **Placa base y LIB:**\n     - **14,5 Ω** para detección\
    \ de dirección duplicada\n     - **28,5 Ω** si no se requiere detección de dirección\
    \ duplicada\n   - **Placa base y LIB (segundo caso):**\n     - **18,5 Ω** para\
    \ garantizar detección de dirección duplicada\n     - **35,5 Ω** si no se requiere\
    \ detección de dirección duplicada\n\n3. Con multímetro en modo diodo, conecta\
    \ en **polaridad invertida** (+ al lazo −, − al lazo +). Debe indicar diodos polarizados\
    \ en paralelo [F3].\n\n4. Conecta en **polaridad normal** (+ al lazo +, − al lazo\
    \ −). La resistencia debe aumentar progresivamente mientras se cargan los condensadores\
    \ de los equipos. Si indica un diodo polarizado, hay un equipo con polaridad invertida\
    \ [F3].\n\n5. Comprueba que **no hay continuidad entre el cable de pantalla y\
    \ los conductores** + o − [F3].\n   > **Nota:** La pantalla solo debe conectarse\
    \ a tierra **en el panel** [F3].\n\n---\n\n### Conexión al panel\n\nUna vez verificado\
    \ el cableado [F1]:\n\n1. **Retira las conexiones temporales** (cortocircuitos\
    \ en terminales 2 y 4) de los aisladores.\n2. Conecta el cableado del lazo al\
    \ panel. Verifica que la **polaridad es correcta**: extremos **A** y **B** a sus\
    \ terminales correspondientes [F1].\n\n---\n\n### Comportamiento ante cortocircuito\n\
    \nCuando se produce un cortocircuito entre dos aisladores, el sistema señaliza\
    \ los equipos afectados como **NO RESPONDE/PERDIDO** o **PÉRDIDA PARCIAL DEL LAZO**\
    \ (si faltan más de tres equipos). El cortocircuito entre dos aisladores se señaliza\
    \ como **'Posible corte'** [F7].\n\n---\n\n> ⚠️ **NUNCA uses un multímetro de\
    \ alta tensión (tipo \"Megger\") en el lazo** [F5].\n> ⚠️ **NUNCA conectes las\
    \ baterías antes que la alimentación principal** [F1].\n\n---\n\n**Fuente:** Panel\
    \ ID2000 - Manual de instalación y puesta en marcha, MIDT180 (rev. MI-DT-180,\
    \ 2003-03-31)"
