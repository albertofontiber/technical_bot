- qid: hp018
  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  answer: '## Conexión de sirenas convencionales en las salidas de sirena de la ZXe


    Los puntos clave para el conexionado son los siguientes:


    ---


    ### 1. Terminales de conexión


    La ZX2e dispone de terminales de sirena identificados como **A+, A-, B+, B-**
    en el bloque de terminales de placa [F2]. La ZX5e dispone de terminales **A+,
    A-, B+, B-, C+, C-, D+, D-** en el bloque **TB7** [F2].


    > Los cables de los circuitos de sirena se terminan en la **placa de filtro**
    instalada en la parte izquierda y superior del interior de la cabina [F1].


    ---


    ### 2. Requisitos de las sirenas


    - **Cada sirena debe tener un diodo integrado** para evitar consumo en polarización
    inversa durante la supervisión [F2].

    - En reposo, el circuito se polariza en **inverso** para supervisar la línea.
    Al dispararse la salida, la polaridad cambia a la normal y las sirenas se activan
    [F2].

    - Si se conectan **dispositivos no polarizados** (campanas sin polaridad), se
    deben instalar **diodos de polarización y protección** en cada uno [F2].


    ---


    ### 3. Resistencia de final de línea (RFL)


    - Se debe instalar una **RFL de 6.800 Ω (6k8), 0,5 W mínimo** en la última sirena
    del circuito [F4].

    - Si **no se instalan sirenas** en una salida, la RFL debe conectarse directamente
    entre + y - en el terminal de la central [F5].

    - **No realizar ramales** en la línea de sirenas: la supervisión se realiza en
    la línea directa hasta la RFL, y los ramales paralelos no quedan supervisados
    [F6].


    ---


    ### 4. Consumo máximo por circuito


    - Cada circuito admite un consumo máximo de **1 A** [F4].

    - En la ZX2e, el máximo permitido **entre los dos circuitos A y B conjuntamente**
    es de **1 A** [F4].

    - En la ZX5e, el máximo permitido **entre los cuatro circuitos A, B, C y D conjuntamente**
    es de **2 A** [F4].


    > ⚠️ La corriente de sirena disponible depende de la carga de alarma completa
    del panel y **debe** verificarse mediante el programa de cálculo de lazo y baterías
    [F4].


    ---


    ### 5. Cableado


    - **No enrollar el cable en los terminales**: cortar y empalmar adecuadamente
    para mantener la supervisión de la línea [F1].

    - No se recomienda longitud de cable superior a **1 km**: por encima de esa longitud,
    la capacitancia e inductancia del lazo pueden afectar al funcionamiento [F1].

    - Usar sección de cable adecuada para garantizar la tensión correcta en las sirenas
    tanto con alimentación principal como con **mínima tensión de baterías** (consultar
    Tablas 10 y 11 del manual) [F1].


    ---


    ### 6. Verificación antes de conectar


    Antes de conectar los circuitos de sirena, comprobar que no existe posibilidad
    de activación de falsas alarmas y que todos los circuitos de detección han sido
    verificados [F7].


    ---


    > ⚠️ **Nota sobre el diagrama de conexionado:** El esquema completo del circuito
    de sirenas (Figura 15 del manual MIE-MI-530) muestra el conexionado con la RFL
    al final de la línea. Consulta esa figura directamente en el manual para verificar
    la topología visual del circuito [F1].


    ---


    **Fuente:** Manual de Instalación Paneles de Incendio ZX2e / ZX5e — Documento
    MIE-MI-530rv001 (sin revisión registrada)


    ---

    📋 **Obligaciones de evidencia del manual:**

    - Nota: la fuente es inconsistente: "* El panel de detección y control de incendio
    ZX5Se tiene 4 circuitos de sirenas supervisados y limitados en corriente, identificados
