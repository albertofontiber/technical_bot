- qid: cat024
  question: ¿Cuál es el consumo en alarma de la sirena analógica de zócalo Detnov
    MAD-472?
  answer: 'El consumo en alarma de la **MAD-472** es **7 mA** [F4][F5][F6].


    Adicionalmente, el manual propio del producto indica **17 mA a 80 dB(A)** [F1][F7].


    > ⚠️ **Nota importante:** Existe una discrepancia entre los dos documentos:

    > - El manual específico de la MAD-472 indica **17 mA (80 dB A)** [F1][F7].

    > - Las tablas de dispositivos compatibles de la CAD-250 indican **7 mA** [F4][F5][F6].

    >

    > Para el cálculo de consumos del lazo, verifica con Detnov cuál de los dos valores
    es el correcto y vigente, ya que pueden corresponder a revisiones distintas del
    producto.


    Otros datos de la MAD-472 disponibles en los fragmentos:

    - **Consumo en reposo:** < 350 μA [F1] / 0,35 mA [F4][F5][F6]

    - **Tensión de funcionamiento:** 22–38 VDC [F1]

    - **Aislador incorporado:** No [F4][F5][F6]

    - **Direcciones de lazo:** 1 [F4][F5][F6], numerables de 1 a 250 [F1]

    - **Tipo de cable:** 1,5 mm² a regleta extraíble, par trenzado apantallado [F1]

    - **Dimensiones:** 100 Ø × 150 mm [F1]


    ---


    Fuentes: 55347200 Manual Sirena Analógica MAD-472 ES GB FR IT_V2 (sin revisión
