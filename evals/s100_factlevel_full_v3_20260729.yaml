- qid: hp007
  question: ¿Cómo se realiza el test anual de un detector VESDA-E VEP según el manual
    del fabricante?
  answer: 'El test anual del VESDA-E VEP según el calendario de mantenimiento incluye
    **4 tareas obligatorias** que deben realizarse una vez al año [F1]:


    ---


    ## Tareas anuales (Tabla 7-1) [F1]


    1. **Realizar una prueba de humos** para comprobar la integridad de la red de
    tubería

    2. **Comprobar el flujo** de la red de tubería

    3. **Limpiar los puntos de muestreo**

    4. **Limpiar con agua la red de tubería**


    ---


    ## Procedimiento para la prueba de humos


    La prueba de humos consiste en introducir una muestra de humo en el **orificio
    de muestreo más alejado** y medir el tiempo que tarda el humo en llegar al detector
    [F2]. Los resultados se registran y se comparan con pruebas posteriores para detectar
    variaciones del sistema [F2].


    Para el procedimiento detallado de la prueba de humos, el manual remite a la **VESDA-E
    Commissioning Guide** [F2].


    ---


    ## Comandos de prueba disponibles (vía software Xtralis VSC) [F5]


    Para verificar el correcto funcionamiento del sistema durante el mantenimiento
    anual, puedes ejecutar desde **Xtralis VSC**:


    - **Start Alarm Test**: simula nivel de humo de escala completa, activando condiciones
    de Alerta, Acción, Fuego 1 y Fuego 2. Los relés de alarma se activarán salvo que
    el detector esté desactivado [F5].

    - **Start Air Flow Fault Test**: comprueba el sistema de detección de circulación
    del aire apagando el aspirador [F5].

    - **Start Relay Test**: activa y desactiva los relés disponibles para probarlos
    [F5].


    ---


    ## Precauciones previas obligatorias [F1]


    ⚠️ Antes de realizar cualquier prueba o mantenimiento:


    - **Informar a la autoridad supervisora adecuada**

    - **Aislar los dispositivos existentes** que dependan del detector antes de ponerlo
    en funcionamiento

    - Cuando el detector está deshabilitado o en espera, **no emitirá advertencias
    de fuego**

    - Seguir los procedimientos del sitio para **evitar falsas alarmas** en los servicios
    supervisados


    ---


    ## Modo en espera durante el mantenimiento [F8]


    Si vas a trabajar en la red de tubería o puntos de muestreo, establece el detector
    en **modo en espera** mediante Xtralis VSC: menú **Dispositivo → "Go to Standby"**.
    Esto apaga el aspirador y detiene la detección de alarmas (pero no la detección
    ni señalización de fallos) [F8].


    Para reactivar: menú **Dispositivo → "End Standby"** [F8].


    ---


    **Nota adicional:** La frecuencia de las comprobaciones puede variar en función
    de los códigos y normas locales, y del entorno de la instalación [F1]. El mantenimiento
    puede realizarlo el instalador original, un distribuidor autorizado o el contratista
    de servicio [F1].


    ---


    Fuente: 33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores (sin revisión
    registrada); 33976_13_VESDA-E_VEP-A00-P_Product_Guide_A4_Spanish_lores (sin revisión
    registrada)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "**Atención:** Pendant que le detecteur ou la zone est desactivee, aucun feu
    d''indication va etre emis par le detecteur." (33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores,
    p. 87) [F1]'
