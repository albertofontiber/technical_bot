- qid: cat008
  question: ¿Cómo se cablea el módulo de entrada M710 / MI-DMMI en el lazo, y qué
    resistencias necesita (fin de línea y modo 3 estados)?
  answer: '## Conexionado del M710 / MI-DMMI en el lazo


    Los módulos **M710** y **MI-DMMI** son módulos de entrada única con dos modos
    de conexionado: **2 estados** y **3 estados**.


    ---


    ### Terminales de lazo (comunes a ambos modos)


    - **T1** → Salida del lazo –  [F6]

    - **T2** → Salida del lazo + (con aislador interno activo) [F6]

    - **T3** → Entrada del lazo – [F6]

    - **T4** → Entrada del lazo + [F6]

    - **T5** → Salida del lazo + alternativa (ver nota de aislador) [F6]


    > **Nota sobre el aislador interno:** Si **no** se necesita aislamiento de cortocircuitos,
    conecta la salida + del lazo al **terminal 5** en lugar del terminal 2. El terminal
    5 está conectado internamente con el terminal 4 (M710) [F4] / terminal 2 (MI-DMMI)
    [F9]. Consulta el diagrama de tu variante para confirmar cuál aplica.


    ---


    ### Modo 2 estados


    - La entrada se conecta a los **terminales 6 y 7** [F1]

    - **Resistencia de fin de línea (RFL): 47 kΩ** [F1]

    - Un **cortocircuito** en la entrada se señaliza como **alarma** [F1]


    ---


    ### Modo 3 estados


    - La entrada se conecta igualmente a los **terminales 6 y 7** [F1]

    - **Resistencia de fin de línea (RFL): 47 kΩ** [F1]

    - Adicionalmente, se debe colocar una **resistencia de 18 kΩ en serie con cada
    contacto de alarma** [F1][F4][F6]

    - Esto permite que la central distinga un **cortocircuito como avería** en lugar
    de alarma, siempre que el panel de control lo permita [F4][F6]

    - Para el M710, la referencia de la resistencia de 18 kΩ es **M200E-EOL-R18**
    [F4][F5]


    ---


    ### Terminales sin conexión en el MI-DMMI / M710


    - Los **terminales 8 y 9** (circuito de aislador externo en línea de puntos) **no
    tienen conexión** en el MI-DMMI ni en el M710. Esa opción es exclusiva del MI-DMM2I
    / M720 [F3][F4][F9]


    ---


    ### Esquemas de conexión


    Los diagramas de cableado completos se encuentran en:

    - **Figura 3** del manual I56-2005-002 (M710/M720) [F4]

    - **Figura 3** del manual I56-2006-004 (MI-DMMI/MI-DMM2I) [F2]

    - **Figura 2** del manual I56-4406-001 (MI-DMMIE/MI-DMM2IE) [F8]


    Consulta directamente esas figuras para verificar la topología exacta del cableado
    antes de realizar las conexiones.


    ---


    **Fuentes:**

    - Conexionado-del-modulo-M710-MI-DMMI (sin revisión registrada)

    - I56-2005-002 M710 M720 M721 M701 (sin revisión registrada)

    - I56-2006-004 MI-DMMI_DMM2I_D2ICMO (sin revisión registrada)

    - I56-4406-001 MI-DMMIE MI-DMM2IE MI-D2ICMOE (sin revisión registrada)


    ---

    📖 **Información adicional del manual:**

    - "1. Si no se necesita el aislamiento de cortocircuitos, se debe conectar la
    salida + del lazo al terminal 5 en vez de al terminal 2. El terminal 5 está conectado
    internamente con el terminal 4.

    2. El circuito con línea intermitente conectado a los terminales 8 y 9 se debe
    utilizar únicamente con el M720. El M710 no tiene conexiones con estos terminales.

    3. Si el panel de control lo permite, se podrá indicar un cortocircuito como avería
    en lugar de alarma. Para ello hay que conectar una resistencia de 18 KΩ (M200E-EOL-R18)
    en serie con cada equipo que se desee supervisar." [F4]

    - "1. En no se necesita el aislamiento de cortocircuitos, se debe conectar la
    salida + del lazo al terminal 5 en vez de al terminal 2. El terminal 5 está conectado
    internamente con el terminal 2.


    2. Si el panel de control lo permite, se podrá indicar un cortocircuito como puede
    el lugar de alarma. Para ello hay que conectar una resistencia de 18 kΩ en serie
    con cada conmutador de alarma. Para ello hay que conectar una resistencia de 18
    kΩ en serie con cada conmutador de alarma." [F2]'
