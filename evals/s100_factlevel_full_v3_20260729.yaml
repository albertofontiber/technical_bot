- qid: hp013
  question: ¿Cómo se cambia la batería tampón de la Detnov ADW535 sin perder configuración?
  answer: "El manual no describe un procedimiento específico para cambiar la batería\
    \ de litio del ADW535 sin perder configuración. Los fragmentos disponibles no\
    \ cubren ese procedimiento paso a paso.\n\nLo que sí puedo confirmar a partir\
    \ de los fragmentos:\n\n**Sobre la batería de litio:**\n- La batería de litio\
    \ está ubicada en el **Main Board LMB 35** [F2][F3].\n- En la primera puesta en\
    \ funcionamiento, se indica que \"justo antes del primer encendido del ADW 535,\
    \ debe retirarse la cinta aislante de la batería de litio (LMB 35)\" [F6], lo\
    \ que confirma que es una batería con conector extraíble, pero no se describe\
    \ el procedimiento de sustitución en servicio.\n\n**Sobre la conservación de la\
    \ configuración:**\n- Los parámetros específicos del sistema se almacenan en una\
    \ **EEPROM** [F11], lo que es independiente de la batería de litio.\n- El firmware\
    \ está almacenado en la **Flash-PROM** [F11].\n- La batería de litio está asociada\
    \ al **módulo de reloj RTC** [F3] y al parámetro \"Fallo batería de litio / reloj\"\
    \ [F1], lo que indica que su función principal es mantener el reloj en tiempo\
    \ real, no la configuración.\n- Tras un **reset de hardware** (interrupción de\
    \ tensión o pulsador reset), \"los parámetros del ADW 535 programados con anterioridad\
    \ se mantienen (configuraciones específicas del sistema)\" [F5].\n\n**Advertencia\
    \ importante:**\n- Los trabajos de mantenimiento en el ADW 535 únicamente puede\
    \ llevarlos a cabo **personal autorizado y formado por el fabricante** [F4].\n\
    - Antes de cualquier trabajo, es imprescindible **bloquear o desconectar los controles\
    \ de incendios y alertas remotas** en la CDI de orden superior [F4].\n\n**Recomendación:**\
    \ Consulta directamente a Securiton/Detnov o al manual completo del ADW535 para\
    \ el procedimiento detallado de sustitución de la batería de litio del LMB 35.\n\
    \nFuente: ADW535_TD_T140358es_e (sin revisión registrada)\n\n---\n\U0001F4D6 **Información\
    \ adicional del manual:**\n- \"1. Bloquear o desconectar el control de incendios\
    \ y la alerta remota en la CDI de orden superior.\n\n2. La tensión de alimentación\
    \ de la CDI debe estar configurada para la central conforme a la normativa de\
    \ mantenimiento.\n\n3. Abrir la cubierta de la unidad de evaluación. Deberán efectuarse\
    \ las siguientes mediciones:\n   * Medir la tensión de servicio en los bornes\
    \ 1 (+), 2 (-) \U0001F87A Valor nominal = 10,8 a 13,8 V-CC (con 12 V-CC) o 21,6\
    \ a 27,6 V-CC (con 24 V-CC).\n   * Leer la configuración establecida y los valores\
    \ de presión de cada tubo sensor en la posición de conmutador *P* (véase el cap.\
    \ 7.6.1) y compararlos con el protocolo de puesta en servicio.\" [F4]"
