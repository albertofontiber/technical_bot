- qid: cat022
  question: En los detectores de llama Spectrex SharpEye 40/40, ¿qué diferencia hay
    entre el modelo 40/40L y el 40/40L4, y qué significa el sufijo «B» (p. ej. 40/40LB)?
  answer: '## Diferencias entre 40/40L, 40/40L4 y sufijo «B»


    Los fragmentos disponibles permiten responder parcialmente esta pregunta.


    ---


    ### Modelos cubiertos por el manual


    El manual MNDT722_40-40L cubre los modelos **S40/40L, LB, L4 y L4B** [F1], confirmando
    que son variantes de la misma familia.


    ---


    ### Diferencia entre 40/40L y 40/40L4: sensibilidad


    La diferencia documentada entre ambos modelos es su **ajuste de sensibilidad**
    [F2]:


    **40/40L y 40/40LB:**

    - Ajuste disponible: **15** → alcance **50 ft / 15 m** [F2]


    **40/40L4 y 40/40L4B:**

    - Ajuste disponible: **28** → alcance **93 ft / 28 m** [F2]


    Es decir, el modelo **40/40L4 tiene mayor alcance de detección** que el 40/40L
    según los ajustes de sensibilidad listados.


    ---


    ### Significado del sufijo «B»


    Los fragmentos del manual del 40/40L no definen explícitamente el sufijo «B» en
    texto. Sin embargo, en el manual del modelo 40/40U (familia equivalente), la tabla
    de versiones establece:


    - **U** → UV **sin** BIT (prueba incorporada) [F3]

    - **UB** → UV **con** BIT (prueba incorporada) [F3]


    Por analogía estructural con la nomenclatura de la misma familia SharpEye, el
    sufijo **«B» indica la presencia de BIT (Built-In Test / Prueba Incorporada)**.
    No obstante, esta definición aparece literalmente en el manual del 40/40U [F3],
    no en el del 40/40L [F1].


    > ⚠️ Para confirmar que esta definición aplica exactamente igual al 40/40L, consulta
    la sección de versiones del detector en el manual físico MNDT722_40-40L.


    ---


    ### Resumen


    - **40/40L**: detector UV/IR, alcance 15 m (ajuste 15) [F2]

    - **40/40L4**: detector UV/IR, mayor alcance 28 m (ajuste 28) [F2]

    - **Sufijo «B»** (ej. 40/40LB, 40/40L4B): incorpora BIT (prueba incorporada) [F3]


    ---


    **Fuentes:**

    - MNDT722_40-40L (sin revisión registrada)

    - Manual SharpEye 40/40 Series WinHost — TM777050 Rev. (Da), octubre 2017

    - MNDT723_40-40U (sin revisión registrada)'
