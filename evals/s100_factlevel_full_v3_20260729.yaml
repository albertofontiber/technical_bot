- qid: hp005
  question: En la Notifier ID3000, ¿cómo se programa una zona para que active una
    salida de sirena solo cuando haya coincidencia de dos detectores?
  answer: '## Programación de coincidencia de 2 detectores para activar sirena en
    ID3000


    La función que necesitas es **Coincidencia de 2 equipos** en la Matriz de Control.
    A continuación el procedimiento completo:


    ---


    ### Paso previo obligatorio: configurar dos instrucciones separadas


    ⚠️ **ADVERTENCIA EN54-2: 7.1.4** — No incluyas pulsadores manuales (MCP/PUL) en
    el grupo de coincidencia [F1][F2]. Debes crear **dos instrucciones de Matriz de
    Control**:


    - **Instrucción 1:** Entrada tipo **''Pulsador Manual'' (MCP)** → configurada
    como **''Simple''** (sin coincidencia), salida a sirena.

    - **Instrucción 2:** Entrada tipo analógico (p.ej. **''ANALÓGICA''**) → con coincidencia
    activada, salida a sirena. El grupo ANALÓGICO incluye detectores **TÉRMICOS, IÓNICOS,
    ÓPTICOS, VIEW y MULTISENSOR** [F1].


    Esto garantiza que los pulsadores activen la sirena directamente, mientras que
    los detectores requieren coincidencia.


    ---


    ### Procedimiento para la Instrucción 2 (coincidencia de detectores)


    **1. Accede a la Matriz de Control**

    Desde el menú **Parámetros Sistema**, selecciona **Matriz de control** [F12].
    También puedes acceder pulsando **\<F6>** durante la edición de sensores o módulos
    [F11].


    **2. Crea un nuevo evento de Matriz de Control**

    Selecciona **Añadir/Editar Entrada** [F12].


    **3. Selecciona la central** (solo en sistemas de red) [F3].


    **4. Define el ámbito de la entrada**

    Selecciona **''Una única zona''** en la opción de Coincidencia de Múltiples Zonas
    [F3]. Especifica la zona concreta donde están los detectores.


    > ⚠️ **Importante:** La función de coincidencia de zonas y la limitación por tipo
    **no pueden usarse simultáneamente** en la misma entrada de Matriz de Control
    [F2].


    **5. Selecciona el tipo de equipo**

    En el menú **''¿Limitado por TIPO?''**, elige el tipo correspondiente a tus detectores
    (p.ej. **CUALQUIER SENSOR ÓPTICO**, **CUALQUIER SENSOR TÉRMICO**, etc.) [F2].


    **6. Selecciona el tipo de coincidencia**

    En el menú **''Indique tipo de coincidencia''**, selecciona la opción **2: COINCIDENCIA
    2 EQUIPOS** [F2].


    > **Nota:** Las opciones **''UN ÚNICO EQUIPO''** y **''COINCIDENCIA 2 EQUIPOS''**
    siempre están disponibles. Las opciones 3 (n equipos) y 4 (p equipos) solo aparecen
    si están configuradas en los ajustes de la central (**Sección 11.21**) [F2].


    **7. Define la salida**

    Configura la salida hacia la **sirena** correspondiente [F11][F12].


    ---


    ### Condición de funcionamiento


    Para que se produzca la coincidencia, los **dos equipos en alarma deben estar
    en la misma zona o subzona** [F2]. Si trabajas con subzonas, puedes configurar
    si la coincidencia se extiende a un rango de subzonas en **Sección 11.21** [F2][F7].


    ---


    ### Configuración adicional (si necesitas ajustar niveles de coincidencia)


    En el software PK-ID3000, accede a **Modificar Opciones de la Central → pestaña
    Coincidencia de Alarma** (Sección 2.12) para configurar los niveles de coincidencia
    de equipos disponibles en la Matriz de Control [F4].


    ---


    Fuentes:

    - MCDT190 (sin revisión registrada)

    - MPDT190 (sin revisión registrada)

    - MCDT191 (sin revisión registrada)


    ---

    📖 **Información adicional del manual:**

    - "- Radio button: Deber estar en la misma Subzona

    - Radio button: Se extiende en el rango de Subzonas especificadas (labeled as
    4)" [F4]

    - "- Radio button: Misma Central o Red

    - Radio button: Siempre la misma Zona" [F4]


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "**Ejemplo 1** - Las salidas en la Zona 20 se activan si: las **entradas** en
    la Zona 3 o Zona 4 se activan, o las **entradas** en la Zona 1 y la Zona 5 se
    activan (coincidencia de zonas) pero no se activan ninguna entrada en la Zona
    2." (MPDT190, p. 89) [F10]'
