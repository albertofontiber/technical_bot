- qid: hp017
  question: ¿Cómo se programa el retardo de salida de alarma principal en la Notifier
    PEARL?
  answer: "El retardo de salida de alarma en la Pearl **no se configura como un parámetro\
    \ aislado**, sino que se programa dentro de las **reglas de causa-efecto** (Apéndice\
    \ 5 del Manual de configuración) [F1][F12].\n\n---\n\n## Cómo programar el retardo\
    \ de salida\n\n**1. Acceder a la edición de causa-efecto**\n\nNo puedo confirmar\
    \ de forma segura el número de menú de Causa y Efecto con los fragmentos servidos.\
    \ Confirma el manual y la revisión exactos antes de usar un número de menú.\n\n\
    > ⚠️ Si no se ha transferido un archivo de configuración previo, aparecerán dos\
    \ reglas por defecto. **Deben eliminarse si vas a crear reglas personalizadas**\
    \ [F11].\n\n**2. Asignar el tipo de retardo a la regla**\n\nDentro de cada regla\
    \ de causa-efecto, se puede asignar uno de **seis tipos de retardo de salida**\
    \ [F1]. Los tipos disponibles son [F2]:\n\n- **Fijo**\n- **Estándar**\n- **No\
    \ Silenc.**\n- **Est. Ext.** (Estándar con extensión)\n- **RetExtStd**\n- **No\
    \ Sil. Ext**\n- **SinRetExt**\n\nEl tipo de retardo determina qué acciones puede\
    \ realizar el usuario mientras el retardo está activo [F1].\n\n**3. Comportamiento\
    \ de cada tipo de retardo**\n\nLas diferencias clave entre tipos son [F2]:\n\n\
    - **La salida se detiene al pulsar SILENCIAR SIRENAS durante el retardo:**\n \
    \ Sí en: Estándar, Est. Ext., RetExtStd\n  No en: Fijo, No Silenc., No Sil. Ext.,\
    \ SinRetExt\n\n- **El retardo puede anularse (nivel acceso 2, opción «Anular retardos»):**\n\
    \  Sí en: Estándar, No Silenc., Est. Ext., RetExtStd, No Sil. Ext., SinRetExt\n\
    \  No en: Fijo\n\n- **El tiempo restante se muestra en la pestaña ALARMA:**\n\
    \  Sí en: Estándar, No Silenc., Est. Ext., RetExtStd, No Sil. Ext., SinRetExt\n\
    \  No en: Fijo\n\n- **El retardo puede detenerse pulsando FIN RETARDO (nivel acceso\
    \ 2):**\n  Sí en: Estándar, No Silenc., Est. Ext., RetExtStd, No Sil. Ext., SinRetExt\n\
    \  No en: Fijo\n\n- **La salida se detiene al pulsar AMPLIAR RETARDO:**\n  Sí\
    \ en: Est. Ext., No Sil. Ext.\n  No en: el resto\n\n- **El temporizador comienza\
    \ en RETARDO AMPLIADO:**\n  Sí en: RetExtStd, SinRetExt\n  No en: el resto\n\n\
    **4. Método de programación recomendado**\n\nSe recomienda usar el **programa\
    \ de configuración por ordenador** como método principal. El menú de la central\
    \ debe emplearse solo para modificaciones menores [F12].\n\n---\n\n## Notas operativas\
    \ adicionales\n\n- El LED **RETARDO ACTIVO** se enciende cuando hay un retardo\
    \ configurado y activo [F3].\n- El operador puede **anular/habilitar** los retardos\
    \ desde el menú **«Anular/Habilitar» → «5: Retardo Activación Salidas»** (nivel\
    \ de acceso 2) [F3].\n- La tecla **AMPLIAR RETARDO** puede desactivarse desde\
    \ los parámetros de la central (opción **«10: Extend Delay Button»**) si no se\
    \ requiere en el mercado de instalación [F5].\n- La tecla **FIN RETARDO** está\
    \ disponible en nivel de acceso 1 para poner fin a cualquier retardo activo [F4].\n\
    \n---\n\n> ⚠️ **Aviso:** Al programar reglas de causa-efecto, evita lógicas contradictorias.\
    \ Es vital probar todas las reglas durante la puesta en marcha para verificar\
    \ que no haya conflictos [F12].\n\n---\n\n**Fuentes:**\n- Manual de configuración\
    \ de la central Pearl, 997-671-005-3\\_Configuration\\_ES (rev. 997-671-005-3)\n\
    - Manual de funcionamiento Pearl, 997-670-005-3\\_Operating\\_ES (sin revisión\
    \ registrada)\n\n---\n⚠️ **Información adicional del manual:**\n- \"**Es de vital\
    \ importancia probar rigurosamente todas las reglas durante la puesta en marcha\
    \ del sistema para verificar que no haya conflictos lógicos entre ellas.**\" [F12]\n\
    - \"**Al programar reglas de causa-efecto evite las lógicas contradictorias.**\"\
    \ [F12]\n- Nota: el manual también indica: \"Si no se ha transferido a la central\
    \ un archivo de configuración, el usuario encontrará aquí las dos reglas de causa-efecto\
    \ por defecto.\" [F11] · \"| Acción de usuario/indicación de estado          \
    \                                                                          | Tipos\
    \ de retardo<br/>Fijo | Tipos de retardo<br/>Estándar | Tipos de retardo<br/>No\
    \ Silenc | Tipos de retardo<br/>Est. Ext. | Tipos de retardo<br/>RetExtStd | Tipos\
    \ de retardo<br/>No Sil. Ext | Tipos de retardo<br/>SinRetExt |\n| -------------------------------------------------------------------------------------------------------------------------\
    \ | ------------------------- | ----------------------------- | ------------------------------\
    \ | ------------------------------ | ------------------------------ | --------------------------------\
    \ | ------------------------------ |\n| La salida se detiene si se pulsa SILENCIAR\
    \ SIRENAS durante el retardo. Si pulsa SONIDO ALARMAS, se activarán las sirenas.\
    \ | ×                         | ✓                             | ×            \
    \                  | ✓                              | ✓                      \
    \        | ×                                | ×                              |\n\
    | El retardo puede anularse en el nivel de acceso 2 con la opción «Anular retardos»\
    \                                         | ×                         | ✓    \
    \                         | ✓                              | ✓               \
    \               | ✓                              | ✓                         \
    \       | ✓                              |\n| El tiempo de retardo restante se\
    \ muestraen la pestaña ALARLMA.                                              \
    \              | ×                         | ✓                             | ✓\
    \                              | ✓                              | ✓          \
    \                    | ✓                                | ✓                  \
    \            |\n| El retardo activo puede detenerse en el nivel de acceso 2 pulsando\
    \ FIN RETARDO.                                           | ×                 \
    \        | ✓                             | ✓                              | ✓\
    \                              | ✓                              | ✓          \
    \                      | ✓                              |\n| La salida se detiene\
    \ si se pulsa AMPLIAR RETARDO                                                \
    \                          | ×                         | ×                   \
    \          | ×                              | ✓                              |\
    \ ×                              | ✓                                | ×      \
    \                        |\n| El temporizador comienza en RETARDO AMPLIADO   \
    \                                                                           |\
    \ ×                         | ×                             | ×              \
    \                | ×                              | ✓                        \
    \      | ×                                | ✓                              |\"\
    \ [F2]\n\n---\n\U0001F4CB **Obligaciones de evidencia del manual:**\n- Nota: la\
    \ fuente es inconsistente: \"Se puede asignar uno de seis tipos de retardo de\
    \ salida a una regla, como se explica a continuación.\" (997-671-005-3_Configuration_ES,\
    \ p. 44) [F1] declara 6 tipos y la enumeración servida lista 8 (997-671-005-3_Configuration_ES,\
    \ p. 44) [F1]."
