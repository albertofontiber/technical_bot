- qid: hp008
  question: ¿Qué detectores de humo analógicos son compatibles con la Notifier ID3000?
  answer: 'Los detectores de humo analógicos compatibles con la ID3000 son los siguientes:


    **Sensores de humo ópticos:**

    - **SDX-751EM** — Óptico [F1][F3]

    - **SDX-751** — Óptico [F3]

    - **SDX551E** — Óptico [F3]

    - **SDX-551THE** — Óptico [F3]

    - **HPX-751E** — Óptico HARSH/FILTREX [F1][F3]

    - **IDX-751** — Óptico intrínsecamente seguro HAZARD [F1][F3]


    **Sensores de humo iónicos:**

    - **CPX-751E** — Iónico (bajo perfil) [F1][F3]

    - **CPX-551E** — Iónico [F3]


    **Sensores combinados humo/térmico (multicriterio):**

    - **SDX-751TEM** — Optiplex (combinado térmico/humo) [F1][F3]

    - **IRX-751CTEM** — SMART 4 (óptico/térmico/infrarrojo/CO) [F3]

    - **IRX-751TEM** — SMART 3 [F3]


    **Sensores de humo láser (VIEW™):**

    - **FSL-751E** — VIEW (humo láser) [F1]

    - **LPX-751** — VIEW [F2][F3]


    **Nota importante:** Todos estos equipos utilizan el **protocolo de comunicaciones
    Notifier** [F1]. La ID3000 también es compatible con detectores por rayo **LPB500**
    (máximo 4 por lazo) y **LBP-700 / -700T** [F3], aunque estos no son detectores
    de humo analógicos convencionales.


    ---


    Fuentes: MPDT190 — Panel ID3000, Manual de programación (sin revisión registrada);
    MIDT190 — Panel ID3000, Manual de instalación y puesta en marcha (sin revisión
    registrada)'
