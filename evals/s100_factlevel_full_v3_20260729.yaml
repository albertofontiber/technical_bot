- qid: cat023
  question: En el detector de humos por aspiración Securiton ASD532, ¿qué clases de
    sensibilidad según EN 54-20 ofrece y cómo se configura la monitorización del flujo
    de aire?
  answer: '## ASD532 — Clases EN 54-20 y configuración de monitorización de flujo
    de aire


    El **ASD 532** cumple las tres clases de la norma **EN 54-20** [F8]:


    - **Clase A** — Sensibilidad muy alta

    - **Clase B** — Sensibilidad alta

    - **Clase C** — Sensibilidad normal


    ---


    ### Sensores de humo disponibles según clase


    La elección del sensor determina el rango de sensibilidad alcanzable [F1][F9]:


    - **SSD 532-1** — Rango de alarma: **0,5 %/m hasta 10 %/m**

    - **SSD 532-2** — Rango de alarma: **0,1 %/m hasta 10 %/m**

    - **SSD 532-3** — Rango de alarma: **0,02 %/m hasta 10 %/m**


    > ⚠️ Solo deben instalarse los sensores detallados en la certificación del dispositivo.
    El uso de otros tipos revoca la certificación del ASD 532 [F6].


    ---


    ### Configuración de la sensibilidad (posiciones de conmutador)


    Hay dos vías de configuración [F1][F7]:


    1. **Sin software de cálculo (EasyConfig):** Se selecciona directamente la posición
    de conmutador predefinida en el mando del **AMB 32** según los capítulos 4.4.4.3
    y 7.3.3 [F3].

    2. **Con software «ASD PipeFlow»:** Se calcula el proyecto y el resultado se introduce
    en el software de configuración **«ASD Config»**, seleccionando después las posiciones
    **X01, X02 o X03** [F7].


    **Posiciones normativas (homologadas EN 54-20)** [F3]:


    - **A11** → Clase A

    - **b11 / b21** → Clase B

    - **C11 / C21 / C31** → Clase C


    ---


    ### Monitorización del flujo de aire


    El sistema usa **medición calorimétrica (técnica de medición de flujo en masa)**
    [F2].


    **Principio de funcionamiento:**

    1. Al ejecutar el **reset inicial** (posición de conmutador **U01**) con el conducto
    de aspiración intacto y limpio, el ASD 532 registra y memoriza los valores de
    flujo como **valores nominales al 100 %** [F2][F3].

    2. El sistema crea electrónicamente una **ventana de monitorización** centrada
    en ese 100 % [F2].

    3. Si los valores reales se salen de la ventana, se dispara el aviso **«Fallo
    flujo de aire»** [F2].


    **Parámetros normativos EN 54-20 (posiciones A11 a C31)** [F2]:


    - Desviación máxima permitida: **±20 %** (es decir, por debajo del **80 %** por
    suciedad/obstrucción, o por encima del **120 %** por rotura de tubo)

    - Tiempo de retardo (LS-Ü): **300 s**


    **Compensaciones incluidas** [F2]:

    - Función de **tiempo de retardo** ajustable para descartar turbulencias de aire

    - **Circuito de compensación de temperatura** para mitigar fluctuaciones ambientales


    ---


    ### Posiciones no normativas (W01–W44)


    Para casos especiales, existen posiciones con parámetros distintos [F4][F5]:


    - Tiempos de retardo disponibles: **10 min** o **60 min**

    - Desviaciones disponibles: **±20 %** o **±50 %**

    - Ejemplos: W01 (Clase A, ±20 %, 10 min), W03 (Clase A, ±50 %, 10 min), W25 (Clase
    C, ±20 %, 10 min)...


    > ⚠️ **ADVERTENCIA CRÍTICA:** Las posiciones **W01 a W44** cumplen la sensibilidad
    de alarma según EN 54-20, pero los valores de monitorización de flujo de aire
    **NO están homologados según EN 54-20**. Solo deben utilizarse **previa consulta
    con el fabricante** [F2][F5][F7].


    ---


    ### Ajuste de la ventana de monitorización con «ASD Config»


    Si se realizan adaptaciones mediante software [F7]:


    - Aumentar la ventana por encima de **±20 %** o el tiempo de retardo por encima
    de **300 s** implica **incumplimiento de EN 54-20** y requiere consulta con el
    fabricante.

    - El tamaño de la ventana **no debería quedar por debajo de ±20 %**. Si se usan
    ventanas más pequeñas, el tiempo de retardo debe aumentarse a **10 min como mínimo**.

    - Ventanas por debajo de ±20 % con tiempo de retardo ≤ 300 s aumentan el riesgo
    de **avisos de fallo erróneos**.


    ---


    **Fuente:** ASD532_TD_T140421es_a — ASD 532, Descripción técnica (sin revisión
    registrada)


    ---

    📋 **Obligaciones de evidencia del manual:**

    - Nota: la fuente es inconsistente: "El detector de humos por aspiración ASD 532
    incluye dos lugares de montaje para módulos adicionales." (ASD532_TD_T140421es_a,
    p. 13) [F9] declara 2 lugares y la enumeración servida lista 3 (ASD532_TD_T140421es_a,
    p. 13) [F9].

    - "Según EN 54-20, debe notificarse como fallo toda variación del flujo de aire
    superior al ±20 %." (ASD532_TD_T140421es_a, p. 24) [F2]

    - "Con carácter general, para la instalación, el proyecto y el uso del detector
    de humos por aspiración ASD 532 serán aplicables las disposiciones y directrices
    específicas de cada país." (ASD532_TD_T140421es_a, p. 37) [F8]'
