- qid: hp010
  question: En la Morley DXc, ¿cómo se añade un nuevo detector al lazo tras la puesta
    en marcha inicial?
  answer: "# Añadir un nuevo detector al lazo en la Morley DXc\n\nEl procedimiento\
    \ es la **Autobúsqueda de equipos**, accesible desde el menú de Lazos en Nivel\
    \ de acceso de programador.\n\n---\n\n## Pasos\n\n1. **Conecta físicamente el\
    \ nuevo detector** al lazo, respetando la polaridad positivo/negativo [F2]. Asegúrate\
    \ de que el cableado sigue el bucle cerrado [F2].\n\n2. **Accede al menú de Lazos**\
    \ en la central DXc (Nivel de programador).\n\n3. **Pulsa la tecla `2`** para\
    \ seleccionar la función **'Autobúsqueda'** [F1]:\n\n   ```\n   [Lazo]\n   1:Confg.Equipos\
    \   2:Autobusqueda\n   ```\n\n4. **Si la central tiene más de un lazo**, introduce\
    \ el número del lazo donde has conectado el nuevo detector y pulsa ⊙ [F1]:\n\n\
    \   ```\n   [Autobusqueda]\n   Sel.Num.Lazo (1-2) :1\n   ```\n\n5. **Confirma\
    \ la autobúsqueda** pulsando ⊙ cuando aparezca la pantalla de confirmación [F1]:\n\
    \n   ```\n   [Autobusqueda]\n   Lazo: 1  Autobusqueda?\n   ```\n\n6. **Espera**\
    \ a que finalice el proceso (se muestra barra de progreso) [F1]:\n\n   ```\n \
    \  [Autobusqueda]\n   Lazo: 1 Reconocimiento en progreso...\n   ```\n\n7. **Verifica\
    \ el resumen de resultados**. El campo **'Nuevos'** debe reflejar el/los detector(es)\
    \ añadidos. Comprueba que el total y los tipos coinciden con los equipos físicamente\
    \ instalados [F1]:\n\n   ```\n   [Lazo]\n   Lazo: 1           Total: 13\n   Nuevos:1\
    \          Elimin.:0  Cambiad:0\n   ```\n\n8. **Pulsa ⊞** para salir de la pantalla\
    \ de resultados y regresar al menú de Lazo [F1].\n\n---\n\n## ⚠️ Aviso importante\n\
    \nSi en tu instalación el protocolo del lazo es seleccionable y has realizado\
    \ un cambio de protocolo previamente, **espera dos minutos antes de ejecutar la\
    \ autobúsqueda**. La central necesita ese tiempo para rearmar los equipos del\
    \ lazo [F1].\n\n---\n\n> **Nota:** El resumen final muestra subtotales por tipo\
    \ de equipo (ION, OPT, TMP, MLT, PUL, MON, SIR, REL, OTROS). Consulta la **Tabla\
    \ 4** del manual para el significado de cada abreviatura [F1].\n\n---\n\n**Fuente:**\
    \ DXc_Manual de configuracion (sin revisión registrada)\n\n---\n\U0001F4CB **Obligaciones\
    \ de evidencia del manual:**\n- Nota: la fuente es inconsistente: \"PUL: 4 MON:\
    \ 0 SIR: 2 REL: 1 OTROS : 2\" (DXc_Manual de configuracion, p. 48) [F1] declara\
    \ 1 OTROS y la enumeración servida lista 5 (DXc_Manual de configuracion, p. 48)\
    \ [F1]."
