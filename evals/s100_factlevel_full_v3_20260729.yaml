  question: '¿Como se configura una maniobra (causa-efecto) completa en la Detnov
    CAD-250: como se crea, como se definen las entradas/eventos que la disparan y
    como se asignan las salidas?'
  answer: "# Configuración de una maniobra completa en la CAD-250\n\nLa maniobra en\
    \ la CAD-250 es una relación causa-efecto: uno o varios **eventos** (entradas)\
    \ disparan una o varias **acciones** (salidas), con una lógica de coincidencias\
    \ configurable [F1].\n\n---\n\n## PASO 1 — Crear la maniobra\n\n1. Accede al menú:\
    \ **MENU > MANIOBRAS** [F1]\n2. Pulsa **+AÑADIR** en la barra de navegación inferior\
    \ [F1]\n3. Se abre la pantalla de edición de la maniobra. El contador muestra\
    \ el número de maniobra actual (ej: *Maniobra 0001*) [F4]\n4. En el campo **COINCIDENCIAS**,\
    \ indica cuántos eventos deben cumplirse simultáneamente para que la maniobra\
    \ se active [F4]\n\n---\n\n## PASO 2 — Definir las entradas (EVENTOS)\n\n1. Pulsa\
    \ **AÑADIR** en el margen inferior de la pantalla principal [F2]\n2. En la pantalla\
    \ emergente, selecciona **EVENTO** [F2]\n3. Elige el tipo de evento [F2]:\n  \
    \ - **ENTIDAD**: cualquier elemento de la jerarquía del sistema (instalación,\
    \ panel, lazo, área, zona, dispositivo, grupo o modo virtual), tanto local como\
    \ en red [F2]\n   - **CONDICIÓN TEMPORAL**: establece un periodo de tiempo durante\
    \ el cual la condición de entrada es verdadera [F2]\n\n4. Si seleccionas **ENTIDAD**,\
    \ accedes a la pantalla **EVENTO DE LA ENTIDAD** donde configuras [F5]:\n   -\
    \ **Origen**: local o red [F5]\n   - **Condición**: alarma, avería, técnico [F5]\n\
    \   - **Tipo**: todos, pulsador, detector o entradas [F5]\n   - **Estado lógico**:\
    \ normal o negado (si se selecciona negado, la condición es válida cuando NO se\
    \ da el estado indicado) [F5]\n   - **Repeticiones**: valor entero hasta **9999**;\
    \ el evento debe repetirse ese número de veces en la entidad para que la entrada\
    \ sea válida [F2][F5]\n\n5. Repite el proceso para añadir tantos eventos como\
    \ necesites. El número máximo total de entradas y salidas entre todas las maniobras\
    \ es de **100.000** [F2][F10]\n\n> ⚠ La configuración gestiona **eventos** (cambios\
    \ de estado), no estados estáticos. Solo el cambio de estado que coincida con\
    \ la condición establecida disparará las salidas [F2].\n\n> Desde la versión **1.1.1**\
    \ es posible seleccionar un elemento de salida como condición de entrada; en ese\
    \ caso, será el cambio a condición de avería el que hará verdadera la entrada.\
    \ Para ello, desmarca la casilla **\"Sólo dispositivos de entrada\"** [F9].\n\n\
    ---\n\n## PASO 3 — Configurar la lógica de COINCIDENCIAS\n\nEl campo **COINCIDENCIAS**\
    \ determina cuántos eventos deben ser verdaderos para activar las salidas [F4][F6]:\n\
    \n- **Coincidencias = 1** con 2 eventos → comportamiento **OR**: basta con que\
    \ cualquiera de los eventos se cumpla [F4][F6]\n- **Coincidencias = 2** con 2\
    \ eventos → comportamiento **AND**: deben cumplirse los dos eventos [F4][F6]\n\
    - **Coincidencias = 3** con 4 eventos → deben cumplirse 3 de los n eventos, cualesquiera\
    \ de ellos [F4]\n\nUn evento es verdadero cuando se cumplen **todas** las premisas\
    \ establecidas para ese evento [F9].\n\n---\n\n## PASO 4 — Definir las salidas\
    \ (ACCIONES)\n\n1. Pulsa **AÑADIR** en el margen inferior de la pantalla principal\
    \ [F3]\n2. En la pantalla emergente, selecciona **ACCION** [F3]\n3. Aparecen los\
    \ campos [F3]:\n   - **Retraso**: tiempo configurable entre **0 y 600 segundos**\
    \ antes de iniciar la acción; se inicia cuando la condición de entrada es verdadera\
    \ [F3][F5]\n   - **Entidad**: panel, lazo, área, zona, dispositivo, grupo o modo\
    \ virtual (siempre entidades del sistema local) [F3]\n\n4. En la pantalla **ACCION\
    \ DE LA ENTIDAD** configuras [F3][F7]:\n\n   **Acción disponible:**\n   - **Activar**:\
    \ activa las salidas\n   - **Desactivar**: desactiva las salidas\n   - **Habilitar**:\
    \ habilita la entidad\n   - **Deshabilitar**: deshabilita la entidad\n   - **Test**:\
    \ pone en modo test la entidad\n   - **Reiniciar**: reinicia la entidad\n   -\
    \ **Pulso**: activa las salidas con anchura de pulso configurable entre **0 y\
    \ 600 segundos** (por defecto **10 segundos**)\n   - **Configuración**: permite\
    \ la cancelación de retardos [F7]\n\n   **Tipo de elemento:**\n   - **Todos**:\
    \ todas las salidas de la entidad\n   - **Sirenas**: únicamente las sirenas\n\
    \   - **Relés**: únicamente los relés\n   - **Sirena discontinua**: sirenas en\
    \ modo discontinuo\n   - **Sirena PCB1**: sirena 1 de la central\n   - **Sirena\
    \ PCB2**: sirena 2 de la central [F7]\n\n   > Las opciones disponibles dependen\
    \ de la entidad seleccionada. Consulta la tabla de compatibilidad Tipo/Entidad\
    \ del manual [F7][F8].\n\n5. Pulsa **GUARDAR** para actualizar la base de datos\
    \ [F7]\n\n> ⚠ El programa **no permite mezclar acciones sobre entidades de paneles\
    \ diferentes** dentro de la misma maniobra [F10].\n\n---\n\n## RESUMEN DEL FLUJO\n\
    \n**Entradas (Eventos)** → **Lógica (Coincidencias)** → **Salidas (Acciones)**\
    \ [F1][F11]\n\n---\n\n## NOTA SOBRE HERRAMIENTAS ADICIONALES\n\n- **Grupos** [F1]:\
    \ permiten agrupar elementos (áreas, zonas, dispositivos) para facilitar la creación\
    \ de reglas de actuación [F12]\n- **Módulos virtuales** [F1]: permiten crear bucles\
    \ interdependientes; un conjunto de entradas determina el estado del módulo virtual,\
    \ que a su vez puede actuar como entrada de otra maniobra [F1][F11]\n\n---\n\n\
    > ⚠ **Advertencia de seguridad**: La programación de maniobras es una de las funciones\
    \ más críticas de la configuración del sistema. Requiere conocimiento específico\
    \ del sistema instalado, del plan de protección y del producto [F5].\n\n---\n\n\
    **Fuentes:**\n- CAD-250 Manual de Configuración MC-380-es-2026-c (rev. c, 2026-04-23)\n\
    - CAD-250 Manual de Software de Configuración MS-416-es-2026-b (rev. b)\n\n---\n\
    \U0001F4D6 **Información adicional del manual:**\n- \"Screenshot 1: Shows the\
    \ main interface with \"Panel 12 08:08 - viernes, 19 de abril de 2019\" at top,\
    \ displaying \"Maniobra 0001\" with \"Borrar maniobra\" button and \"MANIOBRAS\"\
    \ section. Left sidebar shows menu items: LAZO, SECTORIZACION, MANIOBRAS, LOGS,\
    \ RED, AJUSTES, INSTALACION. The main area shows \"Coincidencias: Eventos\" and\
    \ \"Acciones\" tabs with a hand cursor pointing to an add button.\n\nScreenshot\
    \ 2: Shows a popup dialog titled \"Seleccione Eve\" with two options: \"EVENTO\"\
    \ and \"ACCION\"\n\nScreenshot 3: Shows \"Seleccione tipo de evento\" dialog with\
    \ options for \"ENTIDAD\" and \"CONDICION TEMPORAL\", with a \"CERRAR\" button\
    \ and \"Evento de entidad\" label with \"Repeticiones =? 3\" notation\n\nScreenshot\
    \ 4: Shows a diagram with numbered nodes (1, 2, 3) connected in sequence, with\
    \ a counter showing \"Contador 0\" and \"Entidad\" field with \"una entidad\"\
    \ text, and \"Repeticiones =? 3\" label with \"CANCELAR\" button\n\nScreenshot\
    \ 5: Shows \"Seleccionar entidad\" dialog with two options: \"Local\" and \"Red\"\
    , with a \"CLOSE\" button at bottom]\" [F2]\n- \"- Filtro deEvento/Acción (Event/Action\
    \ Filter)\n- Botón borrar maniobra (Delete maneuver button)\n- Filtro de panel\
    \ (Panel filter)\n- Nº de maniobra (Maneuver number: 0002)\n- Borrar maniobra\
    \ (Delete maneuver button)\n- Panel: 1\n- Coincidencias: (Coincidences)\n- Eventos\
    \ section showing:\n  - Lapso tiempo: desde enero hasta febrero desde lunes hasta\
    \ viernes desde Hora: 00:00:00 hasta Hora: 10:00:00\n  - Alarma cualquiera en\
    \ Panel: Panel_template\n- Acciones section showing:\n  - Activar en L:1\n  -\
    \ Activar en Panel: Panel_template\n- Seleccione para editar o borrar el elemento\
    \ (Select to edit or delete element)\n- Botón borrar elemento (Delete element\
    \ button)\n- Botón editar elemento (Edit element button)\n- Cuadro de eventos\
    \ (Events box)\n- Cuadro de acciones (Actions box)\n- Añadir evento temporal (Add\
    \ temporary event)\n- Borrar elemento (Delete element)\n- Editar (Edit)\" [F10]"
