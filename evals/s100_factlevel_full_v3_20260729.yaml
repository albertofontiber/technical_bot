- qid: cat013
  question: Tengo una central Detnov CAD-150 y me ha sobrado de otra instalacion un
    detector optico Notifier SDX-751; ¿es compatible / puedo montarlo en su lazo?
  answer: 'La respuesta directa es: **no tengo documentación de la CAD-150 en los
    fragmentos recuperados que liste sus detectores compatibles**, por lo que no puedo
    confirmar ni descartar la compatibilidad del SDX-751 con esa central.


    Lo que sí puedo decirte sobre el SDX-751 a partir de los fragmentos disponibles:


    - El **SDX-751** aparece listado como detector compatible en la central **AFP-200**
    de Notifier [F1][F4], en la central **ID-200** de Notifier [F2][F5], y en la central
    **ID3000** de Notifier [F3].

    - En todos esos casos se trata de un **detector analógico fotoeléctrico de bajo
    perfil** [F4][F5], direccionable mediante microinterruptores rotatorios decádicos
    [F4][F5].

    - Para la AFP-200 y la ID-200, el SDX-751 requiere la base **BX-501** (AFP-200)
    [F1] o **B501** (ID-200) [F2] para conectarse al lazo de comunicaciones.


    **Lo que no tengo:**

    Los fragmentos de la CAD-150 recuperados [F6][F7][F8][F9][F10] corresponden a
    descripciones del panel, menús de usuario y LEDs, pero **ninguno incluye la lista
    de detectores compatibles con el lazo de la CAD-150**. No puedo afirmar compatibilidad
