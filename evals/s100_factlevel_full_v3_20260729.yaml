- qid: cat020
  question: En una central Morley DXc instalada en Espana, ¿cual es el nivel de alarma
    y de prealarma por defecto de los detectores, y el maximo configurable?
  answer: '## Niveles de alarma y prealarma por defecto en la central Morley DXc


    Para los detectores con protocolo **Morley-IAS**, los valores por defecto son:


    - **Nivel de alarma por defecto: 100%** [F1]

    - **Nivel de prealarma por defecto: 80%** [F1]


    Estos valores se expresan como número normalizado entre **0% – 100%**, independientemente
    del tipo de equipo [F1].


    ---


    ### Máximo configurable


    - **Nivel de alarma máximo: 108%** [F1]

    - **Nivel de prealarma:** el rango configurable es de **80 a 108%**, con la restricción
    de que el nivel de prealarma **no puede ser superior al nivel de alarma** [F6]


    > ⚠️ El panel no permite seleccionar niveles que impidan el reconocimiento de
    alarmas [F6].


    ---


    ### Caso especial: detectores Multicriterio (OTM) y Láser


    Estos detectores no usan porcentajes sino **niveles numerados**. Los valores recomendados
    por defecto son [F2]:


    **Detector Óptico-Térmico (OTM):**

    - Prealarma recomendada: **Nivel 3** (valor analógico 72, sensibilidad 6,5% osc./m)

    - Alarma recomendada: **Nivel 4** (valor analógico 86, sensibilidad 6,5% a 11,5%
    osc./m autoajustado)


    **Detector Láser:**

    - Prealarma recomendada: **Nivel 4** (valor analógico 69, sensibilidad 0,32% osc./m)

    - Alarma recomendada: **Nivel 5** (valor analógico 76, sensibilidad 0,65% osc./m)


    Esto se puede verificar en la pantalla de la central, donde aparece por ejemplo
    [F1]:

    ```

    Fuego    : Niv4

    Prealarma: Niv3

    ```


    ---


    > ⚠️ **Advertencia:** Se desaconseja modificar los valores por defecto salvo para
    aplicaciones especiales. Cualquier cambio debe garantizar que el sistema mantiene
    los niveles de seguridad en detección y no provoca falsas alarmas [F6].


    ---


    **Fuentes:**

    - DXc_Manual variaciones de mercado, sección 5.3.10.4 y 5.3.10.5.1 (sin revisión
    registrada) [F1]

    - DXc_Manual variaciones de mercado, sección 5.3.10.3 (sin revisión registrada)
    [F2]

    - MIE-MP-520rv04, sección 7.3.9.4.3 (rev. 4) [F6]


    ---

    📖 **Información adicional del manual:**

    - "### 5.3.10.5.1 Información específica para protocolo Morley-IAS


    • El valor analógico debe ser un número normalizado entre 0% – 100%, independientemente
    del tipo de equipo. Para los detectores, el nivel de prealarma por defecto es
    el 80% y el nivel de alarma por defecto es el 100%.


    • El ajuste máximo para el nivel de alarma es el 108%." [F1]


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "el umbral de alarma de fuego depende del ajuste del nivel/modo y es diferente
    para cada nivel de alarma." (DXc_Manual variaciones de mercado, p. 5) [F2]

    - "Estos valores se definen para cada equipo y su configuración es automática
    en la central de forma que el valor del pulso analógico varia para cada equipo,
    pero los recomendados por el fabricante se corresponden siempre con «100» para
    alarma y «80» para prealarma." (MIE-MI-320, p. 3) [F8]'
