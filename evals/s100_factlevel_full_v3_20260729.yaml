- qid: hp001
  question: En la Detnov CAD-250, ¿cómo se entra al menú de programación avanzada?
  answer: '## Acceso al menú de programación avanzada — CAD-250


    La ruta de acceso es la siguiente [F1]:


    **AJUSTES** (Menú principal) **> AVANZADO** (Submenú)


    ### Pasos completos:


    1. Desde la **pantalla de reposo**, toca el icono del **candado (🔒)** [F2].

    2. Introduce la **clave de administrador** (por defecto: **2222**) [F2].

    3. En el **Menú Principal** (barra lateral izquierda), selecciona **AJUSTES**
    [F1].

    4. En el **Submenú** (barra lateral derecha), selecciona **AVANZADO** [F1].


    ### Una vez dentro, dispones de 3 pestañas [F1]:


    - **SISTEMA** — Configura número de cabinas (PANELES: 1 a 4), número de lazos
    y si hay cabina con LEDs de zona [F1].

    - **OTROS** — Interruptores para facilitar puesta en marcha y mantenimiento (tiempo
    de inactividad, salto a scroll si incidentes, timeout, etc.) [F1][F6].

    - **REINICIAR** — Devuelve los valores de configuración del panel a valores por
    defecto (no afecta a entidades, lazos, maniobras, grupos, módulos virtuales, modos
    especiales, filtros de red ni registros de eventos) [F6].


    > ⚠️ **Aviso:** El acceso con privilegios de administrador puede provocar mal
    funcionamiento de la instalación si se usa de forma indebida. Asegúrate de tener
    la autorización necesaria [F2].


    ---


    **Fuente:** CAD-250 Manual de Configuración MC-380-es-2026-c (rev. c, 2026-04-23)'
