- qid: cat005
  question: ¿Cuáles son las características técnicas de la central de detección de
    gas Fidegas CS4, y en qué se diferencian las versiones digital y analógica?
  answer: "# Características técnicas de la central Fidegas CS4\n\nLa CS4 es una central\
    \ de alarmas para detección de gas disponible en dos versiones: **digital** (código\
    \ de producto **3244**) y **analógica** (código de producto **3270**) [F1].\n\n\
    ---\n\n## Especificaciones técnicas comunes a ambas versiones\n\n- **Tensión de\
    \ alimentación:** 110–230 Vac, 50–60 Hz [F1]\n- **Potencia:** 30 W, Clase II [F1][F3]\n\
    - **Firmware:** versión 1.2 [F3][F8]\n- **Número de entradas:** hasta 4 sensores\
    \ remotos simultáneos [F1][F2]\n- **Salidas:** 2 salidas conmutadas LP (relé apto\
    \ para 230 Vac) con contactos NA-C-NC [F1]\n- **Corriente máxima:** 250 mA [F1]\n\
    - **Rearme:** seleccionable manual o automático [F1]\n- **Umbral de alarma:**\
    \ 20% del fondo de escala [F2][F6]\n- **Dimensiones:** 90 × 106 × 58 mm [F1]\n\
    - **Peso:** 300 g [F1]\n- **Montaje:** carril DIN o armario de superficie [F2]\n\
    \n---\n\n## Indicaciones (comunes a ambas versiones)\n\n- **Led verde PWR:** alimentación\
    \ presente (fijo) / corte de red (intermitente) [F2]\n- **Led bicolor ON/ALARM**\
    \ por sensor: presencia de sensor remoto (verde) / alarma (rojo) [F2]\n- **Led\
    \ amarillo ERROR** por sensor: avería de sensor remoto [F2]\n- **Led verde OUT1\
    \ / OUT2:** salida activa (verde) / desactivada (apagado) [F2]\n- **Avisador acústico:**\
    \ apoyo sonoro a las indicaciones ópticas [F2]\n\n---\n\n## Diferencias entre\
    \ versión digital y analógica\n\nLa diferencia principal está en el **tipo de\
    \ señal de entrada** y en los **sensores compatibles** [F1][F3]:\n\n**Versión\
    \ analógica:**\n- Entradas: señal **4–20 mA** [F2]\n- Sensores compatibles:\n\
    \  - Sensores S/3 gases combustibles\n  - Sensores S/3 y S/2 gases tóxicos\n \
    \ - Sensores S/10 gases tóxicos [F3]\n\n**Versión digital:**\n- Entradas: señal\
    \ **0–10/15 V** [F2]\n- Sensores compatibles:\n  - Sensores S/10 gases combustibles\
    \ [F3]\n\n---\n\n## Conexionado de sensores\n\nLos conectores de cada sensor tienen\
    \ la siguiente asignación [F4]:\n- **Terminal 1:** positivo de alimentación (12\
    \ a 24 Vdc)\n- **Terminal 2:** entrada de señal\n- **Terminal 3:** negativo común\
    \ de alimentación y señal\n\nPara el detalle del esquema de conexionado de cada\
    \ versión, consulta los diagramas de la sección 3 del manual.\n\n---\n\n> **Nota:**\
    \ El número de serie sigue el formato `CCCC AAMM XXXX`, donde CCCC = código de\
    \ producto, AAMM = año y mes de fabricación, XXXX = número de fabricado [F1].\n\
    \n**Fuente:** Manual de Usuario CS4 (Analógica o Digital), elaborado por C.A.E.,\
    \ S.L. — Rev. 2 (10/2018), 8 páginas [F5]\n\n---\n\U0001F4CB **Obligaciones de\
    \ evidencia del manual:**\n- Nota: la fuente es inconsistente: \"Permite la conexión\
    \ de hasta 4 sensores remotos simultaneos a través de sus 4 entradas digitales\
    \ (0-10/15 v) o analógicas (4-20 mA).\" (Manual-de-Usuario-CS4, p. 4) [F2] declara\
    \ 4 sensores y la enumeración servida lista 6 (Manual-de-Usuario-CS4, p. 4) [F2].\n\
    - \"Ningún sistema de detección de gas sustituye a una correcta instalación y\
    \ mantenimiento de los aparatos quemadores de gas y debe ser colocado por una\
    \ persona competente o un instalador autorizado.\" (Manual-de-Usuario-CS4, p.\
    \ 2) [F8]"
