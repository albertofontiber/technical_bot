- qid: cat012
  question: ¿Cómo se calcula la capacidad de batería (en Ah) necesaria para la central
    AM-8200?
  answer: "## Cálculo de capacidad de batería para la AM-8200\n\nLa fórmula final\
    \ es: **Ah Batería = (A + B) × 1,2** [F3][F4], donde A son los Ah en espera y\
    \ B los Ah en alarma.\n\n---\n\n### Procedimiento paso a paso\n\nEl manual establece\
    \ dos tablas según el modelo de CPU instalado [F1]:\n\n- **Tabla 1** → para la\
    \ variante **AM-8200** (CPU AM8200-KLCD) [F3]\n- **Tabla 2** → para la variante\
    \ **AM-8200BB** (CPU AM82-BBMB) [F4]\n\n---\n\n### Paso 1 — Calcular la corriente\
    \ total en condiciones de NO ALARMA (espera)\n\nSuma los consumos de todos los\
    \ componentes instalados [F3][F4]:\n\n**Para AM-8200 (Tabla 1):**\n- AM-8200 CPU\
    \ (AM8200-KLCD): **179 mA** [F3]\n- LIB-8200 (por unidad): **50 mA** [F3]\n- AM82-2S2C:\
    \ **28 mA** [F3]\n- AM82-BST-C: **39 mA** [F3]\n- Dispositivos de lazo: consultar\
    \ fichas de datos del fabricante de cada dispositivo [F5]\n- Salida usuario (máx.\
    \ 2 A): consumo real de dispositivos conectados [F3]\n\n**Para AM-8200BB (Tabla\
    \ 2):**\n- AM-8200BB: **135 mA** [F4]\n- LIB-8200 (por unidad): **50 mA** [F4]\n\
    - AM82-2S2C: **28 mA** [F4]\n- AM82-BST-C: **39 mA** [F4]\n\n> **Nota sobre lazos:**\
    \ La corriente total de todos los lazos debe ser inferior a **750 mA** [F5]. La\
    \ corriente total de la salida de 24 Vcc de usuario debe ser inferior a **2 A**\
    \ [F5].\n\n---\n\n### Paso 2 — Calcular los Ah en espera (A)\n\nMultiplica la\
    \ corriente total en espera (en amperios) por la duración requerida [F3][F4]:\n\
    \n- **× 24 h** (autonomía estándar)\n- **× 72 h** (autonomía ampliada, si aplica\
    \ la normativa)\n\n→ Resultado = **Espera (A) en Ah**\n\n---\n\n### Paso 3 — Calcular\
    \ la corriente total en condiciones de ALARMA\n\nSuma los consumos en alarma de\
    \ todos los componentes [F3][F4]:\n\n**Para AM-8200 (Tabla 1):**\n- AM-8200 CPU\
    \ (AM8200-KLCD): **345 mA** [F3]\n- LIB-8200: **92 mA** [F3]\n- AM82-2S2C: **28\
    \ mA** [F3]\n- AM82-BST-C: **39 mA** [F3]\n- Dispositivos de lazo en alarma: consultar\
    \ fichas de datos; la central activa **solo los primeros 6 LED** de detectores\
    \ y módulos de entrada en alarma [F5]\n\n**Para AM-8200BB (Tabla 2):**\n- AM-8200BB:\
    \ **177 mA** [F4]\n- LIB-8200: **92 mA** [F4]\n- AM82-2S2C: **28 mA** [F4]\n-\
    \ AM82-BST-C: **39 mA** [F4]\n\n> **Nota:** Si la corriente total calculada supera\
    \ **3,5 A**, la corriente en exceso durante alarma se extrae de las baterías [F5].\n\
    \n---\n\n### Paso 4 — Calcular los Ah en alarma (B)\n\nMultiplica la corriente\
    \ total en alarma (en amperios) por **0,5 h** [F3][F4]:\n\n→ Resultado = **Alarma\
    \ (B) en Ah**\n\n---\n\n### Paso 5 — Aplicar la fórmula final\n\n**Ah Batería\
    \ = (A + B) × 1,2** [F3][F4][F5]\n\nEl factor **1,2** compensa las tolerancias\
    \ de fabricación de las baterías [F5].\n\n---\n\n### Límites físicos de la batería\n\
    \n- Capacidad admitida: **mín. 7 Ah — máx. 18 Ah** (2 baterías de 12 V en serie)\
    \ [F6]\n- Corriente de carga: **1 A** [F6]\n- Baterías recomendadas (capacidad\
    \ máxima estándar **17-18 Ah**):\n  - Yuasa NP18-12B o NP7-12BFR [F6]\n  - Fiamm\
    \ FG21803 o FGV21803 [F6]\n\n---\n\n**Fuente:** AM-8200 Manual de Instalación\
    \ (Doc. AM-8200-ESP Rev. A.3)\n\n---\n⚠️ **Información adicional del manual:**\n\
    - \"4 La corriente en las condiciones de reposo o alarma no puede superar, en\
    \ ningún caso, la capacidad de la fuente de alimentación.\" [F5]\n\n---\n\U0001F4D6\
    \ **Obligaciones de evidencia del manual:**\n- \"Calcular la corriente total necesaria\
    \ para todos los lazos usando **la tabla 2 (ver a continuación)** teniendo presente\
    \ que la central enciende **solo los primeros 6 LED** de los detectores y módulos\
    \ de entrada en alarma.\" (AM-8200 Manual Instalacion, p. 53) [F5]"
