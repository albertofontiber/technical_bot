- qid: cat010
  question: ¿Cómo se alimenta la sirena/avisador intrínsecamente seguro IS-mA1 en
    una zona peligrosa (ATEX) y cuáles son sus parámetros de seguridad intrínseca
    de entrada?
  answer: '## Alimentación e parámetros de seguridad intrínseca del IS-mA1


    El IS-mA1 es un avisador acústico certificado **ATEX e IECEx** para seguridad
    intrínseca, apto para zonas 0, 1 y 2 con gases y vapores inflamables de grupos
    **IIA, IIB e IIC**, clases de temperatura T1 a T4 [F1][F2].


    ---


    ### Clasificación ATEX


    - Marcado: **II 1G Ex ia IIC T4 Ga** [F1]

    - Rango de temperatura ambiente: **-40 °C ≤ Ta ≤ +60 °C** [F1]

    - Certificados: **SIRA 05ATEX2084X** / **IECEx SIR 06.0045X** [F1]

    - Norma de producto: **EN54-3 Tipo B** [F1]


    > ⚠️ El sufijo **''X''** en el número de certificado indica condiciones especiales
    de uso. Consulta el certificado de examen de tipo antes de la instalación [F1].


    ---


    ### Parámetros de entidad — Terminales + respecto a - (alimentación principal)


    Estos son los parámetros máximos admisibles en la entrada del avisador [F1][F3]:


    - **Ui = 28 V**

    - **Ii = 93 mA**

    - **Pi = 660 mW**

    - **Ci = 0**

    - **Li = 0**


    El aparato asociado (barrera o aislador galvánico) en zona segura debe tener parámetros
    de salida **≤** a estos valores [F3].


    > ⚠️ La capacitancia total conectada a los terminales +/- (cable + cualquier otra
    capacitancia) **no debe superar 83 nF** [F3][F4].


    ---


    ### Parámetros de entidad — Terminales S2 y S3 respecto a - (cambio de tono/etapa
    de alarma)


    Estos terminales permiten activar la 2.ª y 3.ª etapa de alarma conectándolos a
    0 V (terminal -) [F9] [F5]:


    - **Ui = 28 V**

    - **Ii = 0 mA** (corriente de entrada permitida = cero)

    - **Ci = 0**

    - **Uo = 16,8 V** (parámetro de salida del propio terminal hacia zona peligrosa)

    - **Io = 7,3 mA**

    - **Po = 31 mW** [F3]


    > ⚠️ Dado que la corriente de entrada permitida es **cero**, estos terminales
    **solo pueden conectarse** a [F5][F6]:

    > - Barrera de diodo de retorno (con caída de tensión < **0,9 V**)

    > - Relé intrínsecamente seguro

    > - Aislador galvánico

    > — todos ellos certificados por un Organismo Notificado de la CE.

    > — O bien, directamente a un **interruptor de accionamiento mecánico** en la
    zona peligrosa.


    > ⚠️ La distancia de separación entre terminales S2 y S3 es **inferior a 6 mm**
    — tener en cuenta en el conexionado [F3][F4].


    ---


    ### Opciones de aparato asociado en zona segura


    **Opción A — Aisladores galvánicos** [F10]:

    - No requieren conexión a tierra de alta integridad.

    - El aislador galvánico de alimentación debe tener parámetros de salida dentro
    de los límites de la sección 4.3 del manual y estar certificado **Ex ia** por
    un Organismo Notificado [F10].

    - Para alarma multietapa, usar **relés galvánicamente aislados** con parámetros
    dentro de los límites de la sección 4.4 del manual [F10].


    **Opción B — Barreras Zener** [F7][F8]:

    - Alarma de una sola etapa: barrera Zener de **un solo canal** (si el interruptor
    de control está en el positivo) [F7].

    - Si el interruptor está en el negativo: barrera Zener + **barrera de diodo de
    retorno** certificada **Ex ia**, con caída de tensión < **0,9 V** [F7].

    - Alarma multietapa: barrera Zener de 28 V / 93 mA + barreras de diodo de retorno
    para 2.ª y 3.ª etapa [F9].

    - Las barreras Zener **requieren conexión a tierra de alta integridad** (resistencia
    entre tierra IS y tierra de protección < **1 Ω**) [F4].


    ---


    ### Requisitos generales de instalación


    - La instalación debe realizarla **personal cualificado** [F1].

    - Las reparaciones solo puede realizarlas el **fabricante** o según el código
    de práctica aplicable [F1].

    - Carcasa en **plástico ABS** — proteger de sustancias agresivas (ácidos, disolventes)
    [F1].

    - Grado de protección de la carcasa: **IP 65** [F3][F4].

    - **Desconectar la alimentación antes de cualquier intervención** para evitar
    ignición de atmósferas inflamables [F3][F4].

    - No sustituir componentes sin autorización — puede comprometer la seguridad [F3][F4].

    - Para el conexionado detallado, consultar los diagramas de control del manual
    (Fig 4, Fig 5, Fig 6, Fig 7, Fig 8) [F7][F8][F9][F10].


