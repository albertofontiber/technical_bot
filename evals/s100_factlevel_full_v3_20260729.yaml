- qid: hp015
  question: En la Detnov CCD-103, ¿cómo se desactiva un detector individualmente sin
    afectar al resto del lazo?
  answer: 'La CCD-103 **no permite desactivar un detector individual**: la unidad
    mínima de desconexión es la **zona completa**, no un detector concreto.


    Lo que sí puedes hacer es **desconectar la zona** que contiene ese detector. El
    procedimiento es el siguiente:


    1. Asegúrate de que la **llave de bloqueo de teclado de la zona de detección (G)**
    está en posición **abierta** (desbloqueada). Con la llave cerrada, las pulsaciones
    no tienen efecto [F2].

    2. Localiza la **tecla de zona (A)** correspondiente a la zona que quieres desconectar
    [F2].

    3. Pulsa la tecla de zona **una primera vez** → la zona entra en **modo prueba**
    [F2].

    4. Pulsa la tecla de zona **una segunda vez** → la zona entra en **modo desconexión**
    [F1].


    **Indicaciones visuales que confirman la desconexión** [F1][F7]:

    - **Indicador de anular (4):** encendido de forma continua.

    - **Indicador amarillo de la zona correspondiente (6):** encendido fijo (fijo
    = desconexión; intermitente = avería/prueba) [F7].

    - **Indicador de sirenas anuladas:** encendido continuo si también se han desconectado
    las sirenas [F1].


    **Para reconectar la zona:**

    - Pulsa la tecla de zona **una vez** → zona conectada de nuevo [F1].


    ---


    ⚠️ **Advertencia importante:** Cuando una zona está desconectada, la central **no
    refleja ninguna incidencia ni evento** en esa zona [F1]. Limita al máximo el tiempo
    de uso de esta maniobra y señaliza la situación según el procedimiento de tu instalación.


    ---


    **Fuente:** CCD-103_Manual_ES_FR_GB_IT (sin revisión registrada)'
