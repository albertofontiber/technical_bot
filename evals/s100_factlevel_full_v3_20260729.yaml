- qid: cat018
  question: ¿Como se programa una ecuacion causa-efecto (CBE) en la Notifier AM-8200
    para que un evento active una salida?
  answer: '# Programación de ecuación CBE en AM-8200 para activar una salida


    La CBE se programa en la **Pestaña Programación** del punto de salida (módulo
    de salida), en el campo **CBE** [F1]. A continuación el procedimiento completo:


    ---


    ## Paso 1 — Acceder al módulo de salida


    Navega hasta: **MENU PROGRAMMAZIONE \ Punti \ Módulos** [F6]


    Selecciona el módulo de salida que quieres activar.


    ---


    ## Paso 2 — Ir a la Pestaña Programación


    Dentro del módulo, accede a la pestaña **Programmazione** [F1][F6].


    ---


    ## Paso 3 — Editar el campo CBE


    1. Selecciona el campo **CBE** con las teclas flecha **▲▼** [F1]

    2. Pulsa la tecla de confirmación **☑** para entrar en edición [F1]

    3. Se abrirá el teclado alfanumérico de la central [F1]


    > **Límite:** la longitud máxima de una CBE es de **64 caracteres** [F1]


    ---


    ## Paso 4 — Escribir la ecuación


    Usa los operadores disponibles según la lógica que necesites [F8]:


    **• OR** — Se activa la salida si **al menos UN** operando está activo [F8]

    Ejemplo: `OR (G9 G15 G23)` → si cualquiera de los grupos 9, 15 o 23 está en alarma,
    la salida se activa.

    *(También válido omitir OR: `(G9 G15 G23)`)* [F8]


    **• AND** — Se activa la salida solo si **TODOS** los operandos están activos
    [F8]

    Ejemplo: `AND (G9 G15 G23)` → solo si los tres grupos están en alarma simultáneamente.


    **• NOT** — **Niega** el operando [F8]

    Ejemplo: `NOT (G23)` → la salida está activa hasta que G23 entre en alarma.


    **• XGRP** — Se activa si **al menos DOS** elementos del grupo indicado están
    activos [F9]

    Formato: `XGRP (GXXX)` donde GXXX = Grupo 1 a 400 [F9]

    ⚠️ No se permite usar más de un grupo: `XGRP (G23 G24)` → **CBE no permitida**
    [F9]


    ---


    ## Paso 5 — Confirmar


    Pulsa la tecla **Enter** para confirmar la ecuación introducida [F1].


    ---


    ## ⚠️ Restricciones importantes


    **Para grupos directos** [F8]:

    - No se permite que los operandos dentro del paréntesis sean grupos con índice
    **menor** que el grupo al que se asocia la CBE.

    - Ejemplo no permitido: `G33 = (G23 G24)` → el índice 33 es mayor que 23 y 24
    ❌

    - Ejemplo permitido: `G21 = (G23 G24)` ✓ [F8]


    **Para grupos inversos** [F8]:

    - No se permite que los operandos sean grupos con índice **mayor** que el grupo
    al que se asocia la CBE.

    - Ejemplo no permitido: `G305 = (G306 G307)` ❌

    - Ejemplo permitido: `G307 = (G305 G306)` ✓ [F8]


    **Para módulos de salida con TIPO ID de señalización general** [F8]:

    - La central **no permite** programar una ecuación CBE en ese módulo.


    ---


    ## Ejemplo práctico completo [F10]


    Si necesitas activar una salida (p.ej. `L01M01`) cuando alarme cualquiera de 16
    grupos, y la memoria no permite un OR de 16 grupos directamente, usa grupos inversos
    intermedios:


    - `G301 = OR (G1 G2 G3 G4 G5 G6 G7 G8)`

    - `G302 = OR (G9 G10 G11 G12 G13 G14 G15 G16)`

    - `L01M01 = CBE = OR (G301 G302)`


    ---


    > Para la sintaxis completa y todos los operadores disponibles (TIM, DIS, PRE,
    FLT, etc.), consulta el **Apéndice «A» Control By Event** al final del manual
    [F1].


    **Fuente:** AM-8200 Manual de programación — Doc. M-162.1-AM8200-ESP Rev A.3 (Honeywell
    Life Safety Iberia)


    ---

    ⚠️ **Información adicional del manual:**

    - "Si, por el contrario, el dispositivo en cuestión es un módulo de salida, esta
    salida no se activará nunca, a no ser que se programe con software TIPO ID para
    señalizaciones generales." [F8]

    - Nota: el manual también indica: "Si **CUALQUIERA** de los tres operandos de
    esta ecuación (G9 G15 G23) está en alarma, el módulo de salida se activará, es
    decir:" [F8] · "- **SI** el grupo software 9 está en alarma, o

    - **SI** el grupo software 15 está en alarma, o

    - **SI** el grupo software 23 está en alarma

    - **ENTONCES** este módulo de salida se activará." [F8]

    - "**Zona** - número de zona asignada


    **CBE** - ecuación CBE del punto." [F1]'
