- qid: hp020
  question: En la Notifier INSPIRE, ¿cómo se configuran las contraseñas de nivel 2
    y nivel 3?
  answer: "# Configuración de contraseñas Nivel 2 y Nivel 3 — Notifier INSPIRE E10/E15\n\
    \nLos fragmentos cubren dos escenarios distintos según el nivel de acceso desde\
    \ el que se opera.\n\n---\n\n## Cambio de contraseña desde Nivel 3 (puede cambiar\
    \ NI2 y NI3)\n\nProcedimiento completo [F1]:\n\n1. Selecciona el **icono del menú**\
    \ ① y selecciona **\"Ajustes\"** ②. Inicia sesión como usuario de **nivel de acceso\
    \ 3**.\n2. Selecciona la opción **\"Cambio del código de acceso\"** ③.\n3. Asegúrate\
    \ de que el **Nivel de Acceso 2 o 3** ④ esté seleccionado y que el cursor parpadee\
    \ ⑤.\n4. Puedes ver la entrada del código haciendo clic en el **icono del ojo**\
    \ ⑥.\n5. Introduce el nuevo código de acceso de **entre 4 y 8 dígitos** con el\
    \ teclado ⑦.\n6. Confirma la entrada seleccionando el **símbolo ✓** ⑧.\n7. Repite\
    \ los pasos 3 a 6 para confirmar el código introducido.\n8. Observa el mensaje\
    \ **\"Cambio de código de acceso satisfactorio\"** y selecciona **Aceptar**.\n\
    9. **Sincroniza el programa con la central** y realiza una **copia de seguridad\
    \ del cambio en la nube** [F1].\n\n---\n\n## Cambio de contraseña desde Nivel\
    \ 2 (solo puede cambiar NI2)\n\nProcedimiento [F2]:\n\n1. Selecciona el **icono\
    \ del menú** ① y selecciona **\"Configuración\"** ②. Inicia sesión como usuario\
    \ de **nivel de acceso 2**.\n2. Selecciona la opción de **cambio del código de\
    \ acceso** ③.\n3. Asegúrate de que el **Nivel de Acceso 2** ④ esté seleccionado\
    \ y que el cursor parpadee ⑤.\n4. Puedes ver la entrada del código haciendo clic\
    \ en el **icono del ojo** ⑥.\n5. Introduce el nuevo código de acceso de **entre\
    \ 4 y 8 caracteres** con el teclado ⑦.\n6. Confirma la entrada seleccionando el\
    \ **símbolo ✓** ⑧.\n7. Repite los pasos 3 a 6 para confirmar el código introducido\
    \ [F2].\n\n---\n\n## Datos clave a tener en cuenta\n\n- **Longitud del código:**\
    \ mínimo **4 dígitos**, máximo **8 dígitos** [F1][F2].\n- **Código de fábrica\
    \ Nivel 2:** `22222222` [F3].\n- **Cierre de sesión automático Nivel 2:** si no\
    \ se usan los controles durante **5 minutos**, la central cierra sesión y vuelve\
    \ al nivel de acceso 1 [F3].\n- Se recomienda cambiar siempre la contraseña de\
    \ fábrica del nivel 2 [F3].\n- Los códigos de acceso deben mantenerse seguros\
    \ y solo conocerlos los usuarios autorizados [F3].\n\n---\n\n⚠️ **Importante:**\
    \ Tras el cambio desde Nivel 3, es obligatorio sincronizar con la herramienta\
    \ CLSS y hacer copia de seguridad en la nube [F1].\n\n---\n\nFuentes:\n- HOP-138-8ES\
    \ issue 6_01-2026 (Instrucciones de puesta en marcha INSPIRE E10/E15)\n- HOP-338-9ES\
    \ issue 4_01-2026 (Instrucciones de usuario INSPIRE E10/E15)\n\n---\n\U0001F4CB\
    \ **Información adicional del manual:**\n- Nota: el manual también indica: \"\
    Se recomienda cambiar la contraseña del código de acceso al nivel de acceso 2/3\
    \ contraseña a uno exclusivo que tenga entre 4 y 8 dígitos.\" [F1] · \"- Menu\
    \ icon ① leading to \"Configuraciones\"\n- \"Configuraciones\" screen showing\
    \ \"Configuración del sistema, red, datos y hora, programa de mantenimiento, etc\"\
    \ ②\n- Arrow pointing to \"Cambio de contraseña\" option ③\n- \"Introduzca nueva\
    \ contraseña\" dialog box with:\n  - \"Acceso Nivel 2\" dropdown ④\n  - Password\
    \ input field ⑤\n  - \"Min:4 digitos,Max:8 digitos\" text with eye icon ⑥\n  -\
    \ Numeric keypad showing numbers 1-9, 0, backspace icon, and checkmark icon ⑧\n\
    \  - Backspace arrow ⑦]\" [F1]"
