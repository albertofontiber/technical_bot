- qid: hp011
  question: En la Morley RP1r, después de descargar la extinción el sistema no vuelve
    a estado normal tras resetear. ¿Qué comprobar?
  answer: '## RP1r-Supra: Sistema no vuelve a estado normal tras resetear después
    de extinción


    Hay varias causas posibles. Comprueba en este orden:


    ---


    ### 1. Inhibición de rearme activa (causa más probable)


    El parámetro **[r.i]** puede estar configurado para inhibir el rearme tras la
    extinción [F13]. Los valores posibles son:


    - **- -** → Rearme inhibido hasta que finalice la extinción **o** hasta que se
    agote el tiempo configurado en el parámetro **t.A** (t.A → 0 seg.)

    - **00** → Rearme permitido en cualquier momento *(valor por defecto)*

    - **De 01 a 30** → Rearme inhibido durante el intervalo definido en minutos


    **Acción:** Entra en modo programación y verifica el valor del parámetro **[r.i]**.
    Si está en **- -** y el parámetro **t.A** no ha llegado a 0, la central no aceptará
    el rearme hasta que expire ese tiempo [F13].


    ---


    ### 2. Averías enclavadas pendientes de resolver


    Todas las averías son **por defecto enclavadas** y requieren rearme manual [F2].
    Si existe alguna condición de avería activa en los circuitos supervisados, el
    sistema no volverá a estado normal aunque se rearme.


    Comprueba los LEDs de avería en el panel. Los circuitos a revisar son [F5] [F6]:


    - **CCT EXT 1 / CCT EXT 2** (Bloque 1/2): LED "Avería circuito extinción" intermitente

    - **SND 1 / SND 2** (Bloque 5/6): LED "Sirenas fallo/anuladas" intermitente

    - **ABORT SWITCH** (Bloque D): LED "Avería en paro" intermitente + LED "Paro"
    fijo → **Este circuito requiere siempre rearme manual, no admite rearme automático**
    [F5]

    - **Zonas Z1, Z2, Z3** (Bloques E, F, G): LEDs de avería de zona intermitentes

    - **Presión baja / Señal de flujo / Puerta abierta** (Bloques H, I, J): LEDs de
    avería intermitentes [F2]


    **Acción:** Identifica qué LED de avería está activo. Si es el **Bloque D (ABORT)**,
    la condición de paro requiere resolución física del circuito antes de poder rearmar
    [F5].


    ---


    ### 3. LED "Extinción Realizada" fijo — estado fin extinción


    Tras completarse el tiempo de activación (parámetro **t-H**), el LED "Extinción
    Realizada" queda iluminado de forma **fija** y los relés de extinción se desactivan
    [F3]. Este estado es normal y **no desaparece solo**: requiere rearme manual desde
    nivel de acceso 2 pulsando la tecla "Rearme" [F2].


    **Acción:** Confirma que accedes con **nivel 2** de acceso antes de pulsar "Rearme"
    [F2].


    ---


    ### 4. Verificar que no hay condición de alarma activa en zonas


    Si algún detector o pulsador de las zonas sigue en alarma, el rearme no devolverá
    la central a reposo. Comprueba físicamente el estado de los detectores de las
    zonas 1, 2 y 3 [F9].


    ---


    **Resumen de comprobación rápida:**

    1. Verifica parámetro **[r.i]** y tiempo **t.A** en programación [F13]

    2. Identifica LEDs de avería activos — especialmente Bloque D (ABORT) [F5]

    3. Confirma acceso con nivel 2 para el rearme [F2]

    4. Comprueba que no hay detectores/pulsadores activos en zonas [F9]


    ---


    Fuente: Manual de usuario RP1r-Supra HLSI-MN-103 (rev. v.07, 2018-05-01); HLSI-MN-103-I
    (sin revisión registrada); Guía Rápida HLSI-MA-103 (sin revisión registrada)'
