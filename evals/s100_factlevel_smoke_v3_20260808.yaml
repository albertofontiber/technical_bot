- qid: cat005
  question: ¿Cuáles son las características técnicas de la central de detección de
    gas Fidegas CS4, y en qué se diferencian las versiones digital y analógica?
  answer: "## Características técnicas de la central Fidegas CS4\n\nLa CS4 es una\
    \ central de alarmas de detección de gas fabricada por C.A.E., S.L. (marca FIDEGAS®),\
    \ disponible en dos versiones: **digital** y **analógica** [F7][F3].\n\n---\n\n\
    ### Características técnicas generales\n\n- **Tensión de alimentación:** 110-230\
    \ Vac, 50-60 Hz [F2]\n- **Potencia:** 30 W, Clase II [F2][F3]\n- **Número de sensores:**\
    \ hasta 4 conexiones simultáneas [F1][F2]\n- **Salidas:** 2 salidas conmutadas\
    \ LP (relé apto para 230 Vac) con contactos NA-C-NC [F1][F2]\n- **Corriente máxima:**\
    \ 250 mA [F2]\n- **Rearme:** seleccionable manual o automático [F2]\n- **Dimensiones:**\
    \ 90 x 106 x 58 mm [F2]\n- **Peso:** 300 g [F2]\n- **Instalación:** carril DIN\
    \ o armario de superficie [F1]\n- **Firmware:** versión 1.2 (tanto digital como\
    \ analógica) [F7][F3]\n\n---\n\n### Indicaciones (LEDs y avisador)\n\n- **LED\
    \ verde PWR:** alimentación presente (fijo) / corte de red (intermitente) [F1]\n\
    - **LED bicolor ON/ALARM** (por sensor): sensor conectado (verde) / alarma (rojo)\
    \ [F1]\n- **LED amarillo ERROR** (por sensor): avería del sensor remoto [F1]\n\
    - **LED verde OUT1 y OUT2:** salida activa (verde) / desactivada (apagado) [F1]\n\
    - **Avisador acústico:** apoyo sonoro a las indicaciones ópticas [F1]\n\n---\n\
    \n### Diferencias entre versión digital y analógica\n\n**Tipo de entrada de señal:**\n\
    - Versión **analógica:** entradas 4-20 mA [F1][F4]\n- Versión **digital:** entradas\
    \ 0-10/15 V [F1]\n\n**Código de producto:**\n- Versión **digital:** 3244 [F2]\n\
    - Versión **analógica:** 3270 [F2]\n\n**Sensores compatibles:**\n- Versión **analógica:**\
    \ [F3]\n  - Sensores S/3 gases combustibles\n  - Sensores S/3 y S/2 gases tóxicos\n\
    \  - Sensores S/10 gases tóxicos\n- Versión **digital:** [F3]\n  - Sensores S/10\
    \ gases combustibles\n\n---\n\n### Conexión de sensores\n\nCada sensor se conecta\
    \ mediante 3 terminales [F4]:\n1. Positivo de alimentación (12 a 24 Vdc)\n2. Entrada\
    \ de señal\n3. Negativo común de alimentación y señal\n\nPara el conexionado exacto\
    \ de cada tipo de sensor (S/3 analógico y S/10 digital), consulta los diagramas\
    \ de la sección 3 del manual físico [F4].\n\n---\n\n### Funcionamiento de alarma\n\
    \n- El umbral de alarma se activa al superar el **20% del fondo de escala** [F5]\n\
    - Las alarmas son **enclavadas**: se guardan en memoria hasta que el usuario pulsa\
    \ **RESET** [F5]\n- Si la concentración de gas no ha disminuido, la alarma puede\
    \ **silenciarse durante 24 horas** con el botón RESET, pero no se puede rearmar\
    \ [F5]\n- En alarma, las salidas OUT1/OUT2 asignadas pasan a posición NA [F5]\n\
    \n---\n\nFuente: Manual de Usuario CS4 (Analógica o Digital), elaborado y aprobado\
    \ en Revisión 2, 10/2018, C.A.E., S.L. — Manual-de-Usuario-CS4, sin revisión registrada\
    \ en metadatos.\n\n---\n\U0001F4CB **Obligaciones de evidencia del manual:**\n\
    - Nota: la fuente es inconsistente: \"Permite la conexión de hasta 4 sensores\
    \ remotos simultaneos a través de sus 4 entradas digitales (0-10/15 v) o analógicas\
    \ (4-20 mA).\" (Manual-de-Usuario-CS4, p. 4) [F1] declara 4 sensores y la enumeración\
    \ servida lista 6 (Manual-de-Usuario-CS4, p. 4) [F1].\n- \"Ningún sistema de detección\
    \ de gas sustituye a una correcta instalación y mantenimiento de los aparatos\
    \ quemadores de gas y debe ser colocado por una persona competente o un instalador\
    \ autorizado.\" (Manual-de-Usuario-CS4, p. 2) [F7]"
