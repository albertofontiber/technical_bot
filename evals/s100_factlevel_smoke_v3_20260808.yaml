- qid: hp007
  question: ¿Cómo se realiza el test anual de un detector VESDA-E VEP según el manual
    del fabricante?
  answer: '## Test anual del detector VESDA-E VEP según el manual del fabricante


    El manual del VEP-A10-P establece **cuatro tareas de mantenimiento anual** (frecuencia
    "Una vez al año") [F1]:


    1. **Realizar una prueba de humos** para comprobar la integridad de la red de
    tubería

    2. **Comprobar el flujo** de la red de tubería

    3. **Limpiar los puntos de muestreo**

    4. **Limpiar con agua la red de tubería**


    ---


    ### Antes de comenzar cualquier prueba — Precauciones obligatorias [F1]


    - Informa a la **autoridad supervisora adecuada**.

    - Asegúrate de que se **aíslen los dispositivos existentes** que dependan del
    detector antes de ponerlo en funcionamiento.

    - Cuando se realicen pruebas de humo, **sigue los procedimientos del sitio para
    evitar falsas alarmas** a los servicios supervisados.


    > ⚠️ Cuando el detector está deshabilitado o en espera, **no emitirá advertencias
    de fuego** [F1].


    ---


    ### Modo en espera durante el mantenimiento de tubería y puntos de muestreo [F6]


    Cuando realices el mantenimiento de la red de tubería o los puntos de muestreo,
    establece el detector en **modo en espera** para apagar el aspirador:


    1. Mediante **Xtralis VSC**, selecciona **"Go to Standby"** (Ir a modo en espera)
    en el menú **"Device"** (Dispositivo).

    2. El LED desactivado parpadeará y se desactivará el aspirador.

    3. Si está configurado, el zumbador emitirá **un pitido por minuto** (si la casilla
    de pitido en espera está marcada en la pantalla de configuración de relés, sección
    5.5.10) [F6].

    4. Al terminar, selecciona **"End Standby"** (Finalizar modo en espera) en el
    menú **"Device"** para reactivar la unidad [F6].


    > Nota: El modo en espera **detiene la detección de alarmas**, pero **no** la
    detección ni señalización de fallos [F6].


    ---


    ### Prueba de humos anual [F2]


    La prueba de humos consiste en:


    - Introducir una muestra de humo en el **orificio de muestreo más alejado**.

    - Medir el **tiempo de transporte** hasta que el humo llega al detector.

    - Registrar los resultados y compararlos con pruebas anteriores para detectar
    variaciones del sistema [F2].


    > El manual remite al procedimiento detallado a la **VESDA-E Commissioning Guide**
    (Guía de puesta en marcha de VESDA-E) para los detalles completos de la prueba
    de humos [F2].


    ---


    ### Notas adicionales del calendario de mantenimiento [F1]


    - El mantenimiento puede realizarlo el **instalador original, un distribuidor
    autorizado o el contratista de servicio**.

    - La frecuencia puede variar según **códigos y normas locales** y el **entorno
    de la instalación**.


    ---


    **Fuente:** 33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores (sin revisión
    registrada)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "**Atención:** Pendant que le detecteur ou la zone est desactivee, aucun feu
    d''indication va etre emis par le detecteur." (33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores,
    p. 87) [F1]

    - "Se debe realizar una comprobación preliminar del sistema después de instalar
    el detector VEP-A10-P y antes de ponerlo en marcha." (33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores,
    p. 54) [F5]'
