- qid: hp001
  question: En la Detnov CAD-250, ¿cómo se entra al menú de programación avanzada?
  answer: '## Acceso al menú de programación avanzada — CAD-250


    La ruta de acceso es la siguiente [F1]:


    **AJUSTES** (Menú principal) **> AVANZADO** (Submenú)


    ### Pasos previos obligatorios


    Antes de poder acceder, debes autenticarte como administrador [F2]:


    1. En la **pantalla de reposo**, toca el icono del **candado** (🔒) [F2].

    2. Se mostrará la pantalla de introducción de contraseña [F2].

    3. Introduce la **clave de administrador por defecto: 2222** [F2].


    > ⚠️ **AVISO:** El uso indebido del nivel de administrador puede provocar un mal
    funcionamiento de la instalación. Asegúrate de tener la autorización necesaria
    antes de operar en este nivel [F2].


    ### Contenido del menú AVANZADO


    Una vez dentro, dispones de **3 pestañas** [F1]:


    - **SISTEMA:** Configuración del número de cabinas (PANELES: 1 a 4), número de
    lazos (2, 4, 6, 8, hasta 32 según cabinas) y si hay cabina con LEDs de zona (0
    ó 1). Los cambios requieren pulsar **"Guardar y Reiniciar"** [F1].

    - **OTROS:** Interruptores para facilitar tareas de puesta en marcha y mantenimiento
    (Tiempo de inactividad, Salto a scroll si incidentes, Saltar a último incidente
    prioritario si timeout, entre otros) [F1][F8].

    - **REINICIAR:** Devuelve la configuración completa de la central a valores de
    fábrica [F7].


    > ⚠️ **AVISO:** Por razones de seguridad y cumplimiento normativo, los interruptores
    de inactividad, timeout y scroll deben estar activados (en verde) por defecto
    [F7].


    Este menú es accesible desde el **Nivel 2 de configuración** (nivel de administrador/instalador)
    [F4].


    ---


    Fuente: CAD-250 Manual de Configuración MC-380-es-2026-c (rev. c, 2026-04-23)'
