- qid: hp018
  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  answer: "# Conexionado de sirenas convencionales en salidas de sirena de la ZXe\n\
    \nLos fragmentos recuperados corresponden principalmente a los modelos **ZX2e\
    \ y ZX5e** (manual MIE-MI-530rv001) y a la familia **ZXAE/ZXEE** (manual MIE-MI-310).\
    \ A continuación se detalla el conexionado aplicable a la ZXe según esa documentación.\n\
    \n---\n\n## Terminales de conexión\n\n- **ZX2e**: terminales de sirena en bloque\
    \ etiquetado **`AUX RELAY A+ A- B+ B-`** / **`SOUNDERS B+ B- A+ A-`** [F4]\n-\
    \ **ZX5e**: terminales en **TB7**, etiquetados **`A- A+ B- B+ C- C+ D- D+`** [F4]\n\
    \nConsulta la **Figura 13** (ZX2e) y **Figura 14** (ZX5e) del documento MIE-MI-530rv001\
    \ para la ubicación exacta en placa [F4].\n\n---\n\n## Requisitos del circuito\n\
    \n1. **Corriente máxima por circuito: 1 A** [F11]. No superar este límite sumando\
    \ el consumo de todas las sirenas del circuito.\n\n2. **Resistencia Final de Línea\
    \ (RFL)**: obligatoria al final del circuito. Valor: **6,8 kΩ, 0,5 W mínimo**\
    \ [F11]. Se instala entre el terminal `+` y `-` de la última sirena del circuito.\n\
    \   - Si no se conecta ninguna sirena en la salida, la RFL debe colocarse directamente\
    \ en los terminales de la central [F1].\n\n3. **Diodo de polarización en cada\
    \ sirena**: cada sirena debe llevar un diodo integrado para impedir consumo en\
    \ polarización inversa durante la supervisión [F4]. El circuito se polariza en\
    \ inverso en reposo para supervisar la línea y cambia a polarización normal al\
    \ dispararse [F4].\n\n4. **Dispositivos no polarizados** (campanas sin polaridad):\
    \ deben incorporar un diodo de polarización y protección en cada uno [F4].\n\n\
    ---\n\n## Topología del cableado\n\nEl circuito discurre en línea directa desde\
    \ la central hasta la RFL al final. **No se deben realizar ramales** en la conexión\
    \ de sirenas convencionales, ya que la supervisión se realiza sobre la línea directa\
    \ hasta la RFL; los ramales paralelos no podrán ser supervisados [F2].\n\nPara\
    \ el esquema de conexionado exacto, consulta la **Figura 15 – Circuito de sirenas\
    \ convencionales** del documento MIE-MI-530rv001 [F3].\n\n---\n\n## Advertencias\
    \ de cableado\n\n- **No enrollar el cable en los terminales**. Cortar y empalmar\
    \ las conexiones adecuadamente para mantener la supervisión de la línea [F3].\n\
    - **Longitud máxima recomendada: 1 km**. Longitudes superiores pueden afectar\
    \ al funcionamiento por capacitancia e inductancia del lazo [F3].\n- Usar secciones\
    \ de cable adecuadas para garantizar la alimentación de las sirenas tanto con\
    \ alimentación principal como en condiciones de mínima tensión de baterías. Revisar\
    \ las **tablas 10 y 11** del manual MIE-MI-530rv001 para las condiciones de tensión\
    \ mínima del panel [F3].\n- No realizar cableados de sección inferior a **1,5\
    \ mm²** [F1].\n\n---\n\n## Supervisión\n\nCualquier fallo en la línea (circuito\
    \ abierto o cortocircuito) se mostrará en pantalla y quedará registrado en el\
    \ registro del sistema [F5]. Ejemplo de mensaje: `!ATENCION! CIRCUITO ABIERTO\
    \ SIRENA B` [F5].\n\n---\n\n**Fuentes:**\n- Manual de Instalación ZX2e/ZX5e —\
    \ Documento MIE-MI-530rv001, Revisión 001\n- Manual de Instalación ZXAE/ZXEE —\
    \ Documento MIE-MI-310 (sin revisión registrada)\n\n---\n\U0001F4D6 **Obligaciones\
    \ de evidencia del manual:**\n- \"Todas las salidas de sirena quedan configuradas\
    \ por defecto para sonar de forma contínua con cualquier alarma de cualquier zona,\
    \ quedándo así en el patrón 1.\" (MIE-MP-310, p. 38) [F8]"
