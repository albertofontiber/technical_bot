- qid: cat007
  question: En el detector por aspiración FAAST LT-200, ¿qué salidas de relé y de
    sirena tiene y con qué contactos, cómo se comporta el relé de avería ante un fallo
    o un corte de alimentación, qué resistencia de fin de línea llevan las salidas
    de sirena y cuál es la especificación eléctrica de los contactos de relé?
  answer: '# FAAST LT-200 — Salidas de relé, sirena y especificaciones eléctricas


    El FAAST LT-200 dispone de relés de alarma, avería y sirena (y prealarma en la
    variante Stand Alone), con contactos NC/C/NA por canal, resistencia de fin de
    línea de **47 kΩ** en las salidas de sirena, y contactos de relé nominales a **2,0
    A / 30 V CC** y **0,5 A / 30 V CA**.


    ---


    ## 1. Relés disponibles y su comportamiento


    ### Variante conectada a panel (manual I56-6577-006_ES)


    - **Relé de ALARMA 1 y 2**: Controlado por el panel cuando determina que se cumple
    la condición de alarma. Encendido y apagado por el panel; **no enclavado** [F1].

    - **Relé de AVERÍA 1 y 2**: Se activa ante una condición de avería en el canal
    1 o 2, o una avería común. También se activa en **modo de servicio** y cuando
    se **desconecta la alimentación** de la unidad. El estado de avería **no está
    enclavado** [F1].

    - **Relé de SIRENA 1 y 2**: Se activa cuando el canal está en ALARMA. La sirena
    1 corresponde al canal 1 y la sirena 2 al canal 2. Estado predeterminado = establecido
    en ALARMA [F1].


    ### Variante Stand Alone (manual I56-6574-005_ES)


    - **Relé de ALARMA 1 y 2**: Se establece en ENCENDIDO si se cumple la condición
    de alarma en un canal. Condición predeterminada = Nivel 1. El estado de alarma
    **está enclavado por defecto**; se necesita un **rearme manual** para desactivar
    el LED y el relé [F2].

    - **Relé de PREALARMA 1 y 2**: Se establece en ENCENDIDO si se cumple la condición
    de prealarma en un canal. Condición predeterminada = Nivel 1. Nota: cuando PREALARMA
    = ALARMA = Nivel 1, la prealarma se activará al **70 % del nivel 1** [F2].

    - **Relé de AVERÍA 1 y 2**: Igual que la variante de panel — se activa ante avería
    en canal 1 o 2, avería común, modo de servicio y **corte de alimentación**. El
    estado de avería **no está enclavado** (predeterminado) [F2].

    - **Relé de SIRENA 1 y 2**: Se activa cuando el canal está en ALARMA / PREALARMA.
    La sirena 1 corresponde al canal 1 y la sirena 2 al canal 2. Estado predeterminado
    = establecido en ALARMA [F2].


    ---


    ## 2. Contactos de los relés (terminales de cableado)


    ### Variante conectada a panel — terminales T2 a T7 [F4]


    **Relé de alarma canal 1** (terminales T2):

    - Terminal 5: Relé de alarma **NC** — C1

    - Terminal 6: Relé de alarma **C** — C1

    - Terminal 7: Relé de alarma **NA** — C1


    **Relé de alarma canal 2** (terminales T3):

    - Terminal 8: Relé de alarma **NC** — C2

    - Terminal 9: Relé de alarma **C** — C2

    - Terminal 10: Relé de alarma **NA** — C2


    **Relé de avería canal 1** (terminales T4):

    - Terminal 11: Relé de avería **NC** — C1

    - Terminal 12: Relé de avería **C** — C1

    - Terminal 13: Relé de avería **NA** — C1


    **Relé de avería canal 2 (AUX.)** (terminales T5):

    - Terminal 14: Relé de avería **NC** (AUX.) — C2

    - Terminal 15: Relé de avería **C** (AUX.) — C2

    - Terminal 16: Relé de avería **NA** (AUX.) — C2


    ### Variante Stand Alone — terminales T1 a T10 [F5]


    **Relé de alarma canal 1** (T1): terminales 5 NC / 6 C / 7 NA — C1

    **Relé de alarma canal 2** (T2): terminales 8 NC / 9 C / 10 NA — C2

    **Relé de avería canal 1** (T3): terminales 11 NC / 12 C / 13 NA — C1

    **Relé de avería canal 2 (AUX.)** (T4): terminales 14 NC / 15 C / 16 NA — C2

    **Relé de prealarma canal 1** (T9): terminales 23 NC / 24 C / 25 NA — C1

    **Relé de prealarma canal 2** (T10): terminales 26 NC / 27 C / 28 NA — C2


    ---


    ## 3. Salidas de sirena y resistencia de fin de línea


    Ambas variantes tienen dos salidas de sirena con los siguientes terminales [F4][F5]:


    - **Salida sirena 1**: terminal — (negativo) y terminal + (positivo) → resistencia
    de fin de línea de **47 kΩ**

    - **Salida sirena 2**: terminal — (negativo) y terminal + (positivo) → resistencia
    de fin de línea de **47 kΩ**


    > La resistencia de fin de línea de **47 kΩ** se suministra en el kit de instalación
    (2 unidades incluidas) [F9].


    ---


    ## 4. Especificación eléctrica de los contactos de relé


    - Potencia nominal de los contactos (carga resistiva **30 V CC**): máx. **2 A**
    [F3][F6]

    - Potencia nominal de los contactos (carga resistiva **30 V CA**): máx. **0,5
    A** [F3][F6]

    - Vida útil: mínimo **10⁵ operaciones** [F3]


    ---


    ## 5. Comportamiento del relé de avería ante fallo o corte de alimentación


    El relé de avería se activa en los siguientes casos [F1][F2]:

    1. Condición de avería en el **canal 1 o canal 2**

    2. **Avería común**

    3. Cuando la unidad está en **modo de servicio**

    4. Cuando se **desconecta la alimentación** de la unidad


    El estado de avería **no está enclavado** — no requiere rearme manual para desactivarse
    [F1][F2].


    ---


    **Fuentes:**

    - I56-6577-006_ES FAAST Notifier LT-200 QIG (sin revisión registrada)

    - I56-6574-005_ES -HS Stand Alone FAAST LT-200 QIG (sin revisión registrada)

    - I56-3956-201_ES Morley Loop FAAST LT QIG (sin revisión registrada)'
