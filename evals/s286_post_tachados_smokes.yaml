  bot_answer: "# Programación de ecuación CBE en AM-8200 para activar una salida\n\
    \nLa lógica CBE (Control By Event) de la AM-8200 funciona en dos niveles: primero\
    \ defines **grupos** que agrupan entradas (sensores/módulos), y luego asignas\
    \ una **ecuación CBE al módulo de salida** que referencia esos grupos. Aquí el\
    \ procedimiento completo:\n\n---\n\n## PASO 1 — Configurar el grupo (Menú Grupos)\n\
    \nLos grupos son conjuntos software que vinculan entradas con salidas [F4].\n\n\
    1. Accede a **MENU PROGRAMMAZIONE \\ Gruppi** [F4]\n2. En la **Pestaña Principal**,\
    \ define el número máximo de grupos con activación directa (campo **Max Diretto**)\
    \ [F4]\n3. En la **Pestaña Programa**, configura:\n   - **Tipo**: `Diretto` (el\
    \ grupo se activa desde entradas que lo referencian en su CBE) [F4]\n   - **CBE\
    \ del grupo**: selecciona el campo CBE con las teclas **▲▼**, pulsa **✓** e introduce\
    \ la ecuación con el teclado alfanumérico. Al terminar, pulsa **✓** para confirmar\
    \ [F4]\n\n> La AM-8200 dispone de **400 grupos** programables [F4].\n\n---\n\n\
    ## PASO 2 — Asignar CBE al módulo de salida (Menú Puntos)\n\n1. Accede a **MENU\
    \ PROGRAMMAZIONE \\ Punti** y selecciona el módulo de salida [F1]\n2. Ve a la\
    \ **Pestaña Programación** [F1]\n3. Selecciona el campo **CBE** con las teclas\
    \ **▲▼** y pulsa **✓** [F1]\n4. Introduce la ecuación con el teclado alfanumérico\
    \ y pulsa **Enter** para confirmar [F1]\n\n> La longitud máxima de una CBE es\
    \ de **64 caracteres** [F1].\n\n---\n\n## PASO 3 — Construir la ecuación CBE\n\
    \nUsa los operadores disponibles según la lógica que necesites [F5]:\n\n- **OR\
    \ (G9 G15 G23)** → La salida se activa si **al menos uno** de los grupos está\
    \ en alarma. También puedes omitir el operador OR y escribir directamente **(G9\
    \ G15 G23)** [F5]\n- **AND (G9 G15 G23)** → La salida se activa solo si **todos**\
    \ los grupos están en alarma simultáneamente [F5]\n- **NOT (G23)** → La salida\
    \ permanece activa mientras el grupo G23 **no** esté en alarma [F5]\n\n---\n\n\
    ## ⚠️ Reglas críticas de indexación de grupos\n\n- Para **grupos directos (D)**:\
    \ los operandos dentro del paréntesis deben tener índice **mayor** que el grupo\
    \ al que se asigna la CBE [F5]\n  - ✅ Permitido: `G21 = (G23 G24)`\n  - ❌ No permitido:\
    \ `G33 = (G23 G24)`\n- Para **grupos inversos (I)**: los operandos deben tener\
    \ índice **menor** que el grupo al que se asigna la CBE [F5]\n  - ✅ Permitido:\
    \ `G307 = (G305 G306)`\n  - ❌ No permitido: `G305 = (G306 G307)`\n\n---\n\n##\
    \ ⚠️ Nota sobre módulos de salida con TIPO ID general\n\nSi el módulo de salida\
    \ tiene programado un **TIPO ID para señalizaciones de carácter general**, la\
    \ central **no permite programar una ecuación CBE** para ese módulo [F5].\n\n\
    ---\n\n**Fuente:** AM-8200 Manual de programación — Doc. M-162.1-AM8200-ESP Rev\
    \ A.3 (Honeywell Life Safety Iberia)\n\n---\n\nTambién puedo ayudarte con: **programación\
    \ de grupos inversos (tipo I)**, **operadores avanzados (TIM, DIS, PRE)** disponibles\
    \ en el teclado CBE, o **asignación de zona al módulo de salida**.\n\n---\n⚠️\
    \ **Información adicional del manual:**\n- \"Si, por el contrario, el dispositivo\
    \ en cuestión es un módulo de salida, esta salida no se activará nunca, a no ser\
    \ que se programe con software TIPO ID para señalizaciones generales.\" [F5]\n\
    - Nota: el manual también indica: \"Si **CUALQUIERA** de los tres operandos de\
    \ esta ecuación (G9 G15 G23) está en alarma, el módulo de salida se activará,\
    \ es decir:\" [F5] · \"- **SI** el grupo software 9 está en alarma, o\n- **SI**\
    \ el grupo software 15 está en alarma, o\n- **SI** el grupo software 23 está en\
    \ alarma\n- **ENTONCES** este módulo de salida se activará.\" [F5]\n- \"**Zona**\
    \ - número de zona asignada\n\n**CBE** - ecuación CBE del punto.\" [F1]"
- qid: hp002
  question: El detector ASD535 de Detnov está dando una alarma intermitente de flujo
    bajo. ¿Cuál es la causa más probable y cómo se diagnostica?
  gold_estado: verificado
  conducta_esperada: answer
  conducta_bot: answer
  veredicto: PARCIAL
  diagnostico: 'Acierta la causa principal probable (obstrucción), los umbrales 80/120
    %, la lectura en posición V y la consulta de eventos, e incluye el gate de seguridad.
    Pero queda incompleta frente al gold: no advierte la discrepancia Detnov/Securiton,
    no desarrolla la posible intermitencia por turbulencias/ventana LS-Ü/retardo,
    y omite el reset inicial posterior con sus condiciones y advertencias.'
  bot_sources:
