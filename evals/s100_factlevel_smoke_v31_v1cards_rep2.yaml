- qid: cat022
  question: En los detectores de llama Spectrex SharpEye 40/40, ¿qué diferencia hay
    entre el modelo 40/40L y el 40/40L4, y qué significa el sufijo «B» (p. ej. 40/40LB)?
  answer: '## Diferencias entre 40/40L, 40/40L4 y el sufijo «B»


    ### 40/40L vs. 40/40L4 — Longitud de onda IR


    La diferencia clave está en la longitud de onda del sensor IR [F11]:


    - **S40/40L**: sensor IR opera entre **2,5 y 3,0 µm**. Detecta combustibles a
    base de hidrocarburos, fuegos de gas, fuegos de hidróxido e hidrógeno, y fuegos
    de metales o materia inorgánica [F11].

    - **S40/40L4**: opera a **4,5 µm**. Es igual al S40/40L en todo lo demás, **excepto**
    que esta longitud de onda lo hace adecuado **únicamente para la detección de fuegos
    de hidrocarburos** [F11].


    En cuanto a sensibilidad, los fragmentos del software WinHost muestran diferencias
    entre modelos [F2]:

    - **40/40L / 40/40LB**: ajuste de sensibilidad disponible en **15** (50 ft / 15
    m) [F2].

    - **40/40L4 / 40/40L4B**: ajuste de sensibilidad disponible en **28** (93 ft /
    28 m) [F2].


    ---


    ### Sufijo «B» — Prueba Incorporada (BIT)


    El sufijo **«B»** indica que el modelo incluye la función de **Prueba Incorporada
    (BIT)** [F11]:


    - **S40/40L** → **sin BIT**

    - **S40/40LB** → **con BIT**

    - **S40/40L4** → **sin BIT**

    - **S40/40L4B** → **con BIT**


    > La función BIT solo se incluye en los modelos S40/40LB y S40/40L4B [F11].


    ---


    ### Resumen rápido


    - **L vs. L4**: diferencia en longitud de onda IR (2,5–3,0 µm vs. 4,5 µm) → distinto
    rango de combustibles detectables.

    - **Sufijo B**: añade la función de Prueba Incorporada (BIT) al modelo base.

    - Ambas familias (L y L4) comparten el mismo manual [F1].


    ---


    Fuente: Manual de usuario. Detector S40/40L-LB-L4-L4B — MNDT722_40-40L (sin revisión
    registrada); SharpEye™ 40/40 Flame Detectors User Guide — TM777050 Rev. (Da),
    octubre 2017.'
