- qid: hp003
  question: ¿Cómo se conectan las baterías de 24V en la Detnov CAD-150?
  answer: '## Conexión de baterías en la CAD-150-8


    Las baterías se conectan **en serie** para el correcto funcionamiento de la central
    [F4].


    ### Especificaciones de las baterías

    - **Tipo requerido:** dos baterías de **12V 7A/h** [F4]

    - **Configuración:** serie (para obtener 24V) [F4]

    - **Ubicación física:** en la parte inferior de la caja, en posición vertical,
    en el espacio reservado para ello [F4]


    ### Procedimiento de conexión


    1. **Conecta el cable puente** entre las dos baterías: une el polo positivo de
    una batería con el polo negativo de la otra, usando el cable puente suministrado
    con la central [F4].


    2. **Conecta los cables del circuito** (rojo y negro) al positivo y negativo libres
    de las baterías [F1].


    3. **Conecta al conector de baterías** de la placa base (posición **11** en la
    PCB Base) [F2].


    ### ⚠️ Orden de conexión obligatorio


    El orden de conexión es crítico para no dañar el equipo [F7]:

    - **Primero:** conectar la red (230VAC) activando el magnetotérmico bipolar [F9]

    - **Segundo:** conectar las baterías [F9]


    > Si necesitas encender el equipo solo con baterías (sin red), es imprescindible
    pulsar el pulsador **BAT** (posición **9** en la PCB Base) para arrancar el equipo
    [F9].


    ### Verificación previa a la puesta en marcha

    Antes de conectar, verifica que las baterías tienen una tensión superior a **24V**
    [F9].


    ---


    Fuente: 55315013 Manual Centrales Analógicas CAD-150-8 Instalación ES FR GB IT
    (sin revisión registrada)


    ---

    📖 **Información adicional del manual:**

    - "* Comprobar que el equipo se ha instalado correctamente.

    * Con la ayuda de un voltímetro verificar que en los lazos no existen ni cortocircuitos
    ni circuitos abiertos. Use el tester para comprobar la continuidad de la línea.

    * Verificar que las líneas de zona conectadas a módulos de zona tienen las resistencias
    de final de línea (4K7)

    * Verificar que las líneas de sirenas, conectadas a módulos de sirenas están conectadas
    respetando la polaridad, y que tienen las resistencias (4k7) de final de línea.

    * Verificar las conexiones de salida de la placa base. Compruebe que están correctamente
    instaladas.

    * Ajustar el retardo deseado de las sirenas.

    * Verificar que la tensión de red es de 230VAC mediante el uso de un voltímetro
    y compruebe que las baterías tienen una tensión superior a 24V." [F9]'
