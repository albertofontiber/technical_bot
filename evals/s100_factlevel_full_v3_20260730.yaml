- qid: hp006
  question: La Notifier AFP-400 muestra el aviso 'Tierra' (Earth Fault). ¿Qué significa
    y cómo se localiza?
  answer: "## Aviso 'Tierra' (Earth Fault) en la AFP-400\n\nEl aviso de **Tierra (Earth\
    \ Fault)** indica que se ha detectado una fuga a tierra en algún punto del cableado\
    \ o circuitos del sistema. A continuación te explico qué significa y cómo localizarlo.\n\
    \n---\n\n### ¿Qué indica este aviso?\n\nLa AFP-400 dispone de un **LED de Fallo\
    \ de Tierra** en la placa de alimentación **MPS-400** [F2]. Cuando se activa,\
    \ significa que existe una conexión no intencionada entre algún conductor del\
    \ sistema y tierra (chasis, canalización metálica, etc.).\n\nEn el SLC (lazo de\
    \ dispositivos), una falla de tierra genera condición de **Alarma/Problema** independientemente\
    \ del estilo de cableado utilizado (Estilo 4, Estilo 6 o Estilo 7) [F7].\n\n---\n\
    \n### Localización del fallo de tierra\n\n**Paso 1 — Confirmar el aviso en panel**\n\
    - El LED **\"Fallo de Tierra\"** de la MPS-400 estará encendido [F2].\n- El LED\
    \ **\"Avería del Sistema\"** (amarillo) en el frontal de la AFP-400 estará parpadeando\
    \ (si no reconocido) o fijo (si reconocido) [F1].\n\n**Paso 2 — Revisar el SLC**\n\
    - Una falla de tierra en el SLC genera condición de **Alarma/Problema** en todos\
    \ los estilos de cableado (4, 6 y 7) [F7]. Consulta la pantalla LCD de 80 caracteres\
    \ de la AFP-400 [F5] para identificar el dispositivo o zona afectada.\n\n**Paso\
    \ 3 — Revisar el cableado de alimentación**\n- Comprueba el cableado conectado\
    \ a **TB1** de la MPS-400, especialmente:\n  - **TB1-3**: Toma de Tierra [F2]\n\
    \  - **TB1-2**: Neutro [F2]\n  - **TB1-4**: Fase [F2]\n- Verifica que no haya\
    \ contacto entre conductores activos y el chasis o canalización metálica.\n\n\
    **Paso 4 — Verificar el puente JP2 (si aplica)**\n- En la MPS-400 existe el puente\
    \ **JP2**, que al cortarse **inhabilita la detección de Falla de Tierra** [F3].\
    \ Comprueba que este puente esté en su posición correcta (no cortado) si el aviso\
    \ es inesperado, o que esté cortado intencionadamente si se desea deshabilitar\
    \ esta función.\n\n> ⚠️ **Nota de seguridad:** No deshabilites la detección de\
    \ fallo de tierra salvo que sea estrictamente necesario y de forma temporal durante\
    \ el diagnóstico.\n\n**Paso 5 — Aislar por circuitos**\n- Desconecta los circuitos\
    \ de uno en uno (NACs en TB7–TB10, salidas DC en TB2, SLC) para identificar en\
    \ qué ramal está la fuga [F2][F4].\n\n---\n\nFuente: Manual de Funcionamiento\
    \ AFP-400 (MFDT170, sin revisión registrada); Manual de Instalación AFP-400 (MIDT170,\
    \ sin revisión registrada); AFP-300/AFP-400 Installation PN 50253SP, sin revisión\
    \ registrada.\n\n---\n\U0001F4D6 **Información adicional del manual:**\n- \"-\
    \ **TB1** (top left): Terminal block with connections labeled TB1\n- **TB2** (top\
    \ center): Terminal block labeled TB2\n- **TB3-TB6** (top right): Terminal blocks\
    \ labeled TB3-TB6\n- **TB7-TB10** (far right): Terminal blocks labeled TB7-TB10\n\
    - **Interruptor de Selección de Voltaje 115V/230V** (left side): Voltage selection\
    \ switch\n- **Circuitos de Aviso y Señalizaciones 1-4** (right side): Alarm and\
    \ signaling circuits 1-4\n- **Fallo de Tierra** (right side): Ground fault indicator\n\
    - **Activación de la Alimentación AC** (right side): AC power activation\n- **Placa\
    \ de Alimentación de la MPS-400** (bottom center): MPS-400 power supply board\"\
    \ [F2]\n- \"**TB7–TB10** – NAC (Circuitos de Aviso/ Extinción)\n\n1) + NAC/Salida\
    \ de Extinción (salida)\n2) – NAC/Salida de Extinción (salida)\n3) + Clase A (retorno)\n\
    4) – Clase A (retorno)\n\n**TB3-TB6** – Contactos Secos\n\n1) Com\n2) NC\n3) NO\"\
    \ [F2]\n- \"* 7 –24 VDC batería\" [F4]\n- \"* 2 – 1.25 A max.\" [F4]"
  family_resolved: true
