- qid: hp007
  question: ¿Cómo se realiza el test anual de un detector VESDA-E VEP según el manual
    del fabricante?
  answer: '# Test anual del detector VESDA-E VEP según el manual del fabricante


    El manual del VEP-A10-P establece **cuatro tareas de mantenimiento anual** (frecuencia
    "Una vez al año") en la Tabla 7-1 [F1]:


    ---


    ## Tareas anuales obligatorias


    1. **Realizar una prueba de humos** para comprobar la integridad de la red de
    tubería [F1]

    2. **Comprobar el flujo de la red de tubería** [F1]

    3. **Limpiar los puntos de muestreo** [F1]

    4. **Limpiar con agua la red de tubería** [F1]


    ---


    ## Procedimiento previo a cualquier prueba (precauciones obligatorias)


    Antes de iniciar el mantenimiento [F1]:


    - Informa a la **autoridad supervisora adecuada**

    - Asegúrate de que se **aíslen todos los dispositivos** que dependan del detector
    antes de ponerlo en funcionamiento

    - Ten en cuenta que cuando el detector está deshabilitado o en espera, **no emitirá
    advertencias de fuego**

    - Sigue los **procedimientos del sitio para evitar falsas alarmas** en los servicios
    supervisados


    ---


    ## Modo en espera durante el mantenimiento de tubería


    Cuando realices el mantenimiento de la red de tubería o los puntos de muestreo,
    establece el detector en **modo en espera** para apagar el aspirador [F6]:


    - En **Xtralis VSC**: selecciona *"Go to Standby"* en el menú *"Device"*

    - El LED desactivado parpadeará y se desactivará el aspirador [F6]

    - Para volver a activar la unidad: selecciona *"End Standby"* en el menú *"Device"*
    [F6]


    > ⚠️ En modo en espera se desactiva el aspirador y se detiene la detección de
    alarmas, aunque **sí continúa la detección y señalización de fallos** [F6]


    ---


    ## Prueba de humos: detalles del procedimiento


    La prueba de humos consiste en [F2]:


    1. Introducir una muestra de humo en el **orificio de muestreo más alejado**

    2. Medir el **tiempo de transporte** hasta que el humo llega al detector

    3. Registrar los resultados y compararlos con pruebas anteriores para detectar
    variaciones del sistema


    > 📋 El manual indica que los detalles completos del procedimiento de prueba de
    humo se encuentran en la **VESDA-E Commissioning Guide** (guía de puesta en marcha
    de VESDA-E) [F2]. Consulta ese documento para el procedimiento paso a paso.


    ---


    ## Comandos de prueba disponibles desde Xtralis VSC


    Para verificar el correcto funcionamiento del sistema durante el mantenimiento
    anual, están disponibles los siguientes comandos desde **Xtralis VSC** [F9]:


    - **Start Alarm Test**: simula nivel de humo de escala completa, generando condiciones
    de Alerta, Acción, Fuego 1 y Fuego 2 (activa relés de alarma salvo que el detector
    esté desactivado)

    - **Start Air Flow Fault Test**: comprueba el sistema de detección de circulación
    de aire apagando el aspirador

    - **Start Relay Test**: activa y desactiva los relés disponibles para probarlos

    - **Start Major Fault Test**: genera un fallo importante y desactiva el relé de
    fallo durante **2 minutos**

    - **Start Minor Fault Test**: genera un fallo menor y desactiva el relé de fallo
    durante **2 minutos**


    ---


    ## Nota sobre frecuencias


    El manual indica que la frecuencia de las comprobaciones puede variar en función
    de los **códigos y normas locales** y del **entorno de la instalación** [F1].
    Verifica siempre con la normativa aplicable en tu zona.


    ---


    **Fuente:** 33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores (sin revisión
    registrada); 33976_13_VESDA-E_VEP-A00-P_Product_Guide_A4_Spanish_lores (sin revisión
    registrada)


    ---

    ⚠️ **Obligaciones de evidencia del manual:**

    - "**Atención:** Pendant que le detecteur ou la zone est desactivee, aucun feu
    d''indication va etre emis par le detecteur." (33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores,
    p. 87) [F1]

    - "Se debe realizar una comprobación preliminar del sistema después de instalar
    el detector VEP-A10-P y antes de ponerlo en marcha." (33977_13_VESDA-E_VEP-A10-P_Product_Guide_A4_Spanish_lores,
    p. 54) [F5]'
