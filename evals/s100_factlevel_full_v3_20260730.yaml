- qid: cat010
  question: ¿Cómo se alimenta la sirena/avisador intrínsecamente seguro IS-mA1 en
    una zona peligrosa (ATEX) y cuáles son sus parámetros de seguridad intrínseca
    de entrada?
  answer: '## Alimentación e parámetros de seguridad intrínseca del IS-mA1


    El IS-mA1 es un avisador acústico certificado **ATEX e IECEx** para seguridad
    intrínseca, apto para zonas 0, 1 y 2 con gases y vapores inflamables de grupos
    **IIA, IIB e IIC**, clases de temperatura T1 a T4 [F1][F2].


    ---


    ### Parámetros de entidad de entrada (terminales + respecto a -)


    Estos son los valores máximos admisibles en los bornes de alimentación principal
    del avisador:


    - **Ui = 28 V** [F1][F3]

    - **Ii = 93 mA** [F1][F3]

    - **Pi = 660 mW** [F1][F3]

    - **Ci = 0** (capacitancia interna) [F1][F3]

    - **Li = 0** (inductancia interna) [F1][F3]


    > ⚠️ La capacitancia total conectada a los terminales +/- (cable + cualquier otra
    capacitancia) **no debe superar 83 nF** [F3][F4].


    ---


    ### Parámetros de entidad — terminales S2 y S3 (respecto a -)


    Estos terminales sirven para activar el 2.º y 3.er tono de alarma respectivamente
    [F9]:


    - **Ui = 28 V** [F3][F5]

    - **Ii = 0 mA** [F3][F5]

    - **Ci = 0** [F3]

    - **Uo = 16,8 V** [F3]

    - **Io = 7,3 mA** [F3]

    - **Po = 31 mW** [F3]


    > ⚠️ Como la corriente de entrada permitida es **cero**, los terminales S2 y S3
    **solo pueden conectarse** a [F5][F6]:

    > - Barrera de diodo de retorno (con caída de tensión < **0,9 V**)

    > - Relé intrínsecamente seguro

    > - Aislador galvánico

    >

    > Todos ellos deben estar certificados por un Organismo Notificado CE. Alternativamente,
    pueden conectarse directamente a un interruptor de accionamiento mecánico en la
    zona peligrosa [F5][F6].

    >

    > ⚠️ La separación entre los terminales S2 y S3 es **inferior a 6 mm** — tener
    precaución durante el conexionado [F3][F4].


    ---


    ### Aparato asociado requerido (zona segura)


    **Opción A — Aislador galvánico** [F3][F10]:

    - Uo ≤ 28 V, Io ≤ 93 mA, Po ≤ 660 mW

    - Debe estar certificado Ex ia por Organismo Notificado CE

    - No requiere conexión a tierra de alta integridad [F10]


    **Opción B — Barrera Zener (shunt zener diode barrier)** [F4][F7]:

    - Uo ≤ 28 V, Io ≤ 93 mA, Po ≤ 660 mW

    - Debe ser de un solo canal, aprobada FM, con salida no incendiaria para el grupo
    y zona de uso [F4]

    - Requiere resistencia entre tierra intrínsecamente segura y tierra de protección
    **< 1 Ω** [F4]


    ---


    ### Configuración multietapa (2.º y 3.er tono)


    - Conectar **S2 a 0 V** (terminal –) activa el 2.º tono de alarma [F9]

    - Conectar **S3 a 0 V** (terminal –) activa el 3.er tono de alarma [F9]

    - Para la configuración multietapa con barreras Zener, ver **Fig 6** del manual
    [F9]

    - Para la configuración multietapa con aisladores galvánicos, ver **Fig 8** del
    manual [F10]


    ---


    ### Datos de certificación


    - Clasificación ATEX: **II 1G Ex ia IIC T4 Ga** [F1]

    - Rango de temperatura ambiente: **-40 °C ≤ Ta ≤ +60 °C** [F1]

    - Certificado: **SIRA 05ATEX2084X** (sufijo X = condiciones especiales de uso)
    [F1]

