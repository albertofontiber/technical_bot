- qid: cat020
  question: En una central Morley DXc instalada en Espana, ¿cual es el nivel de alarma
    y de prealarma por defecto de los detectores, y el maximo configurable?
  answer: '## Niveles de alarma y prealarma en la DXc — Protocolo Morley-IAS


    **Por defecto: prealarma 80% y alarma 100%.** El máximo configurable para el nivel
    de alarma es **108%**.


    ---


    ### Valores por defecto


    Para detectores con protocolo Morley-IAS en la central DXc:


    - **Nivel de prealarma por defecto: 80%** [F2]

    - **Nivel de alarma por defecto: 100%** [F2]


    Estos valores son los recomendados por el fabricante y se aplican a todos los
    detectores analógicos, independientemente del tipo de equipo [F2].


    ---


    ### Rango configurable


    - **Nivel de alarma:** ajustable entre **80% y 108%** [F6]

    - **Nivel de prealarma:** ajustable entre **80% y 108%**, con la restricción de
    que **el nivel de prealarma no puede ser superior al de alarma** [F10]


    > ⚠️ El ajuste máximo del **108%** para el nivel de alarma está documentado específicamente
    para la DXc [F2]. El manual advierte expresamente: *"Asegúrese de que el sistema
    mantiene los niveles de seguridad en la detección"* si se modifican estos valores
    [F10].


    ---


    ### Caso especial: detectores multicriterio (OTM) y láser


    Los detectores **Multicriterio (OTM)** y **láser** de Morley-IAS no trabajan con
    porcentaje directo, sino con **niveles numerados**. Sus valores por defecto recomendados
    son [F3]:


    **Detector Óptico-Térmico (OTM):**

    - Prealarma recomendada: **Nivel 3** (valor analógico 72, sensibilidad 6,5% osc./m)

    - Alarma recomendada: **Nivel 4** (valor analógico 86, sensibilidad 6,5–11,5%
    osc./m autoajustado)


    **Detector Láser:**

    - Prealarma recomendada: **Nivel 4** (valor analógico 69, sensibilidad 0,32% osc./m)

    - Alarma recomendada: **Nivel 5** (valor analógico 76, sensibilidad 0,65% osc./m)


    ---


    Fuentes: DXc_Manual variaciones de mercado (sin revisión registrada) [F2, F3];
    MIE-MP-520rv04 (rev. 4) [F6, F10]


    ---

    📋 **Información adicional del manual:**

    - Nota: el manual también indica: "### 5.3.10.5.1 Información específica para
    protocolo Morley-IAS


    • El valor analógico debe ser un número normalizado entre 0% – 100%, independientemente
    del tipo de equipo. Para los detectores, el nivel de prealarma por defecto es
    el 80% y el nivel de alarma por defecto es el 100%.


    • El ajuste máximo para el nivel de alarma es el 108%." [F2]

    - "Fuego    : Niv4

    Prealarma: Niv3


    Introd nivel Fuego     : 3" [F2]


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "el umbral de alarma de fuego depende del ajuste del nivel/modo y es diferente
    para cada nivel de alarma." (DXc_Manual variaciones de mercado, p. 5) [F3]

    - "Estos valores se definen para cada equipo y su configuración es automática
    en la central de forma que el valor del pulso analógico varia para cada equipo,
    pero los recomendados por el fabricante se corresponden siempre con «100» para
    alarma y «80» para prealarma." (MIE-MI-320, p. 3) [F4]

    - "El valor normal de Prealarma es de 80% y el de Alarma de 100% para cualquier
    sensor." (MIE-MP-530rv001, p. 24) [F7]'
