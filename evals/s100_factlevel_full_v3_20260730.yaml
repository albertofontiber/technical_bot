- qid: cat022
  question: En los detectores de llama Spectrex SharpEye 40/40, ¿qué diferencia hay
    entre el modelo 40/40L y el 40/40L4, y qué significa el sufijo «B» (p. ej. 40/40LB)?
  answer: '## Diferencias entre 40/40L, 40/40L4 y sufijo «B»


    Los fragmentos disponibles permiten responder parcialmente esta pregunta.


    ---


    ### Modelos cubiertos por el manual


    El manual MNDT722_40-40L cubre los modelos **S40/40L, LB, L4 y L4B** [F1], confirmando
    que son variantes de la misma familia.


    ---


    ### Diferencia entre 40/40L y 40/40L4: sensibilidad


    La diferencia más clara que aparece en los fragmentos es la **sensibilidad de
    detección**:


    - **40/40L y 40/40LB** — sensibilidad ajustable a **50/15 ft/m** (único ajuste
    listado) [F2]

    - **40/40L4 y 40/40L4B** — sensibilidad ajustable a **93/28 ft/m** (único ajuste
    listado) [F2]


    > ⚠️ Los fragmentos solo muestran un valor de ajuste por modelo en esas tablas.
    No puedo confirmar si existen más rangos de sensibilidad disponibles para cada
    variante — consulta la tabla completa de especificaciones en el Apéndice A del
    manual físico [F10].


    ---


    ### Significado del sufijo «B»


    El sufijo **«B»** indica que el detector incorpora **BIT (Built-In Test / Prueba
    incorporada)** [F7].


    - Sin sufijo «B» (ej. **40/40L**): sin BIT incorporada

    - Con sufijo «B» (ej. **40/40LB**): con BIT incorporada


    Este mismo criterio se confirma en la familia 40/40U, donde el manual MNDT723_40-40U
    define explícitamente:

    - **U** = UV sin BIT [F3]

    - **UB** = UV con BIT [F3]


    La prueba BIT permite al detector realizar comprobaciones funcionales continuas,
    y su activación es requisito para cumplir **SIL-2** según **EN 61508** [F8].


    ---


    ### Resumen


    - **L vs L4**: diferente alcance/sensibilidad de detección (15 m vs 28 m según
    los ajustes listados) [F2]

    - **Sufijo B**: incorpora BIT (prueba automática incorporada) [F3][F7]

    - **L4B**: combina ambas características — mayor alcance + BIT incorporada [F1]


    ---


    Fuente: MNDT722_40-40L (sin revisión registrada); manual-sharpeye-40-40-series-winhost-spectrex-en-us-4845694
    (TM777050 Rev. Da, octubre 2017); MNDT723_40-40U (sin revisión registrada)'
