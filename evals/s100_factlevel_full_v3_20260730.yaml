- qid: cat016
  question: En la Detnov CAD-150, ¿como se da de alta un detector nuevo en el lazo
    y como se prueba que funciona?
  answer: "# CAD-150-8: Alta de detector nuevo en lazo y prueba de funcionamiento\n\
    \n## PARTE 1 — Dar de alta un detector nuevo en el lazo\n\nEl procedimiento para\
    \ incorporar un nuevo detector al sistema es mediante la **autobúsqueda del lazo**\
    \ [F1]:\n\n1. Accede al **menú BUCLE** desde el teclado de la central [F1].\n\
    2. Ejecuta la **autobúsqueda del lazo** correspondiente. El sistema realizará\
    \ un escaneo y mostrará todos los elementos que detecta en el lazo [F1].\n3. Verifica\
    \ que los elementos encontrados coinciden con los planos de la instalación [F1].\n\
    4. Una vez detectado el nuevo elemento, accede al **menú ELEMENTOS** para:\n \
    \  - Asignarle un **nombre** identificativo [F1].\n   - Asignarle una **zona**\
    \ de ubicación [F1].\n\n> **Nota previa a la puesta en marcha:** Antes de alimentar\
    \ el equipo, verifica con voltímetro que en el lazo no existen cortocircuitos\
    \ ni circuitos abiertos [F7].\n\n---\n\n## PARTE 2 — Probar que el detector funciona\n\
    \n### Opción A — Prueba por zona (recomendada, sin rearmar la central)\n\n1. Accede\
    \ al **menú ZONA** [F2].\n2. Selecciona la opción **PRUEBA** [F2].\n3. Introduce\
    \ el **rango de zonas** a poner en prueba (campo `RANGO: [000] a [250]`) [F2].\n\
    4. El sistema preguntará si deben dispararse las sirenas (`ACTIVAR SIRENAS: [SI/NO]`)\
    \ [F2]:\n   - Si seleccionas **SÍ**: las sirenas se activarán durante unos segundos\
    \ tras la entrada en alarma del detector y se silenciarán automáticamente [F2].\n\
    \   - Cualquier retardo programado en sirenas queda **anulado** durante el modo\
    \ prueba para agilizar la verificación [F2].\n5. Activa el detector (mediante\
    \ aerosol de prueba u otro método).\n6. Verifica que la central registra la alarma\
    \ correctamente.\n\n> **Tiempo límite:** Si transcurridos **20 minutos** desde\
    \ la activación del modo prueba no se ha producido ningún disparo de alarma, el\
    \ sistema **vuelve automáticamente al estado normal**, cancelando el modo prueba\
    \ [F2].\n\n**Para salir del modo prueba:** Conecta la zona desde el menú ZONA\
    \ → opción **Conectar** [F2].\n\n---\n\n### Opción B — Verificación del estado\
    \ del elemento individual\n\nPuedes comprobar el estado del detector concreto\
    \ accediendo al **menú ELEMENTO → VER** [F4]:\n\n- **BUCLE**: selecciona el bucle\
    \ al que pertenece el detector [F4].\n- **DIR**: dirección del elemento en el\
    \ lazo [F4].\n- **ZONA**: zona asignada al elemento [F4].\n- **TIPO**: tipo de\
    \ elemento (óptico, térmico, etc.) [F4].\n- **MODO**: estado actual (conectado,\
    \ desconectado, en prueba) [F4].\n- **VA**: valor analógico del detector en tiempo\
    \ real [F4].\n- **TEXTO**: denominación asignada al elemento [F4].\n\n---\n\n\
    ### Verificación final del sistema\n\nTras la prueba, confirma [F8]:\n- Que al\
    \ provocar una alarma se activa el **relé de alarma** [F8].\n- Que se activan\
    \ las **salidas de sirena** una vez transcurrido el tiempo de retardo programado\
    \ [F8].\n\n---\n\n**Fuentes:**\n- `55315013 Manual Centrales Analógicas CAD-150-8\
    \ Instalación ES FR GB IT` (sin revisión registrada)\n- `55315008 Manual Centrales\
    \ Analógicas CAD-150-8 Usuario ES FR GB IT` (sin revisión registrada)\n\n---\n\
    ⚠️ **Información adicional del manual:**\n- \"En caso de necesidad, se puede encender\
    \ el equipo solo con las baterías conectadas, pero es imprescindible pulsar sobre\
    \ el pulsador BAT para arrancar el equipo.\" [F7]\n\n---\n\U0001F4D6 **Obligaciones\
    \ de evidencia del manual:**\n- \"» Poner el equipo en estado de prueba, y verificar\
    \ que todos los detectores y pulsadores funcionan de acuerdo con las especificaciones\
    \ del fabricante.\" (55315008-Manual-Centrales-Analogicas-CAD-150-8-Usuario-ES-FR-GB-IT,\
    \ p. 37) [F9]"
