- qid: hp008
  question: ¿Qué detectores de humo analógicos son compatibles con la Notifier ID3000?
  answer: "Los detectores de humo analógicos compatibles con la ID3000 son los siguientes:\n\
    \n**Detectores ópticos:**\n- **SDX-751EM** — Óptico [F1]\n- **SDX-751-TEM (OptiPlex)**\
    \ — Óptico combinado térmico/humo [F1][F2]\n- **SDX551E** — Óptico [F2]\n- **SDX-751**\
    \ — Óptico [F2]\n- **SDX-551THE** — Óptico [F2]\n- **HPX-751E (HARSH/FILTREX)**\
    \ — Óptico para entornos agresivos [F1][F2]\n\n**Detectores iónicos:**\n- **CPX-751E**\
    \ — Iónico (bajo perfil) [F1][F2]\n- **CPX-551E** — Iónico [F2]\n\n**Detectores\
    \ láser (humo):**\n- **FSL-751E / LPX-751 (VIEW™)** — Humo láser de alta sensibilidad\
    \ [F1][F2]\n\n**Detectores multicriterio (humo + otros):**\n- **IRX-751CTEM (SMART\
    \ 4)** — Óptico/térmico/infrarrojo/CO [F2][F5]\n- **IRX-751TEM (SMART 3)** — Multicriterio\
    \ [F2]\n\n**Detector para entornos especiales:**\n- **IDX-751 (HAZARD)** — Óptico\
    \ intrínsecamente seguro [F1][F2]\n  - Requiere aislador galvánico **Y72221**\
    \ para seguridad intrínseca [F2]\n\n---\n\n**Nota sobre los sensores VIEW™:**\
    \ Se configuran con 9 niveles de sensibilidad (L1 más sensible, L9 menos sensible).\
    \ La sensibilidad estándar es **2,44%/m (L8)** o menos [F7].\n\n**Nota sobre el\
    \ OptiPlex (SDX-751TEM):** Dispone de modo de funcionamiento \"solo térmico\"\
    \ (nivel L6) activable por programación horaria o tecla Modo Día [F9].\n\n---\n\
    \nFuentes: MPDT190 (sin revisión registrada); MIDT190 (sin revisión registrada);\
    \ MCDT190 (sin revisión registrada); MCDT191 (sin revisión registrada)"
