per_gold:
- qid: cat001
  question: En la Notifier PEARL, ¿cuántos equipos admite un lazo SLC y qué límites
    de cableado hay (aisladores), y cómo se dan de alta y editan esos equipos desde
    la central?
  answer: "# Notifier PEARL — Capacidad de lazo SLC, límites de aisladores y alta/edición\
    \ de equipos\n\n---\n\n## 1. Capacidad máxima del lazo SLC\n\nLa central Pearl\
    \ admite un **máximo de 318 equipos por lazo analógico**, desglosados en hasta\
    \ **159 sensores + 159 módulos** (protocolo Opal) [F1].\n\nDesglose por protocolo:\n\
    \n- **Protocolo Opal:** hasta 159 sensores + 159 módulos por lazo [F2]\n- **Protocolo\
    \ CLIP:** hasta 99 sensores + 99 módulos por lazo [F2]\n- **Protocolo mixto Opal\
    \ + CLIP:** el límite de equipos CLIP en lazo mixto es de **40**; si se supera,\
    \ la autoconfiguración continúa pero señala fallos [F6]\n\nLímite global del sistema\
    \ (ambos lazos combinados):\n\n- **Máximo 512 sensores y/o pulsadores manuales**\
    \ en total por sistema (ambos lazos), incluyendo detectores de zona convencionales\
    \ conectados — requisito **EN54-2: 13-7** [F1]\n\n---\n\n## 2. Límites de cableado\
    \ y aisladores\n\nRequisito **EN54-2: 12.5.2** — máximo **32 equipos entre aisladores**\
    \ [F1].\n\nPara la Pearl, los límites concretos son:\n\n- **Equipos sin aisladores\
    \ internos** (incluidos CLIP y algunos Opal): **no más de 20 equipos entre aisladores**\
    \ [F1]\n- **Equipos con aisladores internos FET** (bases B501 AP): los lazos deben\
    \ cumplir los requisitos de EN54-2 (máx. 32) [F1]\n- **Nota adicional de la sección\
    \ 6.4.2:** no colocar más de **25 equipos entre aisladores** (20 si se usan aisladores\
    \ FET) [F8]\n\n> ⚠️ Para que los aisladores del lazo se cierren correctamente\
    \ al aplicar alimentación, la carga entre aisladores no debe superar **20 SU**\
    \ [F7].\n\nSobre el cableado:\n\n- La **capacitancia del cable debe ser inferior\
    \ a 0,5 µF** [F12]\n- La resistencia máxima del lazo no debe superar los límites\
    \ definidos en la sección **6.4.2**, paso 2; para comprobarlo: medir entre IN-\
    \ y OUT-, multiplicar por 2 y añadir la resistencia de cada aislador (**entre\
    \ 0,1 y 0,13 ohms cada uno**) [F12]\n- La pantalla del cable solo debe conectarse\
    \ a tierra en la central [F11]\n\n> ⚠️ **NUNCA utilice un multímetro de alta tensión\
    \ (tipo Megger) en el lazo de detección.** Si hay aisladores instalados, el conductor\
    \ positivo (+) del lazo será circuito abierto [F1].\n\nSobre bases con aisladores\
    \ internos:\n\n- Los equipos con aisladores internos requieren la base **B501\
    \ AP** (con conectores de cable de lazo de extremo positivo adicionales). Sin\
    \ esta base, el aislador interno queda inutilizado [F1]\n\n---\n\n## 3. Alta de\
    \ equipos: Autoconfiguración\n\nLa forma recomendada de dar de alta equipos es\
    \ mediante la **función de autoconfiguración** desde el menú de la central [F5].\n\
    \n**Pasos:**\n\n1. Accede al menú de configuración → **Equipos de lazo** [F5]\n\
    2. Selecciona **1: Autoconfiguración** [F5]\n3. Elige el alcance: **todos los\
    \ lazos** o **un lazo específico** [F5]\n4. Selecciona el modo de protocolo:\n\
    \   - **1: Todos Prot. OPAL/CLIP** — detecta duplicidades de dirección [F5][F6]\n\
    \   - **2: OPAL/CLIP (No detecta duplicidad)** — más rápido, sin comprobación\
    \ de duplicados [F5][F6]\n   - **3: Sólo con protocolo CLIP** — solo autoconfigura\
    \ equipos CLIP [F5][F6]\n5. Selecciona el modo de cambios:\n   - **1: Permite\
    \ Añadir/Borrar/Cambiar** [F6]\n   - **2: Sólo Añadir Nuevos Equipos** [F6]\n\
    6. El proceso se inicia automáticamente. Los sensores y módulos (Opal y CLIP)\
    \ se detectan en la misma pasada [F5]\n7. Al finalizar, los resultados se muestran\
    \ por lazo en pantalla LCD; usa las teclas **◄/►** para navegar entre lazos [F6]\n\
    \n**Notas importantes:**\n- Si un equipo Opal se autoconfigura, por defecto será\
    \ Opal [F6]\n- Los pulsadores CLIP se autoconfiguran como «MON» y **deben cambiarse\
    \ manualmente a tipo «cPUL»** [F9]\n- La configuración puede transferirse a un\
    \ ordenador portátil con el programa **ITS** para editarla y archivarla [F5]\n\
    - Los equipos configurados pueden consultarse en cualquier momento desde el **nivel\
    \ de acceso 2 → «Resumen de Equipos»** [F5]\n\n---\n\n## 4. Edición individual\
    \ de equipos\n\nTras la autoconfiguración, es posible editar individualmente cada\
    \ sensor o módulo [F4].\n\n**Para sensores**, los parámetros editables incluyen\
    \ [F4]:\n\n- Números de referencia de zona de red\n- Tipo de equipo\n- Entorno\
    \ del número de referencia de zona (opcional)\n- Número de central (LOCAL; 1-125\
    \ para otras centrales de red)\n- Número de zonas (hasta **255 zonas locales**\
    \ o **8192 zonas de red**)\n- Número de células (hasta **255**)\n- Prioridad de\
    \ interrogación (solo CLIP: limitada a **30 equipos**)\n- Acción de parpadeo en\
    \ equipo interrogado (elección de color solo para Opal)\n- Opción de tipo de equipo\
