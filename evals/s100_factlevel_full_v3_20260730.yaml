- qid: cat011
  question: Necesito un detector de humos analógico direccionable «751» para una instalación
    Notifier; ¿cuál es el modelo correcto?
  answer: 'El modelo correcto depende de la aplicación concreta, ya que existen varias
    variantes del detector «751» de humo óptico analógico direccionable en el catálogo
    Notifier.


    ## Variantes disponibles del detector óptico «751»


    **SDX-751** — Detector óptico analógico de bajo perfil (versión reducida del SDX-551)
    [F5][F10]


    **SDX-751TEM** — Sensor combinado óptico + térmico fijo (58 °C), analógico direccionable
    [F2][F7]

    - Tensión de funcionamiento: **15 a 32 Vdc** [F2]

    - Corriente en reposo máx.: **250 µA a 24 Vdc** (sin comunicación) [F2]

    - Corriente media en reposo máx.: **300 µA** (comunicaciones cada 5 s con parpadeo
    de LED) [F2]

    - Corriente máx. en alarma (LED encendido): **7 mA a 24 Vdc** [F2]

    - Temperatura de funcionamiento: **-30 °C a 80 °C** [F2]

    - Temperatura nominal de activación térmica: **58 °C** [F2]

    - Humedad de funcionamiento: **10% a 93% HR, sin condensar** [F2]

    - Altura instalado en base B501: **43 mm** [F2]

    - Diámetro instalado en base B501: **102 mm** [F2]

    - Peso: **111 g** [F2]

    - Certificado según **EN54:2000 partes 5 y 7 y CEA4021** [F2]


    **IDX-751** — Sensor óptico analógico intrínsecamente seguro (para zonas ATEX,
    requiere barrera/traductor IMX-1) [F3]

    - Tensión de funcionamiento: **17 a 24 Vdc** [F3]

    - Corriente en reposo: **330 µA a 24 Vdc** [F3]

    - Corriente máx. en alarma (LED encendido): **2,5 mA a 24 Vdc** [F3]

    - Temperatura de funcionamiento (Europa): **-10 °C a 60 °C** [F3]

    - Diámetro instalado en B501: **104 mm** [F3]

    - Peso: **102 g** [F3]


    **SDX-751XXXX** — Sensor óptico de bajo perfil (listado como compatible con centrales
    ID50/60) [F6]


    ## Recomendación práctica


    - Para **protección de zonas diáfanas estándar** → **SDX-751** o **SDX-751TEM**
    (si necesitas detección combinada óptico+térmica) [F5][F2]

    - Para **zonas con atmósfera potencialmente explosiva** → **IDX-751** (requiere
    traductor **IMX-1** suministrado aparte) [F3]

    - Todos los modelos se montan en **base B501** [F2][F3]


    ¿Puedes indicarme qué central Notifier tienes instalada y si la zona es de riesgo
    de explosión? Así confirmo qué variante es la adecuada para tu instalación.


    ---


    Fuentes: I56-1320-001 SDX-751TEM (sin revisión registrada); MNDT1020 IDX-751 (sin
    revisión registrada); MIDT230 AFP4000 (sin revisión registrada); MIDT156 ID50/60
    (sin revisión registrada); MIDT170 AFP-400 (sin revisión registrada)'
