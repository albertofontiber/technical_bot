- qid: hp005
  question: En la Notifier ID3000, ¿cómo se programa una zona para que active una
    salida de sirena solo cuando haya coincidencia de dos detectores?
  answer: '# Programación de coincidencia de dos detectores para activar sirena —
    ID3000


    Hay **dos métodos** disponibles en la ID3000 para lograr este comportamiento.
    Te explico ambos:


    ---


    ## MÉTODO 1: Coincidencia en la Matriz de Control (por zona/subzona)


    Este es el método clásico mediante la Matriz de Control.


    **Requisito previo importante:** La función de coincidencia en la Matriz de Control
    solo se aplica si la entrada está especificada como **''ZONA''**, **''SUBZONA''**
    o **''CUALQUIERA''** — no si es un equipo individual o una tecla [F1].


    ### Pasos:


    **1. Configurar la instrucción para los pulsadores manuales (MCP) — SIN coincidencia**


    Debes crear una primera instrucción de Matriz de Control donde:

    - Entrada: tipo **''Pulsador Manual'' (MCP)**

    - Coincidencia: **Simple** (sin coincidencia) [F1]


    > ⚠️ **EN54-2: 7.1.4 — No incluyas pulsadores manuales en un grupo de coincidencia**
    [F1][F3].


    **2. Configurar la instrucción para los detectores — CON coincidencia**


    Crea una segunda instrucción de Matriz de Control donde:

    - Entrada: tipo **''ANALÓGICA''** (incluye detectores TÉRMICOS, IÓNICOS, ÓPTICOS,
    VIEW y MULTISENSOR) [F1]

    - Zona: selecciona la zona específica donde están los detectores [F2]

    - Coincidencia: activa la columna **''SÍ''** (pulsa la barra ESPACIADORA para
    cambiar de NO a SÍ) [F1]


    Con esto, **deben activarse las alarmas de dos equipos de esa zona** antes de
    que se active la salida de sirena [F1].


    **3. Definir la salida**


    - Salida: el circuito de **sirena** correspondiente [F11]


    ---


    ## MÉTODO 2: Coincidencia de Equipos en la Matriz de Control (por equipo, dentro
    de una zona)


    Si prefieres trabajar a nivel de equipo individual dentro de una zona única:


    **1.** En la Matriz de Control, al definir la entrada, selecciona **''Única zona''**
    en el paso de coincidencia de múltiples zonas [F3].


    **2.** En el paso de **''Coincidencia de equipos''** (paso 8), selecciona la opción
    **''COINCIDENCIA 2 EQUIPOS''** [F3].


    > **Nota:** Para que tenga lugar la coincidencia de equipos, los equipos en alarma
    deben estar en la **misma zona o subzona** [F3].


    **3.** Recuerda igualmente crear una instrucción separada para los pulsadores
    (MCP) sin coincidencia [F3].


    ---


    ## MÉTODO 3 (alternativo): Coincidencia a nivel de central — función de "Coincidencia
    de equipos" global


    Existe también una función de coincidencia a nivel de central (independiente de
    la Matriz de Control) que pospone la alarma hasta cumplir criterios de coincidencia.
    En este caso el sistema entra en estado de **PRIMERA ALARMA / PREALARMA** con
    un solo detector, y solo entra en **ALARMA** cuando se cumple el nivel de coincidencia
    configurado [F10].


    Los niveles disponibles incluyen, entre otros:

    - **Nivel 2:** Dos o más sensores en la misma zona [F10]

    - **Nivel 3:** Dos o más sensores en diferentes zonas pero en la misma central
    [F10]

    - **Nivel 4:** Dos o más sensores en la misma zona o zonas diferentes y en la
    misma central [F10]


    > **Nota importante:** Esta función actúa **antes** de que el sistema entre en
    alarma (a diferencia de la Matriz de Control, que comprueba la coincidencia después
    de entrar en alarma) [F10]. Los niveles de coincidencia **no se pueden aplicar
    a módulos** — para módulos de entrada el nivel efectivo es siempre ''1'' (sin
    coincidencia) [F10].


    ---


    ## Configuración de parámetros de coincidencia (pestaña de la central)


    Para ajustar los parámetros globales de coincidencia, accede a **Modificar Opciones
    de la Central → pestaña "Coincidencia de Alarma"** [F4]:


    - **Nivel de Coincidencia de Equipos en Alarma:** configura los niveles 3, 4,
    etc. (número de equipos que deben estar en alarma) [F4]

    - **Funcionamiento para ''Cualquier Zona'':** elige si los equipos deben estar
    en la misma central/red o en la misma zona [F4]

    - **Funcionamiento en Subzonas:** elige si deben estar en la misma subzona o en
    un rango de subzonas [F4]


    ---


    **Fuentes:**

    - MCDT190 — ID3000 Manual de programación (sin revisión registrada)

    - MCDT191_F v. 2.17e — ID3000 Manual del programa de configuración PK-ID3000 (sin
    revisión registrada)

    - MPDT190_D — Panel ID3000 Manual de programación (sin revisión registrada)

    - MADT190_14 — Anexo ID3000. Versión de software 4.63 (sin revisión registrada)


    ---

    📖 **Información adicional del manual:**

    - "- Radio button: Deber estar en la misma Subzona

    - Radio button: Se extiende en el rango de Subzonas especificadas (labeled as
    4)" [F4]

    - "- Radio button: Misma Central o Red

    - Radio button: Siempre la misma Zona" [F4]'
