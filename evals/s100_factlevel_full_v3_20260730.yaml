- qid: hp015
  question: En la Detnov CCD-103, ¿cómo se desactiva un detector individualmente sin
    afectar al resto del lazo?
  answer: "La CCD-103 **no permite desactivar un detector individual**: la unidad\
    \ mínima de desconexión es la **zona completa**, no un detector concreto.\n\n\
    Lo que sí puedes hacer es **desconectar la zona** que contiene ese detector. El\
    \ procedimiento es el siguiente:\n\n1. Asegúrate de que la **llave de bloqueo\
    \ de teclado (G)** está en posición **abierta** (desbloqueada) [F2].\n2. Pulsa\
    \ la **tecla de zona (A)** correspondiente **dos veces**:\n   - Primera pulsación\
    \ → la zona entra en **modo prueba** [F2].\n   - Segunda pulsación → la zona entra\
    \ en **modo desconexión** [F1] [F2].\n3. Confirma el estado mediante los indicadores:\n\
    \   - **Indicador de anular (4):** se enciende de forma **continua** [F1] [F5].\n\
    \   - **Indicador amarillo de zona (6):** se enciende de forma **fija** (fijo\
    \ = desconexión; intermitente = avería/prueba) [F5].\n\nPara **reconectar la zona**,\
    \ pulsa la tecla de zona **una vez** [F1].\n\n---\n\n⚠️ **Advertencia importante:**\
    \ Cuando una zona está desconectada, la central **no refleja ninguna incidencia\
    \ ni evento** en esa zona [F1]. Esto afecta a **todos los detectores y pulsadores**\
    \ de esa zona, no solo al detector problemático. Limita el tiempo de uso de esta\
    \ maniobra al mínimo imprescindible [F1].\n\n---\n\nFuente: CCD-103_Manual_ES_FR_GB_IT\
    \ (sin revisión registrada)"
