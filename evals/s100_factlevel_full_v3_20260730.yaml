- qid: hp001
  question: En la Detnov CAD-250, ¿cómo se entra al menú de programación avanzada?
  answer: "## Acceso al menú de programación avanzada — CAD-250\n\nLa ruta de acceso\
    \ es: **AJUSTES** (Menú principal) **> AVANZADO** (Submenú) [F1][F10].\n\n###\
    \ Pasos completos:\n\n1. Desde la **pantalla de reposo**, toca el icono del **candado\
    \ (\U0001F512)** [F2].\n2. Introduce la **clave de administrador** (por defecto:\
    \ **2222**) [F2][F3].\n   - ⚠️ Este nivel requiere autorización y conocimientos\
    \ adecuados. El uso indebido puede provocar mal funcionamiento de la instalación\
    \ [F2][F3].\n3. Una vez en la pantalla de administrador, selecciona **AJUSTES**\
    \ en el menú principal (barra lateral izquierda) [F10].\n4. En el submenú de la\
    \ derecha, selecciona **AVANZADO** [F1].\n\n### Contenido del menú AVANZADO:\n\
    \nDispone de **3 pestañas** [F1]:\n\n- **SISTEMA:** Configura número de cabinas\
    \ (PANELES: 1 a 4), número de lazos (2, 4, 6, 8... hasta 32 según cabinas) y si\
    \ hay cabina con LEDs de zona (0 ó 1). Los cambios requieren pulsar **Guardar\
    \ y Reiniciar** [F1].\n- **OTROS:** Interruptores para facilitar puesta en marcha\
    \ y mantenimiento (tiempo de inactividad, salto a scroll si incidentes, saltar\
    \ a último incidente prioritario si timeout, entre otros) [F6][F7].\n  - ⚠️ Por\
    \ razones de seguridad y cumplimiento normativo, todos los interruptores de inactividad,\
    \ timeout y scroll deben estar activados (en verde) por defecto [F6][F7].\n- **REINICIAR:**\
    \ Devuelve los valores de configuración del panel a valores por defecto. No afecta\
    \ a configuración de entidades, lazos, maniobras, grupos, módulos virtuales, modos\
    \ especiales, filtros de red ni registros de eventos [F6].\n\n### Requisito de\
    \ nivel de acceso:\n\nEl menú **AVANZADO** es accesible desde el **Nivel 2 (Editar\
    \ configuración)**, que requiere código de administrador [F4].\n\n---\n\nFuente:\
    \ CAD-250 Manual de Configuración MC-380-es-2026-c (rev. c, 2026-04-23)"
