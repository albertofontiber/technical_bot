- qid: hp010
  question: En la Morley DXc, ¿cómo se añade un nuevo detector al lazo tras la puesta
    en marcha inicial?
  answer: "# Añadir un nuevo detector al lazo en la DXc tras la puesta en marcha\n\
    \nEl procedimiento es la **Autobúsqueda de equipos**, accesible desde el menú\
    \ de Lazos en Nivel de acceso de Programador [F1].\n\n---\n\n## Pasos\n\n1. Conecta\
    \ físicamente el nuevo detector al lazo, respetando la polaridad positivo/negativo\
    \ y el cableado en bucle cerrado [F3].\n\n2. Accede al menú de **Lazos** en la\
    \ central DXc.\n\n3. Pulsa la tecla **'2'** para seleccionar la función **'Autobúsqueda'**\
    \ [F1].\n\n4. Si la central tiene más de un lazo, introduce el número de lazo\
    \ correspondiente y pulsa **⊙** para confirmar [F1]:\n   ```\n   [Autobusqueda]\n\
    \   Sel.Num.Lazo (1-2) :1\n   ```\n\n5. La central pedirá confirmación. Pulsa\
    \ **⊙** para iniciar el proceso [F1]:\n   ```\n   [Autobusqueda]\n   Lazo: 1 \
    \ Autobusqueda?\n   ```\n\n6. Espera a que finalice el reconocimiento (se muestra\
    \ barra de progreso en pantalla) [F1].\n\n7. Al terminar, verifica el resumen\
    \ en pantalla. El nuevo detector debe aparecer en el campo **Nuevos** con valor\
    \ ≥ 1 [F1]:\n   ```\n   [Lazo]\n   Lazo: 1           Total: 13\n   Nuevos:1  \
    \        Elimin.:0  Cambiad:0\n   ```\n\n8. Comprueba que el tipo de equipo mostrado\
    \ (ION, OPT, TMP, MLT, etc.) corresponde al detector instalado [F1].\n\n9. Pulsa\
    \ **⊞** para salir y regresar al menú de Lazo [F1].\n\n---\n\n## ⚠️ Aviso importante\n\
    \n> Si en tu instalación el protocolo es seleccionable y has realizado un cambio\
    \ de protocolo previamente, **espera dos minutos** antes de ejecutar la Autobúsqueda.\
    \ La central necesita ese tiempo para rearmar los equipos del lazo [F1].\n\n---\n\
    \n## Nota sobre cableado\n\nEl lazo debe estar instalado en **bucle cerrado**,\
    \ con un máximo de **32 sensores/pulsadores entre aisladores de cortocircuito**,\
    \ conforme a **EN54-2: 12.5.2** [F3]. Asegúrate de que el nuevo detector queda\
    \ correctamente integrado en ese bucle antes de lanzar la autobúsqueda.\n\nPara\
    \ el detalle del conexionado físico, consulta la **Figura 12 – Conexiones del\
    \ lazo** del manual [F3].\n\n---\n\n**Fuente:** DXc_Manual de configuracion (sin\
    \ revisión registrada) — Secciones 5.3.5.2 y 3.4.5.3\n\n---\n\U0001F4D6 **Información\
    \ adicional del manual:**\n- \"ION: 0 OPT: 1 TMP: 1 MLT: 2\nPUL: 4 MON: 0 SIR:\
    \ 2 REL: 1 OTROS : 2\" [F1]\n\n---\n\U0001F4CB **Obligaciones de evidencia del\
    \ manual:**\n- Nota: la fuente es inconsistente: \"PUL: 4 MON: 0 SIR: 2 REL: 1\
    \ OTROS : 2\" (DXc_Manual de configuracion, p. 48) [F1] declara 1 OTROS y la enumeración\
    \ servida lista 5 (DXc_Manual de configuracion, p. 48) [F1]."
