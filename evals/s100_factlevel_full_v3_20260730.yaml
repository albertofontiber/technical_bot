- qid: hp018
  question: ¿Cómo se conecta una sirena convencional en las salidas de sirena de la
    Morley ZXe?
  answer: '# Conexionado de sirenas convencionales en la Morley ZXe


    ## Terminales de conexión


    La ZXe dispone de **2 circuitos de sirenas supervisados** (Sirena A y Sirena B)
    [F2]. Los terminales en la ZX2e están identificados como **A+, A-, B+, B-** en
    el bloque "SOUNDERS" [F2]. En la ZX5e los terminales se ubican en **TB7** con
    identificación **A-, A+, B-, B+** [F2].


    ---


    ## Requisitos previos obligatorios


    - **Cada sirena debe tener un diodo integrado** para evitar consumo en estado
    de supervisión (polarización inversa en reposo) [F2].

    - Si se conectan dispositivos **no polarizados** (campanas sin polaridad), se
    deben instalar **diodos de polarización y protección** en cada uno [F2].

    - **No realizar ramales** en la línea de sirenas — la supervisión se realiza en
    la línea directa hasta la RFL; los ramales paralelos no pueden ser supervisados
    [F5].


    ---


    ## Resistencia Final de Línea (RFL)


    - Instalar una **RFL de 6.800 Ω (6k8), 0,5 W mínimo** entre + y - de la **última
    sirena** del circuito [F2].

    - Si **no se instalan sirenas** en la salida, conectar la RFL directamente en
    los terminales de la central [F4].


    ---


    ## Límites eléctricos


    - Consumo máximo por circuito: **1 A** [F2].

    - Longitud de cable **no recomendada superior a 1 km** (la capacitancia e inductancia
    pueden afectar al funcionamiento) [F1].

    - Usar **sección de cable adecuada** para garantizar la tensión correcta en las
    sirenas tanto en alimentación principal como en mínima tensión de baterías — consultar
    **Tablas 10 y 11** del manual [F1].


    ---


    ## Principio de supervisión


    El circuito se polariza en **inverso en reposo** para supervisar la línea. Al
    activarse la alarma, la polaridad cambia a la normal y las sirenas se activan
    [F2].


    ---


    ## Advertencia de cableado


    > ⚠️ **No enrolle el cable en los terminales. Corte y empalme las conexiones adecuadamente
    para mantener la supervisión de la línea.** [F1]


    ---


    Para el esquema visual del circuito completo (disposición de sirenas y RFL), consulta
    la **Figura 15** del documento MIE-MI-530 [F1].


    **Fuente:** Manual de Instalación Paneles de Incendio ZX2e / ZX5e — Documento
    MIE-MI-530rv001 (sin revisión registrada)


    ---

    📋 **Obligaciones de evidencia del manual:**

    - Nota: la fuente es inconsistente: "* El panel de detección y control de incendio
    ZX5Se tiene 4 circuitos de sirenas supervisados y limitados en corriente, identificados
    como circuitos de sirena A, B, C y D." (MIE-MI-600, p. 24) [F6] declara 4 circuitos
    y la enumeración servida lista 2 (MIE-MI-600, p. 24) [F6].

    - Nota: la fuente es inconsistente: "El máximo permitido entre los 4 circuitos
    de sirena de ZX5Se es de 2A." (MIE-MI-600, p. 24) [F6] declara 4 circuitos y la
    enumeración servida lista 2 (MIE-MI-600, p. 24) [F6].

    - "Cada sirena deberá contar con un diodo integrado que impida el consumo en estado
    de reposo (supervisión)." (MIE-MP-520rv04, p. 25) [F8]'
