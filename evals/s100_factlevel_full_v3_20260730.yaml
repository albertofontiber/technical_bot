- qid: cat005
  question: ¿Cuáles son las características técnicas de la central de detección de
    gas Fidegas CS4, y en qué se diferencian las versiones digital y analógica?
  answer: "# Características técnicas de la central Fidegas CS4\n\nLa CS4 es una central\
    \ de alarmas para detección de gas que admite hasta **4 sensores remotos simultáneos**,\
    \ disponible en versión analógica y digital [F3].\n\n---\n\n## Características\
    \ técnicas generales\n\n- **Tensión de alimentación:** 110-230 Vac 50-60 Hz [F1]\n\
    - **Potencia:** 30 W, Clase II [F1][F8]\n- **Sensores:** Hasta 4 conexiones en\
    \ modo analógico o digital [F1]\n- **Entradas digitales:** 0-10/15 V [F3]\n- **Entradas\
    \ analógicas:** 4-20 mA [F3]\n- **Salidas:** 2 salidas conmutadas LP (relé apto\
    \ para 230 Vac) con contactos NA-C-NC [F1]\n- **Corriente máxima:** 250 mA [F1]\n\
    - **Rearme:** Seleccionable manual o automático [F1]\n- **Dimensiones:** 90 x\
    \ 106 x 58 mm [F1]\n- **Peso:** 300 g [F1]\n- **Firmware:** versión 1.2 (tanto\
    \ en versión digital como analógica) [F8][F2]\n- **Montaje:** Carril DIN o armario\
    \ de superficie [F3]\n\n---\n\n## Indicaciones\n\n- **LED verde (PWR):** alimentación\
    \ presente (fijo) o corte de red (intermitente) [F3]\n- **LED bicolor (ON/ALARM)\
    \ por sensor:** presencia de sensor remoto (verde) o alarma (rojo) [F3]\n- **LED\
    \ amarillo (ERROR) por sensor:** avería de sensor remoto [F3]\n- **LED verde (OUT1\
    \ y OUT2):** salida activa (verde) o desactivada (apagado) [F3]\n- **Avisador\
    \ acústico:** apoyo sonoro a las indicaciones ópticas [F3]\n\n---\n\n## Diferencias\
    \ entre versión digital y analógica\n\n**Código de producto:**\n- Versión digital:\
    \ **3244** [F1]\n- Versión analógica: **3270** [F1]\n\n**Sensores compatibles:**\n\
    \n- **Versión analógica:** [F2]\n  - Sensores S/3 gases combustibles\n  - Sensores\
    \ S/3 y S/2 gases tóxicos\n  - Sensores S/10 gases tóxicos\n\n- **Versión digital:**\
    \ [F2]\n  - Sensores S/10 gases combustibles\n\n---\n\n## Umbral de alarma\n\n\
    La alarma se activa cuando la concentración de gas supera el **20% del fondo de\
    \ escala** [F6]. En ese momento se enciende el LED rojo de ALARM, suena el avisador\
    \ acústico y las salidas asignadas pasan a NA [F6].\n\n---\n\n> **Nota:** El número\
    \ de serie sigue el formato CCCC AAMM XXXX (código de producto / año y mes de\
    \ fabricación / número de fabricado) [F1].\n\nFuente: Manual de Usuario CS4 (Analógica\
    \ o Digital), Rev. 2, 10/2018 — fabricado por C.A.E., S.L.\n\n---\n\U0001F4CB\
    \ **Obligaciones de evidencia del manual:**\n- Nota: la fuente es inconsistente:\
    \ \"Permite la conexión de hasta 4 sensores remotos simultaneos a través de sus\
    \ 4 entradas digitales (0-10/15 v) o analógicas (4-20 mA).\" (Manual-de-Usuario-CS4,\
    \ p. 4) [F3] declara 4 sensores y la enumeración servida lista 6 (Manual-de-Usuario-CS4,\
    \ p. 4) [F3].\n- \"Ningún sistema de detección de gas sustituye a una correcta\
    \ instalación y mantenimiento de los aparatos quemadores de gas y debe ser colocado\
    \ por una persona competente o un instalador autorizado.\" (Manual-de-Usuario-CS4,\
    \ p. 2) [F8]"
