- qid: hp002
  question: El detector ASD535 de Detnov está dando una alarma intermitente de flujo
    bajo. ¿Cuál es la causa más probable y cómo se diagnostica?
  answer: "# ASD535 — Alarma de flujo bajo: causa probable y diagnóstico\n\n**La causa\
    \ más probable es una obstrucción en el conducto de aspiración** (código de fallo\
    \ *001*) [F2]. Un valor de flujo por debajo del **80 %** del nominal dispara el\
    \ aviso de fallo transcurrido el tiempo de retardo de **300 s** de la LS-Ü [F1][F3].\n\
    \n---\n\n## 1. Lógica de interpretación del valor de flujo\n\nEl ASD535 expresa\
    \ el flujo como porcentaje del valor nominal registrado en el reset inicial (=\
    \ **100 %**) [F3]:\n\n- **Valor < 100 %** → apunta a **obstrucción** del conducto\
    \ de aspiración [F1]\n- **Valor > 100 %** → apunta a **rotura de tubo** [F1]\n\
    - El fallo se dispara cuando la variación supera **±20 %** (es decir, < 80 % o\
    \ > 120 %), conforme a **EN 54-20** [F3]\n\n---\n\n## 2. Códigos de fallo asociados\
    \ al flujo\n\nConsulta el código que muestra el AMB 35 en posición de conmutador\
    \ **E** [F4]:\n\n- **Código *001*** — Obstrucción, conducto de aspiración [F2]\n\
    - **Código *002*** — Rotura de tubo, conducto de aspiración [F2]\n- **Código *004***\
    \ — Parámetros LS-Ü no válidos / fuera de rango [F2]\n- **Código *008*** — Sensor\
    \ de flujo de aire defectuoso o inexistente [F2]\n\n---\n\n## 3. Procedimiento\
    \ de diagnóstico paso a paso\n\n> ⚠️ **Antes de empezar**: bloquea o desconecta\
    \ el control de incendios y la alerta remota en la CDI de orden superior para\
    \ evitar disparos no deseados [F5].\n\n**Paso 1 — Leer el valor de flujo actual**\n\
    Coloca el conmutador en posición **V** (cap. 7.6.1) y lee el porcentaje de flujo\
    \ [F5]. Compara con el valor registrado en el protocolo de puesta en funcionamiento.\n\
    \n- Si el valor está **por debajo del 90 %** (con sensibilidad LS-Ü estándar ±20\
    \ %), ya es señal de inspección obligatoria [F5]\n- Si está **por debajo del 80\
    \ %**, el fallo ya debería haberse disparado [F3]\n\n**Paso 2 — Verificar la tensión\
    \ de alimentación**\nMide en los bornes **1 (+) y 2 (-)** [F5][F7]:\n- Funcionamiento\
    \ a **12 V-CC**: rango nominal **12,3 a 13,8 V-CC** [F5]\n- Funcionamiento a **24\
    \ V-CC**: rango nominal **21,6 a 27,6 V-CC** [F5]\n\nUna tensión fuera de rango\
    \ puede provocar funcionamiento defectuoso [F7].\n\n**Paso 3 — Inspeccionar el\
    \ conducto de aspiración (flujo bajo → obstrucción)**\n\n- Comprobar si los **orificios\
    \ de aspiración** están obstruidos [F2]\n- Comprobar la **salida de aire** del\
    \ ASD y limpiarla si hay suciedad [F5]\n- Inspeccionar y limpiar la **caja de\
    \ filtro / unidad de filtrado** [F2]\n- Inspeccionar y limpiar el **sensor de\
    \ flujo de aire** [F2]\n- Si el ASD vigila equipos con transiciones de tubo rígido\
    \ a flexible, verificar que no haya fugas en dichas transiciones [F5]\n\n**Paso\
    \ 4 — Verificar el sensor de flujo**\nSi tras limpiar el conducto el fallo persiste:\n\
    - Comprobar que el sensor de flujo está correctamente enchufado y que el cable\
    \ de conexión no está dañado [F2]\n- Si el sensor está defectuoso → **sustituir**\
    \ [F2]\n\n**Paso 5 — Reset y verificación final**\nTras corregir la causa, realiza\
    \ un **reset** (preferentemente desde la CDI) [F6]. Vuelve a leer el valor de\
    \ flujo en posición **V** y confirma que se ha recuperado el 100 % nominal.\n\n\
    ---\n\n## 4. Nota sobre la ventana de monitorización\n\n> ⚠️ En posiciones de\
    \ conmutador **W01 a W48**, los valores de monitorización del flujo **no están\
    \ homologados según EN 54-20** y solo deben usarse previa consulta con el fabricante\
    \ [F3].\n\n---\n\n**Fuente:** ASD535 Descripción técnica, T 131 192 h es (sin\
    \ revisión registrada)\n\n---\n⚠️ **Información adicional del manual:**\n- \"\
    Para evitar que los controles de incendios, las alertas remotas y las zonas de\
    \ extinción se disparen al llevar a cabo los trabajos de mantenimiento, es **imprescindible**\
    \ bloquearlos o desconectarlos previamente.\" [F5]\n- Nota: el manual también\
    \ indica: \"1. Bloquear o desconectar el control de incendios y la alerta remota\
    \ en la CDI de orden superior.\n2. La tensión de alimentación de la CDI debe estar\
    \ configurada para la central conforme a la normativa de mantenimiento.\n3. Debe\
    \ comprobarse que la entrada del conducto de aspiración y los tapones de tubo\
    \ del orificio de entrada de la caja del detector que no está en uso (ASD 535-1\
    \ y ASD 535-3) están en la posición correcta.\n4. Debe comprobarse si existe suciedad\
    \ en la salida de aire, en cuyo caso deberá limpiarse.\n5. En caso de que el ASD\
    \ 535 se utilice para la vigilancia de equipos y se hayan instalado transiciones\
    \ insertadas de tubo rígido a tubo flexible, debe comprobarse que dichas transiciones\
    \ están colocadas correctamente (sin fugas).\n6. Debe abrirse la cubierta de la\
    \ caja del detector y fijarse en la posición media de anclaje del fondo de la\
    \ caja. **Atención**: conexión de cable plano (véanse también los cap. 5.4.1 y\
    \ 7.1). Deberán efectuarse las siguientes mediciones:\n   * Medir la tensión de\
    \ servicio en los bornes 1 (+), 2 (-) \U0001F87A Valor nominal = 12,3 a 13,8 V-CC\
    \ (funcionamiento a 12 V-CC) o 21,6 a 27,6 V-CC (funcionamiento a 24 V-CC).\n\
    \   * Leer el valor de flujo de aire del conducto de aspiración en la posición\
    \ de conmutador V (véase para ello el cap. 7.6.1) y comparar con el protocolo\
    \ de puesta en funcionamiento. Si existe una desviación superior a la mitad de\
    \ la sensibilidad establecida (véanse ejemplos ➀ y ➁), deberá realizarse una inspección\
    \ del conducto de aspiración de la siguiente manera:\n     - Un **aumento** del\
    \ valor (superior al 100 %) implica una **rotura de tubo** inminente \U0001F87A\
    \ Comprobar si el conducto de aspiración tiene fugas (puntos de unión, racores,\
    \ etc.)\n     - Una **disminución** del valor (inferior al 100 %) implica una\
    \ **obstrucción** inminente \U0001F87A Comprobar si el conducto de aspiración\
    \ está obstruido y limpiarlo según el **punto 9** o el **punto 10**.\n   * ➀ Sensibilidad\
    \ de LS-Ü establecida = ±20 % (estándar); la mitad = ±10 %. También deberá realizarse\
    \ una inspección del conducto de aspiración cuando el valor caiga por debajo del\
    \ 90 % o suba por encima del 110 %.\n   * ➁ Sensibilidad de LS-Ü establecida =\
    \ ±50 % (no conforme a EN 54-20); la mitad = ±25 %. También deberá realizarse\
    \ una inspección del conducto de aspiración cuando el valor caiga por debajo del\
    \ 75 % o suba por encima del 125 %.\n7. Debe desconectarse el ASD (extraer el\
    \ bloque de bornes 1/2 y, en su caso, 3/4 del AMB 35), desconectar con cuidado\
    \ la conexión de cable plano con la unidad de control y retirar completamente\
    \ la cubierta de la caja del detector. Una vez desconectado el cable plano de\
    \ los sensores de humo, estos deberán extraerse del ASD con cuidado.\n8. El espacio\
    \ interior de las cámaras de los sensores de humo y la rejilla protectora contra\
    \ insectos deberán limpiarse con un pincel suave y seco. Para la limpieza también\
    \ puede emplearse nitrógeno o aire comprimido sin aceite.\" [F5]\n- Nota: el manual\
    \ también indica: \"En las posiciones de conmutador A11 a C32, cualquier variación\
    \ de este valor que supere el ±20 % – es decir, por debajo del 80 % (suciedad/obstrucción)\
    \ o por encima del 120 % (rotura de tubo) – disparará un aviso «fallo flujo de\
    \ aire» una vez transcurrido el tiempo de retardo de 300 s de la LS-Ü.\" [F3]"
