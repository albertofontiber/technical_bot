- qid: hp017
  question: ¿Cómo se programa el retardo de salida de alarma principal en la Notifier
    PEARL?
  answer: 'El retardo de salida de alarma principal en la Pearl **se programa mediante
    las reglas de causa-efecto**, asignando un tipo de retardo a cada regla. No existe
    un único parámetro global de "retardo de alarma principal" — el retardo se define
    dentro de la lógica causa-efecto.


    ---


    ## Cómo programar el retardo de salida


    **Paso 1 — Acceder al editor de causa-efecto**


    No puedo confirmar de forma segura el número de menú de Causa y Efecto con los
    fragmentos servidos. Confirma el manual y la revisión exactos antes de usar un
    número de menú.


    > ⚠️ Si no se ha transferido un archivo de configuración previo, aparecerán las
    dos reglas por defecto. **Deben eliminarse si vas a crear reglas personalizadas**
    [F11].


    **Paso 2 — Método recomendado**


    Se recomienda usar el **programa de configuración por ordenador** como método
    principal de programación. El menú de la central debe usarse solo para modificaciones
    menores [F12].


    **Paso 3 — Asignar el tipo de retardo a la regla**


    Dentro de cada regla de causa-efecto, se puede asignar uno de **seis tipos de
    retardo de salida** [F1]. El tipo seleccionado determina qué acciones podrá realizar
    el usuario mientras el retardo esté activo [F1].


    ---


    ## Los seis tipos de retardo disponibles


    Los tipos de retardo y su comportamiento son [F2]:


    - **Fijo**: No se detiene con SILENCIAR SIRENAS. No puede anularse. No muestra
    cuenta atrás. No responde a AMPLIAR RETARDO ni a FIN RETARDO.


    - **Estándar**: Se detiene si se pulsa SILENCIAR SIRENAS (y se reactiva con SONIDO
    ALARMAS). Puede anularse en nivel de acceso 2. Muestra tiempo restante en pestaña
    ALARMA. Puede detenerse con FIN RETARDO en nivel de acceso 2.


    - **No Silenc.**: No se detiene con SILENCIAR SIRENAS. Puede anularse en nivel
    de acceso 2. Muestra tiempo restante. Puede detenerse con FIN RETARDO.


    - **Est. Ext.**: Se detiene con SILENCIAR SIRENAS. Puede anularse en nivel de
    acceso 2. Muestra tiempo restante. Se detiene también con AMPLIAR RETARDO. Puede
    detenerse con FIN RETARDO.


    - **RetExtStd**: Se detiene con SILENCIAR SIRENAS. Puede anularse en nivel de
    acceso 2. Muestra tiempo restante. El temporizador comienza en RETARDO AMPLIADO.
    Puede detenerse con FIN RETARDO.


    - **No Sil. Ext**: No se detiene con SILENCIAR SIRENAS. Puede anularse en nivel
    de acceso 2. Muestra tiempo restante. Se detiene con AMPLIAR RETARDO. Puede detenerse
    con FIN RETARDO.


    - **SinRetExt**: No se detiene con SILENCIAR SIRENAS. Puede anularse en nivel
    de acceso 2. Muestra tiempo restante. El temporizador comienza en RETARDO AMPLIADO.
    Puede detenerse con FIN RETARDO.


    > ⚠️ Las marcas de asignación de la tabla original del manual [F2] son legibles
    en el fragmento recuperado y se han transcrito fielmente arriba. Verifica contra
    la tabla original del manual si tienes dudas sobre alguna celda concreta.


    ---


    ## Operación durante el retardo activo


    - El LED **RETARDO ACTIVO** se ilumina cuando hay un retardo configurado en curso
    [F3].

    - La tecla **AMPLIAR RETARDO** (nivel de acceso 2) inicia la cuenta atrás del
    segundo temporizador, que anula al primero [F4].

    - La tecla **FIN RETARDO** (nivel de acceso 1) pone fin a cualquier retardo activo
    e introduce la condición de alarma completa [F4].


    ---


    ## Habilitar/Anular el retardo globalmente


    Si necesitas anular o habilitar todos los retardos configurados sin modificar
    la programación:


    1. Accede al **Menú Anular/Habilitar** [F3].

    2. Selecciona **«5: Retardo Activación Salidas»** [F3].

    3. Pulsa **✓** para cambiar el estado entre HABILITADO y ANULADO [F3].

    4. Pulsa **✕** para salir [F3].


    > Esta opción solo está disponible si se han configurado retardos en alguna regla
    de causa-efecto [F3].


    ---


    ## Nota adicional — Pulsador AMPLIAR RETARDO


    El pulsador **AMPLIAR RETARDO** puede desactivarse desde los parámetros de la
    central (opción **«10: Extend Delay Button»**) si no se requiere en la instalación
    [F5].


    ---


    **Fuentes:**

    - 997-671-005-3_Configuration_ES (rev. 997-671-005-3)

    - 997-670-005-3_Operating_ES (sin revisión registrada)


    ---

    ⚠️ **Información adicional del manual:**

    - "**Al programar reglas de causa-efecto evite las lógicas contradictorias.**"
    [F12]

    - "**Es de vital importancia probar rigurosamente todas las reglas durante la
    puesta en marcha del sistema para verificar que no haya conflictos lógicos entre
    ellas.**" [F12]

    - Nota: el manual también indica: "Si no se ha transferido a la central un archivo
    de configuración, el usuario encontrará aquí las dos reglas de causa-efecto por
    defecto." [F11] · "| Acción de usuario/indicación de estado                                                                                    |
    Tipos de retardo<br/>Fijo | Tipos de retardo<br/>Estándar | Tipos de retardo<br/>No
    Silenc | Tipos de retardo<br/>Est. Ext. | Tipos de retardo<br/>RetExtStd | Tipos
    de retardo<br/>No Sil. Ext | Tipos de retardo<br/>SinRetExt |

    | -------------------------------------------------------------------------------------------------------------------------
