- qid: cat024
  question: ¿Cuál es el consumo en alarma de la sirena analógica de zócalo Detnov
    MAD-472?
  answer: 'El consumo en alarma de la **MAD-472** es **7 mA** [F6][F7][F8].


    Adicionalmente, el propio manual de la MAD-472 especifica el consumo en alarma
    como **17 mA (80 dB A)** [F1].


    > ⚠️ **Discrepancia entre fuentes:** Existe una diferencia entre los valores recogidos
    en las tablas de dispositivos compatibles de la CAD-250 (7 mA) [F6][F7][F8] y
    el dato del manual propio de la MAD-472 (17 mA a 80 dB A) [F1]. Verifica qué versión
    de hardware tienes instalada y consulta con Detnov si necesitas el valor exacto
    para el cálculo de carga del lazo.


    Resto de parámetros eléctricos de la MAD-472 según su manual [F1]:


    - **Consumo en reposo:** < 350 μA [F1] / 0,35 mA [F6]

    - **Tensión de funcionamiento:** 22–38 VDC [F1]

    - **Aislador incorporado:** No [F6]

    - **Nº de direcciones:** 1 [F6]

    - **Alimentación:** directamente del lazo, sin alimentación auxiliar [F1]


