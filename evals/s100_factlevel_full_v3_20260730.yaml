- qid: cat017
  question: ¿Como se cablea y se da de alta (configura) un lazo en la central Notifier
    INSPIRE (E10/E15)?
  answer: "# Cableado y configuración de lazo en INSPIRE E10/E15\n\nEl proceso se\
    \ divide en dos fases: **cableado físico** y **configuración mediante CLSS**.\n\
    \n---\n\n## FASE 1 — CABLEADO FÍSICO DEL LAZO\n\n### Módulo de lazo OPAL X2 (HOP-433-100)\n\
    \nEl módulo tiene **10 terminales** distribuidos en dos filas [F2][F3]:\n\n**Lazo\
    \ 1:**\n- Terminal **1**: Lazo 1 Salida +VE\n- Terminal **2**: Lazo 1 Salida -VE\n\
    - Terminal **3**: ⊕ (pantalla) — **NO usar para pantalla de cable**\n- Terminal\
    \ **4**: Lazo 1 Entrada +VE\n- Terminal **5**: Lazo 1 Entrada -VE\n\n**Lazo 2:**\n\
    - Terminal **6**: Lazo 2 Salida +VE\n- Terminal **7**: Lazo 2 Salida -VE\n- Terminal\
    \ **8**: ⊕ (pantalla) — **NO usar para pantalla de cable**\n- Terminal **9**:\
    \ Lazo 2 Entrada +VE\n- Terminal **10**: Lazo 2 Entrada -VE\n\n> ⚠️ **CRÍTICO**:\
    \ La pantalla del cable de lazo debe conectarse a la **barra de tierra** de la\
    \ central, NO a los terminales 3 u 8 [F2][F3].\n\n> ⚠️ **NO mezclar dispositivos\
    \ OPAL y CLIP en el mismo lazo** [F2].\n\n---\n\n### Capacidad del lazo [F2][F4]\n\
    \n**Modo OPAL:**\n- Hasta **159 detectores** OPAL por lazo\n- Hasta **159 módulos**\
    \ OPAL por lazo\n- Total máximo: **318 dispositivos** por lazo\n\n**Modo CLIP**\
    \ (requiere licencia):\n- Hasta **99 detectores** CLIP por lazo\n- Hasta **99\
    \ módulos** CLIP por lazo\n\n- Corriente máxima por lazo: **750 mA** [F2]\n- Longitud\
    \ máxima de cable: hasta **3,5 km** dependiendo del tipo de carga y cable (calcular\
    \ con herramienta CLSS) [F2]\n\n> ℹ️ Restricción EN54-2, apartado 13.7: máximo\
    \ **512 detectores y/o pulsadores** por módulo de lazo (2 circuitos) [F2].\n\n\
    ---\n\n### Numeración de lazos [F2]\n\nLos circuitos de lazo se numeran **secuencialmente\
    \ de izquierda a derecha** del portamódulos. En la E15 (dos filas), la segunda\
    \ fila continúa la numeración desde la primera.\n\n---\n\n## FASE 2 — COMPROBACIONES\
    \ PREVIAS CON MULTÍMETRO\n\nAntes de conectar el lazo a la central [F5][F6][F11]:\n\
    \n1. Comprueba la **continuidad** de cada parte del lazo y mide la resistencia\
    \ de extremo a extremo.\n2. Comprueba la **continuidad de la pantalla** del cable\
    \ (debe dar resistencia muy baja).\n3. Verifica que **no hay continuidad** entre\
    \ la pantalla y los cables +VE y -VE.\n4. Con función de **prueba de diodo** en\
    \ el multímetro, conecta en **polaridad invertida** (+VE del multímetro al negativo\
    \ del lazo, -VE al positivo): debe indicar diodo en polarización directa [F6].\n\
    5. Conecta en **polaridad normal**: al inicio leerá resistencia baja, que irá\
    \ aumentando al cargarse los condensadores de cada dispositivo [F6].\n6. Si en\
    \ el paso 5 aparece diodo en directa, hay dispositivos con **polaridad invertida**\
    \ o cortocircuito — localízalos por sectorización sucesiva [F6].\n7. Comprueba\
    \ que no hay conexión entre la pantalla y los cables +VE o -VE [F6].\n\n> ⚠️ **NUNCA\
    \ uses un comprobador de alta tensión (megóhmetro) en el circuito de lazo** [F5].\n\
    \n> ℹ️ Con aisladores en cada dispositivo, el conductor positivo del lazo será\
    \ un **circuito abierto** [F5][F11].\n\n> ℹ️ Se recomienda usar la herramienta\
    \ **POL-200-TS** para diagnósticos más detallados (compatible con protocolos OPAL\
    \ y CLIP) [F7].\n\nPara la resistencia máxima admisible: mide entre Lazo X Entrada\
    \ -VE y Lazo X Salida -VE con el lazo desconectado de la central, multiplica el\
    \ resultado por 2 y añade la resistencia de cada aislador (**0,1 a 0,13 Ω** por\
    \ aislador) [F11].\n\n---\n\n## FASE 3 — CONEXIÓN A LA CENTRAL\n\nUna vez verificado\
    \ el cableado [F7]:\n\n**Lazo OPAL:** Conecta directamente el circuito al bloque\
    \ de terminales de lazo seleccionado en la central.\n\n**Lazo CLIP:**\n1. Reconecta\
    \ los aisladores desconectados temporalmente, módulos de lazo y pulsadores.\n\
    2. Conecta el circuito al bloque de terminales de lazo seleccionado.\n\n---\n\n\
    ## FASE 4 — PRIMER ENCENDIDO Y CONFIGURACIÓN CLSS\n\n### Primer encendido [F9]\n\
    \n1. Aplica alimentación. El LED verde **\"Alimentación\"** se encenderá y permanecerá\
    \ encendido.\n2. Si hay averías, se encenderá el **LED de AVERÍA amarillo** y\
    \ sonará el zumbador — pulsa **Silenciar Zumbador** para detenerlo.\n3. Selecciona\
    \ **país** e **idioma**.\n4. Ajusta **hora y fecha** (deben coincidir con el ordenador\
    \ que ejecuta CLSS).\n5. Ve a *Información del Sistema* → selecciona ▽ para ver\
    \ el módulo de lazo. Inicialmente mostrará **\"Lazo X: 0 Dispositivos — Inicializando...\"\
    ** [F9].\n\n### Configuración del lazo con CLSS [F8][F10]\n\n1. En CLSS, ve a\
    \ **Ajustes → Ajustes HMI** → en **Tipo de Marca** selecciona **Notifier EN**\
    \ [F8].\n2. En **Ajustes de Lazo**, configura:\n   - **Protocolo de Lazo**: `Opal`\
    \ (por defecto) o `Clip` (requiere licencia) [F8][F10]\n   - **Familia de Dispositivos**:\
    \ `Notifier` [F8]\n   - **Limitar a VdS 2540**: Sí o No (el valor de resistencia\
    \ cambia según la selección; ejemplo: **93,5 Ω** con VdS No) [F8]\n   - **Tipo\
    \ de Cable**: seleccionar según instalación [F8]\n   - Si el lazo **no se utiliza**:\
    \ marcar ☑ **Sin Uso** [F1][F8][F10]\n3. Envía el archivo de configuración a la\
    \ central (pasos 01 a 04 de \"Enviar configuración a la central\") [F8].\n\n>\
    \ ⚠️ Para lazo CLIP o TC800 OPAL/CLIP, se requiere **licencia específica** antes\
    \ de realizar Auto Configuración. Por defecto la central solo tiene licencia para\
    \ **Protocolo avanzado OPAL** [F8].\n\n---\n\n## FASE 5 — AUTO CONFIGURACIÓN\n\
    \nTras enviar la configuración, ejecuta la **Auto Configuración** desde la central\
    \ para que descubra y registre todos los dispositivos del lazo [F8].\n\n---\n\n\
    **Fuente:** HOP-138-8ES issue 6 (01-2026) — INSPIRE E10/E15 Instrucciones de puesta\
    \ en marcha; HOP-138-9ES issue 5 (11-2025) — INSPIRE E10 Instalación; 4188-1132-ES\
    \ issue 3 (04-2025) — CLSS Quick Reference"
