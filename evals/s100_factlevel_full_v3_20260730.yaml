- qid: hp014
  question: ¿Cómo se conecta un módulo de aislamiento de línea en un lazo ID2000?
  answer: "## Conexión del módulo de aislamiento de línea en lazo ID2000\n\nLos fragmentos\
    \ disponibles no incluyen el diagrama de conexionado específico del módulo aislador\
    \ (terminales pin a pin), pero sí recogen los requisitos de instalación y el procedimiento\
    \ de verificación. Aquí está todo lo que el manual especifica:\n\n---\n\n### Requisitos\
    \ de posicionamiento (EN54-2: 12.5.2)\n\n- Se deben instalar aisladores en cada\
    \ lazo analógico para separar sensores y pulsadores [F5].\n- **Máximo 25 equipos\
    \ de lazo entre aisladores** en la central ID2000 [F5].\n- Si se utilizan **aisladores\
    \ tipo FET**, el límite baja a **20 equipos entre aisladores** [F5].\n- El límite\
    \ normativo EN54-2 es de 32 equipos, pero la ID2000 impone el límite más restrictivo\
    \ indicado arriba [F3][F5].\n\n---\n\n### Terminales del aislador\n\nEl manual\
    \ hace referencia a los terminales del aislador como **terminales 1, 2, 3 y 4**\
    \ [F3]. Para el conexionado exacto pin a pin, el manual indica:\n\n> *\"Estos\
    \ equipos van acompañados de instrucciones en las que se muestran las interconexiones\
    \ adecuadas para cada aplicación.\"* [F5]\n\n➡️ **Consulta la hoja de instrucciones\
    \ que acompaña al propio módulo aislador** para el diagrama de conexionado específico.\n\
    \n---\n\n### Procedimiento durante la puesta en marcha\n\nAntes de conectar el\
    \ lazo al panel [F3]:\n\n1. **Desconecta temporalmente los aisladores** cortocircuitando\
    \ los terminales **2 y 4** de cada aislador. Esto es necesario para realizar las\
    \ comprobaciones de continuidad del lazo.\n2. Realiza las pruebas de continuidad\
    \ y resistencia con el cableado del lazo **desconectado del panel**.\n3. Verifica\
    \ que la resistencia final de línea es inferior a [F3]:\n   - **14,5 Ω** (con\
    \ placa base y LIB, detección de dirección duplicada)\n   - **28,5 Ω** (con placa\
    \ base y LIB, sin detección de dirección duplicada)\n   - **18,5 Ω** (con placa\
    \ base y LIB, garantizando detección duplicada — segunda variante)\n   - **35,5\
    \ Ω** (con placa base y LIB, sin detección duplicada — segunda variante)\n\nUna\
    \ vez verificado el cableado [F1]:\n\n4. **Retira las conexiones temporales**\
    \ de los aisladores (quita el cortocircuito entre terminales 2 y 4).\n5. Conecta\
    \ el cableado del lazo al panel respetando la polaridad: extremos **A** y **B**\
    \ a sus terminales correspondientes [F1].\n\n---\n\n### Advertencias clave\n\n\
    - ⚠️ Las comprobaciones de continuidad del lazo **deben realizarse antes de conectar\
    \ los aisladores** [F5].\n- ⚠️ **Nunca uses multímetros de alta tensión (tipo\
    \ \"Megger\")** en el lazo [F5].\n- La longitud total del lazo no puede exceder\
    \ **2000 metros** con cable de **1,5 mm² de sección o superior** [F3].\n- La resistencia\
    \ máxima del lazo no debe superar **35 Ω**, y la capacidad del cable debe ser\
    \ inferior a **0,5 µF** [F11].\n- Los terminales aceptan cables entre **0,5 mm²\
    \ y 2,5 mm²** [F12].\n\n---\n\n**Fuente:** Panel ID2000 - Manual de instalación\
    \ y puesta en marcha, MIDT180 (rev. MI-DT-180, 2003-03-31)\n\n---\n⚠️ **Información\
    \ adicional del manual:**\n- \"Es de vital importancia que el cable utilizado\
    \ sea de buena calidad y que se instale de forma correcta.\" [F11]\n\n---\n\U0001F4D6\
    \ **Obligaciones de evidencia del manual:**\n- \"La resistencia máxima del lazo\
    \ no debe superar los 35 ohmios. Puede comprobarlo uniendo los extremos B+ y B-\
    \ y midiendo a través de los extremos A+ y A-.\" (MIDT180, p. 17) [F11]"
