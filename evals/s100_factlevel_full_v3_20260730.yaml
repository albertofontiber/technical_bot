- qid: cat009
  question: ¿Qué resistencia de fin de línea (EOL) hay que instalar en las líneas
    de zona de la central convencional NFS Supra?
  answer: "## Resistencia de fin de línea (EOL) en zonas de la NFS Supra\n\nLa central\
    \ NFS Supra admite **dos tipos de final de línea** en las zonas, configurables\
    \ por software:\n\n---\n\n### Opción 1 — Modo capacitivo (EFL) — **Por defecto**\n\
    - **Condensador de 47 µF** instalado entre el positivo y negativo de la línea,\
    \ en la salida del último equipo [F5][F6]\n- Es el modo de fábrica [F4][F3]\n\n\
    ### Opción 2 — Modo resistivo (RFL)\n- **Resistencia de 6K8 Ω** instalada entre\
    \ el positivo y negativo de la línea, en la salida del último equipo [F5][F6]\n\
    - En este modo, la central admite un rango de resistencia final de línea entre\
    \ **3 KΩ** y **7 KΩ** [F5]\n\n---\n\n### Cómo configurar el tipo de supervisión\n\
    \nPara cambiar entre modo capacitivo y resistivo [F4]:\n\n1. Accede al menú de\
    \ configuración pulsando simultáneamente **Tecla TECLADO + Tecla EVACUACIÓN**\n\
    2. Cambia la opción con la tecla **REARME** (requiere nivel de acceso 3 — Configuración)\n\
    3. Verifica el modo activo por el LED:\n   - **LED 1 Alarma Rojo encendido** =\
    \ Final de línea resistivo **6K8 Ω** [F4]\n   - **LED 2 Anulada Ámbar encendido**\
    \ = Final de línea capacitivo **47 µF / Diodo** (por defecto) [F4]\n\n---\n\n\
    ### Consideraciones importantes\n\n- **Todas las zonas**, incluidas las no usadas,\
    \ deben tener instalado su final de línea según la configuración del sistema [F5][F6]\n\
    - El condensador de 47 µF es suministrado con la central [F5]\n- La resistencia\
    \ de 6K8 Ω **no** está incluida si se opta por el modo resistivo — deberá aportarla\
    \ el instalador\n\n> ⚠️ **Nota:** El manual en inglés (versión de exportación)\
    \ indica **4K7 Ω** como valor resistivo [F1][F3], mientras que el manual en español\
    \ indica **6K8 Ω** [F2][F4][F5]. Verifica qué versión del equipo tienes instalada\
    \ y consulta el manual físico correspondiente para confirmar el valor correcto.\n\
    \n---\n\nFuentes: HLSI-MN-025_NFS Supra (v.05, sin revisión registrada); HLSI-MN-025-I_NFS\
    \ Supra Series v05 (sin revisión registrada); HLSI-MA-025 Guia Rapida NFS_Supra_ES\
    \ (sin revisión registrada)\n\n---\n⚠️ **Obligaciones de evidencia del manual:**\n\
    - \"Esto significa que debe calcular el número de sensores a instalar dependiendo\
    \ de su consumo sin sobrepasar nunca los 32 sensores.\" (HLSI-MN-025_NFS Supra,\
    \ p. 28) [F2]\n- Nota: la fuente es inconsistente: \"La central NFS Supra tiene\
    \ cuatro, ocho o doce zonas de alarma.\" (HLSI-MN-025_NFS Supra, p. 27) [F5] declara\
    \ 12 zonas y la enumeración servida lista 6 (HLSI-MN-025_NFS Supra, p. 27) [F5]."
