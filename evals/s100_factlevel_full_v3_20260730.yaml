    **Modelo 24V:**

    - Tensión de funcionamiento: **22 V a 38 V** [F3]

    - Consumo en reposo: **45 mA** [F3]


    **Modelo 220V:**

    - Tensión de funcionamiento: **180 V a 240 V** [F3]

    - Consumo en reposo: **70 mA** [F3]


    Como dato adicional, el consumo en alarma es de **65 mA** (modelo 24V) y **70
    mA** (modelo 220V) [F3].


    ---


