- qid: hp020
  question: En la Notifier INSPIRE, ¿cómo se configuran las contraseñas de nivel 2
    y nivel 3?
  answer: "# Configuración de contraseñas Nivel 2 y Nivel 3 en Notifier INSPIRE E10/E15\n\
    \nLas contraseñas de nivel 2 y nivel 3 se cambian desde el menú **Ajustes → Cambio\
    \ del código de acceso**, con una longitud de entre **4 y 8 dígitos** [F1][F2].\n\
    \n---\n\n## Cambiar contraseña de Nivel 2 (desde acceso Nivel 2)\n\n1. Selecciona\
    \ el icono del menú ① y selecciona **\"Configuración\"** ②. Inicia sesión como\
    \ usuario de **nivel de acceso 2** [F2].\n2. Selecciona la opción **\"Cambio del\
    \ código de acceso\"** ③ [F2].\n3. Asegúrate de que **Nivel de Acceso 2** ④ esté\
    \ seleccionado y que el cursor parpadee ⑤ [F2].\n4. Puedes ver la entrada del\
    \ código haciendo clic en el **icono del ojo** ⑥ [F2].\n5. Introduce el nuevo\
    \ código de acceso (**mínimo 4, máximo 8 dígitos**) con el teclado ⑦ [F2].\n6.\
    \ Confirma la entrada seleccionando el símbolo **✓** ⑧ [F2].\n7. Repite los pasos\
    \ 3 a 6 para confirmar el código [F2].\n\n---\n\n## Cambiar contraseña de Nivel\
    \ 2 y/o Nivel 3 (desde acceso Nivel 3)\n\n1. Selecciona el icono del menú ① y\
    \ selecciona **\"Ajustes\"** ②. Inicia sesión como usuario de **nivel de acceso\
    \ 3** [F1].\n2. Selecciona la opción **\"Cambio del código de acceso\"** ③ [F1].\n\
    3. Asegúrate de que el **Nivel de Acceso 2 o 3** ④ esté seleccionado y que el\
    \ cursor parpadee ⑤ [F1].\n4. Puedes ver la entrada del código haciendo clic en\
    \ el **icono del ojo** ⑥ [F1].\n5. Introduce el nuevo código de acceso (**mínimo\
    \ 4, máximo 8 dígitos**) con el teclado ⑦ [F1].\n6. Confirma la entrada seleccionando\
    \ el símbolo ⑧ [F1].\n7. Repite los pasos 3 a 6 para confirmar el código [F1].\n\
    8. Observa el mensaje **\"Cambio de código de acceso satisfactorio\"** y selecciona\
    \ **Aceptar** [F1].\n9. **Sincroniza el programa con la central** y realiza una\
    \ **copia de seguridad del cambio en la nube** [F1].\n\n---\n\n## Notas importantes\n\
    \n- Si estás en **nivel 2**, solo puedes cambiar la contraseña de **nivel 2**\
    \ [F1].\n- Si estás en **nivel 3**, puedes cambiar la contraseña de **nivel 2\
    \ o nivel 3** [F1].\n- El código de fábrica del nivel 2 es **\"22222222\"** [F3].\
    \ Se recomienda cambiarlo [F3].\n- Tras 5 minutos de inactividad con sesión de\
    \ nivel 2 abierta, la central cierra sesión automáticamente y vuelve al **nivel\
    \ de acceso 1** [F3].\n\n---\n\nFuente: HOP-138-8ES issue 6_01-2026_Co (sin revisión\
    \ registrada); HOP-338-9ES issue 4_01-2026_Op (sin revisión registrada)\n\n---\n\
    \U0001F4CB **Información adicional del manual:**\n- Nota: el manual también indica:\
    \ \"Se recomienda cambiar la contraseña del código de acceso al nivel de acceso\
    \ 2/3 contraseña a uno exclusivo que tenga entre 4 y 8 dígitos.\" [F1] · \"- Menu\
    \ icon ① leading to \"Configuraciones\"\n- \"Configuraciones\" screen showing\
    \ \"Configuración del sistema, red, datos y hora, programa de mantenimiento, etc\"\
    \ ②\n- Arrow pointing to \"Cambio de contraseña\" option ③\n- \"Introduzca nueva\
    \ contraseña\" dialog box with:\n  - \"Acceso Nivel 2\" dropdown ④\n  - Password\
    \ input field ⑤\n  - \"Min:4 digitos,Max:8 digitos\" text with eye icon ⑥\n  -\
    \ Numeric keypad showing numbers 1-9, 0, backspace icon, and checkmark icon ⑧\n\
    \  - Backspace arrow ⑦]\" [F1]"
