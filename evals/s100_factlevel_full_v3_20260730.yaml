- qid: cat023
  question: En el detector de humos por aspiración Securiton ASD532, ¿qué clases de
    sensibilidad según EN 54-20 ofrece y cómo se configura la monitorización del flujo
    de aire?
  answer: "## ASD532 — Clases EN 54-20 y configuración de monitorización de flujo\
    \ de aire\n\nEl **ASD 532** cumple las tres clases de la norma **EN 54-20** [F8]:\n\
    \n- **Clase A** — Sensibilidad muy alta\n- **Clase B** — Sensibilidad alta\n-\
    \ **Clase C** — Sensibilidad normal\n\n---\n\n### Sensores de humo disponibles\
    \ según clase\n\nLa elección del sensor determina el rango de sensibilidad alcanzable\
    \ [F1][F9]:\n\n- **SSD 532-1** — Rango de alarma: **0,5 %/m hasta 10 %/m**\n-\
    \ **SSD 532-2** — Rango de alarma: **0,1 %/m hasta 10 %/m**\n- **SSD 532-3** —\
    \ Rango de alarma: **0,02 %/m hasta 10 %/m**\n\n> ⚠️ Solo deben instalarse los\
    \ sensores detallados en la certificación del dispositivo. El uso de otros tipos\
    \ revoca la certificación [F6].\n\n---\n\n### Configuración de la sensibilidad\
    \ (posiciones de conmutador normativas)\n\nExisten dos vías de configuración [F1][F7]:\n\
    \n1. **Sin software ASD PipeFlow (EasyConfig):** seleccionar la posición de conmutador\
    \ predeterminada según la clase deseada [F3]:\n   - Clase A → posición **A11**\n\
    \   - Clase B → posiciones **b11 / b21**\n   - Clase C → posiciones **C11 / C21\
    \ / C31**\n\n2. **Con software ASD PipeFlow:** calcular el proyecto, introducir\
    \ el resultado en **«ASD Config»** y seleccionar las posiciones **X01, X02 o X03**\
    \ para memorizar los resultados [F7].\n\n---\n\n### Monitorización del flujo de\
    \ aire\n\nEl ASD 532 usa **medición calorimétrica (técnica de medición de flujo\
    \ en masa)** [F2].\n\n**Principio de funcionamiento:**\n1. Al ejecutar el **reset\
    \ inicial** (posición de conmutador **U01**) [F3], con el conducto de aspiración\
    \ intacto, el sistema registra y memoriza los valores de flujo como **valores\
    \ nominales (100 %)** [F2].\n2. El sistema crea una **ventana de monitorización\
    \ electrónica** centrada en ese 100 % [F2].\n3. Si los valores reales se salen\
    \ de la ventana, se dispara el aviso **«Fallo flujo de aire»** [F2].\n\n**Parámetros\
    \ normativos (posiciones A11 a C31) según EN 54-20** [F2]:\n- Desviación máxima\
    \ permitida: **±20 %** (es decir, por debajo del **80 %** por suciedad/obstrucción,\
    \ o por encima del **120 %** por rotura de tubo)\n- Tiempo de retardo (LS-Ü):\
    \ **300 s**\n\n**Funciones de compensación incluidas** [F2]:\n- Función de **tiempo\
    \ de retardo** ajustable (para descartar turbulencias de aire)\n- **Circuito de\
    \ compensación de temperatura** (para mitigar fluctuaciones de temperatura ambiente)\n\
    \n---\n\n### Posiciones no normativas (W01 a W44)\n\nLas posiciones **W01 a W44**\
    \ cumplen la sensibilidad de alarma según EN 54-20 (clases A–C), pero **los valores\
    \ de monitorización de flujo de aire NO están homologados según EN 54-20** [F2][F5].\n\
    \nParámetros disponibles en estas posiciones [F4]:\n\n- Tiempo de retardo: **10\
    \ min** o **60 min**\n- Desviación de ventana: **±20 %** o **±50 %**\n\n> ⚠️ Las\
    \ posiciones **W01 a W44** únicamente deben utilizarse **previa consulta con el\
    \ fabricante** [F5][F7].\n\n---\n\n### Advertencias de ajuste con ASD Config [F7]\n\
    \n- Aumentar los valores de LS-Ü por encima de **±20 % o 300 s** implica **incumplimiento\
    \ de EN 54-20** y requiere consulta con el fabricante.\n- El tamaño de ventana\
    \ **no debería quedar por debajo de ±20 %**. Si se usan ventanas más pequeñas,\
    \ el tiempo de retardo debe aumentarse a **10 min como mínimo**.\n- Ventanas por\
    \ debajo de ±20 % con tiempo de retardo ≤ 300 s aumentan el riesgo de **avisos\
    \ de fallo erróneos**.\n\n---\n\n**Fuente:** ASD532_TD_T140421es_a (sin revisión\
    \ registrada)\n\n---\n\U0001F4CB **Obligaciones de evidencia del manual:**\n-\
    \ Nota: la fuente es inconsistente: \"El detector de humos por aspiración ASD\
    \ 532 incluye dos lugares de montaje para módulos adicionales.\" (ASD532_TD_T140421es_a,\
    \ p. 13) [F9] declara 2 lugares y la enumeración servida lista 3 (ASD532_TD_T140421es_a,\
    \ p. 13) [F9].\n- \"Según EN 54-20, debe notificarse como fallo toda variación\
    \ del flujo de aire superior al ±20 %.\" (ASD532_TD_T140421es_a, p. 24) [F2]\n\
    - \"Con carácter general, para la instalación, el proyecto y el uso del detector\
    \ de humos por aspiración ASD 532 serán aplicables las disposiciones y directrices\
    \ específicas de cada país.\" (ASD532_TD_T140421es_a, p. 37) [F8]"
