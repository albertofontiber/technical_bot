- qid: cat012
  question: ¿Cómo se calcula la capacidad de batería (en Ah) necesaria para la central
    AM-8200?
  answer: '## Cálculo de capacidad de batería para la AM-8200


    La fórmula de cálculo es: **Ah Batería = (A + B) × 1,2** [F4][F5], donde:


    - **A** = Corriente total en reposo × horas de espera (24 h o 72 h según normativa
    aplicable)

    - **B** = Corriente total en alarma × **0,5 h**

    - **Factor 1,2** = margen por tolerancias de fabricación de las baterías [F6]


    ---


    ### Pasos del cálculo


    **Paso 1 — Determina la corriente en reposo (NO ALARMA)**


    Suma los consumos de todos los componentes instalados. Valores de referencia de
    la Tabla 1 [F4] para la variante **AM-8200 (CPU AM8200-KLCD)**:


    - AM-8200 CPU (AM8200-KLCD): **179 mA**

    - LIB-8200 (por tarjeta): **50 mA**

    - AM82-2S2C: **28 mA**

    - AM82-BST-C: **39 mA**

    - Dispositivos de lazo (ver Tabla 3 del manual) [F6]

    - Dispositivos en salida de usuario 24 Vcc (máx. **2 A**) [F4]

    - Dispositivos de sirena, campanas, flashes, etc.


    Para la variante **AM-8200BB (CPU AM82-BBMB)**, los valores de la Tabla 2 [F5]
    son:


    - AM-8200BB: **135 mA**

    - LIB-8200: **50 mA**

    - AM82-2S2C: **28 mA**

    - AM82-BST-C: **39 mA**


    **Paso 2 — Multiplica por las horas de espera**


    Total reposo (A) = Σ corrientes reposo × **24 h** (o **72 h** si aplica) → resultado
    en **Ah** [F4][F5]


    **Paso 3 — Determina la corriente en alarma**


    Valores de la Tabla 1 [F4] para **AM-8200 (CPU AM8200-KLCD)**:


    - AM-8200 CPU: **345 mA**

    - LIB-8200: **92 mA**

    - AM82-2S2C: **28 mA**

    - AM82-BST-C: **39 mA**

    - Dispositivos de lazo en alarma (la central activa **solo los primeros 6 LED**
    de detectores y módulos en alarma) [F6]

    - Corriente total de todos los lazos debe ser **inferior a 750 mA** [F6]


    Para la variante **AM-8200BB**, los valores de alarma [F5]:


    - AM-8200BB: **177 mA**

    - LIB-8200: **92 mA**

    - AM82-2S2C: **28 mA**

    - AM82-BST-C: **39 mA**


    **Paso 4 — Multiplica por 0,5 h**


    Total alarma (B) = Σ corrientes alarma × **0,5 h** → resultado en **Ah** [F4][F5]


    **Paso 5 — Aplica la fórmula final**


    > **Ah Batería = (A + B) × 1,2** [F4][F5][F6]


    ---


    ### Nota sobre la fuente de alimentación


    - Alimentación interna disponible: **4 A a 24 Vcc** [F1]

    - Corriente del alimentador: **3,5 A** (regulada para central y cargador) [F3]

    - Si la corriente calculada supera **3,5 A**, la corriente en exceso durante alarma
    se extrae de las baterías [F6]

    - Capacidad de baterías admitida: **2 × 12 V, mínimo 7 Ah, máximo 18 Ah** [F3]

    - Corriente de carga: **1 A** [F3]


    ---


    ### Baterías recomendadas por el fabricante [F3]


    - Yuasa **NP18-12B** o **NP7-12BFR** (UL94) — 12 V / 17,2 Ah — 181 × 77 × 167
    mm

    - Fiamm **FG21803** o **FGV21803** (UL94) — 12 V / 18 Ah — 181 × 77 × 167 mm


    > ⚠️ El manual indica consultar el **apéndice al final del manual** para el cálculo
    completo con las tablas de lazos (Tabla 3) [F2]. Las columnas de cantidad (C)
    y totales de la Tabla 1 y Tabla 2 deben rellenarse con los datos reales de la
    instalación.


    ---


    **Fuente:** AM-8200 Manual de Instalación — Doc. AM-8200-ESP Rev. A.3


    ---

    ⚠️ **Información adicional del manual:**

    - "4 La corriente en las condiciones de reposo o alarma no puede superar, en ningún
    caso, la capacidad de la fuente de alimentación." [F6]


    ---

    📖 **Obligaciones de evidencia del manual:**

    - "Calcular la corriente total necesaria para todos los lazos usando **la tabla
    2 (ver a continuación)** teniendo presente que la central enciende **solo los
    primeros 6 LED** de los detectores y módulos de entrada en alarma." (AM-8200 Manual
    Instalacion, p. 53) [F6]'
