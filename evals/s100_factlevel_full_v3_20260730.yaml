- qid: hp012
  question: ¿Cuántos lazos direccionables soporta la Notifier AM2020/AFP1010 y cuántos
    dispositivos por lazo?
  answer: "## Capacidad de lazos y dispositivos — AM2020 / AFP1010\n\n**La AM2020\
    \ soporta hasta 10 lazos SLC; la AFP1010 soporta un máximo de 4 lazos SLC (mediante\
    \ hasta dos LIB-400).**\n\n---\n\n### AM2020\n\n- **Número máximo de lazos SLC:**\
    \ 10 [F3][F5]\n- **Tarjetas de lazo admitidas:** de 1 a 5 LIB-400, o de 1 a 10\
    \ LIB-200 / LIB-200A (o combinación de ambas) [F5]\n- **Dispositivos por lazo:**\n\
    \  - Hasta **99 detectores analógicos** por lazo [F3][F5]\n  - Hasta **99 módulos**\
    \ (monitores o de control, en combinación) por lazo [F3][F5]\n  - Total por lazo:\
    \ hasta **198 puntos** (99 detectores + 99 módulos)\n\n---\n\n### AFP1010\n\n\
    - **Número máximo de lazos SLC:** 4 (máximo dos LIB-400, cada LIB-400 gestiona\
    \ 2 lazos) [F5]\n- **Total de dispositivos en el sistema:** máximo **396 dispositivos**\
    \ con dos LIB-200 [F1]\n  > Nota: el Fragmento 1 menciona específicamente \"dos\
    \ LIB-200 (un total de 396 dispositivos)\" para el AFP1010 [F1]. El Fragmento\
    \ 5 indica que el AFP1010 soporta un máximo de dos LIB-400 (cuatro SLCs) [F5].\
    \ Ambas referencias coexisten en los fragmentos; consulta el manual físico para\
    \ confirmar la configuración exacta según el tipo de tarjeta instalada.\n- **Dispositivos\
    \ por lazo:** igual que la AM2020 — hasta **99 detectores** y **99 módulos** por\
    \ lazo [F3][F5]\n\n---\n\n### Recordatorio sobre tarjetas LIB\n\n- **LIB-200 /\
    \ LIB-200A:** 1 lazo SLC por tarjeta [F5]\n- **LIB-400:** 2 lazos SLC por tarjeta\
    \ [F5]\n\n---\n\nFuentes: Manual MFDT280 (sin revisión registrada); Manual 15088SP\
    \ (sin revisión registrada); Manual MPDT280 (rev. Rev A)\n\n---\n\U0001F4D6 **Información\
    \ adicional del manual:**\n- \"Durante el estado de alarma de incendio, entre\
    \ 9 y 99 LEDs de equipos direccionables (detectores de humo, detectores de calor,\
    \ módulos MMX, etc.) puede estar permanentemente activados.\" [F3]\n\n---\n\U0001F4CB\
    \ **Obligaciones de evidencia del manual:**\n- Nota: la fuente es inconsistente:\
    \ \"La AM2020 puede soportar hasta 10 lazos, cada uno de los cuales soporta hasta\
    \ 99 detectores analógicos y 99 módulos monitores o de control.\" (MFDT280, p.\
    \ 4) [F3] declara 10 lazos y la enumeración servida lista 3 (MFDT280, p. 4) [F3].\n\
    - Nota: la fuente es inconsistente: \"La figura 13 representa un gabinete CAB-A3\
    \ utilizado con los módulos del LIB-400 exclusivamente, lo que significa que puede\
    \ dar alojo a un máximo de cuatro lazos del sistema AFP1010.\" (15088SP, p. 30)\
    \ [F7] declara 4 lazos y la enumeración servida lista 2 (15088SP, p. 30) [F7].\n\
    - Derivación declarada según (15088SP, p. 61) [F5]: 4 × (99 + 99) = 792 — operandos\
    \ citados: \"total de cuatro SLCs\", \"hasta 99 detectores\" y \"hasta 99 estaciones\"\
    ."
