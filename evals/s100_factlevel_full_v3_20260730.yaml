- qid: cat008
  question: ¿Cómo se cablea el módulo de entrada M710 / MI-DMMI en el lazo, y qué
    resistencias necesita (fin de línea y modo 3 estados)?
  answer: '## Conexionado del M710 / MI-DMMI en el lazo


    Los fragmentos confirman **dos modos de conexionado**: 2 estados y 3 estados.


    ---


    ### Terminales de lazo (comunes a ambos modos)


    - **T1** → Salida del lazo – [F7]

    - **T2** → Salida del lazo + *(con aislador de cortocircuito activo)* [F7]

    - **T3** → Entrada del lazo – [F7]

    - **T4** → Entrada del lazo + [F7]

    - **T5** → Salida del lazo + *(alternativa sin aislador)* [F7]


    > **Nota sobre el aislador interno:** Si **no** se necesita aislamiento de cortocircuitos,
    conecta la salida + del lazo al **terminal 5** en lugar del terminal 2. El terminal
    5 está conectado internamente con el terminal 4 [F7][F3].


    ---


    ### Modo 2 estados


    - Resistencia de fin de línea (RFL): **47 kΩ** [F1]

    - El **corto se señaliza como alarma** [F1]

    - No se requiere resistencia adicional en serie con el contacto


    ---


    ### Modo 3 estados


    - Resistencia de fin de línea (RFL): **47 kΩ** [F1]

    - Resistencia adicional en serie: **18 kΩ** conectada en serie con cada contacto/conmutador
    que se desee supervisar [F1][F7]

    - Referencia de la resistencia de 18 kΩ para el M710: **M200E-EOL-R18** [F8]

    - Con este modo, si el panel de control es compatible, un cortocircuito se señaliza
    como **avería** en lugar de alarma [F7][F3]


    ---


    ### Notas importantes


    - Los terminales **8 y 9** del MI-DMMI **no tienen conexión** — esos terminales
    son exclusivos del MI-DMM2I (versión de doble entrada) [F9]

    - Para la configuración del módulo en la central ID3000, consulta el artículo
    específico de programación de módulos de entrada [F1]


    ---


    > ⚠️ El conexionado detallado (topología exacta del circuito) aparece en los diagramas
    de figura de los manuales. Consulta la **Figura 3** del manual I56-2005-002 para
    el M710 [F7] y la **Figura 3** del manual I56-2006-004 para el MI-DMMI [F3].


    ---


    **Fuentes:**

    - Conexionado-del-modulo-M710-MI-DMMI (sin revisión registrada)

    - I56-2005-002 M710 M720 M721 M701 (sin revisión registrada)

    - I56-2006-004 MI-DMMI_DMM2I_D2ICMO (sin revisión registrada)


    ---

    📖 **Información adicional del manual:**

    - "1. Si no se necesita el aislamiento de cortocircuitos, se debe conectar la
    salida + del lazo al terminal 5 en vez de al terminal 2. El terminal 5 está conectado
    internamente con el terminal 4.

    2. El circuito con línea intermitente conectado a los terminales 8 y 9 se debe
    utilizar únicamente con el M720. El M710 no tiene conexiones con estos terminales.

    3. Si el panel de control lo permite, se podrá indicar un cortocircuito como avería
    en lugar de alarma. Para ello hay que conectar una resistencia de 18 KΩ (M200E-EOL-R18)
    en serie con cada equipo que se desee supervisar." [F7]

    - "1. En no se necesita el aislamiento de cortocircuitos, se debe conectar la
    salida + del lazo al terminal 5 en vez de al terminal 2. El terminal 5 está conectado
    internamente con el terminal 2.


    2. Si el panel de control lo permite, se podrá indicar un cortocircuito como puede
    el lugar de alarma. Para ello hay que conectar una resistencia de 18 kΩ en serie
    con cada conmutador de alarma. Para ello hay que conectar una resistencia de 18
    kΩ en serie con cada conmutador de alarma." [F3]'
