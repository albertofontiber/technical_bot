- qid: cat018
  question: ¿Como se programa una ecuacion causa-efecto (CBE) en la Notifier AM-8200
    para que un evento active una salida?
  answer: '# Programación de ecuación CBE en AM-8200 para activar una salida


    La CBE se programa en la **Pestaña Programación** del punto de salida (módulo
    de salida), en el campo **CBE** [F1]. A continuación el procedimiento completo:


    ---


    ## Paso 1 — Acceder al módulo de salida


    Navega hasta: **MENU PROGRAMMAZIONE \ Punti \ Módulos** [F6]


    Selecciona el módulo de salida que quieres activar.


    ---


    ## Paso 2 — Ir a la Pestaña Programación


    Dentro del módulo, selecciona la pestaña **Programmazione** [F6].


    Verás dos campos:

    - **Zona** → número de zona asociada

    - **CBE** → campo donde se introduce la ecuación


    ---


    ## Paso 3 — Editar el campo CBE


    1. Selecciona el campo **CBE** con las teclas flecha **▲▼** [F1]

    2. Pulsa la tecla de confirmación **☑** para entrar en edición [F1]

    3. Se abrirá el teclado alfanumérico con los operadores disponibles [F1]


    > **Importante:** La longitud máxima de una CBE es de **64 caracteres** [F1].


    ---


    ## Paso 4 — Escribir la ecuación


    Usa los operadores disponibles según la lógica que necesites [F8]:


    **OR** — Se activa la salida si **AL MENOS UN** operando está activo [F8]:

    - Ejemplo: `OR (G9 G15 G23)` → si cualquiera de los grupos G9, G15 o G23 está
    en alarma, la salida se activa

    - También válido omitir OR: `(G9 G15 G23)` [F8]


    **AND** — Se activa la salida solo si **TODOS** los operandos están activos [F8]:

    - Ejemplo: `AND (G9 G15 G23)` → solo si G9 Y G15 Y G23 están en alarma simultáneamente


    **NOT** — **Niega** el operando [F8]:

    - Ejemplo: `NOT (G23)` → la salida está activa mientras G23 NO esté en alarma


    **XGRP** — Se activa si **AL MENOS DOS** elementos del grupo indicado están activos
    [F9]:

    - Ejemplo: `XGRP (G23)`

    - Formato: `XGRP (GXXX)` donde GXXX = Grupo 1 ÷ 400 [F9]

    - **Atención:** No se permite `XGRP (G23 G24)` — solo admite un grupo [F9]


    ---


    ## Paso 5 — Confirmar la ecuación


    Pulsa la tecla **Enter** para confirmar la ecuación introducida [F1].


    ---


    ## Reglas críticas de programación


    **Para módulos de salida** [F8]:

    - Si el módulo tiene un **TIPO ID para señalizaciones generales**, la central
    **no permite** programar una ecuación CBE en él.

    - Sin CBE, un módulo de salida **no se activará nunca** salvo que tenga TIPO ID
    para señalizaciones generales.


    **Restricciones en grupos directos** [F8]:

    - No se permite: `G33 = (G23 G24)` → el grupo destino no puede tener índice **mayor**
    que los operandos

    - Sí se permite: `G21 = (G23 G24)`


    **Restricciones en grupos inversos** [F8]:

    - No se permite: `G305 = (G306 G307)` → el grupo destino no puede tener índice
    **menor** que los operandos

    - Sí se permite: `G307 = (G305 G306)`


    ---


    ## Ejemplo práctico completo [F10]


    Si necesitas un OR de 16 grupos pero la memoria no lo permite, usa grupos inversos
    intermedios:


    - `G301 = OR (G1 G2 G3 G4 G5 G6 G7 G8)`

    - `G302 = OR (G9 G10 G11 G12 G13 G14 G15 G16)`

    - `L01M01 = CBE = OR (G301 G302)`


    ---


    > Para la sintaxis completa de operadores y operandos, consulta el **Apéndice
    «A» Control By Event** al final del manual [F1].


    ---


    **Fuente:** AM-8200 Manual de programación — Doc. M-162.1-AM8200-ESP Rev A.3 —
    HONEYWELL LIFE SAFETY IBERIA


    ---

    📋 **Información adicional del manual:**

    - Nota: el manual también indica: "Si **CUALQUIERA** de los tres operandos de
    esta ecuación (G9 G15 G23) está en alarma, el módulo de salida se activará, es
    decir:" [F8] · "- **SI** el grupo software 9 está en alarma, o

    - **SI** el grupo software 15 está en alarma, o

    - **SI** el grupo software 23 está en alarma

    - **ENTONCES** este módulo de salida se activará." [F8]

    - "**Zona** - número de zona asignada


    **CBE** - ecuación CBE del punto." [F1]'
