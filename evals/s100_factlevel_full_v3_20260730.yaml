- qid: cat007
  question: En el detector por aspiración FAAST LT-200, ¿qué salidas de relé y de
    sirena tiene y con qué contactos, cómo se comporta el relé de avería ante un fallo
    o un corte de alimentación, qué resistencia de fin de línea llevan las salidas
    de sirena y cuál es la especificación eléctrica de los contactos de relé?
  answer: '## Salidas de relé y sirena del FAAST LT-200


    El FAAST LT-200 dispone de los siguientes relés y salidas de sirena, con sus contactos
    y comportamiento:


    ---


    ### Relés disponibles y sus contactos


    **Versión Stand-Alone (I56-6574-005_ES)** [F7]:


    - **Relé de alarma canal 1** (terminales 5-NC, 6-C, 7-NA)

    - **Relé de alarma canal 2** (terminales 8-NC, 9-C, 10-NA)

    - **Relé de avería canal 1** (terminales 11-NC, 12-C, 13-NA)

    - **Relé de avería canal 2 (AUX.)** (terminales 14-NC, 15-C, 16-NA)

    - **Relé de prealarma canal 1** (terminales 23-NC, 24-C, 25-NA)

    - **Relé de prealarma canal 2** (terminales 26-NC, 27-C, 28-NA)


    **Versión Loop (I56-6575-005_ES)** [F8]:


    - **Relé de alarma canal 1** (terminales 5-NC, 6-C, 7-NA)

    - **Relé de alarma canal 2** (terminales 8-NC, 9-C, 10-NA)

    - **Relé de avería canal 1** (terminales 11-NC, 12-C, 13-NA)

    - **Relé de avería canal 2 (AUX.)** (terminales 14-NC, 15-C, 16-NA)

    - *(No incluye relés de prealarma en esta versión)*


    Todos los relés exponen contacto **NC (normalmente cerrado), C (común) y NA (normalmente
    abierto)** [F7][F8].


    ---


    ### Comportamiento de los relés


    **Relé de alarma:**

    - Stand-Alone: se activa si se cumple la condición de alarma en el canal; estado
    enclavado por defecto, requiere rearme manual para desactivar [F3].

    - Loop/Notifier: controlado por el panel cuando determina la condición de alarma;
    encendido y apagado por el panel, **no enclavado** [F4].


    **Relé de prealarma (solo Stand-Alone):**

    - Se activa si se cumple la condición de prealarma en el canal; condición predeterminada
    = Nivel 1. Cuando prealarma = alarma = Nivel 1, la prealarma se activará al **70
    % del nivel 1** [F3].


    **Relé de avería:**

    - Se activa ante una condición de avería en el canal 1 o 2, o una avería común
    [F3][F4].

    - **También se activa en modo de servicio y cuando se desconecta la alimentación
    de la unidad** [F3][F4].

    - El estado de avería **no está enclavado** (predeterminado) [F3][F4].


    ---


    ### Salidas de sirena


    - **Sirena 1:** terminales 17 (–) y 18 (+), con **resistencia de fin de línea
    de 47 kΩ** [F7][F8].

    - **Sirena 2:** terminales 19 (–) y 20 (+), con **resistencia de fin de línea
    de 47 kΩ** [F7][F8].

    - Se activan cuando el canal correspondiente entra en **ALARMA** (sirena 1 → canal
    1; sirena 2 → canal 2) [F3][F4].

    - Estado predeterminado: establecido en ALARMA [F3][F4].


    ---


    ### Especificación eléctrica de los contactos de relé


    - Potencia nominal máxima: **2 A** con carga resistiva a **30 V CC** [F1][F2].

    - Potencia nominal máxima: **0,5 A** con carga resistiva a **30 V CA** [F1][F2].

    - Vida útil mínima: **10⁵ operaciones** [F1][F2].


    > ⚠️ **Nota:** Estos valores son para carga resistiva. El manual (versión EN)
    advierte sobre la conmutación de cargas inductivas e indica el uso de diodo de
    protección (referencia **1N6284CA**) en ese caso [F6]. Consulta los diagramas
    de circuito del documento I56-6577-006_EN para la configuración correcta con cargas
    inductivas.


    ---


    **Fuentes:**

    - I56-6574-005_ES — HS Stand Alone FAAST LT-200 QIG (sin revisión registrada)

    - I56-6575-005_ES — FAAST LT-200 Loop QIG (sin revisión registrada)

    - I56-6577-006_ES — FAAST Notifier LT-200 QIG (sin revisión registrada)

    - I56-6577-006_EN — Notifier FAAST LT-200 QIG (sin revisión registrada)'
