- qid: cat013
  question: Tengo una central Detnov CAD-150 y me ha sobrado de otra instalacion un
    detector optico Notifier SDX-751; ¿es compatible / puedo montarlo en su lazo?
  answer: '**No puedo confirmar compatibilidad entre la CAD-150 (Detnov) y el SDX-751
    (Notifier).**


    Los fragmentos disponibles no contienen documentación de la central **CAD-150**
    (solo de la **CAD-150-8**) ni ninguna lista de detectores compatibles con ella.
