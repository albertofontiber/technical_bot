- qid: hp011
  question: En la Morley RP1r, después de descargar la extinción el sistema no vuelve
    a estado normal tras resetear. ¿Qué comprobar?
  answer: '## RP1r-Supra: Sistema no vuelve a estado normal tras resetear después
    de extinción


    Hay varias causas posibles. Comprueba en este orden:


    ---


    ### 1. Inhibición de rearme activa (causa más probable)


    El parámetro **[r.i]** puede estar configurado para inhibir el rearme tras la
    extinción [F13]:


    - **Valor `- -`**: Rearme inhibido hasta que finalice la extinción **o** hasta
    que se agote el tiempo configurado en el parámetro **t.A** (t.A → 0 seg.) [F13].

    - **Valor `00`** (por defecto): Rearme permitido en cualquier momento [F13].

    - **Valores `01` a `30`**: Rearme inhibido durante el intervalo definido en minutos
    [F13].


    ➡️ Accede al modo de programación y verifica el valor del parámetro **[r.i]**.
    Si está en `- -` y el tiempo t.A no ha llegado a 0, la central no permitirá el
    rearme hasta entonces [F13].


    Adicionalmente, según la norma **UNE-EN 12094-1:2004, sección 4.12.2**, existe
    la posibilidad de inhibir temporalmente la función de rearme una vez la central
    ha entrado en modo ACTIVADO, configurable desde el modo de programación [F12].


    ---


    ### 2. Averías enclavadas pendientes de resolver


    **Todas las averías son por defecto enclavadas y requieren rearme manual** [F2].
    Si existe alguna condición de avería activa en los circuitos supervisados, la
    central no volverá a estado normal aunque se rearme. Comprueba los LEDs de avería:


    - **Led "Avería circuito extinción"** intermitente → fallo en CCT EXT 1 o CCT
    EXT 2 [F5]

    - **Led "Avería Disp. Manual" fijo** → fallo en entrada AUX. MAN.REL. [F5]

    - **Led "Avería en paro" intermitente + Led "Paro" fijo** → fallo en ABORT SWITCH
    — **este circuito requiere siempre rearme manual, no admite rearme automático**
    [F5]

    - **Led "Sirenas fallo/anuladas"** intermitente → fallo en SND1 o SND2 [F5]

    - **Leds de zona** (Z1, Z2, Z3) intermitentes → avería en zona correspondiente
    [F5]


    ➡️ Identifica qué LED está activo, resuelve la condición física que lo provoca
    y luego rearma.


    ---


    ### 3. Estado "Extinción Realizada" pendiente de limpiar


    Tras la descarga, el LED **"Extinción Realizada"** queda iluminado de forma **fija**
    y los circuitos de extinción se desactivan [F3]. Este estado persiste hasta que
    se realiza el rearme correctamente.


    Para rearmar: accede con **nivel de acceso 2** y pulsa la tecla **"Rearme"** [F2].
    Esta acción reinicia la central y restablece todas las entradas enclavadas [F2].


    ---


    ### 4. Pulsador ABORT accionado


    Si el pulsador de paro (ABORT) fue activado durante la secuencia, **por defecto
    inhibe totalmente la lógica de extinción y requiere reseteo manual** para reiniciar
    el proceso [F7]. Verifica que el pulsador ABORT no esté físicamente accionado
    o en fallo.


    ---


    **Resumen de comprobación en campo:**


    1. Verificar parámetro **[r.i]** y tiempo **t.A** en programación [F13]

    2. Revisar todos los LEDs de avería del panel [F5]

    3. Comprobar estado físico del pulsador **ABORT** [F7]

    4. Rearmar con **nivel 2** + tecla **"Rearme"** una vez resueltas las condiciones
    [F2]


    ---


    Fuentes:

    - Manual de usuario RP1r-Supra (HLSI-MN-103_RP1r-Supra_lr, rev. v.07, 2018-05-01)

    - Manual de usuario RP1r-Supra (HLSI-MN-103I_RP1r-Supra_lr, sin revisión registrada)

    - Guía Rápida RP1r-Supra (HLSI-MA-103_GuiaRapida_RP1r-Supra_ES_lr, sin revisión
    registrada)'
