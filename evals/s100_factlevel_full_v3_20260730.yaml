- qid: hp013
  question: ¿Cómo se cambia la batería tampón de la Detnov ADW535 sin perder configuración?
  answer: 'El procedimiento específico para cambiar la batería de litio del ADW535
    sin perder configuración **no está documentado en los fragmentos disponibles**.


    Lo que sí puedo confirmar a partir de los fragmentos:


    **Sobre la batería de litio:**

    - La batería de litio está ubicada en el **Main Board LMB 35** [F2][F3].

    - En la primera puesta en funcionamiento, se indica que "justo antes del primer
    encendido del ADW 535, debe retirarse la cinta aislante de la batería de litio
    (LMB 35)" [F6], lo que confirma que es accesible físicamente en esa placa.

    - Existe un parámetro de fallo monitorizable: **"Fallo batería de litio / reloj"**
    (configurable on/off) [F1].


    **Sobre la retención de configuración:**

    - Los parámetros específicos del sistema se almacenan en una **EEPROM** del ADW535
    [F11], lo que es independiente de la batería de litio.

    - El **reset de hardware** (interrupción de tensión de alimentación o pulsación
    del botón reset) mantiene los parámetros programados: *"Los parámetros del ADW
    535 programados con anterioridad se mantienen (configuraciones específicas del
    sistema)"* [F5].

    - Sin embargo, el **reset inicial** requiere reajustar todas las configuraciones
    específicas del cliente [F4].


    **Recomendación:**

    El manual no describe el procedimiento de sustitución de la batería de litio ni
    confirma explícitamente si su extracción provoca o no un reset inicial. Dado que
    el manual indica que solo personal autorizado y formado por el fabricante puede
    realizar trabajos de mantenimiento en el ADW535 [F4], **contacta directamente
    con Securiton/Detnov** para obtener el procedimiento oficial de sustitución de
    batería.


    ---

    Fuente: ADW535_TD_T140358es_e (sin revisión registrada)


    ---

    ⚠️ **Información adicional del manual:**

    - "Por ello, cuando se realicen trabajos de mantenimiento en el ADW 535, es imprescindible
    desconectar previamente los controles de incendios y las alertas remotas de los
    sistemas de orden superior (CDI)." [F5]

    - "Para evitar que los controles de incendios, las alertas remotas y las zonas
    de extinción se disparen al llevar a cabo los trabajos de mantenimiento, es **imprescindible**
    bloquearlos o desconectarlos previamente." [F4]'
