- qid: cat019
  question: '¿Como se configura una maniobra (causa-efecto) completa en la Detnov
    CAD-250: como se crea, como se definen las entradas/eventos que la disparan y
    como se asignan las salidas?'
  answer: "# Configuración de una maniobra completa en la CAD-250\n\nLa maniobra en\
    \ la CAD-250 es una relación causa-efecto: uno o varios **eventos** (entradas)\
    \ disparan una o varias **acciones** (salidas), con una lógica de coincidencias\
    \ configurable [F1].\n\n---\n\n## PASO 1 — Acceder al menú de maniobras\n\nNavega\
    \ por el panel táctil:\n\n**MENU → MANIOBRAS → +AÑADIR** [F1]\n\nEsto abre la\
    \ pantalla de edición de la maniobra. El contador muestra el número de maniobra\
    \ en curso [F4].\n\n---\n\n## PASO 2 — Definir el número de COINCIDENCIAS\n\n\
    Antes de añadir eventos, establece cuántos de ellos deben cumplirse para que la\
    \ acción se ejecute [F4]:\n\n- **Coincidencias = 1** → basta con que se cumpla\
    \ cualquiera de los eventos (lógica **OR**) [F4][F6]\n- **Coincidencias = 2**\
    \ (con 2 eventos) → deben cumplirse los dos (lógica **AND**) [F4][F6]\n- **Coincidencias\
    \ = N de M** → se deben cumplir N eventos cualesquiera de los M configurados [F4]\n\
    \n> El campo **Coincidencias** indica el número de entradas que deben ser verdaderas\
    \ para que se ordene la activación de las salidas [F6].\n\n---\n\n## PASO 3 —\
    \ Añadir EVENTOS (entradas)\n\n1. Pulsa **AÑADIR** en el margen inferior de la\
    \ pantalla [F2].\n2. En la pantalla emergente, selecciona **EVENTO** [F2].\n3.\
    \ Elige el tipo de evento [F2]:\n   - **ENTIDAD**: cualquier elemento de la jerarquía\
    \ del sistema (local o en red): instalación, panel, lazo, área, zona, dispositivo,\
    \ grupo o módulo virtual [F2].\n   - **CONDICIÓN TEMPORAL**: establece un periodo\
    \ de tiempo durante el cual la condición de entrada es verdadera [F2].\n\n4. Si\
    \ seleccionas **ENTIDAD**, accedes a la pantalla **EVENTO DE LA ENTIDAD** donde\
    \ configuras [F5]:\n\n   - **Origen:** Local o red [F5]\n   - **Entidad:** Instalación,\
    \ panel, lazo, área, zona, dispositivo, grupo o modo virtual [F5]\n   - **Condición:**\
    \ Alarma, avería, técnico [F5]\n   - **Tipo:** Todos, pulsador, detector o entradas\
    \ [F5]\n   - **Estado lógico:** Normal o Negado (si se selecciona Negado con condición\
    \ Alarma, la condición es válida si **no** hay alarma) [F5]\n   - **Repeticiones:**\
    \ Valor entero hasta **9999**; el evento debe repetirse ese número de veces en\
    \ la entidad para que la entrada sea válida [F2][F5]\n\n> ⚠ La configuración gestiona\
    \ **eventos** (cambios de estado), no estados estáticos. Solo el cambio de estado\
    \ que coincida con la condición establecida disparará las salidas [F2].\n\n> Desde\
    \ la versión **1.1.1** es posible seleccionar un elemento de salida como condición\
    \ de entrada; en ese caso, el cambio a condición de avería hace verdadera la entrada.\
    \ Para ello, desmarca la casilla **\"Sólo dispositivos de entrada\"** [F9].\n\n\
    Puedes añadir tantos eventos como necesites. El número máximo de entradas y salidas\
    \ entre todas las maniobras es de **100.000** [F2][F10].\n\n---\n\n## PASO 4 —\
    \ Añadir ACCIONES (salidas)\n\n1. Pulsa **AÑADIR** en el margen inferior de la\
    \ pantalla [F3].\n2. En la pantalla emergente, selecciona **ACCION** [F3].\n3.\
    \ Se presentan los campos [F3][F5]:\n\n   - **Retraso:** tiempo configurable entre\
    \ **0 y 600 segundos** antes de iniciar la acción [F3][F5].\n   - **Entidad (destino):**\
    \ panel, lazo, área, zona, dispositivo, grupo o modo virtual [F3][F5].\n\n   >\
    \ Las acciones siempre son relativas a la entidad seleccionada [F3]. El programa\
    \ no permite mezclar acciones sobre entidades de paneles diferentes [F10].\n\n\
    4. En la pantalla **ACCION DE LA ENTIDAD** configuras [F3][F7]:\n\n   **Acción\
    \ disponible:**\n   - **Activar** las salidas [F7]\n   - **Desactivar** las salidas\
    \ [F7]\n   - **Habilitar** la entidad [F7]\n   - **Deshabilitar** la entidad [F7]\n\
    \   - **Test**: pone en modo test la entidad [F7]\n   - **Reiniciar** la entidad\
    \ [F7]\n   - **Pulso**: activa las salidas con anchura de pulso configurable entre\
    \ **0 y 600 segundos** (10 s por defecto) [F7]\n   - **Configuración**: permite\
    \ la cancelación de retardos [F7]\n\n   **Tipo de elemento:**\n   - **Todos**:\
    \ todas las salidas de la entidad [F7]\n   - **Sirenas**: únicamente las sirenas\
    \ [F7]\n   - **Relés**: únicamente los relés [F7]\n   - **Sirena discontinua**:\
    \ sirenas en forma discontinua [F7]\n   - **Sirena PCB1**: sirena 1 de la central\
    \ [F7]\n   - **Sirena PCB2**: sirena 2 de la central [F7]\n\n   > Las opciones\
    \ disponibles dependen de la entidad seleccionada. Consulta la tabla de compatibilidad\
    \ Tipo/Entidad del manual [F8].\n\n   Resumen de compatibilidades Acción ↔ Entidad\
    \ [F8]:\n   - **ACTIVAR Todos:** Panel, Lazo, Área, Zona, Disp.OUT, Grupo, VM\n\
    \   - **ACTIVAR Sirenas:** Panel, Lazo, Área, Zona, Grupo\n   - **ACTIVAR Relés:**\
    \ Panel, Lazo, Área, Zona, Grupo\n   - **ACTIVAR Sirenas dis:** Panel, Lazo, Área,\
    \ Zona, Grupo\n   - **ACTIVAR Sirena 1 / Sirena 2:** solo Panel\n   - **DESACTIVAR\
    \ Todos:** Panel, Lazo, Área, Zona, Disp.OUT, Grupo, VM\n   - **DESACTIVAR Sirenas\
    \ / Relés:** Panel, Lazo, Área, Zona, Grupo\n   - **PULSO:** Panel, Lazo, Área,\
    \ Zona, Disp.OUT, Grupo, VM\n   - **HABILITAR / DESHABILITAR:** Panel, Área, Zona,\
    \ Disp.OUT, Disp.IN, Grupo, VM\n   - **TEST:** Panel, Área, Zona\n   - **PROGRAMACIÓN\
    \ (Cancelar retardo):** solo Panel\n\n---\n\n## PASO 5 — Guardar la maniobra\n\
    \nPulsa **GUARDAR** para actualizar la base de datos [F7].\n\nPulsa **CANCELAR**\
    \ para deshacer los cambios propuestos [F7].\n\n---\n\n## Elementos adicionales\
    \ del módulo de maniobras\n\n- **Grupos** [F1]: permiten asociar elementos (áreas,\
    \ zonas, dispositivos) para facilitar la creación de reglas de actuación.\n- **Módulos\
    \ virtuales** [F1]: permiten crear bucles interdependientes. Un conjunto de entradas\
    \ determina el estado del módulo virtual, que a su vez puede actuar como entrada\
    \ de otra maniobra.\n- **Estado VM** [F1]: permite visualizar el estado de los\
    \ módulos virtuales, activarlos o usarlos como botones de acceso rápido desde\
    \ la pantalla principal.\n\n---\n\n> ⚠ **Advertencia:** La programación de maniobras\
    \ es una de las funciones más críticas de la configuración del sistema de detección\
    \ y alarma de incendio. Requiere conocimiento específico del sistema instalado,\
    \ del plan de protección y del producto [F5].\n\n---\n\n**Fuentes:**\n- CAD-250\
    \ Manual de Configuración MC-380-es-2026-c (rev. c, 2026-04-23)\n- CAD-250 Manual\
    \ de Software de Configuración MS-416-es-2026-b (rev. b)\n\n---\n\U0001F4D6 **Información\
    \ adicional del manual:**\n- \"Screenshot 1: Shows the main interface with \"\
    Panel 12 08:08 - viernes, 19 de abril de 2019\" at top, displaying \"Maniobra\
    \ 0001\" with \"Borrar maniobra\" button and \"MANIOBRAS\" section. Left sidebar\
    \ shows menu items: LAZO, SECTORIZACION, MANIOBRAS, LOGS, RED, AJUSTES, INSTALACION.\
    \ The main area shows \"Coincidencias: Eventos\" and \"Acciones\" tabs with a\
